name: Post-merge Branch Cleanup

on:
  push:
    branches:
      - archive/branch-snapshot-2026-09-15
    paths:
      - '.github/workflows/branch-postmerge-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-task-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete exact squash-merged task branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 20e6989486bd27c9331a8f5dd55acc6f2b0a3d2b
          TARGET_BRANCH: docs/code-consistency-pkk-freeze-001
          EXPECTED_TARGET: d9512bf0abac651e5d68ee335bb39e72c525e0c5
          PR_NUMBER: "120"
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          target_sha="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$main_sha" = "$EXPECTED_MAIN"
          test "$target_sha" = "$EXPECTED_TARGET"

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg expected_head "$EXPECTED_TARGET" \
            --arg expected_merge "$EXPECTED_MAIN" \
            '.merged == true
             and .head.sha == $expected_head
             and .base.ref == "main"
             and .merge_commit_sha == $expected_merge' \
            <<<"$pr_json" >/dev/null

          git push origin --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET" :"refs/heads/$TARGET_BRANCH"

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target branch still exists."
            exit 1
          fi

          echo "POST_MERGE_BRANCH_CLEANUP=PASS"
