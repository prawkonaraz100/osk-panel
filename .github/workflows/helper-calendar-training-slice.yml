name: Helper Pint Probe

on:
  push:
    branches:
      - tmp-core-v1-calendar-pint-probe-20260911

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Canonical Pint formatting diff
        run: |
          vendor/bin/pint
          git diff -- app/Modules/CalendarTraining tests/Feature/TrainingSessionCoreTest.php
