name: helper-db-mig-002-central-gate-v2

on:
  push:
    branches:
      - helper-db-mig-002-central-gate-v2

permissions:
  contents: write

jobs:
  patch-central-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helper-db-mig-002-central-gate-v2
          fetch-depth: 0

      - name: Apply exact DB-MIG-002 central gate patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('specs/gates/stage-4-database-contract-gate.yml')
          text = p.read_text()
          original = text

          def replace_once_in(section, old, new, label):
              count = section.count(old)
              assert count == 1, f'{label}: expected exactly 1 match, got {count}'
              return section.replace(old, new, 1)

          # Current DB4_11 slice counters only.
          marker = '  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX\n'
          assert text.count(marker) == 1
          start = text.index(marker)
          end = text.index('\nquality_checks:\n', start)
          sec = text[start:end]
          sec = replace_once_in(sec, '    status: FAIL_WITH_5_P1_BLOCKERS\n', '    status: FAIL_WITH_4_P1_BLOCKERS\n', 'DB4_11 slice status')
          sec = replace_once_in(sec, '    blockers_resolved: 1\n', '    blockers_resolved: 2\n', 'DB4_11 resolved count')
          sec = replace_once_in(sec, '    open_P0_P1: 5\n', '    open_P0_P1: 4\n', 'DB4_11 open count')
          sec = replace_once_in(sec, '    result: FAIL_WITH_5_P1_BLOCKERS\n', '    result: FAIL_WITH_4_P1_BLOCKERS\n', 'DB4_11 slice result')
          text = text[:start] + sec + text[end:]

          # Add current DB-MIG-002 quality gate immediately before resolved_blockers.
          insert_marker = '\nresolved_blockers:\n'
          assert text.count(insert_marker) == 1
          mig002_lines = [
              '  DB4_11_DB_MIG_002:',
              '    status: PASS',
              '    resolved_blocker_id: DB-MIG-002',
              '    machine_source: specs/database/final-migration-order-invariant-matrix.yml',
              '    narrative_source: docs/116-stage-4-final-migration-order-invariant-matrix-audit.md',
              '    machine_commit: 6769f0fe003c76440ef1992a37de948e7524af00',
              '    machine_blob: 1df9476a116677b07f8f1725c765c09c044d4aac',
              '    narrative_commit: 1252a6fa2208d7924ef0bd26727edac8ef054428',
              '    narrative_blob: 71f84a7581f8fe2a7fdbb3747cefffb1e1954faf',
              '    aggregate_core_schema_blob_frozen: 39958721c99550cfc27c3774e8dfa1af0d0637e6',
              '    aggregate_docs87_blob_frozen: 6c090b082604b6b42c283667fcf08e9033a5b523',
              '    checks:',
              '      dependency_order_remains_DB_MIG_001_DAG_authority: PASS',
              '      seven_phase_order_expand_preflight_write_fence_backfill_reconcile_validate_contract_defined: PASS',
              '      every_DAG_node_has_nonempty_phase_path: PASS',
              '      all_DAG_node_types_have_default_or_exact_mapping: PASS',
              '      zero_unmapped_nodes_unknown_phases_or_phase_order_violations: PASS',
              '      DB_MIG_001_topological_order_not_rewritten: PASS',
              '      new_write_fence_precedes_legacy_backfill: PASS',
              '      exact_evidence_only_backfill_and_reconciliation_preserved: PASS',
              '      validation_requires_zero_unresolved_required_cases: PASS',
              '      foreign_key_and_check_NOT_VALID_strategy_scoped_to_supported_mechanisms: PASS',
              '      unique_NOT_VALID_false_claim_forbidden: PASS',
              '      exclusion_NOT_VALID_false_claim_forbidden: PASS',
              '      DB_MIG_003_cutover_restart_failure_rollback_not_solved_early: PASS',
              '      DB_TST_001_and_DB_TST_002_not_solved_early: PASS',
              '      DB_FINAL_001_aggregate_sync_not_solved_early: PASS',
              '      core_schema_modified_in_DB_MIG_002: false',
              '      docs87_modified_in_DB_MIG_002: false',
              '      Laravel_migrations_created: false',
              '      Stage5_started: false',
              '      UI_or_feature_implementation_started: false',
              '',
          ]
          mig002 = '\n'.join(mig002_lines) + '\n'
          text = text.replace(insert_marker, '\n' + mig002 + 'resolved_blockers:\n', 1)

          # Update resolved list only.
          r_start = text.index('\nresolved_blockers:\n')
          r_end = text.index('\nopen_blockers_current_diagnosed_scope:\n', r_start)
          resolved = text[r_start:r_end]
          assert resolved.count('  - DB-MIG-001\n') == 1
          assert '  - DB-MIG-002\n' not in resolved
          resolved = resolved.replace('  - DB-MIG-001\n', '  - DB-MIG-001\n  - DB-MIG-002\n', 1)
          text = text[:r_start] + resolved + text[r_end:]

          # Update current open list only; historical diagnosis order remains untouched.
          o_start = text.index('\nopen_blockers_current_diagnosed_scope:\n')
          o_end = text.index('\ngate_definition:\n', o_start)
          opened = text[o_start:o_end]
          expected_open = [
              '  - DB-MIG-002\n',
              '  - DB-MIG-003\n',
              '  - DB-TST-001\n',
              '  - DB-TST-002\n',
              '  - DB-FINAL-001\n',
          ]
          for item in expected_open:
              assert opened.count(item) == 1, f'open list missing/duplicate: {item!r}'
          opened = opened.replace('  - DB-MIG-002\n', '', 1)
          text = text[:o_start] + opened + text[o_end:]

          # Current aggregate gate result only.
          g_start = text.index('\ngate_definition:\n')
          g_end = text.index('\nnext_single_step:\n', g_start)
          gate = text[g_start:g_end]
          gate = replace_once_in(gate, '  current_result: DB4_11_FAIL_WITH_5_P1_BLOCKERS\n', '  current_result: DB4_11_FAIL_WITH_4_P1_BLOCKERS\n', 'current_result')
          gate = replace_once_in(gate, '  DB4_11_DB_MIG_002_result: OPEN\n', '  DB4_11_DB_MIG_002_result: PASS\n', 'DB-MIG-002 result')
          gate = replace_once_in(gate, '  DB4_11_result: FAIL_WITH_5_P1_BLOCKERS\n', '  DB4_11_result: FAIL_WITH_4_P1_BLOCKERS\n', 'DB4_11 result')
          text = text[:g_start] + gate + text[g_end:]

          # Advance only the next-single-step pointer; do not solve DB-MIG-003.
          n_start = text.index('\nnext_single_step:\n')
          nxt = text[n_start:]
          nxt = replace_once_in(nxt, '  id: DB-MIG-002\n', '  id: DB-MIG-003\n', 'next id')
          nxt = replace_once_in(nxt, '  action: resolve_DB_MIG_002_only_after_next_explicit_user_instruction\n', '  action: resolve_DB_MIG_003_only_after_next_explicit_user_instruction\n', 'next action')
          nxt = replace_once_in(nxt, '    DB-MIG-001 is PASS. Resolve DB-MIG-002 only. Preserve DB-MIG-003, DB-TST-001,\n', '    DB-MIG-001 and DB-MIG-002 are PASS. Resolve DB-MIG-003 only. Preserve DB-TST-001,\n', 'next scope lock')
          nxt = replace_once_in(nxt, '  after_action: run_DB_MIG_002_machine_narrative_central_gate_and_STOP_before_DB_MIG_003\n', '  after_action: run_DB_MIG_003_machine_narrative_central_gate_and_STOP_before_DB_TST_001\n', 'next after_action')
          text = text[:n_start] + nxt

          # Preservation and scope assertions.
          assert text != original
          assert '  DB4_11_diagnosis:\n    status: FAIL_WITH_6_P1_BLOCKERS\n' in text
          assert '  course_lifecycle_stage_history_cancel_restore:\n' in text
          assert '  DB4_8_final_aggregate_sync:\n' in text
          assert '  DB4_10_final_aggregate_sync:\n' in text
          assert text.count('  DB4_11_DB_MIG_002:\n') == 1
          assert text.count('  DB4_11_DB_MIG_002_result: PASS\n') == 1
          assert '  DB4_11_DB_MIG_003_result: OPEN\n' in text
          assert '  DB4_11_DB_TST_001_result: OPEN\n' in text
          assert '  DB4_11_DB_TST_002_result: OPEN\n' in text
          assert '  DB4_11_DB_FINAL_001_result: OPEN\n' in text
          assert len(text.splitlines()) > 4300

          p.write_text(text)
          PY

      - name: Remove helper workflow and validate net diff
        shell: bash
        run: |
          rm .github/workflows/helper-db-mig-002-central-gate-v2.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/helper-db-mig-002-central-gate-v2.yml\nspecs/gates/stage-4-database-contract-gate.yml'
          git diff --stat

      - name: Commit helper result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DB-MIG-002: close central database contract gate"
          git push origin HEAD:helper-db-mig-002-central-gate-v2
