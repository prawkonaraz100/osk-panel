name: Helper format ResourcesCore

on:
  push:
    branches:
      - tmp-core-v1-loc-staff-veh-001-20260911

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-core-v1-loc-staff-veh-001-20260911
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Format PHP
        run: |
          vendor/bin/pint app/Modules/ResourcesCore tests/Support/FoundationSchema.php database/seeders/ResourceReferenceCatalogSeeder.php database/seeders/DatabaseSeeder.php app/Modules/AuditNotification/AtomicAuditOutbox.php routes/web.php
      - name: Format Vue and TypeScript
        run: npx eslint resources/js/modules/ResourcesCore resources/js/App.vue --fix
      - name: Normalize migration filenames to canonical order
        run: |
          find database/migrations/stage4/expand -type f -name '2026_09_11_*.php' -print0 | while IFS= read -r -d '' file; do
            target="${file/2026_09_11_/2026_09_10_}"
            mv "$file" "$target"
          done
      - name: Repair migration registry with runtime SHA-256
        run: |
          cat > /tmp/repair_registry.php <<'PHP'
          <?php
          $path = 'database/migration-plan/implementations.json';
          $impl = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $oldIdentity = (string) $impl['execution_identity'];

          foreach ($impl['implemented_steps'] as &$step) {
              $file = (string) $step['migration_file'];
              if (str_contains($file, '/2026_09_11_')) {
                  $file = str_replace('/2026_09_11_', '/2026_09_10_', $file);
                  $step['migration_file'] = $file;
                  $step['migration_name'] = pathinfo($file, PATHINFO_FILENAME);
              }
              $hash = hash_file('sha256', $file);
              if (! is_string($hash)) {
                  throw new RuntimeException("Cannot hash {$file}");
              }
              $step['file_sha256'] = $hash;
          }
          unset($step);

          $lines = [
              'schema_version|'.$impl['schema_version'],
              'plan_identity|'.$impl['plan_identity'],
              'stage4_root|'.$impl['stage4_root'],
          ];
          foreach ($impl['implemented_steps'] as $step) {
              $lines[] = implode('|', [
                  'step',
                  $step['node_id'],
                  $step['phase'],
                  $step['migration_file'],
                  $step['migration_name'],
                  $step['file_sha256'],
                  $step['restart_classification'],
                  $step['safe_down'] ? '1' : '0',
              ]);
          }
          $newIdentity = hash('sha256', implode("\n", $lines)."\n");
          $impl['execution_identity'] = $newIdentity;
          file_put_contents($path, json_encode($impl, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);

          $testPath = 'tests/Unit/MigrationPlanContractTest.php';
          $test = (string) file_get_contents($testPath);
          $needle = "'".$oldIdentity."', \$plan->executionIdentity()";
          $replacement = "'".$newIdentity."', \$plan->executionIdentity()";
          if (! str_contains($test, $needle)) {
              throw new RuntimeException('MigrationPlanContractTest execution identity anchor not found.');
          }
          file_put_contents($testPath, str_replace($needle, $replacement, $test));

          fwrite(STDOUT, "EXECUTION_IDENTITY={$newIdentity}\n");
          PHP
          php /tmp/repair_registry.php
          vendor/bin/pint tests/Unit/MigrationPlanContractTest.php
          php artisan migration:plan:validate --json
      - name: Commit formatter and registry output
        run: |
          git config user.name "stage5-helper"
          git config user.email "stage5-helper@users.noreply.github.com"
          git add             app/Modules/ResourcesCore             app/Modules/AuditNotification/AtomicAuditOutbox.php             database/seeders/DatabaseSeeder.php             database/seeders/ResourceReferenceCatalogSeeder.php             database/migration-plan/implementations.json             resources/js/App.vue             resources/js/modules/ResourcesCore             routes/web.php             tests/Support/FoundationSchema.php             tests/Unit/MigrationPlanContractTest.php
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
          else
            git commit -m "CORE-V1-LOC-STAFF-VEH-001: normalize implementation quality"
            git push origin HEAD:tmp-core-v1-loc-staff-veh-001-20260911
          fi
