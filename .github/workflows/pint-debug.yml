name: Pint Debug
on:
  push:
    branches:
      - tmp-debug-pint-commerce-controller-20260912
permissions:
  contents: read
jobs:
  pint-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Show Pint diff
        run: |
          vendor/bin/pint app/Modules/CommerceDashboard/CommerceDashboardController.php
          git diff -- app/Modules/CommerceDashboard/CommerceDashboardController.php
