name: Pint Probe

on:
  pull_request:

jobs:
  pint-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint locally in runner
        run: vendor/bin/pint app/Modules/FormalDocuments tests/Feature/FormalTrainingDocumentRuntimeTest.php
      - name: Show exact Pint patch
        run: |
          git diff -- app/Modules/FormalDocuments tests/Feature/FormalTrainingDocumentRuntimeTest.php
          test -z "$(git status --porcelain -- app/Modules/FormalDocuments tests/Feature/FormalTrainingDocumentRuntimeTest.php)"
