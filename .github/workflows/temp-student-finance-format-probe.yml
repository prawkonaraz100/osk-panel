name: TEMP Student Finance Format Probe

on:
  push:
    branches:
      - tmp-core-v1-student-finance-001-20260911

permissions:
  contents: read

jobs:
  pint-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Show exact Pint patch
        run: |
          vendor/bin/pint app/Modules/StudentFinance/StudentFinanceController.php app/Modules/StudentFinance/StudentFinanceService.php routes/web.php tests/Feature/StudentFinanceCoreTest.php
          git diff -- app/Modules/StudentFinance/StudentFinanceController.php app/Modules/StudentFinance/StudentFinanceService.php routes/web.php tests/Feature/StudentFinanceCoreTest.php
