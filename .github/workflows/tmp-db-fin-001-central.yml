name: Temporary DB-FIN-001 Central Gate

on:
  push:
    branches: [tmp-db-fin-001-central-helper]
    paths:
      - '.stage4-tmp/TRIGGER_DB_FIN_001_CENTRAL'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-fin-001-central-helper
      - name: Patch and validate DB-FIN-001 central gate only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, copy
          p=Path('specs/gates/stage-4-database-contract-gate.yml')
          s=p.read_text()
          before=yaml.safe_load(s)
          quality_before=copy.deepcopy(before['quality_checks'])
          resolved_before=copy.deepcopy(before['resolved_blockers'])

          old_slice='''  - id: DB4_9_STUDENT_FINANCE_COMMERCE\n    status: FAIL_WITH_10_P1_BLOCKERS\n    diagnosis: COMPLETE\n    blockers_diagnosed: 10\n    blockers_resolved: 0\n    open_P0_P1: 10\n    final_aggregate_sync: NOT_STARTED\n    result: FAIL_WITH_10_P1_BLOCKERS\n'''
          new_slice='''  - id: DB4_9_STUDENT_FINANCE_COMMERCE\n    status: FAIL_WITH_9_P1_BLOCKERS\n    diagnosis: COMPLETE\n    blockers_diagnosed: 10\n    blockers_resolved: 1\n    open_P0_P1: 9\n    final_aggregate_sync: NOT_STARTED\n    result: FAIL_WITH_9_P1_BLOCKERS\n'''
          assert s.count(old_slice)==1; s=s.replace(old_slice,new_slice,1)

          marker='\nresolved_blockers:\n'
          assert s.count(marker)==1
          assert '\n  student_finance_exact_charge_payment_course_integrity:\n' not in s
          block='''\n  student_finance_exact_charge_payment_course_integrity:\n    status: PASS\n    resolved_blocker_id: DB-FIN-001\n    severity: P1\n    machine_source: specs/database/student-finance-commerce.yml\n    narrative_source: docs/114-stage-4-student-finance-commerce-audit.md\n    machine_commit: f92f910b19b9c367430e5fb8e4eb3181c23801df\n    machine_blob: ea786013f7931fb086734d2a1060f69dce6f312d\n    narrative_commit: c8d54fdd930a718a600c08d5b42078be89659874\n    narrative_blob: 6cf2e16c25b79e8122a341b582a45640bce7ad04\n    decision:\n      course_enrollments_exact_student_candidate_key: [organization_id, id, student_id]\n      student_charges_exact_payment_target_candidate_key: [organization_id, id, student_id, currency]\n      charge_student_FK: [organization_id, student_id]\n      charge_optional_course_exact_student_FK: [organization_id, course_enrollment_id, student_id]\n      payment_student_FK: [organization_id, student_id]\n      payment_exact_charge_student_currency_FK: [organization_id, charge_id, student_id, currency]\n      optional_course_uses_MATCH_SIMPLE: true\n      formal_finance_relations_on_update: RESTRICT\n      formal_finance_relations_on_delete: RESTRICT\n      global_user_actor_fake_tenant_FK: forbidden\n      legacy_mismatch_auto_reparent_or_currency_rewrite: forbidden\n    checks:\n      same_tenant_Charge_Student_boundary: PASS\n      optional_Course_belongs_to_exact_Charge_Student: PASS\n      Payment_belongs_to_exact_Charge_Student_and_currency: PASS\n      global_User_identity_not_fake_tenant_scoped: PASS\n      DB_FIN_002_remains_open: PASS\n      DB_COM_001_through_DB_COM_008_remain_open: PASS\n      aggregate_core_schema_modified: false\n      aggregate_docs87_modified: false\n      DB4_10_or_later_entered: false\n      Stage5_started: false\n      Laravel_migrations_created: false\n      UI_or_feature_implementation_started: false\n'''
          s=s.replace(marker,block+marker,1)

          anchor='  - DB-PKK-008\n\nopen_blockers_current_diagnosed_scope:\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,'  - DB-PKK-008\n  - DB-FIN-001\n\nopen_blockers_current_diagnosed_scope:\n',1)
          assert s.count('open_blockers_current_diagnosed_scope:\n  - DB-FIN-001\n  - DB-FIN-002\n')==1
          s=s.replace('open_blockers_current_diagnosed_scope:\n  - DB-FIN-001\n  - DB-FIN-002\n','open_blockers_current_diagnosed_scope:\n  - DB-FIN-002\n',1)

          assert s.count('  current_result: DB4_9_FAIL_WITH_10_P1_BLOCKERS\n')==1
          s=s.replace('  current_result: DB4_9_FAIL_WITH_10_P1_BLOCKERS\n','  current_result: DB4_9_FAIL_WITH_9_P1_BLOCKERS\n',1)
          old_result='''  DB4_9_diagnosis_result: PASS_DIAGNOSIS_COMPLETE\n  DB4_9_result: FAIL_WITH_10_P1_BLOCKERS\n'''
          new_result='''  DB4_9_diagnosis_result: PASS_DIAGNOSIS_COMPLETE\n  DB4_9_DB_FIN_001_result: PASS\n  DB4_9_result: FAIL_WITH_9_P1_BLOCKERS\n'''
          assert s.count(old_result)==1; s=s.replace(old_result,new_result,1)

          assert s.count('  id: DB_FIN_001_SAME_TENANT_EXACT_CHARGE_PAYMENT_COURSE_INTEGRITY\n')==1
          s=s.replace('  id: DB_FIN_001_SAME_TENANT_EXACT_CHARGE_PAYMENT_COURSE_INTEGRITY\n','  id: DB_FIN_002_CHARGE_PAYMENT_REVERSAL_LIFECYCLE_BALANCE_OVERPAYMENT_AND_CONCURRENCY\n',1)
          assert s.count('  action: resolve_DB_FIN_001_only_after_next_explicit_user_instruction\n')==1
          s=s.replace('  action: resolve_DB_FIN_001_only_after_next_explicit_user_instruction\n','  action: resolve_DB_FIN_002_only_after_next_explicit_user_instruction\n',1)
          old_scope='''  scope_lock: >-\n    Resolve DB-FIN-001 only. Preserve all other nine DB4_9 blockers as OPEN.\n    Do not enter DB-FIN-002, DB4_10, Stage 5, Laravel migrations or UI in the same step.\n  after_action: rerun_DB_FIN_001_machine_narrative_central_gate_and_STOP_before_DB_FIN_002\n'''
          new_scope='''  scope_lock: >-\n    Resolve DB-FIN-002 only. Preserve DB-COM-001 through DB-COM-008 as OPEN.\n    Do not enter DB-COM-001, DB4_10, Stage 5, Laravel migrations or UI in the same step.\n  after_action: rerun_DB_FIN_002_machine_narrative_central_gate_and_STOP_before_DB_COM_001\n'''
          assert s.count(old_scope)==1; s=s.replace(old_scope,new_scope,1)

          p.write_text(s)
          after=yaml.safe_load(s)
          qa=copy.deepcopy(after['quality_checks']); newq=qa.pop('student_finance_exact_charge_payment_course_integrity')
          assert qa==quality_before
          assert newq['status']=='PASS'
          slices={x['id']:x for x in after['stage_4_slices']}
          assert slices['DB4_9_STUDENT_FINANCE_COMMERCE']['blockers_resolved']==1
          assert slices['DB4_9_STUDENT_FINANCE_COMMERCE']['open_P0_P1']==9
          assert slices['DB4_10_AUDIT_OUTBOX_NOTIFICATIONS']['status']=='NOT_STARTED'
          assert after['resolved_blockers']==resolved_before+['DB-FIN-001']
          assert after['open_blockers_current_diagnosed_scope']==['DB-FIN-002','DB-COM-001','DB-COM-002','DB-COM-003','DB-COM-004','DB-COM-007','DB-COM-005','DB-COM-008','DB-COM-006']
          assert after['gate_definition']['current_result']=='DB4_9_FAIL_WITH_9_P1_BLOCKERS'
          assert after['gate_definition']['DB4_9_DB_FIN_001_result']=='PASS'
          assert after['gate_definition']['DB4_9_result']=='FAIL_WITH_9_P1_BLOCKERS'
          assert after['gate_definition']['may_start_DB4_9_fixes'] is True
          assert after['next_single_step']['id']=='DB_FIN_002_CHARGE_PAYMENT_REVERSAL_LIFECYCLE_BALANCE_OVERPAYMENT_AND_CONCURRENCY'
          PY
          test "$(git hash-object specs/database/core-schema.yml)" = "65c6daab0330a2c6cf57a6a2caaba288a13a7a70"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "4d5f24f2948bdb55e7367c7b013ed918dade40ae"
          test "$(git hash-object specs/database/student-finance-commerce.yml)" = "ea786013f7931fb086734d2a1060f69dce6f312d"
          test "$(git hash-object docs/114-stage-4-student-finance-commerce-audit.md)" = "6cf2e16c25b79e8122a341b582a45640bce7ad04"
          git diff --check -- specs/gates/stage-4-database-contract-gate.yml
          test "$(git diff --name-only | grep -v '^\.github/workflows/tmp-db-fin-001-central.yml$' | grep -v '^\.stage4-tmp/' | sort -u)" = "specs/gates/stage-4-database-contract-gate.yml"
          git config user.name 'prawkonaraz100'
          git config user.email 'prawkonaraz100@gmail.com'
          git add specs/gates/stage-4-database-contract-gate.yml
          git commit -m 'DB-FIN-001: close central database contract gate'
          git push origin HEAD:tmp-db-fin-001-central-helper
