  contents: write
jobs:
  validate-central:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-final-001-central-validation-20260910
          fetch-depth: 0
      - name: Assert final machine narrative inputs and patch central gate only
        shell: bash
        run: |
          set -euo pipefail
          BASE=f8a77d3d05c844ce08bc8010e598c3e39e637046
          test "$(git rev-parse ${BASE}:specs/database/core-schema.yml)" = b0629cc48e26798d945356eaa1d0c9b1187aa542
          test "$(git rev-parse ${BASE}:specs/database/final-migration-order-invariant-matrix.yml)" = ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441
          test "$(git rev-parse ${BASE}:docs/87-physical-database-schema.md)" = a48eacd92d4a9c8e989f5d70c3bec95b9231a77c
          test "$(git rev-parse ${BASE}:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 6f76255742d4902546f45c28d54c1da6ee3d3fd7
          test "$(git rev-parse ${BASE}:specs/gates/stage-4-database-contract-gate.yml)" = d3c94ea818637bedd06234c9c1b2b2629fc0252c
          python3 <<'PY'
          from pathlib import Path
          p=Path('specs/gates/stage-4-database-contract-gate.yml'); s=p.read_text()
          def rep(old,new):
              global s
              assert s.count(old)==1,(s.count(old),old[:180])
              s=s.replace(old,new,1)
          rep('  status: IN_PROGRESS\n  started_at: 2026-09-05\n','  status: PASS\n  started_at: 2026-09-05\n',1) if False else None
          # explicit first top-level status only
          old='''meta:\n  project: osk-panel\n  stage: 4\n  name: database_invariants_and_migration_design_gate\n  branch: docs-consolidation-2026-09-05\n  status: IN_PROGRESS\n'''
          new='''meta:\n  project: osk-panel\n  stage: 4\n  name: database_invariants_and_migration_design_gate\n  branch: docs-consolidation-2026-09-05\n  status: PASS\n'''
          rep(old,new)
          rep('''  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX\n    status: FAIL_WITH_1_P1_BLOCKER\n    diagnosis: COMPLETE\n    blockers_diagnosed: 6\n    blockers_resolved: 5\n    open_P0_P1: 1\n    result: FAIL_WITH_1_P1_BLOCKER\n''','''  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX\n    status: PASS\n    diagnosis: COMPLETE\n    blockers_diagnosed: 6\n    blockers_resolved: 6\n    open_P0_P1: 0\n    final_aggregate_sync: PASS\n    result: PASS\n''')
          marker='\nresolved_blockers:\n'; assert s.count(marker)==1
          block='''\n  DB4_11_DB_FINAL_001:\n    status: PASS\n    resolved_blocker_id: DB-FINAL-001\n    machine_aggregate_source: specs/database/core-schema.yml\n    machine_matrix_source: specs/database/final-migration-order-invariant-matrix.yml\n    narrative_aggregate_source: docs/87-physical-database-schema.md\n    narrative_audit_source: docs/116-stage-4-final-migration-order-invariant-matrix-audit.md\n    machine_commit: 5e0371f5ea9b8916b1ed5777a4ea28b4fd392b18\n    core_schema_blob: b0629cc48e26798d945356eaa1d0c9b1187aa542\n    final_matrix_blob: ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441\n    narrative_commit: f8a77d3d05c844ce08bc8010e598c3e39e637046\n    docs87_blob: a48eacd92d4a9c8e989f5d70c3bec95b9231a77c\n    docs116_blob: 6f76255742d4902546f45c28d54c1da6ee3d3fd7\n    checks:\n      DB4_1_through_DB4_10_remain_PASS: PASS\n      historical_DB4_11_six_blocker_diagnosis_preserved: PASS\n      migration_dependency_DAG_node_count: 170\n      DB_MIG_001_DAG_and_topological_order_unchanged: PASS\n      DB_MIG_002_seven_phase_contract_unchanged: PASS\n      DB_MIG_003_cutover_restart_rollback_contract_unchanged: PASS\n      legacy_17_step_machine_migration_order_retired: PASS\n      blanket_final_constraint_bucket_retired: PASS\n      docs87_stale_commerce_shortcut_removed: PASS\n      docs87_stale_audit_activity_outbox_notifications_shortcut_removed: PASS\n      docs87_stale_blanket_final_constraint_step_removed: PASS\n      full_DB4_9_commerce_catalog_order_items_payment_events_settlement_fulfillment_purchase_lineage_represented: PASS\n      full_DB4_10_audit_policy_domain_event_outbox_activity_notification_migration_review_retention_represented: PASS\n      top_level_core_migration_test_source_invariants: 244\n      recursive_core_migration_test_source_occurrences: 261\n      DB_TST_001_base_test_ids_preserved_unchanged: 261\n      DB_TST_002_historical_coverage_anchor_count_preserved: 229\n      DB_FINAL_001_append_only_postcheck_id: DBT-CORE-100\n      final_coverage_anchor_count: 230\n      final_test_catalog_total: 491\n      resolved_stage4_blockers_total: 77\n      critical_constraints_covered: 183\n      transactional_invariants_covered: 45\n      bounded_local_required_test_occurrences_preserved: 1581\n      bounded_local_unique_test_names_preserved: 1576\n      unknown_final_test_refs: 0\n      unknown_or_orphan_source_refs: 0\n      coverage_gaps: 0\n      framework_test_files_generated: false\n      Laravel_migrations_created: false\n      Stage5_started: false\n      UI_or_feature_implementation_started: false\n'''
          s=s.replace(marker,block+marker,1)
          rep('''  - DB-MIG-001\n  - DB-MIG-002\n  - DB-MIG-003\n  - DB-TST-001\n  - DB-TST-002\n\nopen_blockers_current_diagnosed_scope:\n  - DB-FINAL-001\n''','''  - DB-MIG-001\n  - DB-MIG-002\n  - DB-MIG-003\n  - DB-TST-001\n  - DB-TST-002\n  - DB-FINAL-001\n\nopen_blockers_current_diagnosed_scope: []\n''')
          rep('  current_result: DB4_11_FAIL_WITH_1_P1_BLOCKER\n','  current_result: PASS\n')
          rep('''  DB4_11_DB_TST_001_result: PASS\n  DB4_11_DB_TST_002_result: PASS\n  DB4_11_DB_FINAL_001_result: OPEN\n  DB4_11_result: FAIL_WITH_1_P1_BLOCKER\n''','''  DB4_11_DB_TST_001_result: PASS\n  DB4_11_DB_TST_002_result: PASS\n  DB4_11_DB_FINAL_001_result: PASS\n  DB4_11_result: PASS\n''')
          rep('''  may_start_DB4_11: false\n  may_start_DB4_11_fixes: true\n  may_start_stage_5: false\n  may_start_UI_or_feature_implementation: false\n''','''  may_start_DB4_11: false\n  may_start_DB4_11_fixes: false\n  may_start_stage_5: true\n  may_start_UI_or_feature_implementation: false\n''')
          oldnext='''next_single_step:\n  id: DB-FINAL-001\n  action: resolve_DB_FINAL_001_only_after_next_explicit_user_instruction\n  diagnosis_only: false\n  fixes_allowed_in_same_step: true\n  allowed_scope:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n    - specs/database/final-migration-order-invariant-matrix.yml\n    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  prior_bounded_context_specs_read_only: true\n  aggregate_core_schema_and_docs87_frozen_until_entry_to_DB_FINAL_001: true\n  scope_lock: >-\n    DB-MIG-001, DB-MIG-002, DB-MIG-003, DB-TST-001 and DB-TST-002 are PASS. Resolve DB-FINAL-001 only.\n    DB-FINAL-001 owns aggregate sync of core-schema.yml and docs/87. Do not enter Stage 5,\n    generate Laravel migrations, or implement UI/features before DB-FINAL-001 passes.\n  after_action: run_DB_FINAL_001_machine_narrative_central_gate_and_STOP_before_Stage_5\n'''
          newnext='''next_single_step:\n  id: STAGE-5\n  action: start_Stage_5_only_after_next_explicit_user_instruction\n  stage_4_gate_passed: true\n  stage_4_resolved_blockers: 77\n  final_stage_4_test_catalog_total: 491\n  Laravel_migrations_created: false\n  Stage5_started: false\n  UI_or_feature_implementation_started: false\n  scope_lock: >-\n    Stage 4 and DB4_11 are PASS. Do not begin Stage 5, generate Laravel migrations,\n    or implement UI/features until the user gives the next explicit instruction.\n  after_action: STOP_before_Stage_5\n'''
          rep(oldnext,newnext)
          p.write_text(s)
          PY
          git diff --check
      - name: Validate duplicate keys provenance semantic loss and final Stage-4 state
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import yaml
          from pathlib import Path
          class UniqueKeyLoader(yaml.SafeLoader): pass
          def construct_mapping(loader,node,deep=False):
              mapping={}
              for key_node,value_node in node.value:
                  key=loader.construct_object(key_node,deep=deep)
                  if key in mapping: raise ValueError(f'duplicate YAML key: {key}')
                  mapping[key]=loader.construct_object(value_node,deep=deep)
              return mapping
          UniqueKeyLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,construct_mapping)
          for p in ['specs/gates/stage-4-database-contract-gate.yml','specs/database/core-schema.yml','specs/database/final-migration-order-invariant-matrix.yml']:
              with open(p) as f: yaml.load(f,Loader=UniqueKeyLoader)
          print('DUPLICATE_KEY_GATE=PASS')
          PY
          ruby <<'RUBY'
          require 'yaml'; require 'date'
          def yf(p); YAML.safe_load(File.read(p), permitted_classes:[Date], aliases:true); end
          g=yf('specs/gates/stage-4-database-contract-gate.yml'); core=yf('specs/database/core-schema.yml'); m=yf('specs/database/final-migration-order-invariant-matrix.yml')
          abort 'central meta not PASS' unless g.dig('meta','status')=='PASS'
          sl=(g['stage_4_slices']||[]).find{|x|x['id']=='DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX'} || abort('slice missing')
          abort 'DB4_11 not PASS' unless sl['status']=='PASS' && sl['blockers_diagnosed']==6 && sl['blockers_resolved']==6 && sl['open_P0_P1']==0 && sl['final_aggregate_sync']=='PASS' && sl['result']=='PASS'
          q=g.dig('quality_checks','DB4_11_DB_FINAL_001') || abort('final provenance missing')
          abort 'final q not PASS' unless q['status']=='PASS' && q['resolved_blocker_id']=='DB-FINAL-001'
          abort 'machine provenance' unless q['machine_commit']=='5e0371f5ea9b8916b1ed5777a4ea28b4fd392b18' && q['core_schema_blob']=='b0629cc48e26798d945356eaa1d0c9b1187aa542' && q['final_matrix_blob']=='ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          abort 'narrative provenance' unless q['narrative_commit']=='f8a77d3d05c844ce08bc8010e598c3e39e637046' && q['docs87_blob']=='a48eacd92d4a9c8e989f5d70c3bec95b9231a77c' && q['docs116_blob']=='6f76255742d4902546f45c28d54c1da6ee3d3fd7'
          c=q['checks']||{}
          abort 'final counts' unless c['migration_dependency_DAG_node_count']==170 && c['final_coverage_anchor_count']==230 && c['final_test_catalog_total']==491 && c['resolved_stage4_blockers_total']==77
          abort 'coverage counts' unless c['critical_constraints_covered']==183 && c['transactional_invariants_covered']==45 && c['bounded_local_required_test_occurrences_preserved']==1581 && c['bounded_local_unique_test_names_preserved']==1576 && c['coverage_gaps']==0
          rb=g['resolved_blockers']||[]; abort 'resolved blockers' unless rb.length==77 && rb.uniq.length==77 && rb.last=='DB-FINAL-001'
          abort 'open blockers' unless g['open_blockers_current_diagnosed_scope']==[]
          gd=g['gate_definition']||{}
          abort 'historical diagnosis overwritten' unless gd['DB4_11_diagnosis_result']=='FAIL_WITH_6_P1_BLOCKERS'
          abort 'final gate result' unless gd['current_result']=='PASS' && gd['DB4_11_DB_FINAL_001_result']=='PASS' && gd['DB4_11_result']=='PASS' && gd['may_start_stage_5']==true && gd['may_start_UI_or_feature_implementation']==false
          n=g['next_single_step']||{}; abort 'next step' unless n['id']=='STAGE-5' && n['stage_4_gate_passed']==true && n['Stage5_started']==false && n['Laravel_migrations_created']==false
          mo=core['migration_order']; itp=core['invariant_test_plan']; abort 'core final sync' unless mo['legacy_high_level_17_step_order_retired']==true && mo['dependency_node_count']==170 && itp['final_test_catalog_total']==491 && itp['resolved_stage4_blockers_covered_after_DB_FINAL_001']==77
          cov=m['test_coverage_traceability_contract']; cat=cov['final_test_catalog']; anchors=cat['coverage_anchor_tests']||[]
          abort 'matrix final catalog' unless cat['coverage_anchor_test_count']==230 && cat['total_final_test_ids']==491 && anchors.any?{|x|x['test_id']=='DBT-CORE-100'}
          fin=(cov['resolved_blocker_coverage']||[]).find{|x|x['blocker_id']=='DB-FINAL-001'} || abort('matrix final mapping')
          abort 'matrix final mapping ids' unless fin['final_test_ids']==['DBT-CORE-100']
          zero=cov['zero_gap_summary']; abort 'matrix zero gap' unless zero['resolved_blockers_expected_after_this_step']==77 && zero['resolved_blockers_without_coverage']==[] && zero['unknown_final_test_refs']==[] && zero['unknown_or_orphan_source_refs']==[] && zero['result']=='PASS_ZERO_GAPS'
          d87=File.read('docs/87-physical-database-schema.md'); d116=File.read('docs/116-stage-4-final-migration-order-invariant-matrix-audit.md')
          abort 'docs87 final status' unless d87.include?('DB4_11_FINAL_MIGRATION_AND_INVARIANT_TEST_AGGREGATE_SYNC_PASS') && d87.include?('DBT-CORE-100') && d87.include?('491 unikalnych test IDs')
          ['15. orders/payments/service entitlements/activations,','16. audit/activity/outbox/notifications,','17. final partial indexes/cross-table constraints'].each{|x|abort 'stale docs87' if d87.include?(x)}
          abort 'docs116 narrative gate missing' unless d116.include?('PASS_DB_FINAL_001_NARRATIVE_PENDING_CENTRAL') && d116.include?('STOP przed Stage 5')
          puts 'DB_FINAL_001_CENTRAL_STAGE4_GATE=PASS'
          RUBY
          test "$(git hash-object specs/database/core-schema.yml)" = b0629cc48e26798d945356eaa1d0c9b1187aa542
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441
          test "$(git hash-object docs/87-physical-database-schema.md)" = a48eacd92d4a9c8e989f5d70c3bec95b9231a77c
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 6f76255742d4902546f45c28d54c1da6ee3d3fd7
      - name: Remove helper and prove central-only net tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=f8a77d3d05c844ce08bc8010e598c3e39e637046
          git rm .github/workflows/tmp-db-final-001-central-validation-20260910.yml
          git add specs/gates/stage-4-database-contract-gate.yml
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = specs/gates/stage-4-database-contract-gate.yml
          git diff --cached --check
          git diff --cached --stat "$BASE"
      - name: Commit validated helper tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DB-FINAL-001: close Stage 4 database contract gate'
          git push origin HEAD:tmp-db-final-001-central-validation-20260910
