          rep('''    migration_postcheck_final_test_ids:\n    - DBT-CORE-099\n''','''    migration_postcheck_final_test_ids:\n    - DBT-CORE-099\n    - DBT-CORE-100\n''')
          rep('    resolved_blockers_expected_after_this_step: 76\n', '    resolved_blockers_expected_after_this_step: 77\n')
          rep('''  validation_rules:\n  - every_resolved_blocker_after_DB_TST_002_has_one_or_more_known_final_test_ids\n  - every_core_critical_constraint_has_one_exact_source_anchor_final_test_id\n  - every_core_transactional_invariant_has_one_exact_source_anchor_final_test_id\n  - every_bounded_local_required_test_group_is_preserved_byte_for_semantic_name_set_and_source_path\n  - local_test_names_are_not_collapsed_by_fuzzy_equivalence_without_explicit_exact_match\n  - all_final_test_refs_resolve_to_base_or_coverage_anchor_catalog\n  - DB_TST_001_existing_261_ids_and_definitions_remain_immutable\n  - core_schema_and_docs87_remain_frozen_until_DB_FINAL_001\n''','''  validation_rules:\n  - every_resolved_blocker_after_DB_FINAL_001_has_one_or_more_known_final_test_ids\n  - every_core_critical_constraint_has_one_exact_source_anchor_final_test_id\n  - every_core_transactional_invariant_has_one_exact_source_anchor_final_test_id\n  - every_bounded_local_required_test_group_is_preserved_byte_for_semantic_name_set_and_source_path\n  - local_test_names_are_not_collapsed_by_fuzzy_equivalence_without_explicit_exact_match\n  - all_final_test_refs_resolve_to_base_or_coverage_anchor_catalog\n  - DB_TST_001_existing_261_ids_and_definitions_remain_immutable\n  - DB_FINAL_001_machine_and_narrative_aggregate_sync_is_covered_by_DBT_CORE_100\n  - no_provisional_17_step_migration_order_or_blanket_final_constraint_authority_remains\n''')
          rep('''  - id: DB-FINAL-001\n    severity: P1\n    status: OPEN\n''','''  - id: DB-FINAL-001\n    severity: P1\n    status: PASS\n''')
          oldtail='''DB-TST-002:\n  status: PASS\n  title: coverage_traceability_and_completeness_gate\n  machine_authority: test_coverage_traceability_contract\n  prior_resolved_blockers_covered: 75\n  resolved_blockers_covered_after_this_step: 76\n  critical_constraints_covered: 183\n  transactional_invariants_covered: 45\n  bounded_local_required_test_occurrences_preserved: 1581\n  bounded_local_unique_test_names_preserved: 1576\n  DB_TST_001_base_tests_preserved_unchanged: 261\n  coverage_anchor_tests_added: 229\n  final_test_catalog_total: 490\n  migration_postcheck_anchor_defined: true\n  unknown_final_test_refs: 0\n  unknown_or_orphan_source_refs: 0\n  coverage_gaps: 0\n  DB_FINAL_001_aggregate_sync_deferred: true\n  framework_test_files_generated: false\n\ndiagnosis_summary:\n  diagnosed_P0: 0\n  diagnosed_P1: 6\n  fixes_applied_in_diagnosis_step: 0\n  resolved_after_diagnosis: 5\n  open_P0_P1: 1\n  result: FAIL_WITH_1_P1_BLOCKER\n  blockers_in_required_fix_order:\n    - DB-FINAL-001\n'''
          core_blob='__CORE_BLOB__'
          newtail=f'''DB-TST-002:\n  status: PASS\n  title: coverage_traceability_and_completeness_gate\n  machine_authority: test_coverage_traceability_contract\n  prior_resolved_blockers_covered: 75\n  resolved_blockers_covered_after_this_step: 76\n  critical_constraints_covered: 183\n  transactional_invariants_covered: 45\n  bounded_local_required_test_occurrences_preserved: 1581\n  bounded_local_unique_test_names_preserved: 1576\n  DB_TST_001_base_tests_preserved_unchanged: 261\n  coverage_anchor_tests_added: 229\n  final_test_catalog_total: 490\n  migration_postcheck_anchor_defined: true\n  unknown_final_test_refs: 0\n  unknown_or_orphan_source_refs: 0\n  coverage_gaps: 0\n  DB_FINAL_001_aggregate_sync_deferred: true\n  framework_test_files_generated: false\n\nDB-FINAL-001:\n  status: PASS_MACHINE_PENDING_NARRATIVE_CENTRAL\n  title: final_machine_narrative_migration_and_test_semantic_sync\n  aggregate_machine: specs/database/core-schema.yml\n  aggregate_machine_blob: {core_blob}\n  aggregate_narrative: docs/87-physical-database-schema.md\n  aggregate_narrative_sync_pending_in_next_gate: true\n  executable_migration_authority: migration_dependency_dag\n  migration_phase_authority: migration_phase_composition\n  cutover_execution_authority: migration_cutover_execution_contract\n  final_test_catalog_total: 491\n  final_sync_postcheck_test_id: DBT-CORE-100\n  legacy_17_step_machine_order_retired: true\n  blanket_final_constraint_authority_retired: true\n  Stage5_started: false\n  Laravel_migrations_created: false\n  UI_or_feature_implementation_started: false\n\ndiagnosis_summary:\n  diagnosed_P0: 0\n  diagnosed_P1: 6\n  fixes_applied_in_diagnosis_step: 0\n  resolved_after_diagnosis: 6\n  open_P0_P1: 0\n  result: PASS_DB_FINAL_001_MACHINE_PENDING_NARRATIVE_CENTRAL\n  blockers_in_required_fix_order: []\n'''
          rep(oldtail,newtail)
          oldnext='''next_single_step_after_central_gate:\n  id: DB-FINAL-001\n  action: resolve_DB_FINAL_001_only_after_next_explicit_user_instruction\n  allowed_files_only:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n    - specs/database/final-migration-order-invariant-matrix.yml\n    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  prior_bounded_context_specs_read_only: true\n  aggregate_core_schema_and_docs87_frozen_until_entry_to_DB_FINAL_001: true\n  scope_lock: >-\n    DB-MIG-001, DB-MIG-002, DB-MIG-003, DB-TST-001 and DB-TST-002 are PASS. Resolve DB-FINAL-001 only.\n    DB-FINAL-001 owns the aggregate sync of core-schema.yml and docs/87. Do not enter Stage 5,\n    generate Laravel migrations, or implement UI/features before the DB-FINAL-001 gate passes.\n  after_action: run_DB_FINAL_001_machine_narrative_central_gate_and_STOP_before_Stage_5\n'''
