          old99='''    - test_id: DBT-CORE-099\n      source_kind: coverage_gate\n      source_key: DB-TST-002-zero-gap-traceability-gate\n      source_invariant: coverage_gate:DB-TST-002-zero-gap-traceability-gate\n      source_refs:\n      - specs/database/final-migration-order-invariant-matrix.yml::test_coverage_traceability_contract.zero_gap_summary\n      test_class: migration_postcheck\n      execution_phase: post_migration\n      blocking_severity: P1\n      expected_outcome: all_declared_coverage_joins_resolve_to_known_final_test_ids_with_zero_required_gaps\n      fixture_profile: FP-MIGRATION-POSTCHECK\n      concurrency_profile: none\n      implementation_status: contract_only_no_framework_test_generated\n'''
