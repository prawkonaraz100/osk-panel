          rep('  step: DB-TST-002\n  status: FAIL_WITH_1_P1_BLOCKER\n', '  step: DB-FINAL-001\n  status: PASS_DB_FINAL_001_MACHINE_PENDING_NARRATIVE_CENTRAL\n')
