          PY
          CORE_BLOB=$(git hash-object specs/database/core-schema.yml)
          sed -i "s/__CORE_BLOB__/${CORE_BLOB}/" specs/database/final-migration-order-invariant-matrix.yml
          git diff --check
      - name: Validate machine semantic-loss closure
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'; require 'date'; require 'set'; require 'open3'
          def ytext(t); YAML.safe_load(t, permitted_classes:[Date], aliases:true); end
          def yf(p); ytext(File.read(p)); end
          base='791d13087fc16fdac2429c7b8a92c3529e36f8f1'
          old_core=ytext(`git show #{base}:specs/database/core-schema.yml`)
          core=yf('specs/database/core-schema.yml')
          matrix=yf('specs/database/final-migration-order-invariant-matrix.yml')
          old_matrix=ytext(`git show #{base}:specs/database/final-migration-order-invariant-matrix.yml`)
          abort 'core meta' unless core.dig('meta','DB4_11_final_migration_and_test_machine_aggregate_sync')=='PASS'
          mo=core['migration_order'] || abort('missing migration_order')
          abort 'legacy migration shortcut survives' unless mo['legacy_high_level_17_step_order_retired']==true && mo['dependency_node_count']==170 && mo['constraints_are_not_a_blanket_final_step']==true
          abort 'phase summary' unless mo['phase_order']==%w[expand preflight write_fence backfill reconcile validate contract]
          itp=core['invariant_test_plan'] || abort('missing invariant_test_plan')
          abort 'test summary' unless itp['source_invariant_count']==261 && itp['stable_base_test_ids']==261 && itp['coverage_anchor_test_ids']==230 && itp['final_test_catalog_total']==491
          abort 'coverage summary' unless itp['resolved_stage4_blockers_covered_after_DB_FINAL_001']==77 && itp['critical_constraints_covered']==183 && itp['transactional_invariants_covered']==45 && itp['coverage_gaps']==0
          abort 'source invariants changed' unless core['migration_tests_required']==old_core['migration_tests_required'] && core['migration_tests_required'].length==261
          normalized=Marshal.load(Marshal.dump(core)); oldnorm=Marshal.load(Marshal.dump(old_core))
          normalized['meta'].delete('DB4_11_final_migration_and_test_machine_aggregate_sync'); normalized['meta'].delete('final_migration_and_test_authority')
          normalized['migration_order']=oldnorm['migration_order']; normalized.delete('invariant_test_plan')
          abort 'unrelated core semantics changed' unless normalized==oldnorm
          abort 'DAG changed' unless matrix['migration_dependency_dag']==old_matrix['migration_dependency_dag']
          abort 'phase contract changed' unless matrix['migration_phase_composition']==old_matrix['migration_phase_composition']
          abort 'cutover contract changed' unless matrix['migration_cutover_execution_contract']==old_matrix['migration_cutover_execution_contract']
          abort 'base test catalog changed' unless matrix['invariant_test_matrix']==old_matrix['invariant_test_matrix']
          cov=matrix['test_coverage_traceability_contract'] || abort('coverage missing')
          cat=cov['final_test_catalog'] || abort('catalog missing')
          anchors=cat['coverage_anchor_tests'] || []
          ids=(matrix.dig('invariant_test_matrix','tests')||[]).map{|x|x['test_id']} + anchors.map{|x|x['test_id']}
          abort 'catalog counts' unless cat['base_test_count']==261 && cat['coverage_anchor_test_count']==230 && cat['total_final_test_ids']==491 && anchors.length==230 && ids.length==491 && ids.uniq.length==491
          a100=anchors.find{|x|x['test_id']=='DBT-CORE-100'} || abort('missing DBT-CORE-100')
          abort 'DBT100 class' unless a100['test_class']=='migration_postcheck' && a100['source_key']=='DB-FINAL-001-final-aggregate-semantic-sync'
          rb=cov['resolved_blocker_coverage'] || []
          final=rb.find{|x|x['blocker_id']=='DB-FINAL-001'} || abort('missing final blocker coverage')
          abort 'final blocker mapping' unless final['final_test_ids']==['DBT-CORE-100'] && rb.length==77
          zero=cov['zero_gap_summary'] || {}
          abort 'zero-gap' unless zero['resolved_blockers_expected_after_this_step']==77 && zero['resolved_blockers_without_coverage']==[] && zero['unknown_final_test_refs']==[] && zero['unknown_or_orphan_source_refs']==[] && zero['result']=='PASS_ZERO_GAPS'
          abort 'matrix final blocker not machine-pass' unless (matrix['blockers']||[]).find{|x|x['id']=='DB-FINAL-001'}['status']=='PASS'
          abort 'machine diagnosis summary' unless matrix.dig('diagnosis_summary','open_P0_P1')==0 && matrix.dig('diagnosis_summary','result')=='PASS_DB_FINAL_001_MACHINE_PENDING_NARRATIVE_CENTRAL'
          core_blob=`git hash-object specs/database/core-schema.yml`.strip
          abort 'core provenance mismatch' unless matrix.dig('DB-FINAL-001','aggregate_machine_blob')==core_blob
          puts "DB_FINAL_001_MACHINE_GATE=PASS core_blob=#{core_blob} final_tests=#{ids.length}"
          RUBY
          test "$(git hash-object docs/87-physical-database-schema.md)" = 6c090b082604b6b42c283667fcf08e9033a5b523
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 1b962ab102956f15c59be4af24c84b8dfdf2eba5
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = d3c94ea818637bedd06234c9c1b2b2629fc0252c
      - name: Remove helper and prove machine-only net tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=791d13087fc16fdac2429c7b8a92c3529e36f8f1
          git rm .github/workflows/tmp-db-final-001-machine-validation-20260910.yml
          git add specs/database/core-schema.yml specs/database/final-migration-order-invariant-matrix.yml
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = specs/database/core-schema.yml
          test "${changed[1]}" = specs/database/final-migration-order-invariant-matrix.yml
          git diff --cached --check
          git diff --cached --stat "$BASE"
      - name: Commit validated helper tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DB-FINAL-001: synchronize final machine migration and test authorities'
          git push origin HEAD:tmp-db-final-001-machine-validation-20260910
