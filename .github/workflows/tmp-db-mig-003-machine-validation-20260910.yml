name: tmp-db-mig-003-machine-validation-20260910

on:
  push:
    branches:
      - tmp-db-mig-003-machine-validation-20260910

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-mig-003-machine-validation-20260910
          fetch-depth: 0

      - name: Assert accepted input blobs
        shell: bash
        run: |
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "1df9476a116677b07f8f1725c765c09c044d4aac"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"

      - name: Apply and validate DB-MIG-003 machine contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          p = Path('specs/database/final-migration-order-invariant-matrix.yml')
          text = p.read_text()
          original = text

          def section(src, start_marker, end_marker):
              s = src.index(start_marker)
              e = src.index(end_marker, s)
              return src[s:e]

          def replace_once(src, old, new, label):
              c = src.count(old)
              assert c == 1, f'{label}: expected 1 match, got {c}'
              return src.replace(old, new, 1)

          dag_before = section(text, 'migration_dependency_dag:\n', '\nmigration_phase_composition:\n')
          phase_before = section(text, 'migration_phase_composition:\n', '\nblockers:\n')
          dag_sha_before = hashlib.sha256(dag_before.encode()).hexdigest()
          phase_sha_before = hashlib.sha256(phase_before.encode()).hexdigest()

          node_pairs = re.findall(r'^  - id: (MIG-[A-Z0-9_-]+)\n    type: ([a-z_]+)\n', dag_before, re.M)
          assert node_pairs, 'no DAG nodes parsed'
          node_types = {t for _, t in node_pairs}
          expected_types = {'extension','table','candidate_key','index','foreign_key','trigger','projection','constraint'}
          assert node_types == expected_types, (node_types, expected_types)
          node_ids = [n for n, _ in node_pairs]
          assert len(node_ids) == len(set(node_ids))

          topo_src = section(dag_before, '  topological_order:\n', '  validation_gate:\n')
          topo = re.findall(r'^  - (MIG-[A-Z0-9_-]+)$', topo_src, re.M)
          assert len(topo) == len(node_ids), (len(topo), len(node_ids))
          assert set(topo) == set(node_ids)

          # Current metadata and scope only.
          meta_end = text.index('\ncanonical_sources:\n')
          head = text[:meta_end]
          head = replace_once(head, '  step: DB-MIG-002\n', '  step: DB-MIG-003\n', 'meta step')
          head = replace_once(head, '  status: FAIL_WITH_4_P1_BLOCKERS\n', '  status: FAIL_WITH_3_P1_BLOCKERS\n', 'meta status')
          head = replace_once(head, '  fixes_applied_total: 2\n', '  fixes_applied_total: 3\n', 'meta fixes total')
          head = replace_once(head, '  current_step_scope: DB_MIG_002_only\n', '  current_step_scope: DB_MIG_003_only\n', 'scope current step')
          text = head + text[meta_end:]

          # DB-MIG-003 execution contract is additive; DB-MIG-001 DAG and DB-MIG-002 phase composition remain byte-for-byte unchanged.
          insert_marker = '\nblockers:\n'
          assert text.count(insert_marker) == 1
          contract = f'''\nmigration_cutover_execution_contract:
  blocker: DB-MIG-003
  status: PASS_DB_MIG_003
  contract_version: 1
  scope: cutover_restart_failure_and_safe_rollback_only
  dependency_order_authority: migration_dependency_dag
  phase_composition_authority: migration_phase_composition
  does_not_rewrite_dependency_or_phase_order: true
  Laravel_migration_files_generated: false
  production_specific_RPO_RTO_values_set_here: false

  execution_control:
    single_active_migration_executor_required: true
    exact_lock_or_lease_mechanism: deferred_to_implementation
    concurrent_independent_execution_of_same_plan: forbidden
    stale_executor_takeover_requires_proof_no_active_executor_and_recorded_operator_decision: true
    migration_plan_identity_must_bind:
      - accepted_release_or_schema_plan_identity
      - DB_MIG_001_DAG_contract_version
      - DB_MIG_002_phase_contract_version
      - DB_MIG_003_cutover_contract_version
    durable_execution_evidence_required: true
    durable_execution_evidence_storage: deployment_operations_system_or_runbook_record_not_new_core_table_in_DB_MIG_003
    secrets_or_sensitive_payloads_in_execution_evidence: forbidden

  retry_semantics:
    blind_retry: forbidden
    first_action_after_interruption: inspect_exact_postcondition_and_partial_artifacts
    exact_postcondition_already_satisfied: mark_step_complete_without_reapplying_effect
    no_effect_and_preconditions_still_hold: rerun_permitted_only_for_restart_safe_node
    partial_or_ambiguous_effect: manual_review_required
    postcondition_mismatch_with_expected_definition: STOP_and_manual_review
    restart_safe_does_not_mean_unconditional_idempotent_retry: true

  node_restart_classification:
    values: [restart_safe, manual_review]
    resolution_algorithm: exact_override_else_node_type_default
    every_DAG_node_must_resolve_exactly_one_classification: true
    DAG_node_count_at_contract_close: {len(node_ids)}
    defaults_by_node_type:
      extension: restart_safe
      table: restart_safe
      candidate_key: manual_review
      index: manual_review
      foreign_key: restart_safe
      trigger: restart_safe
      projection: manual_review
      constraint: manual_review
    exact_overrides:
      MIG-IDX-CALENDAR_GIST:
        classification: manual_review
        reason: exclusion_or_index_build_may_require_conflict_or_partial_artifact_inspection_before_retry
      MIG-FK-PURCHASE_DOWNSTREAM:
        classification: manual_review
        reason: exact_purchase_lineage_backfill_and_reconciliation_must_not_be_replayed_blindly
      MIG-FK-EVENTS:
        classification: manual_review
        reason: legacy_event_actor_recipient_policy_lineage_requires_fail_closed_evidence_review
      MIG-TRG-EVENTS:
        classification: manual_review
        reason: node_spans_legacy_backfill_and_reconciliation_in_DB_MIG_002_phase_override
    restart_safe_definition:
      requires_exact_object_definition_or_row_effect_postcondition_check_before_retry: true
      existing_object_with_expected_shape_may_be_accepted_as_complete: true
      existing_object_with_unexpected_shape_may_be_mutated_automatically: false
    manual_review_definition:
      automatic_rerun_after_interruption: forbidden
      operator_must_classify_partial_effect_before_resume_forward_fix_or_explicit_safe_cleanup: true

  per_phase_execution_gate:
    expand:
      entry_requires:
        - accepted_plan_identity_matches_execution_evidence
        - single_active_executor_acquired
        - production_backup_health_verified_when_running_in_production
        - current_application_is_compatible_with_forward_compatible_expand
      exit_requires:
        - every_expand_object_has_exact_expected_postcondition
        - previous_application_remains_schema_compatible
        - no_destructive_change_occurred
      abort_if:
        - object_exists_with_incompatible_shape_or_semantics
        - DDL_failure_leaves_unclassified_partial_artifact
        - operational_lock_or_statement_budget_is_exceeded_under_runtime_policy
      restart_posture: node_restart_classification_plus_exact_postcondition_first
      rollback_posture: prefer_application_rollback_with_forward_compatible_schema_or_schema_forward_fix

    preflight:
      entry_requires:
        - expand_exit_gate_PASS
        - evidence_queries_and_legacy_classification_rules_match_local_bounded_contracts
        - no_guessing_or_auto_reparenting_policy_active
      exit_requires:
        - every_required_preflight_population_is_inventoried
        - every_found_violation_is_durably_classified_or_resolved_by_exact_evidence
        - conflicts_that_block_non_NOT_VALID_write_fence_are_zero
      abort_if:
        - ambiguous_row_would_need_guessing_to_proceed
        - required_source_evidence_is_missing_or_conflicting
        - preflight_scope_or_source_population_changes_make_prior_result_untrustworthy
      restart_posture: rerun_inventory_from_current_authoritative_state_and_never_reuse_stale_PASS_blindly
      rollback_posture: no_business_history_mutation_should_require_down_rollback

    write_fence:
      entry_requires:
        - preflight_exit_gate_PASS_for_each_guard_being_installed
        - deployed_writer_contract_is_compatible_with_new_guard
        - every_guard_that_cannot_tolerate_legacy_conflicts_has_zero_blocking_conflicts
      exit_requires:
        - new_runtime_writes_cannot_create_new_legacy_exceptions
        - installed_guard_definition_matches_expected_contract
        - application_health_and_readiness_remain_acceptable
      abort_if:
        - any_active_writer_can_violate_or_cannot_operate_under_new_guard
        - guard_installation_has_partial_or_ambiguous_nontransactional_effect
        - disabling_guard_would_be_required_to_continue_backfill
      restart_posture: inspect_each_guard_then_apply_node_restart_classification
      rollback_posture: removing_fence_to_reenable_invalid_writes_is_forbidden_use_compatible_app_rollback_or_forward_fix

    backfill:
      entry_requires:
        - write_fence_exit_gate_PASS
        - exact_durable_evidence_rule_is_defined_for_each_populated_field_or_relation
        - backfill_is_partitioned_or_checkpointed_when_interruption_can_leave_partial_progress
        - resume_predicate_cannot_overwrite_already_proven_business_truth
      exit_requires:
        - all_exactly_proven_rows_in_scope_are_processed
        - every_unproven_ambiguous_or_conflicting_row_is_routed_to_reconciliation_not_guessed
        - no_duplicate_grant_event_projection_or_financial_effect_was_created_by_retry
      abort_if:
        - retry_would_recompute_business_truth_from_mutable_non_authoritative_similarity
        - duplicate_non_idempotent_effect_is_detected
        - source_evidence_changes_or_conflicts_during_processing
      restart_posture: checkpoint_resume_only_when_effect_is_proven_idempotent_otherwise_manual_review
      rollback_posture: never_reverse_or_delete_formal_financial_audit_history_to_undo_backfill_use_forward_fix_or_reviewed_correction

    reconcile:
      entry_requires:
        - backfill_exit_gate_PASS_or_durable_unresolved_cases_exist
        - unresolved_cases_preserve_nonsecret_source_fingerprint_and_exact_issue_reason
        - reviewer_or_privileged_migration_process_is_authorized_and_audited_where_required
      exit_requires:
        - required_P0_P1_unresolved_cases_equal_zero_before_validation
        - every reviewed_remediation_has_durable_evidence_and_reason
        - no_merge_delete_reparent_shift_or_state_rewrite_was_used_without_exact_contract_authority
      abort_if:
        - evidence_remains_ambiguous_for_required_final_invariant
        - remediation_would_fabricate_lineage_recipient_read_state_payment_or_inventory_history
        - operator_cannot_prove_effect_of_prior_interrupted_remediation
      restart_posture: manual_review_do_not_replay_human_or_privileged_resolution_blindly
      rollback_posture: preserve_review_history_and_apply_forward_correction_not_history_erasure

    validate:
      entry_requires:
        - write_fence_still_active
        - backfill_exit_gate_PASS
        - reconcile_exit_gate_PASS
        - required_unresolved_P0_P1_cases_equal_zero
      exit_requires:
        - all_DB_MIG_002_final_invariants_required_for_cutover_validate_successfully
        - every_constraint_expected_to_be_validated_is_validated
        - no_invalid_or_unclassified_partial_index_or_constraint_artifact_remains
        - projection_source_dedupe_and_safe_snapshot_postconditions_required_by_bounded_contracts_hold
      abort_if:
        - any_required_constraint_or_invariant_validation_fails
        - any_required_reconciliation_case_reopens_or_new_one_is_discovered
        - validation_requires_disabling_a_write_fence_or_rewriting_history
      restart_posture: failed_validation_is_STOP_then_fix_forward_or_reconcile_then_rerun_from_entry_gate
      rollback_posture: validation_failure_does_not_authorize_contract_or_destructive_down

    contract:
      entry_requires:
        - validate_exit_gate_PASS
        - required_unresolved_P0_P1_cases_equal_zero
        - previous_or_fallback_application_compatibility_decision_recorded
        - superseded_writer_paths_are_stopped_or_deauthorized_before_removal
        - production_backup_is_healthy_when_running_in_production
        - successful_isolated_restore_test_evidence_exists_per_production_operations_policy
        - authorized_release_operator_accepts_destructive_or_deauthorization_scope
      exit_requires:
        - only_superseded_paths_approved_by_contract_were_deauthorized_or_removed
        - no_required_formal_financial_or_audit_history_was_rewritten_or_deleted
        - new_application_health_and_readiness_PASS
        - final_cutover_smoke_and_integrity_gate_PASS
      abort_if:
        - restore_evidence_is_missing_for_destructive_contract_action
        - fallback_application_requires_a_path_about_to_be_removed_without_compatibility_preservation
        - any_required_unresolved_case_or_failed_validation_exists
        - partial_destructive_effect_cannot_be_proven_safe
      restart_posture: always_manual_review_after_interrupted_contract_phase
      rollback_posture: automatic_destructive_down_for_formal_financial_or_audit_history_is_forbidden

  failure_and_resume_matrix:
    transactional_DDL_or_transactional_guard_failure:
      expected_posture: transaction_rollback_then_exact_postcondition_inspection
      automatic_retry_allowed: only_if_resolved_node_classification_is_restart_safe_and_no_partial_effect_exists
    nontransactional_or_concurrent_index_build_failure:
      expected_posture: inspect_invalid_or_partial_artifact_then_manual_review
      blind_drop_and_recreate_by_name: forbidden
      automatic_retry_allowed: false
    interrupted_backfill:
      expected_posture: inspect_checkpoint_and_already_applied_effects
      resume_allowed: only_if_exact_evidence_and_idempotent_resume_predicate_are_proven
      otherwise: manual_review
    interrupted_reconciliation_or_privileged_remediation:
      expected_posture: manual_review_of_durable_case_and_prior_effect
      automatic_replay: forbidden
    validation_failure:
      expected_posture: keep_write_fence_STOP_contract_fix_forward_or_reconcile_then_validate_again
      destructive_rollback_authorized_by_validation_failure: false
    application_health_failure_after_database_change:
      expected_posture: application_rollback_only_if_compatibility_gate_passes_else_schema_forward_fix
      reverse_committed_business_history: forbidden
    interrupted_or_partial_contract:
      expected_posture: manual_review_and_forward_safety_assessment
      automatic_down: forbidden

  rollback_policy:
    allowed_modes:
      - application_rollback
      - schema_forward_fix
      - explicit_safe_down
    default_database_failure_posture_after_durable_state_exists: schema_forward_fix
    application_rollback:
      meaning: deploy_prior_or_fallback_application_without_reversing_database_business_history
      requires:
        - fallback_application_is_compatible_with_current_schema_and_active_write_fences
        - fallback_application_cannot_resume_superseded_invalid_write_contract
      schema_reversal_implied: false
    schema_forward_fix:
      meaning: preserve_committed_authoritative_history_and_apply_reviewed_forward_correction
      preferred_when:
        - new_schema_or_backfill_has_durable_authoritative_effects
        - safe_down_cannot_prove_zero_business_history_loss
        - contract_phase_is_partially_applied
    explicit_safe_down:
      meaning: reviewed_reverse_schema_operation_only_when_exactly_proven_non_destructive
      requires:
        - exact_reverse_operation_is_declared_and_reviewed
        - no_authoritative_write_depends_on_object_or_state_being_reversed
        - no_formal_financial_audit_or_other_required_history_is_deleted_rewritten_or_fabricated
        - post_down_schema_and_application_compatibility_are_proven
      ordinary_generic_down_method_as_rollback_strategy: forbidden
    automatic_down_for_formal_financial_audit_history: forbidden
    restoring_old_backup_over_newer_valid_production_writes_as_normal_release_rollback: forbidden

  backup_restore_boundary:
    backup_health_required_by_production_release_policy: true
    destructive_contract_requires_successful_restore_evidence: true
    backup_without_restore_test_is_sufficient_for_destructive_contract: false
    restore_evidence_must_come_from_isolated_restore_test_or_incident_recovery_process: true
    PITR_or_full_restore_is_incident_recovery_not_default_schema_rollback: true
    exact_RPO_RTO_values: external_production_business_policy_not_set_in_DB_MIG_003
    retention_duration: external_privacy_legal_policy_not_set_in_DB_MIG_003

  cutover_compatibility_boundary:
    source_of_truth_switch_requires_new_write_fence_and_validation_before_old_path_retirement: true
    application_rollback_after_write_fence_requires_fallback_writer_compatibility: true
    application_rollback_after_destructive_contract_may_be_impossible_if_old_path_removed: true
    therefore_contract_entry_requires_fallback_compatibility_decision: true
    old_writer_reactivation_after_contract_without_new_migration_plan: forbidden

  final_cutover_smoke_and_integrity_gate:
    purpose: release_level_database_cutover_evidence_not_DB_TST_001_test_matrix
    stable_test_ids_defined_here: false
    requires:
      - every_DAG_node_required_by_this_release_has_reached_expected_phase_postcondition
      - no_required_P0_P1_migration_reconciliation_case_is_open
      - all_expected_final_validations_are_successful
      - no_invalid_or_unclassified_partial_DDL_artifact_remains
      - active_write_fences_match_final_contract
      - application_health_and_readiness_checks_PASS
      - bounded_context_migration_integrity_and_projection_postconditions_PASS
      - destructive_contract_actions_have_required_backup_and_restore_evidence
    failure_result: STOP_release_completion_and_apply_failure_resume_matrix
    PASS_does_not_mean_DB_TST_001_or_DB_TST_002_are_closed: true

  machine_validation:
    parsed_DAG_nodes: {len(node_ids)}
    restart_classification_values_complete: true
    every_DAG_node_resolves_restart_classification: true
    exact_override_node_ids_exist: true
    DB_MIG_001_DAG_hash_unchanged_by_DB_MIG_003: true
    DB_MIG_002_phase_composition_hash_unchanged_by_DB_MIG_003: true
    all_seven_phases_have_entry_exit_abort_restart_and_rollback_contract: true
    blind_retry_forbidden: true
    automatic_destructive_down_for_required_history_forbidden: true
    destructive_contract_bound_to_backup_restore_and_zero_unresolved: true
    final_smoke_integrity_gate_defined_without_stable_test_IDs: true
    production_specific_RPO_RTO_not_invented: true

  preservation_boundary:
    DB_MIG_001_DAG_unchanged: true
    DB_MIG_002_phase_composition_unchanged: true
    DB_TST_001_and_DB_TST_002_not_solved: true
    DB_FINAL_001_aggregate_sync_not_solved: true
    core_schema_and_docs87_remain_frozen: true
    Stage5_or_Laravel_migration_generation_in_this_step: forbidden
'''
          text = text.replace(insert_marker, contract + insert_marker, 1)

          # Close only the DB-MIG-003 blocker record.
          b_start = text.index('\nblockers:\n')
          b_end = text.index('\nresolved_contracts:\n', b_start)
          blockers = text[b_start:b_end]
          mig3_start = blockers.index('  - id: DB-MIG-003\n')
          next_blocker = blockers.index('\n  - id: DB-TST-001\n', mig3_start)
          mig3 = blockers[mig3_start:next_blocker]
          mig3 = replace_once(mig3, '    status: OPEN\n', '    status: PASS\n', 'DB-MIG-003 blocker status')
          blockers = blockers[:mig3_start] + mig3 + blockers[next_blocker:]
          text = text[:b_start] + blockers + text[b_end:]

          # Add current resolved DB-MIG-003 contract summary without rewriting DB-MIG-001/002 summaries.
          r_start = text.index('\nresolved_contracts:\n')
          d_start = text.index('\ndiagnosis_summary:\n', r_start)
          resolved = text[r_start:d_start]
          assert '  DB-MIG-003:\n' not in resolved
          mig3_summary = f'''\n  DB-MIG-003:
    status: PASS
    title: global_cutover_restart_failure_and_safe_rollback_gate
    machine_authority: migration_cutover_execution_contract
    dependency_order_authority_preserved: migration_dependency_dag
    phase_order_authority_preserved: migration_phase_composition
    DAG_nodes_restart_classified: {len(node_ids)}
    restart_values: [restart_safe, manual_review]
    blind_retry_forbidden: true
    per_phase_entry_exit_abort_defined: true
    per_phase_restart_and_rollback_posture_defined: true
    failed_validation_blocks_contract: true
    destructive_contract_requires_zero_required_unresolved_cases: true
    destructive_contract_requires_backup_health_and_restore_test_evidence: true
    rollback_modes: [application_rollback, schema_forward_fix, explicit_safe_down]
    automatic_destructive_down_for_required_history: forbidden
    final_cutover_smoke_and_integrity_gate_defined: true
    production_specific_RPO_RTO_values_invented: false
    DB_TST_001_and_DB_TST_002_closed_here: false
    DB_FINAL_001_aggregate_sync_closed_here: false
    Laravel_migrations_generated: false
'''
          resolved = resolved + mig3_summary
          text = text[:r_start] + resolved + text[d_start:]

          # Advance current diagnosis summary only.
          d_start = text.index('\ndiagnosis_summary:\n')
          p_start = text.index('\npreservation_gate:\n', d_start)
          diag = text[d_start:p_start]
          diag = replace_once(diag, '  resolved_after_diagnosis: 2\n', '  resolved_after_diagnosis: 3\n', 'diagnosis resolved')
          diag = replace_once(diag, '  open_P0_P1: 4\n', '  open_P0_P1: 3\n', 'diagnosis open')
          diag = replace_once(diag, '  result: FAIL_WITH_4_P1_BLOCKERS\n', '  result: FAIL_WITH_3_P1_BLOCKERS\n', 'diagnosis result')
          diag = replace_once(diag, '    - DB-MIG-003\n', '', 'diagnosis required order')
          text = text[:d_start] + diag + text[p_start:]

          # Preservation status reflects DB-MIG-003 close; aggregates remain frozen.
          p_start = text.index('\npreservation_gate:\n')
          n_start = text.index('\nnext_single_step_after_central_gate:\n', p_start)
          pres = text[p_start:n_start]
          pres = replace_once(pres, '  status: PASS_DB_MIG_002\n', '  status: PASS_DB_MIG_003\n', 'preservation status')
          pres = replace_once(pres, '    DB_MIG_002_phase_composition_closed: true\n', '    DB_MIG_002_phase_composition_closed: true\n    DB_MIG_003_cutover_restart_failure_rollback_closed: true\n', 'preservation close flag')
          text = text[:p_start] + pres + text[n_start:]

          # Next step is DB-TST-001 only; aggregates are explicitly frozen until DB-FINAL-001.
          n_start = text.index('\nnext_single_step_after_central_gate:\n')
          nxt = text[n_start:]
          nxt = replace_once(nxt, '  id: DB-MIG-003\n', '  id: DB-TST-001\n', 'next id')
          nxt = replace_once(nxt, '  action: resolve_DB_MIG_003_only_after_next_explicit_user_instruction\n', '  action: resolve_DB_TST_001_only_after_next_explicit_user_instruction\n', 'next action')
          old_allowed = '''  allowed_files_only:
    - specs/database/final-migration-order-invariant-matrix.yml
    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
    - specs/gates/stage-4-database-contract-gate.yml
'''
          new_allowed = '''  allowed_files_only:
    - specs/database/final-migration-order-invariant-matrix.yml
    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md
    - specs/gates/stage-4-database-contract-gate.yml
'''
          nxt = replace_once(nxt, old_allowed, new_allowed, 'next allowed files')
          old_scope = '''  scope_lock: >-
    DB-MIG-001 and DB-MIG-002 are PASS. Resolve DB-MIG-003 only. Preserve
    DB-TST-001, DB-TST-002 and DB-FINAL-001 as OPEN. Do not enter Stage 5,
    generate Laravel migrations, or implement UI/features in the same step.
  after_action: rerun_DB_MIG_003_machine_narrative_central_gate_and_STOP_before_DB_TST_001
'''
          new_scope = '''  aggregate_core_schema_and_docs87_frozen_until_DB_FINAL_001: true
  scope_lock: >-
    DB-MIG-001, DB-MIG-002 and DB-MIG-003 are PASS. Resolve DB-TST-001 only.
    Preserve DB-TST-002 and DB-FINAL-001 as OPEN. Do not modify core-schema.yml
    or docs/87, enter Stage 5, generate Laravel migrations, or implement UI/features.
  after_action: rerun_DB_TST_001_machine_narrative_central_gate_and_STOP_before_DB_TST_002
'''
          nxt = replace_once(nxt, old_scope, new_scope, 'next scope')
          text = text[:n_start] + nxt

          # Structural and preservation gates.
          assert text != original
          dag_after = section(text, 'migration_dependency_dag:\n', '\nmigration_phase_composition:\n')
          phase_after = section(text, 'migration_phase_composition:\n', '\nmigration_cutover_execution_contract:\n')
          assert hashlib.sha256(dag_after.encode()).hexdigest() == dag_sha_before
          assert hashlib.sha256(phase_after.encode()).hexdigest() == phase_sha_before

          new_contract = section(text, 'migration_cutover_execution_contract:\n', '\nblockers:\n')
          assert 'status: PASS_DB_MIG_003' in new_contract
          for phase in ['expand','preflight','write_fence','backfill','reconcile','validate','contract']:
              m = re.search(rf'^    {phase}:\n(.*?)(?=^    [a-z_]+:\n|^  failure_and_resume_matrix:)', new_contract, re.M | re.S)
              assert m, f'missing phase {phase}'
              chunk = m.group(1)
              for required in ['entry_requires:', 'exit_requires:', 'abort_if:', 'restart_posture:', 'rollback_posture:']:
                  assert required in chunk, f'{phase} missing {required}'

          defaults = {
              'extension':'restart_safe','table':'restart_safe','candidate_key':'manual_review','index':'manual_review',
              'foreign_key':'restart_safe','trigger':'restart_safe','projection':'manual_review','constraint':'manual_review'
          }
          assert set(defaults) == node_types
          overrides = {'MIG-IDX-CALENDAR_GIST','MIG-FK-PURCHASE_DOWNSTREAM','MIG-FK-EVENTS','MIG-TRG-EVENTS'}
          assert overrides <= set(node_ids)
          resolved_classes = {node: defaults[typ] for node, typ in node_pairs}
          for node in overrides:
              resolved_classes[node] = 'manual_review'
          assert len(resolved_classes) == len(node_ids)
          assert set(resolved_classes.values()) <= {'restart_safe','manual_review'}

          assert 'allowed_modes:\n      - application_rollback\n      - schema_forward_fix\n      - explicit_safe_down\n' in new_contract
          assert 'destructive_contract_requires_successful_restore_evidence: true' in new_contract
          assert 'required_unresolved_P0_P1_cases_equal_zero' in new_contract
          assert 'automatic_destructive_down_for_formal_financial_audit_history: forbidden' in new_contract
          assert 'stable_test_ids_defined_here: false' in new_contract
          assert 'exact_RPO_RTO_values: external_production_business_policy_not_set_in_DB_MIG_003' in new_contract
          assert 'DB-TST-001\n    severity: P1\n    status: OPEN' in text
          assert 'DB-TST-002\n    severity: P1\n    status: OPEN' in text
          assert 'DB-FINAL-001\n    severity: P1\n    status: OPEN' in text
          assert '  step: DB-MIG-003\n' in text
          assert '  status: FAIL_WITH_3_P1_BLOCKERS\n' in text[:meta_end+200]
          assert '  fixes_applied_total: 3\n' in text
          assert '  status: PASS_DB_MIG_003\n' in text[text.index('\npreservation_gate:\n'):]
          assert '  id: DB-TST-001\n' in text[text.index('\nnext_single_step_after_central_gate:\n'):]

          p.write_text(text)
          PY

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "YAML_PARSE_PASS"' specs/database/final-migration-order-invariant-matrix.yml
          git diff --check
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"

      - name: Remove helper and verify net business diff
        shell: bash
        run: |
          rm .github/workflows/tmp-db-mig-003-machine-validation-20260910.yml
          test "$(git diff --name-only | sort)" = $'.github/workflows/tmp-db-mig-003-machine-validation-20260910.yml\nspecs/database/final-migration-order-invariant-matrix.yml'
          git diff --check
          git diff --stat

      - name: Commit validated machine blob
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DB-MIG-003: define cutover restart and rollback gate"
          git push origin HEAD:tmp-db-mig-003-machine-validation-20260910
