name: tmp-db-mig-003-machine-validation-20260910

on:
  push:
    branches:
      - tmp-db-mig-003-machine-validation-20260910

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-mig-003-machine-validation-20260910
          fetch-depth: 0

      - name: Build and validate machine contract
        shell: bash
        run: |
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "1df9476a116677b07f8f1725c765c09c044d4aac"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
          python3 .tmp/db-mig-003-machine-validator.py
          ruby -rdate -e 'require "yaml"; YAML.safe_load(File.read(ARGV[0]), permitted_classes: [Date], aliases: true); puts "MACHINE_YAML_PARSE_PASS"' specs/database/final-migration-order-invariant-matrix.yml
          git diff --check
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"

      - name: Remove helper artifacts and verify net diff
        shell: bash
        run: |
          rm .github/workflows/tmp-db-mig-003-machine-validation-20260910.yml
          rm .tmp/db-mig-003-machine-contract.yml
          rm .tmp/db-mig-003-machine-validator.py
          rmdir .tmp 2>/dev/null || true
          test "$(git diff --name-only | sort)" = $'.github/workflows/tmp-db-mig-003-machine-validation-20260910.yml\n.tmp/db-mig-003-machine-contract.yml\n.tmp/db-mig-003-machine-validator.py\nspecs/database/final-migration-order-invariant-matrix.yml'
          git diff --check
          git diff --stat

      - name: Commit validated machine result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DB-MIG-003: define cutover restart and rollback gate"
          git push origin HEAD:tmp-db-mig-003-machine-validation-20260910
