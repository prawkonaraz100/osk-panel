name: Temporary DB-PKK-005 Trigger

on:
  push:
    branches:
      - tmp-db-pkk-005-machine-helper

permissions:
  contents: write

jobs:
  validate-and-patch:
    if: github.event.head_commit.message == 'chore: trigger DB-PKK-005 machine gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-pkk-005-machine-helper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python .stage4-tmp/db-pkk-005-machine.py
      - run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "specs/database/pkk.yml"
      - run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          git add specs/database/pkk.yml
          git diff --cached --quiet && { echo 'Expected pkk.yml change missing'; exit 1; }
          git commit -m "DB-PKK-005: close signed XML handoff evidence contract"
          git push origin HEAD:tmp-db-pkk-005-machine-helper
