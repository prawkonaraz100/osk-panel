name: Temporary DB-PKK-006 Machine Gate

on:
  push:
    branches: [tmp-db-pkk-006-machine-helper]
    paths:
      - '.stage4-tmp/TRIGGER_DB_PKK_006_MACHINE'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-pkk-006-machine-helper
      - name: Patch DB-PKK-006 and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('specs/database/pkk.yml')
          s=p.read_text()
          frag=Path('.stage4-tmp/db-pkk-006-machine.ymlfrag').read_text().rstrip()+'\n\n'
          def once(old,new,label):
              global s
              n=s.count(old)
              assert n==1, f'{label}: expected 1, got {n}'
              s=s.replace(old,new,1)
          once('  step: DB_PKK_005_SIGNED_XML_HANDOFF_AND_FILE_ASSET_EVIDENCE_INTEGRITY\n',
               '  step: DB_PKK_006_SENSITIVE_PROVIDER_PAYLOAD_ENCRYPTION_REDACTION_HASH_AND_KEY_VERSION_BOUNDARY\n','meta.step')
          once('  status: FAIL_WITH_3_P1_BLOCKERS\n','  status: FAIL_WITH_2_P1_BLOCKERS\n','meta.status')
          once('  current_step_scope: DB_PKK_005_SIGNED_XML_HANDOFF_AND_FILE_ASSET_EVIDENCE_INTEGRITY_only\n',
               '  current_step_scope: DB_PKK_006_SENSITIVE_PROVIDER_PAYLOAD_ENCRYPTION_REDACTION_HASH_AND_KEY_VERSION_BOUNDARY_only\n','scope')
          marker='\nblockers:\n'
          assert s.count(marker)==1
          assert '\n  DB-PKK-006:\n    status: PASS\n' not in s
          s=s.replace(marker,'\n'+frag+'blockers:\n',1)
          once('  - id: DB-PKK-006\n    title: sensitive_provider_payload_encryption_redaction_hash_and_key_version_boundary\n    severity: P1\n    status: OPEN\n',
               '  - id: DB-PKK-006\n    title: sensitive_provider_payload_encryption_redaction_hash_and_key_version_boundary\n    severity: P1\n    status: RESOLVED\n    resolution_ref: resolved_contracts.DB-PKK-006\n','blocker006')
          old='''diagnosis_summary:\n  diagnosed_P0: 0\n  diagnosed_P1: 8\n  resolved_in_diagnosis: 0\n  resolved_after_diagnosis: 5\n  open_P0_P1: 3\n  result: FAIL_WITH_3_P1_BLOCKERS\n  blockers_in_required_fix_order:\n    - DB-PKK-006\n    - DB-PKK-007\n    - DB-PKK-008\n'''
          new='''diagnosis_summary:\n  diagnosed_P0: 0\n  diagnosed_P1: 8\n  resolved_in_diagnosis: 0\n  resolved_after_diagnosis: 6\n  open_P0_P1: 2\n  result: FAIL_WITH_2_P1_BLOCKERS\n  blockers_in_required_fix_order:\n    - DB-PKK-007\n    - DB-PKK-008\n'''
          once(old,new,'diagnosis_summary')
          once('preservation_gate:\n  status: PASS_DB_PKK_005\n','preservation_gate:\n  status: PASS_DB_PKK_006\n','preservation status')
          once('    DB_PKK_006_through_DB_PKK_008_remain_open: true\n',
               '    DB_PKK_006_sensitive_payload_encryption_redaction_hash_key_version_boundary_closed: true\n    DB_PKK_007_and_DB_PKK_008_remain_open: true\n','preservation tail')
          old_next='''next_single_step_after_central_gate:\n  id: DB_PKK_006_SENSITIVE_PROVIDER_PAYLOAD_ENCRYPTION_REDACTION_HASH_AND_KEY_VERSION_BOUNDARY\n  action: resolve_DB_PKK_006_only_after_next_explicit_user_instruction\n  allowed_scope:\n    - specs/database/pkk.yml\n    - docs/113-stage-4-pkk-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  aggregate_files_frozen:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n  stop_before: DB_PKK_007_INTEGRATION_CONFIGURATION_REVISION_BINDING_AND_ASYNC_EXECUTION_CONTEXT\n'''
          new_next='''next_single_step_after_central_gate:\n  id: DB_PKK_007_INTEGRATION_CONFIGURATION_REVISION_BINDING_AND_ASYNC_EXECUTION_CONTEXT\n  action: resolve_DB_PKK_007_only_after_next_explicit_user_instruction\n  allowed_scope:\n    - specs/database/pkk.yml\n    - docs/113-stage-4-pkk-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  aggregate_files_frozen:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n  stop_before: DB_PKK_008_DETERMINISTIC_OPERATION_HISTORY_LATEST_AND_COURSE_SUMMARY_PROJECTION\n'''
          once(old_next,new_next,'next step')
          p.write_text(s)
          PY
          ruby -e "require 'yaml'; y=YAML.unsafe_load_file('specs/database/pkk.yml'); raise unless y.dig('meta','step')=='DB_PKK_006_SENSITIVE_PROVIDER_PAYLOAD_ENCRYPTION_REDACTION_HASH_AND_KEY_VERSION_BOUNDARY'; raise unless y.dig('meta','status')=='FAIL_WITH_2_P1_BLOCKERS'; r=y['resolved_contracts']; %w[DB-PKK-001 DB-PKK-002 DB-PKK-003 DB-PKK-004 DB-PKK-005 DB-PKK-006].each{|k| raise k unless r.dig(k,'status')=='PASS'}; c=r['DB-PKK-006']; raise unless c.dig('protected_payload_table','name')=='pkk_protected_payloads'; raise unless c.dig('payload_key_wrapping_table','name')=='pkk_protected_payload_key_wrappings'; raise unless c.dig('redacted_projection_table','name')=='pkk_payload_redacted_projections'; raise unless c.dig('authenticated_encryption_profile','runtime_crypto_profile_v1','aead_algorithm')=='AES_256_GCM'; raise unless c.dig('authority_and_scope','DB_PKK_002_snapshot_content_hash_semantics_redefined')==false; raise unless c.dig('key_rotation_semantics','decrypt_and_reencrypt_business_payload_ciphertext_for_normal_KEK_rotation')==false; raise unless c.dig('signature_XML_storage_protection','protection_table')=='pkk_signature_file_asset_protections'; b=y['blockers'].to_h{|x| [x['id'],x['status']]}; %w[DB-PKK-001 DB-PKK-002 DB-PKK-003 DB-PKK-004 DB-PKK-005 DB-PKK-006].each{|k| raise k unless b[k]=='RESOLVED'}; %w[DB-PKK-007 DB-PKK-008].each{|k| raise k unless b[k]=='OPEN'}; raise unless y.dig('diagnosis_summary','resolved_after_diagnosis')==6; raise unless y.dig('diagnosis_summary','open_P0_P1')==2; raise unless y.dig('diagnosis_summary','result')=='FAIL_WITH_2_P1_BLOCKERS'; raise unless y.dig('preservation_gate','status')=='PASS_DB_PKK_006'; raise unless y.dig('next_single_step_after_central_gate','id')=='DB_PKK_007_INTEGRATION_CONFIGURATION_REVISION_BINDING_AND_ASYNC_EXECUTION_CONTEXT'"
          git diff --check -- specs/database/pkk.yml
          test "$(git diff --name-only | grep -v '^\.github/workflows/tmp-db-pkk-006-machine.yml$' | grep -v '^\.stage4-tmp/' | sort -u)" = "specs/database/pkk.yml"
          git config user.name 'prawkonaraz100'
          git config user.email 'prawkonaraz100@gmail.com'
          git add specs/database/pkk.yml
          git commit -m 'DB-PKK-006: close sensitive payload crypto redaction contract'
          git push origin HEAD:tmp-db-pkk-006-machine-helper
