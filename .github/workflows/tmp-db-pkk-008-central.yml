name: Temporary DB-PKK-008 Central Gate

on:
  push:
    branches: [tmp-db-pkk-008-central-helper]
    paths:
      - '.stage4-tmp/TRIGGER_DB_PKK_008_CENTRAL'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-pkk-008-central-helper
      - name: Patch and validate central gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('specs/gates/stage-4-database-contract-gate.yml')
          s=p.read_text()
          frag=Path('.stage4-tmp/db-pkk-008-central.ymlfrag').read_text().rstrip()+'\n\n'

          old_slice='''  - id: DB4_8_PKK\n    status: FAIL_WITH_1_P1_BLOCKER\n    diagnosis: COMPLETE\n    blockers_diagnosed: 8\n    blockers_resolved: 7\n    open_P0_P1: 1\n    final_aggregate_sync: NOT_STARTED\n    result: FAIL_WITH_1_P1_BLOCKER\n'''
          new_slice='''  - id: DB4_8_PKK\n    status: BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC\n    diagnosis: COMPLETE\n    blockers_diagnosed: 8\n    blockers_resolved: 8\n    open_P0_P1: 0\n    final_aggregate_sync: PENDING\n    result: BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC\n'''
          assert s.count(old_slice)==1,s.count(old_slice)
          s=s.replace(old_slice,new_slice,1)

          marker='\nresolved_blockers:\n'
          assert s.count(marker)==1,s.count(marker)
          assert '  pkk_deterministic_operation_history_latest_and_course_summary_projection:\n' not in s
          s=s.replace(marker,'\n'+frag+'resolved_blockers:\n',1)

          old_resolved='''  - DB-PKK-005\n  - DB-PKK-006\n  - DB-PKK-007\n\nopen_blockers_current_diagnosed_scope:\n  - DB-PKK-008\n'''
          new_resolved='''  - DB-PKK-005\n  - DB-PKK-006\n  - DB-PKK-007\n  - DB-PKK-008\n\nopen_blockers_current_diagnosed_scope: []\n'''
          assert s.count(old_resolved)==1,s.count(old_resolved)
          s=s.replace(old_resolved,new_resolved,1)

          assert s.count('  current_result: DB4_8_FAIL_WITH_1_P1_BLOCKER\n')==1
          s=s.replace('  current_result: DB4_8_FAIL_WITH_1_P1_BLOCKER\n','  current_result: DB4_8_BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC\n',1)
          gate_old='''  DB4_8_DB_PKK_007_result: PASS\n  DB4_8_result: FAIL_WITH_1_P1_BLOCKER\n'''
          gate_new='''  DB4_8_DB_PKK_007_result: PASS\n  DB4_8_DB_PKK_008_result: PASS\n  DB4_8_result: BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC\n'''
          assert s.count(gate_old)==1,s.count(gate_old)
          s=s.replace(gate_old,gate_new,1)

          old_next='''next_single_step:\n  id: DB_PKK_008_DETERMINISTIC_OPERATION_HISTORY_LATEST_AND_COURSE_SUMMARY_PROJECTION\n  action: resolve_DB_PKK_008_only_after_next_explicit_user_instruction\n  allowed_scope:\n    - specs/database/pkk.yml\n    - docs/113-stage-4-pkk-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  aggregate_files_frozen:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n  scope_lock: >-\n    Resolve only DB-PKK-008 deterministic operation history latest and course\n    summary projection. Do not enter DB4_9 or later slices in the same step, do\n    not start Stage 5, do not create Laravel migrations and do not start UI or\n    feature implementation.\n  after_action: rerun_DB_PKK_008_machine_narrative_central_gate_and_STOP_before_DB4_8_FINAL_AGGREGATE_SYNC\n'''
          new_next='''next_single_step:\n  id: DB4_8_FINAL_AGGREGATE_SYNC\n  action: sync_DB4_8_resolved_contracts_to_aggregate_only_after_next_explicit_user_instruction\n  allowed_scope:\n    - specs/database/pkk.yml\n    - docs/113-stage-4-pkk-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n  aggregate_files_frozen_until_next_explicit_user_instruction:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n  scope_lock: >-\n    Synchronize only the resolved DB-PKK-001 through DB-PKK-008 contracts into\n    the DB4_8 aggregate machine and narrative documents, then update bounded audit\n    and central gate. Do not enter DB4_9, Stage 5, Laravel migrations or UI in the\n    same step.\n  after_action: rerun_DB4_8_final_aggregate_sync_gate_and_STOP_before_DB4_9\n'''
          assert s.count(old_next)==1,s.count(old_next)
          s=s.replace(old_next,new_next,1)

          p.write_text(s)
          d=yaml.safe_load(s)
          sl=next(x for x in d['stage_4_slices'] if x['id']=='DB4_8_PKK')
          assert sl['status']=='BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC'
          assert sl['blockers_resolved']==8 and sl['open_P0_P1']==0
          assert sl['final_aggregate_sync']=='PENDING'
          assert sl['result']=='BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC'
          q=d['quality_checks']['pkk_deterministic_operation_history_latest_and_course_summary_projection']
          assert q['status']=='PASS' and q['resolved_blocker_id']=='DB-PKK-008'
          assert d['open_blockers_current_diagnosed_scope']==[]
          assert 'DB-PKK-008' in d['resolved_blockers']
          assert d['gate_definition']['DB4_8_DB_PKK_008_result']=='PASS'
          assert d['gate_definition']['DB4_8_result']=='BLOCKERS_RESOLVED_PENDING_FINAL_AGGREGATE_SYNC'
          assert d['next_single_step']['id']=='DB4_8_FINAL_AGGREGATE_SYNC'
          assert next(x for x in d['stage_4_slices'] if x['id']=='DB4_9_STUDENT_FINANCE_COMMERCE')['status']=='NOT_STARTED'
          assert d['gate_definition']['may_start_stage_5'] is False
          assert d['gate_definition']['may_start_UI_or_feature_implementation'] is False
          PY
          git diff --check -- specs/gates/stage-4-database-contract-gate.yml
          test "$(git diff --name-only | grep -v '^\.github/workflows/tmp-db-pkk-008-central.yml$' | grep -v '^\.stage4-tmp/' | sort -u)" = "specs/gates/stage-4-database-contract-gate.yml"
          git config user.name 'prawkonaraz100'
          git config user.email 'prawkonaraz100@gmail.com'
          git add specs/gates/stage-4-database-contract-gate.yml
          git commit -m 'DB-PKK-008: close central database contract gate'
          git push origin HEAD:tmp-db-pkk-008-central-helper
