name: tmp-db-tst-001-central-validation-20260910
on:
  push:
    branches:
      - tmp-db-tst-001-central-validation-20260910
permissions:
  contents: write
jobs:
  validate-central:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-001-central-validation-20260910
          fetch-depth: 0
      - name: Build and validate DB-TST-001 central gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = "bcf645967d19a0c02a4db4cd13c8fa046d36a954"
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "b658c5fcd8ba1f451b2b01e807c6e88ab703f234"
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = "45f584bd36206c0b13592dbaf40bb55801cfac63"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.tmp/db-tst-001-central-builder.py')
          s = p.read_text()
          old = "quality_block = '''      UI_or_feature_implementation_started: false\n\n  DB4_11_DB_TST_001:"
          new = "quality_block = '''  DB4_11_DB_TST_001:"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .tmp/db-tst-001-central-builder.py
          git diff --check
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          class UniqueKeyLoader(yaml.SafeLoader):
              pass
          def construct_mapping(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      raise AssertionError(f'duplicate YAML key: {key}')
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping
          UniqueKeyLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, construct_mapping)
          data = yaml.load(Path('specs/gates/stage-4-database-contract-gate.yml').read_text(), Loader=UniqueKeyLoader)
          gd = data['gate_definition']
          assert gd['DB4_11_diagnosis_result'] == 'FAIL_WITH_6_P1_BLOCKERS'
          assert gd['DB4_11_DB_TST_001_result'] == 'PASS'
          assert gd['DB4_11_DB_TST_002_result'] == 'OPEN'
          assert gd['DB4_11_DB_FINAL_001_result'] == 'OPEN'
          assert gd['DB4_11_result'] == 'FAIL_WITH_2_P1_BLOCKERS'
          assert data['next_single_step']['id'] == 'DB-TST-002'
          q = data['quality_checks']['DB4_11_DB_TST_001']
          assert q['checks']['test_class_counts_sum_to_261'] == 'PASS'
          assert q['checks']['class_count_migration_postcheck'] == 0
          print('CENTRAL_YAML_UNIQUE_KEYS_PASS')
          PY
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "b658c5fcd8ba1f451b2b01e807c6e88ab703f234"
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = "45f584bd36206c0b13592dbaf40bb55801cfac63"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
      - name: Remove helper and verify net tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/db-tst-001-central-builder.py
          rm -f .github/workflows/tmp-db-tst-001-central-validation-20260910.yml
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' '.github/workflows/tmp-db-tst-001-central-validation-20260910.yml' '.tmp/db-tst-001-central-builder.py' 'specs/gates/stage-4-database-contract-gate.yml')"
          test "$changed" = "$expected"
      - name: Commit central gate result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DB-TST-001: close central database contract gate"
          git push origin HEAD:tmp-db-tst-001-central-validation-20260910
