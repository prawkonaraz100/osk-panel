name: tmp-db-tst-001-classification-correction-20260910
on:
  push:
    branches:
      - tmp-db-tst-001-machine-validation-20260910
permissions:
  contents: write
jobs:
  validate-correction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-001-machine-validation-20260910
          fetch-depth: 0
      - name: Correct and validate test classes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "2c0660b82454701709d487a11b385997c484f2dc"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = "5668ed5d3e555953e8dafa3b37ad68ddd447089a"
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = "bcf645967d19a0c02a4db4cd13c8fa046d36a954"
          python3 .tmp/db-tst-001-classification-correction.py
          ruby -e 'require "yaml"; require "date"; d=YAML.safe_load(File.read(ARGV[0]), permitted_classes:[Date], aliases:true); m=d.fetch("invariant_test_matrix"); raise unless m.fetch("tests").size==261; c=m.fetch("class_counts"); exp={"concurrency"=>15,"migration_postcheck"=>0,"migration_preflight"=>14,"projection"=>21,"schema_constraint"=>23,"security_storage"=>46,"transaction"=>142}; raise "counts #{c.inspect}" unless c==exp; raise unless c.values.sum==261; puts "DB_TST_001_CORRECTED_MATRIX_PARSE_PASS"' specs/database/final-migration-order-invariant-matrix.yml
          git diff --check
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = "5668ed5d3e555953e8dafa3b37ad68ddd447089a"
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = "bcf645967d19a0c02a4db4cd13c8fa046d36a954"
      - name: Remove correction helper and verify net tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/db-tst-001-classification-correction.py
          rm -f .github/workflows/tmp-db-tst-001-classification-correction-20260910.yml
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' '.github/workflows/tmp-db-tst-001-classification-correction-20260910.yml' '.tmp/db-tst-001-classification-correction.py' 'specs/database/final-migration-order-invariant-matrix.yml')"
          test "$changed" = "$expected"
      - name: Commit corrected matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DB-TST-001: refine invariant test classifications"
          git push origin HEAD:tmp-db-tst-001-machine-validation-20260910
