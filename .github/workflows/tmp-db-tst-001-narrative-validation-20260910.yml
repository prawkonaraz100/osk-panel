name: tmp-db-tst-001-narrative-validation-20260910
on:
  push:
    branches:
      - tmp-db-tst-001-narrative-validation-20260910
permissions:
  contents: write
jobs:
  validate-narrative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-001-narrative-validation-20260910
          fetch-depth: 0
      - name: Build and validate DB-TST-001 narrative
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "b658c5fcd8ba1f451b2b01e807c6e88ab703f234"
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = "5668ed5d3e555953e8dafa3b37ad68ddd447089a"
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = "bcf645967d19a0c02a4db4cd13c8fa046d36a954"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
          python3 .tmp/db-tst-001-narrative-builder.py
          git diff --check
          grep -q 'DB-TST-002 — invariant_test_coverage_traceability_and_completeness_gate' docs/116-stage-4-final-migration-order-invariant-matrix-audit.md
          ! grep -q 'STOP przed fixerem DB-TST-001' docs/116-stage-4-final-migration-order-invariant-matrix-audit.md
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "b658c5fcd8ba1f451b2b01e807c6e88ab703f234"
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = "bcf645967d19a0c02a4db4cd13c8fa046d36a954"
          test "$(git hash-object specs/database/core-schema.yml)" = "39958721c99550cfc27c3774e8dfa1af0d0637e6"
          test "$(git hash-object docs/87-physical-database-schema.md)" = "6c090b082604b6b42c283667fcf08e9033a5b523"
      - name: Remove helper and verify net tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/db-tst-001-narrative-builder.py
          rm -f .github/workflows/tmp-db-tst-001-narrative-validation-20260910.yml
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' '.github/workflows/tmp-db-tst-001-narrative-validation-20260910.yml' '.tmp/db-tst-001-narrative-builder.py' 'docs/116-stage-4-final-migration-order-invariant-matrix-audit.md')"
          test "$changed" = "$expected"
      - name: Commit narrative result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DB-TST-001: align invariant test matrix narrative"
          git push origin HEAD:tmp-db-tst-001-narrative-validation-20260910
