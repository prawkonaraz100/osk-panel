name: tmp-db-tst-002-coverage-discovery-20260910
on:
  push:
    branches:
      - tmp-db-tst-002-machine-validation-20260910
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-002-machine-validation-20260910
          fetch-depth: 0
      - name: Score aggregate coverage joins
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'; require 'date'; require 'json'; require 'set'
          def y(p); YAML.safe_load(File.read(p), permitted_classes:[Date], aliases:true); end
          core=y('specs/database/core-schema.yml'); m=y('specs/database/final-migration-order-invariant-matrix.yml')
          tests=m.dig('invariant_test_matrix','tests') || []
          stop=Set.new(%w[the a an and or is are be to of for from with without by on in at as per one same exact current final required require requires database db true false commit commits row rows state table tables field fields value values])
          def toks(s,stop); s.to_s.downcase.gsub(/[^a-z0-9]+/,' ').split.reject{|x|stop.include?(x)||x.length<3}.uniq; end
          def score(a,b,stop); aa=toks(a,stop); bb=toks(b,stop); u=aa|bb; u.empty? ? 0.0 : (aa&bb).length.to_f/u.length; end
          def domain(text)
            s=text.downcase
            return 'EVT' if s.match?(/domain_event|event_type_catalog|event_policy/)
            return 'AUD' if s.match?(/audit|outbox|activity|notification/)
            return 'EXAM' if s.match?(/internal_exam|exam_/)
            return 'PKK' if s.include?('pkk')
            return 'LIC' if s.match?(/learning_account|license_|licens|credential|entitlement|activation/)
            return 'CAL' if s.match?(/calendar|availability|resource_claim|important_date/)
            return 'TRN' if s.match?(/training_session|attendance|course_enrollment|course_|student_|recognized_external|requirement_profile|training_credit/)
            return 'FIN' if s.match?(/student_charge|student_payment|student_finance/)
            return 'COM' if s.match?(/order_|order_item|payment_|product_|inventory_purchase|service_purchase|purchase_history|commerce/)
            return 'RES' if s.match?(/staff_|vehicle|location|file_asset|document_current|instructor/)
            return 'IAM' if s.match?(/membership|permission|scope|owner|auth_session|role_template|authorization/)
            'CORE'
          end
          [['critical_constraints', core['critical_constraints']||{}],['transactional_invariants',core['transactional_invariants']||{}]].each do |label,h|
            fall=[]; dist=Hash.new(0); lows=[]
            h.each do |k,v|
              text="#{k} #{JSON.generate(v)}"; d=domain(text); dist[d]+=1
              pool=tests.select{|t|t['test_id'].start_with?("DBT-#{d}-")}; pool=tests if pool.empty?
              ranked=pool.map{|t|[score(text,t['source_invariant'],stop),t['test_id'],t['source_invariant']]}.sort_by{|x|[-x[0],x[1]]}
              best=ranked.first
              fall << [k,d,best] if !best || best[0] < 0.08
              lows << [k,d,best] if best && best[0] < 0.16
            end
            puts "#{label.upcase}_COUNT=#{h.length}"
            puts "#{label.upcase}_DOMAIN_DIST=#{JSON.generate(dist)}"
            puts "#{label.upcase}_FALLBACK_LT_008=#{fall.length}"
            fall.first(30).each{|x|puts "FALLBACK #{label} #{JSON.generate(x)}"}
            puts "#{label.upcase}_LOW_LT_016=#{lows.length}"
          end
          RUBY
