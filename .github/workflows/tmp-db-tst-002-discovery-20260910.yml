name: tmp-db-tst-002-discovery-20260910
on:
  push:
    branches:
      - tmp-db-tst-002-discovery-20260910
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-002-discovery-20260910
          fetch-depth: 0
      - name: Inventory DB-TST-002 source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 6419481d39721238792a2a0bbb852622936fb993 -- specs/database specs/gates docs/116-stage-4-final-migration-order-invariant-matrix-audit.md docs/87-physical-database-schema.md
          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'
          def load_yaml(path)
            YAML.safe_load(File.read(path), permitted_classes: [Date], aliases: true)
          end
          files = %w[
            specs/database/organization-settings.yml
            specs/database/identity-rbac.yml
            specs/database/staff-locations-vehicles.yml
            specs/database/students-courses-training.yml
            specs/database/calendar.yml
            specs/database/licenses-learning-access.yml
            specs/database/internal-exams.yml
            specs/database/pkk.yml
            specs/database/student-finance-commerce.yml
            specs/database/audit-outbox-notifications.yml
          ]
          def walk(v, path=[], out=[])
            case v
            when Hash
              v.each do |k,val|
                p2 = path + [k.to_s]
                if k.to_s.match?(/tests_required$/) || k.to_s.match?(/critical.*constraint/i) || k.to_s.match?(/constraint.*critical/i) || k.to_s.match?(/guard/i)
                  out << [p2.join('.'), val]
                end
                walk(val,p2,out)
              end
            when Array
              v.each_with_index { |x,i| walk(x,path+[i.to_s],out) }
            end
            out
          end
          summary = {}
          parse_errors = {}
          files.each do |f|
            begin
              data = load_yaml(f)
              hits = walk(data)
              summary[f] = hits.map do |path,val|
                count = val.is_a?(Array) || val.is_a?(Hash) ? val.length : 1
                {path: path, type: val.class.name, count: count, sample: (val.is_a?(Array) ? val.first(3) : val)}
              end
            rescue => e
              parse_errors[f] = "#{e.class}: #{e.message}"
              lines = File.readlines(f)
              line = e.message[/line (\d+)/, 1]&.to_i
              if line
                lo = [line-4, 1].max
                hi = [line+4, lines.length].min
                parse_errors[f] += "\nCONTEXT #{lo}-#{hi}:\n" + lines[(lo-1)..(hi-1)].join
              end
            end
          end
          puts "=== PARSE ERRORS ==="
          puts JSON.pretty_generate(parse_errors)
          puts "=== SOURCE INVENTORY ==="
          puts JSON.pretty_generate(summary)
          if parse_errors.any?
            exit 2
          end
          central = load_yaml('specs/gates/stage-4-database-contract-gate.yml')
          matrix = load_yaml('specs/database/final-migration-order-invariant-matrix.yml')
          puts "=== RESOLVED BLOCKERS ==="
          puts JSON.generate(central['resolved_blockers'])
          tests = matrix.dig('invariant_test_matrix','tests') || []
          puts "=== FINAL TEST IDS ==="
          puts JSON.generate(tests.map{|t| [t['test_id'],t['source_invariant'],t['source_refs'],t['test_class']]})
          RUBY
