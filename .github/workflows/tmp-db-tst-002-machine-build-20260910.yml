name: tmp-db-tst-002-machine-build-20260910
on:
  push:
    branches:
      - tmp-db-tst-002-machine-validation-20260910
permissions:
  contents: write
jobs:
  validate-machine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-002-machine-validation-20260910
          fetch-depth: 0
      - name: Assert accepted inputs and build coverage contract
        shell: bash
        run: |
          set -euo pipefail
          BASE=fce172975531c9643d907d3b43ea503d6a249b42
          TARGET=specs/database/final-migration-order-invariant-matrix.yml
          git diff --quiet "$BASE" -- specs/database specs/gates docs/116-stage-4-final-migration-order-invariant-matrix-audit.md docs/87-physical-database-schema.md
          test "$(git rev-parse ${BASE}:$TARGET)" = b658c5fcd8ba1f451b2b01e807c6e88ab703f234
          test "$(git rev-parse ${BASE}:specs/gates/stage-4-database-contract-gate.yml)" = 61ab952b37f31b410634b3db4c5aaa1e67749550
          test "$(git rev-parse ${BASE}:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 45f584bd36206c0b13592dbaf40bb55801cfac63
          test "$(git rev-parse ${BASE}:specs/database/core-schema.yml)" = 39958721c99550cfc27c3774e8dfa1af0d0637e6
          test "$(git rev-parse ${BASE}:docs/87-physical-database-schema.md)" = 6c090b082604b6b42c283667fcf08e9033a5b523
          ruby .tmp/db_tst_002_build.rb
          git diff --check
      - name: Independently validate zero-gap machine joins
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'; require 'date'; require 'set'
          def ytext(s); YAML.safe_load(s, permitted_classes:[Date], aliases:true); end
          def yfile(p); ytext(File.read(p)); end
          base='fce172975531c9643d907d3b43ea503d6a249b42'
          path='specs/database/final-migration-order-invariant-matrix.yml'
          before=ytext(`git show #{base}:#{path}`)
          after=yfile(path)
          %w[migration_dependency_dag migration_phase_composition migration_cutover_execution_contract invariant_test_matrix].each do |k|
            abort "authority drift #{k}" unless before[k] == after[k]
          end
          abort 'wrong step' unless after.dig('meta','step') == 'DB-TST-002'
          abort 'wrong status' unless after.dig('meta','status') == 'FAIL_WITH_1_P1_BLOCKER'
          c=after['test_coverage_traceability_contract'] or abort 'missing coverage contract'
          abort 'coverage status' unless c['status']=='PASS_DB_TST_002'
          base_tests=after.dig('invariant_test_matrix','tests') || []
          anchors=c.dig('final_test_catalog','coverage_anchor_tests') || []
          abort 'base count' unless base_tests.length==261
          abort 'anchor count' unless anchors.length==229
          all=base_tests+anchors
          ids=all.map{|t|t['test_id']}
          abort 'final count' unless ids.length==490 && ids.uniq.length==490
          known=ids.to_set
          blockers=c['resolved_blocker_coverage'] || []
          abort 'blocker count' unless blockers.length==76 && blockers.map{|x|x['blocker_id']}.uniq.length==76
          abort 'missing DB-TST-002 self coverage' unless blockers.any?{|x|x['blocker_id']=='DB-TST-002'}
          abort 'DB-FINAL mapped early' if blockers.any?{|x|x['blocker_id']=='DB-FINAL-001'}
          critical=c['critical_constraint_coverage'] || []
          tx=c['transactional_invariant_coverage'] || []
          abort 'critical coverage count' unless critical.length==183
          abort 'transaction coverage count' unless tx.length==45
          [blockers,critical,tx].flatten.each do |e|
            refs=e['final_test_ids'] || []
            abort "empty final refs #{e.inspect}" if refs.empty?
            refs.each{|id|abort "unknown final ref #{id}" unless known.include?(id)}
          end
          local=c.dig('bounded_local_required_test_preservation','groups') || []
          abort 'local group count mismatch' unless local.length == c.dig('bounded_local_required_test_preservation','group_count')
          abort 'local occurrence mismatch' unless local.sum{|g|g['local_test_count']}==1581
          abort 'unowned local group' if local.any?{|g|g['owner_blocker'].nil?}
          abort 'fuzzy equivalence must be disabled' unless c.dig('bounded_local_required_test_preservation','fuzzy_equivalence_is_not_assumed')==true
          local.each do |g|
            abort 'missing local tests' unless g['local_tests'].is_a?(Array) && g['local_tests'].length==g['local_test_count']
            (g['exact_final_test_ids']||[]).each{|id|abort "unknown local exact ref #{id}" unless known.include?(id)}
          end
          z=c['zero_gap_summary'] || {}
          abort 'zero gap result' unless z['result']=='PASS_ZERO_GAPS'
          abort 'resolved gaps' unless z['resolved_blockers_without_coverage']==[]
          abort 'critical gaps' unless z['critical_constraints_without_final_test_id']==[]
          abort 'transaction gaps' unless z['transactional_invariants_without_final_test_id']==[]
          abort 'local gaps' unless z['bounded_local_required_test_occurrences_not_preserved']==0
          abort 'unknown refs' unless z['unknown_final_test_refs']==[] && z['unknown_or_orphan_source_refs']==[]
          post=c.dig('migration_coverage_status','migration_postcheck_final_test_ids') || []
          abort 'missing migration postcheck' if post.empty?
          post.each{|id|abort 'postcheck unknown' unless known.include?(id)}
          blocker=after['blockers'].find{|b|b['id']=='DB-TST-002'}
          final_blocker=after['blockers'].find{|b|b['id']=='DB-FINAL-001'}
          abort 'DB-TST-002 not PASS' unless blocker && blocker['status']=='PASS'
          abort 'DB-FINAL-001 changed early' unless final_blocker && final_blocker['status']=='OPEN'
          abort 'summary result' unless after.dig('diagnosis_summary','result')=='FAIL_WITH_1_P1_BLOCKER'
          abort 'summary open' unless after.dig('diagnosis_summary','open_P0_P1')==1
          abort 'next step' unless after.dig('next_single_step_after_central_gate','id')=='DB-FINAL-001'
          puts "DB_TST_002_MACHINE_VALIDATION=PASS final=#{ids.length} blockers=#{blockers.length} critical=#{critical.length} tx=#{tx.length} local=1581"
          RUBY
          test "$(git hash-object specs/database/core-schema.yml)" = 39958721c99550cfc27c3774e8dfa1af0d0637e6
          test "$(git hash-object docs/87-physical-database-schema.md)" = 6c090b082604b6b42c283667fcf08e9033a5b523
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = 61ab952b37f31b410634b3db4c5aaa1e67749550
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 45f584bd36206c0b13592dbaf40bb55801cfac63
      - name: Remove helpers and prove one-file net tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=fce172975531c9643d907d3b43ea503d6a249b42
          git rm .github/workflows/tmp-db-tst-002-machine-discovery-20260910.yml
          git rm .github/workflows/tmp-db-tst-002-coverage-discovery-20260910.yml
          git rm .github/workflows/tmp-db-tst-002-machine-build-20260910.yml
          git rm .tmp/db_tst_002_build.rb
          git add specs/database/final-migration-order-invariant-matrix.yml
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = specs/database/final-migration-order-invariant-matrix.yml
          git diff --cached --check
          git diff --cached --stat "$BASE"
      - name: Commit validated helper tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DB-TST-002: define zero-gap coverage traceability gate'
          git push origin HEAD:tmp-db-tst-002-machine-validation-20260910
