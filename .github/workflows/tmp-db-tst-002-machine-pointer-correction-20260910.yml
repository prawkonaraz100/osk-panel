name: tmp-db-tst-002-machine-pointer-correction-20260910
on:
  push:
    branches:
      - tmp-db-tst-002-machine-pointer-correction-20260910
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-db-tst-002-machine-pointer-correction-20260910
          fetch-depth: 0
      - name: Patch only DB-FINAL-001 allowed-files pointer
        shell: bash
        run: |
          set -euo pipefail
          BASE=6fce050bfb40221714b0a239c71b83c65df2ef60
          TARGET=specs/database/final-migration-order-invariant-matrix.yml
          test "$(git rev-parse ${BASE}:$TARGET)" = 063de6a60732e370f006b3970cee8df06811d00c
          test "$(git rev-parse ${BASE}:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 1b962ab102956f15c59be4af24c84b8dfdf2eba5
          python3 <<'PY'
          from pathlib import Path
          p=Path('specs/database/final-migration-order-invariant-matrix.yml')
          s=p.read_text()
          old='''next_single_step_after_central_gate:\n  id: DB-FINAL-001\n  action: resolve_DB_FINAL_001_only_after_next_explicit_user_instruction\n  allowed_files_only:\n    - specs/database/final-migration-order-invariant-matrix.yml\n    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  prior_bounded_context_specs_read_only: true\n  aggregate_core_schema_and_docs87_frozen_until_DB_FINAL_001: true\n'''
          new='''next_single_step_after_central_gate:\n  id: DB-FINAL-001\n  action: resolve_DB_FINAL_001_only_after_next_explicit_user_instruction\n  allowed_files_only:\n    - specs/database/core-schema.yml\n    - docs/87-physical-database-schema.md\n    - specs/database/final-migration-order-invariant-matrix.yml\n    - docs/116-stage-4-final-migration-order-invariant-matrix-audit.md\n    - specs/gates/stage-4-database-contract-gate.yml\n  prior_bounded_context_specs_read_only: true\n  aggregate_core_schema_and_docs87_frozen_until_entry_to_DB_FINAL_001: true\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Revalidate DB-TST-002 semantics and narrative alignment
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'; require 'date'
          def y(p); YAML.safe_load(File.read(p), permitted_classes:[Date], aliases:true); end
          m=y('specs/database/final-migration-order-invariant-matrix.yml')
          c=m['test_coverage_traceability_contract'] or abort
          abort unless c['status']=='PASS_DB_TST_002'
          abort unless c.dig('final_test_catalog','base_test_count')==261
          abort unless c.dig('final_test_catalog','coverage_anchor_test_count')==229
          abort unless c.dig('final_test_catalog','total_final_test_ids')==490
          abort unless c.dig('zero_gap_summary','result')=='PASS_ZERO_GAPS'
          abort unless m.dig('diagnosis_summary','result')=='FAIL_WITH_1_P1_BLOCKER'
          n=m['next_single_step_after_central_gate'] or abort
          abort unless n['id']=='DB-FINAL-001'
          expected=['specs/database/core-schema.yml','docs/87-physical-database-schema.md','specs/database/final-migration-order-invariant-matrix.yml','docs/116-stage-4-final-migration-order-invariant-matrix-audit.md','specs/gates/stage-4-database-contract-gate.yml']
          abort unless n['allowed_files_only']==expected
          abort unless n['aggregate_core_schema_and_docs87_frozen_until_entry_to_DB_FINAL_001']==true
          d=File.read('docs/116-stage-4-final-migration-order-invariant-matrix-audit.md')
          abort unless d.include?('DB-FINAL-001 jest pierwszym krokiem uprawnionym do synchronizacji `core-schema.yml` i `docs/87...`')
          puts 'DB_TST_002_MACHINE_POINTER_CORRECTION=PASS'
          RUBY
          test "$(git hash-object specs/database/core-schema.yml)" = 39958721c99550cfc27c3774e8dfa1af0d0637e6
          test "$(git hash-object docs/87-physical-database-schema.md)" = 6c090b082604b6b42c283667fcf08e9033a5b523
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 1b962ab102956f15c59be4af24c84b8dfdf2eba5
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = 61ab952b37f31b410634b3db4c5aaa1e67749550
      - name: Remove helper and prove machine-only diff
        shell: bash
        run: |
          set -euo pipefail
          BASE=6fce050bfb40221714b0a239c71b83c65df2ef60
          git rm .github/workflows/tmp-db-tst-002-machine-pointer-correction-20260910.yml
          git add specs/database/final-migration-order-invariant-matrix.yml
          mapfile -t changed < <(git diff --cached --name-only "$BASE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = specs/database/final-migration-order-invariant-matrix.yml
          git diff --cached --check
          git diff --cached --stat "$BASE"
      - name: Commit validated helper tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DB-TST-002: correct DB-FINAL-001 allowed scope'
          git push origin HEAD:tmp-db-tst-002-machine-pointer-correction-20260910
