name: tmp-s5-boot-001-auth-failclosed-v6-20260910

on:
  push:
    branches: [tmp-s5-boot-001-auth-failclosed-v6-20260910]

permissions:
  contents: write

jobs:
  validate-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-boot-001-auth-failclosed-v6-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none
          ini-file: production
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Apply final bootstrap corrections
        shell: bash
        run: |
          set -euo pipefail
          BASE=edd92902ba21415df2643ca8b5cf54b0ac92fe58
          CLEAN=fd793fa531a88437ff4b22a66a2c5da85ea2fc8d
          git fetch origin docs-consolidation-2026-09-05 --quiet
          test "$(git rev-parse origin/docs-consolidation-2026-09-05)" = "$BASE"
          test "$(git merge-base HEAD "$CLEAN")" = "$CLEAN"

          cat > config/auth.php <<'PHP'
          <?php

          return [
              /* S5-FOUND-001 owns the real IdentityTenant auth contract. */
              'defaults' => [
                  'guard' => null,
                  'passwords' => null,
              ],
              /* Explicit nulls neutralize Laravel's merged framework defaults. */
              'guards' => [
                  'web' => [
                      'driver' => null,
                      'provider' => null,
                  ],
              ],
              'providers' => [
                  'users' => [
                      'driver' => null,
                      'model' => null,
                  ],
              ],
              'passwords' => [
                  'users' => [
                      'provider' => null,
                      'table' => null,
                      'expire' => null,
                      'throttle' => null,
                  ],
              ],
              'password_timeout' => env('AUTH_PASSWORD_TIMEOUT', 10800),
          ];
          PHP

          cat > tests/Feature/ApplicationBootstrapTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use InvalidArgumentException;
          use Tests\TestCase;

          class ApplicationBootstrapTest extends TestCase
          {
              public function test_laravel_application_container_boots_in_testing_environment(): void
              {
                  $this->assertTrue($this->app->bound('config'));
                  $this->assertSame('testing', $this->app->environment());
              }

              public function test_authentication_configuration_neutralizes_framework_defaults_until_foundation_gate(): void
              {
                  $this->assertNull(config('auth.defaults.guard'));
                  $this->assertNull(config('auth.defaults.passwords'));
                  $this->assertNull(config('auth.guards.web.driver'));
                  $this->assertNull(config('auth.guards.web.provider'));
                  $this->assertNull(config('auth.providers.users.driver'));
                  $this->assertNull(config('auth.providers.users.model'));
                  $this->assertNull(config('auth.passwords.users.provider'));
                  $this->assertNull(config('auth.passwords.users.table'));
              }

              public function test_web_guard_cannot_be_instantiated_before_foundation_gate(): void
              {
                  $this->expectException(InvalidArgumentException::class);
                  $this->app['auth']->guard('web');
              }
          }
          PHP

          cat > .gitignore <<'EOF'
          .DS_Store
          .idea/
          .vscode/
          *.log
          .env
          .env.*
          !.env.example
          /vendor/
          /node_modules/
          /public/build/
          /public/hot
          /storage/*.key
          /.phpunit.cache/
          /.phpunit.result.cache
          EOF

          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          printf '*\n!.gitignore\n' > bootstrap/cache/.gitignore
          printf '*\n!private/\n!public/\n!.gitignore\n' > storage/app/.gitignore
          printf '*\n!.gitignore\n' > storage/app/private/.gitignore
          printf '*\n!.gitignore\n' > storage/app/public/.gitignore
          cat > storage/framework/.gitignore <<'EOF'
          compiled.php
          config.php
          down
          events.scanned.php
          lsp-*.php
          maintenance.php
          routes.php
          routes.scanned.php
          schedule-*
          services.json
          EOF
          printf '*\n!data/\n!.gitignore\n' > storage/framework/cache/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/cache/data/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/sessions/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/testing/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/views/.gitignore
          printf '*\n!.gitignore\n' > storage/logs/.gitignore

          python3 <<'PY'
          from pathlib import Path
          gate = Path('specs/gates/stage-5-implementation-gate.yml')
          s = gate.read_text()
          old = "    project_license_manifest: proprietary\n    domain_modules_implemented: false\n"
          new = "    project_license_manifest: proprietary\n    authentication_foundation_materialized: false\n    authentication_configuration_mode: explicit_null_overrides_fail_closed_until_S5_FOUND_001\n    clean_clone_runtime_directory_markers_present: true\n    domain_modules_implemented: false\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "    Laravel_default_UserFactory_retained: false\n    Laravel_default_welcome_view_retained: false\n"
          new = "    Laravel_default_UserFactory_retained: false\n    Laravel_default_auth_User_provider_retained: false\n    authentication_config_fail_closed_until_S5_FOUND_001: true\n    premature_web_guard_instantiation_rejected: PASS\n    clean_clone_composer_install: PASS\n    clean_clone_runtime_directory_markers_present: true\n    Laravel_default_welcome_view_retained: false\n"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          gate.write_text(s)

          audit = Path('docs/117-stage-5-implementation-entry-audit.md')
          s = audit.read_text()
          marker = "**STOP przed S5-ENV-001.**"
          assert s.count(marker) == 1
          add = ("\n\n### 10.1. Korekty finalnego bootstrapu\n\n"
                 "Przed transferem do accepted history wykryto dwie pozostałości scaffoldingu. Laravel 13 scala frameworkowe defaulty auth, więc samo usunięcie `App\\\\Models\\\\User` nie wystarczało: `config/auth.php` neutralizuje teraz domyślny guard/provider/model przez jawne wartości `null`, a test potwierdza, że guard `web` nie może zostać utworzony przed `S5-FOUND-001`. Dodatkowo przywrócono marker files wymaganych katalogów `bootstrap/cache` i `storage/*`, dzięki czemu świeży checkout przechodzi `composer install`. Nie utworzono domenowych modeli, providerów, tabel ani migracji.\n")
          s = s.replace(marker, marker + add, 1)
          audit.write_text(s.rstrip() + "\n")
          PY

      - name: Execute corrected clean-clone bootstrap gate
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap/cache
          test -d storage/framework/views
          composer install --no-interaction --prefer-dist
          npm ci
          composer validate --strict
          php artisan --version | grep -E '^Laravel Framework 13\.'
          php -l config/auth.php
          : > .env
          php artisan test --fail-on-warning
          rm .env
          npm run typecheck
          npm run build
          composer audit --locked --no-interaction
          npm audit
          test ! -e app/Models/User.php
          test ! -e database/factories/UserFactory.php
          test "$(find database/migrations -maxdepth 1 -name '*.php' | wc -l)" -eq 0
          ! grep -R --line-number --fixed-strings 'App\Models\User' config app database routes tests 2>/dev/null
          test ! -e .env
          git diff --check
          ruby -e "require 'yaml'; require 'date'; YAML.safe_load(File.read('specs/gates/stage-5-implementation-gate.yml'), permitted_classes:[Date], aliases:true); puts 'STAGE5_YAML_PARSE=PASS'"

      - name: Prove preservation and commit validated helper tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=edd92902ba21415df2643ca8b5cf54b0ac92fe58
          CLEAN=fd793fa531a88437ff4b22a66a2c5da85ea2fc8d
          test "$(git hash-object AGENTS.md)" = 96ec177c82ac6f031eb22f443295147a83482baf
          test "$(git hash-object README.md)" = 710166c3189451a765c2314609e37607cc39e529
          test "$(git hash-object .github/workflows/api-contract-gate.yml)" = 8e2f12552f939b04bb93bbd9b4c69133ae9c1240
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = 306dabaa58223abe2f3b2a34b888b075c88e9ec4
          test "$(git hash-object specs/database/core-schema.yml)" = b0629cc48e26798d945356eaa1d0c9b1187aa542
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441
          test "$(git hash-object docs/87-physical-database-schema.md)" = a48eacd92d4a9c8e989f5d70c3bec95b9231a77c
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 6f76255742d4902546f45c28d54c1da6ee3d3fd7
          rm .github/workflows/tmp-s5-boot-001-auth-failclosed-v6-20260910.yml
          git add -A
          git diff --cached --check
          cat > /tmp/expected-files <<'EOF'
          .gitignore
          bootstrap/cache/.gitignore
          config/auth.php
          docs/117-stage-5-implementation-entry-audit.md
          specs/gates/stage-5-implementation-gate.yml
          storage/app/.gitignore
          storage/app/private/.gitignore
          storage/app/public/.gitignore
          storage/framework/.gitignore
          storage/framework/cache/.gitignore
          storage/framework/cache/data/.gitignore
          storage/framework/sessions/.gitignore
          storage/framework/testing/.gitignore
          storage/framework/views/.gitignore
          storage/logs/.gitignore
          tests/Feature/ApplicationBootstrapTest.php
          EOF
          git diff --cached --name-only "$CLEAN" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --cached --name-only "$BASE" | grep -E '^specs/database/|^specs/gates/stage-4-|^docs/87-|^docs/116-' || true)"
          test -z "$(git diff --cached --name-only "$BASE" | grep -E '^database/migrations/.*\.php$' || true)"
          test -z "$(git diff --cached --name-only "$BASE" | grep '^\.github/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S5-BOOT-001: finalize clean-clone bootstrap'
          git push origin HEAD:tmp-s5-boot-001-auth-failclosed-v6-20260910
