name: tmp-s5-ci-001-central

on:
  push:
    branches:
      - tmp-s5-ci-001-central-validation-20260910

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-ci-001-central-validation-20260910
          fetch-depth: 0

      - name: Assert exact central base and provenance
        shell: bash
        run: |
          set -euo pipefail
          BASE='7355c6ae11b4e07e1487256e5c4aac28297c8283'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:specs/gates/stage-5-implementation-gate.yml)" = 'b668f28d71a2229dc0d6f524eb3d37d27df070b3'
          test "$(git rev-parse HEAD:docs/117-stage-5-implementation-entry-audit.md)" = 'ee97e0173b0c6ea08baeb6d4c39337edc2d546f1'
          test "$(git rev-parse HEAD:docs/121-stage-5-implementation-ci.md)" = 'c6b98acc50eb59970a110052524f61e85a4e1105'
          test "$(git rev-parse HEAD:.github/workflows/implementation-ci.yml)" = '2ef64a3b668fc384df62ad29a69740c81a91caf4'
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git rev-parse HEAD:docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git rev-parse HEAD:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'

      - name: Apply exact S5-CI-001 central closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('specs/gates/stage-5-implementation-gate.yml')
          text = path.read_text()
          replacements = [
              ('  status: FAIL_WITH_2_P1_BLOCKERS', '  status: FAIL_WITH_1_P1_BLOCKER'),
              ('  implementation_CI_present: false', '  implementation_CI_present: true'),
              ('  conclusion: S5_TST_001_pass_and_S5_CI_001_is_next', '  conclusion: S5_CI_001_pass_and_S5_FOUND_001_is_next'),
              ('  - id: S5-CI-001\n    severity: P1\n    status: OPEN\n    title: implementation_CI_gate_absent', '  - id: S5-CI-001\n    severity: P1\n    status: PASS\n    title: implementation_CI_gate_absent'),
              ('  fixes_applied_total: 4\n  open_P0_P1: 2\n  result: FAIL_WITH_2_P1_BLOCKERS', '  fixes_applied_total: 5\n  open_P0_P1: 1\n  result: FAIL_WITH_1_P1_BLOCKER'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected replacement count for: {old!r}')
              text = text.replace(old, new, 1)
          old_next = base64.b64decode('').decode()
          new_next = base64.b64decode('').decode()
          if text.count(old_next) != 1:
              raise SystemExit('unexpected next_single_step block')
          text = text.replace(old_next, new_next, 1)
          if 'S5_CI_001_closure:' in text:
              raise SystemExit('S5_CI_001_closure already exists')
          closure = base64.b64decode('').decode()
          path.write_text(text.rstrip() + '\n' + closure)
          PY

      - name: Parse and assert central gate semantics
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'yaml'
          require 'date'
          path = 'specs/gates/stage-5-implementation-gate.yml'
          data = YAML.safe_load(File.read(path), permitted_classes: [Date], aliases: true)
          abort 'meta status' unless data.dig('meta','status') == 'FAIL_WITH_1_P1_BLOCKER'
          abort 'implementation CI observation' unless data.dig('entry_observations','implementation_CI_present') == true
          abort 'conclusion' unless data.dig('entry_observations','conclusion') == 'S5_CI_001_pass_and_S5_FOUND_001_is_next'
          blockers = data.fetch('blockers').to_h { |b| [b.fetch('id'), b.fetch('status')] }
          abort 'S5-CI-001 not PASS' unless blockers['S5-CI-001'] == 'PASS'
          abort 'S5-FOUND-001 not OPEN' unless blockers['S5-FOUND-001'] == 'OPEN'
          q = data.fetch('quality_gate')
          abort 'historical diagnosis changed' unless q['diagnosed_P1'] == 6 && q['diagnosed_P0'] == 0
          abort 'fix total' unless q['fixes_applied_total'] == 5
          abort 'open count' unless q['open_P0_P1'] == 1
          abort 'quality result' unless q['result'] == 'FAIL_WITH_1_P1_BLOCKER'
          abort 'fix order changed' unless q['blocker_fix_order'] == %w[S5-BOOT-001 S5-ENV-001 S5-MIG-001 S5-TST-001 S5-CI-001 S5-FOUND-001]
          n = data.fetch('next_single_step')
          abort 'next step' unless n['id'] == 'S5-FOUND-001'
          abort 'CI prereq missing' unless n['prerequisite_S5_CI_001'] == 'PASS'
          c = data.fetch('S5_CI_001_closure')
          abort 'closure status' unless c['status'] == 'PASS'
          abort 'machine provenance' unless c.dig('provenance','machine_clean_commit') == '55b6d0af82ee018cb3c0a201e4d4e6a6358c6a06'
          abort 'narrative provenance' unless c.dig('provenance','narrative_clean_commit') == '7355c6ae11b4e07e1487256e5c4aac28297c8283'
          abort 'accepted run' unless c.dig('provenance','accepted_branch_validation_run') == 34505180921
          abort '5/5 jobs' unless c.dig('permanent_jobs','accepted_branch_jobs_passed') == 5 && c.dig('permanent_jobs','accepted_branch_jobs_total') == 5
          abort 'baseline/suppressions' unless c.dig('backend_quality','baseline_added') == false && c.dig('backend_quality','suppressions_added_for_gate') == false
          abort 'static findings' unless c.dig('backend_quality','static_analysis_findings_fixed_not_hidden') == 18
          abort 'Stage4 rewritten' unless c.dig('preservation','Stage_4_authority_rewritten') == false
          abort 'foundation started early' unless c.dig('preservation','S5_FOUND_001_started') == false
          puts 'CENTRAL_SEMANTICS=PASS'
          RUBY
          git diff --check

      - name: Remove helper workflow and create final helper state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-s5-ci-001-central.yml
          git add specs/gates/stage-5-implementation-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S5-CI-001 helper: finalize central gate'
          git push origin HEAD:tmp-s5-ci-001-central-validation-20260910

      - name: Validate final net central diff
        shell: bash
        run: |
          set -euo pipefail
          BASE='7355c6ae11b4e07e1487256e5c4aac28297c8283'
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'specs/gates/stage-5-implementation-gate.yml'
          git diff --check "$BASE"..HEAD
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          echo 'S5_CI_001_CENTRAL=PASS'
