name: tmp-s5-ci-001-materialize-validate

on:
  push:
    branches: [tmp-s5-ci-001-validation-20260910]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-ci-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contract-validation/requirements.txt

      - name: Materialize quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer require --dev 'larastan/larastan:^3.11' --no-interaction --no-progress
          npm install --save-dev --save-exact eslint@10.10.0 @eslint/js@10.0.1 eslint-plugin-vue@10.11.0 typescript-eslint@8.70.0
          python -m pip install --disable-pip-version-check -r scripts/contract-validation/requirements.txt

      - name: Backend lint and static analysis
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Frontend lint typecheck build and audit
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: PostgreSQL tests and migration validation
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          docker compose config >/tmp/compose.rendered.yml
          docker compose up -d --wait
          php artisan migration:plan:validate --json
          php artisan test --fail-on-warning
          rm -f .env storage/logs/migration-execution.jsonl

      - name: OpenAPI and changed-module traceability
        shell: bash
        env:
          CI_BASE_SHA: 6c195d8520714d771be4f4a074e7e1c81d635bd5
          CI_HEAD_SHA: HEAD
        run: |
          set -euo pipefail
          python scripts/contract-validation/validate_openapi_contract.py
          python scripts/ci/validate_changed_module_traceability.py --self-test
          python scripts/ci/validate_changed_module_traceability.py

      - name: Preserve Stage 4 and existing API gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object .github/workflows/api-contract-gate.yml)" = '8e2f12552f939b04bb93bbd9b4c69133ae9c1240'
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git hash-object specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git hash-object docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'

      - name: Commit materialized lockfiles and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-s5-ci-001-materialize-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock package.json package-lock.json .github/workflows/tmp-s5-ci-001-materialize-validate.yml
          git commit -m 'S5-CI-001 helper: materialize validated quality lockfiles'
          git push origin HEAD:tmp-s5-ci-001-validation-20260910

      - name: Cleanup runtime
        if: always()
        run: docker compose down -v || true

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-ci-001-validation-20260910
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_LOG_OPTS: '6c195d8520714d771be4f4a074e7e1c81d635bd5...HEAD'
