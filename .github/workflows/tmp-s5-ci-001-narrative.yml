name: tmp-s5-ci-001-narrative

on:
  push:
    branches:
      - tmp-s5-ci-001-narrative-validation-20260910

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-ci-001-narrative-validation-20260910
          fetch-depth: 0

      - name: Assert exact narrative base and preserved authorities
        shell: bash
        run: |
          set -euo pipefail
          BASE='55b6d0af82ee018cb3c0a201e4d4e6a6358c6a06'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git rev-parse HEAD:docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git rev-parse HEAD:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'
          test "$(git rev-parse HEAD:specs/gates/stage-5-implementation-gate.yml)" = 'b668f28d71a2229dc0d6f524eb3d37d27df070b3'
          test "$(git rev-parse HEAD:.github/workflows/implementation-ci.yml)" = '2ef64a3b668fc384df62ad29a69740c81a91caf4'

      - name: Update running Stage 5 narrative exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('docs/117-stage-5-implementation-entry-audit.md')
          text = path.read_text()
          old_step = '**Aktualny krok:** `S5-TST-001`'
          new_step = '**Aktualny krok:** `S5-CI-001`'
          old_status = '**Status:** `S5-TST-001 PASS / 0 P0 / 2 P1 OPEN`'
          new_status = '**Status:** `S5-CI-001 PASS / 0 P0 / 1 P1 OPEN`'
          if text.count(old_step) != 1 or text.count(old_status) != 1:
              raise SystemExit('unexpected docs/117 header state')
          if '## 14. S5-CI-001 — closure' in text:
              raise SystemExit('S5-CI-001 closure already present')
          appendix = base64.b64decode('').decode('utf-8')
          text = text.replace(old_step, new_step, 1).replace(old_status, new_status, 1)
          path.write_text(text.rstrip() + appendix)
          PY

      - name: Validate narrative evidence and scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '**Aktualny krok:** `S5-CI-001`' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq '**Status:** `S5-CI-001 PASS / 0 P0 / 1 P1 OPEN`' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq '## 14. S5-CI-001 — closure' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq '34505180921' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq '**STOP przed S5-FOUND-001.**' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq '**Machine clean commit:** `55b6d0af82ee018cb3c0a201e4d4e6a6358c6a06`' docs/121-stage-5-implementation-ci.md
          grep -Fq '**Permanent accepted-branch CI run:** `34505180921`' docs/121-stage-5-implementation-ci.md
          for job in backend-quality frontend-quality runtime-tests-and-migrations contracts-and-traceability secret-scan; do
            grep -Fq "$job" docs/121-stage-5-implementation-ci.md
          done
          grep -Fq 'Nie dodano baseline' docs/121-stage-5-implementation-ci.md
          git diff --check

      - name: Remove helper workflow and create final helper state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-s5-ci-001-narrative.yml
          git add docs/117-stage-5-implementation-entry-audit.md docs/121-stage-5-implementation-ci.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S5-CI-001 helper: finalize narrative evidence'
          git push origin HEAD:tmp-s5-ci-001-narrative-validation-20260910

      - name: Validate final net narrative diff
        shell: bash
        run: |
          set -euo pipefail
          BASE='55b6d0af82ee018cb3c0a201e4d4e6a6358c6a06'
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'docs/117-stage-5-implementation-entry-audit.md'
          test "${files[1]}" = 'docs/121-stage-5-implementation-ci.md'
          git diff --check "$BASE"..HEAD
          echo 'S5_CI_001_NARRATIVE=PASS'
