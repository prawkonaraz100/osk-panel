name: tmp-s5-found-001-diagnosis

on:
  push:
    branches:
      - tmp-s5-found-001-diagnosis-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Extract exact foundation authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          core=yaml.safe_load(Path('specs/database/core-schema.yml').read_text())
          wanted=['organizations','users','permissions','data_scopes','organization_settings','organization_contact_addresses','auth_login_identifiers','organization_memberships','membership_permissions','permission_scope_options','membership_permission_scopes','auth_sessions','audit_action_policy_revisions','audit_action_policy_currents','audit_logs','domain_events','outbox_messages']
          tables=core.get('core_tables',{})
          print('CORE_TABLES_TYPE', type(tables).__name__)
          for name in wanted:
              v=tables.get(name) if isinstance(tables,dict) else None
              print('=== TABLE',name,'===')
              print(yaml.safe_dump(v, sort_keys=False, width=180).rstrip())
          for key in ['critical_constraints','transactional_invariants']:
              print('===',key.upper(),'FOUNDATION_FILTER===')
              obj=core.get(key,{})
              for k,v in obj.items():
                  s=(k+' '+yaml.safe_dump(v,sort_keys=False)).lower()
                  if any(x in s for x in ['membership','permission','scope','auth_session','owner','audit','outbox','domain_event','organization_setting']):
                      print(k+':')
                      print(yaml.safe_dump(v, sort_keys=False, width=180).rstrip())
          aud=yaml.safe_load(Path('specs/database/audit-outbox-notifications.yml').read_text())
          print('=== AUDIT_TOP_KEYS ===')
          print(','.join(aud.keys()))
          for key in aud.keys():
              s=key.lower()
              if any(x in s for x in ['audit','outbox','domain_event','action_policy']):
                  print('=== AUDIT_KEY',key,'===')
                  print(yaml.safe_dump(aud[key], sort_keys=False, width=180).rstrip())
          perm=yaml.safe_load(Path('specs/security/permissions.yml').read_text())
          print('=== PERMISSIONS_TOP_KEYS ===')
          print(','.join(perm.keys()))
          for key in ['permission_catalog','permissions','data_scopes','role_templates','owner_protected_baseline','protected_owner_baseline']:
              if key in perm:
                  print('=== PERM_KEY',key,'===')
                  print(yaml.safe_dump(perm[key], sort_keys=False, width=180).rstrip())
          trace=yaml.safe_load(Path('specs/traceability/core-v1.yml').read_text())
          print('=== TRACE_KEYS ===')
          print(','.join(trace.keys()))
          PY
