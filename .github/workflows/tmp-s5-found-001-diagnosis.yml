name: tmp-s5-found-001-diagnosis

on:
  push:
    branches:
      - tmp-s5-found-001-diagnosis-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Diagnose foundation migration and DBT scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, yaml
          from pathlib import Path

          plan = json.loads(Path('database/migration-plan/plan.json').read_text())
          nodes = {n['node_id']: n for n in plan['nodes']}
          order = [n['node_id'] for n in plan['nodes']]

          wanted_objects = {
            'organizations','users','permissions','data_scopes','organization_settings',
            'organization_contact_addresses','auth_login_identifiers','organization_memberships',
            'membership_permissions','permission_scope_options','membership_permission_scopes',
            'auth_sessions','audit_action_policy_revisions','audit_action_policy_currents',
            'audit_logs','domain_events','outbox_messages'
          }
          seeds = [n['node_id'] for n in plan['nodes'] if n['object_name'] in wanted_objects]
          seeds += [n['node_id'] for n in plan['nodes'] if n['node_id'] in {
            'MIG-CK-IDENTITY','MIG-IDX-IDENTITY','MIG-FK-IDENTITY','MIG-CON-IDENTITY','MIG-TRG-IDENTITY',
            'MIG-CK-EVENTS','MIG-IDX-EVENTS','MIG-FK-EVENTS','MIG-CON-EVENTS','MIG-TRG-EVENTS'
          }]
          seeds = list(dict.fromkeys(seeds))

          closure=set()
          def add(nid):
            if nid in closure: return
            closure.add(nid)
            for dep in nodes[nid]['requires']:
              add(dep)
          for s in seeds: add(s)
          closure_ordered=[nid for nid in order if nid in closure]
          max_idx=max(order.index(nid) for nid in closure_ordered)
          prefix=order[:max_idx+1]
          unrelated=[nid for nid in prefix if nid not in closure]

          print('FOUNDATION_SEEDS=', len(seeds))
          for nid in seeds:
            n=nodes[nid]
            print('SEED', n['order'], nid, n['object_name'], 'requires=', ','.join(n['requires']), 'phases=', ','.join(n['phases']))
          print('DEPENDENCY_CLOSURE_COUNT=', len(closure_ordered))
          print('DEPENDENCY_CLOSURE_IDS=', ','.join(closure_ordered))
          print('CANONICAL_PREFIX_TO_MAX_FOUNDATION_COUNT=', len(prefix))
          print('CANONICAL_PREFIX_UNRELATED_COUNT=', len(unrelated))

          matrix = yaml.safe_load(Path('specs/database/final-migration-order-invariant-matrix.yml').read_text())
          tests={}
          blocker_maps={}
          def walk(v):
            if isinstance(v, dict):
              tid=v.get('test_id')
              if isinstance(tid, str) and tid.startswith('DBT-'):
                tests[tid]=v
              bid=v.get('blocker_id')
              ids=v.get('final_test_ids')
              if isinstance(bid, str) and isinstance(ids, list):
                blocker_maps[bid]=ids
              for x in v.values(): walk(x)
            elif isinstance(v, list):
              for x in v: walk(x)
          walk(matrix)
          print('MATRIX_TEST_ROWS=', len(tests))
          targets=[f'DB-IAM-{i:03d}' for i in range(1,6)] + ['DB-AUD-001','DB-AUD-002','DB-OUT-001','DB-OUT-002']
          selected=[]
          for bid in targets:
            ids=blocker_maps.get(bid, [])
            print('BLOCKER', bid, 'IDS=', ','.join(ids))
            for tid in ids:
              if tid not in selected: selected.append(tid)
          print('SELECTED_DBT_UNION_COUNT=', len(selected))
          for tid in selected:
            row=tests.get(tid)
            if not row:
              print('DBT_MISSING_ROW', tid)
              continue
            print('DBT_DETAIL', tid)
            print(yaml.safe_dump(row, sort_keys=False, width=160).rstrip())
          PY
