name: tmp-s5-found-001-diagnosis

on:
  push:
    branches:
      - tmp-s5-found-001-diagnosis-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Extract remaining foundation authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml, json
          from pathlib import Path
          core=yaml.safe_load(Path('specs/database/core-schema.yml').read_text())
          for key in ['core_tables','audit_outbox_notifications_model']:
              print('===CORE_SECTION',key,'===')
              print(yaml.safe_dump(core.get(key),sort_keys=False,width=180).rstrip())
          org=core['organization_model']
          print('===ORGANIZATION_MODEL===')
          print(yaml.safe_dump(org,sort_keys=False,width=180).rstrip())
          ident=core['identity_model']
          for key in ['organizations','users','permissions','data_scopes','auth_login_identifiers','organization_memberships','membership_permissions','permission_scope_options','membership_permission_scopes','auth_sessions']:
              if key in ident:
                  print('===IDENTITY',key,'===')
                  print(yaml.safe_dump(ident[key],sort_keys=False,width=180).rstrip())
          aud=yaml.safe_load(Path('specs/database/audit-outbox-notifications.yml').read_text())
          print('===AUDIT_RESOLVED_CONTRACTS===')
          print(yaml.safe_dump(aud.get('resolved_contracts'),sort_keys=False,width=180).rstrip())
          print('===AUDIT_PROVISIONAL_PHYSICAL_MODEL===')
          print(yaml.safe_dump(aud.get('provisional_physical_model'),sort_keys=False,width=180).rstrip())
          plan=json.loads(Path('database/migration-plan/plan.json').read_text())
          wanted={'organizations','users','permissions','data_scopes','organization_settings','organization_contact_addresses','auth_login_identifiers','organization_memberships','membership_permissions','permission_scope_options','membership_permission_scopes','auth_sessions','audit_action_policy_revisions','audit_action_policy_currents','audit_logs','domain_events','outbox_messages'}
          print('===PLAN_FOUNDATION_NODES===')
          for n in plan['nodes']:
              if n['object_name'] in wanted:
                  print(json.dumps(n,separators=(',',':')))
          PY
