name: tmp S5-FOUND-001 hardening gate

on:
  push:
    branches:
      - tmp-s5-found-001-hardening-20260910

permissions:
  contents: write

concurrency:
  group: tmp-s5-found-001-hardening-20260910
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Static quality
        run: |
          composer validate --strict
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Boot runtime and migrate
        run: |
          cp .env.example .env
          php artisan key:generate
          docker compose up -d --wait
          php artisan migration:plan:validate --json | tee /tmp/plan.json
          PLAN=$(python -c "import json; print(json.load(open('database/migration-plan/implementations.json'))['plan_identity'])")
          EXEC=$(python -c "import json; print(json.load(open('database/migration-plan/implementations.json'))['execution_identity'])")
          php artisan migration:controlled --plan="$PLAN" --execution="$EXEC" --phase=expand --force
          php artisan migration:controlled --plan="$PLAN" --execution="$EXEC" --phase=expand --force
          php artisan db:seed --force

      - name: Foundation registry assertions
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/plan.json'))
          assert p['nodes'] == 170
          assert p['implemented_nodes'] == 18
          assert p['implemented_steps'] == 18
          print('FOUNDATION_MIGRATION_REGISTRY=PASS')
          PY
          php -r '$r=require "tests/Contracts/stage4-test-implementations.php"; if (count($r)!==13) { exit(1); } echo "FOUNDATION_DBT_TRACEABILITY=PASS\n";'
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap(); if (!Illuminate\\Support\\Facades\\DB::table("permissions")->where("code","organization.settings.manage")->exists()) { exit(1); } if (Illuminate\\Support\\Facades\\DB::table("data_scopes")->count() !== 4) { exit(1); } if (Illuminate\\Support\\Facades\\DB::table("audit_action_policy_currents")->count() !== 3) { exit(1); }'
          echo "FOUNDATION_REFERENCE_CATALOG=PASS"

      - name: PostgreSQL test suite
        run: php artisan test --fail-on-warning

      - name: Frontend quality
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Contract and traceability
        run: |
          python -m pip install --disable-pip-version-check -r scripts/contract-validation/requirements.txt
          python scripts/contract-validation/validate_openapi_contract.py
          python scripts/ci/validate_changed_module_traceability.py --self-test
          CI_BASE_SHA=3f87f828f6832465eda318be302bdb745f30dfcd CI_HEAD_SHA=$(git rev-parse HEAD) python scripts/ci/validate_changed_module_traceability.py

      - name: Preservation and scope
        run: |
          git diff --check 3f87f828f6832465eda318be302bdb745f30dfcd...HEAD
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = "306dabaa58223abe2f3b2a34b888b075c88e9ec4"
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = "b0629cc48e26798d945356eaa1d0c9b1187aa542"
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = "ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441"
          test "$(git rev-parse HEAD:AGENTS.md)" = "96ec177c82ac6f031eb22f443295147a83482baf"
          ! git diff --name-only 3f87f828f6832465eda318be302bdb745f30dfcd...HEAD | grep -E '^app/Modules/(Locations|Staff|Vehicles|Students|Calendar|Licenses|InternalExams|PKK)/'
          echo "S5_FOUND_001_HARDENING=PASS"

      - name: Cleanup runtime
        if: always()
        run: docker compose down -v || true

      - name: Remove validator after success
        if: success()
        run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          rm .github/workflows/tmp-s5-found-001-hardening.yml
          git add -A
          git commit -m "helper: remove S5-FOUND-001 hardening validator"
          git push
