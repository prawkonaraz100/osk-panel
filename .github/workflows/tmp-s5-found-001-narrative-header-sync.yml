name: tmp S5-FOUND-001 narrative header sync

on:
  push:
    branches:
      - tmp-s5-found-001-narrative-header-sync-20260910

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate narrative header sync
        run: |
          BASE=1ed24f0e3da0c468d0606ce9d47e883285c50ce8
          git diff --check "$BASE"...HEAD
          ACTUAL=$(git diff --name-only "$BASE"...HEAD | grep -v '^.github/workflows/tmp-s5-found-001-narrative-header-sync.yml$')
          test "$ACTUAL" = "docs/117-stage-5-implementation-entry-audit.md"
          grep -Fq 'Aktualny krok:' docs/117-stage-5-implementation-entry-audit.md
          grep -Fq 'S5-FOUND-001 PASS / 0 P0 / 0 P1 OPEN' docs/117-stage-5-implementation-entry-audit.md
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = "306dabaa58223abe2f3b2a34b888b075c88e9ec4"
          test "$(git rev-parse HEAD:AGENTS.md)" = "96ec177c82ac6f031eb22f443295147a83482baf"
          echo "S5_FOUND_001_NARRATIVE_HEADER_SYNC=PASS"

      - name: Remove validator
        if: success()
        run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          rm .github/workflows/tmp-s5-found-001-narrative-header-sync.yml
          git add -A
          git commit -m "helper: remove narrative header sync validator"
          git push
