name: tmp S5-FOUND-001 narrative secret repair

on:
  push:
    branches:
      - tmp-s5-found-001-narrative-secret-repair-20260910

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scope and diff check
        run: |
          BASE=3ac4c5518cb5411405d66e43e43e02f03f6cd800
          git diff --check "$BASE"...HEAD
          ACTUAL=$(git diff --name-only "$BASE"...HEAD | grep -v '^.github/workflows/tmp-s5-found-001-narrative-secret-repair.yml$' | sort)
          test "$ACTUAL" = "docs/122-stage-5-foundation.md"
          grep -Fq 'API contract workflow preservation: PASS.' docs/122-stage-5-foundation.md

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Remove repair validator
        if: success()
        run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          rm .github/workflows/tmp-s5-found-001-narrative-secret-repair.yml
          git add -A
          git commit -m "helper: remove narrative secret repair validator"
          git push
