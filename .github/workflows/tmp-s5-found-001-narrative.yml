name: tmp S5-FOUND-001 narrative gate

on:
  push:
    branches:
      - tmp-s5-found-001-narrative-20260910

permissions:
  contents: write

concurrency:
  group: tmp-s5-found-001-narrative-20260910
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Narrative scope and preservation
        run: |
          BASE=f32d5c77bb844aac6e2ea0770b70b415fd28354e
          git diff --check "$BASE"...HEAD

          ACTUAL=$(git diff --name-only "$BASE"...HEAD | grep -v '^.github/workflows/tmp-s5-found-001-narrative.yml$' | sort)
          EXPECTED=$(printf '%s\n' \
            docs/117-stage-5-implementation-entry-audit.md \
            docs/122-stage-5-foundation.md | sort)
          test "$ACTUAL" = "$EXPECTED"

          grep -q 'Machine: PASS' docs/122-stage-5-foundation.md
          grep -q 'Central: PENDING' docs/122-stage-5-foundation.md
          grep -q '34532350584' docs/122-stage-5-foundation.md
          grep -q '35 tests / 1181 assertions PASS' docs/122-stage-5-foundation.md
          grep -q '## 15. S5-FOUND-001' docs/117-stage-5-implementation-entry-audit.md
          grep -q 'STOP przed następnym core slice' docs/117-stage-5-implementation-entry-audit.md

          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = "306dabaa58223abe2f3b2a34b888b075c88e9ec4"
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = "b0629cc48e26798d945356eaa1d0c9b1187aa542"
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = "ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441"
          test "$(git rev-parse HEAD:AGENTS.md)" = "96ec177c82ac6f031eb22f443295147a83482baf"
          test "$(git rev-parse HEAD:README.md)" = "710166c3189451a765c2314609e37607cc39e529"

          echo "S5_FOUND_001_NARRATIVE=PASS"

      - name: Remove narrative validator
        if: success()
        run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          rm .github/workflows/tmp-s5-found-001-narrative.yml
          git add -A
          git commit -m "helper: remove S5-FOUND-001 narrative validator"
          git push
