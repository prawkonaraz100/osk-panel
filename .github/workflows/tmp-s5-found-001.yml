name: tmp S5-FOUND-001 foundation gate

on:
  push:
    branches:
      - tmp-s5-found-001-foundation-20260910

permissions:
  contents: write

concurrency:
  group: tmp-s5-found-001-foundation-20260910
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Materialize S5-FOUND-001 candidate
        run: |
          python scripts/tmp_s5_found_generator.py

          cat > tests/Feature/ApplicationBootstrapTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use App\Modules\IdentityTenant\Models\User;
          use Tests\TestCase;

          class ApplicationBootstrapTest extends TestCase
          {
              public function test_laravel_application_container_boots_in_testing_environment(): void
              {
                  $this->assertTrue($this->app->bound('config'));
                  $this->assertSame('testing', $this->app->environment());
              }

              public function test_foundation_gate_enables_only_the_real_user_session_guard(): void
              {
                  $this->assertSame('web', config('auth.defaults.guard'));
                  $this->assertNull(config('auth.defaults.passwords'));
                  $this->assertSame('session', config('auth.guards.web.driver'));
                  $this->assertSame('users', config('auth.guards.web.provider'));
                  $this->assertSame('eloquent', config('auth.providers.users.driver'));
                  $this->assertSame(User::class, config('auth.providers.users.model'));
                  $this->assertNull(config('auth.passwords.users.table'));
              }

              public function test_web_guard_is_instantiable_after_identity_foundation_materialization(): void
              {
                  $this->assertNotNull($this->app['auth']->guard('web'));
              }
          }
          PHP

          cat > app/Modules/README.md <<'MD'
          # Application modules

          This directory is the modular-monolith boundary for OSK Panel application modules.

          S5-FOUND-001 materializes the first core foundation only:
          - IdentityTenant: authenticated principal, active tenant membership, permission + per-permission scope, membership governance.
          - OrganizationSettings: optimistic-concurrency settings transaction for confirmed basic/company/address fields.
          - AuditNotification: minimal atomic audit + domain-event + outbox boundary required by critical foundation mutations.

          Later core modules remain intentionally absent until their dedicated implementation slices.
          MD

          vendor/bin/pint
          python scripts/tmp_s5_found_generator.py --finalize-registry
          git diff --check

      - name: Commit candidate on helper branch
        run: |
          git config user.name "prawkonaraz100"
          git config user.email "prawkonaraz100@gmail.com"
          git add app config database tests specs/traceability
          git commit -m "S5-FOUND-001: materialize identity tenant foundation candidate"
          git push
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Boot deterministic runtime
        run: |
          cp .env.example .env
          php artisan key:generate
          docker compose config >/tmp/compose.rendered.yml
          docker compose up -d --wait

      - name: Validate registered migration plan
        run: php artisan migration:plan:validate --json

      - name: Execute registered foundation expand subset
        run: |
          PLAN=$(python -c "import json; print(json.load(open('database/migration-plan/implementations.json'))['plan_identity'])")
          EXEC=$(python -c "import json; print(json.load(open('database/migration-plan/implementations.json'))['execution_identity'])")
          php artisan migration:controlled --plan="$PLAN" --execution="$EXEC" --phase=expand --force
          php artisan migration:controlled --plan="$PLAN" --execution="$EXEC" --phase=expand --force

      - name: Backend quality and PostgreSQL tests
        run: |
          composer validate --strict
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          php artisan test --fail-on-warning

      - name: Frontend quality remains green
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Contracts and changed-module traceability
        env:
          CI_BASE_SHA: 3f87f828f6832465eda318be302bdb745f30dfcd
        run: |
          python -m pip install --disable-pip-version-check -r scripts/contract-validation/requirements.txt
          python scripts/contract-validation/validate_openapi_contract.py
          python scripts/ci/validate_changed_module_traceability.py --self-test
          CI_HEAD_SHA="$CANDIDATE_SHA" python scripts/ci/validate_changed_module_traceability.py

      - name: Foundation machine assertions
        run: |
          php artisan migration:plan:validate --json > /tmp/plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/plan.json'))
          assert p['nodes'] == 170
          assert p['implemented_nodes'] == 18
          assert p['implemented_steps'] == 18
          print('FOUNDATION_MIGRATION_REGISTRY=PASS')
          PY

          php -r '$r=require "tests/Contracts/stage4-test-implementations.php"; if (count($r)!==13) { fwrite(STDERR,"Expected 13 executable DBT registrations\n"); exit(1); } echo "FOUNDATION_DBT_TRACEABILITY=PASS\n";'

          test "$(git rev-parse 3f87f828f6832465eda318be302bdb745f30dfcd:specs/gates/stage-4-database-contract-gate.yml)" = "306dabaa58223abe2f3b2a34b888b075c88e9ec4"
          test "$(git rev-parse 3f87f828f6832465eda318be302bdb745f30dfcd:specs/database/core-schema.yml)" = "b0629cc48e26798d945356eaa1d0c9b1187aa542"
          test "$(git rev-parse 3f87f828f6832465eda318be302bdb745f30dfcd:specs/database/final-migration-order-invariant-matrix.yml)" = "ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441"
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = "306dabaa58223abe2f3b2a34b888b075c88e9ec4"
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = "b0629cc48e26798d945356eaa1d0c9b1187aa542"
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = "ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441"
          echo "STAGE4_PRESERVATION=PASS"

      - name: Cleanup deterministic runtime
        if: always()
        run: docker compose down -v || true

      - name: Remove helper artifacts after successful validation
        if: success()
        run: |
          rm scripts/tmp_s5_found_generator.py
          rm .github/workflows/tmp-s5-found-001.yml
          git add -A
          git commit -m "helper: remove S5-FOUND-001 validation artifacts"
          git push

      - name: Final helper scope
        if: success()
        run: |
          git diff --check 3f87f828f6832465eda318be302bdb745f30dfcd...HEAD
          ! git diff --name-only 3f87f828f6832465eda318be302bdb745f30dfcd...HEAD | grep -E '^\.github/workflows/tmp-|^scripts/tmp_'
          ! git diff --name-only 3f87f828f6832465eda318be302bdb745f30dfcd...HEAD | grep -E '^specs/gates/stage-4-|^specs/database/core-schema.yml$|^specs/database/final-migration-order-invariant-matrix.yml$|^docs/87-physical-database-schema.md$|^docs/116-stage-4-'
          echo "S5_FOUND_001_MACHINE_SCOPE=PASS"
