name: tmp-s5-mig-001-narrative-sync-20260910

on:
  push:
    branches: [tmp-s5-mig-001-validation-20260910]

permissions:
  contents: write

jobs:
  sync-narrative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-mig-001-validation-20260910
          fetch-depth: 0
      - name: Replace S5-MIG-001 closure with hardened narrative and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64
          p = Path('docs/117-stage-5-implementation-entry-audit.md')
          text = p.read_text()
          marker = '## 12. S5-MIG-001 — closure\n'
          assert text.count(marker) == 1
          prefix = text.split(marker, 1)[0]
          encoded = ''
          closure = base64.b64decode(encoded).decode('utf-8')
          p.write_text(prefix + closure)
          PY

          rm .github/workflows/tmp-s5-mig-001-narrative-sync-20260910.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/117-stage-5-implementation-entry-audit.md .github/workflows/tmp-s5-mig-001-narrative-sync-20260910.yml
          git commit -m 'S5-MIG-001: synchronize hardened narrative'
          git push origin HEAD:tmp-s5-mig-001-validation-20260910
