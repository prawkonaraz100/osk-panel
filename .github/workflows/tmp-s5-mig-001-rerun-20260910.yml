name: tmp-s5-mig-001-rerun-20260910

on:
  push:
    branches: [tmp-s5-mig-001-validation-20260910]

permissions:
  contents: write

jobs:
  rerun-corrected-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-mig-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Extract and run corrected original gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-s5-mig-001-validation-20260910.yml').read_text().splitlines()

          def extract(step_name):
              start = next(i for i, line in enumerate(source) if line.strip() == f'- name: {step_name}')
              run = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
              indent = len(source[run]) - len(source[run].lstrip())
              out = []
              for line in source[run + 1:]:
                  current = len(line) - len(line.lstrip()) if line.strip() else indent + 2
                  if line.strip() and current <= indent:
                      break
                  out.append(line[indent + 2:] if len(line) >= indent + 2 else '')
              return '\n'.join(out) + '\n'

          materialize = extract('Materialize S5-MIG-001 candidate')
          validate = extract('Validate migration plan and controlled execution')
          preserve = extract('Preservation gate and helper final commit')

          old = "grep -q 'plan identity mismatch' /tmp/wrong-plan.log"
          new = "grep -q 'Migration plan identity mismatch' /tmp/wrong-plan.log"
          assert validate.count(old) == 1
          validate = validate.replace(old, new, 1)

          marker = 'wrong_rc=$?\nset -e'
          assert validate.count(marker) == 1
          validate = validate.replace(marker, "wrong_rc=$?\necho WRONG_PLAN_RC=$wrong_rc\ncat /tmp/wrong-plan.log\nset -e", 1)

          old_rm = 'rm .github/workflows/tmp-s5-mig-001-validation-20260910.yml'
          assert preserve.count(old_rm) == 1
          preserve = preserve.replace(old_rm, old_rm + '\nrm .github/workflows/tmp-s5-mig-001-rerun-20260910.yml', 1)

          Path('/tmp/materialize.sh').write_text(materialize)
          Path('/tmp/validate.sh').write_text(validate)
          Path('/tmp/preserve.sh').write_text(preserve)
          PY

          bash /tmp/materialize.sh
          bash /tmp/validate.sh
          bash /tmp/preserve.sh
