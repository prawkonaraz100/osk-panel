          cat > docs/119-stage-5-migration-execution-contract.md <<'MD'
          # 119. Stage 5 migration execution contract

          Status: `S5-MIG-001 PASS candidate`

          ## Scope
          Ten krok ustanawia wykonywalną warstwę migracji dla późniejszych modułów. Nie udaje, że wszystkie 170 node'ów Stage 4 mają już gotowe DDL. Pełny DAG jest natomiast materializowany jako deterministyczny plan wykonawczy, a każda przyszła migracja domenowa musi wskazać istniejący node i wejść w małą partię zachowującą canonical topological order.

          ## Immutable authority binding
          `database/migration-plan/plan.json` jest generowany wyłącznie z `specs/database/final-migration-order-invariant-matrix.yml` blob `ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441`. Runtime validator sam oblicza Git blob SHA źródła i odrzuca plan po zmianie authority. Plan zawiera dokładnie 170 node'ów, siedem faz `expand -> preflight -> write_fence -> backfill -> reconcile -> validate -> contract` oraz restart classification `restart_safe|manual_review` rozwiązane według exact override, a w pozostałych przypadkach według node-type default.

          ## Review batches
          Canonical topological order jest dzielony deterministycznie na 17 partii po maksymalnie 10 node'ów. Partia nie zmienia zależności ani faz; jest wyłącznie granicą review/materializacji. `implementations.json` nie może zawierać nieznanego node ID ani innej restart classification niż authority.

          ## Controlled executor
          Produkcyjne uruchomienie ma używać `php artisan migration:controlled --plan=<exact-plan-identity> --force`, nie bezpośredniego `migrate`. Wrapper:
          1. waliduje authority i plan identity,
          2. bierze PostgreSQL advisory lock `(519662, 5001)`,
          3. zapisuje execution evidence poza core schema,
          4. uruchamia Laravel migrator,
          5. zapisuje success/failure i zawsze zwalnia lock.

          W production `MIGRATION_EVIDENCE_PATH` jest wymagany i musi wskazywać trwały wolumen lub ścieżkę zbieraną przez deployment operations system. Nie powstaje nowa core table na potrzeby journalu.

          ## Restart and rollback
          Blind retry pozostaje zabroniony. Plan zachowuje restart classification każdego node'a. Późniejsze migracje `manual_review` muszą mieć precondition/postcondition i procedurę resume zgodną z DB-MIG-003 przed materializacją. Automatyczny destrukcyjny `down()` nie jest strategią rollbacku; dozwolone pozostają wyłącznie `application_rollback`, `schema_forward_fix` i jawnie udowodniony `explicit_safe_down`.

          ## First materialized node
          S5-MIG-001 materializuje tylko `MIG-EXT-BTREE-GIST`, pierwszy node DAG i `restart_safe` expand step. Migracja sprawdza PostgreSQL, wykonuje `CREATE EXTENSION IF NOT EXISTS btree_gist` i potwierdza postcondition. `down()` celowo odmawia automatycznego usuwania extension.

          ## Boundary
          169 pozostałych DDL node'ów nie jest oznaczonych jako zaimplementowane. Będą materializowane partiami wraz z właściwymi core slices po przejściu entry gates. S5-MIG-001 nie implementuje modeli, endpointów, UI ani 491 framework tests. Następny krok to wyłącznie `S5-TST-001` po osobnej instrukcji.
          MD

          python3 <<'PY'
          from pathlib import Path

          gate = Path('specs/gates/stage-5-implementation-gate.yml')
          s = gate.read_text()
          pairs = [
              ('  status: FAIL_WITH_4_P1_BLOCKERS\n', '  status: FAIL_WITH_3_P1_BLOCKERS\n'),
              ('  Laravel_migrations_created: false\n', '  Laravel_migrations_created: true\n'),
              ('  - id: S5-MIG-001\n    severity: P1\n    status: OPEN', '  - id: S5-MIG-001\n    severity: P1\n    status: PASS'),
              ('  fixes_applied_total: 2\n  open_P0_P1: 4\n  result: FAIL_WITH_4_P1_BLOCKERS', '  fixes_applied_total: 3\n  open_P0_P1: 3\n  result: FAIL_WITH_3_P1_BLOCKERS'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)

          old = '''next_single_step:\n  id: S5-MIG-001\n  action: resolve_executable_database_migration_layer_only_after_next_explicit_user_instruction\n  prerequisite_S5_BOOT_001: PASS\n  prerequisite_S5_ENV_001: PASS\n  allowed_scope:\n    - migration_executor_and_reviewable_batches\n    - exact_170_node_dependency_authority_materialization\n    - seven_phase_migration_contract\n    - restart_failure_and_safe_rollback_controls\n    - Stage_5_gate_and_audit_updates\n  forbidden_scope:\n    - domain_feature_UI\n    - shortening_or_reinterpreting_Stage_4_database_authority\n    - blanket_destructive_down_migrations\n  after_action: rerun_S5_MIG_001_gate_and_STOP_before_S5_TST_001\n'''
          new = '''next_single_step:\n  id: S5-TST-001\n  action: resolve_executable_PostgreSQL_backed_framework_test_harness_only_after_next_explicit_user_instruction\n  prerequisite_S5_BOOT_001: PASS\n  prerequisite_S5_ENV_001: PASS\n  prerequisite_S5_MIG_001: PASS\n  allowed_scope:\n    - PostgreSQL_backed_test_runner_and_synthetic_factories\n    - independent_database_connection_concurrency_primitives\n    - DBT_ID_to_executable_test_traceability_mechanism\n    - executable_migration_preflight_and_postcheck_test_classes\n    - Stage_5_gate_and_audit_updates\n  forbidden_scope:\n    - marking_DB_TST_contracts_implemented_without_executable_assertions\n    - domain_feature_UI\n    - full_implementation_CI_until_S5_CI_001\n  after_action: rerun_S5_TST_001_gate_and_STOP_before_S5_CI_001\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          s = s.rstrip() + '''\n\nS5_MIG_001_closure:\n  status: PASS\n  accepted_scope: migration_execution_layer_and_first_restart_safe_node\n  authority_binding:\n    final_matrix_blob: ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441\n    DAG_nodes: 170\n    review_batches: 17\n    max_nodes_per_review_batch: 10\n    phase_order: [expand, preflight, write_fence, backfill, reconcile, validate, contract]\n    restart_classification_values: [restart_safe, manual_review]\n    topological_order_rewritten: false\n  execution_control:\n    controlled_command: migration:controlled\n    exact_plan_identity_required: true\n    single_executor: PostgreSQL_advisory_lock\n    advisory_lock_keys: [519662, 5001]\n    production_external_evidence_path_required: true\n    new_core_execution_evidence_table_created: false\n    blind_retry: forbidden\n    generic_destructive_down: forbidden\n    allowed_rollback_modes: [application_rollback, schema_forward_fix, explicit_safe_down]\n  materialization:\n    implemented_DAG_nodes: 1\n    first_node: MIG-EXT-BTREE-GIST\n    first_node_restart_classification: restart_safe\n    first_node_postcondition_verified: true\n    remaining_DAG_nodes_claimed_implemented: false\n    remaining_nodes_materialize_in_review_batches_with_domain_slices: true\n  executable_evidence:\n    plan_runtime_validation: PASS\n    plan_identity_negative_test: PASS\n    concurrent_executor_lock_negative_test: PASS\n    first_node_controlled_migration: PASS\n    first_node_repeat_run_no_reapply: PASS\n    PostgreSQL_extension_postcondition: PASS\n  intentionally_not_closed_here:\n    full_170_node_domain_DDL_materialization: false\n    S5_TST_001: OPEN\n    S5_CI_001: OPEN\n    S5_FOUND_001: OPEN\n'''
          gate.write_text(s)

          audit = Path('docs/117-stage-5-implementation-entry-audit.md')
          a = audit.read_text().rstrip() + '''\n\n---\n\n## 12. S5-MIG-001 — closure\n\n**PASS.** Zamknięto brak warstwy wykonawczej migracji bez wygenerowania 170 domenowych DDL jako jednej nieprzeglądalnej zmiany. `database/migration-plan/plan.json` wiąże runtime byte-for-byte z finalnym Stage-4 matrix blob `ad5f2aa2…`, zawiera dokładnie 170 node'ów, pełny canonical topological order, rozwiązane ścieżki siedmiu faz oraz restart classification z DB-MIG-003. Plan jest dzielony deterministycznie na 17 review batches po maksymalnie 10 node'ów.\n\nDodano fail-closed controlled executor. `migration:controlled` wymaga dokładnego plan identity, bierze PostgreSQL advisory lock `(519662, 5001)` i zapisuje execution journal poza core schema. W production brak jawnego `MIGRATION_EVIDENCE_PATH` zatrzymuje wykonanie. Blind retry oraz generic destructive down pozostają zabronione.\n\nJako pierwszy realny node materializowany jest wyłącznie `MIG-EXT-BTREE-GIST`: restart-safe expand migration `CREATE EXTENSION IF NOT EXISTS btree_gist` z jawnym postcondition. Registry celowo deklaruje tylko 1/170 zaimplementowanych node'ów; nie powstaje fałszywe twierdzenie, że pozostałe 169 DDL są gotowe. Będą dochodziły małymi partiami podczas właściwych core slices i muszą przechodzić ten sam authority/plan gate.\n\nMachine gate potwierdza również negatywne ścieżki: błędny plan identity jest odrzucany, równoległy executor jest blokowany przez advisory lock, ponowne wykonanie po sukcesie nie aplikuje migracji drugi raz, a extension postcondition pozostaje spełniony. Nie dodano modeli domenowych, API, UI ani pełnego test harnessu 491 kontraktów.\n\nPozostałe blockery: `S5-TST-001`, `S5-CI-001`, `S5-FOUND-001`. Następny pojedynczy krok: **S5-TST-001**.\n\n**STOP przed S5-TST-001.**\n'''
          audit.write_text(a)
          PY

      - name: Validate migration plan and controlled execution
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            rm -f .env storage/logs/migration-execution.jsonl
            docker compose down -v >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          ./scripts/runtime-up.sh

          php artisan migration:plan:validate
          PLAN="$(php -r '$p=json_decode(file_get_contents("database/migration-plan/plan.json"),true); echo $p["plan_identity"];')"
          test -n "$PLAN"

          set +e
          php artisan migration:controlled --plan=wrong-plan --force >/tmp/wrong-plan.log 2>&1
          wrong_rc=$?
          set -e
          test "$wrong_rc" -ne 0
          grep -q 'plan identity mismatch' /tmp/wrong-plan.log

          docker compose exec -T postgres psql -U osk_panel -d osk_panel -v ON_ERROR_STOP=1 -c 'select pg_advisory_lock(519662, 5001); select pg_sleep(6);' >/tmp/lock-holder.log 2>&1 &
          holder=$!
          sleep 1
          set +e
          php artisan migration:controlled --plan="$PLAN" --force >/tmp/contended.log 2>&1
          contended_rc=$?
          set -e
          test "$contended_rc" -ne 0
          grep -q 'holds the PostgreSQL advisory lock' /tmp/contended.log
          wait "$holder"

          php artisan migration:controlled --plan="$PLAN" --force
          test "$(docker compose exec -T postgres psql -U osk_panel -d osk_panel -Atqc "select count(*) from pg_extension where extname='btree_gist'" | tr -d '\r')" = "1"
          first_count="$(docker compose exec -T postgres psql -U osk_panel -d osk_panel -Atqc "select count(*) from migrations where migration='2026_09_10_000010_enable_btree_gist_extension'" | tr -d '\r')"
          test "$first_count" = "1"

          php artisan migration:controlled --plan="$PLAN" --force
          second_count="$(docker compose exec -T postgres psql -U osk_panel -d osk_panel -Atqc "select count(*) from migrations where migration='2026_09_10_000010_enable_btree_gist_extension'" | tr -d '\r')"
          test "$second_count" = "1"
          test "$(grep -c 'migration_run_started' storage/logs/migration-execution.jsonl)" -eq 2
          test "$(grep -c 'migration_run_succeeded' storage/logs/migration-execution.jsonl)" -eq 2

          : > .env
          php artisan test --fail-on-warning
          rm .env
          npm ci
          npm run typecheck
          npm run build
          composer validate --strict
          composer audit --locked --no-interaction
          npm audit
          git diff --check
          ruby -e "require 'yaml'; require 'date'; YAML.safe_load(File.read('specs/gates/stage-5-implementation-gate.yml'), permitted_classes:[Date], aliases:true); puts 'STAGE5_YAML_PARSE=PASS'"

      - name: Preservation gate and helper final commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=163e5ba7a3d9da3bd924aa648ffa93c002cd7a3f
          git fetch origin docs-consolidation-2026-09-05 --quiet
          test "$(git rev-parse origin/docs-consolidation-2026-09-05)" = "$BASE"

          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = 306dabaa58223abe2f3b2a34b888b075c88e9ec4
          test "$(git hash-object specs/database/core-schema.yml)" = b0629cc48e26798d945356eaa1d0c9b1187aa542
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441
          test "$(git hash-object docs/87-physical-database-schema.md)" = a48eacd92d4a9c8e989f5d70c3bec95b9231a77c
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = 6f76255742d4902546f45c28d54c1da6ee3d3fd7

          rm -f .env storage/logs/migration-execution.jsonl
          rm .github/workflows/tmp-s5-mig-001-validation-20260910.yml
          git add -A
          git diff --cached --check

