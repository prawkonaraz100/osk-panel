name: tmp-s5-mig-001-validation-20260910

on:
  push:
    branches: [tmp-s5-mig-001-validation-20260910]

permissions:
  contents: write

jobs:
  validate-migration-layer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-mig-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Materialize S5-MIG-001 candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=163e5ba7a3d9da3bd924aa648ffa93c002cd7a3f
          MATRIX_BLOB=ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441
          git fetch origin docs-consolidation-2026-09-05 --quiet
          test "$(git rev-parse origin/docs-consolidation-2026-09-05)" = "$BASE"
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = "$MATRIX_BLOB"

          mkdir -p database/migration-plan app/Support/Migrations database/migrations tests/Unit

          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'
          require 'digest'

          matrix_path = 'specs/database/final-migration-order-invariant-matrix.yml'
          matrix = YAML.safe_load(File.read(matrix_path), permitted_classes: [Date], aliases: true)
          dag = matrix.fetch('migration_dependency_dag')
          phases = matrix.fetch('migration_phase_composition')
          cutover = matrix.fetch('migration_cutover_execution_contract')

          nodes = dag.fetch('nodes')
          topo = dag.fetch('topological_order')
          raise 'expected 170 DAG nodes' unless nodes.length == 170
          raise 'topological order mismatch' unless topo.length == 170 && topo == nodes.sort_by { |n| n.fetch('order') }.map { |n| n.fetch('id') }

          phase_order = phases.fetch('phase_order')
          raise 'phase contract changed' unless phase_order == %w[expand preflight write_fence backfill reconcile validate contract]
          phase_defaults = phases.fetch('node_phase_resolution').fetch('defaults_by_node_type')
          phase_overrides = phases.fetch('node_phase_resolution').fetch('exact_overrides')
          restart = cutover.fetch('node_restart_classification')
          restart_defaults = restart.fetch('defaults_by_node_type')
          restart_overrides = restart.fetch('exact_overrides')

          resolved = nodes.sort_by { |n| n.fetch('order') }.each_with_index.map do |node, i|
            id = node.fetch('id')
            node_phases = if phase_overrides.key?(id)
              phase_overrides.fetch(id).fetch('phases')
            else
              phase_defaults.fetch(node.fetch('type'))
            end
            restart_class = if restart_overrides.key?(id)
              restart_overrides.fetch(id).fetch('classification')
            else
              restart_defaults.fetch(node.fetch('type'))
            end
            indexes = node_phases.map { |p| phase_order.index(p) || raise("unknown phase #{p}") }
            raise "phase order violation #{id}" unless indexes == indexes.sort && indexes.uniq.length == indexes.length
            raise "bad restart class #{id}" unless %w[restart_safe manual_review].include?(restart_class)
            {
              'node_id' => id,
              'type' => node.fetch('type'),
              'order' => node.fetch('order'),
              'object_name' => node.fetch('object_name'),
              'requires' => node.fetch('requires'),
              'phases' => node_phases,
              'restart_classification' => restart_class,
              'batch_id' => format('B%02d', (i / 10) + 1)
            }
          end

          by_id = resolved.to_h { |n| [n.fetch('node_id'), n] }
          resolved.each do |node|
            node.fetch('requires').each do |dep|
              raise "unknown dependency #{dep}" unless by_id.key?(dep)
              raise "dependency order violation #{node.fetch('node_id')}" unless by_id.fetch(dep).fetch('order') < node.fetch('order')
            end
          end

          batches = resolved.each_slice(10).with_index.map do |slice, i|
            {
              'batch_id' => format('B%02d', i + 1),
              'review_limit' => 10,
              'node_count' => slice.length,
              'first_order' => slice.first.fetch('order'),
              'last_order' => slice.last.fetch('order'),
              'node_ids' => slice.map { |n| n.fetch('node_id') }
            }
          end
          raise 'expected 17 review batches' unless batches.length == 17 && batches.all? { |b| b.fetch('node_count') <= 10 }

          matrix_bytes = File.binread(matrix_path)
          git_blob = Digest::SHA1.hexdigest("blob #{matrix_bytes.bytesize}\0" + matrix_bytes)
          raise 'matrix blob changed' unless git_blob == 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'

          material = [git_blob, dag.fetch('contract_version'), phases.fetch('contract_version'), cutover.fetch('contract_version')].join('|') + "\n" + resolved.map { |n|
            [n.fetch('node_id'), n.fetch('order'), n.fetch('phases').join(','), n.fetch('restart_classification')].join('|')
          }.join("\n")
          identity = Digest::SHA256.hexdigest(material)

          plan = {
            'schema_version' => 1,
            'plan_identity' => identity,
            'source' => {
              'authority_path' => matrix_path,
              'authority_git_blob' => git_blob,
              'dag_contract_version' => dag.fetch('contract_version'),
              'phase_contract_version' => phases.fetch('contract_version'),
              'cutover_contract_version' => cutover.fetch('contract_version')
            },
            'phase_order' => phase_order,
            'execution_control' => {
              'single_executor' => 'postgres_advisory_lock',
              'advisory_lock_keys' => [519662, 5001],
              'blind_retry' => false,
              'production_evidence_path_required' => true,
              'automatic_destructive_down' => false,
              'allowed_rollback_modes' => %w[application_rollback schema_forward_fix explicit_safe_down]
            },
            'review_batches' => batches,
            'nodes' => resolved
          }
          File.write('database/migration-plan/plan.json', JSON.pretty_generate(plan) + "\n")

          implementations = {
            'schema_version' => 1,
            'plan_identity' => identity,
            'implemented_nodes' => [
              {
                'node_id' => 'MIG-EXT-BTREE-GIST',
                'migration_file' => 'database/migrations/2026_09_10_000010_enable_btree_gist_extension.php',
                'implemented_phases' => ['expand'],
                'restart_classification' => 'restart_safe',
                'safe_down' => false
              }
            ],
            'remaining_nodes_materialize_in_review_batches' => true,
            'claim_all_170_DDL_nodes_implemented' => false
          }
          File.write('database/migration-plan/implementations.json', JSON.pretty_generate(implementations) + "\n")
          RUBY

          cat > app/Support/Migrations/MigrationPlan.php <<'PHP'
          <?php

          namespace App\Support\Migrations;

          use LogicException;

          final class MigrationPlan
          {
              private array $plan;
              private array $implementations;

              public function __construct()
              {
                  $this->plan = $this->decode(base_path('database/migration-plan/plan.json'));
                  $this->implementations = $this->decode(base_path('database/migration-plan/implementations.json'));
              }

              public function validate(): void
              {
                  $expectedPhases = ['expand', 'preflight', 'write_fence', 'backfill', 'reconcile', 'validate', 'contract'];
                  $this->assert($this->plan['schema_version'] === 1, 'Unsupported migration plan schema.');
                  $this->assert($this->plan['phase_order'] === $expectedPhases, 'Seven-phase contract mismatch.');
                  $this->assert(count($this->plan['nodes']) === 170, 'Migration plan must contain exactly 170 nodes.');
                  $this->assert($this->gitBlobSha(base_path($this->plan['source']['authority_path'])) === $this->plan['source']['authority_git_blob'], 'Stage-4 migration authority blob mismatch.');
                  $this->assert($this->plan['source']['authority_git_blob'] === 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441', 'Unexpected Stage-4 authority identity.');

                  $nodesById = [];
                  $orders = [];
                  foreach ($this->plan['nodes'] as $node) {
                      $id = $node['node_id'];
                      $this->assert(! isset($nodesById[$id]), "Duplicate migration node: {$id}");
                      $this->assert(! isset($orders[$node['order']]), "Duplicate migration order: {$node['order']}");
                      $nodesById[$id] = $node;
                      $orders[$node['order']] = true;

                      $last = -1;
                      foreach ($node['phases'] as $phase) {
                          $index = array_search($phase, $expectedPhases, true);
                          $this->assert($index !== false && $index > $last, "Invalid phase path for {$id}");
                          $last = $index;
                      }
                      $this->assert(in_array($node['restart_classification'], ['restart_safe', 'manual_review'], true), "Invalid restart classification for {$id}");
                  }

                  foreach ($this->plan['nodes'] as $node) {
                      foreach ($node['requires'] as $dependency) {
                          $this->assert(isset($nodesById[$dependency]), "Unknown dependency {$dependency}");
                          $this->assert($nodesById[$dependency]['order'] < $node['order'], "Dependency appears after {$node['node_id']}");
                      }
                  }

                  $flattened = [];
                  $this->assert(count($this->plan['review_batches']) === 17, 'Expected 17 review batches.');
                  foreach ($this->plan['review_batches'] as $batch) {
                      $this->assert($batch['node_count'] === count($batch['node_ids']) && $batch['node_count'] <= 10, "Invalid review batch {$batch['batch_id']}");
                      array_push($flattened, ...$batch['node_ids']);
                  }
                  $this->assert($flattened === array_column($this->plan['nodes'], 'node_id'), 'Review batches must preserve exact topological order.');

                  $material = implode('|', [
                      $this->plan['source']['authority_git_blob'],
                      $this->plan['source']['dag_contract_version'],
                      $this->plan['source']['phase_contract_version'],
                      $this->plan['source']['cutover_contract_version'],
                  ])."\n";
                  $material .= implode("\n", array_map(
                      fn (array $node): string => implode('|', [$node['node_id'], $node['order'], implode(',', $node['phases']), $node['restart_classification']]),
                      $this->plan['nodes'],
                  ));
                  $this->assert(hash('sha256', $material) === $this->plan['plan_identity'], 'Migration plan identity mismatch.');
                  $this->assert($this->implementations['plan_identity'] === $this->plan['plan_identity'], 'Implementation registry plan mismatch.');

                  $seen = [];
                  foreach ($this->implementations['implemented_nodes'] as $implementation) {
                      $id = $implementation['node_id'];
                      $this->assert(isset($nodesById[$id]), "Implementation references unknown node {$id}");
                      $this->assert(! isset($seen[$id]), "Duplicate implementation node {$id}");
                      $seen[$id] = true;
                      $this->assert(is_file(base_path($implementation['migration_file'])), "Missing migration file for {$id}");
                      $this->assert($implementation['restart_classification'] === $nodesById[$id]['restart_classification'], "Restart class mismatch for {$id}");
                      $this->assert(array_values(array_intersect($implementation['implemented_phases'], $nodesById[$id]['phases'])) === $implementation['implemented_phases'], "Implemented phase outside authority for {$id}");
                      $this->assert($implementation['safe_down'] === false, "S5-MIG-001 must not invent destructive down for {$id}");
                  }
                  $this->assert(array_keys($seen) === ['MIG-EXT-BTREE-GIST'], 'S5-MIG-001 may materialize only the first restart-safe DAG node.');
                  $this->assert($this->implementations['claim_all_170_DDL_nodes_implemented'] === false, 'Do not falsely claim all domain DDL is implemented.');
              }

              public function identity(): string
              {
                  return $this->plan['plan_identity'];
              }

              public function nodeCount(): int
              {
                  return count($this->plan['nodes']);
              }

              public function batchCount(): int
              {
                  return count($this->plan['review_batches']);
              }

              public function implementedNodeCount(): int
              {
                  return count($this->implementations['implemented_nodes']);
              }

              public function summary(): array
              {
                  return [
                      'plan_identity' => $this->identity(),
                      'authority_blob' => $this->plan['source']['authority_git_blob'],
                      'nodes' => $this->nodeCount(),
                      'review_batches' => $this->batchCount(),
                      'implemented_nodes' => $this->implementedNodeCount(),
                      'phase_order' => $this->plan['phase_order'],
                  ];
              }

              private function decode(string $path): array
              {
                  $decoded = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
                  $this->assert(is_array($decoded), "Invalid JSON document: {$path}");

                  return $decoded;
              }

              private function gitBlobSha(string $path): string
              {
                  $bytes = (string) file_get_contents($path);

                  return sha1('blob '.strlen($bytes)."\0".$bytes);
              }

              private function assert(bool $condition, string $message): void
              {
                  if (! $condition) {
                      throw new LogicException($message);
                  }
              }
          }
          PHP

          cat > app/Support/Migrations/PostgresMigrationLock.php <<'PHP'
          <?php

          namespace App\Support\Migrations;

          use Illuminate\Support\Facades\DB;
          use LogicException;

          final class PostgresMigrationLock
          {
              public const KEY_NAMESPACE = 519662;
              public const KEY_PLAN = 5001;

              private bool $acquired = false;

              public function acquire(): bool
              {
                  if (DB::connection()->getDriverName() !== 'pgsql') {
                      throw new LogicException('Controlled migrations require PostgreSQL.');
                  }

                  $row = DB::selectOne('select pg_try_advisory_lock(?, ?) as acquired', [self::KEY_NAMESPACE, self::KEY_PLAN]);
                  $this->acquired = filter_var($row->acquired ?? false, FILTER_VALIDATE_BOOL);

                  return $this->acquired;
              }

              public function release(): void
              {
                  if (! $this->acquired) {
                      return;
                  }

                  DB::selectOne('select pg_advisory_unlock(?, ?)', [self::KEY_NAMESPACE, self::KEY_PLAN]);
                  $this->acquired = false;
              }
          }
          PHP

          cat > app/Support/Migrations/MigrationExecutionJournal.php <<'PHP'
          <?php

          namespace App\Support\Migrations;

          use LogicException;

          final class MigrationExecutionJournal
          {
              public function append(array $event): void
              {
                  $path = config('migration.evidence_path');
                  if (app()->environment('production') && ! is_string($path)) {
                      throw new LogicException('Production controlled migration requires MIGRATION_EVIDENCE_PATH backed by durable deployment evidence storage.');
                  }

                  $path = is_string($path) && $path !== '' ? $path : storage_path('logs/migration-execution.jsonl');
                  $directory = dirname($path);
                  if (! is_dir($directory) && ! mkdir($directory, 0775, true) && ! is_dir($directory)) {
                      throw new LogicException("Cannot create migration evidence directory: {$directory}");
                  }

                  $record = $event + ['recorded_at' => now()->toIso8601String()];
                  if (file_put_contents($path, json_encode($record, JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES)."\n", FILE_APPEND | LOCK_EX) === false) {
                      throw new LogicException('Cannot append migration execution evidence.');
                  }
              }
          }
          PHP

          cat > config/migration.php <<'PHP'
          <?php

          return [
              'evidence_path' => env('MIGRATION_EVIDENCE_PATH'),
          ];
          PHP

          cat > database/migrations/2026_09_10_000010_enable_btree_gist_extension.php <<'PHP'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Support\Facades\DB;
          use LogicException;

          return new class extends Migration
          {
              public function up(): void
              {
                  if (DB::connection()->getDriverName() !== 'pgsql') {
                      throw new LogicException('MIG-EXT-BTREE-GIST requires PostgreSQL.');
                  }

                  DB::statement('CREATE EXTENSION IF NOT EXISTS btree_gist');
                  $enabled = DB::scalar("select exists (select 1 from pg_extension where extname = 'btree_gist')");
                  if (! filter_var($enabled, FILTER_VALIDATE_BOOL)) {
                      throw new LogicException('MIG-EXT-BTREE-GIST postcondition failed.');
                  }
              }

              public function down(): void
              {
                  throw new LogicException('Automatic destructive down is forbidden. Use an explicitly reviewed safe-down plan if one is ever proven safe.');
              }
          };
          PHP

          cat > routes/console.php <<'PHP'
          <?php

          use App\Support\Migrations\MigrationExecutionJournal;
          use App\Support\Migrations\MigrationPlan;
          use App\Support\Migrations\PostgresMigrationLock;
          use Illuminate\Support\Facades\Artisan;

          Artisan::command('migration:plan:validate {--json}', function (MigrationPlan $plan): int {
              $plan->validate();
              if ($this->option('json')) {
                  $this->line(json_encode($plan->summary(), JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES));
              } else {
                  $this->info('S5_MIGRATION_PLAN=PASS');
                  $this->line('plan_identity='.$plan->identity());
                  $this->line('nodes='.$plan->nodeCount());
                  $this->line('review_batches='.$plan->batchCount());
                  $this->line('implemented_nodes='.$plan->implementedNodeCount());
              }

              return self::SUCCESS;
          })->purpose('Validate the immutable Stage-4 migration authority binding and review batches.');

          Artisan::command('migration:controlled {--plan= : Exact migration plan identity} {--force}', function (
              MigrationPlan $plan,
              PostgresMigrationLock $lock,
              MigrationExecutionJournal $journal,
          ): int {
              $plan->validate();
              if ($this->option('plan') !== $plan->identity()) {
                  $this->error('Migration plan identity mismatch; refusing execution.');

                  return self::FAILURE;
              }

              if (! $lock->acquire()) {
                  $this->error('Another migration executor holds the PostgreSQL advisory lock.');

                  return self::FAILURE;
              }

              $journal->append(['event' => 'migration_run_started', 'plan_identity' => $plan->identity()]);
              try {
                  $exit = Artisan::call('migrate', ['--force' => (bool) $this->option('force')]);
                  $this->output->write(Artisan::output());
                  $journal->append([
                      'event' => $exit === self::SUCCESS ? 'migration_run_succeeded' : 'migration_run_failed',
                      'plan_identity' => $plan->identity(),
                      'exit_code' => $exit,
                  ]);

                  return $exit;
              } catch (Throwable $exception) {
                  $journal->append([
                      'event' => 'migration_run_failed',
                      'plan_identity' => $plan->identity(),
                      'exception' => $exception::class,
                  ]);
                  throw $exception;
              } finally {
                  $lock->release();
              }
          })->purpose('Run Laravel migrations under the Stage-4 plan identity, PostgreSQL advisory lock, and execution journal.');
          PHP

          cat > tests/Unit/MigrationPlanContractTest.php <<'PHP'
