name: tmp-s5-mig-prefix-repair-narrative

on:
  push:
    branches:
      - tmp-s5-mig-prefix-repair-narrative-20260910

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-mig-prefix-repair-narrative-20260910
          fetch-depth: 0
      - name: Assert exact narrative base
        shell: bash
        run: |
          set -euo pipefail
          BASE='6e4947c6c0b1b1237a0973523897ceccb03d0d41'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:docs/117-stage-5-implementation-entry-audit.md)" = 'ee97e0173b0c6ea08baeb6d4c39337edc2d546f1'
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
      - name: Correct Stage 5 migration narrative
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/117-stage-5-implementation-entry-audit.md')
          s=p.read_text()
          old='Registry musi tworzyć canonical topological prefix pełnego DAG, być dependency-closed, a zarejestrowane fazy każdego node\'a muszą być prefiksem authoritative phase path.'
          new='Registry musi zachowywać canonical topological order dla materializowanego podzbioru, być dependency-closed względem wszystkich `requires`, a zarejestrowane fazy każdego node\'a muszą być prefiksem authoritative phase path. Materializacja nie wymaga niezależnych wcześniejszych node\'ów wyłącznie z powodu niższego `order`.'
          if s.count(old) != 1:
              raise SystemExit('expected narrative prefix sentence not found once')
          s=s.replace(old,new,1)
          marker='### 12.1. Korekta reguły materializacji podzbioru\n\n'
          if marker in s:
              raise SystemExit('correction already present')
          addition='\n\n### 12.1. Korekta reguły materializacji podzbioru\n\nPrzy wejściu do `S5-FOUND-001` machine diagnosis wykazał, że lokalna implementacja `S5-MIG-001` była bardziej restrykcyjna niż zamknięty Stage-4 DAG: wymóg pełnego canonical prefixu zmuszałby foundation audit/outbox do materializacji 166/170 node\'ów, w tym 121 niezwiązanych z pierwszym modułem. Stage-4 authority wymaga kolejności topologicznej i ukończenia wszystkich jawnych `requires`, ale nie nakazuje materializacji niezależnych node\'ów o niższym `order`.\n\nRegułę wykonawczą skorygowano preservation-safe: materializowany podzbiór musi zachować canonical order i być dependency-closed, bez przeskakiwania zależności. Siedem faz, plan identity, 170-node DAG, restart classification, phase-entry i cutover/rollback contract pozostają bez zmian. Machine repair: `6e4947c6c0b1b1237a0973523897ceccb03d0d41`.\n'
          anchor='\n---\n\n## 13. S5-TST-001 — closure'
          if s.count(anchor) != 1:
              raise SystemExit('section 13 anchor not found once')
          s=s.replace(anchor, addition+anchor,1)
          p.write_text(s)
          PY
          grep -Fq 'Machine repair: `6e4947c6c0b1b1237a0973523897ceccb03d0d41`' docs/117-stage-5-implementation-entry-audit.md
          ! grep -Fq 'canonical topological prefix pełnego DAG' docs/117-stage-5-implementation-entry-audit.md
          git diff --check
      - name: Remove helper and commit final state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-s5-mig-prefix-repair-narrative.yml
          git add docs/117-stage-5-implementation-entry-audit.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S5-MIG-001 helper: synchronize subset-rule narrative'
          git push origin HEAD:tmp-s5-mig-prefix-repair-narrative-20260910
      - name: Validate net narrative diff
        shell: bash
        run: |
          set -euo pipefail
          BASE='6e4947c6c0b1b1237a0973523897ceccb03d0d41'
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'docs/117-stage-5-implementation-entry-audit.md'
          echo 'S5_MIG_PREFIX_REPAIR_NARRATIVE=PASS'
