name: tmp-s5-mig-prefix-repair

on:
  push:
    branches:
      - tmp-s5-mig-prefix-repair-20260910

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: tmp-s5-mig-prefix-repair-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none

      - name: Assert exact repair base and immutable Stage 4 authority
        shell: bash
        run: |
          set -euo pipefail
          BASE='adaba33040072513b05131f84dcaa2ed6e679483'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse HEAD:specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git rev-parse HEAD:specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git rev-parse HEAD:specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git rev-parse HEAD:docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git rev-parse HEAD:docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'
          test "$(git rev-parse HEAD:app/Support/Migrations/MigrationPlan.php)" = '4e7a6b6e1bc1124056991841c521b4f30b58ac09'

      - name: Apply exact Stage 5 registry correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/Support/Migrations/MigrationPlan.php')
          s=p.read_text()
          old="""        $canonicalIds = array_column($this->plan['nodes'], 'node_id');
          $this->assert($implementedNodeIds === array_slice($canonicalIds, 0, count($implementedNodeIds)), 'Implemented nodes must form a canonical topological prefix.');

          foreach ($implementedNodeIds as $id) {
"""
          new="""        $implementedNodeSet = array_fill_keys($implementedNodeIds, true);
          $canonicalImplementedNodeIds = array_values(array_filter(
              array_column($this->plan['nodes'], 'node_id'),
              fn (string $id): bool => isset($implementedNodeSet[$id]),
          ));
          $this->assert($implementedNodeIds === $canonicalImplementedNodeIds, 'Implemented nodes must preserve canonical topological order.');

          foreach ($implementedNodeIds as $id) {
"""
          if s.count(old) != 1:
              raise SystemExit('exact prefix assertion fragment not found once')
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq 'Implemented nodes must preserve canonical topological order.' app/Support/Migrations/MigrationPlan.php
          ! grep -Fq 'Implemented nodes must form a canonical topological prefix.' app/Support/Migrations/MigrationPlan.php

      - name: Validate corrected machine layer
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          composer validate --strict
          php -l app/Support/Migrations/MigrationPlan.php
          vendor/bin/pint --test app/Support/Migrations/MigrationPlan.php
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          php artisan migration:plan:validate --json >/tmp/migration-plan.json
          grep -Fq '"nodes":170' /tmp/migration-plan.json
          git diff --check

      - name: Prove Stage 4 requires dependency edges not prefix materialization
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; require 'date'; y=YAML.safe_load(File.read('specs/database/final-migration-order-invariant-matrix.yml'), permitted_classes:[Date], aliases:true); s=File.read('specs/database/final-migration-order-invariant-matrix.yml'); abort('Stage4 prefix authority unexpectedly present') if s.include?('canonical_topological_prefix'); abort('edge rule missing') unless s.include?('requires_means_all_named_nodes_must_complete_successfully_before_this_node_may_execute')"
          echo 'S5_MIG_PREFIX_DIAGNOSIS=PASS_DEPENDENCY_CLOSED_SUBSET'

      - name: Remove helper workflow and commit final helper state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-s5-mig-prefix-repair.yml
          git add app/Support/Migrations/MigrationPlan.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S5-MIG-001 helper: correct registry subset rule'
          git push origin HEAD:tmp-s5-mig-prefix-repair-20260910

      - name: Validate final net repair diff
        shell: bash
        run: |
          set -euo pipefail
          BASE='adaba33040072513b05131f84dcaa2ed6e679483'
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = 'app/Support/Migrations/MigrationPlan.php'
          git diff --check "$BASE"..HEAD
          echo 'S5_MIG_PREFIX_REPAIR_MACHINE=PASS'
