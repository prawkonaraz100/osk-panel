name: tmp-s5-tst-001-closure-sync-20260910

on:
  push:
    branches: [tmp-s5-tst-001-validation-20260910]

permissions:
  contents: write

jobs:
  sync-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-tst-001-validation-20260910
          fetch-depth: 0
      - name: Patch Stage-5 gate and audit exactly once
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/s5_tst_001_patch.py
          python3 /tmp/s5_tst_001_patch.py
          ruby -ryaml -rdate -e 'g=YAML.safe_load(File.read("specs/gates/stage-5-implementation-gate.yml"), permitted_classes:[Date], aliases:true); b=g.fetch("blockers").to_h{|x|[x.fetch("id"),x.fetch("status")]}; abort unless g.dig("meta","status")=="FAIL_WITH_2_P1_BLOCKERS" && b["S5-TST-001"]=="PASS" && b["S5-CI-001"]=="OPEN" && b["S5-FOUND-001"]=="OPEN" && g.dig("quality_gate","open_P0_P1")==2 && g.dig("next_single_step","id")=="S5-CI-001" && g.dig("S5_TST_001_closure","runtime_traceability","pending_domain_materialization")==489'
          git diff --check
          test "$(grep -c '^S5_TST_001_closure:' specs/gates/stage-5-implementation-gate.yml)" = 1
          test "$(grep -c '^## 13\. S5-TST-001 — closure$' docs/117-stage-5-implementation-entry-audit.md)" = 1
          rm .github/workflows/tmp-s5-tst-001-closure-sync-20260910.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/gates/stage-5-implementation-gate.yml docs/117-stage-5-implementation-entry-audit.md .github/workflows/tmp-s5-tst-001-closure-sync-20260910.yml
          git commit -m 'S5-TST-001: synchronize gate and narrative closure'
          git push origin HEAD:tmp-s5-tst-001-validation-20260910
