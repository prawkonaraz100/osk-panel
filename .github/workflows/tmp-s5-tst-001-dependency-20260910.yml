name: tmp-s5-tst-001-dependency-20260910

on:
  push:
    branches: [tmp-s5-tst-001-validation-20260910]

permissions:
  contents: write

jobs:
  pin-yaml-parser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-tst-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - name: Add test-only YAML parser and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          composer require --dev symfony/yaml:^8.0 --no-interaction --no-progress
          composer validate --strict
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git commit -m 'S5-TST-001: pin test authority YAML parser'
          git push origin HEAD:tmp-s5-tst-001-validation-20260910
