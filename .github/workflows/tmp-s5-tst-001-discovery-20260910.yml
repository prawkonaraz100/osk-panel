name: tmp-s5-tst-001-discovery-20260910

on:
  push:
    branches: [tmp-s5-tst-001-validation-20260910]

permissions:
  contents: read

jobs:
  discover-test-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-tst-001-validation-20260910
          fetch-depth: 0
      - name: Inventory final Stage-4 test catalog
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'
          require 'date'
          m = YAML.safe_load(File.read('specs/database/final-migration-order-invariant-matrix.yml'), permitted_classes: [Date], aliases: true)
          base = m.fetch('invariant_test_matrix').fetch('tests')
          catalog = m.fetch('test_coverage_traceability_contract').fetch('final_test_catalog')
          anchors = catalog.fetch('coverage_anchor_tests')
          all = base + anchors
          ids = all.map { |t| t.fetch('test_id') }
          abort "expected 491, got #{all.size}" unless all.size == 491 && ids.uniq.size == 491
          counts = all.group_by { |t| t.fetch('test_class') }.transform_values(&:size)
          puts "TOTAL=#{all.size}"
          counts.sort.each { |k,v| puts "CLASS #{k}=#{v}" }
          %w[migration_preflight migration_postcheck].each do |klass|
            puts "--- #{klass} ---"
            all.select { |t| t['test_class'] == klass }.first(30).each do |t|
              puts [t['test_id'], t['source_invariant'], t['execution_phase'], t['expected_outcome']].join(' | ')
            end
          end
          RUBY
