name: tmp-s5-tst-001-final-validation-20260910

on:
  push:
    branches: [tmp-s5-tst-001-validation-20260910]

permissions:
  contents: read

jobs:
  final-s5-tst-001-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-tst-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - name: Install and boot deterministic runtime
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          docker compose config >/tmp/compose.rendered.yml
          docker compose up -d --wait
      - name: Re-run complete executable test harness
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --fail-on-warning | tee /tmp/phpunit.out
          sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/phpunit.out > /tmp/phpunit.clean
          grep -Eq 'Tests:[[:space:]]+19 passed[[:space:]]+\(1096 assertions\)' /tmp/phpunit.clean
          composer validate --strict
          find tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.out
          php -r '$r=require "tests/Contracts/stage4-test-implementations.php"; if(array_keys($r)!==["DBT-CORE-099","DBT-CORE-100"]) exit(1);'
      - name: Validate final machine and narrative closure
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rdate -e 'g=YAML.safe_load(File.read("specs/gates/stage-5-implementation-gate.yml"), permitted_classes:[Date], aliases:true); b=g.fetch("blockers").to_h{|x|[x.fetch("id"),x.fetch("status")]}; c=g.fetch("S5_TST_001_closure"); abort unless g.dig("meta","status")=="FAIL_WITH_2_P1_BLOCKERS" && b["S5-BOOT-001"]=="PASS" && b["S5-ENV-001"]=="PASS" && b["S5-MIG-001"]=="PASS" && b["S5-TST-001"]=="PASS" && b["S5-CI-001"]=="OPEN" && b["S5-FOUND-001"]=="OPEN" && g.dig("quality_gate","fixes_applied_total")==4 && g.dig("quality_gate","open_P0_P1")==2 && g.dig("quality_gate","result")=="FAIL_WITH_2_P1_BLOCKERS" && g.dig("next_single_step","id")=="S5-CI-001" && c.dig("authority_binding","final_stage_4_test_IDs")==491 && c.dig("runtime_traceability","implemented_executable_assertions")==2 && c.dig("runtime_traceability","pending_domain_materialization")==489 && c.dig("runtime_traceability","migration_preflight_catalog_IDs")==14 && c.dig("runtime_traceability","migration_postcheck_IDs_implemented_here")==2 && c.dig("executable_evidence","suite_tests_passed")==19 && c.dig("executable_evidence","suite_assertions")==1096'
          grep -q '^Status: `S5-TST-001 PASS`$' docs/120-stage-5-executable-test-harness.md
          grep -q '^\*\*STOP przed S5-CI-001\.\*\*$' docs/120-stage-5-executable-test-harness.md
          grep -q '^## 13\. S5-TST-001 — closure$' docs/117-stage-5-implementation-entry-audit.md
          grep -q '^\*\*Status:\*\* `S5-TST-001 PASS / 0 P0 / 2 P1 OPEN`$' docs/117-stage-5-implementation-entry-audit.md
      - name: Preservation and exact-scope gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env storage/logs/migration-execution.jsonl
          git diff --check
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git hash-object specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git hash-object docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'
          git diff --name-only fa35c5f16b7f9f8eca7e62f25d6d5d090afd2924...HEAD | grep -v '^\.github/workflows/tmp-s5-tst-001-final-validation-20260910.yml$' | sort >/tmp/actual-files
          cat > /tmp/allowed-files <<'EOF'
          composer.json
          composer.lock
          docs/117-stage-5-implementation-entry-audit.md
          docs/120-stage-5-executable-test-harness.md
          specs/gates/stage-5-implementation-gate.yml
          tests/Contracts/stage4-test-implementations.php
          tests/Feature/PostgresHarnessTest.php
          tests/Feature/Stage4MigrationPostcheckTest.php
          tests/Support/IndependentPostgres.php
          tests/Support/MigrationPreflight.php
          tests/Support/Stage4TestCatalog.php
          tests/Support/SyntheticTenantFixtureFactory.php
          tests/Unit/Stage4TraceabilityRegistryTest.php
          EOF
          sort -o /tmp/allowed-files /tmp/allowed-files
          diff -u /tmp/allowed-files /tmp/actual-files
          echo 'S5_TST_001_FINAL_GATE=PASS'
