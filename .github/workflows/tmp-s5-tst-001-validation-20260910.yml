name: tmp-s5-tst-001-validation-20260910

on:
  push:
    branches: [tmp-s5-tst-001-validation-20260910]

permissions:
  contents: read

jobs:
  validate-test-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: tmp-s5-tst-001-validation-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_pgsql, redis
          coverage: none
      - name: Install and boot deterministic services
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          docker compose config >/tmp/compose.rendered.yml
          docker compose up -d --wait
      - name: Execute S5-TST-001 PostgreSQL harness
        shell: bash
        run: |
          set -euo pipefail
          php artisan test --fail-on-warning
          composer validate --strict
          php -r "require 'vendor/autoload.php'; if (!class_exists('Symfony\\Component\\Yaml\\Yaml')) exit(1);"
          find tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$r=require "tests/Contracts/stage4-test-implementations.php"; if(array_keys($r)!==["DBT-CORE-099","DBT-CORE-100"]) exit(1);'
          ruby <<'RUBY'
          require 'yaml'
          require 'date'
          m = YAML.safe_load(File.read('specs/database/final-migration-order-invariant-matrix.yml'), permitted_classes: [Date], aliases: true)
          base = m.fetch('invariant_test_matrix').fetch('tests')
          contract = m.fetch('test_coverage_traceability_contract')
          all = base + contract.fetch('final_test_catalog').fetch('coverage_anchor_tests')
          abort unless all.size == 491 && all.map { |x| x.fetch('test_id') }.uniq.size == 491
          abort unless all.count { |x| x['test_class'] == 'migration_preflight' } == 14
          abort unless all.count { |x| x['test_class'] == 'migration_postcheck' } == 2
          abort unless contract.fetch('zero_gap_summary').fetch('result') == 'PASS_ZERO_GAPS'
          RUBY
      - name: Preservation gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env storage/logs/migration-execution.jsonl
          git diff --check
          test "$(git hash-object specs/database/final-migration-order-invariant-matrix.yml)" = 'ad5f2aa2e14ef248b95dd3dda0d1cbcb2e69d441'
          test "$(git hash-object specs/database/core-schema.yml)" = 'b0629cc48e26798d945356eaa1d0c9b1187aa542'
          test "$(git hash-object specs/gates/stage-4-database-contract-gate.yml)" = '306dabaa58223abe2f3b2a34b888b075c88e9ec4'
          test "$(git hash-object docs/87-physical-database-schema.md)" = 'a48eacd92d4a9c8e989f5d70c3bec95b9231a77c'
          test "$(git hash-object docs/116-stage-4-final-migration-order-invariant-matrix-audit.md)" = '6f76255742d4902546f45c28d54c1da6ee3d3fd7'
          test -z "$(git diff --name-only fa35c5f16b7f9f8eca7e62f25d6d5d090afd2924...HEAD | grep -E '^(app/Modules|database/migrations/stage4/|resources/|specs/database/|specs/gates/stage-4|docs/87-|docs/116-)' || true)"
          echo 'S5_TST_001_TECHNICAL_GATE=PASS'
