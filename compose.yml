name: osk-panel-local
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: osk_panel
      POSTGRES_USER: osk_panel
      POSTGRES_PASSWORD: osk_panel_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osk_panel -d osk_panel"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  moto:
    image: ghcr.io/getmoto/motoserver:5.2.2
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/config').read()"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
