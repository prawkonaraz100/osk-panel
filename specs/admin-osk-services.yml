  scope: admin_osk_service_catalog
  status: CONSOLIDATED
  consolidated_at: 2026-09-05
  authoritative_baseline: specs/implementation-baseline-v1.yml
  note: >-
    This aggregate summarizes admin services only. Screen-level implementation
    details live in specs/screens. Legal/design/security/api specs override this file.

