meta:
  project: osk-panel
  scope: admin_osk_only
  audited_at: 2026-09-05
  goal: functional_service_parity_without_copying_ui_or_code
  source_system: https://biz.prawo-jazdy-360.pl/

mapping_definition:
  complete_when:
    - route_known
    - screens_known
    - fields_known
    - table_columns_known
    - filters_and_search_known
    - all_actions_known
    - bulk_actions_known
    - validations_known
    - modals_known
    - statuses_known
    - state_transitions_known
    - permissions_known
    - cross_module_dependencies_known
    - finance_effects_known
    - notifications_known
    - documents_and_print_known
    - integrations_known
    - error_and_retry_states_known
    - audit_requirements_known
    - acceptance_criteria_written

service_groups:
  core_osk:
    - id: dashboard
      route: /
      confidence: TO_VERIFY_AUTH
      required_capabilities: [operational_summary, alerts, quick_actions]

    - id: pkk
      route: /integracja-pkk
      confidence: CURRENT_CONFIRMED
      required_capabilities:
        - fetch_profile
        - view_profile
        - update_training
        - return_to_other_school
        - return_to_authority
        - return_expired_profile
        - operation_history
      requirements: [audit, idempotency, retry]

    - id: calendar
      route: /kalendarz
      confidence: CURRENT_CONFIRMED_TO_VERIFY_UI
      confirmed_from_staff_detail:
        - embedded_month_view
        - view_month
        - view_week
        - view_day
        - today
        - previous_period
        - next_period
        - add_event
        - open_full_calendar
      required_capabilities:
        - create_drive
        - assign_student
        - assign_employee
        - assign_vehicle
        - self_booking
        - employee_activity_view
        - work_time_tracking
        - conflict_detection

    - id: students
      route: /kursanci
      confidence: CURRENT_CONFIRMED_TO_VERIFY_UI
      required_capabilities:
        - create
        - edit
        - search
        - filter
        - details
        - assign_course
        - link_pkk
        - assign_license
        - create_access
        - assign_exam
        - assign_drive
        - assign_lecture
        - view_progress
        - archive

    - id: locations
      route: /lokalizacje
      confidence: USER_CONFIRMED_AUTH_SCREEN
      screen_spec: specs/screens/locations.yml
      confirmed_columns: [type, name, address]
      confirmed_types: [lecture_room, maneuvering_area]
      confirmed_actions: [add_location, edit_location, calendar_for_location]
      calendar_filter:
        query_param: b
        identifier: location_uuid
      requirements:
        - multi_location
        - location_as_calendar_resource
        - tenant_isolation
      explicitly_not_confirmed:
        - delete_location
        - deactivate_location
        - filters
        - search
        - sorting
        - bulk_actions

    - id: vehicles
      route: /pojazdy
      confidence: USER_CONFIRMED_AUTH_SCREEN
      screen_spec: specs/screens/vehicles.yml
      confirmed_columns:
        - photo
        - registration_number
        - make_model
        - categories
        - documents
      confirmed_actions:
        - add_vehicle
        - calendar_for_vehicle
        - view_vehicle_details
      calendar_filter:
        query_param: v
        identifier: vehicle_uuid
      confirmed_document_states: [expired]
      confirmed_document_types: [technical_inspection]
      requirements:
        - vehicle_as_calendar_resource
        - vehicle_documents
        - expiry_alerts
        - photo_asset_reference
        - tenant_isolation
      explicitly_not_confirmed:
        - delete_vehicle
        - archive_vehicle
        - service_state
        - location_relation
        - filters
        - search
        - sorting
        - bulk_actions

    - id: staff
      route: /pracownicy
      confidence: USER_CONFIRMED_AUTH_SCREEN
      screen_specs:
        list: specs/screens/staff.yml
        create: specs/screens/staff-create.yml
        detail: specs/screens/staff-detail.yml
        edit: specs/screens/staff-edit.yml
      docs:
        - docs/21-staff-screen.md
        - docs/22-staff-create-form.md
        - docs/23-staff-detail-screen.md
        - docs/24-staff-edit-form.md

      confirmed_columns:
        - photo
        - full_name
        - email
        - documents
        - login_account

      confirmed_profile_fields:
        - email
        - first_name
        - last_name
        - staff_type_ids
        - pesel
        - phone
        - authorization_number
        - category_ids
        - location_ids
        - card_valid_until
        - medical_exam_valid_until
        - psychological_exam_valid_until
        - photo
        - create_login_account

      required_by_visible_edit_marker:
        - email
        - first_name
        - last_name
        - staff_type_ids

      confirmed_multi_selects:
        - staff_type_ids
        - category_ids
        - location_ids

      confirmed_staff_type_observations:
        technical_or_detail_value: OfficeWorker
        edit_ui_label: Pracownik biurowy
        modeling_decision: separate_code_from_localized_label

      confirmed_global_actions:
        - add_staff
        - archive_staff
        - delete_staff
        - view_staff_details
        - calendar_for_staff

      confirmed_detail_actions:
        - edit_staff_details
        - edit_panel_access
        - open_full_calendar
        - add_calendar_event
        - calendar_previous_period
        - calendar_next_period
        - calendar_today
        - calendar_view_month
        - calendar_view_week
        - calendar_view_day

      confirmed_edit_actions:
        - save_staff_changes
        - cancel_staff_edit
        - close_staff_edit
        - select_staff_types
        - select_categories
        - select_locations
        - select_or_replace_photo
        - remove_photo_from_form
        - request_create_login_account

      calendar_filter:
        query_param: w
        identifier: staff_uuid

      confirmed_document_types:
        - card_or_license
        - medical_exam
        - psychological_exam
      confirmed_document_states:
        - valid
        - expired

      confirmed_login_account_states:
        - false
      confirmed_account_behavior:
        - staff_can_exist_without_login_account
        - login_account_can_be_requested_later_from_edit_form
        - panel_access_has_separate_edit_section

      confirmed_relationships:
        - staff_many_to_many_staff_types
        - staff_many_to_many_categories
        - staff_many_to_many_locations
        - staff_optional_user_account
        - staff_has_many_documents
        - staff_calendar_context

      requirements:
        - staff_profile_separate_from_user_account
        - optional_login_account
        - explicit_create_login_account_control
        - permissions_separate_from_staff_type
        - multiple_independent_documents
        - staff_as_calendar_resource
        - photo_optional
        - photo_asset_reference
        - protect_pesel
        - tenant_validate_location_ids
        - tenant_isolation

      remaining_unknowns:
        - exact_staff_type_dictionary
        - panel_access_edit_screen
        - account_provisioning_flow
        - invitation_vs_generated_password
        - default_account_permissions
        - password_reset
        - exact_backend_field_validations
        - archive_confirmation_and_effects
        - delete_confirmation_and_effects
        - calendar_add_event_form
        - photo_removal_commit_behavior
        - save_success_and_error_messages
        - filters
        - search
        - sorting
        - bulk_actions

  education_sales:
    - id: license_purchase
      route: /licencje/wykup
      confidence: CURRENT_CONFIRMED
      required_capabilities: [select_duration, quantity, order, payment, inventory]

    - id: license_management
      route: /licencje/panel
      confidence: RULES_CONFIRMED_TO_VERIFY_UI
      states: [inventory, assigned, activated, expired]
      required_capabilities:
        - assign_to_student
        - create_by_email
        - create_by_generated_credentials
        - select_language
        - revoke_before_activation
        - restore_inventory
        - view_progress

    - id: learning_progress
      confidence: CURRENT_CONFIRMED_TO_VERIFY_UI
      required_capabilities: [student_progress, question_stats, learning_activity]

    - id: internal_exam_purchase
      route: /egzamin-wewnetrzny/wykup
      confidence: CURRENT_CONFIRMED
      required_capabilities: [purchase_inventory, free_grants, balance, payment]

    - id: internal_exam_management
      route: /egzamin-wewnetrzny/panel
      confidence: RULES_CONFIRMED_TO_VERIFY_UI
      states: [available, generated, started, finished, consumed]
      required_capabilities:
        - generate_for_student
        - generate_link
        - start_local_exam
        - save_result
        - consume_inventory
        - digital_exam_card
        - print_exam_card

    - id: lectures
      route: /wyklady
      confidence: CURRENT_CONFIRMED_TO_VERIFY_UI
      required_capabilities: [category_selector, materials_catalog, presentation_mode]

    - id: instructor_training
      route: /szkolenie-z-instruktorem
      confidence: CURRENT_CONFIRMED_TO_VERIFY_ADMIN_ACTIONS
      required_capabilities:
        - sections
        - video_lessons
        - progress
        - control_questions
        - retry_questions
        - skip_questions
        - category_specific_content

  marketing:
    - id: business_cards
      route: /wizytowki
      confidence: AUTH_MENU_HELP_CONFIRMED_TO_VERIFY_UI
      collection_model: true
      required_capabilities:
        - list
        - create
        - edit
        - link_location
        - public_preview
        - publication_status
        - photos
        - reviews
        - report_review

    - id: ads
      confidence: CURRENT_CONFIRMED_RULES_CONFIRMED_TO_VERIFY_AUTH_MENU_CHILDREN
      placements:
        - position_zero
        - side_top
        - side_bottom
        - test_and_course
        - fullscreen
      coming_soon: [premium_business_card]
      required_capabilities:
        - select_city
        - select_placement
        - auction_view
        - binding_bid
        - bid_history
        - winner
        - payment
        - desktop_creative
        - mobile_creative
        - moderation
        - text_fallback
        - campaign_activation

    - id: ranking_reviews
      confidence: RULES_CONFIRMED
      required_capabilities: [public_profile, ratings_1_5, moderation, report_review, ranking_score]

    - id: sponsored_article
      confidence: RULES_CONFIRMED
      required_capabilities: [purchase, client_content_or_copywriting, images, moderation, publication, archive]

    - id: partner_banner
      confidence: RULES_CONFIRMED
      required_capabilities: [download_asset, implementation_instructions]

    - id: commercial_services
      confidence: CURRENT_CONFIRMED
      services: [seo_audit, seo_optimization, google_ads, website_build, cms]

  account_and_finance:
    - id: settings
      route: /ustawienia
      confidence: USER_CONFIRMED_AUTH_SCREEN
      screen_spec: specs/screens/settings.yml
      sections: [basic_data, company_data, pkk_api_data, terms]
      confirmed_fields:
        - first_name
        - last_name
        - email
        - company_name
        - street
        - house_number
        - unit_number
        - city
        - postal_code
        - phone
        - pkk_school_name
        - pkk_osk_registry_number
        - pkk_external_osk_login
      confirmed_actions: [save, view_versioned_terms]
      explicitly_not_observed_on_screen:
        - nip
        - password_change
        - session_management
        - notification_settings
        - billing_data
        - marketing_consents
      requirements:
        - tenant_isolation
        - audit_pkk_settings_changes
        - external_osk_login_must_not_be_application_login
        - preserve_terms_version_history

    - id: purchase_history
      route: /historia-zakupow
      confidence: USER_CONFIRMED_AUTH_SCREEN
      screen_spec: specs/screens/purchase-history.yml
      confirmed_columns:
        - display_number
        - order_items
        - ordered_at
        - booked_at
        - gross_amount
        - status
      confirmed_statuses: [unpaid]
      confirmed_actions: [pay_unpaid_order]
      confirmed_page_sizes: [10, 25, 50, 100]
      confirmed_product_examples:
        - internal_exams
        - license_31_days
        - license_90_days
        - license_180_days
      requirements:
        - unified_orders
        - multiple_order_items
        - nullable_booked_at_before_payment
        - secure_payment_reference
        - idempotent_payment_confirmation

    - id: invoices
      confidence: HISTORICAL_INDEX_TO_VERIFY_AUTH
      implementation_decision: documents_available_from_purchase_history

system_services:
  - rbac
  - tenant_isolation
  - notifications_and_reminders
  - audit_log
  - document_retention
  - payment_ledger
  - integration_logs

business_offer_parity:
  - osk_management_panel
  - pkk_integration
  - student_elearning_licenses
  - student_learning_monitoring
  - internal_exams
  - lecture_materials
  - instructor_training
  - business_cards_and_ranking
  - local_advertising
  - sponsored_content
  - purchase_history_and_billing
  - optional_seo_web_ads_services

remaining_button_level_gaps:
  - dashboard
  - students
  - location_add_edit_form_and_validation
  - vehicle_add_details_edit_documents_and_categories
  - staff_panel_access_account_provisioning_exact_types_validation_archive_delete_and_event_form
  - calendar_main_screen_and_event_form
  - pkk_ui
  - license_management_ui
  - internal_exam_management_ui
  - business_cards
  - ads_submenu_and_campaign_management
  - lectures_ui
  - instructor_training_admin_actions
  - settings_validation_and_save_behavior
  - purchase_history_paid_state_filters_and_documents
