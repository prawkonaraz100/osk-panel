openapi: 3.1.0
info:
  title: PrawkoNaRaz OSK API shared components
  version: 0.2.1
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      schema: { type: string }
    Direction:
      name: direction
      in: query
      schema: { type: string, enum: [asc, desc] }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
    StudentId: { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    HandoffId: { name: handoffId, in: path, required: true, schema: { type: string, format: uuid } }
    CourseEnrollmentId: { name: courseEnrollmentId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    OperationIdParam: { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    SlotId: { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
    LocationId: { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
    StaffId: { name: staffId, in: path, required: true, schema: { type: string, format: uuid } }
    VehicleId: { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    ChargeId: { name: chargeId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentId: { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    AttemptId: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    AccessId: { name: accessId, in: path, required: true, schema: { type: string, format: uuid } }
    StationId: { name: stationId, in: path, required: true, schema: { type: string, format: uuid } }
    ExamStationCredential:
      name: X-Exam-Station-Credential
      in: header
      required: true
      schema: { type: string, minLength: 45 }
      description: Opaque station credential presented only by the exact logical workstation. Never log or persist recoverably.
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    Provider: { name: provider, in: path, required: true, schema: { type: string } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    EntitlementId: { name: entitlementId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Error:
      description: Error response using the common API envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Accepted:
      description: Operation accepted for processing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OperationAccepted' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }
    OperationAccepted:
      type: object
      required: [request_id, status]
      properties:
        request_id: { type: string }
        status: { type: string }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    GenericObject:
      type: object
      additionalProperties: true

    AuthSession:
      type: object
      required: [id, created_at, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, format: password }
        remember_me: { type: boolean, default: false }
        return_url: { type: [string, 'null'], description: Local allow-listed application path only. }
    RegistrationRequest:
      type: object
      required: [first_name, last_name, email, password, organization_name, accepted_terms_version]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        organization_name: { type: string }
        nip: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        accepted_terms_version: { type: string }
        marketing_consent: { type: boolean, default: false }
    PasswordForgotRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string, description: E-mail or login. }
    PasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password }
    AccountClosureRequest:
      type: object
      properties:
        reason: { type: [string, 'null'] }

    Organization:
      type: object
      required: [id, name, timezone, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        nip: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        timezone: { type: string }
        status: { type: string, readOnly: true }
        osk_registry_number: { type: [string, 'null'] }
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        nip: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        timezone: { type: string }
        osk_registry_number: { type: [string, 'null'] }
    UserBasicData:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
    OrganizationCompanyData:
      type: object
      required: [company_name, street, house_number, city, postal_code]
      properties:
        company_name: { type: string }
        street: { type: string }
        house_number: { type: string }
        unit_number: { type: [string, 'null'] }
        city: { type: string }
        postal_code: { type: string }
        phone: { type: [string, 'null'] }
    PkkIntegrationSettings:
      type: object
      properties:
        school_name: { type: string }
        osk_registry_number: { type: string }
        external_osk_login: { type: string }
        operator_first_name: { type: string }
        operator_last_name: { type: string }
        configured: { type: boolean, readOnly: true }
      description: Observed PKK configuration fields; future provider secrets, if any, are separate write-only/secret references and must not be invented from the observed screen.
    OskSettingsProjection:
      type: object
      required: [basic_data, company_data, pkk_api_data]
      properties:
        basic_data: { $ref: '#/components/schemas/UserBasicData' }
        company_data: { $ref: '#/components/schemas/OrganizationCompanyData' }
        pkk_api_data: { $ref: '#/components/schemas/PkkIntegrationSettings' }
        accepted_terms:
          type: array
          items: { $ref: '#/components/schemas/TermsAcceptance' }
    UpdateOskSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        basic_data:
          type: object
          additionalProperties: false
          properties:
            first_name: { type: string }
            last_name: { type: string }
            email: { type: string, format: email }
        company_data:
          type: object
          additionalProperties: false
          properties:
            company_name: { type: string }
            street: { type: string }
            house_number: { type: string }
            unit_number: { type: [string, 'null'] }
            city: { type: string }
            postal_code: { type: string }
            phone: { type: [string, 'null'] }
        pkk_api_data:
          type: object
          additionalProperties: false
          properties:
            school_name: { type: string }
            osk_registry_number: { type: string }
            external_osk_login: { type: string }
    TermsAcceptance:
      type: object
      required: [version, accepted_at]
      properties:
        version: { type: string }
        accepted_at: { type: string, format: date-time }
        accepted_by_user_id: { type: string, format: uuid }

    Student:
      type: object
      required: [id, first_name, last_name, no_pesel, created_at, version]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: [string, 'null'], format: date }
        no_pesel: { type: boolean }
        pesel_masked: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        default_location_id: { type: [string, 'null'], format: uuid }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time, readOnly: true }
        version: { type: integer }
    StudentPreview:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            courses_summary: { type: array, items: { $ref: '#/components/schemas/GenericObject' } }
            payments_summary: { $ref: '#/components/schemas/GenericObject' }
    CreateStudentRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'], format: email }
        pesel: { type: [string, 'null'] }
        no_pesel: { type: boolean, default: false }
        birth_date: { type: [string, 'null'], format: date }
        location_id: { type: [string, 'null'], format: uuid }
        initial_course: { anyOf: [{ $ref: '#/components/schemas/CreateCourseEnrollmentRequest' }, { type: 'null' }] }
        initial_license: { anyOf: [{ $ref: '#/components/schemas/CreateInitialLicenseAssignmentRequest' }, { type: 'null' }] }
    UpdateStudentRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'], format: email }
        pesel: { type: [string, 'null'] }
        no_pesel: { type: boolean }
        birth_date: { type: [string, 'null'], format: date }
        location_id: { type: [string, 'null'], format: uuid }
    StudentLearningAccount:
      type: object
      required: [id, student_id, login_identifier, language_code, status]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        login_identifier: { type: string }
        language_code: { type: string }
        status: { type: string, readOnly: true }
    CreateLearningAccountRequest:
      type: object
      required: [login_identifier, language_code]
      properties:
        login_identifier: { type: string }
        language_code: { type: string }
        initial_password: { type: [string, 'null'], format: password, description: One-time input; never stored recoverably. }
    UpdateLearningAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        login_identifier: { type: string }
        language_code: { type: string }
    LearningAccountHandoff:
      type: object
      required: [id, account_id, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        one_time_plaintext_password:
          type: [string, 'null']
          readOnly: true
          x-one-time-secret: true
          description: May be returned once in a secure create/reset response and is never recoverable later.
    StudentProgress:
      type: object
      properties:
        learning_account_id: { type: string, format: uuid }
        category_code: { type: string }
        tests: { $ref: '#/components/schemas/GenericObject' }
        questions: { $ref: '#/components/schemas/GenericObject' }
        handbook: { $ref: '#/components/schemas/GenericObject' }
        lectures: { $ref: '#/components/schemas/GenericObject' }
        topics: { type: array, items: { $ref: '#/components/schemas/GenericObject' } }

    CourseEnrollment:
      type: object
      required: [id, student_id, training_type, driving_category_code, started_at, training_stage, version]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        training_type: { type: string, enum: [basic, supplementary] }
        driving_category_code: { type: string }
        pkk_reference_masked: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        initial_cost:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: Optional create-time Student Finance side effect. CourseEnrollment remains a projection only and is not the financial source of truth.
        declared_theory_minutes: { type: integer, minimum: 0 }
        declared_practical_minutes: { type: integer, minimum: 0 }
        lead_instructor_id: { type: string, format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        training_stage: { type: string, enum: [unassigned, theory, practice, documentation, word_exam, supplementary_training, training_completed] }
        cancelled_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    CreateCourseEnrollmentRequest:
      type: object
      required: [training_type, driving_category_code, pkk_number, started_at, lead_instructor_id]
      properties:
        training_type: { type: string, enum: [basic, supplementary] }
        driving_category_code: { type: string }
        pkk_number: { type: string }
        started_at: { type: string, format: date-time }
        initial_cost:
          anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: Optional create-time Student Finance side effect. CourseEnrollment remains a projection only and is not the financial source of truth.
        declared_theory_minutes: { type: integer, minimum: 0, default: 0 }
        declared_practical_minutes: { type: integer, minimum: 0, default: 0 }
        recognized_external_theory_minutes: { type: integer, minimum: 0, default: 0 }
        recognized_external_practical_minutes: { type: integer, minimum: 0, default: 0 }
        lead_instructor_id: { type: string, format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        import_existing_current_osk_hours:
          type: boolean
          default: false
          description: Explicit audited opening-balance mode only; true requires the Training Session/Hour Ledger slice.
          x-stage5-dependency: training_hour_ledger
    UpdateCourseEnrollmentRequest:
      type: object
      properties:
        training_type: { type: string, enum: [basic, supplementary] }
        driving_category_code: { type: string }
        pkk_number: { type: string }
        started_at: { type: string, format: date-time }
        declared_theory_minutes: { type: integer, minimum: 0 }
        declared_practical_minutes: { type: integer, minimum: 0 }
        lead_instructor_id: { type: string, format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
    StageTransitionRequest:
      type: object
      required: [target_stage]
      properties:
        target_stage: { type: string }
        reason: { type: [string, 'null'] }
    TrainingRequirementProfile:
      type: object
      required: [rule_set_version, theory_training_required, minimum_theory_minutes, internal_theory_exam_required, practical_training_required, minimum_practical_minutes, internal_practical_exam_required]
      properties:
        rule_set_version: { type: string }
        theory_training_required: { type: boolean }
        minimum_theory_minutes: { type: integer }
        internal_theory_exam_required: { type: boolean }
        practical_training_required: { type: boolean }
        minimum_practical_minutes: { type: integer }
        internal_practical_exam_required: { type: boolean }
        exemption_basis_code: { type: [string, 'null'] }
    RequirementContextRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        state_theory_passed: { type: boolean }
        evidence_reference: { type: [string, 'null'], maxLength: 255 }
        held_categories:
          type: array
          uniqueItems: true
          items: { type: string, maxLength: 16 }
    ExemptionDecisionRequest:
      type: object
      required: [basis_code, reason]
      properties:
        basis_code: { type: string, enum: [art_23a] }
        evidence_reference: { type: [string, 'null'] }
        reason: { type: string }
    TrainingSession:
      type: object
      required: [id, course_enrollment_id, session_type, starts_at, ends_at, duration_minutes, instructor_id, status, version]
      properties:
        id: { type: string, format: uuid }
        course_enrollment_id: { type: string, format: uuid }
        session_type: { type: string, enum: [theory, practical] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 1, readOnly: true }
        instructor_id: { type: string, format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        display_name: { type: [string, 'null'], readOnly: true }
        custom_meeting_place: { type: [string, 'null'], readOnly: true }
        status: { type: string, enum: [planned, completed, cancelled], readOnly: true }
        completed_at: { type: [string, 'null'], format: date-time, readOnly: true }
        completed_by_user_id: { type: [string, 'null'], format: uuid, readOnly: true }
        cancelled_at: { type: [string, 'null'], format: date-time, readOnly: true }
        cancelled_by_user_id: { type: [string, 'null'], format: uuid, readOnly: true }
        cancellation_reason: { type: [string, 'null'], readOnly: true }
        version: { type: integer, minimum: 1, readOnly: true }
    CreateTrainingSessionRequest:
      type: object
      required: [session_type, starts_at, ends_at, instructor_id]
      properties:
        session_type: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        instructor_id: { type: string, format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        display_name: { type: [string, 'null'] }
        custom_meeting_place: { type: [string, 'null'] }
    UpdateTrainingSessionRequest:
      type: object
      additionalProperties: false
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        instructor_id: { type: string, format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        display_name: { type: [string, 'null'] }
        custom_meeting_place: { type: [string, 'null'] }
    TrainingSessionAttendance:
      type: object
      required: [training_session_id, course_enrollment_id, student_id, status, confirmed_by_user_id, confirmed_at, session_version]
      properties:
        training_session_id: { type: string, format: uuid }
        course_enrollment_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        status: { type: string, enum: [present, absent] }
        confirmed_by_user_id: { type: string, format: uuid }
        confirmed_at: { type: string, format: date-time }
        session_version: { type: integer, minimum: 1 }
    RecordTrainingSessionAttendanceRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [present, absent] }
    TrainingHoursProjection:
      type: object
      properties:
        current_osk: { $ref: '#/components/schemas/GenericObject' }
        recognized_external: { $ref: '#/components/schemas/GenericObject' }
        totals: { $ref: '#/components/schemas/GenericObject' }
    TrainingHourCorrectionRequest:
      type: object
      required: [training_part, minutes, reason]
      properties:
        training_part: { type: string, enum: [theory, practical] }
        minutes: { type: integer }
        reason: { type: string }
        source_entry_id: { type: [string, 'null'], format: uuid }
    RecognizedExternalTraining:
      type: object
      required: [id, training_part, recognized_minutes, created_at]
      properties:
        id: { type: string, format: uuid }
        training_part: { type: string, enum: [theory, practical] }
        recognized_minutes: { type: integer }
        source_school_reference: { type: [string, 'null'] }
        evidence_reference: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    RecognizeExternalTrainingRequest:
      type: object
      required: [training_part, recognized_minutes, reason]
      properties:
        training_part: { type: string, enum: [theory, practical] }
        recognized_minutes: { type: integer, minimum: 1 }
        source_school_reference: { type: [string, 'null'] }
        evidence_reference: { type: [string, 'null'] }
        reason: { type: string }

    PkkProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        course_enrollment_id: { type: string, format: uuid }
        status: { type: [string, 'null'] }
        fetched_at: { type: [string, 'null'], format: date-time }
        normalized_redacted_snapshot: { anyOf: [{ $ref: '#/components/schemas/GenericObject' }, { type: 'null' }] }
    PkkOperation:
      type: object
      required: [id, operation_type, business_status, request_id]
      properties:
        id: { type: string, format: uuid }
        operation_type: { type: string }
        business_status: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        created_at: { type: [string, 'null'], format: date-time }

    CalendarEvent:
      type: object
      required: [id, source_kind, source_id, event_type, starts_at, ends_at, status, version]
      properties:
        id: { type: string, format: uuid }
        source_kind: { type: string, enum: [calendar_event, availability_slot_booking, training_session, staff_document, vehicle_document, important_date], readOnly: true }
        source_id: { type: string, readOnly: true }
        course_enrollment_id: { type: [string, 'null'], format: uuid, readOnly: true }
        event_type: { type: string, enum: [general_event, driving_lesson, important_date] }
        name: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        student_id: { type: [string, 'null'], format: uuid }
        instructor_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        location_id: { type: [string, 'null'], format: uuid }
        custom_meeting_place: { type: [string, 'null'] }
        status: { type: string }
        version: { type: integer }
        all_day: { type: boolean, readOnly: true }
        source_date: { type: [string, 'null'], format: date, readOnly: true }
