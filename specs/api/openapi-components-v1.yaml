        id: { type: string, format: uuid }
        service_type: { type: string }
        status: { type: string }
        activation_mode: { type: string, enum: [immediate, explicit] }
        granted_at: { type: [string, 'null'], format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        effective_from: { type: [string, 'null'], format: date-time }
        effective_to: { type: [string, 'null'], format: date-time }

    DashboardProjection:
      type: object
      required: [licenses, internal_exams, activity, calendar]
      properties:
        licenses: { $ref: '#/components/schemas/GenericObject' }
        internal_exams: { $ref: '#/components/schemas/GenericObject' }
        activity: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } }
        calendar: { $ref: '#/components/schemas/GenericObject' }
    ActivityEvent:
      type: object
      required: [id, event_type, timestamp, description]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        timestamp: { type: string, format: date-time }
        actor_display_name: { type: [string, 'null'] }
        related_entity_type: { type: [string, 'null'] }
        related_entity_id: { type: [string, 'null'] }
        description: { type: string }
        safe_details: { anyOf: [{ $ref: '#/components/schemas/GenericObject' }, { type: 'null' }] }
    Notification:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        payload: { $ref: '#/components/schemas/GenericObject' }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AuditLogEntry:
      type: object
      required: [id, action, entity_type, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'] }
        actor_user_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    UploadPresignRequest:
      type: object
      required: [purpose, filename, declared_mime, size_bytes]
      properties:
        purpose: { type: string }
        filename: { type: string }
        declared_mime: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: [string, 'null'] }
    UploadPresignResponse:
      type: object
      required: [upload_id, upload_url, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    UploadCompleteRequest:
      type: object
      properties:
        sha256: { type: [string, 'null'] }
    FileAsset:
      type: object
      required: [id, purpose, media_type, size_bytes, status]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string }
        media_type: { type: string }
        size_bytes: { type: integer }
        status: { type: string }
