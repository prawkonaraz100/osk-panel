openapi: 3.1.0
info:
  title: PrawkoNaRaz OSK API
  version: 0.2.1
  description: |
    Canonical implementation contract for core OSK v1. This is our own clean-room
    API design, not a reverse-engineered competitor API. Confirmed screen/business
    capabilities are preserved through specs/reverse-engineering-manifest.yml and
    specs/api/required-operations-v1.yml. Path details are split into module files
    so coverage can grow without compressing or dropping observed flows.
servers:
  - url: /api/v1
security:
  - sessionCookie: []

tags:
  - { name: Auth }
  - { name: Organization }
  - { name: Students }
