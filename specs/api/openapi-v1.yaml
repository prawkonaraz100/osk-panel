openapi: 3.1.0
info:
  title: PrawkoNaRaz OSK API
  version: 0.1.0
  description: |
    Implementation blueprint for core OSK v1. This is our own API contract,
    not a reverse-engineered competitor API. Canonical domain terminology is
    defined in docs/82-canonical-domain-glossary.md.
servers:
  - url: /api/v1
security:
  - sessionCookie: []

tags:
  - name: Students
  - name: Courses
  - name: Training
  - name: PKK
  - name: Calendar
  - name: Locations
  - name: Staff
  - name: Vehicles
  - name: StudentFinance
  - name: Licenses
  - name: InternalExams
  - name: Purchases
  - name: Dashboard

paths:
  /students:
    get:
      tags: [Students]
      summary: List students
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Student list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudents'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Students]
      summary: Create student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Students]
      summary: Get student
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Students]
      summary: Update student
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentRequest'
      responses:
        '200':
          description: Updated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}/archive:
    post:
      tags: [Students]
      summary: Archive student
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Student archived
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}/learning-accounts:
    get:
      tags: [Students]
      summary: List student learning accounts
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Learning accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentLearningAccount'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Students]
      summary: Create learning account
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningAccountRequest'
      responses:
        '201':
          description: Learning account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAccountCreateResponse'
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}/course-enrollments:
    get:
      tags: [Courses]
      summary: List course enrollments for student
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Course enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseEnrollment'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Courses]
      summary: Create course enrollment
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseEnrollmentRequest'
      responses:
        '201':
          description: Course enrollment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEnrollment'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}:
    parameters:
      - $ref: '#/components/parameters/CourseEnrollmentId'
    get:
      tags: [Courses]
      summary: Get course enrollment
      responses:
        '200':
          description: Course enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEnrollment'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Courses]
      summary: Update course enrollment
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseEnrollmentRequest'
      responses:
        '200':
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEnrollment'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/stage-transitions:
    post:
      tags: [Courses]
      summary: Change training stage
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_stage]
              properties:
                target_stage:
                  type: string
                reason:
                  type: [string, 'null']
      responses:
        '200':
          description: Stage changed
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/requirements:
    get:
      tags: [Courses]
      summary: Get calculated training requirements
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
      responses:
        '200':
          description: Requirement profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingRequirementProfile'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/training-sessions:
    get:
      tags: [Training]
      summary: List training sessions
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
      responses:
        '200':
          description: Training sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingSession'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Training]
      summary: Create training session
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingSessionRequest'
      responses:
        '201':
          description: Training session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/training-hours:
    get:
      tags: [Training]
      summary: Get formal training time projection
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
      responses:
        '200':
          description: Training totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingHoursProjection'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/recognized-external-training:
    post:
      tags: [Training]
      summary: Recognize training completed in another OSK
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognizeExternalTrainingRequest'
      responses:
        '201':
          description: External training recognized
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/pkk:
    get:
      tags: [PKK]
      summary: Get PKK snapshot for course enrollment
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
      responses:
        '200':
          description: PKK profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkkProfile'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/pkk/fetch:
    post:
      tags: [PKK]
      summary: Fetch PKK
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: PKK fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkkOperation'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/pkk/update-and-return:
    post:
      tags: [PKK]
      summary: Update training data and return PKK
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider-normalized update payload, finalized when provider contract is available.
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkkOperation'
        default:
          $ref: '#/components/responses/Error'

  /calendar/events:
    get:
      tags: [Calendar]
      summary: List calendar events
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: student_id
          in: query
          schema: { type: string, format: uuid }
        - name: staff_id
          in: query
          schema: { type: string, format: uuid }
        - name: vehicle_id
          in: query
          schema: { type: string, format: uuid }
        - name: location_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Calendar]
      summary: Create calendar event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarEventRequest'
      responses:
        '201':
          description: Calendar event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        default:
          $ref: '#/components/responses/Error'

  /locations:
    get:
      tags: [Locations]
      summary: List locations
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Locations]
      summary: Create location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        default:
          $ref: '#/components/responses/Error'

  /staff:
    get:
      tags: [Staff]
      summary: List staff
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffProfile'
        default:
          $ref: '#/components/responses/Error'

  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles
      responses:
        '200':
          description: Vehicle list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}/charges:
    post:
      tags: [StudentFinance]
      summary: Create student charge
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCharge'
        default:
          $ref: '#/components/responses/Error'

  /students/{studentId}/payments:
    post:
      tags: [StudentFinance]
      summary: Record student payment
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordStudentPaymentRequest'
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPayment'
        default:
          $ref: '#/components/responses/Error'

  /license-inventory:
    get:
      tags: [Licenses]
      summary: Get OSK license inventory
      responses:
        '200':
          description: License inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LicenseInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /license-assignments:
    post:
      tags: [Licenses]
      summary: Assign license
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLicenseAssignmentRequest'
      responses:
        '201':
          description: License assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAssignment'
        default:
          $ref: '#/components/responses/Error'

  /license-assignments/{assignmentId}/activate:
    post:
      tags: [Licenses]
      summary: Activate license assignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: License activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseActivation'
        default:
          $ref: '#/components/responses/Error'

  /license-assignments/{assignmentId}/revoke-unactivated:
    post:
      tags: [Licenses]
      summary: Revoke unactivated assignment and restore exactly one inventory entry
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Assignment revoked
        default:
          $ref: '#/components/responses/Error'

  /internal-exam/inventory:
    get:
      tags: [InternalExams]
      summary: Get internal exam inventory
      responses:
        '200':
          description: Exam inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalExamInventoryEntry'
        default:
          $ref: '#/components/responses/Error'

  /course-enrollments/{courseEnrollmentId}/internal-exam-attempts:
    post:
      tags: [InternalExams]
      summary: Create formal internal exam attempt and reserve inventory
      parameters:
        - $ref: '#/components/parameters/CourseEnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalExamAttemptRequest'
      responses:
        '201':
          description: Attempt created and inventory reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalExamAttempt'
        default:
          $ref: '#/components/responses/Error'

  /internal-exam-attempts/{attemptId}/accesses:
    post:
      tags: [InternalExams]
      summary: Create remote or local exam access
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamAccessRequest'
      responses:
        '201':
          description: Access created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalExamAccess'
        default:
          $ref: '#/components/responses/Error'

  /internal-exam-accesses/{accessId}/start:
    post:
      tags: [InternalExams]
      summary: Start exam and consume inventory exactly once
      parameters:
        - $ref: '#/components/parameters/AccessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Exam started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalExamAttempt'
        default:
          $ref: '#/components/responses/Error'

  /internal-exam-attempts/{attemptId}/submit:
    post:
      tags: [InternalExams]
      summary: Submit/finish exam without consuming inventory again
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Exam finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalExamResult'
        default:
          $ref: '#/components/responses/Error'

  /purchase-history:
    get:
      tags: [Purchases]
      summary: List OSK platform purchases
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Purchase history
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseHistoryItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        default:
          $ref: '#/components/responses/Error'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard projection
      responses:
        '200':
          description: Dashboard projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardProjection'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Logical session cookie; concrete framework cookie name is deployment-configured.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      schema: { type: string }
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
    StudentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseEnrollmentId:
      name: courseEnrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessId:
      name: accessId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            request_id: { type: string }

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }

    ReasonRequest:
      type: object
      properties:
        reason: { type: string }

    Student:
      type: object
      required: [id, first_name, last_name, version]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: [string, 'null'], format: date }
        contact_email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        archived_at: { type: [string, 'null'], format: date-time }
        version: { type: integer }

    CreateStudentRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        pesel: { type: [string, 'null'] }
        birth_date: { type: [string, 'null'], format: date }
        contact_email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        location_id: { type: [string, 'null'], format: uuid }

    UpdateStudentRequest:
      allOf:
        - $ref: '#/components/schemas/CreateStudentRequest'

    PaginatedStudents:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    StudentLearningAccount:
      type: object
      required: [id, login_identifier, language_code, status]
      properties:
        id: { type: string, format: uuid }
        login_identifier: { type: string }
        language_code: { type: string }
        status: { type: string }

    CreateLearningAccountRequest:
      type: object
      required: [login_identifier, language_code]
      properties:
        login_identifier: { type: string }
        language_code: { type: string }
        initial_password:
          type: [string, 'null']
          description: May be accepted in OSK-managed flow but is never persisted in recoverable form.

    LearningAccountCreateResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/StudentLearningAccount'
        one_time_plaintext_password:
          type: [string, 'null']
          description: Returned only in the secure create/reset handoff flow.

