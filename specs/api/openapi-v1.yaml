components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Logical authenticated OSK session; concrete Laravel cookie name is environment-configured.
    examAccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-exam-access-token
      description: One-time/short-lived exam access token. Raw token is not stored recoverably.

