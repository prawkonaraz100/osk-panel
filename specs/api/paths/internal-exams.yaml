paths:
  /internal-exam/inventory:
    get:
      tags: [InternalExams]
      operationId: internalExamInventoryGet
      x-requirement-id: exam_inventory.get
      x-permission: exams.view
      responses:
        '200':
          description: Ledger-backed internal exam inventory projection with source-aware availability and operational state totals
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamInventoryProjection' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/orders:
    post:
      tags: [InternalExams]
      operationId: internalExamOrdersCreate
      x-requirement-id: exam_orders.create
      x-permission: exams.purchase
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, payment_method]
              properties:
                quantity: { type: integer, minimum: 1 }
                payment_method: { type: string }
      responses:
        '201':
          description: Internal exam order created; paid inventory granted after payment confirmation
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/Order' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/subjects:
    get:
      tags: [InternalExams]
      operationId: internalExamSubjectsList
      x-requirement-id: exam_management.list
      x-permission: exams.view
      x-covers-requirements: [exam_management.search, exam_management.filter, exam_management.sort, exam_management.hide_finished]
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Page' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/PerPage' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Search' }
        - name: student_id
          in: query
          description: Exact student UUID filter for student-profile exam views; tenant and assigned-student scope still apply.
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [identity_or_login, student_full_name, latest_exam_category, latest_exam_status, latest_exam_at, latest_exam_language, exam_count]
            default: student_full_name
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Direction' }
        - name: category
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: status
          in: query
          schema:
            type: array
            items: { type: string, enum: [not_assigned, not_conducted, failed, passed] }
          style: form
          explode: true
        - name: hide_finished
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Existing students/course contexts eligible for exam management; student_id filters exactly one visible student while q searches first name, last name, email and login
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamSubject' } }
                  meta: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamManagementMeta' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/capabilities:
    get:
      tags: [InternalExams]
      operationId: internalExamCapabilitiesGet
      x-requirement-id: exam_capabilities.get
      x-permission: exams.view
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: string }
        - name: part
          in: query
          required: true
          schema: { type: string, enum: [theory, practical] }
      responses:
        '200':
          description: Category/part-specific exam capability including available languages
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamCapability' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/inventory-adjustments:
    post:
      tags: [InternalExams]
      operationId: internalExamInventoryAdjust
      x-requirement-id: exam_inventory.adjust
      x-permission: exams.inventory.adjust
      x-elevated: true
      x-invariants:
        - positive_delta_creates_exactly_delta_new_adjustment_units
        - negative_delta_withdraws_only_currently_available_units_all_or_none
        - reserved_consumed_and_adjusted_out_units_are_never_withdrawn
        - technical_refund_creates_a_new_compensating_unit_without_reopening_consumed_history
        - ledger_and_operational_available_projections_match_before_and_after_adjustment
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InventoryAdjustmentRequest' }
      responses:
        '201':
          description: Audited unit-backed inventory adjustment recorded
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InventoryAdjustment' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }

  /course-enrollments/{courseEnrollmentId}/internal-exam-attempts:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsListForCourse
      x-requirement-id: exam_attempts.list_for_course
      x-permission: exams.view
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/CourseEnrollmentId' }
      responses:
        '200':
          description: Historical attempts for one course
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsCreate
      x-requirement-id: exam_attempts.create_and_reserve
      x-permission: exams.generate
      x-invariants:
        - formal_attempt_requires_persistent_student_and_course_enrollment
        - exam_part_must_be_required_by_rule_engine
        - inventory_reservation_exactly_once
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/CourseEnrollmentId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/CreateInternalExamAttemptRequest' }
      responses:
        '201':
          description: Formal attempt created and one inventory unit reserved
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsGet
      x-requirement-id: exam_attempts.get
      x-permission: exams.view
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Internal exam attempt snapshot
          headers:
            ETag:
              description: Current version of the internal exam Attempt.
              schema: { type: string, pattern: '^"v[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
    patch:
      tags: [InternalExams]
      operationId: internalExamAttemptsEditCandidateSnapshot
      x-requirement-id: exam_attempts.edit_candidate_before_start
      x-permission: exams.generate
      x-condition: before_start_only
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/EditInternalExamCandidateSnapshotRequest' }
      responses:
        '200':
          description: Candidate snapshot updated before exam start
          headers:
            ETag:
              description: Current version of the internal exam Attempt after applying the patch.
              schema: { type: string, pattern: '^"v[0-9]+"$' }
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/accesses:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesCreate
      x-requirement-id: exam_accesses.create
      x-permission: exams.generate
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/CreateExamAccessRequest' }
      responses:
        '201':
          description: Remote/local access created; reservation remains one active reservation per attempt
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAccess' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/send:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesSend
      x-requirement-id: exam_accesses.send_remote
      x-permission: exams.access.send
      x-invariants:
        - recipient_is_current_prestart_candidate_snapshot_contact_email_under_attempt_lock
        - missing_or_invalid_snapshot_email_fails_before_token_rotation
        - raw_rotated_token_is_never_persisted_in_idempotency_audit_or_outbox
        - token_prepare_commits_before_external_mail_transport
        - access_delivered_state_and_sent_audit_are_confirmed_only_after_mail_success
        - mail_transport_failure_revokes_the_prepared_token_and_marks_the_idempotency_record_delivery_failed
        - same_idempotency_key_after_delivery_failed_rotates_a_fresh_token_and_can_retry
        - completed_same_idempotency_key_replay_does_not_send_a_second_email
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Remote access prepares a nonrecoverable one-time URL, sends it outside the database transaction, and confirms delivered state only after mail success; a transport failure revokes that prepared token and the same idempotency key may safely retry with a fresh URL
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAccess' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/revoke:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesRevoke
      x-requirement-id: exam_accesses.revoke
      x-permission: exams.generate
      x-condition: before_start_only
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Access revoked; unused reservation released before start }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/start:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesStart
      x-requirement-id: exam_accesses.start
      x-permission: exams.start.local_or_exam_access_token
      x-invariants:
        - consume_inventory_exactly_once_on_start
        - station_single_active_attempt_when_local
        - finish_does_not_consume_again
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Exam started and inventory consumed exactly once
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/submit:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsSubmit
      x-requirement-id: exam_attempts.submit
      x-permission: active_exam_session_or_authorized_staff
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: '../openapi-components-v1.yaml#/components/schemas/GenericObject' }
      responses:
        '200':
          description: Exam finished; immutable question/answer snapshot and result persisted without second inventory consumption
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamResult' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/technical-abort:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsTechnicalAbort
      x-requirement-id: exam_attempts.technical_abort
      x-permission: exams.generate
      x-invariant: technical_abort_after_start_does_not_auto_restore_inventory
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Attempt technically aborted with audit; inventory remains consumed after start }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/result:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsResult
      x-requirement-id: exam_attempts.result
      x-permission: exams.results.view_or_finished_exam_access_token
      x-condition: exam_access_token_allowed_only_for_matching_finished_attempt_result_scope
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Exam result for authorized OSK user or the matching finished-attempt result token
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamResult' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/questions:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsQuestions
      x-requirement-id: exam_attempts.questions
      x-permission: exams.results.view_or_finished_exam_access_token
      x-covers-requirement: exam_result.question_review
      x-condition: exam_access_token_allowed_only_for_matching_finished_attempt_result_scope
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Immutable post-finish question review snapshot including basic/specialized groups and media references
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamQuestionSnapshot' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/documents/answer-sheet.pdf:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsAnswerSheetPdf
      x-requirement-id: exam_attempts.answer_sheet_pdf
      x-permission: exams.documents.download
      x-condition: finished_theory_attempt_only
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Immutable canonical answer-sheet PDF bound to the finished attempt evidence and template version
          headers:
            ETag:
              description: SHA-256 content identity of the canonical PDF bytes.
              schema: { type: string }
            Content-Disposition:
              description: Attachment filename for the attempt answer sheet.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: 'no-store, private' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }

  /exam-stations:
    get:
      tags: [InternalExams]
      operationId: examStationsList
      x-requirement-id: exam_stations.list
      x-permission: exams.stations.view
      responses:
        '200':
          description: Logical exam stations with derived connectivity, occupancy and effective availability.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamStation' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
    post:
      tags: [InternalExams]
      operationId: examStationRegister
      x-requirement-id: exam_stations.register_and_provision
      x-permission: exams.stations.manage
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Logical station registered and first credential provisioned; raw credential is returned once.
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamStationProvisioningResponse' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /exam-stations/{stationId}/credential:
    post:
      tags: [InternalExams]
      operationId: examStationCredentialProvision
      x-requirement-id: exam_stations.credential.provision
      x-permission: exams.stations.manage
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/StationId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: A credential is explicitly provisioned only when the station has no current nonrevoked credential.
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamStationProvisioningResponse' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /exam-stations/{stationId}/credential/rotate:
    post:
      tags: [InternalExams]
      operationId: examStationCredentialRotate
      x-requirement-id: exam_stations.credential.rotate
      x-permission: exams.stations.manage
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/StationId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Current station credential revoked and replaced; new raw credential is returned once and authenticated heartbeat is cleared.
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamStationProvisioningResponse' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /exam-stations/heartbeat:
    post:
      tags: [InternalExams]
      operationId: examStationHeartbeat
      x-requirement-id: exam_stations.authenticated_heartbeat
      x-permission: exact_station_credential
      security: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/ExamStationCredential' }
      responses:
        '200':
          description: Current exact station credential authenticated and liveness refreshed without creating an exam session or consuming inventory.
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamStationHeartbeat' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/station-transfer:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptStationTransfer
      x-requirement-id: exam_station.transfer_after_technical_failure
      x-permission: exams.start.local_and_exact_target_station_credential
      x-invariants:
        - target_station_identity_derived_from_X_Exam_Station_Credential
        - attempt_must_already_be_started
        - close_old_station_session
        - create_new_station_session
        - do_not_rebind_access_station_id
        - do_not_consume_inventory_again
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/ExamStationCredential' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Active station session transferred to the authenticated target station without second inventory consumption }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
