paths:
  /internal-exam/inventory:
    get:
      tags: [InternalExams]
      operationId: internalExamInventoryGet
      x-requirement-id: exam_inventory.get
      x-permission: exams.view
      responses:
        '200':
          description: Internal exam inventory including free/paid/adjustment source type
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamInventoryEntry' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/orders:
    post:
      tags: [InternalExams]
      operationId: internalExamOrdersCreate
      x-requirement-id: exam_orders.create
      x-permission: exams.purchase
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, payment_method]
              properties:
                quantity: { type: integer, minimum: 1 }
                payment_method: { type: string }
      responses:
        '201':
          description: Internal exam order created; paid inventory granted after payment confirmation
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/Order' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/subjects:
    get:
      tags: [InternalExams]
      operationId: internalExamSubjectsList
      x-requirement-id: exam_management.list
      x-permission: exams.view
      x-covers-requirements: [exam_management.search, exam_management.filter, exam_management.sort]
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Page' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/PerPage' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Search' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Sort' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/Direction' }
        - name: category
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: status
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: Existing students/course contexts eligible for exam management; q searches first name, last name, email and login
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamSubject' } }
                  meta: { $ref: '../openapi-components-v1.yaml#/components/schemas/PaginationMeta' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/capabilities:
    get:
      tags: [InternalExams]
      operationId: internalExamCapabilitiesGet
      x-requirement-id: exam_capabilities.get
      x-permission: exams.view
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: string }
        - name: part
          in: query
          required: true
          schema: { type: string, enum: [theory, practical] }
      responses:
        '200':
          description: Category/part-specific exam capability including available languages
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamCapability' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam/inventory-adjustments:
    post:
      tags: [InternalExams]
      operationId: internalExamInventoryAdjust
      x-requirement-id: exam_inventory.adjust
      x-permission: exams.inventory.adjust
      x-elevated: true
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InventoryAdjustmentRequest' }
      responses:
        '201': { description: Audited inventory adjustment recorded }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }

  /course-enrollments/{courseEnrollmentId}/internal-exam-attempts:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsListForCourse
      x-requirement-id: exam_attempts.list_for_course
      x-permission: exams.view
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/CourseEnrollmentId' }
      responses:
        '200':
          description: Historical attempts for one course
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsCreate
      x-requirement-id: exam_attempts.create_and_reserve
      x-permission: exams.generate
      x-invariants:
        - formal_attempt_requires_persistent_student_and_course_enrollment
        - exam_part_must_be_required_by_rule_engine
        - inventory_reservation_exactly_once
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/CourseEnrollmentId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/CreateInternalExamAttemptRequest' }
      responses:
        '201':
          description: Formal attempt created and one inventory unit reserved
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsGet
      x-requirement-id: exam_attempts.get
      x-permission: exams.view
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Internal exam attempt snapshot
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
    patch:
      tags: [InternalExams]
      operationId: internalExamAttemptsEditCandidateSnapshot
      x-requirement-id: exam_attempts.edit_candidate_before_start
      x-permission: exams.generate
      x-condition: before_start_only
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candidate_snapshot: { $ref: '../openapi-components-v1.yaml#/components/schemas/GenericObject' }
      responses:
        '200':
          description: Candidate snapshot updated before exam start
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/accesses:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesCreate
      x-requirement-id: exam_accesses.create
      x-permission: exams.generate
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/CreateExamAccessRequest' }
      responses:
        '201':
          description: Remote/local access created; reservation remains one active reservation per attempt
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAccess' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/send:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesSend
      x-requirement-id: exam_accesses.send_remote
      x-permission: exams.access.send
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: Remote link delivery queued; raw token is not persisted recoverably }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/revoke:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesRevoke
      x-requirement-id: exam_accesses.revoke
      x-permission: exams.generate
      x-condition: before_start_only
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Access revoked; unused reservation released before start }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-accesses/{accessId}/start:
    post:
      tags: [InternalExams]
      operationId: internalExamAccessesStart
      x-requirement-id: exam_accesses.start
      x-permission: exams.start.local_or_exam_access_token
      x-invariants:
        - consume_inventory_exactly_once_on_start
        - station_single_active_attempt_when_local
        - finish_does_not_consume_again
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AccessId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Exam started and inventory consumed exactly once
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamAttempt' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/submit:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsSubmit
      x-requirement-id: exam_attempts.submit
      x-permission: active_exam_session_or_authorized_staff
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: '../openapi-components-v1.yaml#/components/schemas/GenericObject' }
      responses:
        '200':
          description: Exam finished; immutable question/answer snapshot and result persisted without second inventory consumption
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamResult' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/technical-abort:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptsTechnicalAbort
      x-requirement-id: exam_attempts.technical_abort
      x-permission: exams.generate
      x-invariant: technical_abort_after_start_does_not_auto_restore_inventory
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Attempt technically aborted with audit; inventory remains consumed after start }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/result:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsResult
      x-requirement-id: exam_attempts.result
      x-permission: exams.results.view_or_finished_exam_access_token
      x-condition: exam_access_token_allowed_only_for_matching_finished_attempt_result_scope
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Exam result for authorized OSK user or the matching finished-attempt result token
          content:
            application/json:
              schema: { $ref: '../openapi-components-v1.yaml#/components/schemas/InternalExamResult' }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/questions:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsQuestions
      x-requirement-id: exam_attempts.questions
      x-permission: exams.results.view_or_finished_exam_access_token
      x-covers-requirement: exam_result.question_review
      x-condition: exam_access_token_allowed_only_for_matching_finished_attempt_result_scope
      security:
        - sessionCookie: []
        - examAccessToken: []
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Immutable post-finish question review snapshot including basic/specialized groups and media references
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/ExamQuestionSnapshot' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/documents/answer-sheet.pdf:
    get:
      tags: [InternalExams]
      operationId: internalExamAttemptsAnswerSheetPdf
      x-requirement-id: exam_attempts.answer_sheet_pdf
      x-permission: exams.documents.download
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
      responses:
        '200':
          description: Versioned answer-sheet/course-exam card PDF for the attempt
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }

  /exam-stations:
    get:
      tags: [InternalExams]
      operationId: examStationsList
      x-requirement-id: exam_stations.list
      x-permission: exams.view
      responses:
        '200':
          description: Exam stations including active/availability status
          content:
            application/json:
              schema: { type: array, items: { $ref: '../openapi-components-v1.yaml#/components/schemas/GenericObject' } }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
  /internal-exam-attempts/{attemptId}/station-transfer:
    post:
      tags: [InternalExams]
      operationId: internalExamAttemptStationTransfer
      x-requirement-id: exam_station.transfer_after_technical_failure
      x-permission: exams.start.local
      x-invariants:
        - attempt_must_already_be_started
        - close_old_station_session
        - create_new_station_session
        - do_not_consume_inventory_again
      parameters:
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/AttemptId' }
        - { $ref: '../openapi-components-v1.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_station_id, reason]
              properties:
                target_station_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '200': { description: Active station session transferred without second inventory consumption }
        default: { $ref: '../openapi-components-v1.yaml#/components/responses/Error' }
