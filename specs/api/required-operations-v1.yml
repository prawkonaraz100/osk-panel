coverage_status:
  stage3_step_2_operation_coverage: PASS
  http_requirement_rows: 169
  unique_openapi_path_method_operations_required: 158
  shared_capability_rows_reusing_existing_operationId: 11
  direct_and_shared_http_requirements_with_operationId_mapping: 169
  direct_and_shared_http_requirements_without_operationId_mapping: 0
  openapi_complete_against_this_inventory: pending_remaining_stage3_contract_gates
  operationIds_present_for_all_http_requirements: true
  shared_operation_mappings:
    students.list_filters: studentsList
    students.list_sort: studentsList
    calendar.events.important_dates_projection: calendarEventsList
    license_management.search: licenseAssignmentsList
    license_management.sort: licenseAssignmentsList
    license_management.hide_finished: licenseAssignmentsList
    license_credentials.single_pdf: learningAccountsDownloadHandoffPdf
    exam_management.search: internalExamSubjectsList
    exam_management.filter: internalExamSubjectsList
    exam_management.sort: internalExamSubjectsList
    purchase_history.pay_unpaid: orderPaymentsCreate
  modular_path_files:
    - specs/api/paths/auth-organization.yaml
    - specs/api/paths/students-courses.yaml
    - specs/api/paths/pkk-calendar.yaml
    - specs/api/paths/resources.yaml
    - specs/api/paths/licenses.yaml
    - specs/api/paths/internal-exams.yaml
    - specs/api/paths/commerce-dashboard.yaml
  shared_components:
    - specs/api/openapi-components-v1.yaml
    - specs/api/openapi-settings-components.yaml
  schema_detail_may_evolve_during_module_implementation: true
  coverage_may_not_regress: true
  ci_gate_required: true
