  DB-EVT-001:
    status: PASS
    title: legacy_event_projection_backfill_retention_and_cleanup_safety
    scope_boundary:
      closes_only_legacy_evidence_backfill_phased_constraint_activation_retention_execution_and_technical_cleanup: true
      DB_AUD_001_append_only_actor_entity_contract_preserved: true
      DB_AUD_002_redaction_policy_and_reason_contract_preserved: true
      DB_OUT_001_domain_event_identity_and_atomic_outbox_contract_preserved: true
      DB_OUT_002_at_least_once_publisher_lifecycle_preserved: true
      DB_ACT_001_activity_projection_contract_preserved: true
      DB_NOT_001_recipient_membership_contract_preserved: true
      DB_NOT_002_notification_source_and_read_lifecycle_preserved: true
      exact_retention_durations_invented_here: false
      final_DB4_10_aggregate_sync_performed_here: false

    durable_migration_review_authority:
      table: event_projection_migration_cases
      purpose: append_only_review_evidence_for_legacy_rows_that_cannot_immediately_satisfy_DB4_10_contract
      fields:
        - id
        - source_table
        - source_row_id
        - source_row_fingerprint
        - issue_code
        - evidence_class
        - resolution_state
        - evidence_reference_json_safe
        - resolution_kind_nullable
        - resolution_reason_nullable
        - reviewed_by_user_id_nullable
        - reviewed_at_nullable
        - created_at
      source_table_allowlist:
        - audit_logs
        - domain_events
        - outbox_messages
        - organization_activity_events
        - notifications
      unique_key: [source_table, source_row_id, issue_code]
      source_row_fingerprint_semantic: stable_hash_of_nonsecret_migration_relevant_fields_for_change_detection
      raw_sensitive_payload_copy_into_case: forbidden
      password_token_secret_full_PESEL_full_PKK_external_OSK_credentials: forbidden
      normal_application_UPDATE_or_DELETE_case_history: forbidden
      resolution_state_values: [open, proven_backfillable, reviewed_nonconforming, resolved]
      client_or_UI_authority: none
      migration_or_privileged_review_only: true

    evidence_classes:
      exact_durable_evidence:
        semantic: required_relation_or_state_is_proven_by_preexisting_durable_authoritative_keys_or_explicit_historical_record
        may_backfill_only_fields_exactly_proven_by_evidence: true
        may_not_infer_unproven_sibling_fields: true
      partial_but_nonconflicting:
        semantic: some_required_fields_are_proven_but_at_least_one_required_field_lacks_exact_evidence
        automatic_backfill_to_current_contract: forbidden
        action: create_or_keep_open_migration_case
      ambiguous_or_conflicting:
        semantic: multiple_possible_targets_or_evidence_conflicts_with_current_contract
        automatic_reparent_merge_delete_or_state_rewrite: forbidden
        action: reviewed_nonconforming_or_open_case_until_explicit_resolution
      unsafe_payload_detected:
        semantic: legacy_technical_or_audit_payload_contains_forbidden_secret_or_full_sensitive_identifier
        use_payload_to_guess_actor_recipient_event_or_entity: forbidden
        action: security_review_plus_policy_controlled_remediation_without_silent_history_rewrite
      absence_of_evidence_is_not_evidence_of_default: true

    forbidden_legacy_inference:
      - timestamp_proximity
      - same_organization_only
      - request_id_similarity_without_exact_historical_binding
      - outbox_id_or_attempt_count_similarity
      - event_type_similarity
      - payload_text_similarity
