        allowed_only_for_organization_scope: true
        entity_type_required: true
        entity_id_required: true
        exact_same_tenant_validation: >-
          DEFERRABLE INITIALLY DEFERRED constraint trigger or equivalent database guard
          generated from a closed allowlist of tenant-owned auditable entity types; the
          guard must prove the referenced row exists with the exact audit organization_id.
        unknown_or_unregistered_entity_type: reject
      global_relational:
        entity_type_required: true
        entity_id_required: true
        exact_existence_validation: >-
          database guard against a closed allowlist of global auditable entity types;
          no tenant ownership is implied by a global relation.
        unknown_or_unregistered_entity_type: reject
      snapshot_only:
        purpose: external_or_nonrelational_reference_without_false_FK_claim
        entity_type_required: true
        entity_id_nullable_when_action_has_no_stable_external_identifier: true
        type_must_be_explicitly_allowlisted_as_snapshot_only: true
