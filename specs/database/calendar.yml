next_single_blocker_after_gate:
  id: DB-CAL-004
  reason: >-
    Same-tenant integrity, manual/system storage and race-safe overlap enforcement are
    now closed. The next isolated blocker is CalendarEvent lifecycle and optimistic
    concurrency; own-scope ownership, availability booking lifecycle and TrainingSession
    integration remain out of scope until their own gates.
