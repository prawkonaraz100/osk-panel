      - add_deferrable_training_session_exact_claim_guard
      - change_runtime_calendar_events_event_type_check_to_general_event_only_after_legacy_driving_lesson_rows_are_resolved
      - run_calendar_projection_mutation_routing_handoff_and_cross_owner_GiST_race_tests
