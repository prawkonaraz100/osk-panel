  DB-CAL-005:
    severity: P1
    status: OPEN
    title: calendar_manage_own_has_no_canonical_database_owner_resolution
    diagnosis: >-
      RBAC already defines calendar.manage.own with own scope and fail-closed behavior
      when a target has no canonical owner relation. CalendarEvent currently exposes
      created_by_user_id and optional instructor_id but the database contract does not
      state which relation is authoritative for own-scope authorization. Availability
      slot publishing with own scope has the same ambiguity.
    closure_must_define:
      - canonical_own_resolver_for_calendar_event
      - canonical_own_resolver_for_availability_slot
      - behavior_for_general_event_without_instructor
      - behavior_for_driving_lesson_with_instructor
      - behavior_after_staff_membership_unlink_or_archive
      - no_created_by_shortcut_that_silently_expands_instructor_scope_unless_explicitly_decided
      - permission_scope_tests_for_own_assigned_students_assigned_locations_organization
    constraint: >-
      DB4_5 may implement the existing DB4_2 own semantics but may not silently
      redefine the global meaning of own, assigned_students or assigned_locations.

  DB-CAL-006:
    severity: P1
    status: OPEN
    title: availability_slot_booking_lifecycle_and_exactly_once_boundary_are_incomplete
    diagnosis: >-
      Stage-3 API promises that a slot is atomically booked for one Student and the
      test strategy requires a double-booking race test. The physical row has status,
      booked_student_id, booked_at and version but no state matrix, no atomic book/cancel
      transaction contract, no final concurrency boundary and no explicit representation
      of the reservation/calendar effect created by a successful booking.
    closure_must_define:
      - slot_status_values_and_field_consistency_checks
      - one_booking_effect_per_slot
      - booking_row_lock_and_idempotency_order
      - stale_update_vs_book_vs_cancel_behavior
      - same_tenant_student_booking_boundary
      - booked_slot_mutability_policy
      - whether_successful_booking_creates_or_links_exactly_one_calendar_reservation_event
      - resource_conflict_revalidation_at_booking_commit
      - cancellation_history_and_reavailability_policy
      - double_booking_and_book_cancel_race_tests

  DB-CAL-007:
    severity: P1
    status: OPEN
    title: driving_lesson_calendar_event_vs_formal_training_session_source_of_truth_is_ambiguous
    diagnosis: >-
      DB4_4 established TrainingSession as the formal source for scheduled training,
      verified attendance and credited ledger time. Calendar simultaneously models a
      driving_lesson CalendarEvent with the same Student/Instructor/Vehicle/Location
      and time concepts, but no physical relation or projection rule currently states
      whether one owns the other. Independent mutable rows could drift in time/resources
      or allow a Calendar complete/cancel action to disagree with formal TrainingSession.
    closure_must_define:
      - exactly_one_canonical_schedule_owner_for_formal_driving_lesson
      - relation_or_projection_between_calendar_and_training_session
      - no_double_mutable_copy_of_time_and_resources_without_atomic_consistency_boundary
      - create_update_cancel_reschedule_orchestration_direction
      - calendar_complete_must_not_credit_training_hours_outside_DB_TRN_006_pipeline
      - conflict_engine_reads_one_effective_reservation_fact
      - historical_reference_survives_cancel_and_correction
      - integration_tests_for_calendar_vs_training_session_consistency

