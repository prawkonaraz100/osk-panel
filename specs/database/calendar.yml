# DB-CAL-006
availability_slot_booking_lifecycle_and_exactly_once:
  blocker: DB-CAL-006
  severity: P1
  status: PASS

  canonical_status_values: [available, booked, cancelled]
  concurrency_root: availability_slots.version
  booked_student_and_booked_at_pair_required: true
  cancelled_slot_terminal_and_not_auto_republished: true
  normal_hard_delete: forbidden

  DB_CAL_007_extension_fields:
    training_session_id:
      type: uuid
      nullable: true
      meaning: immutable_link_after_explicit_formalization_of_booked_reservation
      same_tenant_FK:
        source_columns: [organization_id, training_session_id]
        target_table: training_sessions
        target_columns: [organization_id, id]
        match: MATCH_SIMPLE
        on_update: RESTRICT
        on_delete: RESTRICT
      unique_when_nonnull:
        columns: [organization_id, training_session_id]
      normal_clear_after_link: forbidden

  booked_substates_after_DB_CAL_007:
    unformalized:
      training_session_id: null
      availability_slot_booking_claims: exact_student_and_nonnull_slot_resources
      slot_is_current_reservation_owner: true
      cancel_via_slot_command: allowed
    formalized:
      training_session_id: nonnull
      booked_student_id: nonnull
      booked_at: nonnull
      availability_slot_booking_claims: zero
      slot_is_current_reservation_owner: false
      linked_training_session_is_current_schedule_owner: true
      generic_slot_PATCH: forbidden
      slot_cancel_command: forbidden_use_training_session_lifecycle
      calendar_booked_slot_projection_suppressed_to_avoid_duplicate_item: true
    cancelled:
      training_session_id: null
      availability_slot_booking_claims: zero

  formalization_history_extension:
    lifecycle_event_type_added: formalized
    transition: booked_to_booked_material_version
    requires_pre_state_training_session_id_null: true
    requires_post_state_training_session_id_nonnull: true
    booking_student_id_snapshot: preserve_current_booked_student
    slot_version_increment: exactly_once
    same_status_material_transition_allowed_only_for_this_dedicated_command: true

  linked_student_and_session_guard:
    enforcement: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
    when_training_session_id_nonnull_requires:
      - slot_status_equals_booked
      - linked_training_session_session_type_equals_practical
      - linked_training_session_organization_equals_slot_organization
      - linked_training_session_course_student_equals_slot_booked_student_id
    current_slot_time_resource_fields_after_formalization_are_historical_booking_snapshot: true
    later_training_session_reschedule_does_not_rewrite_slot_snapshot: true

  existing_book_and_cancel_rules_preserved:
    booking_permission: calendar.book_for_student
    booking_auto_creates_training_session: false
    reason_no_auto_create: booking_request_has_no_unambiguous_course_context_and_must_not_guess
    cancelled_slot_auto_republished: false
    formalized_slot_auto_republished_when_session_cancelled_or_completed: false

  self_audit:
    unformalized_booking_keeps_DB_CAL_006_exactly_once_claims: PASS
    formalized_booking_transfers_reservation_owner_without_second_claim_set: PASS
    training_session_link_same_tenant_and_unique: PASS
    booked_student_matches_linked_session_course_student: PASS
    slot_snapshot_not_rewritten_by_later_session_reschedule: PASS
    formalized_slot_cannot_be_cancelled_independently_from_training_session: PASS
    no_auto_reavailability_after_formalization_or_session_terminal_state: PASS
    aggregate_core_schema_modified_in_step: false
    aggregate_docs87_modified_in_step: false
    Laravel_migrations_created: false

# DB-CAL-007
formal_driving_lesson_training_session_source_of_truth:
  blocker: DB-CAL-007
  severity: P1
  status: PASS
  goal: >-
    Make TrainingSession the only mutable schedule owner for formal training while
    preserving the calendar driving_lesson UX as a read/command projection, extending
    the shared conflict boundary to TrainingSession, and defining an explicit booked-slot
    handoff with no duplicate reservation fact or training-credit shortcut.

  authority_reused:
    formal_training_contract: specs/database/students-courses-training.yml
    DB_TRN_006_training_session_statuses: [planned, completed, cancelled]
    DB_TRN_006_training_session_concurrency_root: training_sessions.version
    DB_TRN_006_schedule_fields:
      - starts_at
      - ends_at
      - instructor_id
      - vehicle_id
      - location_id
    DB_TRN_006_formal_credit_pipeline: TrainingSession_to_verified_Attendance_to_TrainingHourLedger
    DB_TRN_006_complete_is_only_base_credit_creation_path: true
    calendar_form_sources:
      - specs/screens/calendar.yml
      - specs/screens/calendar-add-event.yml
    calendar_API_source: specs/api/paths/pkk-calendar.yaml
    training_API_source: specs/api/paths/students-courses.yaml

  canonical_schedule_ownership:
    formal_training_business_owner: training_sessions
    practical_formal_lesson_calendar_type: driving_lesson
    calendar_events_is_formal_training_schedule_owner: false
    calendar_events_stores_formal_driving_lesson_row: false
    training_session_time_and_resource_fields_mirrored_into_mutable_calendar_row: false
    calendar_item_is_projection: true
    projection_identity:
      source_kind: training_session
      source_id: training_sessions.id
      stable_opaque_calendar_id_may_encode_source_kind_and_id: true
      must_not_resolve_as_calendar_events_primary_key: true
    source_fields:
      starts_at: training_sessions.starts_at
      ends_at: training_sessions.ends_at
      status: training_sessions.status
      version: training_sessions.version
      student_id: course_enrollments.student_id
      instructor_id: training_sessions.instructor_id
      vehicle_id: training_sessions.vehicle_id
      location_id: training_sessions.location_id
      display_name: training_session_calendar_details.display_name
      custom_meeting_place: training_session_calendar_details.custom_meeting_place
    only_practical_session_projects_as_driving_lesson: true
    theory_session_calendar_type_not_invented: true

  training_session_calendar_details:
    purpose: calendar_only_companion_metadata_not_schedule_source
    cardinality: zero_or_one_per_training_session
    fields:
      - organization_id_uuid_not_null
      - training_session_id_uuid_PK_or_unique_not_null
      - display_name_text_nullable
      - custom_meeting_place_text_nullable
      - created_at_timestamptz_not_null
      - updated_at_timestamptz_not_null
    same_tenant_session_FK:
      source_columns: [organization_id, training_session_id]
      target_table: training_sessions
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    practical_session_only_guard:
      deferrable_or_transactional_DB_guard: true
      session_type_must_equal_practical_when_row_exists: true
    custom_text_check: custom_meeting_place_is_null_or_btrim_nonempty
    meeting_place_cross_table_guard:
      deferrable_or_transactional_DB_guard: true
      invariant: >-
        For a practical TrainingSession projected in Calendar, location_id and
        training_session_calendar_details.custom_meeting_place are zero-or-one sources.
      both_null_allowed: true
      both_nonnull_forbidden: true
    display_name_or_custom_text_mutation_changes_training_session_version: true
    reason: calendar_projection_clients_need_one_expected_version_for_entire_formal_lesson_item
    metadata_update_without_matching_training_session_version_increment: forbidden
    metadata_hard_delete_after_terminal_session_as_normal_edit: forbidden

  runtime_calendar_storage_supersession:
    DB_CAL_002_provisional_manual_driving_lesson_row_rule:
      superseded: true
      current_rule: calendar_events_runtime_event_type_check_general_event_only
      rationale: >-
        DB-CAL-002 explicitly left formal-driving-lesson storage for DB-CAL-007. Keeping
        a second mutable CalendarEvent with the same schedule fields would violate the
        already authoritative TrainingSession schedule and formal credit lifecycle.
    DB_CAL_004_calendar_event_driving_lesson_lifecycle_rule:
      superseded_for_formal_lessons: true
      current_rule: CalendarEvent lifecycle applies only to manual general_event rows
    DB_CAL_005_calendar_manage_own_on_driving_lesson_CalendarEvent:
      superseded_for_formal_lessons: true
      current_rule: view ownership resolves through TrainingSession instructor, mutations require training permissions
    visible_event_type_option_removed: false
    driving_lesson_UI_capability_removed: false

  calendar_command_routing:
    general_event:
      persistence: calendar_events
      create_update_cancel_complete: DB_CAL_004_commands_and_calendar_permissions
    driving_lesson:
      persistence: training_sessions_plus_optional_training_session_calendar_details
      create:
        canonical_command: TrainingSession_create_with_session_type_practical
        permission: training_sessions.create
        course_context_required: true
        student_id_must_equal_course_enrollment_student: true
        calendar_manage_permission_alone_is_sufficient: false
      update_or_reschedule:
        canonical_command: TrainingSession_planned_PATCH
        permission: training_sessions.edit
        expected_version: training_sessions.version
        updates_calendar_companion_metadata_same_transaction_when_requested: true
      cancel:
        canonical_command: TrainingSession_cancel
        permission: training_sessions.cancel
        expected_version_required_at_domain_boundary: true
      complete:
        canonical_command: TrainingSession_complete
        permission: training_sessions.edit
        requires_DB_TRN_006_verified_attendance_and_credit_equivalence: true
      generic_calendar_event_mutation_endpoint_may_target_training_projection: false
    Stage5_contract_sync:
      current_CreateCalendarEventRequest_lacks_course_enrollment_id: true
      current_calendar_event_paths_are_calendar_event_row_oriented: true
      required_change: >-
        Keep the visible Add Event/Jazda capability but route the driving_lesson branch
        to the TrainingSession command contract. Add explicit course context or a
        source-specific operation/schema. Do not silently select a course when the
        student has zero or multiple eligible active enrollments.
      exact_union_schema_operation_ids_permissions_and_errors: Stage5_acceptance_contract_sync

  course_context_resolution_for_calendar_driving_lesson_create:
    preferred_authority: explicit_course_enrollment_id
    selected_student_is_not_sufficient_when_course_context_ambiguous: true
    implicit_resolution_allowed_only_when_exactly_one_eligible_active_course_is_provable: true
    zero_or_multiple_eligible_courses_result: validation_requires_explicit_course_context
    never_choose_latest_created_course_or_first_row: true
    course_must_be_active_after_lock: true
    session_type_for_calendar_driving_lesson: practical
    visible_student_field_may_be_used_as_search_input_but_formal_student_is_derived_from_course: true

  training_session_claim_owner_kind:
    previous_allowed_claim_owner_kinds: [calendar_event, availability_slot_booking]
    allowed_after_DB_CAL_007: [calendar_event, availability_slot_booking, training_session]
    database_check_required: true
    owner_guard_same_tenant_training_session_required: true
    exact_claim_guard: DB_CAL_003_training_session_claim_guard
    planned_theory_and_practical_sessions_claim_resources: true
    completed_or_cancelled_sessions_claim_resources: false
    source_of_student_claim: course_enrollments.student_id
    source_of_instructor_vehicle_location_and_time: training_sessions
    claims_are_not_training_hour_ledger: true

  training_session_schedule_transactions_with_claims:
    create:
      lock_order:
        - course_enrollment_FOR_UPDATE
        - insert_training_session
        - claims_student_instructor_vehicle_location
      requirements:
        - parent_course_active
        - same_tenant_relations_DB_TRN_001
        - status_planned_version_1
        - duration_rule_DB_TRN_006
        - exact_training_session_claim_set
        - GiST_conflict_boundary
      conflict_rolls_back_session_metadata_and_claims: true
    planned_PATCH_or_reschedule:
      lock_order:
        - course_enrollment_FOR_UPDATE
        - training_session_FOR_UPDATE
        - claims_student_instructor_vehicle_location
      compare_expected_session_version_after_lock: true
      replace_claims_atomically_when_schedule_or_resource_changes: true
      companion_metadata_change_uses_same_session_version_increment: true
      GiST_failure_rolls_back_to_previous_session_claim_and_metadata_state: true
    complete:
      preserve_DB_TRN_006_lock_prefix:
        - course_enrollment_FOR_UPDATE
        - training_session_FOR_UPDATE
        - training_session_attendance_row_FOR_UPDATE
      then_remove_training_session_claims_before_final_commit: true
      status_credit_attendance_and_claim_release_same_transaction: true
      completed_session_final_claim_count: 0
      base_credit_created_only_by_DB_TRN_006_rules: true
    cancel:
      preserve_DB_TRN_006_lock_prefix:
        - course_enrollment_FOR_UPDATE
        - training_session_FOR_UPDATE
      then_remove_training_session_claims_before_final_commit: true
      cancelled_session_final_claim_count: 0
      creates_or_reverses_training_credit: false
    attendance_only_update:
      schedule_claim_set_changed: false
      existing_DB_TRN_006_lock_order_preserved: true

  formalized_availability_booking_handoff:
    automatic_at_book_time: false
    rationale: BookAvailabilitySlotRequest_has_student_but_no_course_context_and_must_not_guess_formal_enrollment
    dedicated_domain_command_required: true
    exact_HTTP_surface: Stage5_acceptance_contract_sync
    permission_required: training_sessions.create
    idempotency_key_required: true
    expected_slot_version_required: true
    explicit_course_enrollment_id_required_unless_exactly_one_eligible_course_provable: true
    preconditions:
      - slot_status_booked
      - slot_training_session_id_null
      - slot_booked_student_id_nonnull
      - course_active
      - course_student_equals_slot_booked_student_id
    lock_order:
      - course_enrollment_FOR_UPDATE
      - availability_slot_FOR_UPDATE
    atomic_effects:
      - create_planned_practical_training_session_from_slot_time_instructor_vehicle_location
      - create_optional_training_session_calendar_details_if_needed
      - remove_all_availability_slot_booking_claims
      - insert_exact_training_session_claim_set_for_same_reservation
      - set_availability_slot_training_session_id_to_new_session
      - increment_availability_slot_version_exactly_once
      - append_availability_slot_formalized_lifecycle_event_same_version
      - satisfy_slot_link_guard_training_claim_guard_and_GiST_boundary
      - audit_and_outbox_same_transaction
    current_slot_time_resources_after_handoff: retained_as_immutable_booking_snapshot
    later_session_reschedule_updates_slot_snapshot: false
    later_calendar_projection_uses_session_not_slot_snapshot: true
    booked_slot_projection_after_handoff: suppressed
    slot_cancel_after_handoff: forbidden_use_training_session_cancel
    session_cancel_after_handoff_auto_republishes_slot: false
    session_complete_after_handoff_auto_republishes_slot: false
    handoff_failure_rolls_back_slot_claims_link_session_and_history: true
    same_idempotency_key_retry: return_same_training_session_without_second_handoff
    second_fresh_handoff_for_linked_slot: conflict

  read_model_union:
    sources:
      manual_general_event: calendar_events
      formal_driving_lesson: practical_training_sessions_plus_calendar_details
      important_date: source_domain_projection
      unformalized_booked_availability_reservation: availability_slots_where_booked_and_training_session_id_null
    formalized_booked_slot_emits_separate_calendar_item: false
    source_specific_stable_identity_required: true
    source_specific_mutation_route_required: true
    duplicate_item_for_same_formal_training_session_forbidden: true
    exact_Stage5_union_schema: Stage5_acceptance_contract_sync

  lifecycle_and_history_consistency:
    TrainingSession_history_and_formal_credit_authority_remains_DB4_4: true
    CalendarEvent_history_does_not_duplicate_formal_session_lifecycle: true
    availability_slot_history_preserves_booking_and_formalization_link: true
    formal_training_session_cancel_or_complete_does_not_rewrite_slot_history: true
    terminal_session_historical_calendar_projection_may_remain_readable: true
    exact_default_UI_visibility_of_cancelled_or_completed_items: product_UI_policy_not_required_for_DB_gate
    hard_delete_to_remove_formal_calendar_history: forbidden

  permission_boundary:
    calendar_view_can_project_training_sessions_subject_to_existing_calendar_scopes: true
    own_view_adapter: training_sessions.instructor_id_to_active_linked_staff_profile
    assigned_student_adapter: course_enrollments.student_id
    assigned_location_adapter: training_sessions.location_id
    organization_adapter: training_session_organization_id
    calendar_manage_own_or_organization_does_not_grant_training_sessions_create_edit_cancel: true
    training_permissions_are_required_for_formal_lesson_mutations: true
    calendar_book_for_student_does_not_grant_training_session_create: true

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    order_when_DB4_5_migrations_are_later_generated:
      - precheck_existing_calendar_events_event_type_driving_lesson_rows
      - require_explicit_classification_or_reliable_preexisting_training_session_mapping_for_each_legacy_driving_lesson_row
      - never_match_legacy_calendar_event_to_training_session_by_time_name_or_nearest_row_heuristic
      - nonformal_legacy_item_may_be_explicitly_reclassified_to_general_event_only_by_reviewed_remediation
      - formal_legacy_item_requires_verified_course_and_training_session_history_before_calendar_events_general_event_only_check
      - create_training_session_calendar_details_and_same_tenant_guards
      - add_availability_slots_training_session_id_nullable_and_same_tenant_unique_relation
      - extend_availability_slot_lifecycle_event_catalog_with_formalized
      - add_linked_slot_student_training_session_deferrable_guard
      - create_training_session_claim_owner_guard_while_claim_kind_check_still_blocks_training_session
      - precheck_all_planned_training_sessions_for_conflicts_against_existing_general_events_unformalized_bookings_and_other_sessions
      - fail_on_legacy_overlap_without_auto_cancel_shift_reassign_or_winner_selection
