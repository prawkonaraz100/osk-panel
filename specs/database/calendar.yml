      - add_calendar_event_terminal_actor_foreign_keys_to_users
      - add_calendar_event_status_and_terminal_metadata_checks
      - create_append_only_calendar_event_lifecycle_events
      - add_lifecycle_event_actor_foreign_key_to_users
      - create_migration_baseline_history_event_for_each_existing_event_current_version
      - add_unique_one_history_event_per_event_version
