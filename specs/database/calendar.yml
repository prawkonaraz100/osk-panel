# DB-CAL-001
same_tenant_resource_integrity:
  blocker: DB-CAL-001
  severity: P1
  status: PASS
  goal: >-
    CalendarEvent and AvailabilitySlot must be unable to reference Student,
    StaffProfile, Vehicle or Location rows from another organization even if
    application validation is bypassed or malformed import data is supplied.

  tenant_candidate_keys_reused:
    students:
      columns: [organization_id, id]
      source: DB-TRN-001
      unique_constraint_already_required: true
    staff_profiles:
      columns: [organization_id, id]
      source: DB-RES-001
      unique_constraint_already_required: true
    vehicles:
      columns: [organization_id, id]
      source: DB-RES-002
      unique_constraint_already_required: true
    locations:
      columns: [organization_id, id]
      source: DB-RES-002
      unique_constraint_already_required: true

  tenant_key_policy:
    calendar_events_organization_id:
      nullable: false
      foreign_key: organizations.id
      mutation_after_insert: forbidden_for_normal_domain_lifecycle
    availability_slots_organization_id:
      nullable: false
      foreign_key: organizations.id
      mutation_after_insert: forbidden_for_normal_domain_lifecycle
    client_supplied_organization_id_as_authority: forbidden
    moving_calendar_row_between_organizations_by_rewriting_organization_id: forbidden
    application_rule: >-
      Calendar create/update/book actions derive organization scope from the active
      membership or validated parent. The composite database foreign keys below are
      the final same-tenant relation boundary.

  calendar_events:
    student_same_organization:
      source_columns: [organization_id, student_id]
      target_table: students
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    instructor_same_organization:
      source_columns: [organization_id, instructor_id]
      target_table: staff_profiles
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    vehicle_same_organization:
      source_columns: [organization_id, vehicle_id]
      target_table: vehicles
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    location_same_organization:
      source_columns: [organization_id, location_id]
      target_table: locations
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    created_by_user_relation:
      target_table: users
      global_identity: true
      tenant_composite_FK_required: false
      rationale: >-
        User is a global authentication identity and may legitimately have memberships
        in multiple organizations. Authorization that the actor may create/manage the
        event is checked through membership/permission scope, not by inventing a fake
        organization_id on users.
      own_scope_semantics: deferred_to_DB_CAL_005

  availability_slots:
    instructor_same_organization:
      source_columns: [organization_id, instructor_id]
      target_table: staff_profiles
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    vehicle_same_organization:
      source_columns: [organization_id, vehicle_id]
      target_table: vehicles
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    location_same_organization:
      source_columns: [organization_id, location_id]
      target_table: locations
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    booked_student_same_organization_when_present:
      source_columns: [organization_id, booked_student_id]
      target_table: students
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
      booking_state_semantics: deferred_to_DB_CAL_006

  archive_and_history_behavior:
    relation_to_archived_student_staff_vehicle_or_location:
      historical_reference_may_remain_resolvable: true
      composite_FK_does_not_auto_null_relation_on_archive: true
      archive_is_not_hard_delete_in_parent_domains: true
    new_or_modified_event_resource_eligibility:
      active_or_compliance_policy_not_decided_here: true
      reason: DB_CAL_001_only_closes_tenant_identity_not_business_eligibility
    hard_delete_parent_to_make_calendar_history_disappear: forbidden_as_normal_lifecycle

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    order_when_DB4_5_migrations_are_later_generated:
      - verify_existing_students_staff_profiles_vehicles_locations_candidate_keys
      - verify_calendar_events_organization_id_is_nonnull_and_valid
      - verify_availability_slots_organization_id_is_nonnull_and_valid
      - precheck_every_nonnull_calendar_event_student_matches_event_organization
      - precheck_every_nonnull_calendar_event_instructor_matches_event_organization
      - precheck_every_nonnull_calendar_event_vehicle_matches_event_organization
      - precheck_every_nonnull_calendar_event_location_matches_event_organization
      - precheck_every_nonnull_availability_slot_instructor_matches_slot_organization
      - precheck_every_nonnull_availability_slot_vehicle_matches_slot_organization
      - precheck_every_nonnull_availability_slot_location_matches_slot_organization
      - precheck_every_nonnull_availability_slot_booked_student_matches_slot_organization
      - add_calendar_event_composite_same_tenant_foreign_keys
      - add_availability_slot_composite_same_tenant_foreign_keys
      - rerun_cross_tenant_negative_constraint_tests
    invalid_row_policy: >-
      Fail migration or perform an explicitly reviewed security/data remediation.
      Never fix a mismatch by silently moving the calendar row to another organization,
      changing the referenced Student/Staff/Vehicle/Location, or nulling a relation.

  tests_required:
    - calendar_event_with_same_tenant_optional_student_instructor_vehicle_location_is_accepted
    - calendar_event_with_all_optional_resources_null_is_accepted
    - calendar_event_student_from_other_organization_is_rejected_by_database
    - calendar_event_instructor_from_other_organization_is_rejected_by_database
    - calendar_event_vehicle_from_other_organization_is_rejected_by_database
    - calendar_event_location_from_other_organization_is_rejected_by_database
    - availability_slot_with_same_tenant_optional_instructor_vehicle_location_is_accepted
    - availability_slot_with_optional_resources_null_is_accepted
    - availability_slot_instructor_from_other_organization_is_rejected_by_database
    - availability_slot_vehicle_from_other_organization_is_rejected_by_database
    - availability_slot_location_from_other_organization_is_rejected_by_database
    - availability_slot_booked_student_from_other_organization_is_rejected_by_database
    - migration_precheck_detects_each_existing_cross_tenant_calendar_relation
    - rewriting_calendar_event_organization_id_to_move_it_between_tenants_is_forbidden
    - rewriting_availability_slot_organization_id_to_move_it_between_tenants_is_forbidden
    - archived_parent_history_does_not_auto_null_or_destroy_existing_calendar_reference
    - global_created_by_user_relation_is_not_rejected_only_because_user_has_multiple_tenant_memberships

  intentionally_not_solved_by_DB_CAL_001:
    manual_event_vs_important_date_storage_boundary: closed_by_DB_CAL_002
    location_id_XOR_custom_meeting_place: closed_by_DB_CAL_002
    resource_overlap_race_safe_enforcement: DB-CAL-003
    calendar_event_lifecycle_and_versioning: DB-CAL-004
    calendar_manage_own_owner_resolution: DB-CAL-005
    availability_booking_state_and_exactly_once: DB-CAL-006
    driving_lesson_vs_training_session_source_of_truth: DB-CAL-007
    archived_or_expired_resource_business_eligibility: later_domain_or_compliance_policy

  self_audit:
    every_calendar_event_tenant_owned_resource_relation_has_composite_boundary: PASS
    every_availability_slot_tenant_owned_resource_relation_has_composite_boundary: PASS
    nullable_relations_preserve_null_semantics_with_MATCH_SIMPLE: PASS
    parent_candidate_keys_already_exist_from_DB4_3_and_DB4_4: PASS
    historical_relations_use_RESTRICT_and_are_not_auto_nulled: PASS
    global_user_identity_not_fake_tenant_scoped: PASS
    migration_does_not_silently_reassign_cross_tenant_data: PASS
    DB_CAL_002_through_DB_CAL_007_not_fixed_in_original_step: PASS
    aggregate_core_schema_modified_in_step: false
    aggregate_docs87_modified_in_step: false
    Laravel_migrations_created: false
    later_DB4_slices_entered: false
    UI_or_feature_implementation_started: false

# DB-CAL-002
manual_event_and_important_date_storage_boundary:
  blocker: DB-CAL-002
  severity: P1
  status: PASS
  goal: >-
    Persist only manually managed calendar facts in calendar_events, preserve
    important_date as a system projection whose date remains owned by the source
    Staff/Vehicle document domain, and make one manual event incapable of persisting
    two competing meeting-place sources.

  calendar_events_storage_role:
    role: manual_operational_calendar_event_only
    allowed_event_type_values:
      - general_event
      - driving_lesson
    event_type_check_required: true
    important_date_allowed_as_calendar_events_row: false
    system_generated_projection_row_allowed_as_calendar_events_row: false
    manual_create_or_patch_may_set_important_date: false
    note: >-
      DB-CAL-007 may later change how formal driving lessons are projected or linked
      to TrainingSession, but DB-CAL-002 does not remove the confirmed driving_lesson
      manual discriminator or decide that later source-of-truth integration.

  important_date_projection:
    storage_model: query_projection_not_calendar_events_source_row
    canonical_date_owner: source_domain_row
    source_domains:
      staff_documents:
        current_predicate: superseded_at_is_null
        required_date: valid_until_is_not_null
        supported_document_types:
          - card_or_authorization
          - medical_exam
          - psychological_exam
      vehicle_documents:
        current_predicate: superseded_at_is_null
        required_date: valid_until_is_not_null
        supported_document_types:
          - technical_inspection
          - oc_insurance
          - ac_insurance
    projection_identity:
      canonical_tuple:
        - organization_id
        - source_domain
        - source_row_id
        - date_kind
      calendar_events_id_is_not_projection_identity: true
      source_row_reference_required_in_projection: true
      stable_opaque_API_id_may_be_derived_from_canonical_tuple: true
      derived_API_id_must_not_be_resolved_as_calendar_events_primary_key: true
    projection_fields_are_derived:
      event_type: important_date
      starts_at: source_valid_until_in_organization_calendar_semantics
      source_reference: canonical_tuple
      staff_or_vehicle_resource: source_parent_relation
      title_and_warning_state: read_model_projection
    mutation_boundary:
      calendar_event_create_update_cancel_complete_endpoints_may_mutate_projection: false
      edit_happens_in_source_domain: true
      source_date_change_updates_projection_without_second_manual_calendar_write: true
      source_row_supersession_or_clear_removes_old_current_projection: true
    optional_cache_or_materialized_read_model:
      allowed: true
      authoritative: false
      disposable_and_rebuildable_from_source_domains: true
      direct_manual_mutation: forbidden
      exact_cache_refresh_strategy: implementation_detail_after_contract
    future_system_dates:
      may_join_same_projection_contract: true
      require_explicit_source_domain_and_date_kind_mapping: true
      must_not_become_untracked_calendar_events_rows: true

  meeting_place_invariant:
    semantics: zero_or_one_of_saved_location_or_custom_text
    saved_location_column: location_id
    custom_text_column: custom_meeting_place
    database_checks_required:
      - NOT_location_id_and_custom_meeting_place_both_nonnull
      - custom_meeting_place_null_or_trimmed_nonempty
    canonical_check_expression: >-
      num_nonnulls(location_id, custom_meeting_place) <= 1
      AND (custom_meeting_place IS NULL OR btrim(custom_meeting_place) <> '')
    write_normalization:
      custom_text_trim_before_persist: true
      empty_or_whitespace_only_custom_text_normalizes_to_null: true
      custom_text_does_not_create_location_row: true
      switching_to_saved_location_clears_custom_text_in_command_model: true
      switching_to_custom_text_clears_location_id_in_command_model: true
    both_null_allowed: true
    reason_both_null_allowed: meeting_place_is_confirmed_optional

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    order_when_DB4_5_migrations_are_later_generated:
      - precheck_calendar_events_event_type_values
      - precheck_no_persisted_important_date_or_unknown_system_projection_rows_in_calendar_events
      - precheck_no_calendar_event_has_both_location_id_and_nonempty_custom_meeting_place
      - precheck_no_persisted_custom_meeting_place_is_whitespace_only
      - resolve_invalid_legacy_rows_by_explicit_review_not_type_guess
      - add_calendar_events_event_type_check_general_event_or_driving_lesson
      - add_calendar_events_meeting_place_exclusion_and_nonblank_checks
      - add_important_date_projection_query_or_read_model_contract_without_source_date_copy
      - run_manual_vs_projection_and_meeting_place_negative_tests
    invalid_legacy_event_type_policy: >-
      Do not infer an unknown legacy row as general_event, driving_lesson or
      important_date from its name/resources. Fail migration and require explicit
      reviewed classification or removal from manual storage if it is a system projection.
    invalid_legacy_meeting_place_policy: >-
      Do not choose location_id versus custom_meeting_place by guessing which value
      is newer or more meaningful. Both-active rows require explicit reviewed remediation.
      Whitespace-only custom text may be normalized to NULL only after the precheck proves
      that no semantic non-whitespace value is being discarded.

  tests_required:
    - manual_general_event_row_is_accepted
    - manual_driving_lesson_row_is_accepted_without_changing_visible_form_parity
    - calendar_events_row_with_event_type_important_date_is_rejected
    - calendar_events_row_with_unknown_system_projection_type_is_rejected
    - manual_calendar_create_cannot_persist_important_date
    - important_date_projection_reads_current_staff_document_expiry_from_source_domain
    - important_date_projection_reads_current_vehicle_document_expiry_from_source_domain
    - superseded_staff_or_vehicle_document_does_not_emit_current_important_date
    - source_valid_until_change_changes_projection_without_calendar_event_row_edit
    - projection_item_mutation_through_calendar_event_mutation_endpoint_is_rejected
    - projection_identity_resolves_to_source_tuple_not_calendar_events_primary_key
    - event_with_location_only_is_accepted
    - event_with_trimmed_custom_meeting_place_only_is_accepted
    - event_with_neither_meeting_place_source_is_accepted
    - event_with_location_and_custom_meeting_place_is_rejected_by_database
    - event_with_whitespace_only_custom_meeting_place_is_rejected_after_write_normalization_boundary
    - custom_meeting_place_never_auto_creates_permanent_location
    - migration_precheck_detects_unknown_manual_event_type
    - migration_precheck_detects_both_active_meeting_place_sources

  intentionally_not_solved_by_DB_CAL_002:
    resource_overlap_race_safe_enforcement: DB-CAL-003
    calendar_event_lifecycle_and_versioning: DB-CAL-004
    calendar_manage_own_owner_resolution: DB-CAL-005
    availability_booking_state_and_exactly_once: DB-CAL-006
    driving_lesson_vs_training_session_source_of_truth: DB-CAL-007
    exact_warning_thresholds_for_important_dates: later_product_policy
    exact_API_union_schema_for_manual_and_projection_items: Stage5_acceptance_contract_sync

  self_audit:
    manual_calendar_storage_has_closed_event_type_domain: PASS
    important_date_does_not_create_second_mutable_source_of_truth: PASS
    source_document_valid_until_remains_authoritative: PASS
    projection_identity_is_source_based_not_calendar_event_row_based: PASS
    projection_is_not_mutable_through_manual_event_commands: PASS
    meeting_place_zero_or_one_source_is_database_enforced: PASS
    optional_meeting_place_both_null_state_preserved: PASS
    whitespace_only_custom_text_not_persisted: PASS
    custom_text_does_not_create_location_resource: PASS
    DB_CAL_003_through_DB_CAL_007_not_fixed_in_this_step: PASS
    aggregate_core_schema_modified_in_step: false
    aggregate_docs87_modified_in_step: false
    Laravel_migrations_created: false
    later_DB4_slices_entered: false
    UI_or_feature_implementation_started: false

blockers:
  DB-CAL-001:
    severity: P1
    status: PASS
    title: calendar_and_availability_same_tenant_resource_integrity_missing
    resolved_by: same_tenant_resource_integrity

  DB-CAL-002:
    severity: P1
    status: PASS
    title: manual_calendar_event_storage_boundaries_are_underconstrained
    resolved_by: manual_event_and_important_date_storage_boundary

  DB-CAL-003:
    severity: P1
    status: OPEN
    title: resource_overlap_conflict_has_no_race_safe_final_boundary
    diagnosis: >-
      The API and product policy require server-side instructor, vehicle, student
      and managed-location conflict detection, but core-schema.yml explicitly leaves
      enforcement_strategy as pending_ADR. A check-then-insert or check-then-update
      implementation can allow two concurrent transactions to both observe no conflict
      and commit overlapping reservations.
    race_scope:
      - calendar_event_create_vs_calendar_event_create
      - calendar_event_create_vs_calendar_event_update
      - calendar_event_update_vs_calendar_event_update
      - booking_created_reservation_vs_existing_or_concurrent_calendar_event
      - concurrent_booking_requests_competing_for_same_resource_window
    closure_must_define:
      - exact_conflict_interval_semantics
      - which_statuses_claim_resources
      - which_resource_types_conflict
      - final_PostgreSQL_or_transactional_serialization_boundary
      - deterministic_lock_order_if_lock_based
      - retry_conflict_behavior
      - concurrency_tests_proving_at_most_one_conflicting_commit

  DB-CAL-004:
    severity: P1
    status: OPEN
    title: calendar_event_lifecycle_and_optimistic_concurrency_are_not_closed
    diagnosis: >-
      Own product policy defines scheduled/completed/cancelled and history-preserving
      cancellation, while the physical model only has free-form status plus version.
      Cancel and complete are dedicated API commands and PATCH uses If-Match, but the
      database design does not yet define state checks, terminal metadata, lock order,
      stale-version behavior or PATCH-vs-cancel-vs-complete races.
    closure_must_define:
      - canonical_status_values_and_transition_matrix
      - cancellation_actor_time_reason_metadata
      - completion_actor_time_metadata_if_retained
      - event_version_type_minimum_and_increment_rules
      - expected_version_and_row_lock_semantics_for_material_mutations
      - terminal_event_edit_policy
      - append_only_audit_or_history_event_obligation
      - no_normal_hard_delete_for_operational_history

  DB-CAL-005:
    severity: P1
    status: OPEN
    title: calendar_manage_own_has_no_canonical_database_owner_resolution
    diagnosis: >-
      RBAC already defines calendar.manage.own with own scope and fail-closed behavior
      when a target has no canonical owner relation. CalendarEvent currently exposes
      created_by_user_id and optional instructor_id but the database contract does not
      state which relation is authoritative for own-scope authorization. Availability
      slot publishing with own scope has the same ambiguity.
    closure_must_define:
      - canonical_own_resolver_for_calendar_event
      - canonical_own_resolver_for_availability_slot
      - behavior_for_general_event_without_instructor
      - behavior_for_driving_lesson_with_instructor
      - behavior_after_staff_membership_unlink_or_archive
      - no_created_by_shortcut_that_silently_expands_instructor_scope_unless_explicitly_decided
      - permission_scope_tests_for_own_assigned_students_assigned_locations_organization
    constraint: >-
      DB4_5 may implement the existing DB4_2 own semantics but may not silently
      redefine the global meaning of own, assigned_students or assigned_locations.

  DB-CAL-006:
    severity: P1
    status: OPEN
    title: availability_slot_booking_lifecycle_and_exactly_once_boundary_are_incomplete
    diagnosis: >-
      Stage-3 API promises that a slot is atomically booked for one Student and the
      test strategy requires a double-booking race test. The physical row has status,
      booked_student_id, booked_at and version but no state matrix, no atomic book/cancel
      transaction contract, no final concurrency boundary and no explicit representation
      of the reservation/calendar effect created by a successful booking.
    closure_must_define:
      - slot_status_values_and_field_consistency_checks
      - one_booking_effect_per_slot
      - booking_row_lock_and_idempotency_order
      - stale_update_vs_book_vs_cancel_behavior
      - same_tenant_student_booking_boundary
      - booked_slot_mutability_policy
      - whether_successful_booking_creates_or_links_exactly_one_calendar_reservation_event
      - resource_conflict_revalidation_at_booking_commit
      - cancellation_history_and_reavailability_policy
      - double_booking_and_book_cancel_race_tests

  DB-CAL-007:
    severity: P1
    status: OPEN
    title: driving_lesson_calendar_event_vs_formal_training_session_source_of_truth_is_ambiguous
    diagnosis: >-
      DB4_4 established TrainingSession as the formal source for scheduled training,
      verified attendance and credited ledger time. Calendar simultaneously models a
      driving_lesson CalendarEvent with the same Student/Instructor/Vehicle/Location
      and time concepts, but no physical relation or projection rule currently states
      whether one owns the other. Independent mutable rows could drift in time/resources
      or allow a Calendar complete/cancel action to disagree with formal TrainingSession.
    closure_must_define:
      - exactly_one_canonical_schedule_owner_for_formal_driving_lesson
      - relation_or_projection_between_calendar_and_training_session
      - no_double_mutable_copy_of_time_and_resources_without_atomic_consistency_boundary
      - create_update_cancel_reschedule_orchestration_direction
      - calendar_complete_must_not_credit_training_hours_outside_DB_TRN_006_pipeline
      - conflict_engine_reads_one_effective_reservation_fact
      - historical_reference_survives_cancel_and_correction
      - integration_tests_for_calendar_vs_training_session_consistency

