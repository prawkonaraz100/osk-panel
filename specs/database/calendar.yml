      loser: stale_version_or_terminal_state_conflict_without_partial_write
    PATCH_vs_complete_same_expected_version:
      result: whichever_locks_and_commits_first_wins
      loser: stale_version_or_terminal_state_conflict_without_partial_write
    cancel_vs_complete_same_expected_version:
