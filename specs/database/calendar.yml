# DB-CAL-005
calendar_own_scope_owner_resolution:
  blocker: DB-CAL-005
  severity: P1
  status: PASS
  goal: >-
    Bind every calendar target that supports the existing DB4_2 `own` scope to one
    canonical StaffProfile relation so backend authorization can prove ownership without
    falling back to creator identity, UI filters or role-template shortcuts.

  upstream_RBAC_contract_reused_without_redefinition:
    permission_catalog: specs/security/permissions.yml
    identity_database_contract: specs/database/identity-rbac.yml
    own_semantics: target_owned_by_current_user_or_staff_profile_linked_to_active_membership
    missing_owner_relation: deny
    tenant_validation_precedes_scope_resolution: true
    role_template_is_runtime_authority: false
    granted_permission_without_matching_scope: deny
    scope_OR_behavior_unchanged: true
    assigned_students_semantics_changed_here: false
    assigned_locations_semantics_changed_here: false
    organization_scope_semantics_changed_here: false

  canonical_owner_relations:
    calendar_event:
      owner_kind: staff_profile
      owner_column: calendar_events.instructor_id
      nullable: true
      same_tenant_boundary: DB-CAL-001_composite_FK_organization_id_instructor_id
      created_by_user_id_is_owner: false
      completed_by_user_id_is_owner: false
      cancelled_by_user_id_is_owner: false
      separate_owner_staff_profile_id_column_added: false
    availability_slot:
      owner_kind: staff_profile
      owner_column: availability_slots.instructor_id
      nullable: true
      same_tenant_boundary: DB-CAL-001_composite_FK_organization_id_instructor_id
      booked_student_id_is_owner: false
      separate_owner_staff_profile_id_column_added: false

  runtime_own_resolver:
    canonical_path:
      - authenticated_user
      - active_organization_membership_for_same_organization
      - active_staff_membership_link_where_unlinked_at_is_null
      - linked_staff_profile
      - require_target_instructor_id_equals_linked_staff_profile_id
    active_membership_required: true
    active_staff_link_required: true
    archived_staff_with_no_active_link_matches: false
    no_active_staff_link_result: deny_empty_set
    target_instructor_id_null_result: deny
    created_by_user_match_without_owner_relation_result: deny
    same_user_global_identity_without_active_staff_link_result: deny
    cross_tenant_match_result: deny_before_owner_resolution
    permission_specific_registered_resolver_required: true
    frontend_post_fetch_filter_is_security_boundary: false

  CalendarEvent_behavior:
    general_event_with_instructor:
      own_owner: instructor_id
      owner_staff_may_use_own_when_permission_granted_and_scope_matches: true
    general_event_without_instructor:
      canonical_owner_relation_present: false
      own_result: deny
      organization_scope_may_manage_if_separately_granted: true
      created_by_user_does_not_fill_owner_gap: true
    driving_lesson_with_instructor:
      own_owner: instructor_id
      own_result_for_matching_active_staff_link: allow_if_permission_and_domain_state_also_allow
    driving_lesson_without_instructor:
      own_result: deny
      organization_scope_may_manage_if_separately_granted: true
      later_formal_training_requirement: DB-CAL-007

  AvailabilitySlot_behavior:
    slot_with_instructor:
      own_owner: instructor_id
      calendar_publish_student_slots_with_own_scope: allow_only_for_matching_active_staff_link
    slot_without_instructor:
      own_result: deny
      organization_scope_may_publish_or_manage_if_permission_has_organization_scope: true
    booking_permission_owner_rule:
      calendar_book_for_student_uses_student_scoped_permission_not_slot_own_scope: true
      booking_lifecycle_and_reservation_effect: closed_by_DB_CAL_006

  create_authorization:
    CalendarEvent_with_calendar_manage_own:
      require_active_staff_link: true
      require_proposed_instructor_id_nonnull: true
      require_proposed_instructor_id_equals_linked_staff_profile_id: true
      request_may_claim_different_instructor_under_own: false
      request_may_omit_instructor_and_fall_back_to_created_by: false
    CalendarEvent_with_calendar_manage_organization:
      own_match_required: false
      same_tenant_and_domain_constraints_still_required: true
      instructor_may_be_null_if_other_domain_rules_allow: true
      instructor_may_be_other_same_tenant_staff_if_other_domain_rules_allow: true
      creator_is_not_implicitly_persisted_as_owner: true
    AvailabilitySlot_with_calendar_publish_student_slots_own_scope:
      require_active_staff_link: true
      require_proposed_instructor_id_nonnull: true
      require_proposed_instructor_id_equals_linked_staff_profile_id: true
    AvailabilitySlot_with_calendar_publish_student_slots_organization_scope:
      own_match_required: false
      same_tenant_and_domain_constraints_still_required: true
      instructor_may_be_null_if_other_domain_rules_allow: true
      instructor_may_be_other_same_tenant_staff_if_other_domain_rules_allow: true

  existing_target_mutation_authorization:
    own_mutation_precondition:
      existing_target_instructor_id_must_equal_linked_staff_profile_id: true
      target_without_instructor: deny
    own_PATCH_postcondition:
      proposed_final_instructor_id_must_equal_same_linked_staff_profile_id: true
      transfer_to_other_instructor_under_own: forbidden
      clear_instructor_under_own: forbidden
    organization_scope_reassignment:
      may_change_instructor_with_same_tenant_and_domain_validation: true
      resulting_own_owner_after_commit: new_instructor_id_or_none
    CalendarEvent_cancel_or_complete_under_own:
      require_current_event_owner_match_after_event_lock: true
      ownership_not_changed_by_terminal_command: true
    AvailabilitySlot_update_under_own:
      require_current_slot_owner_match_after_slot_lock: true
      require_post_update_owner_match_same_staff_profile: true
      booked_slot_mutability_state_rule: closed_by_DB_CAL_006_only_available_is_patchable

  authorization_and_concurrency_order:
    own_mutation_lock_or_revalidation_contract:
      - validate_active_membership_same_tenant
      - resolve_and_hold_active_staff_membership_link_for_scope_or_equivalently_revalidate_under_serialization
      - lock_target_event_or_slot_FOR_UPDATE_when_target_exists
      - recheck_target_current_instructor_owner_after_target_lock
      - verify_expected_target_version_where_existing_contract_requires_it
      - verify_proposed_post_state_owner_for_PATCH
      - execute_domain_mutation
      - commit_with_existing_DB_CAL_003_004_guards
    preferred_link_stability_boundary: hold_matching_staff_membership_link_row_FOR_SHARE_until_command_commit
    unlink_or_archive_must_not_race_to_silently_change_owner_proof_mid_command: true
    permission_or_membership_revoke_effect: governed_by_DB4_2_authorization_version_and_membership_lifecycle
    current_request_authorization_snapshot_may_not_be_reused_for_later_request: true

  link_unlink_archive_restore_behavior:
    staff_membership_link_unlinked:
      event_and_slot_instructor_id_history_rewritten: false
      own_scope_for_unlinked_membership_after_unlink: deny
      organization_scope_management_still_possible_if_granted: true
    staff_profile_archived:
      active_staff_membership_link_allowed_after_archive: false
      own_scope_after_archive: deny
      historical_instructor_relation_preserved: true
    staff_profile_restored:
      old_staff_membership_link_auto_reopened: false
      own_scope_auto_restored: false
      explicit_new_active_link_required_before_own_can_match_again: true
    new_membership_explicitly_linked_to_same_staff_profile:
      own_scope_may_match_existing_targets_again_if_permission_and_scope_granted: true
      ownership_identity_is_staff_profile_not_original_user_creator: true

  query_and_permission_adapter_rules:
    calendar_manage_own:
      scope_profile: own_only
      canonical_target_owner_adapter: instructor_id_to_active_linked_staff_profile
    calendar_publish_student_slots:
      scope_profile: organization_or_own
      own_adapter: availability_slots.instructor_id_to_active_linked_staff_profile
      organization_adapter: existing_DB4_2_tenant_resource
    calendar_view:
      scope_profile: calendar_scoped
      manual_CalendarEvent_own_adapter: calendar_events.instructor_id_to_active_linked_staff_profile
      other_existing_assigned_students_assigned_locations_organization_adapters_remain_OR_and_unchanged: true
    list_get_search_count_export_filtering:
      own_filter_must_be_in_backend_query_or_equivalent_authorized_relation: true
      UI_only_filter: forbidden
    important_date_projection_owner_adapter_changed_here: false

  created_by_and_history_security:
    created_by_user_id:
      semantics: immutable_or_historical_provenance_of_creation
      grants_calendar_manage_own: false
      grants_calendar_view_own: false
    lifecycle_actor_fields:
      semantics: audit_actor_only
      grant_ownership: false
    rationale: >-
      A secretary or organization administrator may create an event for instructor B.
      The record then belongs to instructor B for own-scope purposes because instructor_id
      is the domain owner. Conversely, an event created by instructor A without an
      instructor_id remains ownerless for own scope instead of silently becoming A-owned.

  post_DB_CAL_007_projection_scope:
    formal_driving_lesson_calendar_view_owner: training_sessions.instructor_id
    formal_driving_lesson_view_own_uses_same_active_staff_link_semantics: true
    calendar_manage_own_or_organization_grants_training_session_mutation: false
    formal_driving_lesson_mutation_requires_training_domain_permission: true
    prior_CalendarEvent_driving_lesson_own_rules_apply_only_to_legacy_rows_until_migration_remediation: true

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    new_owner_column_required: false
    data_backfill_required_for_owner_relation: false
    performance_indexes_when_later_generating_DB4_5_migrations:
      - calendar_events[organization_id,instructor_id]
      - availability_slots[organization_id,instructor_id]
    legacy_rows_with_null_instructor:
      infer_owner_from_created_by_user_id: forbidden
      infer_owner_from_lifecycle_actor: forbidden
      remain_ownerless_for_own_scope: true
      organization_scope_can_still_manage_if_granted: true
    legacy_rows_with_instructor:
      owner_is_existing_same_tenant_instructor_id: true
      no_creator_based_override: true

  tests_required:
    - calendar_event_own_matches_only_when_active_membership_has_active_staff_link_to_event_instructor
    - calendar_event_own_denies_when_instructor_id_is_null_even_if_created_by_user_is_current_user
    - calendar_event_own_denies_when_created_by_user_matches_but_instructor_belongs_to_other_staff_profile
    - general_event_with_self_instructor_can_be_managed_by_matching_own_scope
    - general_event_without_instructor_requires_non_own_scope_for_management
    - driving_lesson_with_self_instructor_can_be_managed_by_matching_own_scope
    - driving_lesson_with_other_instructor_is_denied_under_own
    - driving_lesson_without_instructor_is_denied_under_own_without_inventing_DB_CAL_007_requirement
    - own_create_calendar_event_requires_proposed_instructor_equal_active_linked_staff_profile
    - own_PATCH_cannot_change_instructor_to_other_staff_profile
    - own_PATCH_cannot_clear_instructor
    - organization_manage_can_reassign_instructor_subject_to_same_tenant_and_domain_rules
    - own_cancel_requires_current_owner_match_after_event_lock
    - own_complete_requires_current_owner_match_after_event_lock
    - availability_slot_own_matches_only_when_slot_instructor_equals_active_linked_staff_profile
    - own_slot_create_requires_proposed_instructor_equal_active_linked_staff_profile
    - own_slot_update_cannot_transfer_or_clear_instructor
    - organization_scope_slot_management_does_not_require_own_match
    - calendar_book_for_student_authorization_is_not_redefined_as_slot_own_permission
    - unlinking_staff_membership_link_removes_own_access_without_rewriting_historical_event_or_slot
    - archiving_staff_removes_own_access_and_preserves_instructor_history
    - restoring_staff_without_new_link_does_not_restore_own_access
    - explicit_new_link_to_same_staff_profile_can_restore_own_resolution_for_existing_targets
    - created_by_user_id_never_expands_own_scope
    - same_user_without_active_staff_link_does_not_match_staff_owned_calendar_target
    - cross_tenant_target_is_denied_before_owner_resolution
    - calendar_view_with_own_scope_filters_manual_events_by_instructor_owner_in_backend_query
    - calendar_view_assigned_students_assigned_locations_and_organization_scope_semantics_remain_unchanged
    - legacy_null_instructor_row_is_not_backfilled_from_created_by_user
    - concurrent_link_unlink_and_own_mutation_cannot_commit_using_a_disappeared_owner_proof_without_defined_serialization

  intentionally_not_solved_by_DB_CAL_005:
    availability_slot_status_and_booking_exactly_once_state_machine: closed_by_DB_CAL_006
    availability_booking_reservation_owner_kind_and_claim_materialization: closed_by_DB_CAL_006
    book_cancel_race_and_reavailability: closed_by_DB_CAL_006
    driving_lesson_vs_training_session_canonical_schedule_owner: closed_by_DB_CAL_007
    training_session_claim_origin_mapping: closed_by_DB_CAL_007
    exact_HTTP_scope_denial_error_payload: Stage5_acceptance_contract_sync
    important_date_projection_own_scope_adapter: not_required_to_close_calendar_manage_own_blocker

  self_audit:
    existing_DB4_2_own_semantics_reused_without_redefinition: PASS
    canonical_owner_for_calendar_event_is_existing_instructor_id: PASS
    canonical_owner_for_availability_slot_is_existing_instructor_id: PASS
    separate_owner_column_not_invented: PASS
    null_owner_fails_closed_for_own_scope: PASS
    created_by_user_is_not_authorization_shortcut: PASS
    own_create_cannot_claim_other_instructor_or_ownerless_target: PASS
    own_PATCH_cannot_transfer_or_clear_owner: PASS
    organization_scope_can_manage_ownerless_or_reassign_with_existing_tenant_rules: PASS
    staff_link_unlink_archive_restore_behavior_matches_DB4_3: PASS
    list_and_get_authorization_is_backend_query_enforced: PASS
    assigned_students_assigned_locations_organization_semantics_not_redefined: PASS
    slot_booking_authorization_and_lifecycle_not_solved_early: PASS
    formal_training_schedule_owner_not_solved_early: PASS
    aggregate_core_schema_modified_in_step: false
    aggregate_docs87_modified_in_step: false
    Laravel_migrations_created: false
    later_DB4_slices_entered: false
    UI_or_feature_implementation_started: false

# DB-CAL-006
availability_slot_booking_lifecycle_and_exactly_once:
  blocker: DB-CAL-006
  severity: P1
  status: PASS
  goal: >-
    Make one published AvailabilitySlot transition atomically from availability to at
    most one booked reservation, enforce all Student/Instructor/Vehicle/Location conflicts
    through the shared DB-CAL-003 GiST boundary, preserve versioned lifecycle history,
    and make cancellation deterministic without silently republishing availability.

  source_contracts:
    API_paths: specs/api/paths/pkk-calendar.yaml
    API_book_description: slot_atomically_booked_for_one_student
    API_cancel_description: slot_cancelled_or_booking_released_according_to_lifecycle
    test_strategy: docs/84-test-strategy.md
    race_requirement: at_most_one_booking_for_one_slot_or_resource
    same_tenant_student_boundary: DB-CAL-001
    own_scope_slot_owner_boundary: DB-CAL-005
    conflict_boundary: DB-CAL-003

  canonical_status_values:
    - available
    - booked
    - cancelled
  status_check_required: true

  canonical_availability_slots_fields:
    existing_or_retained:
      - id_uuid
      - organization_id_uuid
      - instructor_id_uuid_nullable
      - vehicle_id_uuid_nullable
      - location_id_uuid_nullable
      - starts_at_timestamptz
      - ends_at_timestamptz
      - status_varchar
      - booked_student_id_uuid_nullable
      - booked_at_timestamptz_nullable
      - version_bigint
      - created_at_timestamptz
      - updated_at_timestamptz
    version:
      type: bigint
      nullable: false
      default: 1
      check: version_gte_1
    time_check:
      expression: ends_at_gt_starts_at
      required: true
    candidate_key_for_claim_owner_guard:
      columns: [organization_id, id]
      unique_constraint_required: true

  state_matrix:
    available:
      booked_student_id: null
      booked_at: null
      availability_slot_booking_claims: zero
      patchable: true
      bookable: true
      cancellable: true
    booked:
      booked_student_id: nonnull
      booked_at: nonnull
      availability_slot_booking_claims: exact_student_and_nonnull_slot_resources
      patchable: false
      bookable: false
      cancellable: true
    cancelled:
      booked_student_id: null
      booked_at: null
      availability_slot_booking_claims: zero
      patchable: false
      bookable: false
      cancellable: false_for_new_command
    booked_student_and_booked_at_pair_check_required: true
    status_booking_fields_equivalence_check_required: true
    generic_PATCH_may_set_status_booked_cancelled_or_booking_fields: false
    normal_hard_delete: forbidden

  transition_matrix:
    create:
      from: none
      to: available
      version_after: 1
    material_PATCH:
      from: available
      to: available
      version_increment: exactly_once
    book:
      from: available
      to: booked
      version_increment: exactly_once
    cancel_available:
      from: available
      to: cancelled
      version_increment: exactly_once
    cancel_booked:
      from: booked
      to: cancelled
      version_increment: exactly_once
      clears_current_booking_fields: true
      removes_booking_claims: true
      preserves_prior_student_in_lifecycle_history: true
    booked_to_available_automatic_release: forbidden
    cancelled_to_available_normal_reopen: forbidden
    cancelled_to_booked: forbidden
    booked_to_booked_second_booking: forbidden
    automatic_reavailability_after_cancel: false
    reavailability_policy: >-
      Cancellation is terminal for the slot. If the OSK wants to expose the same time
      again it must explicitly publish a new AvailabilitySlot (or a future separately
      designed reopen capability). Cancellation never silently creates a new available
      slot and never rewrites the cancelled row back to available.

  version_and_expected_version:
    concurrency_root: availability_slots.version
    create_initial_version: 1
    material_PATCH_requires_expected_version: true
    book_requires_expected_version_at_domain_boundary: true
    cancel_requires_expected_version_at_domain_boundary: true
    expected_version_source_for_PATCH: If-Match
    current_Stage3_book_cancel_HTTP_contract_has_If_Match: false
    Stage5_sync_required_for_book_cancel_expected_version_marker: true
    idempotency_key_is_not_substitute_for_expected_version: true
    command_lock: SELECT_availability_slot_FOR_UPDATE
    compare_expected_version_after_lock: true
    stale_expected_version_result: conflict_no_partial_write
    semantic_noop_PATCH:
      version_increment: false
      lifecycle_history_append: false
      updated_at_change: false
    material_mutation_version_increment: exactly_once

  command_effective_time:
    capture_once_per_new_material_command_after_slot_lock: true
    canonical_name: command_effective_at
    storage_type: timestamptz
    book_sets_booked_at_to_command_effective_at: true
    matching_lifecycle_event_occurred_at_uses_same_value: true
    described_as_exact_database_commit_timestamp: false

  availability_slot_lifecycle_events:
    purpose: append_only_material_version_history
    fields:
      - id_uuid_PK
      - organization_id_uuid_not_null
      - availability_slot_id_uuid_not_null
      - event_type_varchar_not_null
      - from_status_varchar_nullable_only_for_created_or_migration_baseline
      - to_status_varchar_not_null
      - slot_version_before_bigint_nullable_only_for_created_or_migration_baseline
      - slot_version_after_bigint_not_null
      - actor_user_id_uuid_nullable_only_for_migration_baseline
      - booking_student_id_snapshot_uuid_nullable
      - reason_text_nullable
      - changed_fields_redacted_jsonb_nullable
      - occurred_at_timestamptz_not_null
    event_type_values:
      runtime: [created, updated, booked, cancelled]
      migration_only: [migration_baseline]
    same_tenant_slot_FK:
      source_columns: [organization_id, availability_slot_id]
      target_table: availability_slots
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    booking_student_snapshot_same_tenant_FK:
      source_columns: [organization_id, booking_student_id_snapshot]
      target_table: students
      target_columns: [organization_id, id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    actor_user_FK:
      target_table: users
      target_column: id
      nullable_only_for_migration_baseline: true
      on_update: RESTRICT
      on_delete: RESTRICT
    unique_one_history_event_per_material_version:
      columns: [organization_id, availability_slot_id, slot_version_after]
    runtime_version_pair_rule: slot_version_after_equals_slot_version_before_plus_1
    create_rule:
      slot_version_before: null
      slot_version_after: 1
      from_status: null
      to_status: available
      booking_student_id_snapshot: null
    book_rule:
      from_status: available
      to_status: booked
      booking_student_id_snapshot: equals_final_booked_student_id
    cancel_available_rule:
      from_status: available
      to_status: cancelled
      booking_student_id_snapshot: null
    cancel_booked_rule:
      from_status: booked
      to_status: cancelled
      booking_student_id_snapshot: equals_pre_cancel_booked_student_id
    migration_baseline_rule:
      slot_version_before: null
      slot_version_after: current_slot_version
      actor_user_id_may_be_null: true
      booking_student_snapshot_only_when_reliably_known: true
    current_version_history_final_state_guard:
      type: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
      deferrability: DEFERRABLE_INITIALLY_DEFERRED
      final_slot_requires:
        - exactly_one_history_row_with_slot_version_after_equal_to_availability_slot_version
        - matching_history_to_status_equal_to_availability_slot_status
      runtime_successor_requires:
        - slot_version_before_equals_previous_current_slot_version
        - slot_version_after_equals_slot_version_before_plus_1
      migration_baseline_may_anchor_unknown_earlier_history: true
      direct_slot_version_status_or_booking_field_change_without_matching_history: forbidden
    business_history_rows_mutable_after_insert: false
    normal_hard_delete: forbidden

  claim_owner_kind_extension:
    previous_DB_CAL_003_allowed_values: [calendar_event]
    allowed_values_after_DB_CAL_006: [calendar_event, availability_slot_booking]
    database_check_required: true
    canonical_check_expression: claim_owner_kind IN ('calendar_event','availability_slot_booking')
    unknown_owner_kind_rejected: true
    DB_CAL_007_may_not_reuse_or_extend_without_own_gate: true

  availability_slot_booking_claim_owner_guard:
    claim_owner_kind: availability_slot_booking
    availability_slots_candidate_key_required: [organization_id, id]
    owner_resolution: >-
      Every claim with claim_owner_kind=availability_slot_booking resolves to one
      availability_slots row with the same organization_id and claim_owner_id=id.
    owner_guard:
      type: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
      deferrability: DEFERRABLE_INITIALLY_DEFERRED
    exact_claim_set_final_state_guard:
      type: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
      deferrability: DEFERRABLE_INITIALLY_DEFERRED
      booked_slot_requires:
        - exactly_one_student_claim_equal_to_booked_student_id
        - exactly_one_instructor_claim_iff_instructor_id_nonnull
        - exactly_one_vehicle_claim_iff_vehicle_id_nonnull
        - exactly_one_location_claim_iff_location_id_nonnull
        - every_claim_interval_equals_slot_interval
        - every_claim_organization_equals_slot_organization
      available_or_cancelled_slot_requires_zero_availability_slot_booking_claims: true
      extra_claim_not_corresponding_to_slot_current_resource_forbidden: true
      direct_booked_slot_resource_time_or_student_change_without_claim_sync: forbidden
    exact_claim_order: [student, instructor, vehicle, location]
    same_GiST_exclusion_constraints_as_calendar_event_claims: true
    booking_vs_calendar_event_overlap_rejected: true
    booking_vs_other_booking_overlap_rejected: true
    booking_claim_insert_credits_training_time: false

  reservation_representation:
    successful_booking_creates_calendar_event_row: false
    successful_booking_creates_second_mutable_schedule_copy: false
    canonical_current_reservation_owner: availability_slot_row_while_status_booked
    reservation_conflict_projection: calendar_resource_claims_owner_kind_availability_slot_booking
    optional_calendar_read_model_projection:
      allowed: true
      source: booked_availability_slot
      authoritative: false
      direct_manual_mutation: forbidden
      exact_Stage3_or_Stage5_API_union_shape: Stage5_acceptance_contract_sync
    rationale: >-
      Creating an independent CalendarEvent for the booking before DB-CAL-007 would
      introduce another mutable schedule fact and force a premature choice about formal
      TrainingSession ownership. The booked slot plus exact claims is sufficient as the
      current reservation source in DB-CAL-006.
    DB_CAL_007_obligation: >-
      If a booked availability reservation later becomes a formal driving lesson,
      DB-CAL-007 must define an atomic handoff or ownership rule so there is still only
      one effective reservation fact and no duplicate overlapping claim set.

  create_transaction:
    idempotency_key_required_by_API: true
    steps:
      - claim_or_replay_idempotency_record
      - validate_DB_CAL_001_same_tenant_slot_resources
      - apply_DB_CAL_005_calendar_publish_student_slots_scope_to_proposed_instructor
      - validate_positive_time_range
      - insert_slot_status_available_version_1_with_booking_fields_null
      - create_no_availability_slot_booking_claims
      - append_created_lifecycle_event_version_1
      - commit_only_if_deferred_slot_history_and_zero_claim_guards_pass
    publication_itself_claims_resources: false

  available_PATCH_transaction:
    permission: calendar.publish_student_slots
    steps:
      - resolve_DB_CAL_005_scope_proof
      - lock_availability_slot_FOR_UPDATE
      - recheck_current_owner_scope_after_lock
      - compare_expected_version_after_lock
      - require_status_available
      - reject_status_or_booking_fields_in_generic_PATCH
      - validate_DB_CAL_001_same_tenant_resources_and_positive_time_range
      - validate_DB_CAL_005_post_state_owner_for_own_scope
      - detect_semantic_noop
      - capture_command_effective_at_for_material_change
      - apply_material_slot_fields
      - increment_version_exactly_once
      - append_updated_lifecycle_event_for_same_version_and_command_effective_at
      - commit_only_if_history_guard_and_zero_booking_claim_guard_pass
    booked_or_cancelled_slot_PATCH: conflict_for_normal_operation
    publication_update_may_create_claims: false

  book_transaction:
    permission: calendar.book_for_student
    idempotency_key_required_by_API: true
    expected_version_required_at_domain_boundary: true
    command_order:
      - claim_or_replay_idempotency_record
      - resolve_active_membership_and_same_tenant_slot
      - validate_requested_student_same_tenant_via_DB_CAL_001
      - authorize_calendar_book_for_student_against_requested_student_using_existing_student_scoped_RBAC
      - lock_availability_slot_FOR_UPDATE
      - compare_expected_version_after_lock_for_new_command
      - require_status_available
      - revalidate_slot_time_and_current_resource_relations
      - capture_command_effective_at_once
      - set_status_booked
      - set_booked_student_id_to_requested_student
      - set_booked_at_to_command_effective_at
      - materialize_exact_availability_slot_booking_claim_set_in_student_instructor_vehicle_location_order
      - let_existing_four_GiST_exclusion_constraints_accept_or_reject
      - increment_version_exactly_once
      - append_booked_lifecycle_event_with_student_snapshot_and_same_command_effective_at
      - commit_only_if_deferred_exact_claim_and_history_guards_pass
      - write_audit_and_outbox_same_transaction_when_calendar_domain_events_are_enabled
    same_idempotency_key_same_payload_retry_after_success: return_same_result_without_second_version_or_claim_set
    same_idempotency_key_different_student_or_payload: idempotency_conflict
    different_key_against_already_booked_or_cancelled_slot: conflict_not_second_booking
    GiST_conflict_result:
      rollback_status_booking_fields_claims_history_version: true
      slot_remains_available_at_previous_version: true
      auto_move_or_auto_resource_change: forbidden

  cancel_transaction:
    permission: calendar.publish_student_slots
    idempotency_key_required_by_API: true
    expected_version_required_at_domain_boundary: true
    allowed_source_statuses: [available, booked]
    command_order:
      - claim_or_replay_idempotency_record
      - resolve_DB_CAL_005_publish_scope
      - lock_availability_slot_FOR_UPDATE
      - recheck_current_slot_owner_scope_after_lock
      - compare_expected_version_after_lock_for_new_command
      - require_status_available_or_booked
      - capture_pre_cancel_booked_student_id_if_present
      - capture_command_effective_at_once
      - remove_all_availability_slot_booking_claims_if_booked
      - clear_booked_student_id_and_booked_at
      - set_status_cancelled
      - increment_version_exactly_once
      - append_cancelled_lifecycle_event_with_pre_cancel_student_snapshot_and_command_effective_at
      - commit_only_if_zero_claim_and_history_guards_pass
      - write_audit_and_outbox_same_transaction_when_calendar_domain_events_are_enabled
    same_idempotency_key_same_payload_retry_after_success: return_same_result_without_second_version
    different_key_against_already_cancelled_slot: conflict_not_second_cancellation
    auto_republish_after_cancel: false
    cancellation_creates_new_available_slot: false

  race_matrix:
    book_vs_book_same_expected_version:
      result: at_most_one_booking_commits
      loser: stale_version_or_state_conflict
    book_vs_cancel_same_expected_version:
      result: whichever_locks_and_commits_first_wins
      loser: stale_version_or_state_conflict_without_partial_write
    PATCH_vs_book_same_expected_version:
      result: whichever_locks_and_commits_first_wins
      loser: stale_version_or_non_available_state_conflict
    PATCH_vs_cancel_same_expected_version:
      result: whichever_locks_and_commits_first_wins
      loser: stale_version_or_cancelled_state_conflict
    two_distinct_slots_overlapping_same_resource_booking:
      result: GiST_allows_at_most_one_conflicting_booking_commit
    booking_vs_existing_calendar_event:
      result: GiST_rejects_conflicting_booking_and_rolls_back_slot_to_available
    same_idempotency_key_book_replay:
      result: original_book_result_without_second_effect
    same_idempotency_key_cancel_replay:
      result: original_cancel_result_without_second_effect
    row_and_claim_lock_order:
      - availability_slot
      - resource_claims_student_instructor_vehicle_location

  authorization_boundaries:
    publish_create_update_cancel:
      permission: calendar.publish_student_slots
      scope_semantics: DB_CAL_005_organization_or_own
    book:
      permission: calendar.book_for_student
      scope_semantics: existing_student_scoped_RBAC_on_requested_student
      slot_own_scope_required: false
      booked_student_is_slot_owner: false
    same_tenant_student_FK_is_final_relation_boundary: true
    frontend_scope_filter_is_security_boundary: false

  cancellation_and_history_policy:
    cancelled_slot_is_terminal: true
    current_booking_fields_cleared_on_cancel: true
    previous_booked_student_preserved_in_lifecycle_event_when_booking_existed: true
    current_booking_claims_after_cancel: zero
    automatic_reavailability: false
    historical_slot_row_preserved: true
    hard_delete_to_free_time: forbidden
    reason: >-
      Automatic reavailability would create a new business effect merely from cancellation
      and can expose a past or no-longer-desired time window. Re-publication must be explicit.

  DB_CAL_007_formalization_extension:
    add_availability_slots_training_session_id_nullable: true
    same_tenant_training_session_FK_required: true
    partial_unique_training_session_link_per_organization: true
    training_session_id_clear_after_link: forbidden
    booked_unformalized:
      training_session_id: null
      availability_booking_claims: exact_DB_CAL_006_set
      current_reservation_owner: availability_slot_booking
      slot_cancel_allowed: true
    booked_formalized:
      training_session_id: nonnull
      availability_booking_claims: zero
      current_reservation_owner: training_session
      slot_cancel_allowed: false
      calendar_slot_projection_suppressed: true
    lifecycle_event_type_added: formalized
    formalized_transition: booked_to_booked_material_version
    formalized_version_increment: exactly_once
    linked_training_session_must_be_practical: true
    linked_training_session_course_student_must_equal_booked_student_id: true
    slot_time_and_resources_become_immutable_historical_booking_snapshot_after_handoff: true
    later_session_reschedule_rewrites_slot_snapshot: false
    session_terminal_state_auto_republishes_slot: false

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    order_when_DB4_5_migrations_are_later_generated:
      - precheck_existing_availability_slot_status_values_and_booking_field_pairs
      - explicitly_classify_unknown_status_rows_without_guessing_from_booked_at_or_student_alone
      - ensure_availability_slot_version_is_nonnull_bigint_and_at_least_1
      - add_status_check_available_booked_cancelled_and_state_field_checks
      - create_availability_slot_lifecycle_events_and_same_tenant_relations
      - create_migration_baseline_history_event_for_each_existing_slot_current_version_using_only_reliable_state
      - add_unique_one_history_event_per_slot_version_and_history_immutability
      - add_deferrable_current_slot_version_history_guard
      - precheck_each_reliably_booked_slot_against_existing_calendar_event_claims_and_other_booked_slots
      - fail_on_legacy_booking_overlap_or_ambiguous_booking_state_before_claim_backfill
      - add_availability_slot_booking_claim_owner_guard_while_old_claim_kind_check_still_blocks_new_kind
      - expand_claim_owner_kind_check_to_calendar_event_or_availability_slot_booking
      - backfill_exact_claims_for_reliably_booked_slots_only
      - add_deferrable_availability_slot_exact_claim_set_guard
      - validate_all_available_and_cancelled_slots_have_zero_booking_claims
      - DB_CAL_007_add_training_session_link_and_formalized_history_support
      - DB_CAL_007_add_linked_slot_student_session_guard
      - run_book_cancel_patch_and_cross_owner_GiST_race_tests
    invalid_legacy_status_policy: >-
      Do not infer available/booked/cancelled solely from booked_student_id, booked_at,
      starts_at, updated_at or whether the slot is in the past. Require explicit reviewed
      classification whenever the existing state is inconsistent or unknown.
    missing_booking_evidence_policy: >-
      A supposed booked slot without reliable Student and booked_at evidence is not
      auto-repaired by inventing a Student, timestamp or booking. Require remediation.
    legacy_overlap_policy: >-
      Never select an automatic winner, cancel a slot, move a time range, clear a resource
      or silently turn a booked slot into available merely to satisfy the GiST boundary.
    migration_actor_policy: migration_baseline_actor_may_be_null_never_fabricate_from_unrelated_creator
    cancelled_legacy_booking_history_policy: >-
      If reliable evidence identifies the previously booked Student it may be preserved
      in migration history. Otherwise do not invent the released Student identity.
    calendar_event_backfill_from_booked_slot: forbidden

  tests_required:
    - create_slot_commits_available_version_1_no_booking_fields_no_claims_and_created_history
    - slot_status_outside_available_booked_cancelled_is_rejected
    - available_slot_requires_null_booking_fields_and_zero_booking_claims
    - booked_slot_requires_student_and_booked_at_and_exact_booking_claim_set
    - cancelled_slot_requires_null_current_booking_fields_and_zero_booking_claims
