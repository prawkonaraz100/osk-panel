# DB-CAL-007
formal_driving_lesson_training_session_source_of_truth:
  blocker: DB-CAL-007
  severity: P1
  status: PASS
  goal: >-
    Make TrainingSession the only mutable schedule owner for formal training while
    preserving the calendar driving_lesson UX as a read/command projection, extending
    the shared conflict boundary to TrainingSession, and defining an explicit booked-slot
    handoff with no duplicate reservation fact or training-credit shortcut.

  authority_reused:
    formal_training_contract: specs/database/students-courses-training.yml
    formal_training_statuses: [planned, completed, cancelled]
    formal_training_concurrency_root: training_sessions.version
    canonical_schedule_fields: [starts_at, ends_at, instructor_id, vehicle_id, location_id]
    formal_student_source: course_enrollments.student_id
    formal_credit_pipeline: TrainingSession_to_verified_Attendance_to_TrainingHourLedger
    base_credit_created_only_by_DB_TRN_006_complete: true
    calendar_screen_sources: [specs/screens/calendar.yml, specs/screens/calendar-add-event.yml]
    calendar_API_source: specs/api/paths/pkk-calendar.yaml
    training_API_source: specs/api/paths/students-courses.yaml

  canonical_schedule_ownership:
    formal_training_business_owner: training_sessions
    calendar_events_is_formal_training_schedule_owner: false
    calendar_events_stores_new_formal_driving_lesson_row: false
    mutable_time_or_resource_copy_in_calendar_events: false
    practical_training_session_calendar_projection_type: driving_lesson
    projection_identity: [source_kind_training_session, training_sessions.id]
    stable_opaque_calendar_projection_id_allowed: true
    projected_fields:
      starts_at: training_sessions.starts_at
      ends_at: training_sessions.ends_at
      status: training_sessions.status
      version: training_sessions.version
      student_id: course_enrollments.student_id
      instructor_id: training_sessions.instructor_id
      vehicle_id: training_sessions.vehicle_id
      location_id: training_sessions.location_id
      display_name: training_session_calendar_details.display_name
      custom_meeting_place: training_session_calendar_details.custom_meeting_place
    only_practical_session_projects_as_driving_lesson: true
    theory_calendar_type_not_invented: true

  training_session_calendar_details:
    purpose: calendar_only_companion_metadata_not_schedule_source
    cardinality: zero_or_one_per_training_session
    fields:
      - organization_id_uuid_not_null
      - training_session_id_uuid_not_null_PK_or_unique
      - display_name_text_nullable
      - custom_meeting_place_text_nullable
      - created_at_timestamptz_not_null
      - updated_at_timestamptz_not_null
    same_tenant_session_FK:
      source_columns: [organization_id, training_session_id]
      target_table: training_sessions
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    practical_session_only_guard: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
    custom_text_check: custom_meeting_place_is_null_or_btrim_nonempty
    meeting_place_cross_table_guard:
      enforcement: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
      invariant: location_id_and_custom_meeting_place_are_zero_or_one_sources
      both_null_allowed: true
      both_nonnull_forbidden: true
    metadata_material_change_increments_training_session_version_once: true
    metadata_update_without_matching_training_session_version_increment: forbidden
    terminal_session_metadata_normal_patch: forbidden
    rationale: >-
      Optional calendar name and custom meeting text are confirmed UI capabilities but
      are not formal schedule resources. They remain in a 1:1 companion row so the
      TrainingSession continues to own Student/Instructor/Vehicle/Location/time.

  runtime_storage_supersession:
    DB_CAL_002_provisional_driving_lesson_calendar_row:
      current_runtime_rule: calendar_events_accept_general_event_only
      reason: DB_CAL_002_explicitly_reserved_formal_lesson_storage_for_DB_CAL_007
    DB_CAL_004_formal_driving_lesson_calendar_event_lifecycle:
      current_runtime_rule: applies_to_manual_general_event_only
    DB_CAL_005_driving_lesson_CalendarEvent_own_mutation:
      current_runtime_rule: formal_projection_view_uses_training_session_instructor_but_training_permission_controls_mutation
    visible_driving_lesson_option_removed: false
    reverse_engineered_Add_Event_Jazda_capability_preserved: true

  calendar_command_routing:
    general_event:
      source: calendar_events
      permissions: calendar_manage_scope
      lifecycle: DB_CAL_004
    formal_driving_lesson:
      source: training_sessions
      create_permission: training_sessions.create
      update_permission: training_sessions.edit
      cancel_permission: training_sessions.cancel
      complete_permission: training_sessions.edit
      generic_calendar_event_row_endpoint_may_mutate_projection: false
      complete_uses_DB_TRN_006_verified_attendance_and_credit_equivalence: true
      calendar_manage_permission_alone_is_sufficient: false
    Stage5_contract_sync:
      current_calendar_CreateCalendarEventRequest_missing_course_context: true
      current_calendar_paths_are_calendar_event_row_oriented: true
      required: source_specific_driving_lesson_command_or_discriminated_schema_routed_to_TrainingSession
      exact_operation_ids_permissions_union_schema_and_errors: Stage5_acceptance_contract_sync

  course_context_resolution:
    explicit_course_enrollment_id_preferred: true
    selected_student_alone_may_not_pick_latest_or_first_course: true
    implicit_resolution_allowed_only_if_exactly_one_eligible_active_course_is_provable: true
    zero_or_multiple_eligible_courses: require_explicit_course_context
    course_must_be_active_after_lock: true
    calendar_driving_lesson_session_type: practical
    formal_student_is_derived_from_course: true

  training_session_claim_owner_kind:
    allowed_values_after_DB_CAL_007: [calendar_event, availability_slot_booking, training_session]
    database_check_required: true
    same_tenant_training_session_owner_guard: true
    planned_session_types_with_claims: [theory, practical]
    exact_planned_claim_set:
      student: exactly_one_course_student_claim
      instructor: exactly_one_session_instructor_claim
      vehicle: exactly_one_iff_session_vehicle_nonnull
      location: exactly_one_iff_session_location_nonnull
      interval: exact_session_interval
      organization: exact_session_organization
    completed_or_cancelled_session_claim_count: 0
    final_state_guard: DEFERRABLE_INITIALLY_DEFERRED
    claims_use_existing_four_GiST_constraints: true
    training_claim_insert_creates_ledger_credit: false

  training_session_schedule_transactions:
    create:
      lock_order: [course_enrollment_FOR_UPDATE, new_training_session, claims_student_instructor_vehicle_location]
      parent_course_must_be_active: true
      insert_planned_version_1: true
      exact_claim_set_same_transaction: true
      GiST_conflict_rolls_back_session_metadata_and_claims: true
    planned_PATCH_or_reschedule:
      lock_order: [course_enrollment_FOR_UPDATE, training_session_FOR_UPDATE, claims_student_instructor_vehicle_location]
      compare_expected_session_version_after_lock: true
      replace_claims_when_time_or_resources_change: true
      companion_metadata_change_uses_same_session_version_increment: true
      GiST_conflict_rolls_back_to_previous_schedule_claims_and_metadata: true
    complete:
      preserve_DB_TRN_006_lock_prefix: [course_enrollment_FOR_UPDATE, training_session_FOR_UPDATE, training_session_attendance_row_FOR_UPDATE]
      remove_training_session_claims_same_transaction: true
      final_status_claim_count: 0
      attendance_credit_and_claim_release_atomic: true
      base_credit_path: DB_TRN_006_only
    cancel:
      preserve_DB_TRN_006_lock_prefix: [course_enrollment_FOR_UPDATE, training_session_FOR_UPDATE]
      remove_training_session_claims_same_transaction: true
      final_status_claim_count: 0
      creates_or_reverses_credit: false
    attendance_only_change_alters_claims: false

  formalized_availability_booking_handoff:
    auto_create_training_session_during_book: false
    reason: BookAvailabilitySlotRequest_has_student_but_no_unambiguous_course_context
    dedicated_domain_command_required: true
    exact_HTTP_surface: Stage5_acceptance_contract_sync
    permission: training_sessions.create
    idempotency_key_required: true
    expected_slot_version_required: true
    course_context_rule: explicit_or_exactly_one_eligible_active_course_never_latest_or_first_guess
    preconditions:
      - slot_status_booked
      - slot_training_session_id_null
      - booked_student_nonnull
      - active_course
      - course_student_equals_booked_student
    lock_order: [course_enrollment_FOR_UPDATE, availability_slot_FOR_UPDATE]
    atomically:
      - create_planned_practical_training_session_from_slot_time_and_resources
      - create_optional_training_session_calendar_details_if_needed
      - remove_availability_slot_booking_claims
      - insert_training_session_claims_for_same_reservation
      - set_slot_training_session_id
      - increment_slot_version_once
      - append_formalized_slot_lifecycle_event
      - satisfy_link_claim_history_and_GiST_guards
      - audit_and_outbox_same_transaction
    slot_time_and_resources_after_handoff: immutable_booking_snapshot
    later_training_session_reschedule_rewrites_slot_snapshot: false
    calendar_projection_after_handoff_uses_training_session: true
    formalized_slot_emits_second_calendar_item: false
    slot_cancel_after_handoff: forbidden_use_training_session_cancel
    session_cancel_or_complete_auto_republishes_slot: false
    handoff_failure_rolls_back_new_session_link_history_and_restores_original_booking_claims: true
    same_idempotency_key_retry: return_prior_training_session_without_second_handoff
    second_fresh_handoff: conflict

  read_model_union:
    manual_general_event: calendar_events
    formal_driving_lesson: practical_training_sessions_plus_calendar_details
    important_date: source_domain_projection
    unformalized_booked_availability: booked_slots_where_training_session_id_null
    formalized_slot_projection_suppressed: true
    source_specific_identity_required: true
    source_specific_mutation_route_required: true
    duplicate_formal_training_calendar_item_forbidden: true
    exact_HTTP_union_schema: Stage5_acceptance_contract_sync

  lifecycle_and_history:
    TrainingSession_formal_history_authority: DB4_4
    CalendarEvent_history_duplicates_formal_session: false
    availability_slot_history_preserves_booking_and_formalized_link: true
    session_terminal_transition_rewrites_slot_history: false
    terminal_session_projection_may_remain_readable: true
    hard_delete_to_remove_formal_calendar_history: forbidden

  permission_boundary:
    calendar_view_may_project_training_sessions_subject_to_existing_scopes: true
    own_view_adapter: training_sessions.instructor_id
    assigned_student_adapter: course_enrollments.student_id
    assigned_location_adapter: training_sessions.location_id
    organization_adapter: training_sessions.organization_id
    calendar_manage_own_or_organization_grants_training_session_mutation: false
    calendar_book_for_student_grants_training_session_create: false
    formal_mutation_requires_training_permission: true

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    order_when_DB4_5_migrations_are_later_generated:
      - precheck_existing_calendar_events_driving_lesson_rows
      - require_explicit_classification_or_reliable_preexisting_training_session_mapping
      - never_match_calendar_event_to_training_session_by_time_name_or_nearest_row_heuristic
      - explicitly_reclassify_nonformal_legacy_item_to_general_event_only_when_reviewed
      - require_verified_course_and_training_history_for_formal_legacy_item
      - create_training_session_calendar_details_and_same_tenant_guards
      - add_availability_slots_training_session_id_nullable_same_tenant_unique_relation
      - extend_slot_lifecycle_event_catalog_with_formalized
      - add_linked_slot_student_training_session_guard
      - create_training_session_claim_owner_guard_while_claim_kind_check_blocks_new_kind
      - precheck_planned_training_session_conflicts_against_current_general_event_booking_and_training_claim_candidates
      - fail_on_overlap_without_auto_cancel_shift_reassign_or_winner
      - expand_claim_owner_kind_check_to_training_session
      - backfill_exact_claims_for_reliably_planned_training_sessions
      - add_deferrable_training_session_exact_claim_guard
      - only_after_legacy_driving_lesson_remediation_change_runtime_calendar_event_type_check_to_general_event_only
      - run_projection_routing_handoff_and_cross_owner_race_tests
    legacy_formal_lesson_policy: >-
      Never create a formal TrainingSession only because a legacy CalendarEvent is named
      or typed driving_lesson. Require verified CourseEnrollment and training evidence.
    legacy_duplicate_schedule_policy: >-
      TrainingSession is the final runtime authority, but migration must not discard or
      overwrite CalendarEvent history by timestamp-proximity heuristics.

  tests_required:
    - new_runtime_calendar_event_row_cannot_persist_formal_driving_lesson
    - calendar_driving_lesson_projection_reads_practical_training_session_schedule_resources_status_version
    - projection_student_is_course_student
    - calendar_details_preserve_optional_name
    - calendar_details_preserve_custom_meeting_place_when_location_null
    - calendar_details_reject_nonblank_custom_place_with_nonnull_session_location
    - calendar_details_reject_whitespace_only_custom_place
    - metadata_change_increments_training_session_version
    - formal_projection_cannot_be_mutated_through_calendar_event_row_endpoint
    - calendar_manage_permission_without_training_permission_cannot_mutate_formal_lesson
    - calendar_formal_lesson_create_requires_active_course_and_training_create_permission
    - ambiguous_course_context_never_selects_latest_or_first_course
    - planned_training_session_has_exact_claim_set
    - planned_training_session_student_claim_equals_course_student
    - terminal_training_session_has_zero_claims
    - training_session_claim_owner_is_same_tenant
    - direct_training_session_schedule_change_without_claim_sync_rejected
    - training_session_vs_general_event_overlap_allows_at_most_one_commit
    - training_session_vs_unformalized_booking_overlap_allows_at_most_one_commit
    - two_training_session_overlap_same_resource_allows_at_most_one_commit
    - training_reschedule_conflict_rolls_back_prior_schedule_and_claims
    - training_complete_releases_claims_and_preserves_DB_TRN_006_credit_equivalence
    - training_cancel_releases_claims_without_credit_effect
    - calendar_complete_cannot_credit_formal_training
    - booking_does_not_auto_create_training_session_without_course_context
    - formalize_booking_requires_same_course_student
    - formalize_booking_transfers_claim_owner_atomically
    - formalize_booking_sets_unique_training_session_link_and_history
    - failed_handoff_rolls_back_and_preserves_original_booking_claims
    - same_handoff_idempotency_key_does_not_create_second_session
    - second_handoff_on_linked_slot_rejected
    - formalized_slot_has_zero_availability_booking_claims
    - formalized_slot_has_no_second_calendar_item
    - formalized_slot_cannot_cancel_independently
    - linked_session_reschedule_does_not_rewrite_slot_snapshot
    - linked_session_cancel_or_complete_does_not_auto_republish_slot
    - one_calendar_item_per_formal_training_session
