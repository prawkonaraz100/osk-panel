# DB-CAL-003
resource_overlap_conflict_boundary:
  blocker: DB-CAL-003
  severity: P1
  status: PASS

  interval_semantics:
    storage: timestamptz_UTC
    canonical_interval: half_open_[starts_at,ends_at)
    canonical_range_expression: tstzrange(starts_at, ends_at, '[)')
    requires_ends_at_gt_starts_at: true
    adjacent_end_equals_next_start_conflicts: false
    exact_overlap_operator: '&&'

  conflicting_resource_kinds: [student, instructor, vehicle, managed_location]
  custom_meeting_place_is_managed_resource_claim: false
  important_date_projection_is_resource_claim: false

  calendar_resource_claims:
    purpose: technical_current_conflict_projection_not_business_history
    exactly_one_resource_column_nonnull: true
    owner_kinds_after_DB_CAL_007:
      - calendar_event
      - availability_slot_booking
      - training_session
    claim_owner_kind_check: >-
      claim_owner_kind IN ('calendar_event','availability_slot_booking','training_session')
    unknown_owner_kind_rejected: true
    generated_range: tstzrange(starts_at,ends_at,'[)')

  claim_same_tenant_resource_FKs:
    student: [organization_id, student_id]
    instructor: [organization_id, instructor_id]
    vehicle: [organization_id, vehicle_id]
    location: [organization_id, location_id]
    same_tenant_parent_constraints_reused_from_DB4_3_DB4_4: true

  duplicate_claim_guards:
    one_student_claim_per_owner: [organization_id, claim_owner_kind, claim_owner_id, student_id]
    one_instructor_claim_per_owner: [organization_id, claim_owner_kind, claim_owner_id, instructor_id]
    one_vehicle_claim_per_owner: [organization_id, claim_owner_kind, claim_owner_id, vehicle_id]
    one_location_claim_per_owner: [organization_id, claim_owner_kind, claim_owner_id, location_id]

  PostgreSQL_final_conflict_boundary:
    extension_required: btree_gist
    strategy: four_partial_GiST_exclusion_constraints_on_calendar_resource_claims
    resource_dimensions:
      student: [organization_id, student_id, occupied_during]
      instructor: [organization_id, instructor_id, occupied_during]
      vehicle: [organization_id, vehicle_id, occupied_during]
      location: [organization_id, location_id, occupied_during]
    application_precheck_is_final_boundary: false
    database_exclusion_constraint_is_final_concurrency_boundary: true

  manual_general_event_claim_guard:
    scheduled_general_event_requires_exact_claims_for_each_nonnull_resource: true
    completed_or_cancelled_general_event_requires_zero_claims: true
    deferrability: DEFERRABLE_INITIALLY_DEFERRED

  availability_booking_claim_guard:
    source: DB-CAL-006
    unformalized_booked_slot_requires_exact_booking_claims: true
    available_or_cancelled_slot_requires_zero_booking_claims: true
    formalized_booked_slot_requires_zero_availability_booking_claims: true
    reason: training_session_becomes_reservation_owner_after_handoff

  training_session_claim_guard:
    owner_kind: training_session
    candidate_key_reused: training_sessions[organization_id,id]
    owner_resolution_same_tenant_required: true
    claiming_state: planned
    claiming_session_types: [theory, practical]
    planned_session_exact_claims:
      student: exactly_one_equal_to_course_enrollment_student
      instructor: exactly_one_equal_to_training_session_instructor
      vehicle: exactly_one_iff_training_session_vehicle_nonnull
      location: exactly_one_iff_training_session_location_nonnull
      interval: exactly_training_session_starts_at_ends_at
      organization: exactly_training_session_organization_id
    completed_or_cancelled_session_requires_zero_training_session_claims: true
    deferrability: DEFERRABLE_INITIALLY_DEFERRED
    extra_or_missing_or_stale_claim_forbidden: true
    direct_schedule_resource_change_without_claim_sync: forbidden
    claim_insert_credits_training_hours: false

  cross_owner_conflicts:
    training_session_vs_calendar_event: same_GiST_constraints
    training_session_vs_availability_booking: same_GiST_constraints
    training_session_vs_training_session: same_GiST_constraints
    availability_booking_vs_calendar_event: same_GiST_constraints
    current_effective_reservation_fact_per_formal_session: exactly_one_training_session_claim_set_while_planned

  migration_design:
    migrations_created_in_this_step: false
    aggregate_core_schema_modified_in_this_step: false
    aggregate_docs87_modified_in_this_step: false
    DB_CAL_007_extension_order:
      - create_training_session_claim_owner_guard_while_claim_kind_check_blocks_training_session
      - precheck_planned_training_session_overlaps_against_existing_general_event_and_unformalized_booking_claims
      - fail_on_ambiguous_or_overlapping_legacy_reservations_without_auto_winner
      - expand_claim_owner_kind_check_to_include_training_session
      - backfill_exact_claims_for_reliably_planned_training_sessions
      - add_deferrable_training_session_exact_claim_guard

  self_audit:
    interval_semantics_remain_half_open: PASS
    all_three_owner_kinds_share_same_GiST_boundary: PASS
    planned_training_session_has_exact_current_claim_set: PASS
    terminal_training_session_has_zero_claims: PASS
    training_claim_does_not_credit_formal_time: PASS
    conflict_projection_remains_technical_not_business_source: PASS
    aggregate_core_schema_modified_in_step: false
    aggregate_docs87_modified_in_step: false
    Laravel_migrations_created: false

