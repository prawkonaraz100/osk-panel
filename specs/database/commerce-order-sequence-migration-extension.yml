node:
  node_id: S5COM-TBL-ORGANIZATION-COMMERCE-ORDER-SEQUENCES
  object_type: table_plus_initialization
  object_name: organization_commerce_order_sequences
  phases:
    - preflight
    - expand
    - backfill
    - validate
  restart_classification: manual_review

table_contract:
  exact_columns:
    organization_id:
      sql_type: uuid
      nullable: false
      primary_key: true
      foreign_key:
        table: organizations
        column: id
        on_update: RESTRICT
        on_delete: RESTRICT
    next_order_sequence:
      sql_type: bigint
      nullable: false
      check: next_order_sequence_gte_1
  extra_business_columns: forbidden

phase_contract:
  preflight:
    require_postgresql: true
    require_tables:
      - organizations
      - orders
    prove_existing_orders:
      order_sequence_nonnull_positive: true
      unique_per_organization: true
      organization_relation_valid: true
    automatic_order_sequence_rewrite: forbidden
  expand:
    create_exact_table_when_absent: true
    same_name_wrong_definition: fail_closed
  backfill:
    every_existing_organization_gets_allocator_row: true
    formula: COALESCE(MAX_existing_orders_order_sequence_0)_plus_1
    source: accepted_existing_orders_order_sequence_only
    update_existing_order_rows: forbidden
    overwrite_existing_allocator_row: forbidden
  validate:
    catalog_shape_exact: true
    primary_key_exact: [organization_id]
    organization_fk_exact: true
    next_order_sequence_check_exact: true
    every_existing_organization_has_row: true
    invariant: next_order_sequence_gt_every_existing_order_sequence_for_same_organization
    runtime_MAX_plus_1_not_materialized: true

non_scope:
  HTTP_binding: false
  pricing_runtime: false
  payment_provider_call: false
  PKK_or_PWPW_runtime: false
