identity_model:
  users:
    global_person_or_auth_principal: true
    local_password_hash_on_user: true
    fields:
      - id
      - first_name
      - last_name
      - password_hash_nullable
      - status
      - last_login_at_nullable
      - created_at
      - updated_at
    first_name_type: varchar_120
    last_name_type: varchar_120
    human_user_after_onboarding_requires_names: true
    pre_onboarding_or_system_principal_nullability_may_be_supported: true
    names_are_global_identity_fields_not_duplicated_per_organization: true

  user_password_management:
    purpose: fail_closed_global_local_password_management_authority_and_credential_epoch
    one_row_per_user: true
    fields:
      - user_id
      - management_mode
      - managing_organization_id_nullable
      - credential_version
      - password_changed_at_nullable
      - created_at
      - updated_at
    management_mode_values: [unclassified, self_service, organization_managed]
    credential_version_type: bigint_not_null_default_0_check_gte_0
    organization_managed_requires_managing_organization: true
    self_service_or_unclassified_require_null_managing_organization: true
    OSK_password_mutation_requires_matching_organization_managed_authority: true
    organization_managed_exclusive_principal_guard: true
    organization_managed_forbids_organization_membership: true
    organization_managed_forbids_learning_account_in_other_organization: true
    organization_managed_forbids_current_social_auth_account: true
    authority_transition_is_separate_identity_security_command: true

  auth_login_identifiers:
    purpose: resolve_generic_login_without_tenant_selector
    fields:
      - id
      - user_id
      - identifier_type_email_or_username
      - identifier_normalized
      - is_primary_for_type
      - verified_at
      - created_at
      - revoked_at
    is_primary_for_type_default: false
    global_unique_current_identifier: true
    partial_unique:
      columns: [identifier_normalized]
      where: revoked_at_is_null
    primary_current_identifier_uniqueness:
      type: partial_unique
      columns: [user_id, identifier_type]
      where: revoked_at_is_null_and_is_primary_for_type_true
    candidate_key_id_user: [id, user_id]
    settings_email_projection: current_nonrevoked_identifier_type_email_and_primary_true
    rule: same_visible_login_string_must_not_resolve_to_two_users

  auth_social_accounts:
    fields:
      - id
      - user_id
      - provider
      - provider_subject
      - created_at
      - revoked_at
    unique_current_provider_subject: true

  organization_memberships:
    purpose: durable_tenant_authorization_aggregate_root
    same_user_multiple_organizations_supported: true
    unique_membership_per_organization_user: true
    hard_delete: forbidden
    user_id_mutation: forbidden
    fields:
      - id
      - organization_id
      - user_id
      - status
      - is_owner
      - role_template_code_nullable
      - role_template_catalog_version_nullable
      - version
      - authorization_version
      - created_at
      - updated_at
    status_values:
      - active
      - suspended
      - revoked
    status_semantics:
      active: authorization_eligible
      suspended: authorization_ineligible_permissions_scopes_retained
      revoked: authorization_ineligible_owner_false_permissions_denied_scopes_removed
    version:
      type: bigint
      default: 1
      minimum: 1
      purpose: optimistic_concurrency_for_membership_permission_scope_owner_status_aggregate
    authorization_version:
      type: bigint
      default: 1
      minimum: 1
      purpose: security_epoch_for_authorization_affecting_changes_and_cache_invalidation
    is_owner:
      type: boolean
      default: false
      authorization_shortcut: false
    role_template_runtime_dependency: false
    role_template_fields_are_provenance_only: true
    reactivation:
      suspended_to_active_retains_permission_scope_config: true
      revoked_to_active_requires_fresh_permission_or_template_provisioning: true
      revoked_to_active_restores_owner_implicitly: false
    owner_protected_permission_baseline:
      organization.view: organization
      organization.members.manage: organization
      staff.permissions.manage: organization
      sessions.manage.organization: organization

  permissions:
    fields:
      - code
      - description
    primary_key: code
    catalog_source: specs/security/permissions.yml

  membership_permissions:
    purpose: authoritative_current_permission_decision
    fields:
      - membership_id
      - permission_code
      - granted
      - created_at
    unique: [membership_id, permission_code]
    missing_row: deny
    role_template_code_consulted_at_runtime: false
    independent_mutation_version: false
    concurrency_root: organization_memberships.version

  data_scopes:
    purpose: canonical_scope_catalog
    fields:
      - code
      - description
    primary_key: code
    codes:
      - organization
      - own
      - assigned_students
      - assigned_locations

  permission_scope_options:
    purpose: whitelist_legal_permission_scope_pairs_and_resolvers
    fields:
      - permission_code
      - scope_code
      - resolver_code
    primary_key: [permission_code, scope_code]
    foreign_keys:
      permission_code: permissions.code
      scope_code: data_scopes.code

  membership_permission_scopes:
    purpose: authoritative_current_scope_predicates_for_granted_permission
    fields:
      - membership_id
      - permission_code
      - scope_code
      - created_at
    primary_key: [membership_id, permission_code, scope_code]
    foreign_keys:
      membership_permission_pair: membership_permissions[membership_id,permission_code]
      allowed_permission_scope_pair: permission_scope_options[permission_code,scope_code]
    multiple_rows_same_permission_semantics: logical_OR_after_tenant_validation
    granted_permission_without_scope: deny_fail_closed
    denied_permission_requires_zero_scope_rows: transactional_invariant
    independent_mutation_version: false
    concurrency_root: organization_memberships.version

  auth_sessions:
    purpose: session_listing_revocation_and_selected_tenant_context
    fields:
      - id
      - user_id
      - organization_membership_id_nullable
      - token_or_framework_session_hash
      - created_at
      - last_seen_at
      - revoked_at
      - revoke_reason_nullable
      - ip_hash_nullable
      - user_agent_nullable
    raw_session_secret_storage_forbidden: true
    revoke_is_state_change_not_history_delete: true
    framework_session_store_may_implement_physical_storage_if_contract_is_preserved: true
    same_user_tenant_context_integrity:
      source_columns: [organization_membership_id, user_id]
      target_table: organization_memberships
      target_columns: [id, user_id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
      target_candidate_key_required: [id, user_id]
    null_membership_context_allowed_for_global_or_pre_tenant_flow: true
    tenant_owned_operation_without_membership_context: deny
    selected_organization_is_derived_from_membership: true

  account_closure_requests:
    purpose: auditable_user_or_organization_account_closure_workflow
    fields:
      - id
      - user_id
      - organization_id_nullable
      - requested_at
      - reason_nullable
      - status_pending_approved_rejected_completed_cancelled
      - resolved_at_nullable
      - resolved_by_user_id_nullable
      - resolution_note_nullable
      - request_id
    history_preserved: true
    one_pending_request_per_scope: true
    pending_uniqueness:
      organization_scope:
        type: partial_unique
        columns: [user_id, organization_id]
        where: status_equals_pending_and_organization_id_is_not_null
      global_user_scope:
        type: partial_unique
        columns: [user_id]
        where: status_equals_pending_and_organization_id_is_null

