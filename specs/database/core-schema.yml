meta:
  project: osk-panel
  scope: postgresql_core_v1
  status: IMPLEMENTATION_BLUEPRINT
  decided_at: 2026-09-05
  doc: docs/87-physical-database-schema.md
  preservation_contract: docs/96-reverse-engineering-preservation-contract.md
  traceability: specs/traceability/core-v1.yml
  DB4_4_students_courses_training_aggregate_sync: PASS
  DB4_5_calendar_aggregate_sync: PASS
  DB4_6_licenses_learning_access_aggregate_sync: PASS

conventions:
  primary_key:
    physical_type: postgresql_uuid
    generated_domain_id_version: UUIDv7
    generation_owner: application_before_insert
    database_default_required: false
    foreign_key_physical_type: postgresql_uuid
    external_provider_identifiers_must_not_be_reused_as_primary_keys: true
    rationale:
      - native_16_byte_PostgreSQL_uuid_storage_and_indexes
      - time_ordered_UUIDv7_improves_index_locality_vs_random_UUIDv4
      - globally_unique_without_central_sequence
      - avoids_ULID_string_collation_and_char_26_storage_semantics
      - does_not_depend_on_database_version_specific_UUIDv7_generator
    implementation_rule: >-
      Laravel/domain code supplies a UUIDv7 before insert for rows using a
      synthetic domain identifier. Do not silently fall back to UUIDv4. Pure
      join/dictionary tables may continue to use their explicitly designed
      composite/natural keys where the table contract does not require a
      synthetic row identity.
    api_compatibility: >-
      Public API identifiers remain UUID strings. Existing Stage-3 API contracts
      are compatible because UUID is already an allowed public resource identifier.
  timestamp: timestamptz
  canonical_timezone: UTC
  organization_timezone: IANA
  money:
    amount: bigint_minor_units
    currency: char_3_ISO_4217
  business_state: varchar_plus_application_enum_or_check
  postgres_enum_for_evolving_business_state: false
  jsonb_for:
    - immutable_snapshots
    - redacted_safe_projection_payloads
    - noncritical_metadata
  jsonb_as_replacement_for_core_relational_model: false
  tenant_owned_tables_have_organization_id_when_practical: true
  history_preservation_over_destructive_uniqueness: true
  nullable_scope_uniqueness:
    strategy: separate_partial_unique_indexes_for_null_and_non_null_scope
    postgres_NULLS_NOT_DISTINCT_required: false

sensitive_identifier_pattern:
  pesel:
    ciphertext_column: pesel_ciphertext
    exact_lookup_column: pesel_lookup_hash
    lookup_hash: HMAC_SHA_256_or_equivalent_secret_keyed_hash
    plain_global_sha256_for_lookup_forbidden: true
  pkk:
    ciphertext_column: pkk_number_ciphertext
    exact_lookup_column: pkk_lookup_hash
    lookup_hash: HMAC_SHA_256_or_equivalent_secret_keyed_hash
  external_credentials:
    ciphertext_or_secret_reference_required: true
    plaintext_after_save_forbidden: true

