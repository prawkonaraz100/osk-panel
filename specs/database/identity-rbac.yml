meta:
  project: osk-panel
  scope: identity_tenant_rbac_core_v1
  status: IN_PROGRESS_WITH_OPEN_BLOCKERS
  decided_at: 2026-09-05
  narrative:
    - docs/04-roles-permissions.md
    - docs/105-stage-4-identity-tenant-rbac-audit.md
  security_catalog: specs/security/permissions.yml
  aggregate_blueprint: specs/database/core-schema.yml
  authority_rule: >-
    This bounded-context specification is authoritative for Identity/Tenant/RBAC
    physical semantics while DB4_2 is being closed. It augments the aggregate
    core schema; the aggregate blueprint is synchronized before DB4_2 final PASS.

principles:
  permission_based_rbac: true
  staff_type_is_not_authorization_role: true
  organization_membership_is_tenant_authorization_context: true
  backend_runtime_must_not_authorize_from_role_template_code: true
  default_deny: true
  future_permission_default_for_existing_membership: denied
  scope_is_per_permission_not_global_membership_flag: true
  scope_can_only_restrict_an_already_granted_permission: true
  tenant_validation_always_precedes_scope_resolution: true
  missing_or_unresolvable_scope_fails_closed: true
  tenant_session_membership_must_belong_to_same_user_as_session: true
  owner_marker_is_governance_state_not_runtime_permission_shortcut: true
  self_privilege_escalation_via_normal_admin_flow_forbidden: true

physical_tables_in_scope:
  - users
  - organization_memberships
  - permissions
  - membership_permissions
  - data_scopes
  - permission_scope_options
  - membership_permission_scopes
  - auth_sessions

role_template_contract:
  blocker: DB-IAM-001
  status: RESOLVED_DESIGN
  catalog_source: specs/security/permissions.yml
  catalog_version_source: meta.role_template_catalog_version
  runtime_dependency: false
  semantics: assignment_time_preset_plus_provenance
  organization_membership_provenance_fields:
    role_template_code:
      type: varchar_64_nullable
      semantics: last_explicitly_applied_template_code_for_UI_and_audit_only
    role_template_catalog_version:
      type: varchar_64_nullable
      semantics: exact_catalog_version_used_for_last_template_materialization
  template_application:
    initial:
      transaction:
        - resolve_template_against_exact_catalog_version
        - enumerate_every_known_core_permission_code_in_that_catalog
        - materialize_one_membership_permissions_decision_per_known_permission
        - set_granted_true_for_template_included_permissions
        - set_granted_false_for_nonincluded_permissions
        - materialize_scope_rows_for_each_granted_permission_from_template_scope_policy
        - persist_no_scope_rows_for_denied_permissions
        - store_template_code_and_catalog_version_as_provenance
        - write_audit_snapshot
    reapply_or_change:
      explicit_command_only: true
      transaction:
        - resolve_selected_template_against_current_catalog
        - replace_decisions_for_every_known_core_permission_atomically
        - replace_scope_rows_for_every_known_core_permission_atomically
        - update_template_provenance
        - audit_before_after
  template_definition_change:
    automatically_changes_existing_memberships: false
    reason: prevent_silent_privilege_expansion_or_revocation
  new_permission_after_membership_creation:
    effective_default: denied
    becomes_available_by:
      - explicit_permission_grant_with_explicit_scope
      - explicit_template_reapplication_or_upgrade

membership_permissions:
  blocker: DB-IAM-001
  status: RESOLVED_DESIGN
  purpose: authoritative_current_permission_decisions_for_one_membership
  fields:
    membership_id: uuid_FK_organization_memberships
    permission_code: varchar_128_FK_permissions
    granted: boolean_not_null
    created_at: timestamptz
  unique:
    columns: [membership_id, permission_code]
  effective_permission_algorithm:
    prerequisites:
      - authenticated_user
      - active_membership
      - tenant_validation
    lookup: membership_id_plus_permission_code
    granted_true: proceed_to_scope_resolution_then_domain_state_and_elevated_checks
    granted_false: deny
    missing_row: deny
    role_template_code_consulted_at_runtime: false
  explicit_change:
    changes_current_decision: true
    role_template_provenance_overrides_explicit_change: false
    grant_requires_explicit_valid_scope_set: true
    deny_removes_or_deactivates_all_scope_rows_in_same_transaction: true
    audit_required: true
  concurrency_and_history: PENDING_DB_IAM_005

permissions_catalog:
  table: permissions
  primary_key: code
  source: specs/security/permissions.yml
  seed_or_sync_required: true
  unknown_permission_code_in_membership_permissions: rejected_by_FK
  deleting_permission_code_with_historical_audit_dependency: forbidden_without_migration_policy

# DB-IAM-002 canonical physical/query contract.
data_scope_contract:
  blocker: DB-IAM-002
  status: RESOLVED_DESIGN

  superseded_shape:
    organization_memberships_data_scope_column:
      status: SUPERSEDED_BY_PER_PERMISSION_SCOPE_ROWS
      runtime_use_forbidden: true
      final_DB4_2_aggregate_sync_action: remove_from_core_blueprint_before_migrations
      reason: one_membership_wide_string_cannot_express_different_scopes_per_permission_or_scope_union

  scope_catalog:
    table: data_scopes
    fields:
      code: varchar_64_primary_key
      description: varchar_255_not_null
    canonical_codes:
      - organization
      - own
      - assigned_students
      - assigned_locations
    extensibility: new_scope_requires_catalog_change_policy_resolver_tests_and_migration_seed

  permission_scope_options:
    table: permission_scope_options
    purpose: whitelist_which_scope_codes_are_legal_for_each_permission
    fields:
      permission_code: varchar_128_FK_permissions
      scope_code: varchar_64_FK_data_scopes
      resolver_code: varchar_96_not_null
    primary_key: [permission_code, scope_code]
    source: specs/security/permissions.yml_permission_scope_profiles
    invariant: unsupported_permission_scope_pair_cannot_be_materialized

  membership_permission_scopes:
    table: membership_permission_scopes
    purpose: authoritative_current_scope_predicates_for_one_granted_membership_permission
    fields:
      membership_id: uuid
      permission_code: varchar_128
      scope_code: varchar_64
      created_at: timestamptz
    primary_key: [membership_id, permission_code, scope_code]
    foreign_keys:
      permission_decision:
        columns: [membership_id, permission_code]
        references: membership_permissions_membership_id_permission_code
        on_delete: cascade_only_within_authorization_configuration_record_not_business_history
      allowed_scope_pair:
        columns: [permission_code, scope_code]
        references: permission_scope_options_permission_code_scope_code
    granted_permission_requires_at_least_one_scope_row: transactional_invariant
    denied_permission_requires_zero_scope_rows: transactional_invariant
    multiple_scope_rows_for_same_permission:
      allowed: true
      combination: logical_OR_within_that_permission_after_tenant_validation
      example: instructor_may_receive_own_OR_assigned_students
    no_scope_rows_for_granted_permission: deny_fail_closed_even_if_data_is_temporarily_inconsistent

  runtime_algorithm:
    order:
      - authenticate_user
      - resolve_active_organization_membership
      - validate_target_resource_or_proposed_relation_belongs_to_same_organization
      - load_membership_permission_decision
      - require_granted_true
      - load_membership_permission_scope_rows
      - require_at_least_one_scope_row
      - evaluate_each_scope_with_registered_permission_scope_resolver
      - allow_scope_layer_if_any_resolver_matches
      - evaluate_domain_state_rule
      - evaluate_elevated_reauth_or_MFA_when_configured
    organization_scope_never_bypasses_tenant_validation: true
    permission_without_scope_match: deny
    unknown_resolver_code: deny_and_configuration_error
    scope_may_expand_permission_capability: false
    scope_semantics: scope_is_row_level_constraint_after_capability_grant

  resolver_registry:
    organization:
      resolver_code: tenant_resource
      rule: target_or_proposed_resource_organization_id_equals_active_membership_organization_id
    own:
      resolver_code: permission_target_owner
      rule: >-
        Permission-specific resolver must prove that the target belongs to the
        current User or to the StaffProfile actively linked to this membership.
        If the target domain has no canonical ownership relation, own evaluates false.
      unresolved_owner_relation: deny
    assigned_locations:
      resolver_code: permission_target_assigned_location
      rule: >-
        Resolve the active StaffProfile linked to the membership, then resolve its
        current staff_location_assignments. The target resource must map through
        the permission-specific adapter to one of those locations. No active staff
        link or no matching location means deny.
      physical_dependency_to_finalize_in: DB4_3_STAFF_LOCATIONS_VEHICLES
      dependency_contract_fixed_here: staff_membership_link_to_staff_profile_then_staff_location_assignments
    assigned_students:
      resolver_code: permission_target_assigned_student
      rule: >-
        Resolve the active StaffProfile linked to the membership. A student is in
        the assigned set when a non-cancelled/non-archived CourseEnrollment for
        that student has lead_instructor_id equal to that StaffProfile OR when a
        non-cancelled TrainingSession for that student's CourseEnrollment has
        instructor_id equal to that StaffProfile. Permission-specific adapters for
        course, PKK, exam, license, finance or training resources resolve their
        canonical student/course first and then apply this predicate.
      no_active_staff_link: deny_empty_set
      physical_dependency_to_finalize_in:
        - DB4_3_STAFF_LOCATIONS_VEHICLES
        - DB4_4_STUDENTS_COURSES_TRAINING_LEDGER
      dependency_contract_fixed_here:
        - active_staff_membership_link_is_required
        - lead_instructor_relation_counts_as_assignment
        - instructor_training_session_relation_counts_as_assignment
        - cancelled_or_archived_relations_do_not_grant_scope

  command_scope_rules:
    read_command: evaluate_scope_on_existing_target
    update_or_delete_like_command: evaluate_scope_on_existing_target_before_domain_transition
    create_command_with_existing_parent: evaluate_scope_on_canonical_existing_parent_or_subject
    create_command_without_preexisting_scoped_subject:
      rule: only_a_scope_profile_explicitly_allowing_organization_may_authorize
      reason: assigned_or_own_cannot_be_proven_before_a_canonical_subject_exists
    bulk_command: every_target_must_match_scope_or_command_uses_explicit_partial_success_contract
    background_job: execute_under_recorded_actor_or_system_service_policy_never_inherit_unbounded_scope_from_missing_membership

  query_policy:
    list_endpoints_must_apply_scope_in_database_query: true
    fetch_by_id_must_apply_same_scope_predicate: true
    post_fetch_frontend_filtering_as_security_boundary: forbidden
    count_export_pdf_and_search_endpoints_must_apply_same_scope: true
    cross_tenant_union_before_filtering: forbidden
    cache_key_must_include_membership_permission_scope_version_or_equivalent_invalidation: authorization_version

  downstream_slice_obligations:
    DB4_3:
      - materialize_staff_membership_link_and_staff_location_assignment_constraints_compatible_with_resolvers
      - prove_assigned_locations_fail_closed_without_active_staff_link
    DB4_4:
      - materialize_course_lead_instructor_and_training_session_instructor_relations_compatible_with_assigned_students
      - prove_cancelled_or_archived_course_or_session_does_not_expand_assigned_students
    DB4_5:
      - define_permission_specific_calendar_owner_location_student_adapters_without_changing_scope_semantics
    rule: downstream_slices_may_implement_adapters_but_may_not_redefine_scope_meaning_without_new_ADR_and_gate_reopen

  tests_required:
    - granted_permission_without_scope_rows_is_denied
    - denied_permission_with_stale_scope_rows_is_denied_and_consistency_check_fails
    - unsupported_permission_scope_pair_is_rejected_by_composite_FK
    - organization_scope_still_rejects_cross_tenant_resource
    - multiple_scope_rows_are_OR_not_AND
    - own_scope_does_not_fall_back_to_organization_when_owner_relation_is_missing
    - assigned_locations_without_active_staff_link_returns_empty_set
    - assigned_students_without_active_staff_link_returns_empty_set
    - assigned_students_matches_lead_instructor_course_relation
    - assigned_students_matches_non_cancelled_training_session_instructor_relation
    - cancelled_or_archived_assignment_relation_does_not_grant_student_scope
    - list_and_fetch_by_id_apply_equivalent_scope_predicate
    - explicit_permission_grant_requires_explicit_allowed_scope_set
    - template_application_materializes_scopes_only_for_granted_permissions

# DB-IAM-003 canonical session/membership integrity contract.
auth_session_membership_integrity:
  blocker: DB-IAM-003
  status: RESOLVED_DESIGN
  goal: prevent_a_session_for_one_user_from_selecting_another_users_organization_membership

  session_shape:
    auth_sessions_user_id:
      nullable: false
      foreign_key: users_id
      semantics: authenticated_global_user_identity
    auth_sessions_organization_membership_id:
      nullable: true
      semantics: selected_tenant_context_when_present
    null_membership_context:
      allowed: true
      use_cases:
        - authenticated_pre_tenant_selection
        - global_account_or_security_flow_not_requiring_organization_context
      tenant_owned_operation_allowed_without_membership: false

  organization_membership_reference_key:
    required_unique_constraint:
      table: organization_memberships
      columns: [id, user_id]
      reason: PostgreSQL_composite_FK_target_for_same_user_session_context
    membership_user_id_mutation:
      allowed: false
      rule: a_membership_is_never_reassigned_to_another_user_mutate_status_or_create_correct_membership_instead

  same_user_composite_foreign_key:
    source_table: auth_sessions
    source_columns: [organization_membership_id, user_id]
    target_table: organization_memberships
    target_columns: [id, user_id]
    match_semantics: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT
    effect: >-
      When organization_membership_id is non-null, PostgreSQL must prove that the
      referenced membership row has the same user_id as the session. A membership
      belonging to User B cannot be selected by a session whose user_id is User A.
      When organization_membership_id is null, the composite FK is intentionally
      not applicable and the session remains a global/pre-tenant session.

  context_selection_transaction:
    requirements:
      - load_session_by_non_secret_session_identifier
      - resolve_requested_membership
      - require_requested_membership_user_id_equals_session_user_id
      - require_membership_is_eligible_for_tenant_context_under_current_lifecycle_policy
      - update_auth_sessions_organization_membership_id
      - rely_on_composite_FK_as_final_database_integrity_boundary
    client_supplied_organization_id_as_authority: forbidden
    selected_organization_is_derived_from_membership: true

  runtime_authorization:
    tenant_owned_request_requires_non_null_membership_context: true
    membership_same_user_is_guaranteed_by_database_when_context_is_non_null: true
    active_membership_still_rechecked_at_request_time: true
    note: >-
      The composite FK solves identity integrity only. Membership state transitions,
      suspension/revocation and session invalidation timing remain DB-IAM-005 and
      are intentionally not defined by this blocker.

  migration_and_existing_data_gate:
    before_adding_composite_FK:
      - scan_for_auth_sessions_with_non_null_membership_whose_membership_user_id_differs_from_session_user_id
      - fail_migration_or_quarantine_invalid_security_records_do_not_silently_repair_to_another_user
      - add_unique_organization_memberships_id_user_id
      - add_composite_auth_sessions_membership_user_FK
    invalid_existing_row_policy: security_error_requires_explicit_remediation

  tests_required:
    - session_with_membership_belonging_to_same_user_is_accepted
    - session_with_membership_belonging_to_different_user_is_rejected_by_database
    - session_with_null_membership_is_allowed_for_global_or_pre_tenant_context
    - tenant_owned_operation_with_null_membership_context_is_denied_by_backend_policy
    - same_user_can_switch_session_context_between_memberships_in_two_different_organizations
    - organization_membership_user_id_cannot_be_reassigned_to_another_user
    - migration_detects_preexisting_cross_user_session_membership_rows_before_constraint_creation

# DB-IAM-004 canonical owner / privilege-management contract.
owner_privilege_management:
  blocker: DB-IAM-004
  status: RESOLVED_DESIGN

  owner_marker:
    table: organization_memberships
    field:
      name: is_owner
      type: boolean_not_null_default_false
    runtime_permission_shortcut: false
    semantics: >-
      is_owner is a governance/responsibility marker used for owner-transfer,
      last-owner and elevated-administration invariants. Backend capability checks
      still resolve through membership_permissions and membership_permission_scopes.

  authorization_epoch:
    field_on_organization_memberships:
      name: authorization_version
      type: bigint_not_null_default_1_check_gte_1
    increments_on:
      - permission_grant_or_revoke
      - permission_scope_change
      - owner_promotion_or_demotion
      - any_membership_state_change_that_changes_authorization_eligibility
    purpose:
      - invalidate_or_version_authorization_cache
      - make_elevated_revocation_effective_on_next_request
    session_permission_snapshot_storage: forbidden
    request_rule: current_authorization_version_must_be_observed_before_authorizing_tenant_request
    exact_mutation_concurrency_protocol: PENDING_DB_IAM_005

  owner_protected_permission_baseline:
    required_while_is_owner_true:
      organization.view: [organization]
      organization.members.manage: [organization]
      staff.permissions.manage: [organization]
      sessions.manage.organization: [organization]
    runtime_source_remains_membership_permissions: true
    invariant: >-
      Owner status itself does not grant permissions. Instead, the owner mutation
      transaction must materialize and preserve these explicit permission/scope
      rows while is_owner=true. Removing a protected permission requires demoting
      the membership from owner in the same serialized transaction.

  active_owner_predicate:
    conditions:
      - is_owner_true
      - membership_is_currently_authorization_eligible
      - owner_protected_permission_baseline_is_materialized
    exact_membership_status_codes: PENDING_DB_IAM_005
    rule: >-
      DB-IAM-005 may name the lifecycle states, but it may not weaken the rule that
      a governance-counted owner must actually be eligible to authorize requests
      and retain the protected management baseline.

  owner_mutation_transaction:
    serialization_lock: organization_row_FOR_UPDATE_or_equivalent_single_tenant_governance_lock
    ordinary_actor_requirements:
      - actor_membership_same_organization
      - actor_is_active_owner
      - actor_has_organization_members_manage_with_organization_scope
      - actor_has_staff_permissions_manage_with_organization_scope
      - recent_reauthentication_required
      - MFA_required_when_account_policy_or_tenant_policy_requires_it
    initial_organization_bootstrap_exception:
      allowed: true
      only_when: organization_and_first_owner_membership_are_created_atomically_by_trusted_onboarding_flow
      normal_admin_endpoint_may_use_exception: false
    promote_owner:
      self_promotion_in_normal_flow: forbidden
      transaction:
        - lock_organization_governance_boundary
        - validate_actor_requirements
        - validate_target_membership_same_organization_and_authorization_eligible
        - materialize_owner_protected_permission_baseline
        - set_target_is_owner_true
        - increment_target_authorization_version
        - write_redacted_audit_before_after_with_actor_and_request_id
    demote_suspend_or_remove_owner_effect:
      transaction:
        - lock_organization_governance_boundary
        - compute_post_transaction_active_owner_count
        - require_post_transaction_active_owner_count_gte_1
        - apply_requested_owner_or_membership_change
        - increment_affected_authorization_version
        - write_redacted_audit_before_after_with_actor_and_reason_when_required
    atomic_transfer:
      supported: true
      semantics: promote_successor_and_demote_predecessor_in_one_serialized_transaction
      intermediate_zero_owner_state_visible_after_commit: false

  self_escalation_policy:
    ordinary_admin_flow:
      actor_may_grant_new_permission_to_self: false
      actor_may_broaden_own_scope: false
      actor_may_set_self_is_owner_true: false
      actor_may_reapply_template_to_self_if_it_expands_privileges: false
    self_restriction:
      allowed: true
      constraints:
        - cannot_break_owner_protected_baseline_while_is_owner_true
        - cannot_reduce_post_transaction_active_owner_count_below_one
    break_glass:
      normal_product_UI_or_API: forbidden
      operational_recovery_if_ever_added: separate_high_assurance_procedure_with_security_audit_not_this_admin_flow

  grant_ceiling:
    applies_to_permission_and_scope_grants: true
    base_rule: actor_cannot_grant_a_capability_the_actor_does_not_currently_possess_in_same_organization
    scope_rule:
      organization_scope: actor_with_organization_scope_for_same_permission_may_delegate_any_narrower_allowed_scope_for_that_permission
      non_organization_scope: actor_may_delegate_only_scope_codes_the_actor_currently_holds_for_same_permission
      unknown_or_incomparable_scope_relation: deny
    elevated_permission_rule:
      elevated_catalog_source: specs/security/permissions.yml
      grant_or_scope_broadening_requires_active_owner_actor: true
    owner_marker_change_requires_active_owner_actor: true
    target_tenant_must_equal_actor_tenant: true

  active_session_effect:
    permission_and_scope_checked_from_authoritative_current_rows_each_request: true
    authorization_cache_if_used:
      key_or_validation_must_include_current_authorization_version: true
      stale_version: reload_or_deny_before_business_action
    elevated_permission_revoke:
      effective_no_later_than_next_authorized_request: true
      stale_elevation_or_reauth_proof_invalidated: true
      session_authentication_may_remain_valid: true
      note: >-
        Revoking an elevated permission does not have to log the user out merely
        to make the revoke effective. The session may remain authenticated, but
        authorization is recalculated against the incremented authorization_version.
        Full suspend/revoke session lifecycle is finalized in DB-IAM-005.

  tests_required:
    - role_template_owner_label_alone_never_authorizes_request
    - is_owner_true_without_materialized_protected_baseline_is_rejected_by_consistency_check
    - normal_admin_cannot_promote_self_to_owner
    - normal_admin_cannot_grant_self_new_permission
    - normal_admin_cannot_broaden_own_scope
    - non_owner_permission_admin_cannot_grant_elevated_permission
    - actor_cannot_grant_permission_the_actor_does_not_have
    - actor_cannot_delegate_scope_broader_than_own_scope_for_same_permission
    - owner_promotion_materializes_protected_permissions_and_organization_scopes_atomically
    - transaction_that_would_leave_zero_active_owners_is_rejected
    - concurrent_owner_demotions_cannot_both_commit_and_leave_zero_active_owners
    - owner_transfer_promote_and_demote_is_atomic
    - protected_owner_permission_cannot_be_revoked_without_owner_demotion_same_transaction
    - elevated_permission_revoke_increments_authorization_version
    - stale_authorization_cache_or_proof_cannot_authorize_after_version_increment

open_blockers_not_resolved_here:
  DB-IAM-005:
    status: OPEN
    topic: membership_and_permission_mutation_lifecycle_concurrency

tests_required_for_DB_IAM_001:
  - applying_template_materializes_a_decision_for_every_permission_known_in_that_catalog_version
  - included_template_permission_is_granted_true
  - nonincluded_template_permission_is_granted_false
  - missing_permission_row_is_denied
  - changing_template_definition_does_not_change_existing_membership_permissions
  - new_permission_added_to_catalog_is_denied_for_existing_membership_until_explicit_action
  - explicit_permission_change_overrides_previous_materialized_template_decision
  - runtime_authorization_never_checks_role_template_code
  - template_reapply_replaces_known_permission_decisions_atomically
  - template_code_and_catalog_version_are_provenance_not_authorization_shortcut
