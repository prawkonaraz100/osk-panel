        - source_question_identifier_varchar_128_nullable_provenance_only
        - source_question_revision_identifier_varchar_128_nullable_provenance_only
        - question_snapshot_schema_version_integer_not_null_check_gte_1
        - question_snapshot_jsonb_not_null
        - question_snapshot_hash_char64_not_null
        - media_evidence_snapshot_jsonb_nullable
        - max_points_snapshot_integer_not_null_check_gte_0
        - candidate_answer_jsonb_nullable
        - is_correct_boolean_nullable
        - points_awarded_integer_nullable
        - answered_at_timestamptz_nullable
      ordinal_minimum: 1
      ordinal_unique_scope_preserved: [organization_id, internal_exam_attempt_id, ordinal]
      source_question_identifier_or_revision_is_runtime_history_authority: false
      immutable_start_time_fields:
