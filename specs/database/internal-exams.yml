        result_question_set_hash_equals_attempt_question_set_hash: true
        score_equals_sum_points_awarded: true
        max_score_equals_sum_max_points_snapshot: true
        score_bounds_zero_to_max_score: true
        pass_threshold_snapshot_required_only_when_selected_scoring_policy_uses_numeric_threshold: true
        passed_must_equal_frozen_scoring_policy_evaluation: true
        is_correct_and_points_awarded_must_match_frozen_question_evaluation_policy: true
      non_question_assessment_consistency:
