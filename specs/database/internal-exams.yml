      normal_version_step: version_after_equals_version_before_plus_1
      creation_event_version_before: null
      creation_event_version_after: 1
      current_row_version_and_status_must_match_latest_event: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard
