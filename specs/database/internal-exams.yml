resolved_contracts:
  DB-EXAM-001:
    status: PASS
    title: same_tenant_and_exact_target_integrity
    severity: P1
    goal: >-
      Every formal InternalExam relation must be unable to connect tenant-owned
      resources from different organizations or to combine a Course, Student,
      Attempt, Access, StationSession, Result, Question or Document that does not
      belong to the exact intended parent relation.

    tenant_key_policy:
      organization_id_required_nonnull_on:
        - internal_exam_inventory_entries
        - internal_exam_attempts
        - internal_exam_reservations
        - internal_exam_accesses
        - exam_stations
        - internal_exam_station_sessions
        - internal_exam_attempt_questions
        - internal_exam_results
        - internal_exam_documents
      organization_id_client_authority: false
      tenant_key_source: active_membership_or_validated_parent
      organization_id_mutation_after_insert: forbidden_for_normal_domain_lifecycle
      relation_on_update: RESTRICT
      relation_on_delete: RESTRICT
      formal_history_destructive_cascade: forbidden

    candidate_keys_required:
      students:
        columns: [organization_id, id]
        source: DB4_4
      course_enrollments:
        columns: [organization_id, id]
        source: DB4_4
      course_enrollments_exact_student:
        columns: [organization_id, id, student_id]
        unique_constraint_required: true
        purpose: exact_formal_attempt_course_student_FK_target
      file_assets:
        columns: [organization_id, id]
        source: DB4_2_foundation
      internal_exam_inventory_entries:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_attempts:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_reservations:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_accesses:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_accesses_exact_attempt:
        columns: [organization_id, id, internal_exam_attempt_id]
        unique_constraint_required: true
        purpose: station_session_exact_access_attempt_FK_target
      exam_stations:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_station_sessions:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_station_sessions_exact_attempt:
        columns: [organization_id, id, internal_exam_attempt_id]
        unique_constraint_required: true
        purpose: transfer_chain_same_attempt_FK_target

    attempt_relations:
      student_same_tenant:
        source_table: internal_exam_attempts
        source_columns: [organization_id, student_id]
        target_table: students
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      exact_course_student:
        source_table: internal_exam_attempts
        source_columns: [organization_id, course_enrollment_id, student_id]
        target_table: course_enrollments
        target_columns: [organization_id, id, student_id]
        nullable: false
        match: MATCH_SIMPLE
        effect: attempt_course_must_belong_to_exact_attempt_student
      driving_category_is_global_dictionary: true
      language_is_global_dictionary: true
      category_or_language_matching_course_or_capability: deferred_to_DB_EXAM_002

    reservation_relations:
      inventory_same_tenant:
        source_columns: [organization_id, internal_exam_inventory_entry_id]
        target_table: internal_exam_inventory_entries
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      lifecycle_equivalence_and_exactly_once_consumption: deferred_to_DB_EXAM_003

    access_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      optional_station_same_tenant:
        source_columns: [organization_id, station_id]
        target_table: exam_stations
        target_columns: [organization_id, id]
        nullable: true
        match: MATCH_SIMPLE
      station_required_or_forbidden_by_mode: deferred_to_DB_EXAM_004_and_DB_EXAM_006

    station_session_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      exact_access_attempt:
        source_columns: [organization_id, internal_exam_access_id, internal_exam_attempt_id]
        target_table: internal_exam_accesses
        target_columns: [organization_id, id, internal_exam_attempt_id]
        nullable: false
        match: MATCH_SIMPLE
        effect: station_session_cannot_pair_access_for_attempt_A_with_attempt_B
      station_same_tenant:
        source_columns: [organization_id, exam_station_id]
        target_table: exam_stations
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      transfer_same_tenant_same_attempt:
        source_columns: [organization_id, transferred_from_session_id, internal_exam_attempt_id]
        target_table: internal_exam_station_sessions
        target_columns: [organization_id, id, internal_exam_attempt_id]
        nullable: true
        match: MATCH_SIMPLE
        effect: transfer_reference_cannot_cross_tenant_or_switch_attempt
      created_by_user_is_global_identity: true
      created_by_user_fake_tenant_composite_FK: false
      active_station_uniqueness_and_failover_transition_rules: deferred_to_DB_EXAM_006

    attempt_question_relations:
      organization_id_addition_required: true
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      ordinal_unique_scope: [organization_id, internal_exam_attempt_id, ordinal]
      question_content_scoring_immutability: deferred_to_DB_EXAM_007

    result_relations:
      organization_id_addition_required: true
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      one_result_per_attempt_unique_scope: [organization_id, internal_exam_attempt_id]
      result_scoring_consistency_and_immutability: deferred_to_DB_EXAM_007

    document_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      asset_same_tenant:
        source_columns: [organization_id, asset_id]
        target_table: file_assets
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      asset_purpose_readiness_document_version_and_hash_policy: deferred_to_DB_EXAM_007

    commerce_boundary:
      internal_exam_inventory_source_order_item_same_tenant_relation: deferred_to_DB4_9
      reason: >-
        Current order_items lacks the finalized organization candidate key needed
        to prove the commerce tenant boundary. DB-EXAM-001 must not partially
        redesign purchase/payment/inventory grant provenance before DB4_9.

    migration_policy:
      precheck_attempt_course_student_exact_pair: required
      precheck_all_existing_tenant_owned_parent_child_organization_ids: required
      precheck_station_session_access_attempt_exact_pair: required
      precheck_station_transfer_same_attempt: required
      precheck_document_asset_same_tenant: required
      add_question_result_organization_id_by_exact_mandatory_attempt_parent: allowed_deterministic_backfill
      auto_reassign_attempt_to_different_student_or_course: forbidden
      auto_rewire_station_session_to_different_access_attempt_or_station: forbidden
      auto_reassign_inventory_reservation: forbidden
      auto_null_cross_tenant_document_asset: forbidden
      auto_guess_missing_parent_id: forbidden
      unresolved_mismatch: fail_and_require_reviewed_remediation

    required_tests:
      - attempt_cross_tenant_student_rejected
      - attempt_cross_tenant_course_rejected
      - attempt_same_org_wrong_student_course_pair_rejected
      - reservation_cross_tenant_inventory_rejected
      - reservation_cross_tenant_attempt_rejected
      - access_cross_tenant_attempt_rejected
      - access_nonnull_cross_tenant_station_rejected
      - access_null_station_still_allowed_structurally_before_mode_matrix_DB_EXAM_004_006
      - station_session_cross_tenant_attempt_rejected
      - station_session_cross_tenant_access_rejected
      - station_session_access_for_other_attempt_rejected_even_same_org
      - station_session_cross_tenant_station_rejected
      - station_session_transfer_cross_tenant_rejected
      - station_session_transfer_to_other_attempt_rejected_even_same_org
      - attempt_question_cross_tenant_attempt_rejected
      - duplicate_attempt_question_ordinal_same_attempt_rejected
      - result_cross_tenant_attempt_rejected
      - second_result_same_attempt_rejected
      - document_cross_tenant_attempt_rejected
      - document_cross_tenant_file_asset_rejected
      - global_user_actor_not_fake_tenant_scoped
      - driving_category_and_language_global_dictionaries_not_fake_tenant_scoped
      - migration_backfills_question_result_org_only_from_exact_attempt_parent
      - migration_fails_on_wrong_student_course_pair
      - migration_fails_on_station_session_access_attempt_mismatch
      - migration_fails_on_cross_tenant_document_asset
      - DB_EXAM_002_through_DB_EXAM_008_remain_open

  DB-EXAM-002:
    status: PASS
    title: formal_course_requirement_and_exam_capability_basis
    severity: P1
    goal: >-
      A formal InternalExamAttempt must prove which exact immutable requirement
      decision authorized the requested exam part and which exact category/part/
      language capability made that exam variant available at creation time,
      without making the Attempt a second rule-engine authority.

    authority_model:
      requirement_decision_authority: training_requirement_profiles
      current_requirement_freshness_authority: course_enrollments.requirements_revision
      requirement_rule_artifact_authority: training_requirement_rule_sets
      exam_category_authority: course_enrollments.driving_category_id
      requested_exam_part_authority: CreateInternalExamAttemptRequest.exam_part_subject_to_current_requirement_profile
      requested_language_authority: CreateInternalExamAttemptRequest.language_code_subject_to_current_capability
      generic_requirement_basis_text_as_canonical_authority: false
      current_capability_projection_authority: internal_exam_capabilities_current_rows
      attempt_stores_historical_basis_not_independent_requirement_decision: true

    requirement_profile_exact_binding:
      add_attempt_columns:
        - training_requirement_profile_id_uuid_not_null
        - requirements_revision_bigint_not_null_check_gte_1
        - internal_exam_capability_id_uuid_not_null
        - requirement_basis_snapshot_jsonb_not_null
      training_requirement_profiles_candidate_key:
        columns: [organization_id, id, course_enrollment_id, requirements_revision]
        unique_constraint_required: true
        purpose: exact_attempt_course_revision_profile_FK_target
      attempt_exact_profile_FK:
        source_columns: [organization_id, training_requirement_profile_id, course_enrollment_id, requirements_revision]
        target_table: training_requirement_profiles
        target_columns: [organization_id, id, course_enrollment_id, requirements_revision]
        on_update: RESTRICT
        on_delete: RESTRICT
      course_enrollments_exact_student_category_candidate_key:
        columns: [organization_id, id, student_id, driving_category_id]
        unique_constraint_required: true
      attempt_exact_course_student_category_FK:
        source_columns: [organization_id, course_enrollment_id, student_id, driving_category_id]
        target_table: course_enrollments
        target_columns: [organization_id, id, student_id, driving_category_id]
        on_update: RESTRICT
        on_delete: RESTRICT
        strengthens_DB_EXAM_001_exact_course_student_boundary: true
      profile_must_be_current_at_attempt_creation: true
      current_profile_predicate: superseded_at_is_null_and_profile_requirements_revision_equals_course_requirements_revision
      profile_currentness_is_permanent_FK_condition: false
      reason: later_requirement_recalculation_must_be_allowed_to_supersede_profile_without_invalidating_historical_attempt

    required_part_mapping:
      theory:
        required_profile_flag: internal_theory_exam_required
        creation_requires_value: true
      practical:
        required_profile_flag: internal_practical_exam_required
        creation_requires_value: true
      unsupported_exam_part_value: rejected
      theory_exempt_profile_allows_new_theory_attempt: false
      practical_not_required_profile_allows_new_practical_attempt: false
      attempt_exam_part_mutable_after_creation: false
      attempt_requirement_profile_or_revision_rebind_after_creation: forbidden

    internal_exam_capabilities:
      role: global_versioned_category_part_language_availability_history
      tenant_owned: false
      fields:
        - id_uuid_PK
        - driving_category_id_uuid_not_null_FK_global_dictionary
        - exam_part_varchar_16_not_null_theory_or_practical
        - language_code_varchar_16_not_null_FK_global_language_dictionary
        - enabled_at_timestamptz_not_null
        - disabled_at_timestamptz_nullable
        - source_reference_varchar_255_nullable
        - created_at_timestamptz_not_null
      current_predicate: disabled_at_is_null
      current_unique:
        type: partial_unique
        columns: [driving_category_id, exam_part, language_code]
        where: disabled_at_is_null
      exact_attempt_target_candidate_key:
        columns: [id, driving_category_id, exam_part, language_code]
        unique_constraint_required: true
      attempt_exact_capability_FK:
        source_columns: [internal_exam_capability_id, driving_category_id, exam_part, language_code]
        target_columns: [id, driving_category_id, exam_part, language_code]
        on_update: RESTRICT
        on_delete: RESTRICT
      category_part_or_language_change_in_place: forbidden
      normal_retirement: set_disabled_at_once
      retired_row_hard_delete: forbidden_after_reference
      reenable_same_historical_row_in_place: forbidden
      later_reenable: create_new_capability_row
      current_API_capabilities_endpoint_projection: group_current_rows_by_category_and_exam_part_and_list_language_codes
      global_language_dictionary_alone_implies_exam_support: false
      observed_screen_language_list_as_global_authority: false

    attempt_basis_snapshot:
      canonical_column: requirement_basis_snapshot
      immutable_after_insert: true
      minimum_safe_fields:
        - training_requirement_profile_id
        - requirements_revision
        - rule_set_version
        - rule_set_content_hash
        - exam_part
        - required_profile_flag_name
        - required_profile_flag_value_true
        - exemption_basis_code_nullable
        - driving_category_id
        - driving_category_code
        - training_type
        - internal_exam_capability_id
        - language_code
        - basis_evaluated_at
      basis_evaluated_at_source: command_effective_at_captured_once_for_attempt_creation
      PESEL_in_requirement_basis_snapshot: forbidden
      PKK_in_requirement_basis_snapshot: forbidden
      candidate_identity_snapshot_remains_separate: true
      snapshot_is_history_evidence_not_current_rule_authority: true
      integration_test_must_match_profile_rule_set_course_category_and_capability: true

    creation_serialization_and_race_boundary:
      operation: POST_/course-enrollments/{courseEnrollmentId}/internal-exam-attempts
      current_request_fields: [exam_part, language_code]
      request_may_supply_driving_category_id: false
      first_lock_prefix: [course_enrollment_FOR_UPDATE]
      reason: DB_TRN_005_requirement_recalculation_also_serializes_on_course_enrollment
      after_course_lock_require:
        - exact_current_training_requirement_profile_exists
        - current_profile_requirements_revision_equals_locked_course_requirements_revision
        - selected_exam_part_required_flag_is_true
      selected_category: derive_from_locked_course_enrollment_driving_category_id
      capability_lookup: exact_current_row_for_derived_category_plus_requested_exam_part_plus_requested_language
      capability_row_lock_during_creation: FOR_SHARE
      capability_retirement_requires_conflicting_row_update_lock: true
      write_attempt_profile_revision_category_capability_and_basis_snapshot_atomically: true
      inventory_reservation_transaction_integration: deferred_to_DB_EXAM_003
      later_steps_may_extend_lock_order_but_must_not_reorder_course_prefix: true
      requirement_change_vs_attempt_create_result: >-
        Both commands serialize on CourseEnrollment. If attempt creation commits
        first, it records the then-current immutable profile and later recalculation
        may supersede that profile without rewriting the Attempt. If recalculation
        commits first, attempt creation must validate the new current profile and
        cannot use the superseded one.
      capability_disable_vs_attempt_create_result: >-
        Creation locks the selected current capability row for share while retirement
        updates that same row. Therefore either the attempt records a capability that
        was current before retirement, or retirement wins first and the new attempt
        is rejected; no new attempt may commit against an already-disabled row.

    later_requirement_or_capability_change_semantics:
      existing_attempt_profile_pointer_rewritten: false
      existing_attempt_requirements_revision_rewritten: false
      existing_attempt_category_or_language_rewritten: false
      existing_attempt_basis_snapshot_rewritten: false
      existing_attempt_auto_invalidated_by_requirement_recalculation: false
      existing_attempt_auto_invalidated_by_capability_retirement: false
      new_attempt_may_use_superseded_requirement_profile: false
      new_attempt_may_use_disabled_capability: false
      derived_basis_current_projection_allowed: true
      derived_basis_current_projection_is_mutable_authority: false
      prestart_start_or_access_policy_when_basis_later_becomes_noncurrent: deferred_to_DB_EXAM_004
      reason: >-
        DB-EXAM-002 closes creation eligibility and immutable historical provenance.
        Any explicit lifecycle action on an already-created pre-start Attempt must
        be decided by DB-EXAM-004 rather than silently rewriting or deleting history.

    migration_policy:
      generic_legacy_requirement_basis_text_is_sufficient_to_infer_profile_pointer: false
      current_requirement_profile_may_be_used_as_latest_heuristic_for_old_attempt: false
      nearest_profile_by_calculated_at_or_UUID: forbidden
      rerun_current_rule_engine_to_backfill_historical_basis: forbidden
      current_capability_row_may_be_assumed_historical_capability: false
      language_list_from_screen_or_global_dictionary_may_be_used_to_infer_support: false
      reviewed_exact_profile_and_capability_mapping_when_proven: allowed
      unresolved_legacy_attempt_basis: fail_and_require_reviewed_remediation
      auto_delete_or_auto_invalidate_unreconstructible_attempt: forbidden
      no_fake_rule_set_version_or_content_hash: true

    required_tests:
      - create_theory_attempt_requires_current_profile_internal_theory_exam_required_true
      - theory_exempt_course_rejects_new_theory_attempt
      - create_practical_attempt_requires_current_profile_internal_practical_exam_required_true
      - practical_not_required_course_rejects_new_practical_attempt
      - attempt_category_is_derived_from_exact_course_and_same_org_wrong_category_is_rejected
      - request_cannot_override_course_category
      - attempt_profile_pointer_for_other_course_is_rejected
      - attempt_profile_revision_must_equal_exact_referenced_profile_revision
