  DB-EXAM-007:
    status: PASS
    title: immutable_exam_definition_question_result_and_document_evidence
    severity: P1
    goal: >-
      Make the definition selected at exam start, the exact ordered question/content/media
      evidence, the final answers and scoring, the Result and every formal answer-sheet
      artifact historically reproducible and immutable, so no later question-bank,
      scoring-policy, template or administrative change can rewrite a finished Attempt.

    scope_boundary:
      observed_theory_question_test_evidence_fully_closed: true
      practical_exam_forced_into_32_question_or_74_point_structure: false
      observed_32_questions_global_constant: false
      observed_74_max_points_global_constant: false
      unobserved_positive_result_label_hardcoded: false
      non_question_assessment_may_use_same_definition_result_document_envelope_without_fake_question_rows: true
      DB_EXAM_008_management_latest_statistics_projection_not_fixed: true

    authority_model:
      immutable_definition_catalog: internal_exam_definitions
      attempt_definition_binding_authority: internal_exam_attempts.internal_exam_definition_id_plus_definition_hash_snapshot
      ordered_question_evidence_authority: internal_exam_attempt_questions
      result_authority: internal_exam_results
      formal_document_artifact_authority: internal_exam_documents_plus_immutable_template_binding
      current_question_bank_after_attempt_start_is_history_authority: false
      current_scoring_policy_after_attempt_start_is_history_authority: false
      current_document_template_after_attempt_finish_is_history_authority: false
      result_screen_and_answer_sheet_read_same_evidence_bundle: true

    internal_exam_definitions:
      tenant_owned: false
      role: global_versioned_immutable_exam_engine_definition
      fields:
        - id_uuid_PK
        - driving_category_id_uuid_not_null_FK_global_dictionary
        - exam_part_varchar_16_not_null_theory_or_practical
        - language_code_varchar_16_not_null_FK_global_language_dictionary
        - engine_kind_varchar_32_not_null
        - definition_version_varchar_64_not_null
        - definition_schema_version_integer_not_null_check_gte_1
        - composition_snapshot_jsonb_not_null
        - scoring_policy_snapshot_jsonb_not_null
        - definition_content_hash_char64_not_null
        - published_at_timestamptz_not_null
        - retired_at_timestamptz_nullable
        - created_at_timestamptz_not_null
      engine_kind_values: [question_test, non_question_assessment]
      current_predicate: retired_at_is_null
      current_unique:
        type: partial_unique
        columns: [driving_category_id, exam_part, language_code, engine_kind]
        where: retired_at_is_null
      exact_attempt_target_candidate_key:
        columns: [id, driving_category_id, exam_part, language_code]
        unique_constraint_required: true
      definition_version_unique_scope: [driving_category_id, exam_part, language_code, definition_version]
      definition_content_hash_algorithm: SHA_256_over_canonical_serialization
      published_business_fields_immutable: true
      normal_retirement_sets_retired_at_once: true
      retired_definition_hard_delete_after_reference: forbidden
      reenable_retired_definition_in_place: forbidden
      later_definition_version_requires_new_row: true
      composition_snapshot_may_define_counts_sections_selection_rules_without_database_hardcoding_32: true
      scoring_policy_snapshot_may_define_max_points_and_pass_logic_without_database_hardcoding_74_or_threshold: true

    attempt_definition_binding_and_start_freeze:
      fields_added_or_finalized_on_attempt:
        - internal_exam_definition_id_uuid_nullable_before_start
        - exam_definition_version_snapshot_varchar_64_nullable_before_start
        - exam_definition_hash_snapshot_char64_nullable_before_start
        - evidence_schema_version_integer_nullable_before_start
        - question_set_hash_char64_nullable
      exact_definition_FK:
        source_columns: [internal_exam_definition_id, driving_category_id, exam_part, language_code]
        target_table: internal_exam_definitions
        target_columns: [id, driving_category_id, exam_part, language_code]
        match: MATCH_SIMPLE
        on_update: RESTRICT
        on_delete: RESTRICT
      before_start_all_definition_binding_fields_null: true
      after_start_definition_id_version_hash_and_evidence_schema_required: true
      definition_binding_write_once: true
      definition_selection_moment_core_v1: actual_exam_start_before_candidate_can_answer
      selection_reason: >-
        Existing sources do not prove that a remote link or pre-start Access freezes a question set.
        Start is the first formal execution moment and already is the consume-on-start atomic boundary,
        so selecting and freezing the current definition there is reproducible without inventing
        pre-start question exposure semantics.
      requires_current_definition_for_exact_category_part_language_and_expected_engine_kind: true
      selected_definition_locked_FOR_SHARE_until_start_commit: true
      concurrent_definition_retirement_has_deterministic_winner: true
      start_first_then_retirement_preserves_started_attempt_definition: true
      retirement_first_then_start_requires_new_current_definition_or_rejects: true
      later_definition_retirement_or_new_version_rebinds_started_attempt: false
      rerun_current_definition_for_finished_review_or_pdf: forbidden
      DB_EXAM_004_remote_start_lock_extension:
        order: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE, internal_exam_definition_FOR_SHARE, internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
        preserves_attempt_access_prefix: true
        preserves_reservation_inventory_suffix: true
      DB_EXAM_006_local_start_lock_extension:
        order: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE, internal_exam_definition_FOR_SHARE, target_exam_station_FOR_UPDATE, current_station_credential_FOR_SHARE, internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
        preserves_existing_relative_lock_order: true
      question_test_start_atomic_effects:
        - bind_exact_definition_id_version_and_hash
        - materialize_exact_ordered_attempt_question_rows_from_selected_definition_and_selection_engine
        - compute_and_store_question_set_hash
        - perform_existing_start_and_consume_transaction
      non_question_assessment_start_atomic_effects:
        - bind_exact_definition_id_version_and_hash
        - freeze_definition_evidence_without_inventing_question_rows
        - perform_existing_start_and_consume_transaction
      definition_or_question_materialization_failure_rolls_back_start_and_inventory_consume: true

    attempt_question_evidence:
      table: internal_exam_attempt_questions
      tenant_owned: true
      fields_added_or_finalized:
