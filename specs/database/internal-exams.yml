resolved_contracts:
  DB-EXAM-001:
    status: PASS
    title: same_tenant_and_exact_target_integrity
    severity: P1
    goal: >-
      Every formal InternalExam relation must be unable to connect tenant-owned
      resources from different organizations or to combine a Course, Student,
      Attempt, Access, StationSession, Result, Question or Document that does not
      belong to the exact intended parent relation.

    tenant_key_policy:
      organization_id_required_nonnull_on:
        - internal_exam_inventory_entries
        - internal_exam_attempts
        - internal_exam_reservations
        - internal_exam_accesses
        - exam_stations
        - internal_exam_station_sessions
        - internal_exam_attempt_questions
        - internal_exam_results
        - internal_exam_documents
      organization_id_client_authority: false
      tenant_key_source: active_membership_or_validated_parent
      organization_id_mutation_after_insert: forbidden_for_normal_domain_lifecycle
      relation_on_update: RESTRICT
      relation_on_delete: RESTRICT
      formal_history_destructive_cascade: forbidden

    candidate_keys_required:
      students:
        columns: [organization_id, id]
        source: DB4_4
      course_enrollments:
        columns: [organization_id, id]
        source: DB4_4
      course_enrollments_exact_student:
        columns: [organization_id, id, student_id]
        unique_constraint_required: true
        purpose: exact_formal_attempt_course_student_FK_target
      file_assets:
        columns: [organization_id, id]
        source: DB4_2_foundation
      internal_exam_inventory_entries:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_attempts:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_reservations:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_accesses:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_accesses_exact_attempt:
        columns: [organization_id, id, internal_exam_attempt_id]
        unique_constraint_required: true
        purpose: station_session_exact_access_attempt_FK_target
      exam_stations:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_station_sessions:
        columns: [organization_id, id]
        unique_constraint_required: true
      internal_exam_station_sessions_exact_attempt:
        columns: [organization_id, id, internal_exam_attempt_id]
        unique_constraint_required: true
        purpose: transfer_chain_same_attempt_FK_target

    attempt_relations:
      student_same_tenant:
        source_table: internal_exam_attempts
        source_columns: [organization_id, student_id]
        target_table: students
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      exact_course_student:
        source_table: internal_exam_attempts
        source_columns: [organization_id, course_enrollment_id, student_id]
        target_table: course_enrollments
        target_columns: [organization_id, id, student_id]
        nullable: false
        match: MATCH_SIMPLE
        effect: attempt_course_must_belong_to_exact_attempt_student
      driving_category_is_global_dictionary: true
      language_is_global_dictionary: true
      category_or_language_matching_course_or_capability: deferred_to_DB_EXAM_002

    reservation_relations:
      inventory_same_tenant:
        source_columns: [organization_id, internal_exam_inventory_entry_id]
        target_table: internal_exam_inventory_entries
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      lifecycle_equivalence_and_exactly_once_consumption: deferred_to_DB_EXAM_003

    access_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      optional_station_same_tenant:
        source_columns: [organization_id, station_id]
        target_table: exam_stations
        target_columns: [organization_id, id]
        nullable: true
        match: MATCH_SIMPLE
      station_required_or_forbidden_by_mode: deferred_to_DB_EXAM_004_and_DB_EXAM_006

    station_session_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      exact_access_attempt:
        source_columns: [organization_id, internal_exam_access_id, internal_exam_attempt_id]
        target_table: internal_exam_accesses
        target_columns: [organization_id, id, internal_exam_attempt_id]
        nullable: false
        match: MATCH_SIMPLE
        effect: station_session_cannot_pair_access_for_attempt_A_with_attempt_B
      station_same_tenant:
        source_columns: [organization_id, exam_station_id]
        target_table: exam_stations
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      transfer_same_tenant_same_attempt:
        source_columns: [organization_id, transferred_from_session_id, internal_exam_attempt_id]
        target_table: internal_exam_station_sessions
        target_columns: [organization_id, id, internal_exam_attempt_id]
        nullable: true
        match: MATCH_SIMPLE
        effect: transfer_reference_cannot_cross_tenant_or_switch_attempt
      created_by_user_is_global_identity: true
      created_by_user_fake_tenant_composite_FK: false
      active_station_uniqueness_and_failover_transition_rules: deferred_to_DB_EXAM_006

    attempt_question_relations:
      organization_id_addition_required: true
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      ordinal_unique_scope: [organization_id, internal_exam_attempt_id, ordinal]
      question_content_scoring_immutability: deferred_to_DB_EXAM_007

    result_relations:
      organization_id_addition_required: true
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      one_result_per_attempt_unique_scope: [organization_id, internal_exam_attempt_id]
      result_scoring_consistency_and_immutability: deferred_to_DB_EXAM_007

    document_relations:
      attempt_same_tenant:
        source_columns: [organization_id, internal_exam_attempt_id]
        target_table: internal_exam_attempts
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      asset_same_tenant:
        source_columns: [organization_id, asset_id]
        target_table: file_assets
        target_columns: [organization_id, id]
        nullable: false
        match: MATCH_SIMPLE
      asset_purpose_readiness_document_version_and_hash_policy: deferred_to_DB_EXAM_007

    commerce_boundary:
      internal_exam_inventory_source_order_item_same_tenant_relation: deferred_to_DB4_9
      reason: >-
        Current order_items lacks the finalized organization candidate key needed
        to prove the commerce tenant boundary. DB-EXAM-001 must not partially
        redesign purchase/payment/inventory grant provenance before DB4_9.

    migration_policy:
      precheck_attempt_course_student_exact_pair: required
      precheck_all_existing_tenant_owned_parent_child_organization_ids: required
      precheck_station_session_access_attempt_exact_pair: required
      precheck_station_transfer_same_attempt: required
      precheck_document_asset_same_tenant: required
      add_question_result_organization_id_by_exact_mandatory_attempt_parent: allowed_deterministic_backfill
      auto_reassign_attempt_to_different_student_or_course: forbidden
      auto_rewire_station_session_to_different_access_attempt_or_station: forbidden
      auto_reassign_inventory_reservation: forbidden
      auto_null_cross_tenant_document_asset: forbidden
      auto_guess_missing_parent_id: forbidden
      unresolved_mismatch: fail_and_require_reviewed_remediation

    required_tests:
      - attempt_cross_tenant_student_rejected
      - attempt_cross_tenant_course_rejected
      - attempt_same_org_wrong_student_course_pair_rejected
      - reservation_cross_tenant_inventory_rejected
      - reservation_cross_tenant_attempt_rejected
      - access_cross_tenant_attempt_rejected
      - access_nonnull_cross_tenant_station_rejected
      - access_null_station_still_allowed_structurally_before_mode_matrix_DB_EXAM_004_006
      - station_session_cross_tenant_attempt_rejected
      - station_session_cross_tenant_access_rejected
      - station_session_access_for_other_attempt_rejected_even_same_org
      - station_session_cross_tenant_station_rejected
      - station_session_transfer_cross_tenant_rejected
      - station_session_transfer_to_other_attempt_rejected_even_same_org
      - attempt_question_cross_tenant_attempt_rejected
      - duplicate_attempt_question_ordinal_same_attempt_rejected
      - result_cross_tenant_attempt_rejected
      - second_result_same_attempt_rejected
      - document_cross_tenant_attempt_rejected
      - document_cross_tenant_file_asset_rejected
      - global_user_actor_not_fake_tenant_scoped
      - driving_category_and_language_global_dictionaries_not_fake_tenant_scoped
      - migration_backfills_question_result_org_only_from_exact_attempt_parent
      - migration_fails_on_wrong_student_course_pair
      - migration_fails_on_station_session_access_attempt_mismatch
      - migration_fails_on_cross_tenant_document_asset
      - DB_EXAM_002_through_DB_EXAM_008_remain_open

blockers:
  - id: DB-EXAM-001
    title: same_tenant_and_exact_target_integrity
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-EXAM-001
    diagnosis:
      - current_blueprint_repeats_organization_student_course_attempt_inventory_access_station_identifiers_without_complete_composite_exact_target_boundaries
      - attempt_must_not_pair_a_course_with_the_wrong_student_inside_the_same_organization
      - reservation_access_station_session_result_question_and_document_children_must_not_cross_tenant_or_cross_attempt
      - station_session_must_not_pair_an_access_for_attempt_A_with_attempt_B
      - application_validation_is_not_a_sufficient_final_boundary_for_formal_exam_history
    risk:
      - cross_tenant_exam_access_or_document_exposure
      - exam_history_attached_to_wrong_student_course_or_attempt
      - station_session_or_inventory_effect_applied_to_wrong_attempt
    closure_scope_only:
      - candidate_keys_and_composite_same_tenant_exact_target_relations
      - nullable_relation_semantics
      - history_preserving_delete_policy
      - migration_prechecks_without_auto_reassignment

  - id: DB-EXAM-002
    title: formal_course_requirement_and_exam_capability_basis
    severity: P1
    status: OPEN
    diagnosis:
      - API_requires_exam_part_must_be_required_by_rule_engine_but_current_attempt_only_has_generic_requirement_basis_text
      - DB4_4_has_versioned_requirement_profiles_and_requirements_revision_but_attempt_does_not_yet_prove_which_exact_requirement_decision_authorized_the_part
      - category_exam_part_language_capability_must_be_consistent_with_the_selected_course_and_current_exam_capability_at_creation
      - later_course_requirement_changes_must_not_rewrite_or_retroactively_invalidate_historical_attempt_evidence_silently
      - theory_exempt_course_must_not_receive_a_new_formal_theory_attempt
    risk:
      - legally_or_formally_inapplicable_exam_part_generated
      - historical_attempt_has_no_reproducible_basis
      - category_or_language_drift_between_course_capability_and_attempt
    closure_scope_only:
      - exact_course_student_context
      - exact_requirement_revision_or_profile_basis
      - category_part_language_capability_validation
      - historical_basis_snapshot_and_later_requirement_change_semantics

  - id: DB-EXAM-003
    title: inventory_reservation_authority_and_consume_on_start_exactly_once
    severity: P1
    status: OPEN
    diagnosis:
      - own_design_names_exam_credit_ledger_as_source_of_truth_while_current_aggregate_models_concrete_inventory_rows_with_mutable_status
      - authority_between_unit_inventory_state_reservation_rows_and_ledger_or_adjustment_history_is_not_yet_unambiguous
      - create_attempt_reserves_exactly_one_unit_and_start_consumes_exactly_once_but_final_cross_row_equivalence_is_not_yet_closed
      - release_before_start_and_adjustment_after_start_require_distinct_auditable_effects
      - free_paid_adjustment_source_provenance_must_survive_without_turning_visible_available_count_into_authority
      - source_order_payment_grant_details_remain_DB4_9
    risk:
      - double_consumption_or_double_release
      - orphan_reserved_or_consumed_unit
      - hidden_manual_counter_correction
      - technical_abort_incorrectly_restores_consumed_credit
    closure_scope_only:
      - single_inventory_authority_model_reconciling_unit_rows_and_ledger_history
      - reservation_state_equivalence
      - consume_on_start_transaction_and_races
      - release_and_adjustment_exactly_once
      - derived_available_counts

  - id: DB-EXAM-004
    title: attempt_and_access_lifecycle_concurrency
    severity: P1
    status: OPEN
    diagnosis:
      - design_defines_closed_attempt_and_access_lifecycles_but_current_physical_blueprint_does_not_yet_prove_state_field_matrices_or_transition_guards
      - attempt_PATCH_is_before_start_only_and_has_If_Match_but_start_submit_abort_invalidate_and_access_revoke_expire_races_share_no_fully_defined_concurrency_root_contract
      - semantic_relationship_between_attempt_status_access_status_reservation_status_and_timestamps_is_not_closed
      - multiple_accesses_for_one_attempt_are_supported_by_API_but_current_active_access_cardinality_and_revoke_resend_semantics_are_not_physically_proven
      - submit_must_finish_once_and_must_not_consume_inventory_again
    risk:
      - started_attempt_with_prestart_access_state
      - revoked_or_expired_access_starting_successfully_in_a_race
      - submit_and_abort_both_committing_terminal_effects
      - duplicate_or_lost_attempt_versions
    closure_scope_only:
      - closed_status_catalogs_and_state_field_matrices
      - optimistic_concurrency_and_row_lock_order
      - access_attempt_reservation_final_state_invariants
      - start_submit_abort_invalidate_revoke_expire_race_tests

  - id: DB-EXAM-005
    title: exam_access_token_and_finished_result_token_security
    severity: P1
    status: OPEN
    diagnosis:
      - API_allows_examAccessToken_as_alternative_principal_for_start_submit_and_finished_result_review
      - current_access_row_has_one_token_hash_but_start_capability_and_post_finish_result_review_have_different_privilege_lifecycles
      - raw_token_nonpersistence_is_declared_but_token purpose scope expiry revocation rotation and replay boundaries_are_not_physically_closed
      - predictable_attempt_id_must_never_become_authority_for_remote_or_result_access
      - remote_send_resend_must_not_create_a_second_reservation_or_uncontrolled_second_start
    risk:
      - leaked_start_token_retains_excess_post_exam_privilege
      - result_token_can_start_or_mutate_exam
      - replay_or_parallel_start
      - cross_attempt_result_disclosure
    closure_scope_only:
      - purpose_scoped_opaque_token_model
      - hash_only_storage_and_one_way_verification
      - exact_attempt_binding
      - expiry_revocation_replay_and_post_finish_scope
      - separation_or_proven_equivalent_security_boundary_for_start_vs_result_access

  - id: DB-EXAM-006
    title: station_session_concurrency_device_binding_and_failover
    severity: P1
    status: OPEN
    diagnosis:
      - product_requires_one_active_attempt_per_station_and_supports_multiple_stations_per_OSK
      - current_station_session_partial_uniques_are_positive_but same_tenant exact_access_attempt_station_binding_and_station_eligibility_are_not_fully_closed
      - local_current_workstation_and_assigned_exam_station_need_a_clear_station identity_or_device_binding_boundary
      - failover_after_start_must_transfer_active_session_without_second_inventory_consumption_or_parallel_active_station_sessions
      - station_key_hash_and_status_exist_but lifecycle_authentication_and_disabled_offline_behavior_are_not_yet_proven
    risk:
      - one_attempt_active_on_two_stations
      - two_attempts_active_on_one_station
      - wrong_tenant_station_launch
      - failover consumes_second_credit_or_loses_active_attempt
    closure_scope_only:
      - station_identity_and_same_tenant_relations
      - active_station_session_uniqueness_and_exact_attempt_access_binding
      - local_start_and_failover_lock_order
      - station_disable_offline_and_recovery_semantics

  - id: DB-EXAM-007
    title: immutable_exam_definition_question_result_and_document_evidence
    severity: P1
    status: OPEN
    diagnosis:
      - observed_result_screen_question_review_and_answer_sheet_must_reconstruct_the_same_finished_attempt
      - current_question_snapshot_and_result_snapshot_are_too_generic_to_prove_exam_definition_version_question_media_version_scoring_threshold_and_document_template_lineage
      - finished_question_answer_scoring_rows_and_result_need_immutability_and consistency_guards
      - historical_result_must_not_be_recomputed_from_current_question_bank_or_current_scoring_rules
      - answer_sheet_regeneration_needs_deterministic_snapshot_and_document_version_hash_policy
      - administrative_correction_must_not_silently_overwrite_formal_history
    risk:
      - historical_PDF_or_result_changes_after_question_bank_update
      - score_result_mismatch
      - nonreproducible_formal_document
      - evidence_loss_through_in_place_edit
    closure_scope_only:
      - immutable_exam_definition_and_question_content_or_versioned_references
      - scoring_and_pass_threshold_snapshots
      - result_question_attempt_consistency
      - document_template_version_hash_and_file_asset_boundary
      - append_only_correction_or_invalidation_semantics

  - id: DB-EXAM-008
    title: deterministic_management_history_latest_and_statistics_projection
    severity: P1
    status: OPEN
    diagnosis:
      - management_panel_requires_latest_exam_attempt_count_pass_rate_passed_failed_status_filters_sorting_and_hide_finished
      - observed_attempts_can_share_the_same_displayed_minute_so_timestamp_alone_cannot_deterministically_select_latest
      - current_blueprint_has_no_explicit_per_course_or_per_student_attempt_sequence_or_other_closed_latest_order
      - UI_status_labels_such_as_no_assignment_not_conducted_passed_failed_are_projections_and_must_not_become_a_second_mutable_attempt_status_authority
      - counts_and_pass_rate_must_have_defined_inclusion_rules_for created in_progress technical_abort invalidated_and_finished_attempts
    risk:
      - nondeterministic_latest_row
      - inconsistent_pass_rate_and_counts
      - filter_sort_results_disagree_with_attempt_history
      - mutable_summary_drift
    closure_scope_only:
