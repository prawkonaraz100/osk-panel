        - ordinal
        - group
        - source_question_identifier
        - source_question_revision_identifier
        - question_snapshot_schema_version
        - question_snapshot
        - question_snapshot_hash
        - media_evidence_snapshot
        - max_points_snapshot
      question_snapshot_minimum_semantics_for_question_test:
        - rendered_question_text_or_versioned_exact_content
        - answer_type
        - ordered_answer_options
        - correct_answer_or_equivalent_evaluation_key
        - category_context
      question_snapshot_hash_algorithm: SHA_256_over_canonical_snapshot
      media_evidence_rule: >-
        Every rendered historical image/video must be reproducible from an immutable retained
        revision or an evidence reference containing a stable content hash. A mutable current URL
        without revision/hash is insufficient history evidence.
      live_current_media_or_question_row_lookup_required_for_finished_review: false
      question_set_hash_algorithm: SHA_256_over_ordered_ordinals_groups_question_hashes_and_max_points
      question_set_hash_matches_exact_attempt_question_rows_at_commit: true
      answer_and_scoring_fields_before_submit:
        candidate_answer: null
        is_correct: null
        points_awarded: null
      final_answer_and_scoring_fields_written_atomically_by_submit: true
      final_answer_and_scoring_fields_write_once: true
      unanswered_question_candidate_answer_may_be_null: true
      answered_at_nullable_for_unanswered: true
      points_awarded_when_final_required: true
      points_awarded_bounds: zero_to_max_points_snapshot
      direct_update_of_question_content_after_start: forbidden
      direct_update_of_final_answer_or_score_after_finish: forbidden

    scoring_and_result_consistency:
      result_fields_added_or_finalized:
        - evidence_schema_version_integer_not_null_check_gte_1
        - score_integer_nullable_by_engine_kind
        - max_score_integer_nullable_by_engine_kind
        - pass_threshold_snapshot_integer_nullable
        - passed_boolean_not_null_for_completed_result
        - scoring_policy_snapshot_jsonb_not_null
        - question_set_hash_char64_nullable
        - evidence_bundle_hash_char64_not_null
        - answer_sheet_template_binding_snapshot_jsonb_nullable
        - result_snapshot_jsonb_not_null
        - result_snapshot_hash_char64_not_null
        - created_at_timestamptz_not_null
      one_result_per_attempt_DB_EXAM_001_preserved: true
