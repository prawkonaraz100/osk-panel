      - DB_EXAM_001_DB_EXAM_002_DB_EXAM_003_preserved
      - DB_EXAM_005_through_DB_EXAM_008_remain_open

  DB-EXAM-005:
    status: PASS
    title: exam_access_token_and_finished_result_token_security
    severity: P1
    goal: >-
      Replace the ambiguous single Access token hash with purpose-scoped,
      nonrecoverable bearer-token history bound to the exact remote Access and
      Attempt, so execution privilege and finished-result read privilege cannot
      bleed into each other, replay, survive revocation, or authorize by ID alone.

    authority_model:
      canonical_token_table: internal_exam_access_tokens
      legacy_internal_exam_accesses_token_hash_is_canonical: false
      legacy_token_hash_final_aggregate_action: remove_or_non_authoritative_migration_only_after_reviewed_cutover
      bearer_tokens_allowed_only_for_mode: remote_link
      local_or_assigned_station_bearer_token_auth: forbidden
      station_authentication_and_device_binding: deferred_to_DB_EXAM_006
      purpose_values: [exam_execution, finished_result_read]
      arbitrary_scope_json_as_authority: false
      normal_token_row_hard_delete: forbidden
      token_history_preserved_after_rotation_revocation_or_expiry: true

    token_table:
      fields:
        - id_uuid_PK
        - organization_id_uuid_not_null
        - internal_exam_access_id_uuid_not_null
        - internal_exam_attempt_id_uuid_not_null
        - purpose_varchar_32_not_null
        - token_sequence_bigint_not_null_check_gte_1
        - lookup_id_uuid_not_null
        - secret_verifier_bytea_or_char64_not_null
        - verifier_key_version_integer_not_null_check_gte_1
        - issued_at_timestamptz_not_null
        - expires_at_timestamptz_not_null
        - revoked_at_timestamptz_nullable
        - revoke_reason_code_varchar_64_nullable
        - issued_by_user_id_uuid_nullable
        - created_at_timestamptz_not_null
      exact_access_attempt_FK:
        source_columns: [organization_id, internal_exam_access_id, internal_exam_attempt_id]
        target_table: internal_exam_accesses
        target_columns: [organization_id, id, internal_exam_attempt_id]
        on_update: RESTRICT
        on_delete: RESTRICT
      lookup_id_global_unique: true
      sequence_unique_scope: [organization_id, internal_exam_access_id, purpose, token_sequence]
      sequence_contiguous_from_one_under_access_lock: true
      one_current_nonrevoked_per_access_purpose:
        type: partial_unique
        columns: [organization_id, internal_exam_access_id, purpose]
        where: revoked_at_is_null
      immutable_after_insert:
        - organization_id
        - internal_exam_access_id
        - internal_exam_attempt_id
        - purpose
        - token_sequence
        - lookup_id
        - secret_verifier
        - verifier_key_version
        - issued_at
        - expires_at
      revocation_write_once: true
      revoked_at_nonnull_requires_reason_code: true
      issued_by_user_is_global_identity_not_fake_tenant_scoped: true

    secret_construction_and_storage:
      bearer_shape: opaque_random_locator_plus_high_entropy_secret_or_equivalent_single_opaque_token
      minimum_secret_entropy_bits: 256
      secret_source: CSPRNG
      lookup_id_is_secret_or_authority: false
      persisted_verifier: keyed_one_way_verifier_HMAC_SHA256_or_equivalent
      verifier_key_version_required: true
      verifier_key_or_pepper_storage: outside_database_security_key_management
      verifier_comparison: constant_time
      raw_secret_persisted_in_database: false
      raw_secret_persisted_as_reversible_ciphertext: false
      raw_secret_persisted_in_file_assets_or_object_storage: false
      raw_secret_in_audit_logs: forbidden
      raw_secret_in_outbox_messages: forbidden
      raw_secret_in_application_logs_or_traces: forbidden
      raw_secret_in_lifecycle_events: forbidden
      raw_secret_in_idempotency_safe_response_snapshot: forbidden
      attempt_or_access_or_lookup_id_alone_authenticates: false
      old_raw_secret_recovery_after_response_boundary: impossible_by_design

    verification_contract:
      sequence:
        - parse_opaque_token
        - resolve_token_row_by_random_lookup_id
        - derive_verifier_with_row_verifier_key_version
        - constant_time_compare_secret_verifier
        - require_expected_purpose
        - require_exact_request_access_and_attempt_binding
        - require_same_organization_binding
        - require_revoked_at_null
        - require_command_effective_at_lt_token_expires_at
        - acquire_DB_EXAM_004_attempt_then_access_locks
        - recheck_attempt_access_lifecycle_after_locks
      auth_by_predictable_attempt_id: forbidden
      auth_by_access_id: forbidden
      auth_by_lookup_id_without_secret: forbidden
      wrong_purpose_token_reuse: forbidden
      cross_attempt_token_reuse: forbidden
      cross_access_token_reuse: forbidden
      cross_tenant_token_reuse: forbidden
      exact_expiry_boundary_valid: false

