  DB-EXAM-003:
    status: PASS
    title: inventory_reservation_authority_and_consume_on_start_exactly_once
    severity: P1
    goal: >-
      Preserve concrete one-unit inventory allocation while making an append-only
      inventory ledger the canonical accounting history, so reservation, release,
      consume-on-start and elevated adjustment effects are exactly-once, race-safe,
      auditable and incapable of drifting into a mutable counter model.

    authority_model:
      canonical_inventory_accounting_history: internal_exam_inventory_ledger_entries
      inventory_entry_role: stable_one_unit_identity_provenance_and_current_operational_projection
      reservation_role: one_attempt_to_one_unit_allocation_history
      mutable_available_exam_counter_as_authority: forbidden
      inventory_entry_status_as_independent_authority: false
      reservation_status_as_independent_accounting_authority: false
      ledger_append_only: true
      ledger_normal_update_or_delete: forbidden
      final_state_equivalence_guard: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard
      current_available_projection_sources:
        canonical: SUM_internal_exam_inventory_ledger_entries.available_delta_per_organization_and_source_type
        operational_equivalent: COUNT_internal_exam_inventory_entries_where_current_state_available
      canonical_and_operational_available_projection_must_match_at_commit: true

    inventory_entry_model:
      one_row_represents_one_concrete_exam_unit: true
      source_type_values: [free, paid, adjustment]
      current_state_values: [available, reserved, consumed, adjusted_out]
      old_released_as_unit_state: forbidden_in_runtime
      reason_released_is_transition_not_current_state: true
      old_adjusted_as_ambiguous_unit_state: replaced_by_source_type_adjustment_or_current_state_adjusted_out
      fields_added_or_finalized:
        - current_state_varchar_32_not_null
        - source_adjustment_id_uuid_nullable
        - created_at_timestamptz_not_null
      source_order_item_id_same_tenant_commerce_boundary: deferred_to_DB4_9
      paid_grant_payment_confirmation_semantics: deferred_to_DB4_9
      source_type_or_source_reference_mutation_after_creation: forbidden
      consumed_unit_returns_to_available_by_normal_release: false
      consumed_unit_normal_update_to_available: forbidden
      adjusted_out_unit_returns_to_available_in_place: forbidden
      allocation_lock: internal_exam_inventory_entry_FOR_UPDATE

    reservation_model:
      status_values: [reserved, released, consumed]
      version: bigint_not_null_default_1_check_gte_1
      linkage_fields_immutable: [organization_id, internal_exam_inventory_entry_id, internal_exam_attempt_id, reserved_at]
      released_metadata:
        requires: [released_at]
        forbids: [consumed_at]
      consumed_metadata:
        requires: [consumed_at]
        forbids: [released_at]
      reserved_metadata:
        requires_null: [released_at, consumed_at]
      current_active_reservation_predicate: status_reserved
      one_active_reservation_per_inventory_entry:
        type: partial_unique
        columns: [organization_id, internal_exam_inventory_entry_id]
        where: status_reserved
      one_active_reservation_per_attempt:
        type: partial_unique
        columns: [organization_id, internal_exam_attempt_id]
        where: status_reserved
      one_consumed_reservation_per_attempt:
        type: partial_unique
        columns: [organization_id, internal_exam_attempt_id]
        where: status_consumed
      multiple_released_reservation_history_per_attempt_or_unit: allowed
      reservation_terminal_transition_reopened_in_place: forbidden
      exact_access_lifecycle_trigger_for_re_reservation_after_release: deferred_to_DB_EXAM_004

    ledger_model:
      table: internal_exam_inventory_ledger_entries
      tenant_owned: true
      fields:
        - id_uuid_PK
        - organization_id_uuid_not_null
        - internal_exam_inventory_entry_id_uuid_not_null
        - internal_exam_reservation_id_uuid_nullable
        - internal_exam_attempt_id_uuid_nullable
        - internal_exam_inventory_adjustment_id_uuid_nullable
        - event_sequence_bigint_not_null_check_gte_1
        - event_type_varchar_32_not_null
        - available_delta_smallint_not_null
        - actor_user_id_uuid_nullable
        - reason_text_nullable
        - occurred_at_timestamptz_not_null
        - created_at_timestamptz_not_null
      event_type_values_runtime:
        - unit_granted
        - unit_adjustment_granted
        - unit_reserved
        - unit_released
        - unit_consumed
        - unit_adjusted_out
      migration_only_event_type: migration_baseline
      runtime_insert_migration_baseline_after_cutover: forbidden
      exact_available_delta_by_event_type:
        unit_granted: 1
        unit_adjustment_granted: 1
        unit_reserved: -1
        unit_released: 1
        unit_consumed: 0
        unit_adjusted_out: -1
        migration_baseline: derived_from_proven_legacy_state_only
      event_sequence_unique_scope: [organization_id, internal_exam_inventory_entry_id, event_sequence]
      event_sequence_contiguous_from_one: true
      event_sequence_allocated_under_inventory_entry_lock: true
      reservation_event_exact_same_tenant_attempt_inventory_binding_required: true
      actor_user_is_global_identity_not_fake_tenant_scoped: true
      event_type_relation_matrix_database_enforced: true
      ledger_business_rows_immutable: true

    ledger_state_machine:
      initial_event_for_free_or_paid_unit: unit_granted
      initial_event_for_positive_adjustment_unit: unit_adjustment_granted
      available_to_reserved: unit_reserved
      reserved_to_available: unit_released
      reserved_to_consumed: unit_consumed
      available_to_adjusted_out: unit_adjusted_out
      event_after_unit_consumed: forbidden
      event_after_unit_adjusted_out: forbidden
      unit_reserved_event_requires_exact_reserved_reservation: true
      unit_released_event_requires_same_reservation_transition_reserved_to_released: true
      unit_consumed_event_requires_same_reservation_transition_reserved_to_consumed: true
      reserve_release_cycles_before_consumption: allowed_with_new_reservation_rows
      same_reservation_release_then_consume_or_consume_then_release: forbidden
      direct_current_state_change_without_matching_ledger_event: rejected_at_commit

    attempt_creation_and_reservation:
      API_operation: POST_/course-enrollments/{courseEnrollmentId}/internal-exam-attempts
      Stage3_contract: attempt_created_and_one_inventory_unit_reserved
      canonical_reservation_moment_core_v1: formal_attempt_creation
      older_design_wording_create_access_reserves_unit: superseded_for_formal_Stage3_flow
      access_creation_or_resend_allocates_second_unit: false
      idempotency_required: true
      existing_DB_EXAM_002_first_lock_prefix_preserved: [course_enrollment_FOR_UPDATE]
      inventory_candidate_selection:
        requires_same_organization: true
        requires_current_state_available: true
        requires_ledger_final_state_available: true
        lock_candidate_FOR_UPDATE: true
        SKIP_LOCKED_allowed_for_parallel_allocators: true
        hardcoded_free_before_paid_or_paid_before_free_priority: false
        source_priority_remains_explicit_product_allocation_policy_not_DB_integrity_rule: true
      atomic_effects:
        - create_internal_exam_attempt
        - create_reserved_reservation
        - append_unit_reserved_ledger_event
        - set_inventory_current_state_reserved
      failure_rolls_back_attempt_reservation_ledger_and_unit_state: true
      no_inventory_available: reject_without_orphan_attempt
      same_idempotency_key_retry_allocates_new_unit: false
      same_idempotency_key_retry_creates_second_reservation: false
      later_access_creation_may_assume_or_validate_existing_active_reservation_but_may_not_silently_double_allocate: true

    consume_on_start:
      canonical_policy_core_v1: consume_on_start
      other_design_policy_variants_enabled_in_core_v1: false
      start_inventory_lock_suffix_after_attempt_access_roots: [internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
      preconditions_after_lock:
        - reservation_status_reserved
        - inventory_current_state_reserved
        - reservation_and_inventory_match_exact_attempt
        - last_ledger_event_is_unit_reserved_for_same_reservation
      atomic_inventory_effects:
        - append_unit_consumed_ledger_event
        - set_reservation_status_consumed_and_consumed_at
        - increment_reservation_version_once
        - set_inventory_current_state_consumed
      attempt_in_progress_effect_must_commit_in_same_outer_start_transaction: true
      exact_attempt_access_state_matrix_and_started_at_rules: deferred_to_DB_EXAM_004
      station_effects_and_locking: deferred_to_DB_EXAM_006
      finish_or_submit_appends_second_consume_event: false
      technical_abort_after_start_appends_release_event: false
      consumed_unit_reusable_without_adjustment: false
      idempotency_retry_reapplies_consume: false
      two_parallel_start_requests_same_attempt_can_consume_two_units: false

    prestart_release:
      release_sources: [access_revoke, access_expire, attempt_cancel_or_other_prestart_terminal_flow_governed_by_DB_EXAM_004]
      exact_access_attempt_transition_eligibility: deferred_to_DB_EXAM_004
      inventory_lock_suffix: [internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
      require_reservation_reserved_and_inventory_reserved: true
      atomic_effects:
        - append_unit_released_ledger_event
        - set_reservation_status_released_and_released_at
        - increment_reservation_version_once
        - set_inventory_current_state_available
      release_consumed_reservation: forbidden
      release_same_reservation_twice: forbidden
      same_idempotency_key_retry_releases_again: false
      released_unit_may_be_reserved_later_for_another_or_reeligible_attempt: true
      old_reservation_history_reopened: false
      automatic_expiry_release_actor_may_be_system_null_with_reason_code: true

    start_vs_release_race:
      shared_lock_suffix: [internal_exam_reservation, internal_exam_inventory_entry]
      lock_order_may_not_be_reversed_by_DB_EXAM_004_or_DB_EXAM_005: true
      start_first_result: reservation_consumed_inventory_consumed_release_rejected
      release_first_result: reservation_released_inventory_available_start_rejected_until_any_future_valid_re_reservation
      both_terminal_effects_commit_for_same_reservation: false
      exactly_one_terminal_ledger_event_after_unit_reserved_for_same_reservation: true

    adjustment_model:
      table: internal_exam_inventory_adjustments
      purpose: elevated_append_only_inventory_correction_command_record
      tenant_owned: true
      fields:
        - id_uuid_PK
        - organization_id_uuid_not_null
        - delta_integer_not_null_nonzero
        - reason_text_not_null_nonblank
        - related_attempt_id_uuid_nullable
        - created_by_user_id_uuid_not_null
        - created_at_timestamptz_not_null
      related_attempt_same_tenant_composite_FK: true
      created_by_user_is_global_identity: true
      permission: exams.inventory.adjust
      elevated: true
      idempotency_required: true
      normal_update_or_delete: forbidden
      positive_delta:
        creates_exactly_abs_delta_new_inventory_units_source_type_adjustment: true
        each_new_unit_initial_state_available: true
        each_new_unit_links_source_adjustment_id: true
        each_new_unit_initial_ledger_event: unit_adjustment_granted
      negative_delta:
        may_select_only_currently_available_units: true
        reserved_or_consumed_unit_withdrawal: forbidden
        append_unit_adjusted_out_per_selected_unit: true
        set_selected_unit_current_state_adjusted_out: true
        insufficient_available_units: reject_whole_adjustment
      adjustment_final_state_guard:
        positive_delta_effect_count_equals_delta: true
        negative_delta_adjusted_out_event_count_equals_abs_delta: true
        type: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard
      all_units_in_one_adjustment_apply_all_or_none: true
      hardcoded_source_priority_for_negative_adjustment: false
      technical_abort_refund:
        mechanism: positive_adjustment_creates_new_compensating_unit
        original_consumed_inventory_entry_state_changed_back_to_available: false
        original_consumed_ledger_history_rewritten: false
        related_attempt_must_same_tenant_and_if_used_as_refund_have_consumed_reservation: true
      arbitrary_mutable_counter_delta_without_unit_and_ledger_effect: forbidden

    derived_inventory_projection:
      available_total: sum_available_delta_or_equivalent_guarded_count_current_state_available
      available_by_source_type: group_by_inventory_entry_source_type
      free_paid_adjustment_provenance_preserved: true
      UI_total_is_mutable_authority: false
      reserved_total: derived_from_current_reserved_reservations_or_units
      consumed_total: derived_from_unit_consumed_events_or_current_consumed_units
      direct_admin_edit_available_count: forbidden

    commerce_boundary:
      payment_order_to_paid_inventory_grant: deferred_to_DB4_9
      source_order_item_exact_same_tenant_relation: deferred_to_DB4_9
      purchase_webhook_idempotent_grant: deferred_to_DB4_9
      DB_EXAM_003_may_define_paid_unit_and_unit_granted_event_shape_but_not_payment_trigger: true

    migration_policy:
      old_unit_status_available_reserved_consumed_may_be_mapped_only_when_matching_reservation_timestamps_and_relations_prove_state: true
      old_unit_status_released_may_become_available_only_when_exact_released_reservation_and_no_later_active_or_consumed_reservation_are_proven: true
      old_unit_status_adjusted_auto_interpretation: forbidden_without_evidence
      reconstruct_ledger_sequence_from_ambiguous_timestamps_or_UUID_order: forbidden
      migration_baseline_allowed_only_for_reliably_proven_legacy_state: true
      migration_baseline_actor_or_reason_fabrication: forbidden
      paid_unit_payment_history_fabrication: forbidden
      unresolved_unit_reservation_or_adjustment_state: fail_and_require_reviewed_remediation
      runtime_migration_baseline_event_after_cutover: forbidden

    required_tests:
      - ledger_is_append_only_and_unit_status_is_not_independent_accounting_authority
      - available_count_ledger_projection_equals_guarded_available_unit_projection
      - create_attempt_reserves_exactly_one_unit_same_transaction
      - create_attempt_with_no_available_unit_rolls_back_attempt
      - same_create_idempotency_key_does_not_allocate_second_unit
      - two_concurrent_attempt_creates_cannot_reserve_same_unit
      - free_paid_selection_priority_not_hardcoded_as_database_invariant
      - one_active_reservation_per_inventory_entry_enforced
      - one_active_reservation_per_attempt_enforced
      - at_most_one_consumed_reservation_per_attempt_enforced
      - reservation_reserved_state_has_matching_unit_reserved_ledger_event
      - start_consumes_reserved_unit_exactly_once
      - start_updates_reservation_and_inventory_and_attempt_start_in_one_outer_transaction
      - two_parallel_start_requests_cannot_double_consume
      - submit_or_finish_does_not_consume_again
      - prestart_release_returns_same_unit_to_available_exactly_once
      - start_vs_release_has_one_winner
      - consumed_reservation_cannot_be_released
      - technical_abort_after_start_does_not_auto_restore_consumed_unit
      - technical_refund_uses_positive_adjustment_and_preserves_original_consumed_history
      - positive_adjustment_delta_N_creates_exactly_N_adjustment_units_and_events
      - negative_adjustment_delta_N_withdraws_exactly_N_available_units_or_rolls_back
      - negative_adjustment_cannot_withdraw_reserved_or_consumed_unit
      - adjustment_same_idempotency_key_does_not_apply_twice
      - visible_available_total_is_projection_not_mutable_counter
      - released_is_not_persisted_as_current_unit_state
      - source_type_adjustment_is_not_confused_with_adjusted_out_current_state
      - migration_does_not_guess_ambiguous_released_adjusted_or_ledger_order
      - DB_EXAM_004_through_DB_EXAM_008_remain_open

  DB-EXAM-004:
    status: PASS
    title: attempt_and_access_lifecycle_concurrency
    severity: P1
    goal: >-
      Make InternalExamAttempt the single lifecycle concurrency root and make
      every Access, Reservation and lifecycle timestamp agree with one closed,
      race-safe state machine, so start/revoke/expire/submit/technical-abort/
      invalidate and before-start edits cannot commit contradictory outcomes.

    authority_and_version_model:
      attempt_lifecycle_authority: internal_exam_attempts.status
      access_lifecycle_authority: internal_exam_accesses.status
      reservation_accounting_authority: DB_EXAM_003_ledger_plus_guarded_reservation_projection
      attempt_version: bigint_not_null_default_1_check_gte_1
      access_version: bigint_not_null_default_1_check_gte_1
      main_concurrency_root_for_attempt_affecting_commands: internal_exam_attempts_row_FOR_UPDATE
      access_local_state_is_not_independent_from_attempt: true
      business_status_inferred_only_from_timestamps: false
      normal_attempt_hard_delete: forbidden
      normal_access_hard_delete: forbidden
      command_effective_at_captured_once_per_mutation: true
      semantic_noop_increments_version: false

    attempt_status_catalog:
      values: [created, in_progress, passed, failed, technical_abort, invalidated]
      transition_matrix:
        created: [in_progress]
        in_progress: [passed, failed, technical_abort, invalidated]
        passed: [invalidated]
        failed: [invalidated]
        technical_abort: [invalidated]
        invalidated: []
      prestart_attempt_cancelled_state_added: false
      prestart_access_cancel_revoke_or_expire_leaves_attempt_created: true
      repeat_exam_reopens_terminal_attempt: false
      repeat_exam_requires_new_attempt: true

    attempt_fields_and_matrix:
      fields_added_or_finalized:
        - status_varchar_32_not_null
        - version_bigint_not_null_default_1_check_gte_1
        - started_at_timestamptz_nullable
        - finished_at_timestamptz_nullable
        - technical_aborted_at_timestamptz_nullable
        - invalidated_at_timestamptz_nullable
      created:
        requires_null: [started_at, finished_at, technical_aborted_at, invalidated_at]
      in_progress:
        requires_nonnull: [started_at]
        requires_null: [finished_at, technical_aborted_at, invalidated_at]
      passed_or_failed:
        requires_nonnull: [started_at, finished_at]
        requires_null: [technical_aborted_at, invalidated_at]
        finished_at_gte_started_at: true
      technical_abort:
        requires_nonnull: [started_at, finished_at, technical_aborted_at]
        requires_null: [invalidated_at]
        technical_aborted_at_equals_finished_at: true
      invalidated:
        requires_nonnull: [started_at, finished_at, invalidated_at]
        invalidated_at_gte_finished_at: true
        technical_aborted_at_may_remain_nonnull_only_when_invalidation_source_was_technical_abort: true
      started_at_set_exactly_once: true
      finished_at_set_exactly_once_when_first_execution_terminal_state_is_entered: true
      passed_failed_finished_at_not_rewritten_by_later_invalidation: true
      technical_abort_finished_at_not_rewritten_by_later_invalidation: true
      invalidation_from_in_progress_sets_finished_at_equal_invalidated_at: true

    access_status_catalog:
      values: [draft, ready, delivered_or_assigned, opened, started, completed, cancelled, expired, revoked, technical_abort, invalidated]
      prestart_nonterminal: [draft, ready, delivered_or_assigned, opened]
      startable: [ready, delivered_or_assigned, opened]
      poststart_nonterminal: [started]
      terminal_prestart: [cancelled, expired, revoked]
      terminal_poststart: [completed, technical_abort, invalidated]
      normal_reopen_terminal_access_in_place: forbidden
      station_or_mode_rebind_after_terminal_prestart_access: create_new_access_row

    access_fields_and_matrix:
      fields_added_or_finalized:
        - version_bigint_not_null_default_1_check_gte_1
        - ready_at_timestamptz_nullable
        - delivered_or_assigned_at_timestamptz_nullable
        - opened_at_timestamptz_nullable
        - started_at_timestamptz_nullable
        - completed_at_timestamptz_nullable
        - cancelled_at_timestamptz_nullable
        - expired_at_timestamptz_nullable
        - revoked_at_timestamptz_nullable
        - technical_aborted_at_timestamptz_nullable
        - invalidated_at_timestamptz_nullable
      draft:
        requires_null: [ready_at, delivered_or_assigned_at, opened_at, started_at, completed_at, cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      ready:
        requires_nonnull: [ready_at]
        requires_null: [started_at, completed_at, cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      delivered_or_assigned:
        requires_nonnull: [ready_at, delivered_or_assigned_at]
        requires_null: [started_at, completed_at, cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      opened:
        mode_must_equal: remote_link
        requires_nonnull: [ready_at, opened_at]
        requires_null: [started_at, completed_at, cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      started:
        requires_nonnull: [started_at]
        requires_null: [completed_at, cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      completed:
        requires_nonnull: [started_at, completed_at]
        requires_null: [cancelled_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      cancelled:
        requires_nonnull: [cancelled_at]
        requires_null: [started_at, completed_at, expired_at, revoked_at, technical_aborted_at, invalidated_at]
      expired:
        requires_nonnull: [expired_at]
        requires_null: [started_at, completed_at, cancelled_at, revoked_at, technical_aborted_at, invalidated_at]
      revoked:
        requires_nonnull: [revoked_at]
        requires_null: [started_at, completed_at, cancelled_at, expired_at, technical_aborted_at, invalidated_at]
      technical_abort:
        requires_nonnull: [started_at, technical_aborted_at]
        requires_null: [cancelled_at, expired_at, revoked_at, invalidated_at]
      invalidated:
        requires_nonnull: [started_at, invalidated_at]
        prior_completed_at_or_technical_aborted_at_may_remain_as_history: true
        prestart_terminal_timestamp_may_be_nonnull: false
      timestamp_columns_once_nonnull_are_immutable: true

    launch_mode_matrix:
      remote_link:
        station_id: MUST_BE_NULL
        expires_at: REQUIRED
        opened_state_allowed: true
      local_current_workstation:
        station_id: REQUIRED_SERVER_RESOLVED
        expires_at: MUST_BE_NULL
        opened_state_allowed: false
      assigned_exam_station:
        station_id: REQUIRED
        expires_at: MUST_BE_NULL
        opened_state_allowed: false
      mode_and_station_id_immutable_per_access: true
      station_identity_device_binding_availability_and_failover: deferred_to_DB_EXAM_006

    access_cardinality:
      one_nonterminal_access_per_attempt:
        type: partial_unique
        columns: [organization_id, internal_exam_attempt_id]
        where: status_in_draft_ready_delivered_or_assigned_opened_started
      one_ever_started_access_per_attempt:
        type: partial_unique
        columns: [organization_id, internal_exam_attempt_id]
        where: started_at_is_not_null
      multiple_terminal_prestart_access_history_per_attempt: allowed
      resend_remote_link_creates_new_access_row: false
      resend_remote_link_creates_new_reservation: false
      access_create_when_nonterminal_access_exists: conflict_unless_same_idempotency_retry
      access_create_when_attempt_not_created: forbidden

    lifecycle_history:
      attempt_table: internal_exam_attempt_lifecycle_events
      access_table: internal_exam_access_lifecycle_events
      append_only: true
      normal_update_or_delete: forbidden
      attempt_event_fields:
        - id_uuid_PK
        - organization_id_uuid_not_null
        - internal_exam_attempt_id_uuid_not_null
        - event_type_varchar_48_not_null
        - from_status_varchar_32_nullable
        - to_status_varchar_32_not_null
        - version_before_bigint_nullable
        - version_after_bigint_not_null_check_gte_1
        - actor_user_id_uuid_nullable
        - reason_text_nullable
        - occurred_at_timestamptz_not_null
        - created_at_timestamptz_not_null
      access_event_fields:
        - id_uuid_PK
        - organization_id_uuid_not_null
        - internal_exam_access_id_uuid_not_null
        - internal_exam_attempt_id_uuid_not_null
        - event_type_varchar_48_not_null
        - from_status_varchar_32_nullable
        - to_status_varchar_32_not_null
        - version_before_bigint_nullable
        - version_after_bigint_not_null_check_gte_1
        - actor_user_id_uuid_nullable
        - reason_text_nullable
        - occurred_at_timestamptz_not_null
        - created_at_timestamptz_not_null
      same_tenant_exact_parent_FKs_required: true
      one_attempt_event_per_material_version:
        unique_scope: [organization_id, internal_exam_attempt_id, version_after]
      one_access_event_per_material_version:
        unique_scope: [organization_id, internal_exam_access_id, version_after]
      normal_version_step: version_after_equals_version_before_plus_1
      creation_event_version_before: null
      creation_event_version_after: 1
      current_row_version_and_status_must_match_latest_event: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard
      lifecycle_event_payload_must_not_store_raw_access_token: true
      lifecycle_event_payload_must_not_copy_PESEL_or_PKK: true
      final_audit_outbox_shape: deferred_to_DB4_10

    candidate_snapshot_PATCH:
      API_operation: PATCH_/internal-exam-attempts/{attemptId}
      concurrency: If_Match_expected_attempt_version_required
      lock_order: [internal_exam_attempt_FOR_UPDATE]
      requires_attempt_status: created
      requires_started_at_null: true
      allowed_material_field: candidate_snapshot_only
      immutable_fields_include: [organization_id, student_id, course_enrollment_id, exam_part, driving_category_id, language_code, training_requirement_profile_id, requirements_revision, internal_exam_capability_id, requirement_basis_snapshot]
      successful_material_change_increments_attempt_version_once: true
      append_attempt_lifecycle_event: candidate_snapshot_updated
      two_PATCHes_same_expected_version_at_most_one_commit: true
      PATCH_after_start_or_terminal: forbidden
      old_sensitive_candidate_snapshot_copied_into_lifecycle_event: false

    existing_attempt_basis_after_later_rule_change:
      creation_time_basis_remains_historical_authority_for_existing_attempt: true
      later_requirement_profile_supersession_alone_blocks_existing_attempt_access_or_start: false
      later_capability_retirement_alone_blocks_existing_attempt_access_or_start: false
      rerun_current_rule_engine_on_access_create_or_start: false
      rewrite_attempt_basis_to_current_profile_or_capability: forbidden
      explicit_lifecycle_invalidation_remains_separate_command: true
      reason: >-
        DB-EXAM-002 explicitly preserves already-created Attempt history when the
        current requirement profile or capability later changes. DB-EXAM-004 does
        not invent a silent second eligibility decision at Access creation or Start.

    access_create_and_replacement:
      API_operation: POST_/internal-exam-attempts/{attemptId}/accesses
      idempotency_required: true
      lock_prefix: [internal_exam_attempt_FOR_UPDATE]
      requires_attempt_status: created
      requires_zero_nonterminal_access: true
      if_existing_reserved_reservation_for_attempt: reuse_exact_same_reservation_without_new_ledger_effect
      if_no_reserved_and_no_consumed_reservation_after_prior_prestart_release:
        allocate_new_inventory_unit_and_new_reservation_using_DB_EXAM_003
      if_consumed_reservation_exists: reject
      replacement_re_reservation_atomic_with_new_access_creation: true
      no_inventory_available_rolls_back_new_access_and_re_reservation: true
      old_released_reservation_row_reopened: false
      same_idempotency_retry_allocates_second_unit_or_access: false
      initial_remote_link_status: ready
      initial_local_or_assigned_station_status: delivered_or_assigned
      initial_access_version: 1
      append_creation_lifecycle_event: true

    remote_send_resend_and_open:
      send_operation: POST_/internal-exam-accesses/{accessId}/send
      send_idempotency_required: true
      lock_order: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE]
      send_requires_attempt_created: true
      send_mode_requires_remote_link: true
      send_for_expired_revoked_cancelled_started_or_terminal_access: forbidden
      first_send_transition: ready_to_delivered_or_assigned
      resend_from_delivered_or_assigned_or_opened_regresses_status: false
      resend_creates_new_access_or_reservation: false
      raw_token_rotation_scope: deferred_to_DB_EXAM_005
      outbox_delivery_exact_shape: deferred_to_DB4_10
      opened_transition:
        mode: remote_link_only
        allowed_from: [ready, delivered_or_assigned]
        target: opened
        inventory_effect: none
        reservation_effect: none

    shared_attempt_access_lock_order:
      canonical_prefix: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE]
      inventory_suffix_when_reservation_changes: [internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
      full_start_revoke_expire_cancel_prefix_and_suffix: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE, internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
      DB_EXAM_003_inventory_suffix_order_preserved: true
      station_lock_extension: deferred_to_DB_EXAM_006
      token_verification_and_scope: deferred_to_DB_EXAM_005
      all_state_preconditions_rechecked_after_locks: true

    start_command:
      API_operation: POST_/internal-exam-accesses/{accessId}/start
      idempotency_required: true
      requires_attempt_status: created
      requires_access_status_in: [ready, delivered_or_assigned, opened]
      requires_exact_reserved_reservation: true
      remote_requires_command_effective_at_lt_expires_at: true
      exact_expiry_boundary_start_allowed: false
      atomic_effects:
        - consume_inventory_exactly_once_via_DB_EXAM_003
        - reservation_reserved_to_consumed
        - attempt_created_to_in_progress
        - set_attempt_started_at_once
        - increment_attempt_version_once
        - access_prestart_to_started
        - set_access_started_at_equal_attempt_started_at
        - increment_access_version_once
        - append_attempt_and_access_lifecycle_events
      station_effects: deferred_to_DB_EXAM_006
      same_idempotency_retry_reconsumes_or_reincrements_versions: false
      new_start_request_after_attempt_started: reject_without_new_effect
      two_parallel_start_requests: at_most_one_material_start

    prestart_access_terminal_commands:
      revoke:
        API_operation: POST_/internal-exam-accesses/{accessId}/revoke
        source_statuses: [draft, ready, delivered_or_assigned, opened]
        target_status: revoked
        actor: authorized_user
      expire:
        source_statuses: [draft, ready, delivered_or_assigned, opened]
        target_status: expired
        command_effective_at_must_be_gte_expires_at: true
        remote_link_only: true
        actor_may_be_system: true
      cancel:
        source_statuses: [draft, ready, delivered_or_assigned, opened]
        target_status: cancelled
        purpose: explicit_prestart_local_or_domain_cancellation_without_adding_attempt_cancelled_state
      common:
        idempotency_required: true
        lock_order: [internal_exam_attempt_FOR_UPDATE, internal_exam_access_FOR_UPDATE, internal_exam_reservation_FOR_UPDATE, internal_exam_inventory_entry_FOR_UPDATE]
        requires_attempt_status: created
        requires_exact_reserved_reservation: true
        atomic_effects:
          - transition_access_terminal_prestart
          - set_exact_terminal_timestamp
          - increment_access_version_once
          - append_access_lifecycle_event
          - release_reservation_and_inventory_exactly_once_via_DB_EXAM_003
        attempt_status_after_commit: created
        attempt_version_increment_for_access_only_terminal_transition: false
        consumed_reservation_release: forbidden

    start_vs_revoke_or_expire_race:
      same_concurrency_root_and_lock_order: true
      start_first: attempt_in_progress_access_started_reservation_consumed_then_revoke_or_expire_rejected
      revoke_or_expire_first: attempt_created_access_terminal_prestart_reservation_released_then_start_rejected
      remote_effective_at_equal_expires_at: start_rejected_expire_eligible
      both_start_and_prestart_terminal_effect_for_same_access_commit: false

    submit_command:
      API_operation: POST_/internal-exam-attempts/{attemptId}/submit
      idempotency_required: true
      lock_order: [internal_exam_attempt_FOR_UPDATE, exact_started_access_FOR_UPDATE]
      requires_attempt_status: in_progress
      requires_access_status: started
      requires_exact_consumed_reservation: true
      result_pass_fail_decision_source: exam_engine_subject_to_DB_EXAM_007_scoring_consistency
      atomic_effects:
        - persist_exactly_one_result_and_finished_evidence_subject_to_DB_EXAM_007
        - attempt_in_progress_to_passed_or_failed
        - set_attempt_finished_at_once
        - increment_attempt_version_once
        - access_started_to_completed
        - set_access_completed_at_equal_attempt_finished_at
        - increment_access_version_once
        - append_attempt_and_access_lifecycle_events
      inventory_or_reservation_transition: none
      second_consumption_on_submit: forbidden
      retry_after_success_rewrites_result_or_versions: false
      second_distinct_submit_after_terminal: reject

    technical_abort_command:
      API_operation: POST_/internal-exam-attempts/{attemptId}/technical-abort
      idempotency_required: true
      reason_required_nonblank: true
      lock_order: [internal_exam_attempt_FOR_UPDATE, exact_started_access_FOR_UPDATE]
      requires_attempt_status: in_progress
      requires_access_status: started
      requires_exact_consumed_reservation: true
      atomic_effects:
        - attempt_in_progress_to_technical_abort
        - set_finished_at_and_technical_aborted_at_same_command_effective_at
        - increment_attempt_version_once
        - access_started_to_technical_abort
        - set_access_technical_aborted_at_same_command_effective_at
        - increment_access_version_once
        - append_attempt_and_access_lifecycle_events
      inventory_or_reservation_transition: none
      auto_restore_inventory: false
      retry_after_success_increments_or_aborts_again: false

    invalidate_command:
      permission: exams.attempt.invalidate
      public_Stage3_endpoint_present: false
      Stage5_API_contract_sync_required: true
      idempotency_required: true
      expected_attempt_version_required: true
      reason_required_nonblank: true
      allowed_source_statuses: [in_progress, passed, failed, technical_abort]
      source_created_allowed: false
      lock_order: [internal_exam_attempt_FOR_UPDATE, exact_ever_started_access_FOR_UPDATE]
      atomic_effects:
        - set_attempt_status_invalidated
        - set_attempt_invalidated_at_once
        - if_source_in_progress_set_finished_at_equal_invalidated_at
        - preserve_prior_finished_at_for_passed_failed_or_technical_abort
        - increment_attempt_version_once
        - set_ever_started_access_status_invalidated
        - set_access_invalidated_at_once
        - preserve_prior_access_completed_or_technical_abort_timestamp
        - increment_access_version_once
        - append_attempt_and_access_lifecycle_events
      result_question_document_rows_deleted_or_rewritten: false
      exact_evidence_correction_immutability: deferred_to_DB_EXAM_007
      inventory_or_reservation_transition: none
      consumed_inventory_restored: false
      stale_expected_version_after_submit_abort_or_other_invalidation: conflict_without_rebase

    terminal_races:
      submit_vs_technical_abort:
        both_require_in_progress_under_attempt_lock: true
        exactly_one_first_execution_terminal_transition_commits: true
        loser_rechecks_and_rejects_without_effect: true
      submit_vs_invalidate_from_in_progress:
        invalidate_expected_version_prevents_silent_rebase_onto_passed_or_failed: true
        exactly_one_command_against_same_observed_attempt_version_commits: true
      technical_abort_vs_invalidate_from_in_progress:
        invalidate_expected_version_prevents_silent_rebase_onto_technical_abort: true
        exactly_one_command_against_same_observed_attempt_version_commits: true
      deliberate_postfinish_invalidation:
        allowed_after_refetch_with_current_expected_version: true
        creates_new_material_version_and_history_event: true
      terminal_attempt_reopened_to_in_progress: forbidden

    final_state_equivalence:
      guard: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard
      created:
        consumed_reservation_count: 0
        reserved_reservation_count: zero_or_one
        ever_started_access_count: 0
        nonterminal_access_count: zero_or_one
        nonterminal_access_requires_reserved_reservation: true
      in_progress:
        consumed_reservation_count: 1
        reserved_reservation_count: 0
        ever_started_access_count: 1
        exact_started_access_status: started
        access_started_at_equals_attempt_started_at: true
      passed_or_failed:
        consumed_reservation_count: 1
        reserved_reservation_count: 0
        ever_started_access_count: 1
        exact_started_access_status: completed
        access_completed_at_equals_attempt_finished_at: true
        exact_result_count: 1
      technical_abort:
        consumed_reservation_count: 1
        reserved_reservation_count: 0
        ever_started_access_count: 1
        exact_started_access_status: technical_abort
      invalidated:
        consumed_reservation_count: 1
        reserved_reservation_count: 0
        ever_started_access_count: 1
        exact_started_access_status: invalidated
      terminal_prestart_access_with_attempt_created:
        may_have_zero_reserved_reservation_after_release: true
        old_released_reservation_history_preserved: true
      direct_cross_row_status_edit_without_matching_command_effects: rejected_at_commit

    migration_policy:
      closed_status_mapping_requires_exact_evidence: true
      unknown_or_ambiguous_attempt_status: fail_and_require_reviewed_remediation
      unknown_or_ambiguous_access_status: fail_and_require_reviewed_remediation
      timestamp_or_UUID_order_used_to_guess_current_access: forbidden
      multiple_nonterminal_accesses_auto_pick_winner: forbidden
      multiple_started_accesses_auto_pick_winner: forbidden
      terminal_attempt_missing_started_or_finished_evidence_auto_fabrication: forbidden
      revoked_or_expired_access_with_consumed_reservation_auto_rewrite: forbidden
      lifecycle_transition_history_reconstruction_from_ambiguous_timestamps: forbidden
      migration_baseline_event_allowed_for_proven_current_row_state: true
      migration_baseline_may_start_at_current_row_version_without_fabricating_prior_events: true
      migration_baseline_actor_reason_or_sensitive_snapshot_fabrication: forbidden
      runtime_migration_baseline_event_after_cutover: forbidden
      unresolved_attempt_access_reservation_matrix: fail_and_require_reviewed_remediation

    required_tests:
      - attempt_status_catalog_is_closed
      - access_status_catalog_is_closed
      - attempt_state_timestamp_matrix_rejects_contradictions
      - access_state_timestamp_matrix_rejects_contradictions
      - attempt_version_and_lifecycle_event_pair_one_material_change
      - access_version_and_lifecycle_event_pair_one_material_change
      - lifecycle_events_append_only_and_match_current_row_version_state
      - candidate_PATCH_requires_created_before_start_and_current_If_Match
      - two_candidate_PATCHes_same_If_Match_at_most_one_commit
      - candidate_PATCH_cannot_change_course_category_language_requirement_or_capability_basis
      - candidate_PATCH_after_start_rejected
      - later_requirement_profile_supersession_does_not_rewrite_or_silently_block_existing_attempt
      - later_capability_retirement_does_not_rewrite_or_silently_block_existing_attempt
      - one_nonterminal_access_per_attempt_enforced
      - at_most_one_access_ever_started_per_attempt_enforced
      - remote_access_requires_null_station_and_expiry
      - local_access_requires_server_resolved_station_and_no_expiry
      - assigned_station_access_requires_station_and_no_expiry
      - access_mode_or_station_rebind_in_place_rejected
      - remote_resend_reuses_same_access_and_reservation
      - access_create_with_existing_nonterminal_access_rejected
      - replacement_access_after_prestart_release_creates_new_reservation_atomically
      - replacement_access_no_inventory_rolls_back_access_creation
      - old_released_reservation_is_not_reopened
      - start_requires_attempt_created_access_startable_and_reserved_reservation
      - remote_start_at_or_after_expiry_rejected
      - start_sets_attempt_and_access_started_at_same_effective_time
      - start_increments_attempt_and_access_versions_once
      - start_retry_does_not_reconsume_or_reincrement
      - revoke_before_start_releases_exactly_once_and_leaves_attempt_created
      - expire_before_start_releases_exactly_once_and_leaves_attempt_created
      - cancel_before_start_releases_exactly_once_and_leaves_attempt_created
      - start_vs_revoke_has_one_winner
      - start_vs_expire_has_one_winner_with_exact_expiry_boundary_fail_closed
      - submit_requires_in_progress_started_access_and_consumed_reservation
      - submit_transitions_attempt_and_access_once_without_inventory_effect
      - submit_retry_does_not_create_second_result_or_increment_versions
      - submit_vs_technical_abort_has_one_first_terminal_winner
      - technical_abort_keeps_consumed_inventory_and_sets_matching_terminal_state
      - invalidate_requires_permission_reason_expected_version_and_poststart_attempt
      - concurrent_invalidate_does_not_silently_rebase_after_submit_or_abort
      - deliberate_postfinish_invalidate_requires_refetched_current_version
      - invalidate_preserves_result_question_document_rows_for_DB_EXAM_007
      - terminal_attempt_cannot_reopen_or_restart_same_attempt
      - created_attempt_with_terminal_prestart_access_may_have_zero_reserved_reservation
      - in_progress_and_terminal_attempt_access_reservation_final_state_guard_enforced
      - migration_does_not_guess_access_winner_status_or_transition_order
      - DB_EXAM_001_DB_EXAM_002_DB_EXAM_003_preserved
      - DB_EXAM_005_through_DB_EXAM_008_remain_open

blockers:
  - id: DB-EXAM-001
    title: same_tenant_and_exact_target_integrity
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-EXAM-001
    diagnosis:
      - current_blueprint_repeats_organization_student_course_attempt_inventory_access_station_identifiers_without_complete_composite_exact_target_boundaries
      - attempt_must_not_pair_a_course_with_the_wrong_student_inside_the_same_organization
      - reservation_access_station_session_result_question_and_document_children_must_not_cross_tenant_or_cross_attempt
      - station_session_must_not_pair_an_access_for_attempt_A_with_attempt_B
      - application_validation_is_not_a_sufficient_final_boundary_for_formal_exam_history
    risk:
      - cross_tenant_exam_access_or_document_exposure
      - exam_history_attached_to_wrong_student_course_or_attempt
      - station_session_or_inventory_effect_applied_to_wrong_attempt
    closure_scope_only:
      - candidate_keys_and_composite_same_tenant_exact_target_relations
      - nullable_relation_semantics
      - history_preserving_delete_policy
      - migration_prechecks_without_auto_reassignment

  - id: DB-EXAM-002
    title: formal_course_requirement_and_exam_capability_basis
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-EXAM-002
    diagnosis:
      - API_requires_exam_part_must_be_required_by_rule_engine_but_current_attempt_only_has_generic_requirement_basis_text
      - DB4_4_has_versioned_requirement_profiles_and_requirements_revision_but_attempt_does_not_yet_prove_which_exact_requirement_decision_authorized_the_part
      - category_exam_part_language_capability_must_be_consistent_with_the_selected_course_and_current_exam_capability_at_creation
      - later_course_requirement_changes_must_not_rewrite_or_retroactively_invalidate_historical_attempt_evidence_silently
      - theory_exempt_course_must_not_receive_a_new_formal_theory_attempt
    risk:
      - legally_or_formally_inapplicable_exam_part_generated
      - historical_attempt_has_no_reproducible_basis
      - category_or_language_drift_between_course_capability_and_attempt
    closure_scope_only:
      - exact_course_student_context
      - exact_requirement_revision_or_profile_basis
      - category_part_language_capability_validation
      - historical_basis_snapshot_and_later_requirement_change_semantics

  - id: DB-EXAM-003
    title: inventory_reservation_authority_and_consume_on_start_exactly_once
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-EXAM-003
    diagnosis:
      - own_design_names_exam_credit_ledger_as_source_of_truth_while_current_aggregate_models_concrete_inventory_rows_with_mutable_status
      - authority_between_unit_inventory_state_reservation_rows_and_ledger_or_adjustment_history_is_not_yet_unambiguous
      - create_attempt_reserves_exactly_one_unit_and_start_consumes_exactly_once_but_final_cross_row_equivalence_is_not_yet_closed
      - release_before_start_and_adjustment_after_start_require_distinct_auditable_effects
      - free_paid_adjustment_source_provenance_must_survive_without_turning_visible_available_count_into_authority
      - source_order_payment_grant_details_remain_DB4_9
    risk:
      - double_consumption_or_double_release
      - orphan_reserved_or_consumed_unit
      - hidden_manual_counter_correction
      - technical_abort_incorrectly_restores_consumed_credit
    closure_scope_only:
      - single_inventory_authority_model_reconciling_unit_rows_and_ledger_history
      - reservation_state_equivalence
      - consume_on_start_transaction_and_races
      - release_and_adjustment_exactly_once
      - derived_available_counts

  - id: DB-EXAM-004
    title: attempt_and_access_lifecycle_concurrency
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-EXAM-004
    diagnosis:
      - design_defines_closed_attempt_and_access_lifecycles_but_current_physical_blueprint_does_not_yet_prove_state_field_matrices_or_transition_guards
      - attempt_PATCH_is_before_start_only_and_has_If_Match_but_start_submit_abort_invalidate_and_access_revoke_expire_races_share_no_fully_defined_concurrency_root_contract
      - semantic_relationship_between_attempt_status_access_status_reservation_status_and_timestamps_is_not_closed
      - multiple_accesses_for_one_attempt_are_supported_by_API_but_current_active_access_cardinality_and_revoke_resend_semantics_are_not_physically_proven
      - submit_must_finish_once_and_must_not_consume_inventory_again
    risk:
