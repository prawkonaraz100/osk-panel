      - access_version_and_lifecycle_event_pair_one_material_change
      - lifecycle_events_append_only_and_match_current_row_version_state
      - candidate_PATCH_requires_created_before_start_and_current_If_Match
      - two_candidate_PATCHes_same_If_Match_at_most_one_commit
      - candidate_PATCH_cannot_change_course_category_language_requirement_or_capability_basis
      - candidate_PATCH_after_start_rejected
      - later_requirement_profile_supersession_does_not_rewrite_or_silently_block_existing_attempt
      - later_capability_retirement_does_not_rewrite_or_silently_block_existing_attempt
      - one_nonterminal_access_per_attempt_enforced
      - at_most_one_access_ever_started_per_attempt_enforced
      - remote_access_requires_null_station_and_expiry
      - local_access_requires_server_resolved_station_and_no_expiry
      - assigned_station_access_requires_station_and_no_expiry
      - access_mode_or_station_rebind_in_place_rejected
      - remote_resend_reuses_same_access_and_reservation
      - access_create_with_existing_nonterminal_access_rejected
      - replacement_access_after_prestart_release_creates_new_reservation_atomically
      - replacement_access_no_inventory_rolls_back_access_creation
      - old_released_reservation_is_not_reopened
      - start_requires_attempt_created_access_startable_and_reserved_reservation
      - remote_start_at_or_after_expiry_rejected
      - start_sets_attempt_and_access_started_at_same_effective_time
      - start_increments_attempt_and_access_versions_once
