      entitlement_current_or_expired_projection_owner: DB_LIC_006
    current_assignment_definition:
      predicate: status_in_assigned_or_activated_and_revoked_at_is_null
      partial_unique:
        columns: [organization_id, license_inventory_entry_id]
        where: status_in_assigned_or_activated_and_revoked_at_is_null
