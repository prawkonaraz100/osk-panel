blockers:
  - id: DB-LIC-001
    severity: P1
    title: license_and_learning_access_same_tenant_exact_target_integrity
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-LIC-001
    diagnosis:
      - current aggregate uses multiple tenant-owned IDs on learning-access/license rows but does not define composite same-tenant relations for all of them
      - a LicenseAssignment can physically drift so organization inventory student and learning account are not proven to describe one exact target
      - StudentLearningAccount and StudentAccessHandoff relations are not yet protected consistently by tenant-aware candidate keys
      - LicenseActivation organization and assignment are not yet proven same-tenant by the physical blueprint
    required_outcome_for_future_fix:
      - every tenant-owned relation in this slice must be protected by a composite same-tenant FK or equivalent final transactional DB guard
      - assignment must prove the selected learning account belongs to the exact selected Student in the same Organization
      - inventory assignment activation and handoff relations must not be cross-tenant constructible
    risk: cross_tenant_access_or_license_effect_and_wrong_student_target

  - id: DB-LIC-002
    severity: P1
    title: learning_account_global_auth_identity_and_login_consistency
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-LIC-002
    diagnosis:
      - StudentLearningAccount stores user_id primary_auth_login_identifier_id and a login_identifier_projection but current physical blueprint does not prove the identifier belongs to that same User
      - the projection can drift from canonical auth_login_identifiers unless an explicit synchronization invariant exists
      - learning-account creation through an email_or_login must not create a second independent login namespace or silently merge unrelated Users
      - global login uniqueness already belongs to DB4_2 auth_login_identifiers and must not be redefined per tenant here
    required_outcome_for_future_fix:
      - one canonical auth identity path from learning account to User and current login identifier
      - database-safe same-User relation for referenced auth identifier
      - projection consistency without creating a second authority
      - no heuristic account merge from unverified email or display fields
    risk: login_collision_wrong_global_identity_or_stale_learning_login_projection

  - id: DB-LIC-003
    severity: P1
    title: learning_account_lifecycle_optimistic_concurrency_and_student_archive_effect
    status: OPEN
    diagnosis:
      - learning-account PATCH already exposes If-Match but student_learning_accounts currently has no explicit version column in the physical blueprint
      - status exists as an unconstrained string without a closed lifecycle or state-field matrix
      - DB4_4 explicitly deferred Student archive and restore effects on learning access and licenses to DB4_6
      - without a defined lifecycle a stale credential language status or archive command can overwrite or leave an access eligible for new operations inconsistently
    required_outcome_for_future_fix:
      - one learning-account concurrency root compatible with optimistic update semantics
      - explicit access lifecycle and allowed material transitions
      - deterministic policy for Student archive and restore without deleting license or credential history
      - assignment activation reset and export eligibility must consume the final lifecycle state consistently
    risk: stale_updates_or_archived_student_retaining_undefined_access_behavior

  - id: DB-LIC-004
    severity: P1
    title: one_time_credentials_handoff_PDF_and_secret_non_persistence
    status: OPEN
    diagnosis:
      - own product policy requires OSK-managed credentials where a fresh password can be shown and printed once while old plaintext remains unrecoverable
      - current StudentAccessHandoff has a document_asset_id but no explicit one-time secret lifecycle or guarantee that a persisted FileAsset cannot become a durable recoverable plaintext-password copy
      - bulk PDF can optionally regenerate credentials and therefore can combine multiple sensitive mutations with one export
      - idempotency replay must never persist or replay a plaintext secret from safe_response_snapshot
    required_outcome_for_future_fix:
      - plaintext password exists only at an authorized create or reset handoff boundary and is never persisted in ordinary relational storage audit outbox logs idempotency or durable QR payload
      - exact safe handling for initial/reset PDF generation and later reprint must be defined
      - single and bulk credential exports must be tenant-scoped permission-scoped audited and atomic enough to avoid partial undocumented resets
      - old password recovery remains impossible
    risk: recoverable_plaintext_credentials_secret_leak_or_inconsistent_bulk_reset

  - id: DB-LIC-005
    severity: P1
    title: inventory_assignment_lifecycle_and_exactly_once_allocation_revoke
    status: OPEN
    diagnosis:
      - current partial unique prevents two nonrevoked assignments for one inventory entry but does not by itself prove inventory status assignment status activation presence and revoke effect are mutually consistent
      - assignment status has no closed catalog or field matrix in the physical blueprint
      - create_new_learning_access_and_assign must be one atomic business flow but the final DB equivalence is not defined
      - revoke-unactivated must return exactly one unit and must never race into both restored and activated effects
      - direct SQL or backend defects could leave available inventory with a live assignment or assigned inventory with no live assignment
    required_outcome_for_future_fix:
      - explicit inventory and assignment lifecycle with final-state cross-row equivalence
      - one inventory unit may have at most one current assignment and assignment/revoke effects are exactly once
      - assignment to existing or newly created learning account is atomic and idempotent
      - revoke before activation preserves history and restores one inventory unit only once
      - activate versus revoke concurrency has one winner and no double inventory transition
    risk: oversold_or_lost_inventory_double_restore_or_assignment_without_matching_inventory_state

  - id: DB-LIC-006
    severity: P1
    title: activation_stacking_entitlement_history_concurrency_and_reproducibility
    status: OPEN
    diagnosis:
      - aggregate intends to serialize activation on StudentLearningAccount and create one activation period per assignment but final current-entitlement integrity is not DB-closed
      - concurrent extensions must not lose days and must produce deterministic nonoverwriting history
      - historical effect must remain reproducible if LicenseProduct duration or metadata changes later
      - current activation row lacks explicit duration snapshot and expiry_before expiry_after provenance called for by the product evidence
      - activated_by_user_id nullable does not yet distinguish learner self-activation from OSK-managed activation semantics
    required_outcome_for_future_fix:
      - immutable exactly-once activation effect per assignment
      - serialized stacking on one learning account with deterministic effective_from and effective_to
      - durable product/effect snapshot sufficient to explain each extension later
      - deterministic current access expiry derived from immutable activation history or a guarded projection
      - learner versus OSK activation provenance is auditable without inventing a fake User actor
    risk: lost_entitlement_days_double_application_or_nonreproducible_historical_expiry

  - id: DB-LIC-007
    severity: P1
    title: license_product_language_capability_and_assignment_projection_consistency
    status: OPEN
    diagnosis:
      - language is canonically present on StudentLearningAccount while LicenseAssignment also stores language_code and CreateLicenseAssignmentRequest requires language_code even for an existing access
      - without an explicit authority/snapshot rule assignment language can drift from the selected learning account
      - product-language support is capability-driven and evidence contains a SOURCE_CONFLICT so a hardcoded global language list is forbidden
      - inventory points to a LicenseProduct but assignment/activation must not silently grant a language or historical duration unsupported by the consumed product
      - latest-license active-count hide-finished and per-access projections need deterministic rules based on the same underlying history rather than mutable duplicated status text
    required_outcome_for_future_fix:
      - one canonical current learning-access language owner with explicit historical snapshot semantics where needed
      - product-language compatibility validated from capability data rather than hardcoded screen options
      - assignment inventory product language and activation history cannot contradict each other
      - management projections are deterministic from canonical assignment activation and entitlement history
    risk: unsupported_language_entitlement_or_drifting_license_management_projection

