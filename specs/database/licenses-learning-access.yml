      status_field: license_assignments.status
      status_values: [assigned, activated, revoked_before_activation]
      version:
        field: license_assignments.version
        type: bigint
        nullable: false
        default: 1
        check: version_gte_1
        concurrency_root_for_assignment_state: true
      assigned_at: required_nonnull_immutable
      assigned_by_user_id: required_nonnull_global_user_FK_RESTRICT
      normal_hard_delete: forbidden
      generic_status_PATCH: forbidden
