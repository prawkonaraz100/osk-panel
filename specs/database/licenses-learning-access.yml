      reset_mode_requires_additional_permission_for_every_target: student_access.reset_password
      download_permission_alone_may_reset_passwords: false
      tenant_and_scope_check_every_selected_account: true
      one_combined_PDF_preserved: true
      mixed_locales_preserved: true
      exact_language_capability_semantics: deferred_to_DB_LIC_007
      canonical_modes:
        nonsecret_combined_pdf:
