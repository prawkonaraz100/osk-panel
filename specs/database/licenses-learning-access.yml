      bulk_reset_all_or_none: true
      duplicate_global_user_in_selected_accounts_reset_once: true
    migration_design:
      existing_user_managing_organization_inferred_from_only_learning_account_or_creator: forbidden
      existing_ambiguous_user_management_mode: unclassified_fail_closed
      legacy_password_changed_at_guess: forbidden
      legacy_secret_bearing_PDF_silently_reclassified_nonsecret: forbidden
      legacy_plaintext_password_migration_into_ciphertext_or_secret_table: forbidden
    required_integration_tests:
