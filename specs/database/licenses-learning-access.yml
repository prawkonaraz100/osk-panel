      old_plaintext_recovery_after_command: impossible_by_design
      server_side_later_secret_lookup: forbidden
      secret_in_database_columns: forbidden
      secret_in_file_assets_or_object_storage: forbidden
      secret_in_audit_logs: forbidden
      secret_in_outbox_messages: forbidden
      secret_in_application_logs_or_traces: forbidden
      secret_in_idempotency_safe_response_snapshot: forbidden
      secret_in_QR_payload: forbidden
      password_hash_in_audit_outbox_or_handoff_metadata: forbidden
    PDF_storage_and_reprint_policy:
