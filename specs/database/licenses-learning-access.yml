      expected_credential_version_required_for_OSK_set_or_reset_domain_command: true
      exact_HTTP_transport_of_expected_credential_version: Stage5_acceptance_contract_sync
      successful_password_set_or_reset_increments_credential_version_once: true
      semantic_retry_with_same_idempotency_key_increments_again: false
