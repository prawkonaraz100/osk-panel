  DB-LIC-005:
    status: PASS
    resolved_at: 2026-09-07
    scope: inventory_assignment_lifecycle_and_exactly_once_allocation_revoke_only
    inventory_unit_model:
      row_represents_exactly_one_inventory_unit: true
      status_field: license_inventory_entries.status
      status_values: [available, assigned, consumed, expired, adjusted]
