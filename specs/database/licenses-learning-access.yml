      dedicated_public_suspend_resume_HTTP_observed: false
      DB4_6_invents_new_UI_or_HTTP_capability: false
      history_source_until_DB4_10_finalization: audit_log_plus_outbox_domain_event
      dedicated_learning_account_lifecycle_history_table_required: false
      status_change_without_audit_outbox: forbidden
    effective_operational_eligibility:
      persisted_second_status_projection: false
      predicate:
        - student_learning_accounts.status_equals_active
        - linked_students.archived_at_is_null
        - referenced_auth_login_identifier_is_current_per_DB_LIC_002
        - global_User_authentication_eligibility_is_checked_by_identity_security_domain
      student_archive_is_persisted_into_learning_account_status: false
      student_archive_is_separate_parent_state_input: true
      consumers_requiring_eligibility:
        - learner_learning_context_or_progress_access
        - create_new_license_assignment_targeting_existing_learning_account
        - activate_license_for_learning_account
        - credential_reset_or_new_secret_generation
        - create_sensitive_access_handoff
        - credential_PDF_or_bulk_credential_export
      admin_historical_read_of_account_assignment_activation_history:
        requires_operational_eligibility: false
        still_requires_tenant_permission_scope: true
      normal_learning_account_configuration_PATCH:
        allowed_statuses: [active, suspended]
        linked_student_must_be_nonarchived: true
        archived_student_exception: explicit_audited_data_correction_command_only_not_generic_PATCH
    creation_contract:
      lock_student_row_before_create: FOR_UPDATE
      after_lock_require_student_archived_at_null: true
      after_lock_require_same_tenant_DB_LIC_001: true
      create_status: active
      create_version: 1
      identifier_binding_must_pass_DB_LIC_002: true
      archive_vs_create_race_serialized_on_student_row: true
    shared_state_dependent_lock_prefix:
      order:
        - students_row_FOR_UPDATE
        - student_learning_accounts_row_FOR_UPDATE_when_existing
      after_student_lock_require_archived_at_null_for_new_operational_effect: true
      after_account_lock_require_status_active_for_new_operational_effect: true
      account_configuration_PATCH_checks_expected_version_after_account_lock: true
      downstream_license_assignment_command_extends_lock_order_after_this_prefix: DB_LIC_005
      downstream_activation_command_extends_lock_order_after_this_prefix: DB_LIC_006
      credential_reset_handoff_secret_lock_extension: DB_LIC_004
      reason: Student_archive_restore_and_state_dependent_learning_access_commands_must_linearize_on_the_same_Student_parent_boundary
    student_archive_effect:
      upstream_archive_transaction: DB_TRN_003
      archive_may_hard_delete_learning_account: false
      archive_may_change_learning_account_status: false
      archive_may_increment_learning_account_version: false
      archive_may_revoke_license_assignment: false
      archive_may_restore_inventory: false
      archive_may_delete_or_rewrite_activation_history: false
      archive_may_pause_active_entitlement_clock: false
      archive_may_extend_entitlement_end: false
      operational_eligibility_after_archive_commit: false
      existing_unactivated_assignment_history_preserved: true
      existing_activation_period_continues_to_age_by_wall_clock: true
      global_user_or_global_auth_identifier_revoked_as_side_effect: false
      global_auth_session_for_same_user_revoked_as_side_effect: false
      authorization_or_access_cache_must_not_outlive_parent_state_change:
        recheck_inputs: [students.version, student_learning_accounts.version, student_learning_accounts.status]
        archive_students_version_increment_from_DB_TRN_003_invalidates_cached_eligibility: true
      rationale: >-
        Student archive disables this tenant-owned learning context without turning a
        parent archive into a hidden license revoke, inventory adjustment, entitlement
        pause, credential rewrite or global User logout.
    student_restore_effect:
      upstream_restore_transaction: DB_TRN_003
      restore_may_change_learning_account_status: false
      restore_may_increment_learning_account_version: false
      restore_may_recreate_or_unrevoke_assignment: false
      restore_may_recreate_activation: false
      restore_may_extend_expired_entitlement: false
      previously_active_learning_account_becomes_operationally_eligible_again: true_subject_to_current_license_entitlement_and_global_auth_rules
      explicitly_suspended_learning_account_remains_suspended: true
      expired_entitlement_remains_expired: true
      revoked_unactivated_assignment_remains_revoked: true
      same_durable_learning_account_rows_reused: true
      rationale: >-
        Restore removes only the parent archive gate. It must not guess whether an
        independently suspended access or ended/revoked license should be revived.
    archive_restore_race_semantics:
      archive_vs_learning_account_create:
        shared_lock: students_row
        create_first: archive_may_commit_after_create_and_new_account_then_becomes_ineligible
        archive_first: create_rejected_after_lock
      archive_vs_account_PATCH:
        shared_prefix: students_then_learning_account
        PATCH_first: archive_may_commit_after_PATCH_and_then_disables_operational_context
        archive_first: normal_PATCH_rejected_for_archived_student
        stale_expected_version_cannot_overwrite_account_state: true
      archive_vs_assignment_activation_or_credential_effect:
        shared_first_lock: students_row
        effect_first: archive_may_commit_after_effect_without_reversing_or_pausing_that_effect
        archive_first: new_effect_rejected_after_student_lock
      restore_vs_explicit_account_resume:
        shared_prefix: students_then_learning_account
        restore_does_not_perform_resume: true
        explicit_resume_still_requires_its_own_authorized_command_and_current_state
    migration_design:
      order:
        - precheck_existing_learning_account_status_values
        - fail_on_unknown_or_null_status_without_reviewed_mapping_evidence
        - add_version_bigint_not_null_default_1_check_gte_1
        - add_closed_status_check_active_or_suspended
        - enforce_normal_immutability_of_organization_student_and_user_relations
        - wire_learning_account_PATCH_to_expected_version_lock_and_increment_once
        - wire_create_and_state_dependent_operations_to_student_then_learning_account_lock_prefix
        - make_operational_queries_and_commands_consume_effective_operational_eligibility
        - add_archive_restore_race_and_cache_invalidation_tests
      unknown_legacy_status_auto_map_to_active: forbidden
      archived_student_learning_accounts_auto_suspend_in_migration: forbidden
      archived_student_assignments_auto_revoke_in_migration: forbidden
      archived_student_entitlements_auto_pause_or_extend_in_migration: forbidden
      unresolved_legacy_status: fail_migration_and_require_reviewed_remediation
    required_integration_tests:
      - new_learning_account_starts_active_with_version_one
      - invalid_learning_account_status_is_rejected
      - learning_account_PATCH_with_current_expected_version_increments_once
      - learning_account_PATCH_with_stale_expected_version_is_rejected_without_partial_write
      - two_learning_account_PATCH_commands_with_same_expected_version_cannot_both_commit
      - semantic_noop_PATCH_does_not_increment_version
      - generic_PATCH_cannot_change_learning_account_status
      - active_to_suspended_and_suspended_to_active_require_explicit_lifecycle_command
      - learning_account_create_for_archived_student_is_rejected_after_student_lock
      - archive_does_not_mutate_learning_account_status_or_version
      - archive_does_not_revoke_assignment_restore_inventory_or_rewrite_activation
      - archive_blocks_new_assignment_activation_reset_handoff_export_and_learning_context_after_commit
      - active_entitlement_time_continues_while_student_is_archived_and_is_not_automatically_extended
      - restore_does_not_reactivate_explicitly_suspended_learning_account
      - restore_does_not_unrevoke_assignment_or_extend_expired_entitlement
      - restore_allows_previously_active_account_to_become_eligible_again_subject_to_current_entitlement
      - archive_and_learning_account_create_race_is_linearizable_on_student_lock
      - archive_and_learning_account_PATCH_race_is_linearizable_without_lost_update
      - archive_and_assignment_or_activation_race_has_one_serial_order_and_no_hidden_compensation
      - same_global_user_learning_context_in_other_organization_is_not_globally_revoked_by_student_archive
      - cached_learning_eligibility_rechecks_student_version_and_learning_account_version_status
      - migration_does_not_guess_unknown_status_or_auto_suspend_child_rows_from_parent_archive
    explicitly_not_solved_in_this_step:
      - DB-LIC-004_one_time_password_reset_secret_handoff_PDF_and_credential_epoch
      - DB-LIC-005_inventory_assignment_state_equivalence_exactly_once_revoke_and_assignment_concurrency
      - DB-LIC-006_activation_stacking_entitlement_period_history_and_reproducibility
      - DB-LIC-007_language_capability_assignment_snapshot_and_management_projection_rules

  DB-LIC-004:
    status: PASS
    resolved_at: 2026-09-06
    scope: one_time_credentials_handoff_PDF_and_secret_non_persistence_only
    canonical_password_storage:
      password_hash_owner: users.password_hash
      password_hash_is_global_user_credential: true
      learning_account_password_hash_column: forbidden
      plaintext_password_column_any_relational_table: forbidden
      reversible_password_ciphertext_or_secret_reference_for_login_password: forbidden
      hash_algorithm_and_cost_parameters: security_implementation_policy
    global_password_management_authority:
      table: user_password_management
      purpose: fail_closed_authority_and_credential_epoch_for_global_local_password_mutation
      user_scope: global
      one_row_per_user: true
      fields:
        user_id: uuid_PK_FK_users
        management_mode: varchar_32_not_null
        managing_organization_id: uuid_nullable_FK_organizations
        credential_version: bigint_not_null_default_0_check_gte_0
        password_changed_at: timestamptz_nullable
        created_at: timestamptz
        updated_at: timestamptz
      management_mode_values: [unclassified, self_service, organization_managed]
      state_matrix:
        unclassified:
          managing_organization_id: null
          OSK_password_set_or_reset_allowed: false
        self_service:
          managing_organization_id: null
          OSK_password_set_or_reset_allowed: false
        organization_managed:
          managing_organization_id: required_nonnull
          OSK_password_set_or_reset_allowed_only_for_matching_organization: true
      relation_to_global_user_password:
        password_hash_null_allows_credential_version_zero: true
        password_hash_null_may_have_credential_version_gt_zero_after_explicit_local_password_disable: true
        password_hash_nonnull_requires_credential_version_gte_1: true
        local_password_disable_if_supported_must_increment_version_and_preserve_monotonic_epoch: true
        enforcement: DEFERRABLE_INITIALLY_DEFERRED_constraint_trigger_or_equivalent_transactional_DB_guard_across_users_and_management_row
      authority_transfer_or_self_service_claim:
        hidden_side_effect_of_learning_account_create_update_reset: forbidden
        requires_separate_elevated_identity_security_command: true
        exact_transfer_claim_recovery_policy: existing_pending_identity_policy_gate
      attaching_existing_global_user_to_learning_account_changes_management_authority: false
      same_global_user_may_have_learning_accounts_in_multiple_organizations: true_only_when_not_organization_managed
      permission_in_nonmanaging_organization_grants_password_reset: false
      organization_managed_exclusive_principal_guard:
        purpose: prevent_tenant_password_reset_from_becoming_cross_tenant_or_staff_account_takeover
        organization_membership_rows_for_user_allowed: false
        learning_account_in_other_organization_allowed: false
        current_auth_social_account_allowed: false
        final_state_enforcement: DEFERRABLE_INITIALLY_DEFERRED_constraint_triggers_or_equivalent_transactional_DB_guards_on_all_participating_tables
        creating_membership_cross_org_learning_account_or_current_social_link_while_organization_managed: reject_until_identity_authority_is_explicitly_transitioned
        historical_user_identity_merge_or_authority_transition: separate_elevated_identity_security_flow
      rationale: >-
        Because users.password_hash authenticates one global User, tenant-level reset
        permission alone must never let OSK A take over staff, owner, social-login or
        cross-organization contexts of that same User.
    OSK_managed_initial_password:
      allowed_only_when:
        - learning_account_create_passes_DB_LIC_001_and_DB_LIC_002
        - student_and_learning_account_are_operationally_eligible_per_DB_LIC_003
        - actor_has_student_access_create_for_target
        - actor_has_student_access_manage_credentials_for_target_when_initial_password_is_supplied
        - user_password_management_is_organization_managed_by_same_organization
        - user_satisfies_organization_managed_exclusive_principal_guard
      newly_created_global_user_in_OSK_managed_flow:
        may_initialize_management_row_atomically: true
        management_mode: organization_managed
        managing_organization_id: active_organization
        initial_credential_version_before_password: 0
      existing_user_without_matching_organization_managed_authority:
        initial_password_set_by_OSK: forbidden
        learning_account_link_may_still_use_self_service_identity_flow_subject_to_DB_LIC_002: true
    OSK_password_reset_authority:
