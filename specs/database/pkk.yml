      - migration_does_not_guess_missing_fetched_at_from_unrelated_timestamps
      - migration_does_not_move_legacy_snapshot_to_latest_or_current_identity
      - DB_PKK_001_exact_target_integrity_preserved
      - DB_PKK_003_through_DB_PKK_008_remain_open

    self_audit:
      identity_and_provider_snapshot_authorities_separated: PASS
      immutable_append_only_snapshot_history_defined: PASS
      exact_same_tenant_course_profile_binding_reuses_DB_PKK_001: PASS
      deterministic_revision_and_current_projection_defined: PASS
      timestamp_or_UUID_latest_heuristic_forbidden: PASS
      identity_change_stale_snapshot_fallback_forbidden: PASS
      late_response_history_preserved_without_current_projection_corruption: PASS
      snapshot_hash_evidence_boundary_defined_without_claiming_crypto_completion: PASS
      automatic_student_course_overwrite_forbidden: PASS
      legacy_identity_row_provider_fields_deauthoritized_after_safe_cutover: PASS
      DB_PKK_003_operation_lifecycle_not_solved: PASS
      DB_PKK_004_idempotency_retry_reconciliation_not_solved: PASS
      DB_PKK_005_signed_XML_not_solved: PASS
      DB_PKK_006_payload_security_not_solved: PASS
      DB_PKK_007_configuration_revision_not_solved: PASS
      DB_PKK_008_latest_operation_projection_not_solved: PASS
      aggregate_core_schema_modified: false
