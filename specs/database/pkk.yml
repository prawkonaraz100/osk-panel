    required_tests:
      - first_snapshot_for_profile_gets_revision_1
      - concurrent_snapshot_appends_same_profile_serialize_and_receive_distinct_contiguous_revisions
      - duplicate_snapshot_revision_same_profile_is_rejected
      - snapshot_cross_tenant_profile_relation_is_rejected
      - snapshot_profile_from_other_course_same_organization_is_rejected
      - snapshot_identity_or_content_update_after_insert_is_rejected
      - snapshot_normal_hard_delete_is_rejected
      - current_projection_uses_max_revision_for_exact_current_profile
