    resolution_ref: resolved_contracts.DB-PKK-003
    diagnosis:
      - current_business_status_is_unconstrained_while_product_sources_describe_draft_pending_requires_signature_submitted_success_failed_cancelled_and_simpler_pending_success_failed_views
