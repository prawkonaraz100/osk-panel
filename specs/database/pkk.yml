resolved_contracts:
  DB-PKK-001:
    status: PASS
    title: same_tenant_and_exact_course_profile_operation_attempt_integrity
    severity: P1
    goal: >-
      Every persisted provider operation and transport attempt must be unable
      to cross tenants or combine a CourseEnrollment, PkkProfile, Operation
      and Attempt that do not represent the exact same course-scoped PKK
      identity context, even if application validation is bypassed.

    authority_and_scope:
      organization_id_client_authority: false
      tenant_key_source: active_membership_or_validated_parent
      runtime_provider_operation_owner: exact_course_enrollment_and_bound_pkk_identity_revision
      runtime_provider_operation_requires_exact_pkk_profile: true
      pkk_profile_id_nullable_for_runtime_provider_operation: false
      conditional_test_connection_is_not_a_course_scoped_pkk_operation: true
      actor_user_id_is_global_identity: true
      actor_user_fake_tenant_composite_FK: false
      provider_profile_currentness_and_command_eligibility: deferred_to_DB_PKK_003
      provider_snapshot_history: deferred_to_DB_PKK_002

    tenant_candidate_keys_required:
      course_enrollments:
        columns: [organization_id, id]
        source: DB4_4
      pkk_profiles_exact_course:
        columns: [organization_id, id, course_enrollment_id]
        source: DB_TRN_008
        unique_constraint_required: true
      pkk_operations:
        columns: [organization_id, id]
        unique_constraint_required: true
      pkk_operations_exact_context:
        columns: [organization_id, id, course_enrollment_id, pkk_profile_id]
        unique_constraint_required: true
        purpose: exact_provider_attempt_parent_target
      pkk_operation_attempts:
        columns: [organization_id, id]
        unique_constraint_required: true
      pkk_operation_attempts_exact_context:
        columns: [organization_id, id, pkk_operation_id, course_enrollment_id, pkk_profile_id]
        unique_constraint_required: true
        purpose: future_exact_evidence_parent_target

    pkk_operations:
      organization_id_required_nonnull: true
      course_enrollment_id_required_nonnull: true
      pkk_profile_id_runtime_required_nonnull: true
      relation_course_same_tenant:
        source_columns: [organization_id, course_enrollment_id]
        target_table: course_enrollments
        target_columns: [organization_id, id]
        match: MATCH_SIMPLE
        on_update: RESTRICT
        on_delete: RESTRICT
      relation_exact_profile_course:
        source_columns: [organization_id, pkk_profile_id, course_enrollment_id]
        target_table: pkk_profiles
        target_columns: [organization_id, id, course_enrollment_id]
        match: MATCH_SIMPLE
        on_update: RESTRICT
        on_delete: RESTRICT
        effect: operation_cannot_pair_course_A_with_profile_from_course_B_or_other_tenant
      actor_relation:
        target_table: users
        target_columns: [id]
        tenant_composite_FK: false
      identity_context_fields_immutable_after_insert:
        - organization_id
        - course_enrollment_id
        - pkk_profile_id
      normal_hard_delete: forbidden
      note: >-
        Binding to a PkkProfile freezes which local PKK identity revision the
        provider operation concerns. Whether that profile must be current at
        command creation/execution is intentionally left to DB-PKK-003.

    pkk_operation_attempts:
      fields_added_or_finalized:
        organization_id: uuid_not_null
        course_enrollment_id: uuid_not_null
        pkk_profile_id: uuid_not_null
      exact_operation_context_relation:
        source_columns: [organization_id, pkk_operation_id, course_enrollment_id, pkk_profile_id]
        target_table: pkk_operations
        target_columns: [organization_id, id, course_enrollment_id, pkk_profile_id]
        match: MATCH_SIMPLE
        on_update: RESTRICT
        on_delete: RESTRICT
        effect: attempt_cannot_rebind_operation_to_different_course_profile_or_tenant
      independent_direct_course_or_profile_FK_required_in_addition_to_exact_operation_FK: false
      reason: exact_operation_context_composite_FK_already_proves_both_relations
      exact_context_fields_immutable_after_insert:
        - organization_id
        - pkk_operation_id
        - course_enrollment_id
        - pkk_profile_id
      normal_hard_delete: forbidden
      attempt_number_retry_and_inflight_semantics: deferred_to_DB_PKK_004

    future_evidence_boundary:
      signed_XML_schema_created_in_DB_PKK_001: false
      reconciliation_schema_created_in_DB_PKK_001: false
      requirement: >-
        Any later PKK artifact, signature handoff or reconciliation evidence
        that is scoped to one provider attempt must reference an exact
        same-tenant Attempt context, not a loose operation/profile id pair.
      reusable_exact_attempt_target:
        columns: [organization_id, id, pkk_operation_id, course_enrollment_id, pkk_profile_id]
      exact_XML_and_FileAsset_semantics_remain_DB_PKK_005: true
      reconciliation_semantics_remain_DB_PKK_004: true

    history_and_tenant_policy:
      organization_id_mutation_after_insert: forbidden_for_normal_domain_lifecycle
      course_profile_operation_attempt_reparenting: forbidden
      relation_on_update: RESTRICT
      relation_on_delete: RESTRICT
      destructive_cascade_of_provider_history: forbidden
      application_validation_is_final_relation_boundary: false

    migration_policy:
      add_pkk_operation_attempts_context_columns_temporarily_nullable: true
      precheck_every_pkk_operation_matches_course_organization: required
      precheck_every_nonnull_operation_profile_matches_exact_same_course_and_organization: required
      legacy_operation_with_null_pkk_profile_id:
        auto_bind_to_current_profile: forbidden
        auto_bind_to_latest_profile_by_timestamp_or_revision: forbidden
        required_action: fail_and_require_reviewed_historical_remediation_or_trusted_external_evidence
      legacy_operation_profile_from_wrong_course_or_tenant:
        auto_reparent: forbidden
        required_action: fail_and_require_reviewed_security_remediation
      attempt_context_backfill:
        source: verified_exact_parent_pkk_operation_only
        fields: [organization_id, course_enrollment_id, pkk_profile_id]
        allowed_after_parent_operation_prechecks_pass: true
        missing_or_ambiguous_parent: fail_and_require_reviewed_remediation
      add_candidate_keys_before_child_composite_FKs: true
      set_attempt_context_columns_not_null_after_verified_backfill: true
      set_runtime_operation_pkk_profile_id_not_null_after_legacy_remediation: true
      migration_does_not_call_provider_to_guess_history: true

    required_tests:
      - same_tenant_operation_exact_course_profile_is_accepted
      - operation_profile_from_other_course_same_organization_is_rejected_by_database
      - operation_profile_from_other_organization_is_rejected_by_database
      - operation_course_from_other_organization_is_rejected_by_database
      - runtime_provider_operation_without_exact_pkk_profile_is_rejected_after_cutover
      - actor_global_user_relation_does_not_require_fake_tenant_key
      - same_tenant_attempt_exact_operation_course_profile_is_accepted
      - attempt_with_operation_from_other_organization_is_rejected_by_database
      - attempt_cannot_pair_operation_with_different_course
      - attempt_cannot_pair_operation_with_different_profile
      - attempt_exact_context_fields_cannot_be_reparented_after_insert
      - operation_exact_context_fields_cannot_be_reparented_after_insert
      - normal_delete_cannot_cascade_away_provider_operation_or_attempt_history
      - migration_detects_operation_profile_course_mismatch
      - migration_does_not_bind_null_legacy_operation_profile_to_current_or_latest_heuristically
      - attempt_context_backfill_uses_only_verified_exact_parent_operation
      - DB_TRN_008_identity_history_and_exact_course_profile_boundary_preserved
      - DB_PKK_002_through_DB_PKK_008_remain_open

    self_audit:
      exact_operation_course_profile_same_tenant_boundary_closed: PASS
      provider_attempt_receives_explicit_tenant_and_exact_context: PASS
      attempt_exact_parent_composite_FK_closes_cross_course_profile_rebinding: PASS
      global_actor_not_incorrectly_tenant_scoped: PASS
      runtime_provider_operation_null_profile_ambiguity_closed_fail_closed: PASS
      legacy_null_profile_not_heuristically_rebound: PASS
      DB4_4_PKK_identity_contract_preserved: PASS
      DB_PKK_002_provider_snapshot_history_not_solved: PASS
      DB_PKK_003_operation_lifecycle_not_solved: PASS
      DB_PKK_004_retry_reconciliation_not_solved: PASS
      DB_PKK_005_signed_XML_not_solved: PASS
      DB_PKK_006_payload_security_not_solved: PASS
      DB_PKK_007_configuration_revision_not_solved: PASS
      DB_PKK_008_latest_projection_not_solved: PASS
      aggregate_core_schema_modified: false
      aggregate_docs87_modified: false
      API_files_modified: false
      Laravel_migrations_created: false
      DB4_9_or_later_entered: false
      Stage5_started: false
  DB-PKK-002:
    status: PASS
    title: immutable_provider_profile_snapshot_history_and_current_projection
    severity: P1
    goal: >-
      Separate immutable course-scoped PKK identity from append-only provider
      observations so repeated fetches or later provider responses never overwrite
      the only historical evidence and current UI projection is deterministic for
      the exact current PkkProfile revision.

    authority_and_scope:
      PKK_identity_authority: pkk_profiles
      provider_snapshot_history_authority: pkk_provider_profile_snapshots
      legacy_pkk_profiles_status_profile_snapshot_fetched_at_canonical_after_cutover: false
      provider_snapshot_currentness_stored_boolean: false
      provider_snapshot_currentness_derived_from_identity_and_revision: true
      provider_operation_lifecycle_and_eligibility: deferred_to_DB_PKK_003
      idempotent_response_acceptance_and_retry_deduplication: deferred_to_DB_PKK_004
      provider_payload_crypto_envelope_key_version_and_redaction_integrity: deferred_to_DB_PKK_006
      exact_provider_schema_and_status_catalog: adapter_owned_not_invented
      student_or_course_auto_overwrite_from_provider_snapshot: forbidden

    snapshot_table:
      name: pkk_provider_profile_snapshots
      fields_added_or_finalized:
        id: uuid_primary_key
        organization_id: uuid_not_null
        course_enrollment_id: uuid_not_null
        pkk_profile_id: uuid_not_null
        snapshot_revision: bigint_not_null_check_gte_1
        snapshot_schema_version: integer_not_null_check_gte_1
        capture_origin: varchar_provider_response_or_legacy_reconstructed
        provider_status_snapshot: varchar_nullable_opaque_adapter_owned
        provider_profile_payload_ciphertext: bytea_nullable_crypto_contract_deferred_DB_PKK_006
        redacted_profile_projection_jsonb: jsonb_not_null_default_empty_object
        snapshot_content_hash: sha256_not_null
        fetched_at: timestamptz_nullable_only_for_legacy_reconstructed
        created_at: timestamptz_not_null
      runtime_capture_origin: provider_response
      runtime_provider_response_requires_fetched_at: true
      legacy_reconstructed_may_have_unknown_fetched_at: true
      normal_update_after_insert: forbidden
      normal_hard_delete: forbidden
      snapshot_content_and_identity_fields_immutable: true

    exact_identity_relation:
      source_columns: [organization_id, pkk_profile_id, course_enrollment_id]
      target_table: pkk_profiles
      target_columns: [organization_id, id, course_enrollment_id]
      on_update: RESTRICT
      on_delete: RESTRICT
      effect: snapshot_cannot_cross_tenant_course_or_PKK_identity_revision
      organization_id_client_authority: false

    candidate_keys_and_revision:
      tenant_candidate_key: [organization_id, id]
      exact_snapshot_context_candidate_key: [organization_id, id, pkk_profile_id, course_enrollment_id]
      revision_unique_scope: [organization_id, pkk_profile_id, snapshot_revision]
      first_revision: 1
      revision_allocation: MAX_existing_revision_plus_1_under_exact_PkkProfile_FOR_UPDATE
      revision_contiguous_for_committed_rows: true
      revision_immutable: true
      timestamp_UUID_or_hash_used_as_revision_or_latest_tiebreaker: false
      snapshot_content_hash_unique: false
      reason_hash_not_unique: identical_provider_data_may_be_observed_more_than_once_and_DB_PKK_004_owns_idempotent_effect_deduplication

    snapshot_hash_boundary:
      algorithm: SHA_256_or_stronger_fixed_approved_digest
      input: canonical_normalized_provider_profile_snapshot_envelope_before_encryption
      includes:
        - snapshot_schema_version
        - provider_status_snapshot
        - normalized_provider_profile_content
      excludes:
        - random_encryption_nonce
        - storage_metadata
        - created_at
        - database_row_id
      hash_is_business_evidence_binding_not_encryption_or_authentication: true
      authenticated_encryption_and_key_rotation: deferred_to_DB_PKK_006
      redacted_projection_is_not_full_evidence_authority: true

    append_concurrency:
      serialization_root: exact_pkk_profile_row_FOR_UPDATE
      lock_then_recheck_exact_tenant_course_profile: true
      profile_superseded_during_wait:
        legitimate_already_bound_historical_provider_response_may_append_to_exact_superseded_profile: true
        becomes_current_course_projection: false
        operation_was_eligible_to_run: governed_by_DB_PKK_003
      concurrent_accepted_appends_same_profile_get_distinct_revisions: true
      append_mutates_pkk_profile_identity_fields_or_course_version: false

    deterministic_current_projection:
      course_current_identity_source: pkk_profiles_where_course_exact_and_superseded_at_is_null
      current_provider_snapshot_for_course: MAX_snapshot_revision_for_exact_current_pkk_profile
      if_current_identity_has_zero_snapshots: null_not_fetched_projection
      fallback_to_snapshot_from_superseded_identity: forbidden
      latest_by_fetched_at_created_at_or_UUID: forbidden
      provider_status_snapshot_is_operation_lifecycle_authority: false
      historical_profile_latest_snapshot_remains_queryable: true
      late_snapshot_for_superseded_identity_can_replace_current_course_projection: false
      current_projection_persisted_back_to_course_or_student: false

    identity_change_semantics:
      new_PkkProfile_revision_starts_with_zero_provider_snapshots: true
      copy_previous_identity_provider_snapshot_to_successor: forbidden
      previous_identity_snapshots_remain_immutable_history: true
      fetch_required_for_new_identity_before_provider_data_panel_is_current: true
      DB4_4_exactly_one_current_identity_rule_preserved: true

    data_authority:
      provider_snapshot_role: external_observation_evidence_and_read_projection
      student_fields_authority: students_domain
      course_fields_authority: course_enrollments_domain
      automatic_write_through_from_snapshot_to_student: forbidden
      automatic_write_through_from_snapshot_to_course: forbidden
      explicit_future_domain_update_requires_separate_validation_authorization_concurrency_and_audit: true

    legacy_pkk_profile_provider_fields:
      fields: [status, profile_snapshot, fetched_at]
      canonical_runtime_write_after_cutover: false
      canonical_current_projection_after_cutover: false
      final_aggregate_action: remove_or_mark_migration_only_after_verified_snapshot_backfill_and_read_cutover
      identity_fields_on_pkk_profiles_remain_unchanged: true

    migration_policy:
      physical_cutover_waits_for_DB_PKK_006_safe_payload_storage_contract: true
      legacy_profile_with_all_three_provider_fields_null_creates_snapshot: false
      legacy_snapshot_bound_only_to_same_exact_pkk_profile_revision: true
      one_legacy_mutable_snapshot_can_map_to_revision_1_only_when_exact_identity_proven: true
      copy_legacy_snapshot_to_current_successor_identity: forbidden
      choose_snapshot_across_identity_revisions_by_timestamp_or_UUID: forbidden
      infer_missing_fetched_at_from_created_at_updated_at_or_course_time: forbidden
      legacy_unknown_fetched_at_preserved_as_null_with_capture_origin_legacy_reconstructed: true
      compute_snapshot_hash_only_from_deterministically_canonicalizable_retained_content: true
      missing_or_ambiguous_payload_or_identity_provenance: fail_and_require_reviewed_remediation
      provider_call_to_reconstruct_historical_snapshot: forbidden
      drop_or_ignore_legacy_identity_row_provider_fields_before_verified_backfill: forbidden
