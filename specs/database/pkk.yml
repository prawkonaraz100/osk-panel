      provider_network_call_inside_database_lock_transaction: forbidden
      operation_row_and_initial_lifecycle_event_commit_before_provider_dispatch: true
      transport_attempt_dispatch_after_commit: DB_PKK_004

    configuration_readiness_boundary:
      settings_concurrency_root_preserved: organization_settings.version
      operation_creation_locks_same_organization_settings_row_used_by_settings_update: true
      always_reject_readiness_statuses: [not_configured, requires_attention]
      configured_unverified_vs_verified_execution_rule: adapter_capability_dependent
      if_provider_verification_is_supported_and_required: verified_required
      if_provider_has_no_verifiable_connection_test: configured_unverified_may_be_operation_ready
      readiness_status_is_rechecked_not_snapshotted_as_final_execution_evidence_here: true
      exact_configuration_revision_evidence: deferred_to_DB_PKK_007

    PKK_identity_change_interlock:
      new_operation_requires_current_profile: true
      current_profile_supersession_or_PKK_identity_edit_while_active_operation_exists: reject_conflict
      identity_edit_and_operation_create_share_course_then_profile_lock_prefix: true
      operation_create_vs_identity_supersession_has_one_winner: true
      operation_already_success_failed_or_cancelled_does_not_prevent_later_identity_revision: true
      retry_of_failed_operation_after_profile_superseded: must_be_rejected_by_DB_PKK_004_currentness_recheck

    ambiguous_duplicate_PKK_fail_closed:
      hard_unique_PKK_number_added: false
      external_ownership_semantics_invented: false
      operation_preflight_checks_current_profiles_with_same_lookup_hash_in_relevant_organization_scope: true
      if_more_than_one_current_profile_matches_same_lookup_hash: reject_ambiguous_PKK_identity
      race_safe_identity_ambiguity_boundary: transaction_scoped_lock_keyed_by_organization_and_pkk_lookup_hash_or_equivalent_lock_record
      same_boundary_required_for_PKK_identity_create_or_edit_that_changes_lookup_hash: true
      purpose: serialize_duplicate_ambiguity_check_without_claiming_global_uniqueness

    transition_transaction:
      steps:
        - lock_operation_FOR_UPDATE
        - validate_transition_against_operation_type_and_current_status
        - validate_actor_or_worker_authority
        - update_business_status_and_current_cycle_completed_at
        - increment_operation_version_once
        - append_exactly_one_lifecycle_event_same_version
        - satisfy_deferred_current_status_version_history_guard
