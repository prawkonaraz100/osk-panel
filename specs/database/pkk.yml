  DB-PKK-003:
    status: PASS
    title: provider_operation_lifecycle_concurrency_and_command_eligibility
    severity: P1
    goal: >-
      Give every course-scoped PKK provider operation one closed provider-neutral
      business lifecycle, serialize operation creation against Course/PkkProfile
      and integration-settings changes, and reject conflicting or stale commands
      before any provider I/O begins without inventing provider-specific protocol rules.

    authority_and_scope:
      business_operation_authority: pkk_operations
      lifecycle_history_authority: pkk_operation_lifecycle_events
      transport_attempt_retry_reconciliation_authority: deferred_to_DB_PKK_004
      signed_XML_evidence: deferred_to_DB_PKK_005
      payload_crypto_and_redaction: deferred_to_DB_PKK_006
      exact_configuration_revision_binding: deferred_to_DB_PKK_007
      deterministic_course_operation_sequence: deferred_to_DB_PKK_008
      preview_profile_is_business_operation: false
      list_or_get_operation_is_business_operation: false
      retry_creates_new_business_operation: false

    operation_type_catalog:
      runtime_values:
        - fetch_profile
        - update_and_return
        - return_to_school
        - return_to_authority
        - return_expired
      immutable_after_insert: true
      permission_mapping:
        fetch_profile: pkk.fetch
        update_and_return: pkk.training.update_and_return
        return_to_school: pkk.return.school
        return_to_authority: pkk.return.authority
        return_expired: pkk.return.expired
      exact_provider_request_fields_per_type: adapter_owned_not_invented
      retry_permission: pkk.retry_deferred_to_DB_PKK_004

    business_status_catalog:
      values: [draft, pending, requires_signature, submitted, success, failed, cancelled]
      active_statuses: [draft, pending, requires_signature, submitted]
      irreversible_terminal_statuses: [success, cancelled]
      retry_gated_quiescent_status: failed
      observed_three_state_UI_is_projection_not_authority: true
      generic_direct_business_status_PATCH: forbidden
      success_or_cancelled_outgoing_transition: forbidden
      failed_to_pending_transition: reserved_only_for_DB_PKK_004_explicit_retry
      unknown_timeout_or_unknown_external_effect_is_not_plain_failed: true

    transition_matrix:
      runtime_initial_status:
        fetch_profile: pending
        mutating_operation_with_confirmation_captured_atomically: pending
        explicit_local_preparation_workflow_when_used: draft
      draft:
        allowed_to: [pending, cancelled]
      pending_fetch_profile:
        allowed_to: [success, failed]
      pending_mutating_operation:
        allowed_to: [requires_signature, submitted, failed]
      requires_signature:
        allowed_to: [submitted, failed, cancelled]
      submitted:
        allowed_to: [success, failed]
      failed:
        allowed_to: [pending_only_via_DB_PKK_004_retry]
      success:
        allowed_to: []
      cancelled:
        allowed_to: []
      requires_signature_operation_type_mapping: adapter_verified_not_hardcoded
      mutating_operation_success_requires_submitted_history_event: true
      fetch_profile_may_complete_without_submitted_state: true

    operation_fields_added_or_finalized:
      operation_origin: varchar_runtime_or_legacy_migrated_not_null
      version: bigint_not_null_default_1_check_gte_1
      business_status: closed_catalog_not_null
      confirmed_at: timestamptz_nullable
      confirmed_by_user_id: uuid_nullable_global_users_FK_RESTRICT
      completed_at: timestamptz_nullable_current_cycle_projection
      operation_type_and_exact_context_immutable: true
      normal_hard_delete: forbidden
      runtime_origin_value: runtime

    confirmation_boundary:
      confirmation_required_operation_types:
        - update_and_return
        - return_to_school
        - return_to_authority
        - return_expired
      fetch_profile_confirmation_fields_must_be_null: true
      runtime_mutating_operation_may_enter_pending_only_with_confirmation_pair: true
      confirmation_pair: [confirmed_at, confirmed_by_user_id]
      confirmed_by_user_must_have_exact_operation_permission_and_scope_at_confirmation: true
      API_POST_itself_may_capture_confirmation_atomically_after_UI_confirmation: true
      exact_HTTP_confirmation_shape: Stage5_acceptance_contract_sync
      legacy_missing_confirmation_must_not_be_fabricated: true

    current_cycle_timestamp_equivalence:
      active_status_requires_completed_at_null: true
      success_failed_or_cancelled_requires_completed_at_nonnull: true
      failed_to_pending_explicit_retry_clears_current_completed_at_in_same_transaction: true
      prior_failure_time_remains_immutable_in_lifecycle_history: true
      success_or_cancelled_completed_at_write_once: true
      timestamps_or_status_may_change_only_through_lifecycle_command: true

    lifecycle_history_table:
      name: pkk_operation_lifecycle_events
      fields:
        id: uuid_primary_key
        organization_id: uuid_not_null
        pkk_operation_id: uuid_not_null
        operation_version: bigint_not_null_check_gte_1
        from_business_status: varchar_nullable
        to_business_status: varchar_not_null_closed_catalog
        event_origin: varchar_runtime_or_legacy_baseline_not_null
        occurred_at: timestamptz_not_null
        actor_kind: varchar_user_system_provider_adapter_or_legacy_migration_not_null
        actor_user_id: uuid_nullable_global_users_FK_RESTRICT
        reason_code: varchar_nullable
        created_at: timestamptz_not_null
      exact_operation_relation: "[organization_id,pkk_operation_id]_to_pkk_operations[organization_id,id]"
      one_event_per_operation_version_unique: [organization_id, pkk_operation_id, operation_version]
      first_event_version: 1
      first_event_from_status: null
      runtime_event_origin: runtime
      append_only: true
      normal_update_or_delete: forbidden
      operation_current_version_status_must_equal_latest_event: DEFERRABLE_INITIALLY_DEFERRED_or_equivalent_transactional_DB_guard

    concurrency_and_active_operation_boundary:
      operation_concurrency_root: pkk_operations.version
      lifecycle_transition_lock: exact_pkk_operation_row_FOR_UPDATE
      one_active_operation_per_exact_profile:
