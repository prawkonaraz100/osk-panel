      source_matrix_enforcement:
        database_boundary: DEFERRABLE_constraint_trigger_or_equivalent_transactional_DB_guard
        browser_or_client_may_choose_source_kind: false
        source_kind_derived_from_canonical_payment_resolution: true
      lifecycle_state_catalog: [pending, fulfilled, requires_reconciliation]
      lifecycle_matrix:
        pending:
          fulfilled_at: null
          requires_reconciliation_at: null
          reconciliation_reason: null
        fulfilled:
          fulfilled_at: nonnull
          requires_reconciliation_at: null
          reconciliation_reason: null
        requires_reconciliation:
          fulfilled_at: null
          requires_reconciliation_at: nonnull
          reconciliation_reason: nonblank
      automatic_transitions:
        - pending_to_fulfilled
        - pending_to_requires_reconciliation
