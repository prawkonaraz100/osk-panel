          exact_settlement_relation:
            source: order_fulfillments[organization_id,order_id,settlement_payment_id]
            target: order_payment_settlements[organization_id,order_id,payment_id]
            on_update: RESTRICT
            on_delete: RESTRICT
          zero_total_settled_at_must_be_null: true
        zero_total:
