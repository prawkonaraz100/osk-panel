    closure_scope_only:
      - order_and_order_item_same_tenant_candidate_keys
      - immutable_item_product_display_price_VAT_discount_snapshot
      - exact_product_kind_reference_boundary_without_one_polymorphic_FK_claim
      - positive_quantity_and_money_precision_rules
      - line_and_order_total_equivalence
      - server_authoritative_order_creation_snapshot

  - id: DB-COM-002
    title: payment_attempt_event_order_state_idempotency_and_reconciliation
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-002
    diagnosis:
      - unpaid_order_can_have_later_payment_attempts_and_browser_return_alone_must_not_mark_it_paid
      - current_order_and_payment_status_columns_are open strings without a closed transition matrix
      - payment_events_have_provider_event_dedupe_but_no exact provider-payment binding or closed out_of_order state application rule
      - multiple_payment_attempts_for_one_order_are_possible_but one successful business effect per order is not closed
      - provider timeout asynchronous callback and direct_bank_transfer require safe pending/reconciliation semantics
    risk:
      - duplicate_or_conflicting_paid_transition
      - late_failed_event_reverts_already_confirmed_payment
      - event_for_provider_A_attached_to_payment_provider_B
      - inventory_granted_from_browser_redirect_or_untrusted_state
      - retry_creates_parallel_payable_effects
    closure_scope_only:
      - exact same_tenant Order-Payment-Event relations
      - payment attempt status and terminal timestamp matrix
      - trusted confirmation authority and webhook dedupe application semantics
      - one successful payment business effect per exact order for current full-payment model
      - payment amount_currency_to_order_snapshot consistency
      - reconciliation and retry safety without inventing provider-specific payload schema

  - id: DB-COM-003
    title: paid_order_exactly_once_grant_orchestration_and_atomicity
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-003
    diagnosis:
      - license_and_exam_purchase_screens_require inventory grant after trusted payment confirmation
      - DB4_6_and_DB4_7_intentionally_deferred purchase-to-inventory grant trigger to DB4_9
      - current payment_webhook only states dedupe_before_business_effect and does_not_define an exact durable grant effect boundary
      - retry_or duplicate webhook must not create a second set of inventory or entitlement effects
      - grant failure must not leave order paid projection claiming fulfillment without a recoverable deterministic state
    risk:
      - duplicate_license_or_exam_units
      - payment_confirmed_but_inventory_missing_without_safe_recovery
      - inventory_granted_before_payment_confirmation
      - partial_grant_of_multi_item_order
    closure_scope_only:
      - durable order fulfillment/grant authority
      - exact once transition from trusted payment confirmation to grant effects
      - retryable deterministic fulfillment after payment without duplicate effects
      - atomicity_or_explicit_recoverable_fulfillment_state_for_multi_item_orders
      - no_redefinition_of_license_assignment_or_exam_reservation_consumption

  - id: DB-COM-004
    title: order_item_to_license_exam_service_grant_exact_provenance_and_quantity_equivalence
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-004
    diagnosis:
      - license_inventory_entries_source_order_item_same_tenant_relation_is_explicitly_deferred_from_DB4_6
      - internal_exam_paid_inventory_source_order_item_same_tenant_relation_is_explicitly_deferred_from_DB4_7
      - service_entitlements_also_reference_order_items_but order_items_have_no_tenant_key
      - purchased_quantity_has_no closed equivalence to the number_or_amount_of_downstream_grants
      - specialized inventory source meaning must remain distinct from free_adjustment_or_operator_grant provenance
    risk:
      - purchased_item_grants_wrong_product_or_wrong_tenant_unit
      - quantity_N_grants_more_or_fewer_than_N_units
      - same_order_item_replayed_into_duplicate_inventory
      - manual_or_free_unit_misrepresented_as_paid_purchase
    closure_scope_only:
      - exact order_item provenance FKs for license exam and generic service grants
      - product_kind_and_product_reference_match_to_downstream_product
      - purchased_quantity_to_grant_cardinality_or_quantity ledger equivalence
      - unique grant ordinal_or_equivalent per order item
      - purchased_vs_nonpurchase provenance matrix

  - id: DB-COM-005
    title: deterministic_purchase_history_display_number_booking_date_status_and_pagination_projection
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-005
    diagnosis:
      - confirmed purchase history exposes Number Order Date BookingDate Amount Status and paginated rows
      - current orders have no deterministic display_number_or_per_tenant_order_sequence
      - current physical orders omit booked_at even though observed_screen_and_API_require_separate booking date
      - created_at alone can tie and must not be the sole stable pagination order
      - status shown in purchase history must be derived_or_guarded from canonical order_payment_fulfillment facts not an independent mutable label
    risk:
      - unstable_history_pagination_with_duplicate_or_skipped_rows
      - nonreproducible_order_number
      - booking_date_disagrees_with_trusted_payment_confirmation
      - UI_status_disagrees_with_payment_or_fulfillment
    closure_scope_only:
      - deterministic tenant order sequence_and_display_number boundary
      - stable default history order_and_pagination tie breaker
      - booking_date source and write_once semantics
      - purchase_history status projection from canonical facts
      - history items and totals remain immutable after order placement

  - id: DB-COM-006
    title: migration_and_legacy_order_payment_grant_reconciliation_safety
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-006
    diagnosis:
      - existing provisional commerce rows may lack tenant_key_on_order_item exact product linkage booked_at and exact downstream grant provenance
      - historical payment events may be insufficient to prove which event caused a paid state
      - legacy license_or_exam inventory may lack provable source_order_item even when it appears paid
      - timestamp_UUID_amount_or_same_tenant coincidence is not sufficient evidence to reconstruct exact purchase lineage
      - migration must preserve already_consumed_or_activated downstream history rather than rewrite it to make commerce constraints pass
    risk:
      - fabricated_purchase_history
      - wrong_order_item_linked_to_existing_inventory
      - duplicate_grants_during_backfill
      - destructive_rewrite_of_license_or_exam_history
    closure_scope_only:
      - preflight evidence classes and reviewed remediation
      - deterministic sequence backfill only with proven order
      - no heuristic payment winner_or_provider_event reconstruction
      - no heuristic inventory_to_order_item pairing
      - no regrant during migration
      - phased constraints after evidence cleanup

  - id: DB-COM-007
    title: generic_service_entitlement_purchase_grant_and_activation_source_integrity
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-007
    diagnosis:
      - service_entitlements_are_preserved_for_paid_or_operator_granted_services_not_modeled_as_license_or_exam_inventory
      - source_order_item_id_and_source_grant_reference_are both nullable in current provisional shape and no exact source XOR matrix is closed
      - explicit activation exactly_once is already intended but entitlement purchase source and activation status equivalence are not closed against commerce history
      - payment_success_for_explicit_activation_mode_must_not_become activation
    risk:
      - entitlement_with_no_provenance_or_two_conflicting_sources
      - wrong_tenant_order_item_entitlement
      - payment_retry_activates_explicit_service_twice
      - entitlement_status_disagrees_with_unique_activation
    closure_scope_only:
      - exact purchase_or_operator_grant provenance matrix
      - same_tenant source_order_item relation
      - service_activation exact entitlement tenant binding
      - activation_mode_status_activation final_state equivalence
      - preserve_explicit_payment_success_is_not_activation

  - id: DB-COM-008
    title: commerce_command_lock_order_and_cross_domain_race_boundary
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-008
    diagnosis:
      - DB4_9_spans Order Payment fulfillment plus three possible downstream grant models and StudentFinance has independent money mutations
      - no canonical lock ordering is defined for order payment confirmation fulfillment and downstream grant insertion
      - webhook_retry manual_reconciliation payment_creation and fulfillment_worker may race on the same order
      - course_cost_charge_creation_may_race_with_course_retry and must remain separate from platform purchase payment
      - without one command concurrency root exactly_once uniqueness alone can still leave inconsistent projection or deadlock prone implementations
    risk:
      - double_fulfillment_or_lost_fulfillment
      - deadlock_between_payment_and_grant_paths
      - paid_order_projection_before_grants_are_consistent
      - duplicate_course_cost_charge_on_retry
    closure_scope_only:
      - canonical concurrency roots and lock order for StudentFinance and Commerce commands
      - payment confirmation vs reconciliation vs fulfillment race winner semantics
      - order item grant ordering deterministic across mixed order
      - charge_from_course_cost idempotency boundary without coupling StudentFinance to platform Commerce
      - audit_outbox intent recorded but physical storage finalization remains DB4_10

