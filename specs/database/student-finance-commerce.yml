      - status_disagrees_with_payment_ledger
      - payment_or_reversal_applied_twice_on_retry
      - cancelled_charge_with_unresolved_valid_money_effects
    closure_scope_only:
      - charge_as_payment_allocation_serialization_root_or_equivalent
      - derived_open_partial_paid_optional_overdue_projection_vs_durable_cancel_state
      - valid_payment_and_reversal_definition
      - no_overpayment_final_state_guard_under_lock
      - cancel_vs_payment_vs_reversal_race_semantics
      - generic_idempotency_claim_usage_and_append_only_audit_intent

  - id: DB-COM-001
    title: order_item_tenant_product_snapshot_price_total_and_quantity_integrity
    severity: P1
    status: RESOLVED
    resolution_ref: resolved_contracts.DB-COM-001
    diagnosis:
      - order_items_currently_lack_organization_id_so_downstream_same_tenant_purchase_provenance_cannot_be_proven_with_composite_FKs
      - product_type_plus_nullable_generic_product_reference_has_no_exact_reference_kind_guard
      - quantity_unit_amount_VAT_line_total_and_snapshot_are_not_tied_by_a_closed_immutable_pricing_contract
      - screen_and_API_require_server_authoritative_price_discount_VAT_and_historical_item_snapshot
