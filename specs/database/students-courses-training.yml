    later_DB4_slices_entered: false

# DB-TRN-007
recognized_external_training_projection_history:
  blocker: DB-TRN-007
  status: PASS
  goal: >-
    Make previous-OSK hours deterministic without collapsing formal history. The
    single theory/practice values shown by the course form become a versioned current
    projection, while independently documented external transfers remain additive.
    Replacements, corrections and revocations preserve lineage, serialize on the
    CourseEnrollment concurrency root and cannot double count an old and new version.

  authority_and_preservation:
    create_screen: specs/screens/course-create.yml
    edit_screen: specs/screens/course-edit.yml
    API_paths: specs/api/paths/students-courses.yaml
    API_schema: specs/api/openapi-components-v1.yaml
    aggregate_blueprint_reference_only: specs/database/core-schema.yml
    aggregate_narrative_reference_only: docs/87-physical-database-schema.md
    course_form_fields_preserved:
      - recognized_external_theory_minutes
      - recognized_external_practical_minutes
    observed_single_value_per_course_part: true
    standalone_external_training_list_create_and_revoke_capabilities_preserved: true
    previous_OSK_source_of_truth: recognized_external_training
    current_OSK_ledger_remains_separate: true
    canonical_storage_unit: minutes
    exact_legal_compatibility_matrix_for_category_or_training_type_change_observed: false

  role_and_provenance_model:
    record_role:
      values: [course_form_projection, documented_transfer]
      purpose: current_projection_semantics_not_audit_provenance
    source_kind:
      values:
        - course_form_initial
        - course_form_revision
        - documented_transfer
        - correction
        - context_revalidation
      purpose: provenance_of_how_this_immutable_business_version_was_created
    source_kind_does_not_define_additive_or_form_semantics: true
    no_latest_created_at_or_max_id_projection_rule: true

  recognized_external_training_strengthening:
    existing_table: recognized_external_training
    add_or_require_fields:
      - record_role_varchar_32_nullable_only_during_migration
      - recognized_for_driving_category_id_uuid_nullable_only_for_noncurrent_legacy_unknown_history
      - recognized_for_training_type_varchar_32_nullable_only_for_noncurrent_legacy_unknown_history
      - supersedes_record_id_uuid_nullable
      - superseded_at_timestamptz_nullable
      - revoked_by_user_id_uuid_nullable
      - revocation_reason_text_nullable
    existing_fields_preserved:
      - id
      - organization_id
      - course_enrollment_id
      - training_part
      - recognized_minutes
      - source_kind
      - source_school_reference
      - evidence_reference
      - reason
      - approved_by_user_id
      - created_at
      - revoked_at
    training_part_values: [theory, practical]
    recognized_minutes:
      type: integer_minutes
      runtime_current_row_minimum: 1
      zero_current_row_forbidden: true
      zero_form_value_representation: absence_of_current_form_projection_row
    business_fields_immutable_after_insert:
      - organization_id
      - course_enrollment_id
      - training_part
      - recognized_minutes
      - record_role
      - source_kind
      - source_school_reference
      - evidence_reference
      - reason
      - approved_by_user_id
      - recognized_for_driving_category_id
      - recognized_for_training_type
      - supersedes_record_id
      - created_at
    lifecycle_markers_mutable_only_by_governed_commands:
      - superseded_at
      - revoked_at
      - revoked_by_user_id
      - revocation_reason
    hard_delete_normal_lifecycle: forbidden
    organization_or_course_rebind_after_insert: forbidden

  row_lifecycle_matrix:
    current: superseded_at_is_null_and_revoked_at_is_null
    superseded: superseded_at_is_not_null_and_revoked_at_is_null
    revoked: revoked_at_is_not_null_and_superseded_at_is_null
    both_superseded_and_revoked: forbidden
    runtime_revoke_pair:
      rule: >-
        For rows revoked by the new runtime contract, revoked_at, revoked_by_user_id
        and revocation_reason are all non-null.
    legacy_revoked_missing_actor_or_reason:
      migration_may_preserve_as_historical_noncurrent_row: true
      fabricate_actor_or_reason: forbidden
    reactivate_same_row_after_revoke_or_supersede: forbidden
    restore_business_effect: create_new_record_with_history_not_clear_old_marker

  lineage_integrity:
    target_candidate_key:
      columns: [organization_id, id, course_enrollment_id, training_part, record_role]
    supersedes_same_tenant_course_part_role_FK:
      source_columns: [organization_id, supersedes_record_id, course_enrollment_id, training_part, record_role]
      target_table: recognized_external_training
      target_columns: [organization_id, id, course_enrollment_id, training_part, record_role]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    at_most_one_successor_per_source:
      type: partial_unique
      columns: [organization_id, supersedes_record_id]
      where: supersedes_record_id_is_not_null
    source_must_preexist_successor: true
    source_must_be_current_before_replacement: true
    replacement_sets_source_superseded_at_same_transaction: true
    self_reference: forbidden
    cycles: forbidden
    lineage_is_linear_not_branching: true
    source_and_current_successor_may_not_both_contribute: true

  course_form_projection:
    role: course_form_projection
    meaning: >-
      The one scalar previous-school value edited in the Course create/edit form for
      a training part. It is versioned history, not an independently additive set.
    current_predicate: record_role_course_form_projection_and_superseded_at_null_and_revoked_at_null
    at_most_one_current_per_course_part:
      type: partial_unique
      columns: [organization_id, course_enrollment_id, training_part]
      where: record_role_course_form_projection_and_superseded_at_null_and_revoked_at_null
    no_current_row_projects_minutes: 0
    create_course_positive_initial_value:
      source_kind: course_form_initial
      supersedes_record_id: null
      category_and_training_type_snapshot_from_new_course: required
      creates_exactly_one_row_for_each_positive_part: true
    create_course_zero_or_omitted_value:
      creates_zero_minute_row: false
      projected_value: 0
    edit_active_course_value_change:
      lock_course_enrollment_FOR_UPDATE: true
      expected_course_version_required: true
      lock_current_form_projection_row_when_present: FOR_UPDATE
      same_value: semantic_noop_for_external_history
      zero_to_positive:
        insert_new_root_row: true
        source_kind: course_form_revision
      positive_to_positive:
        supersede_old_then_insert_successor: true
        source_kind: course_form_revision
      positive_to_zero:
        revoke_current_without_zero_successor: true
        normal_active_edit_reason_code_may_be_system_course_form_value_cleared: true
      one_course_version_increment_for_whole_edit_command: true
      DB_TRN_004_history_event: updated
      requirements_revision_increment_due_only_to_external_minutes_change: false
    terminal_course_form_value_change:
      DB_TRN_004_correction_mode_required: true
      human_reason_and_actor_required: true
      lifecycle_state_unchanged: true
      DB_TRN_004_history_event: closed_course_corrected
    exact_HTTP_course_PATCH_external_field_orchestration: Stage5_acceptance_contract_sync

  documented_transfer_projection:
    role: documented_transfer
    meaning: independently_recognized_documented_external_training_that_is_additive
    current_rows_may_be_multiple_per_course_part: true
    current_predicate: record_role_documented_transfer_and_superseded_at_null_and_revoked_at_null
    create_operation: POST_/course-enrollments/{courseEnrollmentId}/recognized-external-training
    create_semantics:
      idempotency_key_required: true
      permission: external_training.recognize
      expected_course_version_required_for_fresh_command: true
      lock_course_enrollment_FOR_UPDATE: true
      recognized_minutes_must_be_positive: true
      reason_required: true
      record_role: documented_transfer
      source_kind: documented_transfer
      supersedes_record_id: null
      category_and_training_type_snapshot_from_locked_course: required
      course_version_increment: exactly_once
      DB_TRN_004_history_event_if_active: updated
      DB_TRN_004_history_event_if_terminal: closed_course_corrected
      audit_and_outbox_same_transaction: true
    independent_current_transfer_rows_are_summed: true

  correction_replacement_semantics:
    correction_is_signed_delta: false
    correction_is_full_replacement_value: true
    source_may_be_role: [course_form_projection, documented_transfer]
    operation_surface_for_standalone_external_record_correction: Stage5_acceptance_contract_sync
    required:
      - permission
      - reason
      - expected_course_version
      - source_record_id
    fixed_lock_order:
      - course_enrollment_FOR_UPDATE
      - source_external_training_row_FOR_UPDATE
    source_preconditions:
      - source_is_current
      - source_belongs_to_path_course_and_tenant
      - source_role_and_part_preserved
    corrected_positive_value:
      - mark_source_superseded_at
      - insert_successor_with_source_kind_correction
      - set_successor_supersedes_record_id_to_source
      - preserve_role_and_training_part
      - snapshot_current_course_category_and_training_type
    corrected_zero_value:
      route_to: revoke_semantics
    source_business_fields_mutated: false
    course_version_increment: exactly_once
    DB_TRN_004_history_event_if_active: updated
    DB_TRN_004_history_event_if_terminal: closed_course_corrected
    same_idempotency_key_retry: return_prior_result_without_second_successor

  revoke_semantics:
    operation: POST_/course-enrollments/{courseEnrollmentId}/recognized-external-training/{recordId}/revoke
    idempotency_key_required: true
    permission: external_training.recognize
    expected_course_version_required_for_fresh_command: true
    reason_required: true
    fixed_lock_order:
      - course_enrollment_FOR_UPDATE
      - target_external_training_row_FOR_UPDATE
    target_must_be_current: true
    target_must_belong_to_path_tenant_and_course: true
    set:
      - revoked_at_authoritative_server_time
      - revoked_by_user_id_actor
      - revocation_reason
    preserve_business_fields_and_lineage: true
    fresh_revoke_of_superseded_or_already_revoked: conflict_not_current
    same_idempotency_key_retry: return_prior_result_without_second_effect
    course_version_increment: exactly_once
    DB_TRN_004_history_event_if_active: updated
    DB_TRN_004_history_event_if_terminal: closed_course_corrected
    hard_delete: false

  course_context_compatibility_guard:
    current_contributing_row_must_have_context_snapshot: true
    current_row_context_fields:
      - recognized_for_driving_category_id
      - recognized_for_training_type
