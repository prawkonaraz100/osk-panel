      target_table: training_sessions
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
  intentionally_not_solved_by_DB_TRN_001:
    attendance_student_must_equal_course_enrollment_student: DB-TRN-006
    training_session_course_must_equal_ledger_course_when_session_present: DB-TRN-006
