    internal_exam_attempt_compatibility_and_satisfaction: DB4_7
    calendar_resource_overlap_and_booking: DB4_5
    exact_HTTP_attendance_recording_and_correction_If_Match_schema_and_error_codes: Stage5_acceptance_contract_sync
    terminal_session_fact_correction_surface_beyond_credited_time_delta: Stage5_domain_acceptance_sync_if_required

  self_audit:
    attendance_is_bound_to_exact_session_course_and_exact_course_student: PASS
    one_attendance_row_per_single_student_course_session: PASS
    verified_presence_is_required_for_base_credit: PASS
    completed_present_session_has_exactly_one_base_credit: PASS
    completed_absent_session_has_zero_base_credit: PASS
