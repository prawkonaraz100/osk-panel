    - training_session_same_tenant_course_instructor_vehicle_location_is_accepted
    - training_session_cross_tenant_course_is_rejected_by_database
    - training_session_cross_tenant_instructor_is_rejected_by_database
    - training_session_cross_tenant_vehicle_is_rejected_by_database
    - training_session_cross_tenant_location_is_rejected_by_database
    - training_session_null_vehicle_and_location_remain_valid
