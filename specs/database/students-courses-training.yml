      - add_session_terminal_metadata_and_validate_state_matrix
      - verify_every_session_interval_has_positive_whole_minute_duration_and_duration_minutes_matches_interval
      - add_candidate_unique_course_enrollments_organization_id_id_student_id
      - add_candidate_unique_training_sessions_organization_id_id_course_enrollment_id
      - add_candidate_unique_ledger_organization_id_id_course_id_training_part
      - add_attendance_course_enrollment_id_temporarily_nullable
      - verify_each_attendance_student_is_exact_student_of_session_course
      - detect_multiple_attendance_rows_for_one_session_and_require_explicit_remediation
      - backfill_attendance_course_enrollment_id_from_verified_session
      - set_attendance_course_enrollment_id_not_null_and_add_exact_course_composite_FKs
      - replace_weaker_attendance_pair_unique_with_one_attendance_per_session_unique_after_prechecks
      - validate_attendance_status_and_confirmation_pairs_without_guessing_missing_confirmation
      - add_ledger_session_exact_course_composite_FK
      - add_ledger_source_same_course_part_composite_self_FK
      - precheck_duplicate_credit_per_session
      - precheck_credit_for_planned_or_cancelled_session
      - precheck_completed_present_session_without_one_matching_credit
      - precheck_completed_absent_session_with_credit
      - precheck_credit_minutes_part_or_course_mismatch_to_session
      - precheck_duplicate_opening_balance_per_course_part
      - precheck_invalid_source_links_cross_course_cross_part_or_source_type_reversal
      - precheck_duplicate_reversal_of_same_source
      - precheck_negative_course_part_or_session_subtotals
      - require_explicit_reviewed_remediation_for_ambiguous_legacy_session_attendance_or_ledger_never_fabricate_attendance_or_credit
      - add_partial_unique_credit_opening_balance_reversal_constraints
      - add_entry_type_matrix_checks_and_deferrable_guards
      - wire_session_complete_cancel_attendance_and_correction_commands_to_fixed_lock_order
      - add_exactly_once_race_projection_and_negative_tests
    legacy_ambiguous_completed_session_policy: >-
      Never infer presence, confirmation, actor or missing base credit from session
      status alone. If a legacy completed session cannot be proven consistent with
      attendance and ledger evidence, fail migration or require explicit reviewed
      remediation before constraints are enabled.

  tests_required:
    - training_session_status_accepts_only_planned_completed_cancelled
    - training_session_version_is_bigint_at_least_one
    - duration_minutes_equals_positive_whole_minute_timestamp_difference
    - session_PATCH_only_allowed_while_planned_and_recomputes_duration
    - terminal_session_normal_PATCH_is_rejected
    - attendance_course_enrollment_id_matches_session_course_by_composite_FK
    - attendance_student_must_equal_exact_course_enrollment_student_by_composite_FK
    - second_attendance_row_for_same_session_is_rejected
    - attendance_confirmation_actor_and_time_are_both_null_or_both_nonnull
    - attendance_change_after_terminal_session_is_rejected
    - complete_requires_exactly_one_verified_attendance_row
    - complete_present_session_creates_exactly_one_credit_atomically
    - credit_minutes_equal_session_duration_without_45_or_60_minute_rounding
    - theory_session_credit_has_training_part_theory
    - practical_session_credit_has_training_part_practical
    - complete_absent_session_creates_no_credit
    - second_fresh_complete_is_rejected_without_second_credit
    - same_complete_idempotency_key_retry_returns_prior_effect_without_second_credit
    - partial_unique_rejects_second_credit_for_same_session_even_if_application_bug_bypasses_idempotency
    - cancelled_session_has_zero_base_credit
    - complete_cancel_race_cannot_commit_cancelled_session_with_credit
    - course_cancel_vs_session_complete_serializes_on_course_lock
    - course_cancel_after_completed_session_preserves_existing_credit
    - ledger_session_course_mismatch_is_rejected_by_composite_FK
    - credit_for_planned_session_is_rejected_by_final_transaction_guard
    - credit_for_absent_session_is_rejected_by_final_transaction_guard
    - direct_SQL_completed_present_session_without_credit_is_rejected_by_final_transaction_guard
    - opening_balance_requires_positive_minutes_reason_no_session_and_no_source
    - second_opening_balance_same_course_part_is_rejected
    - previous_OSK_recognized_hours_cannot_be_written_as_current_OSK_opening_balance
    - correction_is_nonzero_signed_delta_and_never_updates_source_row
    - correction_source_must_share_tenant_course_and_training_part
    - source_linked_correction_copies_source_training_session_relation_including_null
    - source_entry_cannot_reference_reversal
    - reversal_minutes_equal_exact_negative_of_source_delta
    - same_source_cannot_be_reversed_twice
    - reversal_of_reversal_is_rejected
    - mistaken_reversal_is_remediated_by_new_correction_not_history_delete
    - correction_and_reversal_keep_course_part_total_nonnegative
    - session_linked_correction_chain_keeps_session_subtotal_nonnegative
    - two_manual_corrections_same_expected_course_version_cannot_both_commit
    - terminal_course_hour_correction_uses_closed_course_corrected_history_without_reopening_course
    - current_OSK_theory_projection_is_exact_sum_of_immutable_ledger_theory_entries
    - current_OSK_practical_projection_is_exact_sum_of_immutable_ledger_practical_entries
    - declared_theory_or_practical_minutes_do_not_change_credited_projection
    - external_recognized_training_is_not_in_current_OSK_ledger_projection
    - migration_does_not_fabricate_missing_attendance_or_credit_for_ambiguous_legacy_session
    - migration_detects_wrong_student_attendance_duplicate_credit_cancelled_credit_and_bad_source_links_before_constraints

  intentionally_not_solved_by_DB_TRN_006:
    recognized_external_training_current_projection_and_reversal_history: DB-TRN-007
    final_combined_current_OSK_plus_external_minute_satisfaction: DB-TRN-007_after_DB_TRN_006
