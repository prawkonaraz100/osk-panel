    - ledger_cross_tenant_session_is_rejected_by_database
    - ledger_null_session_remains_valid_for_non_session_entry_types_subject_to_later_DB_TRN_006_rules
    - rewriting_organization_id_to_move_formal_record_between_tenants_is_forbidden
