    - every_training_session_matches_course_organization
    - every_training_session_instructor_matches_session_organization
    - every_nonnull_training_session_vehicle_matches_session_organization
    - every_nonnull_training_session_location_matches_session_organization
    - every_attendance_session_and_student_share_same_organization_before_backfill
