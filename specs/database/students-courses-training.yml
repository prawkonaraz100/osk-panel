# DB-TRN-006
training_attendance_ledger_exactly_once:
  blocker: DB-TRN-006
  status: PASS
  goal: >-
    Close the formal TrainingSession -> verified Attendance -> TrainingHourLedger
    pipeline so a session can credit only the Student enrolled in that exact course,
    base session credit is exactly-once, a cancelled session cannot credit time, and
    every correction or reversal is an immutable compensating entry with a valid
    source lifecycle. Current-OSK credited totals become deterministic in minutes.

  authority_and_preservation:
    legal_pipeline_source: docs/66-formal-student-record-and-theory-exemptions.md
    ledger_ADR: docs/adr/0003-training-hour-ledger.md
    test_policy: docs/84-test-strategy.md
    API_source: specs/api/paths/students-courses.yaml
    API_schema_source: specs/api/openapi-components-v1.yaml
    complete_operation: POST_/training-sessions/{sessionId}/complete
    cancel_operation: POST_/training-sessions/{sessionId}/cancel
    correction_operation: POST_/course-enrollments/{courseEnrollmentId}/training-hour-corrections
    complete_API_promise: session_completed_and_eligible_ledger_entries_created_atomically
    cancel_API_promise: session_cancelled_without_crediting_formal_time
    correction_API_promise: immutable_correction_or_reversal_entry_created
    canonical_storage_unit: minutes
    theory_hour_definition_minutes: 45
    practical_hour_definition_minutes: 60
    declared_course_form_hours_are_not_credited_time: true
    recognized_external_training_remains_separate: true
    external_current_projection_not_solved_here: DB-TRN-007

  course_and_session_candidate_keys:
    course_enrollments_exact_student_target:
      columns: [organization_id, id, student_id]
      unique_constraint_required: true
      purpose: attendance_exact_course_student_composite_FK_target
    training_sessions_exact_course_target:
      columns: [organization_id, id, course_enrollment_id]
      unique_constraint_required: true
      purpose: attendance_and_ledger_exact_course_composite_FK_target
    ledger_source_target:
      columns: [organization_id, id, course_enrollment_id, training_part]
      unique_constraint_required: true
      purpose: correction_reversal_same_tenant_same_course_same_part_self_FK_target

  training_session_physical_lifecycle:
    formal_creditable_session_types: [theory, practical]
    status_values: [planned, completed, cancelled]
    initial_status: planned
    version:
      canonical_type: bigint
      nullable: false
      default: 1
      check: version_gte_1
      purpose: concurrency_root_for_session_schedule_attendance_and_terminal_state
    duration_minutes:
      nullable: false
      check: duration_minutes_gt_0
      client_authority: false
      canonical_rule: >-
        duration_minutes equals the exact positive whole-minute difference between
        ends_at and starts_at. A formal session interval must therefore resolve to a
        whole number of minutes; the backend recomputes duration when planned times
        change. There is no rounding into 45- or 60-minute blocks.
    add_terminal_metadata:
      - completed_at_timestamptz_nullable
      - completed_by_user_id_uuid_nullable
      - cancelled_at_timestamptz_nullable
      - cancelled_by_user_id_uuid_nullable
      - cancellation_reason_text_nullable
    planned_state_check: >-
      status = 'planned' AND completed_at IS NULL AND completed_by_user_id IS NULL AND
      cancelled_at IS NULL AND cancelled_by_user_id IS NULL AND cancellation_reason IS NULL
    completed_state_check: >-
      status = 'completed' AND completed_at IS NOT NULL AND completed_by_user_id IS NOT NULL AND
      cancelled_at IS NULL AND cancelled_by_user_id IS NULL AND cancellation_reason IS NULL
    cancelled_state_check: >-
      status = 'cancelled' AND cancelled_at IS NOT NULL AND cancelled_by_user_id IS NOT NULL AND
      cancellation_reason IS NOT NULL AND completed_at IS NULL AND completed_by_user_id IS NULL
    terminal_states_mutually_exclusive: true
    normal_PATCH_requires_status: planned
    normal_PATCH_may_change:
      - starts_at
      - ends_at
      - instructor_id
      - vehicle_id
      - location_id
    normal_PATCH_recomputes_duration_minutes: true
    normal_PATCH_increments_session_version_once: true
    completed_or_cancelled_session_business_fields_are_immutable_in_normal_flow: true
    hard_delete_terminal_session: forbidden
    exact_public_session_status_and_attendance_recording_schema_sync: Stage5_acceptance_contract_sync

  attendance_exact_course_integrity:
    existing_table: training_session_attendance
    DB_TRN_001_organization_id_kept: true
    add_column:
      name: course_enrollment_id
      type: uuid
      nullable: false
      purpose: prove_session_and_student_belong_to_the_exact_same_formal_enrollment
    one_attendance_row_per_session:
      type: unique
      columns: [organization_id, training_session_id]
      replaces_weaker_pair_uniqueness_as_canonical_boundary: true
      reason: one TrainingSession belongs to one CourseEnrollment and that enrollment has one Student
    session_exact_course_FK:
      source_columns: [organization_id, training_session_id, course_enrollment_id]
      target_table: training_sessions
      target_columns: [organization_id, id, course_enrollment_id]
      on_update: RESTRICT
      on_delete: RESTRICT
    student_exact_course_FK:
      source_columns: [organization_id, course_enrollment_id, student_id]
      target_table: course_enrollments
      target_columns: [organization_id, id, student_id]
      on_update: RESTRICT
      on_delete: RESTRICT
    attendance_status_values: [present, absent]
    confirmation_pair_check: >-
      (confirmed_at IS NULL AND confirmed_by_user_id IS NULL) OR
      (confirmed_at IS NOT NULL AND confirmed_by_user_id IS NOT NULL)
    verified_attendance_predicate: confirmed_at_is_not_null_and_confirmed_by_user_id_is_not_null
    credit_eligible_predicate: verified_attendance_and_status_present
    attendance_mutation_requires_session_status: planned
    attendance_mutation_lock_order: [course_enrollment_FOR_UPDATE, training_session_FOR_UPDATE]
    attendance_mutation_increments_session_version_once: true
    attendance_after_session_terminal_is_immutable_in_normal_flow: true
    attendance_hard_delete_after_terminal_session: forbidden

  training_hour_ledger_strengthening:
    existing_table: training_hour_ledger_entries
    append_only: true
    allowed_entry_types: [credit, opening_balance, correction, reversal]
    allowed_training_parts: [theory, practical]
    actor_user_id_required_for_all_new_entries: true
    created_at_authoritative_server_time: true
    update_or_delete_existing_ledger_entry_by_normal_application: forbidden
    session_exact_course_FK_when_present:
      source_columns: [organization_id, training_session_id, course_enrollment_id]
      target_table: training_sessions
      target_columns: [organization_id, id, course_enrollment_id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    source_entry_same_tenant_course_part_FK_when_present:
      source_columns: [organization_id, source_entry_id, course_enrollment_id, training_part]
      target_table: training_hour_ledger_entries
      target_columns: [organization_id, id, course_enrollment_id, training_part]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    base_credit_exactly_once:
      type: partial_unique
      columns: [organization_id, training_session_id]
      where: entry_type_equals_credit
      effect: at_most_one_base_credit_per_session
    opening_balance_exactly_once_per_part:
      type: partial_unique
      columns: [organization_id, course_enrollment_id, training_part]
      where: entry_type_equals_opening_balance
      effect: repeated_current_OSK_import_cannot_silently_stack_multiple_opening_balances
    source_reversal_exactly_once:
      type: partial_unique
      columns: [organization_id, source_entry_id]
      where: entry_type_equals_reversal
      effect: one_source_entry_cannot_be_reversed_twice

  ledger_entry_type_matrix:
    credit:
      minutes: positive
      training_session_id: required
      source_entry_id: null
      reason: nullable_system_context
      session_status_required_at_final_transaction_state: completed
      session_type_to_training_part:
        theory: theory
        practical: practical
      minutes_must_equal_session_duration_minutes: true
      entry_created_only_by_session_complete_transaction: true
    opening_balance:
      minutes: positive
      training_session_id: null
      source_entry_id: null
      reason: required
      explicit_import_mode_required: true
      source: current_OSK_opening_balance_only
      recognized_previous_OSK_hours_forbidden_here: use_recognized_external_training
    correction:
      minutes: nonzero_signed_delta
      reason: required
      source_entry_id: nullable
      if_source_entry_null_training_session_id_must_be_null: true
      if_source_entry_present:
        source_entry_allowed_types: [credit, opening_balance, correction]
        source_entry_type_reversal_forbidden: true
        training_session_id_must_equal_source_training_session_id_including_null: true
        same_course_and_training_part_enforced_by_self_FK: true
      original_source_row_mutated: false
    reversal:
      minutes: exact_negative_of_source_entry_minutes
      reason: required
      source_entry_id: required
      source_entry_allowed_types: [credit, opening_balance, correction]
      source_entry_type_reversal_forbidden: true
      training_session_id_must_equal_source_training_session_id_including_null: true
      same_course_and_training_part_enforced_by_self_FK: true
      original_source_row_mutated: false
      reversal_of_reversal_as_normal_flow: forbidden
    enforcement: row_checks_plus_deferrable_constraint_triggers_or_equivalent_transactional_DB_guards

  completed_session_credit_equivalence_guard:
    enforcement: deferrable_constraint_trigger_or_equivalent_transactional_database_guard
    final_transaction_invariants:
      - planned_session_has_zero_credit_entries
      - cancelled_session_has_zero_credit_entries
      - completed_session_has_exactly_one_verified_attendance_row
      - completed_present_session_has_exactly_one_credit_entry
      - completed_absent_session_has_zero_credit_entries
      - credit_entry_course_equals_session_course
      - credit_entry_training_part_matches_session_type
      - credit_entry_minutes_equals_session_duration_minutes
    direct_SQL_or_import_cannot_create_credit_for_planned_cancelled_or_absent_session: true
    direct_SQL_or_import_cannot_mark_present_session_completed_without_matching_credit: true

  session_completion_transaction:
    operation: POST_/training-sessions/{sessionId}/complete
    idempotency_key_required: true
    fixed_lock_order:
      - course_enrollment_FOR_UPDATE
      - training_session_FOR_UPDATE
      - training_session_attendance_row_FOR_UPDATE
    course_must_be_active_after_lock: true
    session_precondition_status: planned
    attendance_must_exist_exactly_once: true
    attendance_must_be_verified: true
    duration_recomputed_and_verified_against_times: true
    if_attendance_present:
      - insert_exactly_one_credit_with_session_course_part_and_duration
    if_attendance_absent:
      - insert_no_credit
    atomically:
      - set_session_completed_terminal_metadata
      - increment_session_version_once
      - satisfy_completed_session_credit_equivalence_guard
      - write_audit_and_outbox_same_transaction
    course_version_increment_for_normal_session_completion: false
    reason: >-
      Session is its own concurrency aggregate. The Course row is locked to serialize
      against course close/cancel and eligibility decisions, but routine child-session
      completion does not artificially invalidate unrelated Course metadata edits.
    same_idempotency_key_retry: return_prior_result_without_duplicate_credit
    fresh_second_complete_after_completed: conflict_already_completed

  session_cancellation_transaction:
    operation: POST_/training-sessions/{sessionId}/cancel
    idempotency_key_required: true
    reason_required: true
    fixed_lock_order:
      - course_enrollment_FOR_UPDATE
      - training_session_FOR_UPDATE
    session_precondition_status: planned
    parent_course_may_already_be_terminal_for_cleanup: true
    atomically:
      - verify_zero_credit_entries
      - set_session_cancelled_terminal_metadata
      - increment_session_version_once
      - preserve_any_existing_attendance_as_history_without_credit
      - write_audit_and_outbox_same_transaction
    fresh_cancel_after_session_completed: conflict_requires_explicit_correction_not_cancel
    same_idempotency_key_retry: return_prior_result_without_duplicate_effect
    course_cancel_does_not_auto_cancel_completed_sessions_or_reverse_existing_credit: true

  complete_vs_cancel_and_course_close_races:
    session_complete_and_session_cancel_share_course_then_session_lock_order: true
    complete_wins_before_session_cancel:
      result: completed_session_and_optional_exactly_one_credit_then_cancel_conflicts
    session_cancel_wins_before_complete:
      result: cancelled_session_then_complete_conflicts_and_no_credit
    course_cancel_or_complete_wins_course_lock_first:
      session_complete_after_lock: rejected_because_parent_not_active
    session_complete_wins_course_lock_first:
      result: session_completion_commits_then_course_command_rechecks_latest_ledger_and_may_continue
    impossible_committed_states:
      - cancelled_session_with_base_credit
      - completed_present_session_without_base_credit
      - completed_absent_session_with_base_credit
      - credit_for_wrong_course_student_or_wrong_training_part

  correction_and_reversal_command:
    operation: POST_/course-enrollments/{courseEnrollmentId}/training-hour-corrections
    idempotency_key_required: true
    permission_required: true
    reason_required_by_existing_request: true
    expected_course_version_required_for_fresh_manual_correction: true
    exact_HTTP_If_Match_surface_sync: Stage5_acceptance_contract_sync
    fixed_lock_order:
      - course_enrollment_FOR_UPDATE
      - source_ledger_entry_FOR_UPDATE_when_present
    source_entry_id_validation:
      same_tenant_same_course_same_part: database_self_FK
      source_may_not_be_reversal: true
      source_exists_before_insert: true
    deterministic_entry_type_mapping_for_existing_request_shape:
      if_source_present_and_minutes_equals_exact_negative_of_source_minutes: reversal
      otherwise: correction
    standalone_correction_when_source_null: allowed_with_reason_and_permission
    atomically:
      - validate_final_course_part_projection_nonnegative
      - validate_final_session_subtotal_nonnegative_when_source_is_session_linked
      - insert_immutable_correction_or_reversal
      - increment_course_version_once
      - append_DB_TRN_004_updated_event_if_course_active_or_closed_course_corrected_if_terminal
      - write_audit_and_outbox_same_transaction
    requirements_revision_changed: false
    source_or_prior_entries_rewritten_or_deleted: false
    same_idempotency_key_retry: return_prior_result_without_second_ledger_entry
    concurrent_same_expected_course_version_corrections: at_most_one_commits

  correction_chain_policy:
    correction_of_credit_opening_balance_or_correction: allowed
    reversal_of_credit_opening_balance_or_correction: allowed_once_per_source
    reversal_of_reversal: forbidden
    reversal_neutralizes_only_its_direct_source_delta: true
    reversal_does_not_cascade_delete_or_rewrite_sibling_corrections: true
    mistaken_reversal_is_not_deleted_or_reversed_by_reversal_of_reversal: true
    mistaken_reversal_remediation: create_new_audited_correction_with_reason
    cycles_or_self_reference: forbidden
    source_entry_must_preexist_current_entry: true

  current_OSK_projection:
    theory_minutes: sum_training_hour_ledger_minutes_where_training_part_theory
    practical_minutes: sum_training_hour_ledger_minutes_where_training_part_practical
    projection_includes_entry_types: [credit, opening_balance, correction, reversal]
    projection_excludes_declared_course_form_fields: true
    projection_excludes_recognized_external_training: true
    course_part_total_must_never_be_negative: true
    source_linked_session_subtotal_must_never_be_negative: true
    external_component_joined_only_after_DB_TRN_007: true
    no_rounding_to_training_hour_blocks: true
    theory_45_and_practical_60_are_requirement_unit_definitions_not_ledger_rounding_rules: true

  completion_minutes_boundary:
    fresh_requirement_profile_required_from_DB_TRN_005: true
    current_OSK_credited_minutes_now_deterministic: true
    recognized_external_minutes_not_yet_finalized: DB-TRN-007
    final_combined_required_minutes_gate: >-
      Do not mark the combined current-OSK-plus-recognized-external minimum check as
      closed until DB-TRN-007 defines the current external projection. DB-TRN-006
      closes the current-OSK ledger component and exactly-once arithmetic only.
    internal_exam_gate: DB4_7

  migration_design:
    migrations_not_generated_in_this_step: true
    steps_when_later_generated:
      - widen_training_sessions_version_to_bigint_not_null_default_1_check_gte_1
