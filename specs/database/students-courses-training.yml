meta:
  project: osk-panel
  scope: students_courses_training_core_v1
  status: DB_TRN_001_002_003_004_PASS_4_P1_BLOCKERS_OPEN
  stage: DB4_4_STUDENTS_COURSES_TRAINING_LEDGER
  created_at: 2026-09-06
  narrative: docs/108-stage-4-students-courses-training-ledger-audit.md
  aggregate_blueprint: specs/database/core-schema.yml
  aggregate_narrative: docs/87-physical-database-schema.md
  resource_dependency: specs/database/staff-locations-vehicles.yml
  identity_dependency: specs/database/identity-rbac.yml
  authority_rule: >-
    This bounded-context specification is authoritative for Students/Courses/
    Training physical semantics while DB4_4 is being closed. It augments the
    aggregate core schema. Aggregate core-schema.yml and docs/87 remain unchanged
    until the final DB4_4 aggregate synchronization gate.

principles:
  tenant_owned_relation_must_be_physically_or_transactionally_same_tenant: true
  organization_id_is_not_client_authority: true
  tenant_key_is_derived_from_authenticated_context_or_validated_parent: true
  cross_tenant_formal_training_relation_is_forbidden: true
  formal_history_uses_RESTRICT_not_destructive_cascade: true
  global_users_and_global_dictionaries_do_not_require_fake_tenant_keys: true
  aggregate_sync_deferred_until_final_DB4_4_gate: true
  pre_course_student_profile_may_exist_before_formal_identity_is_complete: true
  formal_course_enrollment_requires_legally_complete_student_identity: true
  student_profile_is_durable_and_archive_is_state_not_delete: true
  student_mutations_use_one_concurrency_root: true
  student_archive_must_not_silently_cancel_or_rewrite_course_history: true
  course_lifecycle_state_is_derived_from_terminal_timestamps_not_parallel_mutable_status: true
  course_stage_and_lifecycle_history_is_append_only: true
  course_terminal_state_changes_require_dedicated_serialized_commands: true
  current_step_scope: course_lifecycle_stage_history_cancel_restore_only

open_blockers_after_this_step:
  - DB-TRN-005
  - DB-TRN-006
  - DB-TRN-007
  - DB-TRN-008

# DB-TRN-001
same_tenant_integrity:
  blocker: DB-TRN-001
  status: PASS
  goal: >-
    Student, CourseEnrollment, requirement/exemption/external-training records,
    TrainingSession, attendance and TrainingHourLedger relations must be unable to
    connect tenant-owned resources from different organizations even when
    application-level relation validation is bypassed.

  tenant_candidate_keys_required:
    students:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    course_enrollments:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    training_sessions:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    staff_profiles:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-001
    locations:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-002
    vehicles:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-002

  tenant_key_policy:
    required_nonnull_organization_id:
      - students
      - student_learning_accounts
      - course_enrollments
      - training_requirement_profiles
      - course_exemption_decisions
      - recognized_external_training
      - training_sessions
      - training_session_attendance
      - training_hour_ledger_entries
    organization_id_mutation_after_insert: forbidden_for_normal_domain_lifecycle
    moving_formal_record_between_organizations_by_rewriting_organization_id: forbidden
    client_supplied_organization_id_as_authority: forbidden
    application_rule: >-
      Create/update actions derive organization scope from the active membership or
      validated parent resource. The database composite foreign keys below are the
      final relation boundary and must still reject a malformed import or backend bug.

  students_default_location:
    source_table: students
    source_columns: [organization_id, default_location_id]
    target_table: locations
    target_columns: [organization_id, id]
    nullable_relation: true
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT
    effect: nonnull_default_location_must_belong_to_student_organization

  student_learning_account_student:
    source_table: student_learning_accounts
    source_columns: [organization_id, student_id]
    target_table: students
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT
    note: >-
      user_id remains a relation to the global User identity. A global User may
      legitimately participate in more than one organization, so no fake tenant
      composite FK to users is introduced here.

  course_enrollment_relations:
    student_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, student_id]
      target_table: students
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    lead_instructor_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, lead_instructor_id]
      target_table: staff_profiles
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    location_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, location_id]
      target_table: locations
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    driving_category_relation:
      target_is_global_dictionary: true
      tenant_composite_FK_not_required: true

  training_requirement_profile_course:
    source_table: training_requirement_profiles
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  course_exemption_decision_course:
    source_table: course_exemption_decisions
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  recognized_external_training_course:
    source_table: recognized_external_training
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  training_session_relations:
    course_same_organization:
      source_table: training_sessions
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    instructor_same_organization:
      source_table: training_sessions
      source_columns: [organization_id, instructor_id]
      target_table: staff_profiles
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    vehicle_same_organization:
      source_table: training_sessions
      source_columns: [organization_id, vehicle_id]
      target_table: vehicles
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    location_same_organization:
      source_table: training_sessions
      source_columns: [organization_id, location_id]
      target_table: locations
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT

  training_session_attendance:
    organization_id_change:
      existing_blueprint_has_column: false
      canonical_change: add_nonnull_organization_id
      foreign_key: organizations.id
      reason: >-
        Attendance needs an explicit tenant key so both the session and student
        references can be protected by composite same-organization foreign keys.
    uniqueness_preserved_in_this_step:
      columns: [training_session_id, student_id]
      note: >-
        DB-TRN-001 does not redesign attendance exactly-once or same-course student
        semantics. The existing pair uniqueness is preserved; deeper credit rules
        remain DB-TRN-006.
    session_same_organization:
      source_columns: [organization_id, training_session_id]
      target_table: training_sessions
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    student_same_organization:
      source_columns: [organization_id, student_id]
      target_table: students
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT

  training_hour_ledger_relations:
    course_same_organization:
      source_table: training_hour_ledger_entries
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    session_same_organization_when_present:
      source_table: training_hour_ledger_entries
      source_columns: [organization_id, training_session_id]
      target_table: training_sessions
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    source_entry_relation:
      lifecycle_and_exactly_once_semantics: deferred_to_DB_TRN_006
      no_change_in_DB_TRN_001: true

  intentionally_not_solved_by_DB_TRN_001:
    attendance_student_must_equal_course_enrollment_student: DB-TRN-006
    training_session_course_must_equal_ledger_course_when_session_present: DB-TRN-006
    session_completion_exactly_once_credit: DB-TRN-006
    cancelled_session_credit_guard: DB-TRN-006
    ledger_correction_reversal_source_entry_lifecycle: DB-TRN-006
    student_PESEL_or_birth_date_identity_branch: DB-TRN-002
    student_archive_restore_and_versioning: DB-TRN-003
    course_stage_cancel_restore_history: DB-TRN-004
    requirement_context_reproducibility: DB-TRN-005
    external_training_current_projection_and_reversal_history: DB-TRN-007
    course_required_PKK_atomic_persistence_boundary: DB-TRN-008
    learning_account_license_credentials_lifecycle: DB4_6
    PKK_provider_retry_reconciliation: DB4_8

  migration_design:
    migrations_not_generated_in_this_step: true
    order_when_DB4_4_migrations_are_later_generated:
      - add_or_verify_candidate_unique_students_organization_id_id
      - add_or_verify_candidate_unique_course_enrollments_organization_id_id
      - add_or_verify_candidate_unique_training_sessions_organization_id_id
      - verify_existing_staff_location_vehicle_candidate_keys_from_DB4_3
      - run_all_existing_cross_tenant_prechecks_before_new_FKs
      - add_training_session_attendance_organization_id_as_temporarily_nullable
      - verify_every_attendance_session_and_student_have_same_organization
      - backfill_attendance_organization_id_from_verified_training_session_organization_id
      - set_training_session_attendance_organization_id_not_null_and_FK_organizations
      - add_all_composite_same_tenant_foreign_keys
      - rerun_cross_tenant_negative_constraint_tests
    attendance_backfill_rule: >-
      Never silently reassign attendance to a different student/session/organization.
      If existing attendance joins a session and student from different organizations,
      fail migration and require explicit security/data remediation before retry.
    general_invalid_row_policy: >-
      Fail migration or perform an explicitly reviewed security remediation. Never
      auto-correct a cross-tenant relation by moving a formal row to another tenant.

  migration_prechecks_required:
    - every_student_default_location_is_null_or_same_organization
    - every_student_learning_account_matches_student_organization
    - every_course_enrollment_matches_student_organization
