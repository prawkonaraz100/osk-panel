# DB-TRN-003
student_concurrency_archive_restore_lifecycle:
  blocker: DB-TRN-003
  status: PASS
  goal: >-
    Make Student profile updates, archive, restore and formal course creation safe
    under concurrency without deleting or silently mutating formal history. Student
    archive is a visibility/lifecycle state of one durable row, not a hidden course
    cancellation command.

  authority_and_api_surface:
    student_response_version_source: specs/api/openapi-components-v1.yaml
    update_operation: PATCH_/students/{studentId}
    update_concurrency_header: If-Match
    archive_operation: POST_/students/{studentId}/archive
    restore_operation: POST_/students/{studentId}/restore
    archive_restore_idempotency_key_present: true
    hard_delete_student_normal_lifecycle: forbidden

  students_physical_model:
    add_column:
      name: version
      type: bigint
      nullable: false
      default: 1
      check: version_gte_1
      purpose: optimistic_concurrency_root_for_student_profile_and_archive_state
    existing_archive_columns:
      archived_at: nullable_timestamptz
      archived_by_user_id: nullable_uuid
    archive_status_derived_from_archived_at: true
    archive_status_separate_boolean_column_required: false
    organization_id_mutation: forbidden
    archived_at_or_archived_by_mutation_via_generic_profile_PATCH: forbidden

  version_semantics:
    concurrency_root: students.version
    material_profile_update_increments_once: true
    material_identity_branch_update_increments_once: true
    successful_archive_state_change_increments_once: true
    successful_restore_state_change_increments_once: true
    semantic_noop_does_not_increment: true
    stale_expected_version_has_no_partial_write: true
    version_returned_in_student_projection: true
    ETag_or_If_Match_represents_current_student_version: true

  profile_update_transaction:
    expected_version_required_for_mutating_profile_command: true
    expected_version_source: If-Match
    lock_student_row: FOR_UPDATE
    compare_expected_version_after_lock: true
    stale_version_result: conflict_or_precondition_failed_without_write
    apply_field_changes_only_after_version_match: true
    identity_changes_must_still_pass_DB_TRN_002: true
    default_location_changes_must_still_pass_DB_TRN_001: true
    archive_state_cannot_be_changed_through_profile_patch: true
    archived_profile_business_field_correction:
      database_does_not_forbid_only_because_archived: true
      authorization_and_UI_policy_may_be_narrower: true
      same_version_and_identity_audit_rules_still_apply: true
    audit_and_outbox_same_transaction_for_sensitive_or_material_change: true
    note_on_API_contract: >-
      Stage-3 OpenAPI already references If-Match on Student PATCH. Runtime/domain
      policy treats the expected version as required for mutation; exact HTTP
      required-marker/428 representation is an API/acceptance synchronization item,
      not a reason to weaken the database concurrency contract in DB4_4.

  course_creation_vs_archive_serialization:
    course_enrollment_create_must_lock_student_row: FOR_UPDATE
    after_lock_create_requires_student_archived_at_null: true
    after_lock_create_requires_DB_TRN_002_formal_identity: true
    database_guard:
      enforcement: deferrable_constraint_trigger_or_equivalent_transactional_DB_guard
      course_insert_or_student_rebind_requires_nonarchived_student: true
      direct_SQL_or_import_cannot_bypass_active_student_requirement: true
    race_rule: >-
      Course creation and Student archive serialize on the same Student row. If
      course creation commits first, archive sees the newly open enrollment and is
      rejected. If archive commits first, course creation sees archived_at non-null
      and is rejected. The system must never commit archived Student + newly open
      CourseEnrollment from this race.

  archive_open_course_guard:
    policy: archive_does_not_silently_cancel_interrupt_complete_or_rewrite_courses
    minimal_open_course_predicate_for_DB_TRN_003: >-
      course_enrollments.student_id = student.id AND
      completed_at IS NULL AND interrupted_at IS NULL AND cancelled_at IS NULL
    archive_when_any_matching_course_exists: reject_conflict
    why_minimal_predicate_is_used_now: >-
      DB-TRN-004 owns the complete Course lifecycle/stage matrix. DB-TRN-003 only
      needs the conservative boundary that a clearly non-terminal enrollment blocks
      archive. DB-TRN-004 may refine the canonical open/terminal predicate but may
      not weaken the rule that Student archive has no hidden course-state side effect.
    historical_terminal_courses_may_remain_linked_to_archived_student: true
    archived_student_history_hard_delete_or_detach: forbidden

  archive_transaction:
    idempotency_claim_before_effect: true
    lock_student_row: FOR_UPDATE
    if_already_archived:
      state_idempotent_noop: true
      version_increment: false
      existing_identity_and_history_unchanged: true
    if_active:
      steps:
        - verify_tenant_and_permission
        - verify_no_open_course_using_archive_guard_after_student_lock
        - set_archived_at
        - set_archived_by_user_id
        - increment_version_once
        - write_audit_and_outbox_same_transaction
      course_rows_mutated: false
      training_sessions_attendance_ledger_mutated: false
      PESEL_or_birth_date_identity_mutated: false
    transaction_failure_rolls_back_archive_version_audit_outbox: true

  restore_transaction:
    idempotency_claim_before_effect: true
    lock_student_row: FOR_UPDATE
    if_already_active:
      state_idempotent_noop: true
      version_increment: false
    if_archived:
      steps:
        - verify_tenant_and_permission
        - clear_archived_at
        - clear_archived_by_user_id
        - increment_version_once
        - write_audit_and_outbox_same_transaction
      historical_course_rows_changed: false
      historical_training_rows_changed: false
      PESEL_unique_claim_changed: false
      restore_reuses_same_student_id: true
    restore_does_not_reopen_cancelled_completed_or_interrupted_course: true
    restore_does_not_create_course: true
    transaction_failure_rolls_back_restore_version_audit_outbox: true

  edit_archive_restore_races:
    all_three_mutation_families_lock_same_student_row: true
    PATCH_then_archive:
      allowed_sequence: >-
        PATCH may commit first and increment version; archive then observes the
        latest committed Student state, applies its own checks and increments again.
      lost_update: false
    archive_then_stale_PATCH:
      result: stale_expected_version_conflict
      archived_state_preserved: true
    archive_vs_restore:
      serialized_by_student_row_lock: true
      each_command_evaluates_state_after_lock: true
      duplicate_same_state_command_is_noop: true
    two_PATCH_same_expected_version:
      at_most_one_can_commit: true
      loser: stale_version_conflict_without_partial_write

  learning_access_and_license_boundary:
    student_archive_auto_revokes_or_deletes_learning_account: false_in_this_slice
    student_restore_auto_reactivates_learning_access: false_in_this_slice
    detailed_learning_access_license_effects: deferred_to_DB4_6
    reason: >-
      DB-TRN-003 must not invent DB4_6 credential/license lifecycle. Student archive
      only closes the Student/formal-course concurrency boundary here.

  formal_history_and_delete_policy:
    student_hard_delete: forbidden_for_normal_archive
    course_enrollment_hard_delete_on_student_archive: forbidden
    training_session_hard_delete_on_student_archive: forbidden
    attendance_hard_delete_on_student_archive: forbidden
    ledger_hard_delete_on_student_archive: forbidden
    foreign_key_default: RESTRICT
    archive_preserves_DB_TRN_002_identity_claims: true

  migration_design:
    migrations_not_generated_in_this_step: true
    steps_when_later_generated:
      - add_students_version_bigint_not_null_default_1_check_gte_1
      - verify_all_existing_student_versions_or_initialize_legacy_rows_to_1
      - precheck_archived_students_for_minimal_open_course_conflicts
      - require_explicit_data_remediation_for_archived_student_with_open_course_never_auto_cancel_course
      - install_course_insert_or_rebind_guard_requiring_nonarchived_student_and_DB_TRN_002_identity
      - install_archive_guard_against_open_course_predicate_with_student_row_serialization
      - wire_profile_update_archive_restore_commands_to_students_version
      - add_concurrency_and_archive_race_invariant_tests
    existing_archived_student_with_open_course_policy: fail_migration_or_explicit_reviewed_remediation

  tests_required:
    - new_or_migrated_student_version_is_at_least_one
    - profile_PATCH_with_current_expected_version_commits_and_increments_version_once
    - profile_PATCH_with_stale_expected_version_is_rejected_without_partial_write
    - two_profile_PATCH_commands_with_same_expected_version_cannot_both_commit
    - identity_branch_update_still_passes_DB_TRN_002_and_increments_version_once
    - profile_PATCH_cannot_directly_set_or_clear_archived_at_or_archived_by
    - archive_active_student_without_open_course_sets_archive_fields_and_increments_version_once
    - repeated_archive_of_already_archived_student_is_state_noop_without_version_increment
    - archive_student_with_open_course_is_rejected_without_course_mutation
    - archive_with_only_terminal_historical_courses_preserves_all_course_rows
    - archive_does_not_delete_or_rewrite_sessions_attendance_or_ledger
    - course_create_for_archived_student_is_rejected_by_database_guard
    - concurrent_course_create_and_student_archive_cannot_commit_archived_student_with_new_open_course
    - archive_then_stale_profile_PATCH_returns_conflict_and_preserves_archive
    - profile_PATCH_then_archive_can_serialize_without_lost_update
    - restore_archived_student_clears_archive_fields_and_increments_version_once
    - repeated_restore_of_active_student_is_state_noop_without_version_increment
    - restore_reuses_same_student_row_and_does_not_reopen_or_create_courses
    - archive_restore_does_not_release_or_recreate_PESEL_identity_claim
    - student_archive_does_not_hard_delete_formal_history
    - migration_detects_archived_student_with_open_course_before_enabling_guard

  intentionally_not_solved_by_DB_TRN_003:
    complete_course_stage_timestamp_matrix: DB-TRN-004
    course_stage_transition_history: DB-TRN-004
    course_cancel_restore_and_closed_course_correction_semantics: DB-TRN-004
    requirement_context_reproducibility: DB-TRN-005
    attendance_ledger_exactly_once: DB-TRN-006
    external_training_current_projection_history: DB-TRN-007
    course_required_PKK_persistence_boundary: DB-TRN-008
    learning_account_license_credentials_lifecycle: DB4_6
    exact_HTTP_If_Match_required_marker_and_428_acceptance_sync: Stage5_acceptance_contract_sync

  self_audit:
    student_version_concurrency_root_defined: PASS
    stale_profile_update_cannot_silently_overwrite: PASS
    edit_archive_restore_share_student_row_serialization_boundary: PASS
    course_create_archive_race_closed: PASS
    archived_student_cannot_receive_new_formal_course: PASS
    archive_with_open_course_is_rejected_without_hidden_course_mutation: PASS
    terminal_formal_history_is_preserved: PASS
    restore_reuses_same_row_and_does_not_reopen_history: PASS
    DB_TRN_002_identity_and_PESEL_archive_rules_preserved: PASS
    DB_TRN_004_course_lifecycle_matrix_not_solved_early: PASS
    DB4_6_learning_access_lifecycle_not_solved_early: PASS
    aggregate_core_schema_not_modified_in_this_step: PASS
    aggregate_docs87_not_modified_in_this_step: PASS
    Laravel_migrations_created: false
    later_DB4_slices_entered: false

# DB-TRN-004
course_lifecycle_stage_history_cancel_restore:
  blocker: DB-TRN-004
  status: PASS
  goal: >-
    Give CourseEnrollment one contradiction-free lifecycle model, durable stage and
    lifecycle history, and one serialized concurrency boundary for update, stage
    transition, completion, interruption, cancellation, restore and closed-course
    correction without hard-deleting or silently rewriting formal history.

  authority_and_preservation:
    stage_source: specs/screens/student-detail.yml
    API_source: specs/api/paths/students-courses.yaml
    API_schema_source: specs/api/openapi-components-v1.yaml
    edit_source: specs/screens/course-edit.yml
    delete_source: specs/screens/course-delete.yml
    legal_completion_interruption_source: docs/66-formal-student-record-and-theory-exemptions.md
    confirmed_training_stage_values:
      - unassigned
      - theory
      - practice
      - documentation
      - word_exam
      - supplementary_training
      - training_completed
    exact_competitor_transition_graph_observed: false
    do_not_invent_strict_theory_to_practice_sequence: true
    closed_course_changes_require_correction_mode: true
    observed_delete_action_maps_to_non_destructive_cancel_policy: true

  course_enrollment_physical_model:
    version:
      canonical_type: bigint
      nullable: false
      default: 1
      check: version_gte_1
      purpose: concurrency_root_for_all_material_course_mutations
    training_stage:
      type: varchar_64
      nullable: false
      allowed_values: [unassigned, theory, practice, documentation, word_exam, supplementary_training, training_completed]
      initial_value: unassigned
      client_may_set_on_create: false
    existing_terminal_projection_columns:
      completed_at: nullable_timestamptz
      interrupted_at: nullable_timestamptz
      cancelled_at: nullable_timestamptz
      cancelled_by_user_id: nullable_uuid
    separate_mutable_lifecycle_status_column_required: false
    lifecycle_state_is_derived_from_terminal_projection: true
    organization_id_mutation: forbidden
    terminal_timestamp_or_training_stage_mutation_via_generic_PATCH: forbidden

  lifecycle_state_predicate:
    active: >-
      completed_at IS NULL AND interrupted_at IS NULL AND cancelled_at IS NULL
    completed: >-
      completed_at IS NOT NULL AND interrupted_at IS NULL AND cancelled_at IS NULL
      AND training_stage = 'training_completed'
    interrupted: >-
      interrupted_at IS NOT NULL AND completed_at IS NULL AND cancelled_at IS NULL
      AND training_stage <> 'training_completed'
    cancelled: >-
      cancelled_at IS NOT NULL AND completed_at IS NULL AND interrupted_at IS NULL
      AND training_stage <> 'training_completed'
    valid_states: [active, completed, interrupted, cancelled]
    DB_TRN_003_open_course_predicate_now_canonical_active_predicate: true

  row_level_consistency:
    exactly_zero_or_one_terminal_timestamp_nonnull:
      check: num_nonnull(completed_at, interrupted_at, cancelled_at)_lte_1
    training_completed_stage_equivalence:
      check: >-
        (completed_at IS NOT NULL AND training_stage = 'training_completed') OR
        (completed_at IS NULL AND training_stage <> 'training_completed')
    cancellation_actor_pair:
      check: >-
        (cancelled_at IS NULL AND cancelled_by_user_id IS NULL) OR
        (cancelled_at IS NOT NULL AND cancelled_by_user_id IS NOT NULL)
    completed_interrupted_cancelled_are_mutually_exclusive: true
    active_course_cannot_use_training_completed_stage: true
    cancelled_or_interrupted_course_preserves_last_noncompleted_training_stage: true

  lifecycle_history_table:
    name: course_enrollment_lifecycle_events
    append_only: true
    tenant_owned: true
    fields:
      - id_uuid_PK
      - organization_id_uuid_not_null
      - course_enrollment_id_uuid_not_null
      - event_type_varchar_48_not_null
      - from_lifecycle_state_varchar_24_nullable_for_create_or_baseline
      - to_lifecycle_state_varchar_24_not_null
      - from_training_stage_varchar_64_nullable_for_create_or_baseline
      - to_training_stage_varchar_64_not_null
      - course_version_before_bigint_nullable_for_migration_baseline
      - course_version_after_bigint_not_null
      - reason_text_nullable_subject_to_event_rule
      - actor_user_id_uuid_nullable_only_for_migration_baseline
      - correction_of_event_id_uuid_nullable
      - event_payload_redacted_jsonb_nullable
      - occurred_at_timestamptz_not_null
    event_types:
      - created
      - migration_baseline
      - updated
      - stage_changed
      - completed
      - interrupted
      - cancelled
      - restored
      - closed_course_corrected
      - lifecycle_corrected
    candidate_key:
      columns: [organization_id, id]
      purpose: same_tenant_correction_reference_target
    same_tenant_course_FK:
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    correction_self_FK_when_present:
      source_columns: [organization_id, correction_of_event_id]
      target_table: course_enrollment_lifecycle_events
      target_columns: [organization_id, id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    one_history_event_per_material_course_version:
      type: unique
      columns: [organization_id, course_enrollment_id, course_version_after]
    normal_event_version_step:
      rule: course_version_after_equals_course_version_before_plus_1
      migration_baseline_exception: course_version_before_is_null
    reason_required_for_event_types:
      - interrupted
      - cancelled
      - closed_course_corrected
      - lifecycle_corrected
    normal_actor_required: true
    migration_baseline_actor_may_be_null: true
    event_payload_is_audit_projection_not_business_authority: true
    plaintext_PKK_or_PESEL_in_event_payload: forbidden
    update_or_delete_history_event_by_normal_application_role: forbidden

  version_and_history_semantics:
    concurrency_root: course_enrollments.version
    create_starts_at_version: 1
    create_appends_event_type: created
    every_material_course_mutation_increments_version_once: true
    every_material_course_mutation_appends_exactly_one_lifecycle_event_same_transaction: true
    semantic_noop_does_not_increment_version_or_append_event: true
    history_event_course_version_after_equals_committed_course_version: true
    direct_mutation_that_changes_course_version_without_matching_event: forbidden_by_transactional_guard
    history_event_without_matching_material_course_version: forbidden_by_transactional_guard
    enforcement: deferrable_constraint_trigger_or_equivalent_transactional_database_guard

  generic_course_update:
    operation: PATCH_/course-enrollments/{courseEnrollmentId}
    expected_version_required: true
    expected_version_source: If-Match
    lock_course_row: FOR_UPDATE
    compare_expected_version_after_lock: true
    stale_version_result: conflict_or_precondition_failed_without_write
    normal_business_field_update_requires_lifecycle_state: active
    training_stage_or_terminal_projection_update_via_PATCH: forbidden
    successful_material_update:
      - apply_only_allowed_business_fields
      - preserve_DB_TRN_001_same_tenant_relations
      - preserve_DB_TRN_002_student_identity_boundary
      - increment_course_version_once
      - append_updated_event
      - write_audit_and_outbox_same_transaction
    closed_course_generic_PATCH: reject_requires_explicit_correction_mode

  stage_transition_policy:
    operation: POST_/course-enrollments/{courseEnrollmentId}/stage-transitions
    idempotency_key_required_by_existing_API: true
    expected_course_version_required_for_fresh_mutating_command: true
    exact_HTTP_If_Match_or_expected_version_surface_sync: Stage5_acceptance_contract_sync
    lock_course_row: FOR_UPDATE
    lifecycle_state_required: active
    generic_nonterminal_stage_values:
      - unassigned
      - theory
      - practice
      - documentation
      - word_exam
      - supplementary_training
    nonterminal_transition_graph: >-
      Because the confirmed screen explicitly marks exact transition rules TO_VERIFY,
      DB4_4 does not invent a false sequential graph. An explicit audited command may
      move an active course between confirmed nonterminal stage values; later domain
      policy may narrow this allowlist without changing the physical history model.
    target_same_as_current_stage: semantic_noop_without_version_or_event
    target_training_completed:
      route_to: completion_command_semantics
      plain_stage_only_update_forbidden: true
    successful_nonterminal_transition:
      - preserve_all_terminal_timestamps_null
      - increment_course_version_once
      - append_stage_changed_event_with_from_and_to_stage
      - write_audit_and_outbox_same_transaction

  completion_transaction:
    source_operation: stage_transition_target_training_completed_or_equivalent_domain_command
    precondition_current_state: active
    lock_course_row: FOR_UPDATE
    expected_course_version_required: true
    atomically:
      - set_training_stage_training_completed
      - set_completed_at_to_authoritative_command_time
      - keep_interrupted_at_null
      - keep_cancelled_at_and_cancelled_by_null
      - increment_course_version_once
      - append_completed_event
      - write_audit_and_outbox_same_transaction
    completion_eligibility_requirements_hours_exams: DB_TRN_005_projection_freshness_plus_DB_TRN_006_current_OSK_hours_plus_DB_TRN_007_external_hours_plus_DB4_7_exams
    generic_PATCH_may_set_completed_at: false
    normal_restore_may_reopen_completed_course: false

  interruption_transaction:
    formal_meaning: end_current_training_as_interrupted_without_claiming_completion
    exact_HTTP_operation_surface: Stage5_acceptance_contract_sync
    precondition_current_state: active
    reason_required: true
    lock_course_row: FOR_UPDATE
    expected_course_version_required: true
    atomically:
      - preserve_current_noncompleted_training_stage
      - set_interrupted_at_to_authoritative_command_time
      - keep_completed_at_null
      - keep_cancelled_at_and_cancelled_by_null
      - increment_course_version_once
      - append_interrupted_event_with_reason
      - write_audit_and_outbox_same_transaction
    normal_restore_operation_clears_interrupted_at: false
    reopening_mistaken_interruption_requires_explicit_lifecycle_correction: true

  cancellation_transaction:
    operation: POST_/course-enrollments/{courseEnrollmentId}/cancel
    idempotency_key_required: true
    reason_required: true
    precondition_current_state: active
    lock_course_row: FOR_UPDATE
    expected_course_version_required_for_fresh_command: true
    exact_HTTP_If_Match_or_expected_version_surface_sync: Stage5_acceptance_contract_sync
    atomically:
      - preserve_current_noncompleted_training_stage
      - set_cancelled_at_to_authoritative_command_time
      - set_cancelled_by_user_id_to_actor
      - keep_completed_at_null
      - keep_interrupted_at_null
      - increment_course_version_once
      - append_cancelled_event_with_reason
      - write_audit_and_outbox_same_transaction
    hard_delete_course: false
    hard_delete_or_rewrite_sessions_attendance_ledger_exam_payment_or_PKK_history: false
    distinct_fresh_cancel_when_already_cancelled: conflict_already_cancelled
    same_idempotency_key_retry: return_prior_result_without_reapplying_effect
    cancel_completed_or_interrupted_course: conflict_requires_correction_policy_not_cancel

  restore_transaction:
    operation: POST_/course-enrollments/{courseEnrollmentId}/restore
    normal_restore_source_state: cancelled
    completed_or_interrupted_restore: forbidden
    idempotency_key_required: true
    expected_course_version_required_for_fresh_command: true
    exact_HTTP_If_Match_or_expected_version_surface_sync: Stage5_acceptance_contract_sync
    lock_order:
      - student_row_FOR_UPDATE
      - course_enrollment_row_FOR_UPDATE
    require_student_nonarchived_after_student_lock: true
    require_DB_TRN_002_formal_identity_still_valid: true
    atomically:
      - clear_cancelled_at
      - clear_cancelled_by_user_id
      - preserve_training_stage
      - keep_completed_at_null
      - keep_interrupted_at_null
      - increment_course_version_once
      - append_restored_event
      - write_audit_and_outbox_same_transaction
    restore_creates_new_course_or_student: false
    restore_rewrites_sessions_attendance_ledger_or_external_training: false
    distinct_fresh_restore_when_course_not_cancelled: conflict_not_cancelled
    same_idempotency_key_retry: return_prior_result_without_reapplying_effect

  student_archive_vs_course_restore_race:
    shared_serialization_root: students_row
    fixed_lock_order_when_both_student_and_course_needed: student_then_course
    restore_wins_first: >-
      Restore commits an active course while Student is nonarchived; later Student
      archive sees the now-active course and is rejected by DB-TRN-003.
    archive_wins_first: >-
      Restore sees archived_at non-null after the Student lock and is rejected.
    impossible_committed_state: archived_student_plus_restored_active_course

  closed_course_correction:
    normal_generic_PATCH_on_terminal_course: forbidden
    explicit_correction_mode_required: true
    expected_course_version_required: true
    reason_required: true
    actor_required: true
    lock_course_row: FOR_UPDATE
    business_field_correction_without_lifecycle_change:
      lifecycle_state_and_terminal_timestamps_unchanged: true
      allowed_fields_subject_to_domain_policy: true
      increment_course_version_once: true
      append_event_type: closed_course_corrected
      redacted_before_after_or_changed_field_projection_in_event_payload: required
      never_delete_prior_lifecycle_events: true
    lifecycle_fact_correction:
      normal_restore_alias: false
      exceptional_governed_flow: true
      correction_of_event_id_required: true
      final_row_must_pass_complete_lifecycle_matrix: true
      reason_and_redacted_before_after_projection_required: true
      increment_course_version_once: true
      append_event_type: lifecycle_corrected
      if_final_state_becomes_active:
        lock_student_before_course: true
        require_student_nonarchived: true
        require_DB_TRN_002_formal_identity: true
    exact_permission_and_HTTP_surface: Stage5_security_acceptance_sync

  terminal_course_formal_activity_boundary:
    new_training_session_requires_course_active_after_lock: true
    new_formal_training_activity_may_not_start_for_completed_interrupted_or_cancelled_course: true
    existing_session_completion_and_ledger_exactly_once_semantics: governed_by_DB_TRN_006
    completion_eligibility_and_requirement_recalculation: DB_TRN_005_DB_TRN_006_DB_TRN_007_DB4_7
    existing_formal_history_is_never_deleted_when_course_closes: true

  concurrency_races:
    all_material_course_mutations_lock_course_row: true
    update_vs_stage_transition_with_same_expected_version: at_most_one_commits
    stage_transition_vs_cancel_with_same_expected_version: at_most_one_commits
    cancel_vs_restore_with_stale_expected_version: stale_command_conflicts
    completed_or_interrupted_state_blocks_normal_restore_after_lock: true
    idempotency_handles_transport_retry_not_concurrent_stale_intent: true

  migration_design:
    migrations_not_generated_in_this_step: true
    steps_when_later_generated:
      - widen_or_define_course_enrollments_version_as_bigint_not_null_default_1_check_gte_1
      - verify_every_existing_course_version_is_at_least_1
      - verify_every_existing_training_stage_is_in_confirmed_stage_catalog
      - precheck_terminal_timestamp_exclusivity
      - precheck_training_completed_stage_equivalence
      - precheck_cancelled_at_and_cancelled_by_user_id_pair
      - fail_on_contradictory_legacy_course_state_and_require_explicit_reviewed_remediation
      - never_guess_missing_completed_interrupted_or_cancelled_timestamp_from_stage_or_other_fields
      - create_append_only_course_enrollment_lifecycle_events_with_same_tenant_FKs_and_version_unique
      - create_one_migration_baseline_event_for_each_existing_course_without_claiming_unobserved_transition_history
      - install_row_checks_for_stage_terminal_timestamp_matrix
      - install_deferrable_or_equivalent_guard_pairing_each_future_material_course_version_with_one_history_event
      - wire_update_stage_complete_interrupt_cancel_restore_and_correction_to_one_course_version_root
      - install_student_then_course_lock_order_for_restore_or_reopen_flows
      - install_new_training_session_requires_active_course_guard
      - add_course_lifecycle_history_concurrency_and_negative_tests
    baseline_event_semantics: >-
      Legacy current state is recorded as migration_baseline with null from-state and
      no invented actor. It must not be mislabeled as the original creation, stage,
      cancellation, completion or interruption event.
    contradictory_legacy_row_policy: fail_migration_or_explicit_reviewed_remediation_never_auto_rewrite_history

  tests_required:
    - course_version_is_at_least_one_and_is_single_concurrency_root
    - course_stage_rejects_value_outside_confirmed_catalog
    - active_course_has_all_terminal_timestamps_null_and_noncompleted_stage
    - completed_course_requires_only_completed_at_nonnull_and_stage_training_completed
    - interrupted_course_requires_only_interrupted_at_nonnull_and_noncompleted_stage
    - cancelled_course_requires_only_cancelled_at_nonnull_cancelled_by_nonnull_and_noncompleted_stage
    - two_or_three_terminal_timestamps_nonnull_are_rejected
    - training_completed_stage_without_completed_at_is_rejected
    - completed_at_with_noncompleted_stage_is_rejected
    - cancelled_at_without_cancelled_by_is_rejected
    - normal_course_PATCH_cannot_mutate_stage_or_terminal_timestamps
    - normal_course_PATCH_on_active_course_with_current_version_increments_once_and_appends_updated_event
    - stale_course_PATCH_is_rejected_without_partial_write_or_history_event
    - nonterminal_stage_transition_preserves_active_state_and_appends_from_to_history
    - exact_nonterminal_stage_sequence_is_not_falsely_hardcoded_beyond_confirmed_values
    - transition_target_training_completed_atomically_sets_stage_and_completed_at
    - completion_does_not_also_set_cancelled_or_interrupted
    - interruption_preserves_last_noncompleted_stage_and_appends_reasoned_history
    - cancel_active_course_preserves_stage_sets_cancel_projection_and_appends_history
    - cancel_does_not_hard_delete_or_rewrite_formal_financial_or_PKK_history
    - fresh_second_cancel_of_already_cancelled_course_conflicts_without_new_version
    - restore_cancelled_course_clears_current_cancel_projection_preserves_stage_and_history
    - restore_completed_or_interrupted_course_is_rejected
    - restore_cancelled_course_for_archived_student_is_rejected
    - concurrent_student_archive_and_course_restore_cannot_commit_archived_student_with_active_course
    - stage_transition_and_cancel_from_same_expected_version_cannot_both_commit
    - cancel_and_stale_restore_cannot_silently_undo_each_other
    - closed_course_generic_PATCH_is_rejected
    - closed_course_business_correction_requires_reason_version_and_history_event
    - lifecycle_correction_references_prior_event_and_final_row_passes_state_matrix
    - new_training_session_for_terminal_course_is_rejected
    - lifecycle_history_events_are_append_only_and_same_tenant
    - exactly_one_history_event_exists_per_material_course_version
    - migration_baseline_does_not_invent_missing_legacy_transition_actor_or_chronology
    - migration_fails_on_contradictory_terminal_legacy_state_without_explicit_remediation

  intentionally_not_solved_by_DB_TRN_004:
    exact_completion_eligibility_from_requirement_context: DB-TRN-005
    attendance_and_ledger_exactly_once_credit: DB-TRN-006
    current_external_training_projection_and_reversal_history: DB-TRN-007
    required_course_PKK_atomic_persistence_boundary: DB-TRN-008
    learning_account_license_credentials_lifecycle: DB4_6
    internal_exam_attempt_compatibility_and_completion_gate: DB4_7
    PKK_provider_retry_reconciliation: DB4_8
    exact_stricter_nonterminal_stage_sequence_if_product_later_confirms_one: future_domain_policy_without_history_schema_change
    exact_HTTP_expected_version_required_markers_and_error_codes: Stage5_acceptance_contract_sync

  self_audit:
    one_contradiction_free_lifecycle_state_matrix_defined: PASS
    training_completed_stage_and_completed_timestamp_cannot_diverge: PASS
    completed_interrupted_cancelled_are_mutually_exclusive: PASS
    durable_append_only_stage_and_lifecycle_history_defined: PASS
    all_material_course_mutations_use_one_version_root_and_history_pair: PASS
    cancel_restore_stage_update_races_are_serialized_and_stale_intent_conflicts: PASS
    normal_restore_only_reopens_cancelled_not_completed_or_interrupted: PASS
    restore_cannot_reopen_course_under_archived_student: PASS
    closed_course_correction_preserves_prior_lifecycle_history: PASS
    exact_unobserved_nonterminal_stage_order_not_invented: PASS
    DB_TRN_003_student_archive_no_hidden_course_mutation_preserved: PASS
    DB_TRN_005_through_DB_TRN_008_not_fixed_in_original_step: PASS
    aggregate_core_schema_not_modified_in_this_step: PASS
    aggregate_docs87_not_modified_in_this_step: PASS
    Laravel_migrations_created: false
    later_DB4_slices_entered: false

# DB-TRN-005
requirement_context_profile_reproducibility:
  blocker: DB-TRN-005
  status: PASS
  goal: >-
    Make every current training requirement a reproducible result of durable source
    facts plus an immutable identified rule set, while preserving every historical
    calculation and every correction without deleting training, attendance or exam
    history. Requirement mutations serialize with CourseEnrollment so category,
    context, exemption and override races cannot produce a stale current projection.

  authority_and_preservation:
    legal_source: specs/legal/training-theory-exemptions.yml
    product_source: specs/legal/editable-training-requirements.yml
    narrative_source: docs/67-editable-training-requirements-and-theory-exemption.md
    API_get_current_profile: GET_/course-enrollments/{courseEnrollmentId}/requirements
    API_update_context: POST_/course-enrollments/{courseEnrollmentId}/requirement-context
    API_exemption_decision: POST_/course-enrollments/{courseEnrollmentId}/exemption-decisions
    current_API_requirement_context_schema_is_open_ended: true
    exact_HTTP_schema_and_expected_version_sync: Stage5_acceptance_contract_sync
    requirements_may_change_after_course_start: true
    terminal_course_change_requires_DB_TRN_004_correction_mode: true
    historical_training_attendance_exam_rows_may_not_be_deleted_by_recalculation: true

  canonical_source_fact_ownership:
    course_owned_rule_inputs:
      target_category:
        canonical_column: course_enrollments.driving_category_id
        duplicate_current_target_category_column_in_context: forbidden
      training_type:
        canonical_column: course_enrollments.training_type
      course_started_at:
        canonical_column: course_enrollments.started_at
        reason: preserve_rule_set_or_effective_date_reproducibility_when_applicable
    context_owned_rule_inputs:
      state_theory_passed: course_requirement_contexts.state_theory_passed
      context_evidence_reference: course_requirement_contexts.evidence_reference
      held_categories: course_requirement_context_held_categories
    exemption_owned_rule_inputs:
      current_exemption_basis: current_nonrevoked_course_exemption_decision
      current_exemption_evidence: current_nonrevoked_course_exemption_decision.evidence_reference
    manual_override_owned_rule_inputs:
      current_override: current_nonrevoked_course_requirement_override_decision
    computed_outputs_are_never_accepted_as_source_facts: true
    requirement_profile_output_must_not_be_used_to_infer_missing_source_facts: true

  course_enrollment_requirement_revision:
    add_column:
      name: requirements_revision
      type: bigint
      nullable: false
      default_for_new_course: 1
      check: requirements_revision_gte_1
      purpose: freshness_epoch_for_current_requirement_projection_not_a_second_concurrency_root
    concurrency_root_remains: course_enrollments.version
    increment_exactly_once_when:
      - driving_category_id_changes
      - training_type_changes
      - started_at_changes_when_rule_selection_or_result_can_be_affected
      - state_theory_passed_or_context_evidence_changes
      - held_category_set_changes
      - current_exemption_decision_changes_or_is_revoked
      - current_manual_override_changes_or_is_revoked
      - applicable_rule_set_is_reselected_or_refreshed
    does_not_increment_for:
      - ordinary_stage_transition_without_requirement_input_change
      - cancel_or_restore_without_requirement_input_change
      - instructor_or_location_change
      - declared_hour_field_change_when_it_does_not_change_legal_requirement_calculation
    each_increment_requires_new_current_profile_same_transaction: true

  training_requirement_rule_sets:
    purpose: immutable_identity_for_exact_rule_engine_artifact_used_by_each_decision
    tenant_owned: false
    fields:
      - version_varchar_64_PK
      - jurisdiction_varchar_16_not_null
      - content_hash_char_64_not_null
      - source_reference_varchar_255_nullable
      - effective_from_timestamptz_nullable
      - published_at_timestamptz_not_null
      - created_at_timestamptz_not_null
    content_hash_algorithm: SHA_256_or_equivalent_collision_resistant_hash_of_canonical_rule_artifact
    version_reuse_for_different_content: forbidden
    row_mutation_after_first_profile_reference: forbidden
    profile_rule_set_FK_required: true
    rule_selection_policy:
      exact_legal_applicability_logic_defined_here: false
      requirement: selected_version_must_be_explicit_and_resolve_to_one_immutable_row
      reason: DB_TRN_005_closes_reproducibility_not_future_legal_rule_selection_policy

  course_requirement_contexts:
    purpose: current_mutable_non_course_source_facts_for_rule_engine
    one_row_per_course: true
    primary_key: [organization_id, course_enrollment_id]
    fields:
      - organization_id_uuid_not_null
      - course_enrollment_id_uuid_not_null
      - state_theory_passed_boolean_not_null_default_false
      - evidence_reference_varchar_255_nullable
      - effective_from_timestamptz_not_null
      - updated_by_user_id_uuid_not_null
      - updated_at_timestamptz_not_null
    same_tenant_course_FK:
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    independent_version_column: false
    concurrency_root: course_enrollments.version
    generic_direct_SQL_update_without_profile_recalculation: forbidden_by_transactional_guard

  course_requirement_context_held_categories:
    purpose: normalized_current_set_of_held_categories_used_as_source_facts
    fields:
      - organization_id_uuid_not_null
      - course_enrollment_id_uuid_not_null
      - driving_category_id_uuid_not_null
    primary_key: [organization_id, course_enrollment_id, driving_category_id]
    context_composite_FK:
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_requirement_contexts
      target_columns: [organization_id, course_enrollment_id]
      on_update: RESTRICT
      on_delete: CASCADE_technical_child_only
    driving_category_is_global_dictionary: true
    held_category_set_history_storage: training_requirement_profile_input_snapshots
    direct_child_mutation_outside_serialized_requirement_command: forbidden

  course_exemption_decisions_strengthening:
    existing_table: course_exemption_decisions
    purpose: auditable_current_and_historical_explicit_exemption_basis_decisions
    business_fields_immutable_after_insert:
      - basis_code
      - evidence_reference
      - reason
      - approved_by_user_id
      - rule_set_version
      - created_at
    add_revocation_fields:
      - revoked_by_user_id_nullable
      - revocation_reason_nullable
    current_predicate: revoked_at_is_null
    at_most_one_current_per_course:
      type: partial_unique
      columns: [organization_id, course_enrollment_id]
      where: revoked_at_is_null
    current_basis_not_duplicated_into_course_requirement_context: true
    replacement_semantics: revoke_old_current_then_insert_new_current_under_course_lock_same_transaction
    revoke_without_replacement_allowed: true
    revoke_reason_and_actor_required: true
    same_tenant_course_FK: governed_by_DB_TRN_001

  course_requirement_override_decisions:
    purpose: optional_audited_manual_override_defined_by_existing_product_policy
    tenant_owned: true
    fields:
      - id_uuid_PK
      - organization_id_uuid_not_null
      - course_enrollment_id_uuid_not_null
      - override_payload_jsonb_not_null
      - reason_text_not_null
      - evidence_reference_varchar_255_nullable
      - approved_by_user_id_uuid_not_null
      - created_at_timestamptz_not_null
      - revoked_at_timestamptz_nullable
      - revoked_by_user_id_uuid_nullable
      - revocation_reason_text_nullable
    allowed_override_keys_only:
      - theory_training_required
      - minimum_theory_minutes
      - internal_theory_exam_required
      - practical_training_required
      - minimum_practical_minutes
      - internal_practical_exam_required
    arbitrary_extra_override_key: forbidden
    nonnegative_minute_values_required: true
    current_predicate: revoked_at_is_null
    at_most_one_current_per_course:
      type: partial_unique
      columns: [organization_id, course_enrollment_id]
      where: revoked_at_is_null
    same_tenant_course_FK:
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    replacement_or_revoke_requires_course_lock_expected_version_reason_actor: true
    override_is_never_silent_rule_engine_input: true

  training_requirement_profiles_strengthening:
    existing_table: training_requirement_profiles
    role: immutable_calculation_decision_history_plus_single_current_projection
    current_predicate: superseded_at_is_null
    at_most_one_current_per_course:
      type: partial_unique
      columns: [organization_id, course_enrollment_id]
      where: superseded_at_is_null
    add_or_require_fields:
      - requirements_revision_bigint_not_null
      - course_version_after_bigint_not_null
      - rule_set_version_varchar_64_not_null_FK_training_requirement_rule_sets
      - trigger_code_varchar_64_not_null
      - calculation_reason_text_nullable_subject_to_trigger
      - calculated_by_user_id_uuid_nullable_for_system_only
      - input_snapshot_jsonb_not_null
      - base_output_snapshot_jsonb_not_null
      - effective_output_snapshot_jsonb_not_null
      - manual_override_decision_id_uuid_nullable
      - calculated_at_timestamptz_not_null
      - superseded_at_timestamptz_nullable
    existing_effective_output_columns_remain:
      - theory_training_required
      - minimum_theory_minutes
      - internal_theory_exam_required
      - practical_training_required
      - minimum_practical_minutes
      - internal_practical_exam_required
      - exemption_basis_code
    unique_decision_per_requirement_revision:
      columns: [organization_id, course_enrollment_id, requirements_revision]
    same_tenant_course_FK: governed_by_DB_TRN_001
    manual_override_same_tenant_FK_when_present:
      source_columns: [organization_id, manual_override_decision_id]
      target_table: course_requirement_override_decisions
      target_columns: [organization_id, id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
      target_candidate_key_required: [organization_id, id]
    immutable_after_insert:
      - requirements_revision
      - course_version_after
      - rule_set_version
      - trigger_code
      - calculation_reason
      - calculated_by_user_id
      - input_snapshot
      - base_output_snapshot
      - effective_output_snapshot
      - manual_override_decision_id
      - all_effective_output_columns
      - calculated_at
    only_normal_mutable_history_marker: superseded_at

  input_snapshot_contract:
    must_capture_exact_normalized_inputs_used_for_decision:
      - course_enrollment_id
      - driving_category_id_and_code
      - training_type
      - started_at
      - state_theory_passed
      - context_evidence_reference
      - sorted_held_category_ids_and_codes
      - current_exemption_decision_id_nullable
      - current_exemption_basis_code_nullable
      - current_exemption_evidence_reference_nullable
      - current_manual_override_decision_id_nullable
      - current_manual_override_payload_nullable
      - selected_rule_set_version
      - selected_rule_set_content_hash
    PII_not_required_for_requirement_calculation_must_not_be_copied: true
    PESEL_or_PKK_in_snapshot: forbidden
    snapshot_is_immutable_evidence_not_current_source_authority: true

  output_snapshot_contract:
    base_output_snapshot: exact_rule_engine_result_before_manual_override
    effective_output_snapshot: exact_result_after_optional_override
    effective_relational_columns_are_current_API_projection: true
    application_integration_test_must_prove_effective_snapshot_equals_relational_effective_columns: true
    database_does_not_need_rule_engine_or_JSON_recalculation_secret_logic: true

  current_projection_freshness_guard:
    final_transaction_invariant: >-
      Every CourseEnrollment has exactly one current TrainingRequirementProfile and
      that profile.requirements_revision equals course_enrollments.requirements_revision.
    enforcement: deferrable_constraint_trigger_or_equivalent_transactional_database_guard
    at_most_one_current_from_partial_unique: true
    at_least_one_current_required_for_committed_formal_course: true
    stale_profile_after_source_fact_change_may_not_commit: true
    profile_rule_set_version_must_resolve_to_immutable_rule_set: true

  initial_course_creation_requirement_transaction:
    API_contract_promises_requirements_calculated_on_create: true
