    base_credit_course_part_and_minutes_are_derived_from_session: PASS
    session_complete_retry_or_race_cannot_double_credit: PASS
    session_cancel_complete_and_course_close_races_have_fixed_lock_order: PASS
    ledger_session_relation_is_exact_same_course_not_same_tenant_only: PASS
    correction_and_reversal_source_relation_is_same_tenant_same_course_same_part: PASS
    one_source_cannot_be_reversed_twice_and_reversal_of_reversal_is_forbidden: PASS
    source_rows_are_never_destructively_edited_or_deleted: PASS
    current_OSK_projection_is_deterministic_signed_sum_and_never_uses_declared_hours: PASS
    theory_45_and_practical_60_are_not_misused_as_rounding_blocks: PASS
    DB_TRN_007_and_DB_TRN_008_not_fixed: PASS
    aggregate_core_schema_not_modified_in_this_step: PASS
    aggregate_docs87_not_modified_in_this_step: PASS
