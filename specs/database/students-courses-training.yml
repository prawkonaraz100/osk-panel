  formal_course_enrollment_requires_legally_complete_student_identity: true
  student_profile_is_durable_and_archive_is_state_not_delete: true
  student_mutations_use_one_concurrency_root: true
  student_archive_must_not_silently_cancel_or_rewrite_course_history: true
  current_step_scope: student_concurrency_archive_restore_lifecycle_only

open_blockers_after_this_step:
  - DB-TRN-004
  - DB-TRN-005
  - DB-TRN-006
  - DB-TRN-007
  - DB-TRN-008

# DB-TRN-001
same_tenant_integrity:
  blocker: DB-TRN-001
  status: PASS
  goal: >-
    Student, CourseEnrollment, requirement/exemption/external-training records,
    TrainingSession, attendance and TrainingHourLedger relations must be unable to
    connect tenant-owned resources from different organizations even when
    application-level relation validation is bypassed.

  tenant_candidate_keys_required:
    students:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    course_enrollments:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    training_sessions:
      columns: [organization_id, id]
      unique_constraint_required: true
      purpose: composite_same_organization_FK_target
    staff_profiles:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-001
    locations:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-002
    vehicles:
      columns: [organization_id, id]
      unique_constraint_required: true
      source: DB-RES-002

  tenant_key_policy:
    required_nonnull_organization_id:
      - students
      - student_learning_accounts
      - course_enrollments
      - training_requirement_profiles
      - course_exemption_decisions
      - recognized_external_training
      - training_sessions
      - training_session_attendance
      - training_hour_ledger_entries
    organization_id_mutation_after_insert: forbidden_for_normal_domain_lifecycle
    moving_formal_record_between_organizations_by_rewriting_organization_id: forbidden
    client_supplied_organization_id_as_authority: forbidden
    application_rule: >-
      Create/update actions derive organization scope from the active membership or
      validated parent resource. The database composite foreign keys below are the
      final relation boundary and must still reject a malformed import or backend bug.

  students_default_location:
    source_table: students
    source_columns: [organization_id, default_location_id]
    target_table: locations
    target_columns: [organization_id, id]
    nullable_relation: true
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT
    effect: nonnull_default_location_must_belong_to_student_organization

  student_learning_account_student:
    source_table: student_learning_accounts
    source_columns: [organization_id, student_id]
    target_table: students
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT
    note: >-
      user_id remains a relation to the global User identity. A global User may
      legitimately participate in more than one organization, so no fake tenant
      composite FK to users is introduced here.

  course_enrollment_relations:
    student_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, student_id]
      target_table: students
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    lead_instructor_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, lead_instructor_id]
      target_table: staff_profiles
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    location_same_organization:
      source_table: course_enrollments
      source_columns: [organization_id, location_id]
      target_table: locations
      target_columns: [organization_id, id]
      nullable_relation: true
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    driving_category_relation:
      target_is_global_dictionary: true
      tenant_composite_FK_not_required: true

  training_requirement_profile_course:
    source_table: training_requirement_profiles
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  course_exemption_decision_course:
    source_table: course_exemption_decisions
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  recognized_external_training_course:
    source_table: recognized_external_training
    source_columns: [organization_id, course_enrollment_id]
    target_table: course_enrollments
    target_columns: [organization_id, id]
    nullable_relation: false
    match: MATCH_SIMPLE
    on_update: RESTRICT
    on_delete: RESTRICT

  training_session_relations:
    course_same_organization:
      source_table: training_sessions
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      nullable_relation: false
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    instructor_same_organization:
