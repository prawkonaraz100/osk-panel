# DB-TRN-008
course_required_pkk_atomic_persistence_boundary:
  blocker: DB-TRN-008
  status: PASS
  goal: >-
    Make the confirmed required course-scoped PKK identity atomic with CourseEnrollment
    persistence without duplicating plaintext PKK on the Course row and without pulling
    provider fetch/update/return/retry lifecycle from DB4_8 into DB4_4. Every committed
    course must have exactly one current encrypted PKK identity profile for the same
    tenant and course; PKK edits and course-context revalidation preserve prior profile
    versions instead of overwriting formal history.

  authority_and_preservation:
    create_screen: specs/screens/course-create.yml
    edit_screen: specs/screens/course-edit.yml
    API_course_schema: specs/api/openapi-components-v1.yaml
    API_PKK_paths: specs/api/paths/pkk-calendar.yaml
    PKK_entrypoint_source: docs/75-pkk-entrypoints-and-student-list.md
    PKK_course_panel_source: docs/76-pkk-course-operational-panel.md
    PKK_management_source: docs/77-pkk-management-flow-fallback-design.md
    PKK_configuration_gate_source: docs/37-pkk-configuration-gate.md
    aggregate_blueprint_reference_only: specs/database/core-schema.yml
    aggregate_narrative_reference_only: docs/87-physical-database-schema.md
    create_request_requires_pkk_number: true
    edit_screen_requires_pkk_number: true
    pkk_is_owned_by_course_enrollment_not_global_student: true
    one_student_may_have_multiple_courses_each_with_own_PKK: true
    course_may_have_PKK_before_provider_profile_is_fetched: true
    provider_configuration_gate_applies_to_provider_operations_not_local_identity_persistence: true
    exact_duplicate_PKK_or_PKK_category_collision_rule_observed: false
    exact_PKK_format_validation_observed: false

  canonical_identity_owner:
    table: pkk_profiles
    course_enrollments_duplicate_plain_or_ciphertext_PKK_column: forbidden
    current_API_projection: GET_/course-enrollments/{courseEnrollmentId}/pkk
    provider_operations_keep_exact_profile_reference_history: true
    reason: >-
      Existing API and physical design already scope PkkProfile to CourseEnrollment.
      Strengthening that owner avoids a second mutable PKK copy on CourseEnrollment
      and lets historical provider operations remain attached to the exact profile
      identity version they used.

  pkk_profiles_strengthening:
    existing_table: pkk_profiles
    tenant_owned: true
    current_predicate: superseded_at_is_null
    existing_sensitive_fields:
      - pkk_number_ciphertext
      - pkk_lookup_hash
    identity_fields_required_after_migration:
      - pkk_number_ciphertext_nonnull
      - pkk_lookup_hash_nonnull
      - identity_revision_bigint_nonnull_gte_1
      - bound_driving_category_id_uuid_nonnull
      - bound_training_type_varchar_32_nonnull
      - record_origin_varchar_32_nonnull
      - recorded_at_timestamptz_nonnull
      - supersedes_pkk_profile_id_uuid_nullable
      - superseded_at_timestamptz_nullable
      - superseded_by_user_id_uuid_nullable
      - recorded_by_user_id_uuid_nullable_only_for_migration_baseline
    record_origin_values:
      - course_create
      - course_edit
      - context_revalidation
      - migration_baseline
    provider_fields_preserved_for_DB4_8:
      - status
      - profile_snapshot_ciphertext
      - profile_snapshot_redacted
      - fetched_at
      - updated_at
    identity_business_fields_immutable_after_insert:
      - organization_id
      - course_enrollment_id
      - pkk_number_ciphertext
      - pkk_lookup_hash
      - identity_revision
      - bound_driving_category_id
      - bound_training_type
      - record_origin
      - recorded_at
      - recorded_by_user_id
      - supersedes_pkk_profile_id
    superseded_profile_identity_fields_never_reactivated_or_rewritten: true
    provider_field_mutability_and_status_matrix: DB4_8
    hard_delete_normal_lifecycle: forbidden

  sensitive_identifier_contract:
    plaintext_PKK_persistence: forbidden
    canonical_write_flow:
      - accept_plaintext_PKK_only_at_authorized_course_command_boundary
      - normalize_once_using_canonical_application_PKK_normalizer
      - derive_ciphertext_and_keyed_lookup_hash_from_same_normalized_value
      - discard_plaintext_after_command_boundary
    lookup_hash: HMAC_SHA_256_or_equivalent_secret_keyed_hash
    plain_global_SHA256_for_lookup: forbidden
    independent_ciphertext_or_lookup_hash_update: forbidden
    database_holds_HMAC_secret: false
    database_pair_boundary: both_ciphertext_and_hash_are_nonnull_for_every_identity_profile
    exact_format_checksum_or_length_validation: application_validation_and_Stage5_acceptance_sync

  duplicate_PKK_policy:
    hard_unique_on_pkk_lookup_hash_in_DB_TRN_008: false
    reason: >-
      Course create reverse-engineering explicitly leaves duplicate PKK/category
      behavior unobserved. DB4_4 must not invent a uniqueness rule that could reject
      a legitimate historical or provider workflow. Exact collision policy belongs
      to verified domain/provider validation before production implementation.
    same_hash_may_exist_on_distinct_course_profiles_until_policy_verified: true
    exact_lookup_hash_still_available_for_authorized_collision_detection: true

  exact_course_and_lineage_integrity:
    pkk_profile_candidate_key:
      columns: [organization_id, id, course_enrollment_id]
    same_tenant_course_FK:
      source_columns: [organization_id, course_enrollment_id]
      target_table: course_enrollments
      target_columns: [organization_id, id]
      on_update: RESTRICT
      on_delete: RESTRICT
    supersedes_same_tenant_same_course_self_FK:
      source_columns: [organization_id, supersedes_pkk_profile_id, course_enrollment_id]
      target_table: pkk_profiles
      target_columns: [organization_id, id, course_enrollment_id]
      match: MATCH_SIMPLE
      on_update: RESTRICT
      on_delete: RESTRICT
    one_identity_revision_number_per_course:
      type: unique
      columns: [organization_id, course_enrollment_id, identity_revision]
    at_most_one_successor_per_profile:
      type: partial_unique
      columns: [organization_id, supersedes_pkk_profile_id]
      where: supersedes_pkk_profile_id_is_not_null
    current_profile_at_most_one_per_course:
      type: partial_unique
      columns: [organization_id, course_enrollment_id]
      where: superseded_at_is_null
    source_must_preexist_successor: true
    source_must_be_current_before_replacement: true
    replacement_marks_source_superseded_same_transaction: true
    self_reference_or_cycle: forbidden
    lineage_is_linear_not_branching: true

  required_current_profile_guard:
    final_transaction_invariant: >-
      Every CourseEnrollment has exactly one current PkkProfile in the same
      organization and course, with non-null PKK ciphertext/hash identity and current
      bound_driving_category_id/bound_training_type equal to the final CourseEnrollment
      driving_category_id/training_type.
    enforcement: partial_unique_plus_deferrable_constraint_trigger_or_equivalent_transactional_database_guard
    at_most_one_current_from_partial_unique: true
    at_least_one_current_required_for_every_committed_course: true
    direct_SQL_course_without_current_PKK_identity_cannot_commit: true
    direct_SQL_cross_tenant_PKK_profile_cannot_commit: true
    stale_course_context_PKK_profile_cannot_commit: true

  initial_course_creation_transaction:
    operation: POST_/students/{studentId}/course-enrollments
    request_pkk_number_required_by_existing_API: true
    pkk_plaintext_is_command_input_not_course_column: true
    fixed_locking_uses_existing_student_and_course_create_contracts: true
    atomically_before_commit:
      - validate_student_and_course_preconditions_from_DB_TRN_001_002_003
      - normalize_encrypt_and_hash_required_PKK
      - insert_CourseEnrollment
      - insert_current_PkkProfile_identity_revision_1_record_origin_course_create
      - bind_PkkProfile_to_course_organization_category_and_training_type
      - create_requirement_context_and_current_requirement_profile_from_DB_TRN_005
      - create_any_initial_external_training_rows_from_DB_TRN_007
      - create_DB_TRN_004_created_history_event
      - write_audit_and_outbox
      - satisfy_required_current_PKK_profile_guard
    any_PKK_identity_write_failure_rolls_back_course_and_all_sibling_side_effects: true
    provider_fetch_call_required_before_course_commit: false
    provider_configuration_required_for_local_course_save: false
    provider_fetch_can_happen_later_for_same_current_profile: true
    nested_student_plus_initial_course_flow_must_use_same_atomic_course_boundary: true

  PKK_identity_edit_transaction:
    operation: PATCH_/course-enrollments/{courseEnrollmentId}
    expected_course_version_required: true
    lock_course_enrollment_FOR_UPDATE: true
    lock_current_pkk_profile_FOR_UPDATE: true
    active_course_normal_edit_allowed: true
    terminal_course_requires_DB_TRN_004_correction_mode: true
    changed_PKK_value:
      - normalize_encrypt_and_hash_new_PKK
      - compare_new_lookup_hash_to_current_lookup_hash_after_course_lock
      - if_different_mark_current_profile_superseded
      - insert_successor_identity_revision_plus_1_record_origin_course_edit
      - successor_supersedes_current_profile
      - successor_context_snapshot_from_final_course_values
      - do_not_copy_old_provider_snapshot_or_fetched_state_as_new_identity_authority
    same_normalized_PKK_value:
      identity_history_noop: true
      no_successor_created_due_only_to_same_PKK: true
    successful_material_PKK_change:
      course_version_increment_total_for_whole_course_edit: exactly_once
      requirements_revision_increment_due_only_to_PKK_change: false
      DB_TRN_004_history_event_if_active: updated
      DB_TRN_004_history_event_if_terminal: closed_course_corrected
      event_payload_contains_plaintext_PKK: false
      audit_contains_plaintext_PKK: false
    stale_expected_course_version_partial_PKK_write: forbidden

  course_context_revalidation:
    trigger_fields:
      - driving_category_id
      - training_type
    current_profile_context_fields:
      - bound_driving_category_id
      - bound_training_type
    new_profile_context_is_derived_from_locked_final_course: true
    category_or_training_type_change_may_not_commit_with_stale_current_PKK_context: true
    exact_provider_or_legal_compatibility_matrix_hardcoded_in_DB_TRN_008: false
    explicit_domain_revalidation_outcomes:
      compatible_same_PKK:
        - supersede_current_profile
        - insert_successor_record_origin_context_revalidation
        - preserve_existing_ciphertext_and_lookup_hash_without_requiring_plaintext
        - bind_successor_to_final_category_and_training_type
        - do_not_claim_provider_fetch_for_new_context
      replacement_PKK_supplied:
        - use_PKK_identity_edit_successor_with_final_context
      incompatible_or_unknown_without_replacement:
        - reject_course_context_change_before_commit
    reason: >-
      The confirmed course-edit contract requires revalidation of pkk_context, but
      exact provider/category compatibility is not observed. The database enforces
      freshness of the committed binding while the domain/provider validator owns
      the semantic decision.
    one_course_version_increment_for_combined_course_context_and_PKK_work: true

  cancellation_restore_and_history:
    course_cancel_deletes_or_supersedes_current_PKK_profile: false
    course_restore_recreates_PKK_profile: false
    course_cancel_hidden_provider_return_operation: forbidden
    course_restore_hidden_provider_fetch_operation: forbidden
    historical_superseded_PKK_profiles_preserved: true
    historical_PKK_operations_remain_bound_to_exact_profile_version: true
    student_archive_does_not_rebind_or_delete_PKK_history: true
    provider_return_or_reconciliation_effects: DB4_8

  provider_lifecycle_scope_boundary:
    deliberately_not_defined_here:
      - provider_configuration_verification
      - fetch_request_response_contract
      - profile_status_state_machine
