# DB-TRN-002
student_formal_identity_and_duplicate_lifecycle:
  blocker: DB-TRN-002
  status: PASS
  goal: >-
    Preserve the confirmed ability to create a Student profile before a course is
    attached, while making it impossible for a formal CourseEnrollment to exist for
    a Student who lacks the legally required PESEL-or-no-PESEL-with-birth-date
    identity branch. PESEL duplicate prevention must remain durable through archive.

  authority_and_preservation:
    legal_source: docs/66-formal-student-record-and-theory-exemptions.md
    observed_create_source: specs/screens/student-create.yml
    observed_edit_source: specs/screens/student-edit.yml
    legal_rule: PESEL_or_birth_date_when_PESEL_not_assigned_before_formal_training
    student_can_be_created_without_course: true
    student_create_visible_always_required_fields_remain_first_name_and_last_name_only: true
    do_not_turn_pre_course_student_creation_into_mandatory_PESEL_form: true
    formal_training_requires_course_enrollment_and_complete_identity: true

  students_physical_model:
    add_column:
      name: no_pesel_declared
      type: boolean
      nullable: false
      default: false
      purpose: >-
        Distinguish an explicit declaration that PESEL was not assigned from an
        incomplete pre-formal profile where PESEL has simply not been entered yet.
      api_mapping: CreateStudentRequest.no_pesel_and_UpdateStudentRequest.no_pesel
    existing_columns:
      pesel_ciphertext: nullable
      pesel_lookup_hash: nullable
      birth_date: nullable
    no_stored_identity_status_projection_required: true
    formal_identity_is_a_predicate_over_source_fields: true

  row_level_consistency:
    pesel_pair_nullity_check:
      check: >-
        (pesel_ciphertext IS NULL AND pesel_lookup_hash IS NULL) OR
        (pesel_ciphertext IS NOT NULL AND pesel_lookup_hash IS NOT NULL)
      purpose: ciphertext_and_lookup_hash_must_be_written_or_cleared_as_one_pair
    no_pesel_branch_check:
      check: >-
        no_pesel_declared = false OR
        (pesel_ciphertext IS NULL AND pesel_lookup_hash IS NULL AND birth_date IS NOT NULL)
      effect: explicit_no_PESEL_requires_birth_date_and_forbids_stored_PESEL
    pesel_present_forbids_no_pesel_declaration:
      check: >-
        pesel_ciphertext IS NULL OR no_pesel_declared = false
    incomplete_preformal_state:
      allowed: true
      shape: >-
        no_pesel_declared = false AND pesel_ciphertext IS NULL AND
        pesel_lookup_hash IS NULL; birth_date may be null or known.
      restriction: may_not_back_a_formal_course_enrollment

  formal_identity_predicate:
    name: student_has_formal_identity
    expression: >-
      (no_pesel_declared = false AND pesel_ciphertext IS NOT NULL AND
       pesel_lookup_hash IS NOT NULL)
      OR
      (no_pesel_declared = true AND pesel_ciphertext IS NULL AND
       pesel_lookup_hash IS NULL AND birth_date IS NOT NULL)
    birth_date_required_when_PESEL_present: false
    exact_birth_date_source_when_PESEL_present: intentionally_not_invented

  formal_enrollment_database_boundary:
    enforcement: deferrable_constraint_triggers_or_equivalent_transactional_database_guards
    course_enrollment_insert_or_student_change_guard:
      - on_course_enrollment_insert_or_student_rebind_verify_student_has_formal_identity
      - on_student_identity_field_update_when_any_course_enrollment_exists_verify_final_student_has_formal_identity
      - evaluate_final_transaction_state_to_allow_atomic_valid_branch_transition
    any_historical_course_enrollment_keeps_identity_requirement: true
    cancelled_or_completed_course_does_not_make_identity_optional_again: true
    reason: >-
      The formal record must remain documentable after completion, interruption,
      cancellation or archive; identity cannot be degraded to an incomplete draft
      merely because active training has ended.
    course_same_tenant_relation_still_governed_by: DB-TRN-001

  PESEL_write_contract:
    plaintext_persistence: forbidden
    canonical_input_flow:
      - accept_plaintext_PESEL_only_in_authorized_request_or_import_boundary
      - normalize_once_using_canonical_PESEL_normalizer
      - derive_ciphertext_and_keyed_lookup_hash_from_the_same_normalized_input
      - write_both_columns_atomically
      - discard_plaintext_after_command_boundary
    lookup_hash: HMAC_SHA_256_or_equivalent_secret_keyed_hash
    plain_global_SHA256_for_lookup: forbidden
    independent_patch_of_ciphertext_or_lookup_hash: forbidden
    database_recomputes_HMAC_or_holds_HMAC_secret: false
    consistency_boundary: >-
      Database enforces pair nullity and uniqueness. Application/domain integration
      tests prove both values are derived from the same normalized PESEL; the HMAC
      secret is not moved into PostgreSQL merely to make a cryptographic CHECK.

  duplicate_PESEL_policy:
    scope: per_organization
    index:
      type: partial_unique
      columns: [organization_id, pesel_lookup_hash]
      where: pesel_lookup_hash_is_not_null
    archived_rows_included: true
    archive_releases_PESEL: false
    same_PESEL_in_different_organizations_allowed: true
    hard_delete_to_release_PESEL_as_normal_lifecycle: forbidden
    reason: >-
      Archive is historical state, not deletion of identity. Keeping archived rows
      in the unique boundary prevents a second durable Student record for the same
      PESEL from being created in one OSK while the original is archived.
    no_PESEL_name_birth_date_hard_unique:
      enabled: false
      rationale: name_plus_birth_date_is_not_a_legally_unique_person_identifier
      application_may_surface_potential_duplicate_warning: true

  identity_branch_transitions:
    PESEL_to_no_PESEL:
      atomic_final_state_required:
        - set_no_pesel_declared_true
        - clear_pesel_ciphertext
        - clear_pesel_lookup_hash
        - require_birth_date_nonnull
      historical_course_guard_must_still_pass: true
      audit_identity_change: true
    no_PESEL_to_PESEL:
      atomic_final_state_required:
        - set_no_pesel_declared_false
        - write_new_pesel_ciphertext_and_lookup_hash_pair
      birth_date_auto_clear: false
      note: keep_known_birth_date_unless_separate_authorized_correction_changes_it
      audit_identity_change: true
    PESEL_to_different_PESEL:
      replace_ciphertext_and_lookup_hash_pair_atomically: true
      unique_index_is_final_duplicate_boundary: true
      audit_identity_change: true
    invalid_transition_examples:
      - no_pesel_true_with_nonnull_PESEL_pair
      - no_pesel_true_with_null_birth_date
      - only_one_of_ciphertext_or_lookup_hash_nonnull
      - formal_student_changed_to_incomplete_no_PESEL_not_declared_state
    optimistic_concurrency_for_identity_update: governed_by_DB_TRN_003

  archive_restore_semantics_for_identity_only:
    archive_does_not_clear_identity_fields: true
    archive_does_not_release_PESEL_unique_claim: true
    restore_reuses_same_durable_student_row: true
    restore_does_not_create_second_student_identity: true
    student_archive_effect_on_courses_and_versioning: governed_by_DB_TRN_003

  migration_design:
    migrations_not_generated_in_this_step: true
    steps_when_later_generated:
      - add_no_pesel_declared_boolean_default_false
      - verify_existing_PESEL_ciphertext_lookup_hash_pair_nullity
      - do_not_infer_no_pesel_declared_true_merely_from_missing_PESEL
      - detect_duplicate_nonnull_PESEL_lookup_hash_within_each_organization_including_archived_rows
      - explicitly_remediate_duplicates_or_invalid_pairs_before_constraints_never_silent_delete_or_merge
      - add_PESEL_pair_row_check
      - add_no_pesel_branch_row_checks
      - add_partial_unique_organization_PESEL_lookup_hash
      - precheck_every_student_with_existing_course_enrollment_has_formal_identity
      - require_explicit_data_remediation_for_formal_students_missing_identity_never_guess_no_PESEL
      - add_deferrable_formal_identity_constraint_guards
    pre_course_incomplete_student_rows_may_remain_after_migration: true

  tests_required:
    - pre_course_student_with_first_and_last_name_only_can_exist_as_incomplete_profile
    - course_enrollment_for_incomplete_student_is_rejected_by_database_guard
    - student_with_PESEL_pair_and_no_pesel_false_satisfies_formal_identity
    - no_pesel_student_with_birth_date_and_null_PESEL_pair_satisfies_formal_identity
    - no_pesel_true_with_PESEL_pair_is_rejected
    - no_pesel_true_without_birth_date_is_rejected
    - only_ciphertext_without_lookup_hash_is_rejected
    - only_lookup_hash_without_ciphertext_is_rejected
    - duplicate_PESEL_in_same_organization_is_rejected
    - duplicate_PESEL_is_rejected_even_when_first_student_is_archived
    - same_PESEL_hash_value_may_exist_in_different_organizations
    - atomic_PESEL_to_no_PESEL_transition_with_birth_date_is_accepted
    - PESEL_to_no_PESEL_transition_without_birth_date_is_rejected
