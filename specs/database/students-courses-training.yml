    external_training_current_projection_and_reversal_history: DB-TRN-007
    course_required_PKK_atomic_persistence_boundary: DB-TRN-008
  migration_design:
    migrations_not_generated_in_this_step: true
    attendance_backfill_rule: >-
      Never silently reassign attendance to a different student/session/organization.
      Cross-tenant mismatches fail migration and require explicit remediation.
  self_audit:
    every_relation_named_in_DB_TRN_001_diagnosis_has_physical_boundary: PASS
    required_parent_candidate_keys_declared: PASS
    attendance_missing_tenant_key_closed_without_exactly_once_scope_creep: PASS
    aggregate_core_schema_not_modified_in_this_step: PASS
    aggregate_docs87_not_modified_in_this_step: PASS
    Laravel_migrations_created: false
    later_DB4_slices_entered: false

# DB-TRN-002
student_formal_identity_and_duplicate_lifecycle:
  blocker: DB-TRN-002
  status: PASS
  goal: >-
    Preserve pre-course Student creation while requiring PESEL or explicit no-PESEL
    plus birth date before formal CourseEnrollment and keeping duplicate prevention
    durable through archive.
  students_physical_model:
    no_pesel_declared: { type: boolean, nullable: false, default: false }
    pesel_ciphertext: nullable
    pesel_lookup_hash: nullable
    birth_date: nullable
  row_level_consistency:
    pesel_pair_nullity_check: >-
      (pesel_ciphertext IS NULL AND pesel_lookup_hash IS NULL) OR
      (pesel_ciphertext IS NOT NULL AND pesel_lookup_hash IS NOT NULL)
    no_pesel_branch_check: >-
      no_pesel_declared = false OR
      (pesel_ciphertext IS NULL AND pesel_lookup_hash IS NULL AND birth_date IS NOT NULL)
  formal_identity_predicate: >-
    (no_pesel_declared = false AND pesel_ciphertext IS NOT NULL AND pesel_lookup_hash IS NOT NULL)
    OR
    (no_pesel_declared = true AND pesel_ciphertext IS NULL AND pesel_lookup_hash IS NULL AND birth_date IS NOT NULL)
  formal_enrollment_database_boundary:
    enforcement: deferrable_constraint_triggers_or_equivalent_transactional_database_guards
    any_historical_course_enrollment_keeps_identity_requirement: true
  PESEL_write_contract:
    plaintext_persistence: forbidden
    lookup_hash: HMAC_SHA_256_or_equivalent_secret_keyed_hash
    independent_patch_of_ciphertext_or_lookup_hash: forbidden
  duplicate_PESEL_policy:
    scope: per_organization
    index: { type: partial_unique, columns: [organization_id, pesel_lookup_hash], where: pesel_lookup_hash_is_not_null }
    archived_rows_included: true
    archive_releases_PESEL: false
    same_PESEL_in_different_organizations_allowed: true
    no_PESEL_name_birth_date_hard_unique: false
  migration_design:
    migrations_not_generated_in_this_step: true
    do_not_infer_no_pesel_declared_true_merely_from_missing_PESEL: true
    duplicate_or_invalid_identity_policy: fail_or_explicit_remediation_never_silent_merge_delete
  self_audit:
    legal_PESEL_or_birth_date_rule_preserved_for_formal_training: PASS
    observed_pre_course_student_creation_not_broken: PASS
    duplicate_PESEL_per_organization_closed_including_archive: PASS
    aggregate_core_schema_not_modified_in_this_step: PASS
    aggregate_docs87_not_modified_in_this_step: PASS
    Laravel_migrations_created: false
    later_DB4_slices_entered: false

