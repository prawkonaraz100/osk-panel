meta:
  id: CORE-V1-AUTH-PASSWORD-RECOVERY-AUTHORITY-001
  status: CANDIDATE
  scope: self_service_password_recovery_authority
  operations:
    - auth.password_forgot
    - auth.password_reset
  PKK_dependency: none

authority:
  credential_source:
    password_hash: users.password_hash
    management_authority: user_password_management
    credential_epoch: user_password_management.credential_version
    password_changed_at: user_password_management.password_changed_at
    framework_password_broker_is_authority: false

  eligibility:
    user_status_required: active
    management_mode_required: self_service
    organization_managed: forbidden
    unclassified: fail_closed
    verified_delivery_email_required: true
    login_identifier_may_be_email_or_username: true
    target_resolution:
      identifier: current_nonrevoked_auth_login_identifier
      delivery: current_nonrevoked_verified_primary_email_for_same_user
    absent_or_ineligible_identifier_response: enumeration_safe_202_without_token

  token:
    storage: server_side_cache
    production_store: redis_or_equivalent_atomic_shared_cache
    database_token_table_required: false
    raw_token_random_bytes: 32
    external_encoding: base64url_without_padding
    lookup_key: sha256_of_raw_token
    raw_token_persistence: forbidden
    raw_token_logging: forbidden
    raw_token_framework_session_storage: forbidden
    ttl_seconds: 1800
    one_time: true
    issuance_serialization: per_user_cache_lock
    reissue_invalidates_previous_token: true
    state:
      - user_id
      - credential_version_at_issue
      - expires_at
    user_pointer:
      purpose: one_live_reset_token_per_user
      value: token_hash
      ttl_seconds: 1800

  forgot:
    response:
      status: 202
      body: empty
      account_enumeration: forbidden
    rate_limit:
      key: sha256_ip_plus_normalized_identifier
      max_attempts: 5
      decay_seconds: 300
      independent_of_account_existence: true
    delivery:
      channel: verified_email
      runtime_v1_transport: synchronous_laravel_mail
      queued_serialization_of_raw_token: forbidden
      reset_url_template: deployment_config
      required_placeholder: "{token}"
      production_scheme: https
      delivery_failure:
        public_response_remains: 202
        issued_token_invalidated: true
        internal_error_reporting_without_secret: required

  reset:
    request:
      token_required: true
      password_required: true
      password_validation_baseline: required_string_max_1024
    rate_limit:
      key: sha256_ip
      max_attempts: 10
      decay_seconds: 300
    token_claim:
      atomic_cache_lock_get_delete: required
      user_pointer_must_match_token_hash: true
      consume_before_database_mutation: true
      replay: reject
      expired: reject
      unexpected_database_failure_after_claim: require_new_forgot_flow
    transaction:
      lock_order:
        - user_password_management_FOR_UPDATE
        - users_FOR_UPDATE
      recheck:
        - user_active
        - management_mode_self_service
        - credential_version_matches_issue_snapshot
      mutation:
        users.password_hash: Hash_make_new_password
        user_password_management.credential_version: increment_by_1
        user_password_management.password_changed_at: now
        auth_sessions: revoke_all_active_for_user
        auth_sessions.revoke_reason: password_reset
      all_mutations_atomic: true
    invalid_or_expired_response:
      status: 422
      code: PASSWORD_RESET_INVALID
      message: Password reset token is invalid or expired.
      distinguish_failure_reason: false
    success_response:
      status: 200
      body: empty

  concurrency_and_security:
    password_change_after_issue_invalidates_token_by_credential_epoch: true
    management_mode_transition_serialized_by_password_management_row: true
    reset_revokes_every_application_auth_session: true
    social_accounts_unchanged: true
    auth_login_identifiers_unchanged: true
    user_or_organization_creation: forbidden
    provider_or_PKK_calls: forbidden
    sensitive_token_in_audit_outbox_notification_or_generic_logs: forbidden

  implementation_boundary:
    authority_gate_HTTP_binding_change: false
    authority_gate_schema_or_migration_change: false
    implementation_may_require_new_database_schema: false
    existing_frozen_Stage4_edit: forbidden
    PKK_runtime_activation: forbidden
