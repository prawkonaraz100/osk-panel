meta:
  id: auth_recovery_ui_v1
  gate: AUTH-RECOVERY-UI-001
  status: CANDIDATE
  starting_accepted_head: 7a84f5e32752efdd7955ceecc02daec0f91f6a7a
  tracker: github_issue_110

routes:
  login: /login
  forgot_password: /forgot-password
  reset_password: /reset-password

backend_operations:
  login: POST /api/v1/auth/login
  forgot_password: POST /api/v1/auth/password/forgot
  reset_password: POST /api/v1/auth/password/reset
  new_auth_operation_added: false

security:
  backend_return_url_authority_preserved: true
  client_return_url_must_be_local_before_send: true
  forgot_account_enumeration_forbidden: true
  forgot_202_generic_message_required: true
  reset_token_source: current_URL_query_only
  reset_token_local_storage: forbidden
  reset_token_session_storage: forbidden
  reset_token_rendering: forbidden
  reset_token_removed_from_URL_after_success: true
  backend_session_revocation_after_reset_preserved: true

api_client:
  successful_empty_body_supported: true
  unauthenticated_non_auth_route_redirects_to_login: true
  redirect_return_url_source: local_current_path_and_query

deferred:
  registration_UI:
    status: BLOCKED_PENDING_PUBLIC_LEGAL_DOCUMENT_DISCOVERY
    hardcoded_terms_version: forbidden
  social_provider_buttons:
    status: DEFERRED_PENDING_PROVIDER_DISCOVERY_CONTRACT
    hardcoded_provider: forbidden
  PKK_PWPW: FROZEN_UNTIL_EXPLICIT_UNFREEZE
