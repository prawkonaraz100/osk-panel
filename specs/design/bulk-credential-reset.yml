authority:
  id: CORE-V1-BULK-CREDENTIAL-RESET-AUTHORITY-001
  status: CANDIDATE
  date: 2026-09-14
  source_authority:
    database_contract: specs/database/licenses-learning-access.yml#DB-LIC-004
    required_operation: specs/api/required-operations-v1.yml#license_credentials.bulk_pdf
    endpoint: POST /learning-accesses/bulk-access-document
  purpose: >-
    Close the Stage5 HTTP transport-sync gap for DB-LIC-004 bulk credential export
    without inventing a new credential lifecycle or persisting recoverable secrets.

scope:
  schema_or_migration_change: false
  runtime_change_in_authority_gate: false
  route_change_in_authority_gate: false
  PKK_runtime_change: false
  price_or_VAT_authority_change: false
  identity_password_recovery_change: false
  OpenAPI_contract_sync:
    - specs/api/paths/licenses.yaml
    - specs/api/openapi-components-v1.yaml

canonical_modes:
  nonsecret_combined_pdf:
    request:
      regenerate_credentials_when_required: false_or_omitted
      target_fields:
        required: [learning_account_id]
        expected_credential_version: not_required
    credential_mutation: false
    required_permission:
      - licenses.access_documents.download
    old_plaintext_recovery: forbidden
    output: one_combined_secret_free_PDF
  reset_and_secret_combined_pdf:
    request:
      regenerate_credentials_when_required: true
      target_fields:
        required: [learning_account_id, expected_credential_version]
    required_permissions_for_every_target:
      - licenses.access_documents.download
      - student_access.reset_password
    concurrency_root: user_password_management.credential_version
    old_plaintext_recovery: forbidden
    new_plaintext_lifecycle: immediate_command_memory_only
    output: one_combined_immediate_secret_bearing_PDF

target_resolution:
  every_selected_learning_account:
    same_organization_and_scope_required: true
    DB_LIC_003_operational_eligibility_required: true
  duplicate_learning_account_id_in_one_batch: reject
  duplicate_global_user:
    group_by_user_id: true
    all_selected_accounts_for_same_user_expected_versions_must_agree: true
    one_password_hash_write_per_unique_user: true
    one_credential_version_increment_per_unique_user: true
    same_new_plaintext_may_render_on_each_selected_account_page_for_same_user_in_same_batch: true

reset_authority:
  management_mode_required: organization_managed
  managing_organization_must_match_actor_organization: true
  exclusive_principal_guard_required: true
  expected_credential_version_compared_after_lock: true
  stale_or_missing_expected_version:
    effect: conflict_or_validation_failure
    password_writes: 0
    handoff_items_created: 0
    audit_mutation_effects: 0

atomicity_and_locking:
  deterministic_lock_order:
    - distinct_students_uuid_order_FOR_UPDATE
    - selected_learning_accounts_uuid_order_FOR_UPDATE
    - distinct_users_uuid_order_FOR_UPDATE
    - user_password_management_user_uuid_order_FOR_UPDATE
  before_any_password_write:
    - validate_all_target_shapes
    - validate_all_tenant_and_permission_scopes
    - acquire_all_locks
    - recheck_all_operational_eligibility
    - verify_password_management_authority_for_every_unique_user
    - compare_expected_credential_versions_for_every_unique_user
    - generate_plaintext_and_hashes_in_memory
    - render_entire_combined_secret_bearing_PDF_in_memory
  durable_effect:
    - update_all_unique_users_password_hashes
    - increment_each_unique_user_credential_version_once
    - create_one_student_access_export_batch
    - create_one_handoff_item_per_selected_learning_account
    - write_redacted_audit_domain_outbox_and_idempotency_metadata
    - commit_all_or_none

secret_and_retry_policy:
  plaintext_password_in_database: forbidden
  plaintext_password_in_FileAsset_or_object_storage: forbidden
  plaintext_password_in_audit_domain_outbox_logs: forbidden
  plaintext_password_in_idempotency_safe_response_snapshot: forbidden
  secret_bearing_PDF_persisted: false
  full_secret_PDF_render_failure_before_commit:
    durable_password_mutations: 0
  same_idempotency_key_after_completed_reset_batch:
    second_reset: false
    secret_replay: false
    allowed_result: sanitized_nonsecret_result_or_secret_response_not_replayable_error
  delivery_failure_after_commit:
    server_secret_recovery: forbidden
    next_secret_document_requires_new_reset_batch_with_current_expected_versions: true

projection_sync:
  StudentLearningAccount:
    existing_runtime_fields_to_publish_in_OpenAPI:
      version:
        source: student_learning_accounts.version
        minimum: 1
      credential_version:
        source: user_password_management.credential_version
        minimum: 0
    reason: client_must_be_able_to_supply_current_expected_credential_version_without_guessing

implementation_gate_requirements:
  - route_and_controller_bind_license_credentials_bulk_pdf
  - nonsecret_mode_performs_zero_credential_mutations
  - reset_mode_requires_student_access_reset_password_for_every_target
  - reset_mode_rejects_missing_expected_version_before_mutation
  - stale_expected_version_rolls_back_entire_batch
  - duplicate_global_user_mutates_once
  - any_target_authorization_failure_rolls_back_entire_batch
  - PDF_render_failure_before_commit_rolls_back_entire_batch
  - idempotent_retry_never_replays_plaintext_or_repeats_reset
  - no_secret_bytes_in_persistent_storage_or_observability
  - exact_tenant_scope_for_every_selected_learning_account

next_after_PASS:
  id: CORE-V1-BULK-CREDENTIAL-RESET-001
  action: implement_existing_bulk_PDF_operation_against_DB_LIC_004_and_this_transport_authority
