meta:
  project: osk-panel
  scope: compatibility_aggregate
  status: CONSOLIDATED
  consolidated_at: 2026-09-05
  authoritative_baseline: specs/implementation-baseline-v1.yml
  note: >-
    This file is a compatibility aggregate only. For implementation details,
    legal rules, own-product decisions and verified screens use the referenced
    authoritative specs. Older TO_VERIFY_AUTH states were removed from this
    aggregate after the authenticated screen audit.

authority_order:
  - specs/legal/*.yml
  - specs/design/*.yml
  - specs/security/*.yml
  - specs/api/*.yml
  - specs/screens/*.yml
  - specs/implementation-baseline-v1.yml
  - docs/71-admin-osk-module-mapping-status.md
  - this_file

confidence_levels:
  - USER_CONFIRMED_AUTH_SCREEN
  - USER_CONFIRMED_AUTH_MENU
  - LEGAL_VERIFIED
  - OWN_PRODUCT_DECISION
  - CURRENT_CONFIRMED
  - RULES_CONFIRMED
  - HISTORICAL_INDEX
  - TO_VERIFY_AUTH
  - SOURCE_CONFLICT
  - DEMO_BLOCKED
  - UNOBSERVABLE_IN_DEMO_NONBLOCKING

principles:
  clean_room: true
  do_not_copy_source_code: true
  do_not_copy_protected_assets_or_trade_dress: true
  tenant_isolation: true
  permission_based_rbac: true
  course_first_formal_model: true
  pkk_owned_by_course_enrollment: true
  current_osk_training_time_source: training_sessions_and_hour_ledger
  external_training_time_source: recognized_external_training
  formal_exam_requires_student_and_course_enrollment: true
  exam_inventory_default_consumption: consume_on_start
  no_hard_delete_formal_or_financial_history: true
  money_float_forbidden: true
  configurable_instead_of_hardcoded:
    - driving_categories
    - languages_per_product
    - staff_types
    - location_types
    - training_requirements
    - product_variants
    - prices_and_vat
    - exam_capabilities

core_modules:
  dashboard:
    status: READY_FOR_IMPLEMENTATION
    route: /
    spec: specs/screens/main-dashboard.yml

  pkk:
    status: READY_FOR_IMPLEMENTATION
    info_route: /integracja-pkk
    owner: course_enrollment
    specs:
      - specs/screens/pkk-configuration-gate.yml
      - specs/screens/pkk-entrypoints-and-student-list.yml
      - specs/screens/pkk-course-operational-panel.yml

  students:
    status: READY_FOR_IMPLEMENTATION
    route: /kursanci
    aggregate_spec: specs/screens/students.yml

  course_enrollments:
    status: READY_FOR_IMPLEMENTATION
    specs:
      - specs/screens/course-create.yml
      - specs/screens/course-edit.yml
      - specs/screens/course-delete.yml
    legal_rules:
      - specs/legal/training-theory-exemptions.yml
      - specs/legal/editable-training-requirements.yml

  calendar:
    status: READY_FOR_IMPLEMENTATION
    route: /kalendarz
    specs:
      - specs/screens/calendar.yml
      - specs/screens/calendar-add-event.yml

  locations:
    status: READY_FOR_IMPLEMENTATION
    route: /lokalizacje
    specs:
      - specs/screens/locations.yml
      - specs/screens/school-locations-create.yml
      - specs/screens/school-locations-edit.yml

  vehicles:
    status: READY_FOR_IMPLEMENTATION
    route: /pojazdy
    aggregate_spec: specs/screens/vehicles.yml

  staff:
    status: READY_FOR_IMPLEMENTATION
    route: /pracownicy
    aggregate_spec: specs/screens/staff.yml
    rbac: specs/security/permissions.yml

  licenses_purchase:
    status: READY_FOR_IMPLEMENTATION
    route: /licencje/wykup
    spec: specs/screens/license-purchase.yml

  licenses_management:
    status: READY_FOR_IMPLEMENTATION
    route: /licencje/panel
    spec: specs/screens/license-management-panel.yml

  student_finance:
    status: READY_FOR_IMPLEMENTATION
    design: specs/design/student-finance-ledger.yml

  internal_exam_purchase:
    status: READY_FOR_IMPLEMENTATION
    route: /egzamin-wewnetrzny/wykup
    spec: specs/screens/internal-exam-purchase.yml

  internal_exam_management:
    status: READY_FOR_IMPLEMENTATION
    route: /egzamin-wewnetrzny/panel
    spec: specs/screens/internal-exam-management-panel.yml
    lifecycle: specs/design/internal-exam-lifecycle.yml

  settings:
    status: READY_FOR_IMPLEMENTATION
    route: /ustawienia
    spec: specs/screens/settings.yml

  purchase_history:
    status: READY_FOR_IMPLEMENTATION
    route: /historia-zakupow
    spec: specs/screens/purchase-history.yml

cross_cutting_specs:
  api_common_contract: specs/api/common-contract.yml
  lifecycle: specs/design/core-lifecycle.yml
  rbac: specs/security/permissions.yml
  implementation_baseline: specs/implementation-baseline-v1.yml

critical_invariants:
  - relation_ids_are_tenant_validated_server_side
  - pkk_commands_require_course_enrollment_context
  - current_osk_hours_are_derived_from_training_ledger
  - external_hours_are_auditable_separate_records
  - revoke_unactivated_license_restores_exactly_one_inventory_entry_atomically
  - formal_exam_access_reserves_inventory
  - formal_exam_start_consumes_inventory_exactly_once
  - formal_exam_finish_does_not_consume_inventory_again
  - technical_abort_after_exam_start_does_not_auto_restore_inventory
  - student_finance_is_separate_from_platform_purchase_history
  - staff_type_is_separate_from_permissions
  - passwords_are_not_recoverably_stored

remaining_implementation_gaps:
  - machine_readable_openapi_3_1
  - physical_database_schema_and_indexes
  - ADRs_for_critical_architecture_decisions
  - legal_category_dictionary_reverification_including_PT_tram_mapping
  - privacy_retention_schedule
  - RPO_RTO_business_approval

deferred_non_core:
  business_cards:
    route: /wizytowki
    status: NOT_SCREEN_MAPPED
  advertising:
    status: NOT_SCREEN_MAPPED
  lectures:
    route: /wyklady
    status: NOT_SCREEN_MAPPED
  instructor_training:
    route: /szkolenie-z-instruktorem
    status: NOT_SCREEN_MAPPED

historical_or_optional:
  invoices:
    status: HISTORICAL_INDEX
    core_v1_required: false
  impersonation:
    status: HISTORICAL_INDEX
    own_secure_extension_optional: true
  export_progress:
    status: OWN_PRODUCT_DECISION_OPTIONAL
  customer_pause_ad_campaign:
    status: TO_VERIFY_AUTH
  refund_panel_action:
    status: OWN_PRODUCT_DECISION_PROCESS
