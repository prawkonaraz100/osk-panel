meta:
  project: osk-panel
  audited_target: https://biz.prawo-jazdy-360.pl/
  audited_at: 2026-09-05
  reverification_at: 2026-09-05
  method: clean-room functional mapping
  confidence_levels:
    - CURRENT_CONFIRMED
    - RULES_CONFIRMED
    - HISTORICAL_INDEX
    - INFERRED
    - TO_VERIFY_AUTH
    - SOURCE_CONFLICT

principles:
  do_not_copy_source_code: true
  do_not_copy_protected_assets: true
  do_not_guess_authenticated_ui: true
  configurable_instead_of_hardcoded:
    - languages_per_product
    - driving_categories
    - training_sections
    - training_lessons
    - ad_placement_parameters
    - fullscreen_ad_duration
    - auction_parameters

modules:
