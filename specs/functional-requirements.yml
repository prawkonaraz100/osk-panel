      - login
      - logout
      - social_login
      - remember_me
      - request_password_reset_by_email_or_login
      - reset_password
      - resume_return_url_after_auth
      - request_account_closure
    notes:
      - ReturnUrl must be validated against open redirects in our implementation.
      - Single-session behavior is RULES_CONFIRMED for a paid user account, exact staff scope is TO_VERIFY_AUTH.

  organization:
