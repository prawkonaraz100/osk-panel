  - id: DB4_2_IDENTITY_TENANT_RBAC
    status: IN_PROGRESS_WITH_BLOCKERS
    diagnosis: COMPLETE
    result: FAIL_WITH_1_P1_BLOCKER
  - id: DB4_3_STAFF_LOCATIONS_VEHICLES
    status: NOT_STARTED
  - id: DB4_4_STUDENTS_COURSES_TRAINING_LEDGER
    status: NOT_STARTED
  - id: DB4_5_CALENDAR
    status: NOT_STARTED
  - id: DB4_6_LICENSES_LEARNING_ACCESS
    status: NOT_STARTED
  - id: DB4_7_INTERNAL_EXAMS
    status: NOT_STARTED
  - id: DB4_8_PKK
    status: NOT_STARTED
  - id: DB4_9_STUDENT_FINANCE_COMMERCE
    status: NOT_STARTED
  - id: DB4_10_AUDIT_OUTBOX_NOTIFICATIONS
    status: NOT_STARTED
  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX
    status: NOT_STARTED

quality_checks:
  stage_3_contract_is_frozen_before_DB_design:
    status: PASS

  foundation_slice_gate:
    status: PASS
    resolved_blockers:
      - DB-FOUND-001
      - DB-FOUND-002
      - DB-FOUND-003
      - DB-FOUND-004
    open_foundation_P0_P1: 0

  identity_rbac_effective_permission_resolution:
    status: PASS
    resolved_blocker_id: DB-IAM-001
    decision:
      role_template_runtime_dependency: false
      runtime_source_of_truth: membership_permissions
      missing_permission_row: deny
      future_permission_default: deny_until_explicit_action

  identity_rbac_data_scope_physical_contract:
    status: PASS
    resolved_blocker_id: DB-IAM-002
    decision:
      membership_wide_data_scope_string: superseded_and_runtime_forbidden
      scope_binding: per_membership_permission
      physical_tables:
        - data_scopes
        - permission_scope_options
        - membership_permission_scopes
      granted_permission_without_scope: deny_fail_closed
      unsupported_permission_scope_pair: rejected
      organization_scope_bypasses_tenant_validation: false

  auth_session_membership_integrity:
    status: PASS
    resolved_blocker_id: DB-IAM-003
    decision:
      same_user_database_enforcement: composite_foreign_key
      source_columns: [organization_membership_id, user_id]
      target_table: organization_memberships
      target_columns: [id, user_id]
      null_membership_context_allowed_for_global_or_pre_tenant_flow: true
      tenant_owned_operation_without_membership_context: deny
      membership_user_reassignment: forbidden

  identity_owner_and_privilege_management_invariants:
    status: PASS
    resolved_blocker_id: DB-IAM-004
    decision:
      owner_marker:
        table: organization_memberships
        column: is_owner
        authorization_shortcut: false
      owner_protected_permission_baseline:
        organization.view: organization
        organization.members.manage: organization
        staff.permissions.manage: organization
        sessions.manage.organization: organization
      last_owner_guard:
        serialization: organization_row_lock_or_equivalent_governance_lock
        post_transaction_active_owner_count_minimum: 1
        atomic_owner_transfer_supported: true
      self_escalation:
        self_grant_new_permission: forbidden
        self_scope_broadening: forbidden
        self_owner_promotion: forbidden
        self_template_reapply_that_expands_privilege: forbidden
      grant_ceiling:
        actor_must_hold_permission_being_delegated: true
        delegated_scope_cannot_be_broader_than_actor_scope: true
        elevated_grant_or_scope_broadening_requires_active_owner_actor: true
      authorization_version:
        table: organization_memberships
        column: authorization_version
        minimum: 1
        increment_on_permission_scope_owner_or_authorization_eligibility_change: true
        stale_authorization_cache_or_elevation_proof: invalid
      elevated_revoke_effective_by_next_authorized_request: true
      session_authentication_need_not_be_terminated_only_to_apply_permission_revoke: true
      full_suspend_revoke_session_lifecycle: deferred_to_DB_IAM_005
    tests:
      - owner_marker_alone_does_not_authorize
      - owner_without_protected_baseline_fails_consistency
      - self_promotion_and_self_grant_are_denied
      - actor_cannot_grant_permission_or_scope_above_own_ceiling
      - zero_owner_post_transaction_state_is_rejected
      - concurrent_owner_demotions_cannot_leave_zero_owners
      - owner_transfer_is_atomic
      - protected_owner_permission_cannot_be_revoked_without_same_transaction_demotion
      - elevated_revoke_increments_authorization_version
      - stale_authorization_cache_cannot_authorize_after_version_change
    machine_source:
      - specs/database/identity-rbac.yml
    narrative_source:
      - docs/04-roles-permissions.md
      - docs/105-stage-4-identity-tenant-rbac-audit.md
    aggregate_sync_note: >-
      core-schema.yml and docs/87 are synchronized only at final DB4_2 closure.
      Migrations remain blocked until then.

  membership_and_permission_mutation_lifecycle:
    status: FAIL
    blocker_id: DB-IAM-005
    unresolved:
      - exact_membership_states_and_transitions
      - durable_reactivation_vs_multiple_membership_period_rows
      - revoke_suspend_session_invalidation_semantics
      - permission_change_concurrency_and_lost_update_prevention
      - audit_actor_reason_version_semantics
      - relationship_between_mutation_version_and_authorization_version
    impact: destructive_delete_stale_authorization_or_lost_update_behavior_could_be_implemented

  calendar_overlap_database_strategy:
    status: PENDING_LATER_STAGE4_SLICE

resolved_blockers:
  - id: DB-FOUND-001
    severity: P1
    resolution: application_generated_UUIDv7_in_native_PostgreSQL_uuid
  - id: DB-FOUND-002
    severity: P1
    resolution: separate_partial_unique_indexes_for_global_and_tenant_nullable_scopes
  - id: DB-FOUND-003
    severity: P1
    resolution: organization_contact_addresses_is_canonical_one_to_one_physical_table
  - id: DB-FOUND-004
    severity: P1
    resolution: remaining_Stage_2_settings_ownership_fields_and_constraints_are_merged_into_core_physical_blueprint
  - id: DB-IAM-001
    severity: P1
    resolution: materialized_membership_permission_snapshot_and_runtime_template_independence
  - id: DB-IAM-002
    severity: P1
    resolution: per_permission_scope_rows_with_fail_closed_resolvers
  - id: DB-IAM-003
    severity: P1
    resolution: composite_session_membership_same_user_foreign_key
  - id: DB-IAM-004
    severity: P1
    resolution: >-
      Explicit is_owner governance marker plus protected materialized permission
      baseline, serialized last-owner transactions, self-escalation prohibition,
      grant ceiling and authorization_version invalidation semantics.

open_blockers:
  - id: DB-IAM-005
    severity: P1
    description: Membership and explicit-permission mutation lifecycle/concurrency/session effects are under-specified.

gate_definition:
  PASS_requires:
    - no_open_P0_or_P1_blockers
    - every_stage_4_slice_is_PASS_or_explicitly_deferred_by_a_separate_production_gate
    - physical_schema_and_narrative_schema_are_synchronized
    - migration_order_is_dependency_safe
    - database_invariant_test_matrix_exists
    - reverse_engineering_preservation_is_traceable_to_schema_or_use_case
  current_result: FAIL_DB4_2_WITH_1_OPEN_P1_BLOCKER
  may_start_stage_5: false
  may_start_UI_or_feature_implementation: false
  may_start_DB4_3: false

next_single_step:
  id: DB4_2_STEP_6
  blocker: DB-IAM-005
  action: resolve_membership_and_permission_mutation_lifecycle_concurrency_and_session_effects_only
  allowed_scope:
    - specs/database/identity-rbac.yml
    - docs/04-roles-permissions.md
    - docs/08-security-compliance.md
    - specs/security/permissions.yml
