    status: PASS_DIAGNOSIS_COMPLETE
    source: docs/108-stage-4-students-courses-training-ledger-audit.md
    diagnosed_P0: 0
    diagnosed_P1: 8
    fixes_applied_in_diagnosis_step: 0
    aggregate_core_schema_modified_in_diagnosis: false
    aggregate_docs87_modified_in_diagnosis: false
    later_domain_slices_entered: false
    Laravel_migrations_created: false
    UI_or_feature_implementation_started: false
    preservation_checks:
      all_four_observed_course_hour_fields_remain_in_scope: PASS
      current_OSK_form_hours_do_not_self_credit_formal_time: PASS
      recognized_external_training_remains_separate: PASS
      theory_45_minute_and_practical_60_minute_rules_respected_as_input_requirements: PASS
      formal_history_hard_delete_not_introduced: PASS

  student_course_training_same_tenant_integrity:
    status: FAIL
    blocker_id: DB-TRN-001
    severity: P1
    unresolved: >-
      Student, CourseEnrollment, TrainingSession, attendance, requirement, external
      training and ledger relations do not yet have complete physical same-tenant
      integrity across every tenant-owned relation ID.
    impact: cross_tenant_formal_training_or_hour_records_can_be_created_if_application_validation_is_bypassed

  student_formal_identity_and_duplicate_lifecycle:
    status: FAIL
    blocker_id: DB-TRN-002
    severity: P1
    unresolved: >-
      The database does not yet physically require the PESEL-or-birth-date formal
      identity branch and does not finalize PESEL hash/ciphertext consistency,
      per-organization duplicate identity semantics, archive and restore behavior.
    impact: invalid_formal_student_identity_or_duplicate_durable_student_records

  student_concurrency_archive_restore_lifecycle:
    status: FAIL
    blocker_id: DB-TRN-003
    severity: P1
    unresolved: >-
      The Student API exposes optimistic version semantics but the students table
      lacks the physical concurrency root, and archive/restore effects on active
      formal CourseEnrollment history are not fully serialized or defined.
    impact: lost_updates_or_inconsistent_student_course_archive_state

  course_lifecycle_stage_history_cancel_restore:
    status: FAIL
    blocker_id: DB-TRN-004
    severity: P1
    unresolved: >-
      training_stage, completed_at, interrupted_at and cancelled_at do not yet have
      a canonical lifecycle matrix, durable stage-transition history and serialized
      cancel/restore/correction semantics.
    impact: contradictory_course_state_or_loss_of_formal_stage_history

  requirement_context_profile_reproducibility:
    status: FAIL
    blocker_id: DB-TRN-005
    severity: P1
    unresolved: >-
      Editable source facts and each rule-engine recalculation are not yet modeled
      as a complete durable context plus reproducible immutable decision history
      with rule-set version, actor, reason and before/output evidence.
    impact: cannot_deterministically_reconstruct_why_formal_requirements_changed

  training_attendance_ledger_exactly_once:
    status: FAIL
    blocker_id: DB-TRN-006
    severity: P1
    unresolved: >-
      Verified attendance to training-hour-ledger credit lacks complete same-course
      student integrity, exactly-once base credit, cancellation guards and explicit
      correction/reversal source-entry lifecycle constraints.
    impact: formal_hours_can_be_double_credited_or_credited_to_wrong_student_or_cancelled_session

  recognized_external_training_projection_history:
    status: FAIL
    blocker_id: DB-TRN-007
    severity: P1
    unresolved: >-
      The physical model does not distinguish an unambiguous current course-form
      external-hours projection from additive documented historical transfers and
      their revoke/correction lifecycle.
    impact: previous_OSK_hours_can_be_double_counted_or_projected_nondeterministically

  course_required_pkk_persistence_boundary:
    status: FAIL
    blocker_id: DB-TRN-008
    severity: P1
    unresolved: >-
      Dedicated course create/edit requires a course-scoped PKK, but the minimal
      atomic persistence boundary between CourseEnrollment and PKK identity is not
      yet closed before the later DB4_8 provider lifecycle slice.
    impact: course_can_commit_without_required_PKK_identity_or_with_mismatched_course_tenant_ownership

  DB4_4_nonblockers_deferred_to_dependent_slices:
