meta:
  project: osk-panel
  stage: 4
  name: database_invariants_and_migration_design_gate
  branch: docs-consolidation-2026-09-05
  status: IN_PROGRESS
  started_at: 2026-09-05
  rule: stage_5_and_UI_or_Laravel_feature_implementation_must_not_start_until_stage_4_is_PASS

prerequisite:
  stage_3_openapi_contract_gate:
    required_result: PASS
    observed_result: PASS
    status: PASS

stage_4_working_rule:
  one_database_slice_at_a_time: true
  diagnose_before_fixing_each_slice: true
  fix_one_blocker_then_rerun_gate: true
  migration_files_not_generated_until_relevant_design_gates_are_closed: true
  reverse_engineering_capabilities_may_not_be_dropped_to_simplify_schema: true
  formal_financial_and_audit_history_may_not_be_hard_deleted: true
  every_cross_tenant_relation_requires_database_or_transactional_tenant_integrity: true

sources:
  aggregate_blueprint:
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
  bounded_contexts:
    - specs/database/organization-settings.yml
    - specs/database/identity-rbac.yml
    - specs/database/staff-locations-vehicles.yml
  security:
    - specs/security/permissions.yml
    - docs/04-roles-permissions.md
    - docs/08-security-compliance.md
  preservation:
    - docs/96-reverse-engineering-preservation-contract.md
    - specs/reverse-engineering-manifest.yml
    - specs/traceability/core-v1.yml

