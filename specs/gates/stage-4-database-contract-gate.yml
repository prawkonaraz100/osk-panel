    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_document_current_projection:
    status: PASS
    resolved_blocker_id: DB-RES-004
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    decision:
      history_model: versioned_rows_with_superseded_at
      current_predicate: superseded_at_is_null
      current_cardinality: zero_or_one_per_parent_and_document_type
      staff_current_unique:
        type: partial_unique
        columns: [organization_id, staff_profile_id, document_type]
        where: superseded_at_is_null
      vehicle_current_unique:
        type: partial_unique
        columns: [organization_id, vehicle_id, document_type]
        where: superseded_at_is_null
      normal_edit_overwrites_business_fields_in_place: false
      hard_delete_on_edit_or_clear: false
      latest_created_at_heuristic_allowed: false

  staff_vehicle_identity_uniqueness_lifecycle:
    status: PASS
    resolved_blocker_id: DB-RES-005
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    decision:
      uniqueness_scope: per_organization
      staff_PESEL:
        type: partial_unique
        columns: [organization_id, pesel_lookup_hash]
        where: pesel_lookup_hash_is_not_null
        archived_rows_included: true
        archive_releases_value: false
      vehicle_VIN:
        type: partial_unique
        columns: [organization_id, vin_normalized]
        where: vin_normalized_is_not_null
        archived_rows_included: true
        archive_releases_value: false
      vehicle_registration:
        type: partial_unique
        columns: [organization_id, registration_number_normalized]
        where: archived_at_is_null
        archive_releases_value_for_current_fleet: true
        archived_history_keeps_value: true
        restore_requires_current_registration_free: true
      hard_delete_to_release_identity_as_normal_lifecycle: false
      explicit_identity_correction_requires_audit: true
      database_unique_constraint_is_final_concurrency_boundary: true

  staff_archive_panel_access_lifecycle:
    status: PASS
    resolved_blocker_id: DB-RES-006
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    narrative_source: docs/107-stage-4-staff-locations-vehicles-audit.md
    decision:
      archived_staff_may_have_active_staff_membership_link: false
      active_link_requires_nonarchived_staff: true
      archive_and_link_creation_race_serialized_on_staff_profile: true
      normal_archive_hard_deletes_link_or_membership_history: false
      archive_without_active_link_changes_membership: false
      linked_nonowner_active_membership_on_archive: suspend_using_DB_IAM_005
      linked_nonowner_suspended_membership_on_archive: keep_suspended
      linked_nonowner_revoked_membership_on_archive: keep_revoked
      nonowner_archive_clears_bound_session_tenant_contexts_when_suspended: true
      linked_owner_membership_on_standard_staff_archive:
        end_staff_membership_link: true
        change_is_owner: false
        change_membership_status: false
        reason: owner_governance_is_separate_high_risk_lifecycle
      owner_panel_access_removal_as_hidden_staff_archive_side_effect: forbidden
      owner_access_removal_requires_explicit_DB_IAM_004_005_governance_flow: true
      sole_owner_staff_profile_may_be_archived_while_owner_membership_stays_active: true
      staff_derived_own_assigned_location_assigned_student_scope_after_archive: deny_empty_set
      restore_staff_profile_auto_restores_panel_access: false
      restore_staff_profile_auto_rebinds_old_sessions: false
      explicit_panel_access_restore_creates_new_link_row: true
      old_unlinked_link_row_reopened: false
      suspended_membership_restore_uses_DB_IAM_005: true
      revoked_membership_auto_reactivated_by_staff_restore: false
      archive_is_atomic_across_staff_link_membership_session_audit_outbox: true
    migration_precheck:
      - detect_archived_staff_with_active_staff_membership_link
      - detect_active_link_pointing_to_archived_staff
      - detect_active_nonowner_staff_panel_membership_left_for_archived_staff
      - never_silently_reactivate_staff_transfer_owner_revoke_membership_or_delete_link_history
    tests:
      - archive_without_panel_link_has_no_membership_side_effect
      - archive_active_nonowner_unlinks_and_suspends_atomically
      - archive_nonowner_clears_bound_session_tenant_contexts
      - archive_suspended_or_revoked_nonowner_does_not_restore_authorization
      - archive_owner_ends_staff_link_but_keeps_owner_governance_unchanged
      - sole_owner_archive_does_not_create_zero_active_owner_state
      - owner_access_removal_requires_explicit_governance_flow
      - archived_staff_cannot_receive_active_staff_link
      - archive_vs_link_creation_race_cannot_commit_invalid_state
      - archived_staff_staff_derived_resolvers_deny
      - restore_staff_does_not_auto_restore_panel_access
      - explicit_restore_creates_new_link_and_preserves_old_link_history
      - revoked_membership_is_not_implicitly_reactivated
      - archive_failure_rolls_back_all_cross_aggregate_effects

  DB4_3_final_aggregate_sync:
    status: PENDING
    required_sources:
      - specs/database/staff-locations-vehicles.yml
      - specs/database/core-schema.yml
      - docs/87-physical-database-schema.md
    requirement: >-
      All six bounded-context decisions must be represented without semantic loss
      or contradiction in core-schema.yml and docs/87 before DB4_3 can become PASS.

  DB4_3_nonblockers_deferred_to_dependent_slices:
    - future_calendar_event_behavior_after_resource_archive_to_DB4_5
    - active_course_behavior_after_staff_or_location_archive_to_DB4_4
    - exact_expiring_soon_threshold_projection_config
    - city_dictionary_provider_choice
    - competitor_unobservable_delete_backend_semantics

  calendar_overlap_database_strategy:
