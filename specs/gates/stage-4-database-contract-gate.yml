  staff_membership_link_same_organization_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-001
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_location_assignment_tenant_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-002
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_file_asset_attachment_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-003
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_document_current_projection:
    status: PASS
    resolved_blocker_id: DB-RES-004
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    narrative_source: docs/107-stage-4-staff-locations-vehicles-audit.md
    decision:
      history_model: versioned_rows_with_superseded_at
      current_predicate: superseded_at_is_null
      current_cardinality: zero_or_one_per_parent_and_document_type
      staff_current_unique:
        type: partial_unique
        columns: [organization_id, staff_profile_id, document_type]
        where: superseded_at_is_null
      vehicle_current_unique:
        type: partial_unique
        columns: [organization_id, vehicle_id, document_type]
        where: superseded_at_is_null
      normal_edit_overwrites_business_fields_in_place: false
      hard_delete_on_edit_or_clear: false
      replacement_transaction_serializes_on_parent: true
      historical_business_fields_immutable: true
      current_projection_uses_only_non_superseded_rows: true
      calendar_important_date_input_uses_only_current_nonnull_valid_until: true
      latest_created_at_heuristic_allowed: false
      DB_RES_003_asset_attachment_gate_still_applies_to_each_new_version: true
    migration_precheck:
      - detect_multiple_candidate_current_staff_document_rows_per_type
      - detect_multiple_candidate_current_vehicle_document_rows_per_type
      - do_not_silently_choose_MAX_created_at_or_MAX_id
      - require_explicit_auditable_mapping_or_remediation_before_current_unique_indexes
    tests:
      - at_most_one_current_staff_document_per_type
      - at_most_one_current_vehicle_document_per_type
      - replacement_preserves_previous_version
      - concurrent_replacements_cannot_leave_two_current_rows
      - current_projection_ignores_superseded_rows
      - clear_document_preserves_history_and_leaves_zero_current_rows
      - historical_business_fields_immutable
      - current_valid_until_null_means_no_expiry_date
      - superseded_row_does_not_emit_current_important_date
      - ambiguous_migration_history_is_not_auto_resolved_by_latest_created_at

  staff_vehicle_identity_uniqueness_lifecycle:
    status: FAIL
    blocker_id: DB-RES-005
    severity: P1
    unresolved:
      - staff_PESEL_uniqueness_across_archive_restore_when_present
      - vehicle_registration_uniqueness_across_archive_restore
      - vehicle_VIN_uniqueness_when_present
    impact: migration_constraints_and_restore_behavior_can_conflict_or_allow_duplicate_resource_identity

  staff_archive_panel_access_lifecycle:
    status: FAIL
    blocker_id: DB-RES-006
    severity: P1
    unresolved: >-
      Archiving StaffProfile does not yet define the atomic effect on active
      StaffMembershipLink and OrganizationMembership. Leaving membership active can
      preserve panel access for archived staff; destructive revoke can break safe
      restore and last-owner invariants.
    impact: archived_staff_may_retain_access_or_restore_may_become_inconsistent

  DB4_3_nonblockers_deferred_to_dependent_slices:
    - future_calendar_event_behavior_after_resource_archive_to_DB4_5
    - active_course_behavior_after_staff_or_location_archive_to_DB4_4
    - exact_expiring_soon_threshold_projection_config
    - city_dictionary_provider_choice
    - competitor_unobservable_delete_backend_semantics

  calendar_overlap_database_strategy:
