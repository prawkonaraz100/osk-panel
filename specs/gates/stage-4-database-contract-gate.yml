    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    aggregate_machine_source: specs/database/core-schema.yml
    aggregate_narrative_source: docs/87-physical-database-schema.md

  staff_vehicle_document_current_projection:
    status: PASS
    resolved_blocker_id: DB-RES-004
    severity: P1
    decision:
      history_model: versioned_rows_with_superseded_at
      current_predicate: superseded_at_is_null
      current_cardinality: zero_or_one_per_parent_and_document_type
      staff_current_unique:
        type: partial_unique
        columns: [organization_id, staff_profile_id, document_type]
        where: superseded_at_is_null
      vehicle_current_unique:
        type: partial_unique
        columns: [organization_id, vehicle_id, document_type]
        where: superseded_at_is_null
      normal_edit_overwrites_business_fields_in_place: false
      hard_delete_on_edit_or_clear: false
      latest_created_at_heuristic_allowed: false

  staff_vehicle_identity_uniqueness_lifecycle:
    status: PASS
    resolved_blocker_id: DB-RES-005
    severity: P1
    decision:
      uniqueness_scope: per_organization
      staff_PESEL:
        type: partial_unique
        columns: [organization_id, pesel_lookup_hash]
        where: pesel_lookup_hash_is_not_null
        archived_rows_included: true
        archive_releases_value: false
      vehicle_VIN:
        type: partial_unique
        columns: [organization_id, vin_normalized]
        where: vin_normalized_is_not_null
        archived_rows_included: true
        archive_releases_value: false
      vehicle_registration:
        type: partial_unique
        columns: [organization_id, registration_number_normalized]
        where: archived_at_is_null
        archive_releases_value_for_current_fleet: true
        archived_history_keeps_value: true
        restore_requires_current_registration_free: true
      hard_delete_to_release_identity_as_normal_lifecycle: false
      explicit_identity_correction_requires_audit: true
      database_unique_constraint_is_final_concurrency_boundary: true

  staff_archive_panel_access_lifecycle:
    status: PASS
    resolved_blocker_id: DB-RES-006
    severity: P1
    decision:
      archived_staff_may_have_active_staff_membership_link: false
      active_link_requires_nonarchived_staff: true
      archive_and_link_creation_race_serialized_on_staff_profile: true
      normal_archive_hard_deletes_link_or_membership_history: false
      archive_without_active_link_changes_membership: false
      linked_nonowner_active_membership_on_archive: suspend_using_DB_IAM_005
      linked_nonowner_suspended_membership_on_archive: keep_suspended
      linked_nonowner_revoked_membership_on_archive: keep_revoked
      linked_owner_membership_on_standard_staff_archive:
