  DB4_3_diagnosis:
    status: PASS_DIAGNOSIS_COMPLETE
    source: docs/107-stage-4-staff-locations-vehicles-audit.md
    fixes_started_during_diagnosis: false
    later_domain_slices_entered: false
    Laravel_migrations_created: false

  staff_membership_link_same_organization_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-001
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    decision:
      link_tenant_key: staff_membership_links.organization_id
      staff_profile_candidate_key: [organization_id, id]
      organization_membership_candidate_key: [organization_id, id]
      staff_profile_composite_FK:
        source_columns: [organization_id, staff_profile_id]
        target_table: staff_profiles
        target_columns: [organization_id, id]
      organization_membership_composite_FK:
        source_columns: [organization_id, organization_membership_id]
        target_table: organization_memberships
        target_columns: [organization_id, id]
      active_link_uniqueness_preserved: true
      unlink_history_preserved: true

  staff_vehicle_location_assignment_tenant_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-002
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    narrative_source: docs/107-stage-4-staff-locations-vehicles-audit.md
    decision:
      staff_location_assignment_tenant_key: organization_id
      staff_location_assignment_primary_key: [organization_id, staff_profile_id, location_id]
      staff_location_assignment_composite_FKs:
        - source: [organization_id, staff_profile_id]
          target_table: staff_profiles
          target: [organization_id, id]
        - source: [organization_id, location_id]
          target_table: locations
          target: [organization_id, id]
      vehicle_location_assignment_tenant_key: organization_id
      vehicle_location_assignment_primary_key: [organization_id, vehicle_id, location_id]
      vehicle_location_assignment_composite_FKs:
        - source: [organization_id, vehicle_id]
          target_table: vehicles
          target: [organization_id, id]
        - source: [organization_id, location_id]
          target_table: locations
          target: [organization_id, id]
      required_candidate_keys:
        - staff_profiles[organization_id,id]
        - vehicles[organization_id,id]
        - locations[organization_id,id]
      parent_tenant_key_rewrite: forbidden
      duplicate_assignment: rejected
      category_assignments_changed: false
      assigned_locations_RBAC_cross_tenant_expansion_possible_after_constraints: false
    migration_precheck:
      - detect_existing_cross_tenant_staff_location_pairs
      - detect_existing_cross_tenant_vehicle_location_pairs
      - detect_duplicates_before_primary_key_creation
      - backfill_assignment_organization_id_only_from_verified_parent_then_verify_other_parent
      - fail_or_explicit_security_remediation_never_silent_reassignment
    tests:
      - same_tenant_staff_location_accepted
      - cross_tenant_staff_location_rejected
      - staff_assignment_tenant_key_mismatch_rejected
      - duplicate_staff_location_rejected
      - same_tenant_vehicle_location_accepted
      - cross_tenant_vehicle_location_rejected
      - vehicle_assignment_tenant_key_mismatch_rejected
      - duplicate_vehicle_location_rejected
      - assigned_locations_RBAC_query_cannot_cross_tenant
      - vehicle_location_calendar_filter_cannot_cross_tenant
    aggregate_sync_note: >-
      DB4_3 bounded-context decisions are accumulated in
      specs/database/staff-locations-vehicles.yml and synchronized into
      core-schema.yml/docs87 before final DB4_3 PASS and before migrations.

  staff_vehicle_file_asset_attachment_integrity:
    status: FAIL
    blocker_id: DB-RES-003
    severity: P1
    unresolved:
      - StaffProfile_photo_same_tenant_ready_purpose_contract
      - StaffDocument_asset_same_tenant_ready_purpose_contract
      - Vehicle_photo_same_tenant_ready_purpose_contract
      - VehicleDocument_asset_same_tenant_ready_purpose_contract
    impact: private_or_foreign_asset_can_be_attached_to_wrong_tenant_resource_if_backend_bug_occurs

  staff_vehicle_document_current_projection:
    status: FAIL
    blocker_id: DB-RES-004
    severity: P1
    unresolved: >-
      Physical document tables allow multiple rows per parent/document_type but do
      not define one current row or version/supersede semantics, while verified UI
      exposes one current validity date per type.
    impact: detail_expiry_and_important_date_projection_are_ambiguous

  staff_vehicle_identity_uniqueness_lifecycle:
    status: FAIL
    blocker_id: DB-RES-005
    severity: P1
    unresolved:
      - staff_PESEL_uniqueness_across_archive_restore_when_present
      - vehicle_registration_uniqueness_across_archive_restore
      - vehicle_VIN_uniqueness_when_present
    impact: migration_constraints_and_restore_behavior_can_conflict_or_allow_duplicate_resource_identity

  staff_archive_panel_access_lifecycle:
    status: FAIL
    blocker_id: DB-RES-006
    severity: P1
    unresolved: >-
      Archiving StaffProfile does not yet define the atomic effect on active
      StaffMembershipLink and OrganizationMembership. Leaving membership active can
      preserve panel access for archived staff; destructive revoke can break safe
      restore and last-owner invariants.
    impact: archived_staff_may_retain_access_or_restore_may_become_inconsistent

  DB4_3_nonblockers_deferred_to_dependent_slices:
    - future_calendar_event_behavior_after_resource_archive_to_DB4_5
    - active_course_behavior_after_staff_or_location_archive_to_DB4_4
    - exact_expiring_soon_threshold_projection_config
    - city_dictionary_provider_choice
    - competitor_unobservable_delete_backend_semantics

  calendar_overlap_database_strategy:
