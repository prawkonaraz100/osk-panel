        change_is_owner: false
        change_membership_status: false
      owner_panel_access_removal_as_hidden_staff_archive_side_effect: forbidden
      owner_access_removal_requires_explicit_DB_IAM_004_005_governance_flow: true
      sole_owner_staff_profile_may_be_archived_while_owner_membership_stays_active: true
      staff_derived_scope_after_archive: deny_empty_set
