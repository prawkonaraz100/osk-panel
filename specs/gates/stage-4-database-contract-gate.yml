      status: PASS
      decision:
        role_template_runtime_dependency: false
        runtime_permission_source: membership_permissions
        missing_or_future_permission_default: deny
        template_reapply: explicit_atomic_command

    DB_IAM_002:
      status: PASS
      decision:
        membership_wide_data_scope: removed_from_canonical_runtime_model
        scope_binding: per_membership_permission
        tables:
          - data_scopes
          - permission_scope_options
          - membership_permission_scopes
        granted_without_scope: deny_fail_closed
        tenant_validation_precedes_scope: true

    DB_IAM_003:
      status: PASS
      decision:
        auth_session_same_user_membership_integrity: composite_FK
        source: auth_sessions[organization_membership_id,user_id]
        target: organization_memberships[id,user_id]
        null_membership_global_or_pre_tenant_flow: allowed
        tenant_operation_without_active_membership: deny
        membership_user_id_reassignment: forbidden

    DB_IAM_004:
      status: PASS
      decision:
        owner_marker: organization_memberships.is_owner
        owner_marker_is_permission_shortcut: false
        protected_owner_baseline_required: true
        last_owner_post_transaction_minimum: 1
        owner_mutations_serialized_per_organization: true
        normal_self_escalation: forbidden
        grant_ceiling: required
        authorization_version_security_epoch: required

    DB_IAM_005:
      status: PASS
      decision:
        durable_membership_row_per_organization_user: true
        hard_delete: forbidden
        statuses: [active, suspended, revoked]
        membership_version_concurrency_root: true
        authorization_version_security_epoch: true
        suspended_retains_permission_scope_config: true
        revoked_clears_runtime_owner_permission_scope: true
        revoked_reactivation_requires_fresh_provisioning: true
        suspend_or_revoke_clears_bound_session_tenant_contexts_same_transaction: true
        permission_revoke_while_active_effective_next_request_without_forced_logout: true
        audit_and_outbox_same_transaction: true

    final_aggregate_sync:
      status: PASS
      checks:
        core_schema_contains_DB_IAM_001_through_005: true
        docs_87_contains_same_canonical_RBAC_shape: true
        bounded_context_status_final_synced: true
        membership_wide_data_scope_not_runtime_authority: true
        DB_IAM_migration_test_obligations_recorded: true
        Laravel_migrations_created_in_this_slice: false
        DB4_3_design_started_during_sync: false
      traceability_direct_edit_required: false
