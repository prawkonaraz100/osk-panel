quality_checks:
  stage_3_contract_is_frozen_before_DB_design:
    status: PASS

  physical_primary_key_type_is_final:
    status: PASS
    resolved_blocker_id: DB-FOUND-001
    decision:
      physical_type: postgresql_native_uuid
      generated_domain_id_version: UUIDv7
      generation_owner: application_before_insert
      database_UUIDv7_default_required: false
      external_provider_identifiers_as_primary_keys: forbidden
      silent_UUIDv4_fallback: forbidden
    evidence:
      - specs/database/core-schema.yml conventions.primary_key is finalized
      - docs/87-physical-database-schema.md documents the same UUIDv7/native-uuid decision
      - migration test obligation verifies UUIDv7 generation for synthetic domain IDs
    compatibility_note: >-
      Stage-3 public resource identifiers already permit UUID strings, so this
      physical decision does not require reopening the frozen HTTP contract.

  nullable_scope_unique_constraints_are_null_safe:
    status: FAIL
    blocker_id: DB-FOUND-002
    affected_constraints:
      - idempotency_records.organization_id_operation_key_idempotency_key
      - account_closure_requests.user_id_organization_id_pending
    evidence: >-
      organization_id is nullable in both scopes, but the current blueprint uses a
      normal PostgreSQL unique/partial-unique key including organization_id. In
      PostgreSQL, ordinary UNIQUE semantics treat NULL values as distinct, so more
      than one global/non-tenant row can bypass the intended uniqueness rule.
    required_design: >-
      Define explicit tenant and global uniqueness strategies, for example separate
      partial unique indexes for organization_id IS NOT NULL and organization_id IS
      NULL, or an equally explicit PostgreSQL NULLS NOT DISTINCT strategy if the
      chosen server/version and migration policy guarantee it.

  stage_2_settings_tables_are_present_in_core_inventory:
    status: FAIL
    blocker_id: DB-FOUND-003
    evidence:
      - specs/database/organization-settings.yml requires organization_contact_addresses
      - specs/database/core-schema.yml core_tables does not list organization_contact_addresses
      - docs/87-physical-database-schema.md identity/organization section does not define organization_contact_addresses
    impact: company_address_would_have_no_canonical_migration_target

  stage_2_settings_fields_and_constraints_are_merged_into_physical_blueprint:
    status: FAIL
    blocker_id: DB-FOUND-004
    missing_or_not_yet_merged:
      - users.first_name
      - users.last_name
      - organizations.phone
      - auth_login_identifiers.is_primary_for_type
      - primary_current_email_partial_unique_constraint
      - organization_settings.version
      - organization_contact_addresses_fields_and_constraints
      - canonical_PKK_settings_fields_from_specs_database_organization_settings
    rule: >-
      Stage-2 bounded-context ownership is authoritative. Physical migrations may
      not silently fall back to the older generic core table shapes.

  cross_tenant_relation_integrity_strategy:
    status: PENDING_LATER_STAGE4_SLICE
    note: >-
      Simple UUID foreign keys plus application checks are not yet accepted as the
      final strategy for staff/location/vehicle/course relations. This will be
      closed per bounded context rather than mixed into the foundation fix.

  calendar_overlap_database_strategy:
    status: PENDING_LATER_STAGE4_SLICE
    note: keep separate from foundation; existing server-side requirement remains mandatory

resolved_blockers:
  - id: DB-FOUND-001
    severity: P1
    resolution: >-
      Synthetic domain identifiers use application-generated UUIDv7 stored in
      native PostgreSQL uuid columns. Matching foreign keys use uuid; provider and
      import identifiers remain separate external-reference fields.

open_blockers:
  - id: DB-FOUND-002
    severity: P1
    description: Nullable organization scopes make two intended unique constraints unsafe under ordinary PostgreSQL NULL semantics.
  - id: DB-FOUND-003
    severity: P1
    description: organization_contact_addresses is authoritative in Stage 2 but absent from the aggregate core table inventory.
  - id: DB-FOUND-004
    severity: P1
    description: Stage-2 settings fields/constraints are not yet merged into the physical core blueprint.

gate_definition:
  PASS_requires:
    - no_open_P0_or_P1_blockers
    - every_stage_4_slice_is_PASS_or_explicitly_deferred_by_a_separate_production_gate
