stage_4_working_rule:
  one_database_slice_at_a_time: true
  migration_files_not_generated_until_foundation_decisions_are_closed: true
  reverse_engineering_capabilities_may_not_be_dropped_to_simplify_schema: true
  formal_financial_and_audit_history_may_not_be_hard_deleted: true
  every_cross_tenant_relation_requires_database_or_transactional_tenant_integrity: true

sources:
  aggregate_blueprint:
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
  bounded_context_overrides:
    - specs/database/organization-settings.yml
    - docs/100-osk-settings-domain-model.md
  cross_layer_contract:
    - specs/api/common-contract.yml
    - specs/api/required-operations-v1.yml
    - specs/traceability/core-v1.yml
  preservation:
    - docs/96-reverse-engineering-preservation-contract.md
    - specs/reverse-engineering-manifest.yml

stage_4_slices:
  - id: DB4_1_FOUNDATION_DIAGNOSIS
    status: IN_PROGRESS
    scope:
      - primary_key_physical_type
      - nullable_scope_unique_constraints
      - Stage_2_settings_schema_merge
    result: FAIL_WITH_1_REMAINING_BLOCKER
  - id: DB4_2_IDENTITY_TENANT_RBAC
    status: NOT_STARTED
  - id: DB4_3_STAFF_LOCATIONS_VEHICLES
    status: NOT_STARTED
  - id: DB4_4_STUDENTS_COURSES_TRAINING_LEDGER
    status: NOT_STARTED
  - id: DB4_5_CALENDAR
    status: NOT_STARTED
  - id: DB4_6_LICENSES_LEARNING_ACCESS
    status: NOT_STARTED
  - id: DB4_7_INTERNAL_EXAMS
    status: NOT_STARTED
  - id: DB4_8_PKK
    status: NOT_STARTED
  - id: DB4_9_STUDENT_FINANCE_COMMERCE
    status: NOT_STARTED
  - id: DB4_10_AUDIT_OUTBOX_NOTIFICATIONS
    status: NOT_STARTED
  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX
    status: NOT_STARTED

quality_checks:
  stage_3_contract_is_frozen_before_DB_design:
    status: PASS

  physical_primary_key_type_is_final:
    status: PASS
    resolved_blocker_id: DB-FOUND-001
    decision:
      physical_type: postgresql_native_uuid
      generated_domain_id_version: UUIDv7
      generation_owner: application_before_insert
      database_UUIDv7_default_required: false
      external_provider_identifiers_as_primary_keys: forbidden
      silent_UUIDv4_fallback: forbidden
    evidence:
      - specs/database/core-schema.yml conventions.primary_key is finalized
      - docs/87-physical-database-schema.md documents the same UUIDv7/native-uuid decision
      - migration test obligation verifies UUIDv7 generation for synthetic domain IDs

  nullable_scope_unique_constraints_are_null_safe:
    status: PASS
    resolved_blocker_id: DB-FOUND-002
    decision:
      strategy: separate_partial_unique_indexes_for_null_and_non_null_scope
      postgres_NULLS_NOT_DISTINCT_required: false
    idempotency_records:
      organization_scope:
        columns: [organization_id, operation_key, idempotency_key]
        where: organization_id_is_not_null
      global_scope:
        columns: [operation_key, idempotency_key]
        where: organization_id_is_null
    account_closure_requests:
      organization_scope:
        columns: [user_id, organization_id]
        where: status_equals_pending_and_organization_id_is_not_null
      global_scope:
        columns: [user_id]
        where: status_equals_pending_and_organization_id_is_null

  stage_2_settings_tables_are_present_in_core_inventory:
    status: PASS
    resolved_blocker_id: DB-FOUND-003
    decision:
      canonical_table: organization_contact_addresses
      ownership: one_structured_company_contact_address_per_organization
      relation_to_training_locations: separate_concept
    physical_shape:
      organization_id: uuid_PK_FK_organizations
      street: varchar_255_not_null
      house_number: varchar_32_not_null
      unit_number: varchar_32_nullable
      postal_code: varchar_20_not_null
      city_name: varchar_160_not_null
      city_reference: varchar_128_nullable
      voivodeship_name: varchar_160_nullable
      country_code: char_2_not_null_default_PL
      created_at: timestamptz
      updated_at: timestamptz
    evidence:
      - specs/database/core-schema.yml core_tables.identity lists organization_contact_addresses
      - specs/database/core-schema.yml organization_model defines its canonical role and fields
      - docs/87-physical-database-schema.md defines the physical table
      - specs/database/organization-settings.yml remains the bounded-context source for the same shape
      - migration/invariant tests require one address per organization and forbid reusing locations
    preservation_rule: >-
      Company/contact address from the confirmed Settings screen is preserved
      without turning it into a training Location or a JSONB preference.

  stage_2_settings_fields_and_constraints_are_merged_into_physical_blueprint:
    status: FAIL
    blocker_id: DB-FOUND-004
    missing_or_not_yet_merged:
      - users.first_name
      - users.last_name
      - organizations.phone
      - auth_login_identifiers.is_primary_for_type
      - primary_current_email_partial_unique_constraint
      - organization_settings.version
      - canonical_PKK_settings_fields_from_specs_database_organization_settings
    already_merged_and_not_to_be_redesigned:
      - organization_contact_addresses
    rule: >-
      Stage-2 bounded-context ownership is authoritative. Physical migrations may
      not silently fall back to the older generic core table shapes.

  cross_tenant_relation_integrity_strategy:
    status: PENDING_LATER_STAGE4_SLICE
    note: >-
      Simple UUID foreign keys plus application checks are not yet accepted as the
      final strategy for staff/location/vehicle/course relations. This will be
      closed per bounded context rather than mixed into the foundation fix.

  calendar_overlap_database_strategy:
    status: PENDING_LATER_STAGE4_SLICE
    note: keep separate from foundation; existing server-side requirement remains mandatory

resolved_blockers:
  - id: DB-FOUND-001
    severity: P1
    resolution: >-
      Synthetic domain identifiers use application-generated UUIDv7 stored in
      native PostgreSQL uuid columns. Matching foreign keys use uuid; provider and
      import identifiers remain separate external-reference fields.
  - id: DB-FOUND-002
    severity: P1
    resolution: >-
      Nullable organization scopes no longer rely on ordinary UNIQUE semantics.
      Idempotency and pending account-closure uniqueness are implemented as
      separate partial unique indexes for organization_id IS NOT NULL and
      organization_id IS NULL, with migration tests for both namespaces.
  - id: DB-FOUND-003
    severity: P1
    resolution: >-
      organization_contact_addresses is now an explicit canonical core table and
      physical one-to-one organization address target. It is deliberately distinct
      from training locations and preserves the confirmed Settings address fields.

open_blockers:
  - id: DB-FOUND-004
    severity: P1
    description: Remaining Stage-2 settings fields/constraints are not yet merged into the physical core blueprint.

gate_definition:
  PASS_requires:
    - no_open_P0_or_P1_blockers
    - every_stage_4_slice_is_PASS_or_explicitly_deferred_by_a_separate_production_gate
    - physical_schema_and_narrative_schema_are_synchronized
    - migration_order_is_dependency_safe
    - database_invariant_test_matrix_exists
    - reverse_engineering_preservation_is_traceable_to_schema_or_use_case
  current_result: FAIL
  may_start_stage_5: false
  may_start_UI_or_feature_implementation: false

next_single_step:
  id: STAGE4_STEP_5
  action: resolve_DB_FOUND_004_merge_remaining_stage_2_settings_fields_and_constraints_only
  allowed_scope:
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
    - specs/database/organization-settings.yml
    - docs/100-osk-settings-domain-model.md
    - docs/104-stage-4-database-foundation-audit.md
    - specs/gates/stage-4-database-contract-gate.yml
  scope_lock: do_not_start_identity_tenant_RBAC_or_other_database_slices_until_foundation_gate_is_rerun
  after_action: rerun_foundation_gate_and_only_if_PASS_start_DB4_2_IDENTITY_TENANT_RBAC
