meta:
  project: osk-panel
  stage: 4
  name: database_invariants_and_migration_design_gate
  branch: docs-consolidation-2026-09-05
  status: IN_PROGRESS
  started_at: 2026-09-05
  rule: stage_5_and_UI_or_Laravel_feature_implementation_must_not_start_until_stage_4_is_PASS

prerequisite:
  stage_3_openapi_contract_gate:
    required_result: PASS
    observed_result: PASS
    status: PASS

stage_4_working_rule:
  one_database_slice_at_a_time: true
  migration_files_not_generated_until_foundation_decisions_are_closed: true
  reverse_engineering_capabilities_may_not_be_dropped_to_simplify_schema: true
  formal_financial_and_audit_history_may_not_be_hard_deleted: true
  every_cross_tenant_relation_requires_database_or_transactional_tenant_integrity: true

sources:
  aggregate_blueprint:
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
  bounded_context_overrides:
    - specs/database/organization-settings.yml
    - docs/100-osk-settings-domain-model.md
    - specs/database/identity-rbac.yml
  identity_tenant_rbac:
    - docs/04-roles-permissions.md
    - docs/08-security-compliance.md
    - specs/security/permissions.yml
    - docs/105-stage-4-identity-tenant-rbac-audit.md

stage_4_slices:
  - id: DB4_1_FOUNDATION_DIAGNOSIS
    status: PASS
  - id: DB4_2_IDENTITY_TENANT_RBAC
    status: BLOCKERS_RESOLVED_FINAL_SYNC_PENDING
    diagnosis: COMPLETE
    result: NO_OPEN_DB_IAM_BLOCKERS_FINAL_AGGREGATE_SYNC_REQUIRED
  - id: DB4_3_STAFF_LOCATIONS_VEHICLES
    status: NOT_STARTED
  - id: DB4_4_STUDENTS_COURSES_TRAINING_LEDGER
    status: NOT_STARTED
  - id: DB4_5_CALENDAR
    status: NOT_STARTED
  - id: DB4_6_LICENSES_LEARNING_ACCESS
    status: NOT_STARTED
  - id: DB4_7_INTERNAL_EXAMS
    status: NOT_STARTED
  - id: DB4_8_PKK
    status: NOT_STARTED
  - id: DB4_9_STUDENT_FINANCE_COMMERCE
    status: NOT_STARTED
  - id: DB4_10_AUDIT_OUTBOX_NOTIFICATIONS
    status: NOT_STARTED
  - id: DB4_11_FINAL_MIGRATION_ORDER_AND_INVARIANT_TEST_MATRIX
    status: NOT_STARTED

quality_checks:
  foundation_slice_gate:
    status: PASS

  DB_IAM_001_effective_permission_resolution:
    status: PASS
  DB_IAM_002_per_permission_data_scope:
    status: PASS
  DB_IAM_003_session_membership_same_user_integrity:
    status: PASS
  DB_IAM_004_owner_and_privilege_management:
    status: PASS
  DB_IAM_005_membership_and_permission_lifecycle:
    status: PASS
    decision:
      durable_membership_row_per_org_user: true
      hard_delete_membership: forbidden
      statuses: [active, suspended, revoked]
      suspended_keeps_permission_scope_config: true
      revoked_clears_owner_permission_scope_runtime_privileges: true
      revoked_reactivation_requires_fresh_provisioning: true
      membership_version_is_concurrency_root: true
      authorization_version_is_security_epoch: true
      stale_expected_version_conflicts_without_partial_write: true
      suspend_or_revoke_clears_bound_session_tenant_contexts_same_transaction: true
      other_organization_memberships_for_same_user_untouched: true
      permission_revoke_while_active_effective_next_request_without_forced_logout: true
      audit_and_outbox_same_transaction: true
    machine_source: specs/database/identity-rbac.yml
    narrative_source: docs/105-stage-4-identity-tenant-rbac-audit.md

  DB4_2_final_aggregate_sync:
    status: FAIL_PENDING_SYNC
    reason: >-
      The bounded-context Identity/Tenant/RBAC contract is now internally closed,
      but aggregate core-schema.yml and docs/87 still contain older shapes such as
      membership-wide data_scope and do not yet contain all final fields/tables/FKs.
    required_sync:
      core_tables_identity_add:
        - data_scopes
        - permission_scope_options
        - membership_permission_scopes
      organization_memberships:
        remove:
          - data_scope
        add_or_finalize:
          - is_owner
          - version
          - authorization_version
          - role_template_catalog_version
          - status_active_suspended_revoked
          - unique_id_user_id_candidate_key
      auth_sessions:
        add_composite_FK:
          source: [organization_membership_id, user_id]
          target: organization_memberships[id,user_id]
      permission_and_scope_model:
        - role_template_is_provenance_only
        - membership_permissions_runtime_source
        - permission_scope_options_whitelist
        - membership_permission_scopes_current_scope_rows
      lifecycle_and_transactions:
        - suspend_revoke_reactivate_semantics
        - owner_protected_baseline_and_last_owner_serialization
        - expected_membership_version_and_locking
        - authorization_version_invalidation
        - session_context_clear_on_suspend_or_revoke
        - audit_outbox_atomicity
      migration_tests:
        - DB_IAM_001_through_DB_IAM_005_obligations

  calendar_overlap_database_strategy:
    status: PENDING_LATER_STAGE4_SLICE

resolved_blockers:
  - DB-FOUND-001
  - DB-FOUND-002
  - DB-FOUND-003
  - DB-FOUND-004
  - DB-IAM-001
  - DB-IAM-002
  - DB-IAM-003
  - DB-IAM-004
  - DB-IAM-005

open_blockers: []

gate_definition:
  PASS_requires:
    - no_open_P0_or_P1_blockers
    - every_stage_4_slice_is_PASS_or_explicitly_deferred_by_a_separate_production_gate
    - physical_schema_and_narrative_schema_are_synchronized
    - migration_order_is_dependency_safe
    - database_invariant_test_matrix_exists
    - reverse_engineering_preservation_is_traceable_to_schema_or_use_case
  current_result: FAIL_DB4_2_FINAL_AGGREGATE_SYNC_PENDING
  may_start_stage_5: false
  may_start_UI_or_feature_implementation: false
  may_start_DB4_3: false

next_single_step:
  id: DB4_2_FINAL_SYNC
  action: synchronize_identity_tenant_RBAC_bounded_context_into_aggregate_physical_blueprint_only
  allowed_scope:
    - specs/database/core-schema.yml
    - docs/87-physical-database-schema.md
    - specs/traceability/core-v1.yml_if_needed
    - specs/database/identity-rbac.yml
    - docs/105-stage-4-identity-tenant-rbac-audit.md
    - specs/gates/stage-4-database-contract-gate.yml
  scope_lock: do_not_start_DB4_3_or_generate_Laravel_migrations_in_the_same_step
  after_action: rerun_final_DB4_2_gate_and_only_if_PASS_mark_DB4_3_as_NEXT_DIAGNOSIS
