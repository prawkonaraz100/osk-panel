quality_checks:
  stage_3_contract_is_frozen_before_DB_design:
    status: PASS

  physical_primary_key_type_is_final:
    status: PASS
    resolved_blocker_id: DB-FOUND-001

  nullable_scope_unique_constraints_are_null_safe:
    status: PASS
    resolved_blocker_id: DB-FOUND-002

  stage_2_settings_tables_are_present_in_core_inventory:
    status: PASS
    resolved_blocker_id: DB-FOUND-003

  stage_2_settings_fields_and_constraints_are_merged_into_physical_blueprint:
    status: PASS
    resolved_blocker_id: DB-FOUND-004

  foundation_slice_gate:
    status: PASS
    open_foundation_P0_P1: 0
    may_start_next_stage4_slice: true

  identity_rbac_effective_permission_resolution:
    status: FAIL
    blocker_id: DB-IAM-001
    evidence:
      - organization_memberships contains role_template_code
      - membership_permissions contains permission_code plus granted boolean
      - specs/security/permissions.yml defines role templates as permission bundles
      - docs/04-roles-permissions.md says role template is only a convenient starting permission package
    unresolved:
      - whether membership_permissions is a full snapshot or template override set
      - whether template changes affect existing memberships
      - precedence of explicit granted_false versus template permission
      - whether role_template_code is runtime authorization input or provenance only
    impact: effective_permissions_can_be_implemented_in_multiple_incompatible_ways

  identity_rbac_data_scope_physical_contract:
    status: FAIL
    blocker_id: DB-IAM-002
    evidence:
      - organization_memberships currently has one data_scope varchar
      - canonical scopes include own assigned_students assigned_locations organization
      - authorization order evaluates data scope after permission
    unresolved:
      - default_scope_vs_per_permission_scope
      - how_concrete_location_restrictions_are_resolved
      - how_assigned_students_are_derived
      - whether_scope_can_expand_or_only_restrict_a_permission
    impact: query_scope_could_be_inconsistent_across_modules_or_accidentally_tenant_wide

  auth_session_membership_integrity:
    status: FAIL
    blocker_id: DB-IAM-003
    evidence:
      - auth_sessions has user_id FK
      - auth_sessions has separate nullable organization_membership_id FK
      - security policy requires active membership and tenant context
    unresolved: >-
      Current simple foreign keys do not guarantee that the selected membership
      belongs to the same user as auth_sessions.user_id. A composite constrained
      relation or an equally strong transactional invariant is required.
    impact: malformed_session_context_can_cross_user_or_tenant_boundary

  identity_owner_and_privilege_management_invariants:
    status: FAIL
    blocker_id: DB-IAM-004
    evidence:
      - docs/04 requires last active Owner protection
      - specs/security/permissions.yml requires last_owner_cannot_be_removed_without_transfer
      - permission changes are elevated and audited
    unresolved:
      - canonical owner marker
      - last_owner_counting_rule_with_custom_permissions
      - self_escalation_rule
      - grant_ceiling_rule_for_permission_administrators
      - active_session_effect_after_elevated_permission_revoke
    impact: organization_lockout_or_privilege_escalation_is_possible_if_implemented_naively

  membership_and_permission_mutation_lifecycle:
    status: FAIL
    blocker_id: DB-IAM-005
    evidence:
      - organization_memberships has generic status varchar and unique organization_id_user_id
      - membership_permissions is mutable by membership_id_permission_code
      - security docs require permission revoke behavior and audit
    unresolved:
      - exact_membership_states_and_transitions
      - durable_reactivation_vs_multiple_membership_period_rows
      - revoke_suspend_session_invalidation_semantics
      - permission_change_concurrency_and_lost_update_prevention
      - audit_actor_reason_version_semantics
    impact: destructive_delete_or_stale_authorization_behavior_could_be_implemented

  calendar_overlap_database_strategy:
    status: PENDING_LATER_STAGE4_SLICE

resolved_blockers:
  - id: DB-FOUND-001
    severity: P1
    resolution: application_generated_UUIDv7_in_native_PostgreSQL_uuid
  - id: DB-FOUND-002
    severity: P1
    resolution: separate_partial_unique_indexes_for_global_and_tenant_nullable_scopes
  - id: DB-FOUND-003
    severity: P1
    resolution: organization_contact_addresses_is_canonical_one_to_one_physical_table
  - id: DB-FOUND-004
    severity: P1
    resolution: remaining_Stage_2_settings_ownership_fields_and_constraints_are_merged_into_core_physical_blueprint

open_blockers:
  - id: DB-IAM-001
    severity: P1
    description: Effective permission resolution and role-template semantics are not physically deterministic.
  - id: DB-IAM-002
    severity: P1
    description: Current single data_scope column does not define a complete canonical scope-resolution contract.
  - id: DB-IAM-003
    severity: P1
    description: Auth session user and selected organization membership can be physically inconsistent under simple independent foreign keys.
  - id: DB-IAM-004
    severity: P1
    description: Last-owner and privilege-escalation safety rules are policy-only and lack canonical physical/transaction invariants.
  - id: DB-IAM-005
    severity: P1
    description: Membership and explicit-permission mutation lifecycle/concurrency/session effects are under-specified.

gate_definition:
  PASS_requires:
    - no_open_P0_or_P1_blockers
    - every_stage_4_slice_is_PASS_or_explicitly_deferred_by_a_separate_production_gate
    - physical_schema_and_narrative_schema_are_synchronized
    - migration_order_is_dependency_safe
    - database_invariant_test_matrix_exists
    - reverse_engineering_preservation_is_traceable_to_schema_or_use_case
  current_result: FAIL_DB4_2_WITH_OPEN_P1_BLOCKERS
  may_start_stage_5: false
  may_start_UI_or_feature_implementation: false
  may_start_DB4_3: false

next_single_step:
