  scope_lock: do_not_start_DB4_3_or_generate_migrations_or_sync_other_domain_slices_in_the_same_step
  after_action: rerun_DB4_2_gate_and_if_DB_IAM_005_PASS_then_perform_separate_final_DB4_2_aggregate_sync_gate_before_DB4_3
