quality_checks:
  DB4_1_foundation:
    status: PASS
  DB4_2_identity_tenant_rbac:
    status: PASS
    source: docs/105-stage-4-identity-tenant-rbac-audit.md

  DB4_3_diagnosis:
    status: PASS_DIAGNOSIS_COMPLETE
    source: docs/107-stage-4-staff-locations-vehicles-audit.md
    later_domain_slices_entered: false
    Laravel_migrations_created: false

  staff_membership_link_same_organization_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-001
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_location_assignment_tenant_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-002
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_file_asset_attachment_integrity:
    status: PASS
    resolved_blocker_id: DB-RES-003
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml

  staff_vehicle_document_current_projection:
    status: PASS
    resolved_blocker_id: DB-RES-004
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    narrative_source: docs/107-stage-4-staff-locations-vehicles-audit.md
    decision:
      history_model: versioned_rows_with_superseded_at
      current_predicate: superseded_at_is_null
      current_cardinality: zero_or_one_per_parent_and_document_type
      staff_current_unique:
        type: partial_unique
        columns: [organization_id, staff_profile_id, document_type]
        where: superseded_at_is_null
      vehicle_current_unique:
        type: partial_unique
        columns: [organization_id, vehicle_id, document_type]
        where: superseded_at_is_null
      normal_edit_overwrites_business_fields_in_place: false
      hard_delete_on_edit_or_clear: false
      replacement_transaction_serializes_on_parent: true
      historical_business_fields_immutable: true
      current_projection_uses_only_non_superseded_rows: true
      calendar_important_date_input_uses_only_current_nonnull_valid_until: true
      latest_created_at_heuristic_allowed: false
      DB_RES_003_asset_attachment_gate_still_applies_to_each_new_version: true

  staff_vehicle_identity_uniqueness_lifecycle:
    status: PASS
    resolved_blocker_id: DB-RES-005
    severity: P1
    machine_source: specs/database/staff-locations-vehicles.yml
    narrative_source: docs/107-stage-4-staff-locations-vehicles-audit.md
    decision:
      uniqueness_scope: per_organization
      staff_PESEL:
        column: pesel_lookup_hash
        type: partial_unique
        columns: [organization_id, pesel_lookup_hash]
        where: pesel_lookup_hash_is_not_null
        archived_rows_included: true
        archive_releases_value: false
        duplicate_archived_profile_policy: restore_existing_or_explicit_identity_correction
      vehicle_VIN:
        column: vin_normalized
        type: partial_unique
        columns: [organization_id, vin_normalized]
        where: vin_normalized_is_not_null
        archived_rows_included: true
        archive_releases_value: false
        duplicate_archived_vehicle_policy: restore_existing_or_explicit_identity_correction
      vehicle_registration:
        column: registration_number_normalized
        type: partial_unique
        columns: [organization_id, registration_number_normalized]
        where: archived_at_is_null
        archived_rows_included: false
        archive_releases_value_for_current_fleet: true
        archived_history_keeps_value: true
        restore_requires_current_registration_free: true
        conflict_auto_swap_or_auto_archive: false
      cross_organization_same_identity_value_allowed: true
      hard_delete_to_release_identity_as_normal_lifecycle: false
      explicit_identity_correction_requires_audit: true
      database_unique_constraint_is_final_concurrency_boundary: true
    migration_precheck:
      - detect_duplicate_nonnull_staff_PESEL_within_org_including_archived
      - detect_duplicate_nonnull_vehicle_VIN_within_org_including_archived
      - detect_duplicate_registration_among_nonarchived_vehicles_within_org
      - detect_normalization_collisions
      - allow_historical_registration_reuse_only_when_at_most_one_nonarchived_holder_exists
      - never_silently_delete_merge_archive_renumber_or_change_identity_to_pass_migration
    tests:
      - archived_staff_still_blocks_duplicate_PESEL_in_same_org
      - same_PESEL_in_different_orgs_allowed
      - archived_vehicle_still_blocks_duplicate_VIN_in_same_org
      - same_VIN_in_different_orgs_allowed
      - two_nonarchived_vehicles_same_registration_rejected
      - archive_releases_registration_for_new_current_vehicle
      - restore_conflicts_when_registration_is_held_by_another_current_vehicle
      - concurrent_restore_and_create_for_same_registration_have_one_winner
      - identity_correction_cannot_take_value_held_by_another_resource

  staff_archive_panel_access_lifecycle:
    status: FAIL
    blocker_id: DB-RES-006
    severity: P1
    unresolved: >-
      Archiving StaffProfile does not yet define the atomic effect on active
      StaffMembershipLink and OrganizationMembership. Leaving membership active can
      preserve panel access for archived staff; destructive revoke can break safe
      restore and last-owner invariants.
    impact: archived_staff_may_retain_access_or_restore_may_become_inconsistent

  DB4_3_nonblockers_deferred_to_dependent_slices:
    - future_calendar_event_behavior_after_resource_archive_to_DB4_5
    - active_course_behavior_after_staff_or_location_archive_to_DB4_4
    - exact_expiring_soon_threshold_projection_config
    - city_dictionary_provider_choice
    - competitor_unobservable_delete_backend_semantics

  calendar_overlap_database_strategy:
    status: PENDING_DB4_5

