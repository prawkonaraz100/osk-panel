meta:
  project: osk-panel
  scope: admin_osk_core_v1
  version: 1
  consolidated_at: 2026-09-05
  status: ACTIVE_IMPLEMENTATION_BASELINE
  goal: build_own_functional_equivalent_without_copying_ui_or_code

precedence:
  legal_rules:
    - specs/legal/*.yml
  own_product_decisions:
    - specs/design/*.yml
  verified_screens:
    - specs/screens/*.yml
  implementation_baseline:
    - specs/implementation-baseline-v1.yml
  module_status:
    - docs/71-admin-osk-module-mapping-status.md
  legacy_aggregates:
    - specs/admin-osk-services.yml
    - specs/functional-requirements.yml
    - docs/01-feature-map.md
    - docs/02-screen-inventory.md
    - docs/10-gap-register.md
  rule: newer_screen_or_legal_or_design_spec_wins_over_legacy_aggregate

confidence_levels:
  - USER_CONFIRMED_AUTH_SCREEN
  - USER_CONFIRMED_AUTH_MENU
  - LEGAL_VERIFIED
  - OWN_PRODUCT_DECISION
  - CURRENT_CONFIRMED
  - RULES_CONFIRMED
  - HISTORICAL_INDEX
  - TO_VERIFY_AUTH
  - SOURCE_CONFLICT
  - DEMO_BLOCKED
  - UNOBSERVABLE_IN_DEMO_NONBLOCKING

core_modules:
  dashboard:
    status: READY_FOR_IMPLEMENTATION
    route: /
    spec: specs/screens/main-dashboard.yml
    doc: docs/74-main-dashboard.md

  pkk:
    status: READY_FOR_IMPLEMENTATION
    informational_route: /integracja-pkk
    operational_owner: course_enrollment
    specs:
      - specs/screens/pkk-entrypoints-and-student-list.yml
      - specs/screens/pkk-course-operational-panel.yml
      - specs/screens/pkk-configuration-gate.yml
    docs:
      - docs/75-pkk-entrypoints-and-student-list.md
      - docs/76-pkk-course-operational-panel.md
      - docs/77-pkk-management-flow-fallback-design.md
    required_architecture:
      - pkk_belongs_to_course_enrollment_not_student_directly
      - audit_every_external_operation
      - idempotent_irreversible_commands
      - provider_adapter
      - retry_matrix

  students:
    status: READY_FOR_IMPLEMENTATION
    route: /kursanci
    aggregate_spec: specs/screens/students.yml
    source_of_truth:
      - specs/screens/student-create.yml
      - specs/screens/student-detail.yml
      - specs/screens/student-edit.yml
      - specs/screens/student-preview.yml
      - specs/screens/student-filters.yml
      - specs/screens/student-sorting.yml
      - specs/screens/student-progress.yml
      - specs/screens/student-internal-exam.yml
      - specs/screens/student-assign-license.yml
      - specs/screens/student-payment-charge.yml
      - specs/screens/student-access-credentials-pdf.yml
    required_architecture:
      - student_profile_separate_from_learning_account
      - student_finance_separate_from_platform_purchase_ledger
      - protect_pesel
      - tenant_isolation

  courses:
    status: READY_FOR_IMPLEMENTATION
    owner: student_course_enrollment
    specs:
      - specs/screens/course-create.yml
      - specs/screens/course-edit.yml
      - specs/screens/course-delete.yml
      - specs/legal/training-theory-exemptions.yml
      - specs/legal/editable-training-requirements.yml
    docs:
      - docs/78-course-edit-form.md
      - docs/79-course-delete-confirmation.md
      - docs/80-course-create-form.md
      - docs/66-formal-student-record-and-theory-exemptions.md
      - docs/67-editable-training-requirements-and-theory-exemption.md
    time_source_of_truth:
      current_osk_training: training_session_and_training_hour_ledger
      previous_osk_training: recognized_external_training_records
      manual_aggregate_current_osk_hours_as_primary_source: false

  calendar:
    status: READY_FOR_IMPLEMENTATION
    route: /kalendarz
    specs:
      - specs/screens/calendar.yml
      - specs/screens/calendar-add-event.yml
    own_policy: docs/50-own-calendar-event-lifecycle.md
    required_architecture:
      - single_calendar_engine
      - staff_vehicle_location_student_resources
      - server_side_conflict_detection
      - timezone_per_organization
      - audit_event_changes

  locations:
    status: READY_FOR_IMPLEMENTATION
    route: /lokalizacje
    specs:
      - specs/screens/locations.yml
      - specs/screens/school-locations-create.yml
      - specs/screens/school-locations-edit.yml
    required_architecture:
      - multi_location
      - location_as_calendar_resource
      - soft_archive_preserve_history

  vehicles:
    status: READY_FOR_IMPLEMENTATION
    route: /pojazdy
    specs:
      - specs/screens/vehicles.yml
      - specs/screens/vehicle-create.yml
      - specs/screens/vehicle-detail.yml
      - specs/screens/vehicle-edit.yml
      - specs/screens/vehicle-delete.yml

  staff:
    status: READY_FOR_IMPLEMENTATION
    route: /pracownicy
    specs:
      - specs/screens/staff.yml
      - specs/screens/staff-create.yml
      - specs/screens/staff-detail.yml
      - specs/screens/staff-edit.yml
    required_architecture:
      - staff_profile_separate_from_user_account
      - optional_login_account
      - permission_based_rbac
      - staff_type_not_equal_permission

  licenses_purchase:
    status: READY_FOR_IMPLEMENTATION
    route: /licencje/wykup
    spec: specs/screens/license-purchase.yml

  licenses_management:
    status: READY_FOR_IMPLEMENTATION
    route: /licencje/panel
    specs:
      - specs/screens/license-management-panel.yml
      - specs/screens/license-expanded-assignments.yml
      - specs/screens/license-generate-access.yml
      - specs/screens/license-existing-student-selected.yml
      - specs/screens/license-sorting.yml
      - specs/screens/license-bulk-access-pdf.yml
      - specs/screens/student-license-delete.yml
    invariants:
      - revoke_unactivated_assignment_restores_exactly_one_inventory_item_atomically
      - activated_assignment_cannot_use_unactivated_revoke_flow
      - plaintext_password_never_persisted

  internal_exam_purchase:
    status: READY_FOR_IMPLEMENTATION
    route: /egzamin-wewnetrzny/wykup
    spec: specs/screens/internal-exam-purchase.yml

  internal_exam_management:
    status: READY_FOR_IMPLEMENTATION
    route: /egzamin-wewnetrzny/panel
    aggregate_spec: specs/screens/internal-exam-management-panel.yml
    lifecycle_policy: specs/design/internal-exam-lifecycle.yml
    legal_rules: specs/legal/training-theory-exemptions.yml
    inventory_consumption_policy: consume_on_start
    rules:
      - reserve_on_access_creation
      - consume_atomically_on_exam_start
      - release_unused_reservation_on_expire_cancel_or_revoke_before_start
      - technical_abort_does_not_auto_restore_inventory
      - restore_after_start_only_by_audited_adjustment
      - formal_exam_requires_student_and_course_enrollment

  settings:
    status: READY_FOR_IMPLEMENTATION
    route: /ustawienia
    spec: specs/screens/settings.yml
    doc: docs/18-settings-screen.md

  purchase_history:
    status: READY_FOR_IMPLEMENTATION
    route: /historia-zakupow
    spec: specs/screens/purchase-history.yml
    doc: docs/17-history-purchases-screen.md
    separate_from_student_finance: true

formal_rules:
  training_hour_minutes:
    theory: 45
    practical: 60
  course_first_formal_model: true
  formal_exam_requires_persistent_student: true
  formal_exam_requires_course_enrollment: true
  rule_engine_required: true
  rule_engine_outputs:
    - theory_training_required
    - minimum_theory_minutes
    - internal_theory_exam_required
    - practical_training_required
    - minimum_practical_minutes
    - internal_practical_exam_required
    - exemption_basis_code

cross_cutting_invariants:
  - every_tenant_owned_resource_authorized_by_organization
  - formal_financial_pkk_exam_license_and_role_changes_are_audited
  - money_uses_decimal_or_minor_units_never_float
  - external_webhooks_are_idempotent
  - irreversible_commands_support_idempotency
  - configurable_product_capabilities_not_hardcoded
  - no_hard_delete_of_formal_or_financial_history
  - secrets_never_committed_to_repository

p0_consolidation_remaining:
  - canonical_domain_glossary
  - course_first_pkk_api_contract
  - synchronize_exam_consumption_semantics_in_legacy_docs_and_acceptance_criteria
  - formalize_training_hours_source_of_truth_in_domain_model_and_api
  - define_common_archive_delete_cancel_correction_policy
  - define_common_api_error_pagination_money_datetime_idempotency_contract
  - prepare_openapi_3_1

deferred_non_core_modules:
  business_cards:
    status: NOT_SCREEN_MAPPED
    route: /wizytowki
  advertising:
    status: NOT_SCREEN_MAPPED
  lectures:
    status: NOT_SCREEN_MAPPED
    route: /wyklady
  instructor_training:
    status: NOT_SCREEN_MAPPED
    route: /szkolenie-z-instruktorem

historical_or_optional:
  invoices:
    status: HISTORICAL_INDEX
    parity_v1_required: false
  impersonation:
    status: HISTORICAL_INDEX
    own_secure_implementation_optional: true
