meta:
  id: production_go_live_evidence_v1
  gate: PROD-GO-LIVE-EVIDENCE-001
  status: CANDIDATE
  policy_version: 2026-09-15-v1
  follows:
    - PROD-READINESS-RUNTIME-001
    - PROD-RETENTION-EXECUTOR-001
    - PROD-TARGET-CONFIG-PREFLIGHT-001

scope:
  validates_external_evidence_manifest: true
  creates_external_evidence: false
  activates_production_traffic: false
  production_ready_claim_from_repository_alone: forbidden
  secret_values_in_manifest: forbidden
  personal_contact_details_in_manifest: forbidden

binding:
  exact_release_sha_required: true
  exact_release_sha_length: 40
  exact_artifact_sha256_required: true
  exact_artifact_sha256_length: 64
  environment: production

required_evidence:
  - target_production_configuration_preflight
  - target_infrastructure_restore_drill
  - production_backup_and_PITR_evidence
  - production_object_versioning_and_restore_evidence
  - production_secret_manager_or_equivalent_injection_evidence
  - production_monitoring_dashboards_and_alert_routes
  - incident_contact_roster_and_paging_smoke_test
  - reconciliation_scheduler_execution_and_alert_delivery_smoke_test
  - target_environment_release_smoke_test

restore_acceptance:
  maximum_evidence_age_days: 90
  postgres_rpo_minutes_max: 5
  postgres_rto_minutes_max: 60
  object_rpo_minutes_max: 60
  object_rto_minutes_max: 240
  isolated_restore_required: true
  critical_integrity_assertions_required: true
  redis_empty_recovery_required: true

release_smoke:
  exact_release_binding_required: true
  exact_artifact_binding_required: true
  HTTPS_required: true
  health_live_required: true
  health_ready_required: true

command:
  name: operations:go-live:evidence
  HTTP_endpoint: none
  scheduler: none
  network_calls: none
  business_state_mutations: none
  PASS_exit_code: 0
  FAIL_exit_code: nonzero
  PASS_activates_production: false

deferred_boundaries:
  PKK_PWPW: FROZEN_UNTIL_EXPLICIT_UNFREEZE
  PKK_evidence_required: false
  payment_provider_specific_webhook: EXTERNAL_PROVIDER_BOUNDARY
  payment_provider_evidence_required_when_provider_not_launched: false

non_scope:
  - create_backups
  - enable_PITR
  - create_object_versions
  - configure_secret_manager
  - create_monitoring_dashboards
  - send_paging_notification
  - execute_scheduler
  - execute_target_smoke
  - activate_release
  - change_DNS_or_traffic
