meta:
  id: operational_alerting_substrate_v1
  gate: PROD-OPERATIONAL-ALERTING-001
  status: PASS
  policy_version: 2026-09-15-v2
  follows:
    - PROD-READINESS-RUNTIME-001
    - PROD-RETENTION-EXECUTOR-001
    - PROD-TARGET-CONFIG-PREFLIGHT-001
    - PROD-GO-LIVE-EVIDENCE-001

boundary:
  repository_substrate_only: true
  claims_human_received_page: false
  selects_vendor: false
  transport: provider_neutral_https_webhook
  enabled_by_default: false
  production_preflight_requires_enabled: true
  HTTPS_required: true
  HMAC_SHA256_signature_required: true
  destination_from_environment: true
  secret_from_environment: true
  secret_or_destination_logged: false

events:
  synthetic_smoke:
    severity: SEV3
    runbook: deployment_or_destructive_operation
    sensitive_context_allowed: false
  reconciliation_findings:
    severity: SEV2
    runbook: payment_or_reconciliation
    context_allowlist:
      - policy_version
      - findings_total
      - findings_by_scope
      - synthetic_smoke
    entity_identifiers_forbidden: true
    user_identifiers_forbidden: true
    organization_identifiers_forbidden: true
    synthetic_smoke_explicitly_marked: true

smoke:
  command: operations:alert:smoke
  exact_confirmation_required: SEND-SYNTHETIC-OPERATIONAL-ALERT
  disabled_sink_result: failure
  failed_delivery_result: failure
  real_target_execution_proven_by_repository: false
  reconciliation_alert_command: operations:reconciliation:alert:smoke
  reconciliation_alert_exact_confirmation_required: SEND-SYNTHETIC-RECONCILIATION-ALERT
  reconciliation_alert_exact_event_code: reconciliation_findings
  reconciliation_alert_synthetic_marker: true

reconciliation_integration:
  scanner_remains_read_only: true
  findings_emit_operational_alert: true
  alert_payload_uses_aggregates_only: true
  PKK_in_scope: false

production_preflight_extension:
  required_checks:
    - operational_alerting_enabled
    - operational_alert_endpoint_https
    - operational_alert_secret_present
  successful_configuration_check_claims_delivery: false

external_evidence_still_required:
  - production_alert_endpoint_configuration
  - production_contact_roster
  - synthetic_paging_smoke_received_by_real_operator
  - monitoring_dashboard_activation
  - scheduler_execution_and_alert_delivery_in_target_environment

deferred_boundaries:
  PKK_PWPW: FROZEN_UNTIL_EXPLICIT_UNFREEZE
  payment_provider_specific_webhook: EXTERNAL_PROVIDER_BOUNDARY


closure_evidence:
  candidate_head: 2dae7bcc9bd3606c83d7710dffa723f434c10084
  implementation_ci_run: 34944229712
  jobs:
    backend_quality: PASS
    frontend_quality: PASS
    runtime_tests_and_migrations: PASS
    contracts_and_traceability: PASS
    secret_scan: PASS
    release_artifact_on_pull_request: SKIPPED_BY_WORKFLOW_DESIGN
  runtime:
    postgres_backed_test_suite: PASS
    deterministic_restore_drill_harness: PASS
  repository_alert_substrate:
    status: PASS
  production_target_alert_delivery:
    status: NOT_PROVIDED_BY_REPOSITORY
    human_receipt_claim: forbidden
