meta:
  id: production_readiness_runtime_v1
  gate: PROD-READINESS-RUNTIME-001
  status: CANDIDATE
  audited_from_core_v1_closure: CORE-V1-CLOSURE-AUDIT-016

scope:
  repository_substrate_only: true
  claims_target_infrastructure_ready: false
  reopens_core_v1_repository_closure: false

health:
  liveness:
    path: /health/live
    dependency_checks: none
    success_status: 200
  readiness:
    path: /health/ready
    required_dependencies:
      - postgresql
      - redis
    success_status: 200
    failure_status: 503
    optional_external_providers_may_block_global_readiness: false
    PKK_provider_required: false

logging:
  production_channel: json_stderr
  format: JSON
  application_request_log_fields:
    - service
    - module
    - request_id
    - method
    - route
    - status
    - duration_ms
  query_string_logged_by_request_summary: false
  secret_values_logged: false

release_artifact:
  reference: exact_git_sha
  workflow: .github/workflows/implementation-ci.yml
  accepted_branch_only: true
  immutable_archive: true
  checksum: sha256
  environment_files_in_artifact: forbidden
  build_inputs:
    - composer_lock
    - production_composer_dependencies
    - frontend_production_build

target_smoke:
  script: scripts/ops/production-smoke.sh
  requires_https_by_default: true
  checks:
    - /health/live
    - /health/ready
  target_execution_proven_by_repository: false

external_evidence_still_required:
  - target_infrastructure_restore_drill
  - production_backup_and_PITR_evidence
  - production_object_versioning_and_restore_evidence
  - production_secret_manager_or_equivalent_injection_evidence
  - production_monitoring_dashboards_and_alert_routes
  - incident_contact_roster_and_paging_smoke_test
  - reconciliation_scheduler_execution_and_alert_delivery_smoke_test
  - target_environment_release_smoke_test

deferred_boundaries:
  PKK_PWPW:
    status: FROZEN_UNTIL_EXPLICIT_UNFREEZE
    required_for_core_service_launch: false
  payment_provider_specific_webhook:
    status: EXTERNAL_PROVIDER_BOUNDARY
    repository_runtime_in_this_gate: false

non_scope:
  - retention_executor
  - select_cloud_vendor
  - deploy_to_target_infrastructure
  - claim_production_PITR
  - claim_paging_reaches_human
  - activate_PKK
