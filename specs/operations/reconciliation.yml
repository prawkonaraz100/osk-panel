meta:
  id: core_v1_provider_neutral_reconciliation
  policy_version: 2026-09-13-v1
  status: PRE_PRODUCTION_AUTHORITY

scope:
  included:
    - commerce_payment_settlement
    - purchase_fulfillment
    - license_inventory
    - internal_exam_inventory
    - outbox_publication
  PKK:
    included: false
    status: frozen_until_explicit_unfreeze
    provider_specific_reconciliation_allowed: false

execution:
  command: operations:reconciliation:scan
  scheduled_cadence_minutes: 15
  scheduled_fail_on_findings: true
  without_overlapping_minutes: 30
  read_only: true
  automatic_repair: false
  remote_provider_truth_lookup: false
  findings_are_machine_readable: true

invariants:
  commerce:
    - confirmed_payment_has_exact_settlement
    - settlement_matches_exact_confirmed_payment_order_and_tenant
    - settled_order_has_fulfillment
    - explicit_requires_reconciliation_fulfillment_is_surfaced
    - settled_license_order_item_grant_count_equals_quantity
    - settled_internal_exam_order_item_grant_count_equals_quantity
    - purchased_inventory_is_not_granted_from_unsettled_order
  license_inventory:
    - available_has_zero_assigned_or_activated_current_assignment
    - assigned_has_exactly_one_assigned_assignment_and_zero_activation
    - consumed_has_exactly_one_activated_assignment_and_one_activation
    - scanner_does_not_repair_cross_row_state
  internal_exam_inventory:
    - available_unit_projection_equals_ledger_available_delta
    - reserved_unit_has_exactly_one_reserved_reservation
    - consumed_unit_has_exactly_one_consumed_reservation
    - reserved_and_consumed_reservations_match_inventory_current_state
    - scanner_does_not_rewrite_append_only_ledger
  outbox:
    - requires_reconciliation_is_surfaced
    - expired_lease_is_surfaced
    - publication_state_timestamp_lease_matrix_is_valid
    - new_pending_intent_has_server_derived_next_attempt_at
    - scanner_never_marks_published

repair_boundary:
  direct_mutation_from_scanner: forbidden
  fabricate_provider_confirmation: forbidden
  fabricate_settlement: forbidden
  fabricate_purchase_grant: forbidden
  rewrite_consumed_inventory_history: forbidden
  rewrite_exam_ledger_history: forbidden
  mark_outbox_published_to_clear_backlog: forbidden
  repair_requires_separate_audited_path: true

production_boundary:
  repository_proves_scanner_and_schedule_contract: true
  repository_proves_real_scheduler_is_running: false
  repository_proves_alert_route_substrate: true
  reconciliation_findings_emit_provider_neutral_operational_alert: true
  alert_payload_contains_aggregate_findings_only: true
  repository_proves_alert_reaches_operator: false
  provider_specific_remote_truth_adapter_is_claimed: false
  production_scheduler_and_alert_smoke_test_required: true
