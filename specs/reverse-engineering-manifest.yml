meta:
  project: osk-panel
  purpose: preserve_all_confirmed_reverse_engineered_capabilities
  audited_at: 2026-09-05
  status: AUTHORITATIVE_TRACEABILITY_MANIFEST
  clean_room: true
  preservation_contract: docs/96-reverse-engineering-preservation-contract.md

rules:
  confirmed_screen_element_is_requirement_for_core: true
  aggregate_summary_may_not_drop_screen_requirement: true
  legal_rule_can_override_observed_behavior: true
  own_product_decision_can_change_implementation_not_business_capability: true
  source_conflicts_must_be_configuration_or_capability_driven: true
  demo_values_are_not_business_defaults: true
  unobservable_demo_behavior_requires_explicit_own_product_decision: true
  pixel_perfect_copy_required: false
  proprietary_code_copy_allowed: false

traceability_gate:
  required_chain:
    - evidence
    - requirement
    - domain_or_projection
    - api_or_use_case
    - permission
    - ui
    - acceptance_test
  done_requires_all_confirmed_elements_accounted_for: true

