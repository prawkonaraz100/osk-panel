screen:
  id: calendar_add_event
  scope: admin_osk
  parent_route: /kalendarz
  entry_action: add_calendar_event
  title: Dodaj wydarzenie
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/49-calendar-add-event-form.md

fields:
  - name: event_type
    label: Rodzaj wydarzenia
    control: single_select
    required_by_visible_marker: true
    observed_options:
      - general_event
      - driving_lesson
    observed_labels:
      general_event: Wydarzenie
      driving_lesson: Jazda
  - name: event_name
    label: Nazwa wydarzenia
    optional_label_visible: true
    control: text
  - name: start_date
    label: Data rozpoczęcia
    required_by_visible_marker: true
    control: date
  - name: start_time
    label: Data rozpoczęcia
    required_by_visible_marker: true
    control: time
  - name: duration
    label: Ilość godzin
    control: time_duration
    required_by_visible_marker: false
    exact_semantics: STRONGLY_SUPPORTED_AS_DURATION
  - name: student_id
    label: Kursant
    optional_label_visible: true
    control: searchable_single_select
    projection:
      - full_name
      - learning_identifier
  - name: instructor_id
    label: Instruktor
    optional_label_visible: true
    control: searchable_single_select
    projection:
      - full_name
      - email
      - expired_card_or_license_warning
      - expired_medical_exam_warning
      - expired_psychological_exam_warning
  - name: vehicle_id
    label: Pojazd
    optional_label_visible: true
    control: searchable_single_select
    projection:
      - make_model
      - registration_number
      - expired_ac_warning
      - expired_oc_warning
      - expired_inspection_warning
  - name: meeting_location_id
    label: Miejsce spotkania
    optional_label_visible: true
    control: grouped_single_select
    grouped_by_location_type: true
    mode: saved_location
  - name: custom_meeting_place
    label: Miejsce spotkania
    optional_label_visible: true
    control: text
    mode: custom_text
    visible_when: custom_meeting_place_mode

meeting_place_mode:
  modes:
    - saved_location
    - custom_text
  default_observed_mode: saved_location
  toggle_to_custom:
    label: Inne?
    action: switch_to_custom_meeting_place
    effect:
      - hide_saved_location_select
      - show_custom_text_input
      - change_toggle_label_to_back
  toggle_back:
    label: Wróć
    action: switch_back_to_saved_meeting_location
    effect:
      - hide_custom_text_input
      - show_saved_location_select
  fields_mutually_exclusive: true
  persistence_when_switching_back: TO_VERIFY

manual_event_types:
  confirmed:
    - general_event
    - driving_lesson
  important_date_present_in_create_selector: false
  important_date_source: TO_VERIFY

form_behavior_by_type:
  shared_form_component_supported: true
  selecting_driving_lesson_changes_visible_fields: false
  selecting_driving_lesson_changes_visible_optional_labels: false
  selecting_general_event_changes_visible_fields: false
  visible_form_parity_confirmed: true
  backend_type_specific_validation: TO_VERIFY

resource_cardinality_for_this_form:
  student: zero_or_one
  instructor: zero_or_one
  vehicle: zero_or_one
  saved_meeting_location: zero_or_one
  custom_meeting_place: zero_or_one
  meeting_place_source_rule: saved_location_xor_custom_text

resource_warning_behavior:
  staff_document_expiry_projected_in_selector: true
  vehicle_document_expiry_projected_in_selector: true
  exact_warning_vs_block_policy: TO_VERIFY

primary_action:
  label: Zapisz
  action: save_calendar_event

secondary_action:
  label: Anuluj
  action: cancel_calendar_event_create

close_control:
  label: X
  action: close_calendar_event_drawer

confirmed_actions:
  - open_add_calendar_event_drawer
  - select_calendar_event_type
  - set_calendar_event_name
  - set_calendar_event_start_date
  - set_calendar_event_start_time
  - set_calendar_event_duration
  - search_and_select_student
  - search_and_select_instructor
  - search_and_select_vehicle
  - select_meeting_location
  - switch_to_custom_meeting_place
  - set_custom_meeting_place_text
  - switch_back_to_saved_meeting_location
  - save_calendar_event
  - cancel_calendar_event_create
  - close_calendar_event_drawer

own_product_requirements:
  - tenant_isolation
  - use_single_form_for_general_event_and_driving_lesson
  - use_event_type_as_domain_discriminator
  - allow_type_specific_backend_business_rules_without_duplicate_forms
  - support_saved_or_custom_meeting_place
  - enforce_mutual_exclusion_between_location_id_and_custom_meeting_place
  - server_side_resource_conflict_detection
  - validate_student_by_organization
  - validate_instructor_by_organization
  - validate_vehicle_by_organization
  - validate_location_by_organization
  - project_document_expiry_warnings_from_source_domains
  - enforce_critical_compliance_rules_server_side
  - store_start_and_duration_or_consistent_derived_end
  - audit_event_creation_and_changes

remaining_gaps:
  - duration_exact_validation
  - driving_lesson_backend_required_resources
  - warning_vs_hard_block_for_expired_resources
  - conflict_messages
  - recurrence
  - notifications
  - event_status_after_save
  - event_detail_edit_flow
  - custom_meeting_place_value_persistence_when_switching_modes
