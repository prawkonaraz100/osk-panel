screen:
  id: calendar
  scope: admin_osk
  route: /kalendarz
  title: Kalendarz
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/48-calendar-main-screen.md
  add_event_screen_spec: specs/screens/calendar-add-event.yml
  add_event_doc: docs/49-calendar-add-event-form.md
  own_event_lifecycle_policy: docs/50-own-calendar-event-lifecycle.md

event_type_filters:
  control: checkbox
  confirmed_options:
    - general_event
    - driving_lesson
    - important_date
  observed_labels:
    general_event: Wydarzenie
    driving_lesson: Jazda
    important_date: Ważne daty
  important_date_exact_semantics: TO_VERIFY
  important_date_present_in_manual_create_selector: false

primary_action:
  label: Dodaj wydarzenie
  action: add_calendar_event

resource_filters:
  staff:
    multi_select_by_checkbox: true
    select_all: true
    projection_fields:
      - full_name
      - category_labels_optional
      - warning_indicator_optional
    observed_resources:
      - label: Jan Kowalski
        category_labels: [A, B]
      - label: Jan Nowak
      - label: Anna Nowak
    add_action: add_staff_from_calendar
    warning_indicator_semantics: TO_VERIFY
  vehicles:
    multi_select_by_checkbox: true
    select_all: true
    projection_fields:
      - make_model
      - category_labels_optional
      - warning_indicator_optional
    observed_resources:
      - label: Hyundai i20
        category_labels: [B]
      - label: Yamaha MT-07
    add_action: add_vehicle_from_calendar
    warning_indicator_semantics: TO_VERIFY
  locations:
    multi_select_by_checkbox: true
    select_all: true
    grouped_by_location_type: true
    projection_fields:
      - location_type
      - name
      - address
    observed_groups:
      - lecture_room
      - maneuvering_area
    observed_resources:
      - name: Sala wykładowa
        address: Bielerzewskiej 4B
      - name: Plan nauki jazdy
        address: Bielerzewskiej 4B
    add_action: add_location_from_calendar

calendar_navigation:
  confirmed:
    - previous_period
    - next_period
    - today
    - month_view
    - week_view
    - day_view
  observed_view: month
  observed_period_label: wrzesień 2026

add_event_form_confirmed:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  screen_spec: specs/screens/calendar-add-event.yml
  manual_types:
    - general_event
    - driving_lesson
  same_visible_form_for_general_event_and_driving_lesson: true
  fields:
    - event_type
    - event_name
    - start_date
    - start_time
    - duration
    - student_id
    - instructor_id
    - vehicle_id
    - meeting_location_id_or_custom_meeting_place
  required_by_visible_marker:
    - event_type
    - start_date
    - start_time
  optional_by_visible_label:
    - event_name
    - student_id
    - instructor_id
    - vehicle_id
    - meeting_place
  resource_cardinality_for_form:
    student: zero_or_one
    instructor: zero_or_one
    vehicle: zero_or_one
    meeting_place: zero_or_one
  start_plus_duration_model_supported: true
  instructor_selector_projects_expired_documents: true
  vehicle_selector_projects_expired_documents: true
  meeting_location_grouped_by_type: true
  meeting_place_modes:
    - saved_location
    - custom_text
  custom_meeting_place_toggle_confirmed: true

post_save_behavior:
  competitor_creation_blocked_in_demo: true
  competitor_event_detail_edit_flow: UNOBSERVABLE_IN_DEMO_NONBLOCKING
  competitor_cancel_move_delete_flow: UNOBSERVABLE_IN_DEMO_NONBLOCKING
  competitor_drag_and_drop: UNOBSERVABLE_IN_DEMO_NONBLOCKING
  own_product_policy: docs/50-own-calendar-event-lifecycle.md

confirmed_actions:
  - open_calendar
  - toggle_general_event_filter
  - toggle_driving_lesson_filter
  - toggle_important_date_filter
  - add_calendar_event
  - toggle_staff_resource
  - select_all_staff_resources
  - add_staff_from_calendar
  - toggle_vehicle_resource
  - select_all_vehicle_resources
  - add_vehicle_from_calendar
  - toggle_location_resource
  - select_all_location_resources
  - add_location_from_calendar
  - calendar_previous_period
  - calendar_next_period
  - calendar_today
  - calendar_view_month
  - calendar_view_week
  - calendar_view_day
  - select_calendar_event_type
  - set_calendar_event_name
  - set_calendar_event_start_date
  - set_calendar_event_start_time
  - set_calendar_event_duration
  - search_and_select_student
  - search_and_select_instructor
  - search_and_select_vehicle
  - select_saved_meeting_location
  - switch_to_custom_meeting_place
  - set_custom_meeting_place_text
  - switch_back_to_saved_meeting_location
  - save_calendar_event_visible_action
  - cancel_calendar_event_create
  - close_calendar_event_drawer

confirmed_cross_module_relationships:
  - staff_has_calendar_context
  - vehicle_has_calendar_context
  - location_has_calendar_context
  - main_calendar_aggregates_staff_vehicles_locations
  - add_event_can_reference_student
  - add_event_can_reference_instructor
  - add_event_can_reference_vehicle
  - add_event_can_reference_location_or_custom_meeting_place
  - instructor_selector_projects_staff_document_validity
  - vehicle_selector_projects_vehicle_document_validity

own_product_model:
  single_calendar_engine: true
  suggested_event_types:
    - general_event
    - driving_lesson
    - important_date
  suggested_relationships:
    - calendar_event_staff
    - calendar_event_vehicles
    - calendar_event_locations
    - calendar_event_students
  event_time_model:
    - starts_at
    - duration_minutes
    - derived_or_consistent_ends_at
  resource_conflict_detection_required: true
  compliance_checks_required: true
  timezone_per_organization_required: true
  audit_event_changes: true
  event_lifecycle:
    - scheduled
    - completed
    - cancelled
  event_detail_edit_cancel_behavior_defined_by_own_policy: true

security_requirements:
  - tenant_isolation
  - authorize_calendar_by_organization
  - validate_staff_resources_by_organization
  - validate_vehicle_resources_by_organization
  - validate_location_resources_by_organization
  - validate_student_resources_by_organization_when_used
  - prevent_cross_tenant_resource_assignment
  - server_side_resource_conflict_detection
  - server_side_critical_compliance_validation
  - audit_event_create_update_cancel

remaining_gaps:
  - important_date_exact_semantics
  - duration_exact_validation
  - driving_lesson_backend_required_resources
  - warning_vs_hard_block_for_expired_resources
  - recurrence
  - notifications
  - self_booking
  - employee_work_time_tracking_ui
  - main_resource_warning_indicator_exact_semantics
  - colors_and_legend
  - permissions
  - resource_selection_persistence

nonblocking_competitor_unknowns:
  - event_status_after_save
  - event_detail_edit
  - cancel_move_behavior
  - drag_and_drop
  - post_save_conflict_messages
