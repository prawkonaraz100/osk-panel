screen:
  id: internal_exam_generation_access
  scope: admin_osk
  parent_route: /egzamin-wewnetrzny/panel
  title: Generuj dostęp do egzaminu wewnętrznego
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/65-internal-exam-generation-access-flow.md
  legal_rules: specs/legal/training-theory-exemptions.yml
  candidate_edit_spec: specs/screens/internal-exam-edit-candidate-data.yml
  candidate_edit_doc: docs/68-internal-exam-edit-candidate-data.md

entry_points:
  selected_student_row:
    confirmed: true
    steps:
      - select_exactly_one_student_row
      - UI_shows_ZAZNACZONE_1
      - click_Generuj_egzaminy_1
      - open_generation_drawer_with_candidate_selected
  standalone_generate_exam_button:
    confirmed: true
    competitor_observed_steps:
      - click_large_Generuj_egzamin_button
      - open_generation_drawer_without_candidate
      - choose_existing_student_or_use_Dodaj_nowego_kursanta_form
    own_product_behavior:
      - choose_existing_formal_student_or_create_persistent_student_and_enrollment
      - return_to_exam_generation_after_persistent_record_exists
  student_profile_entry:
    previously_observed_equivalent_generation_drawer: true

cardinality:
  target_students_per_generation_flow: 1
  batch_multi_student_generation_confirmed: false
  user_confirmed_one_at_a_time: true

formal_osk_constraints:
  student_id_required: true
  course_enrollment_id_required: true
  ephemeral_ad_hoc_candidate_allowed: false
  exam_is_course_context_action: true
  theory_part_availability_must_follow_legal_rule_engine: true
  training_requirement_context_editable_later: true

inventory:
  available_exam_count_visible: true
  observed_available: 160

empty_candidate_state:
  existing_student_search:
    enabled: true
    search_fields_confirmed:
      - first_name
      - last_name
      - email
      - login
      - pesel
  competitor_new_student_form:
    label: Dodaj nowego kursanta
    observed_fields:
      - exam_category
      - exam_language
      - first_name
      - last_name
      - registry_or_pkk_number
      - pesel
      - email
    email_ui_note: do wysłania linku egzminu (opcjonalnie)
    exact_competitor_persistence_behavior: TO_VERIFY
  own_product_new_student_action:
    must_create_persistent_student: true
    must_create_or_attach_formal_course_enrollment: true
    must_not_create_ephemeral_exam_only_candidate: true

candidate_selected_state:
  fields:
    - category
    - language
    - first_name
    - last_name
    - pkk
    - pesel
    - email
  actions:
    - remove_candidate_from_current_form
    - edit_candidate_data
  edit_state:
    confirmed: true
    spec: specs/screens/internal-exam-edit-candidate-data.yml
    fields:
      exam_category:
        editable: true
        control: select
      exam_language:
        editable: true
        control: select
      first_name:
        editable: true
        control: input
      last_name:
        editable: true
        control: input
      pesel:
        editable: true
        control: input
      pkk:
        editable: true
        control: input
      email:
        editable: true
        control: input
        ui_note: do wysłania linku egzminu (opcjonalnie)
    actions:
      - cancel_candidate_edit
      - save_candidate_edit
    competitor_persistence_to_main_student_profile: TO_VERIFY

launch_modes:
  remote_link:
    button_label: Udostępnij link do egzaminu
    confirmed_behavior:
      - generate_exam_link
      - candidate_can_take_exam_anywhere_with_internet
      - send_link_to_candidate_email
    email_required_at_action_time: OWN_PRODUCT_RECOMMENDATION
    tokenized_link_required_for_own_product: true
    ttl: TO_DECIDE
    revocation: OWN_PRODUCT_REQUIRED
  local_station:
    button_label: Rozpocznij egzamin teraz
    confirmed_behavior:
      - start_internal_exam_on_current_computer_station
    concurrent_candidate_limit_message: Dostępne tylko dla 1 kursanta jednocześnie.
    concurrent_candidates_in_this_flow: 1
    email_required: false_for_own_product

own_product_model:
  attempt_and_launch_separate: true
  candidate_sources:
    - existing_student
    - newly_created_persistent_student
  student_id_nullable: false
  course_enrollment_id_nullable: false
  source_identity_data_bound_to_formal_student_profile: true
  identity_change_from_exam_flow_requires_audit: true
  attempt_snapshot_immutable_after_creation: true
  entities:
    - internal_exam_attempt
    - internal_exam_launch
  launch_modes:
    - remote_link
    - local_station

own_product_validations:
  - exactly_one_student
  - persistent_student_exists
  - formal_course_enrollment_exists
  - exam_part_is_required_for_course_under_legal_rule_engine
  - available_exam_inventory_greater_than_zero
  - category_present
  - category_matches_or_resolves_to_course_enrollment
  - category_change_recalculates_training_requirements
  - language_present
  - required_candidate_identity_data_present
  - pesel_or_birth_date_rule
  - authorized_operator
  - tenant_scope
  - valid_email_required_only_when_remote_email_delivery_selected

confirmed_actions:
  - open_standalone_generate_exam_drawer
  - search_existing_student_for_exam
  - competitor_enter_new_student_data_in_drawer
  - select_one_student_for_exam_generation
  - open_generate_exam_for_selected_student
  - view_available_exam_inventory_in_generation_drawer
  - view_candidate_exam_data
  - change_exam_category
  - change_exam_language
  - remove_candidate_from_generation_form
  - open_candidate_data_edit
  - edit_exam_category
  - edit_exam_language
  - edit_candidate_first_name
  - edit_candidate_last_name
  - edit_candidate_pesel
  - edit_candidate_pkk
  - edit_candidate_email
  - cancel_candidate_edit
  - save_candidate_edit
  - share_exam_link_by_email
  - start_exam_on_current_station

remaining_gaps:
  - exact_required_candidate_fields
  - exam_category_options
  - exam_language_options
  - competitor_new_student_persistence_behavior
  - competitor_save_candidate_data_persistence_behavior
  - validation_messages
  - no_pesel_birth_date_handling_in_competitor_exam_drawer
  - remote_link_success_state
  - email_template
  - local_station_transition_screen
  - remote_link_ttl
  - remote_link_revoke_behavior
  - resend_link_behavior
  - unused_link_behavior
  - exact_inventory_consumption_moment
  - free_vs_paid_inventory_consumption_order
