    sort: true

generation_flow:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  spec: specs/screens/internal-exam-generation-access.yml
  doc: docs/65-internal-exam-generation-access-flow.md
  drawer_title: Generuj dostęp do egzaminu wewnętrznego
  observed_available_exam_count: 160
  entry_points:
    selected_student:
      confirmed: true
      opens_with_candidate_selected: true
    standalone_button:
      confirmed: true
      opens_without_candidate: true
      choices:
        - search_existing_student
        - enter_ad_hoc_candidate
  empty_state_search_fields:
    - first_name
    - last_name
    - email
    - login
    - pesel
  ad_hoc_candidate_fields:
    - exam_category
    - exam_language
    - first_name
    - last_name
    - registry_or_pkk_number
    - pesel
    - email
  ad_hoc_candidate_persistence_to_student_module: TO_VERIFY
  selected_candidate_fields:
    - category
    - language
    - first_name
    - last_name
    - pkk
    - pesel
    - email
  launch_modes:
    remote_link:
      label: Udostępnij link do egzaminu
      sends_link_to_candidate_email: true
      candidate_can_take_anywhere_with_internet: true
    local_station:
      label: Rozpocznij egzamin teraz
      starts_on_current_computer_station: true
      concurrent_candidate_limit: 1
      observed_message: Dostępne tylko dla 1 kursanta jednocześnie.

