screen:
  id: internal_exam_management_panel
  scope: admin_osk
  route: /egzamin-wewnetrzny/panel
  title: Zarządzaj egzaminami
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/60-internal-exam-management-panel.md
  expanded_attempts_spec: specs/screens/internal-exam-expanded-attempts.yml
  answer_sheet_pdf_spec: specs/screens/internal-exam-answer-sheet-pdf.yml
  result_details_spec: specs/screens/internal-exam-result-details.yml
  question_review_spec: specs/screens/internal-exam-question-review.yml
  generation_access_spec: specs/screens/internal-exam-generation-access.yml
  edit_candidate_data_spec: specs/screens/internal-exam-edit-candidate-data.yml
  filtering_spec: specs/screens/internal-exam-filtering.yml
  sorting_spec: specs/screens/internal-exam-sorting.yml
  legal_rules: specs/legal/training-theory-exemptions.yml

inventory:
  projections:
    free_monthly:
      label: Darmowe
      observed_available: 10
    paid:
      label: Opłacone
      observed_available: 150
    total:
      label: Wszystkie
      observed_available: 160
  source_aware_inventory_required: true

assigned_exams_section:
  controls:
    standalone_generate_exam_button: true
    select_exactly_one_student_row: true
    selected_state_label: ZAZNACZONE (1)
    selected_generate_label: Generuj egzaminy (1)
    hide_finished_toggle: true
    search: true
    filter: true
    sort: true
  multi_student_batch_generation: false

formal_osk_constraints:
  student_id_required: true
  course_enrollment_id_required: true
  ephemeral_ad_hoc_candidate_allowed: false
  exam_part_must_be_required_by_rule_engine: true
  requirement_context_can_be_corrected_later_with_audit: true

generation_flow:
  entry_points:
    - selected_existing_student
    - standalone_generate_button
  own_product_new_student_behavior:
    create_persistent_student_first: true
    create_or_attach_course_enrollment_first: true
    return_to_exam_flow_after_persistence: true
  candidate_fields:
    - exam_category
    - exam_language
    - first_name
    - last_name
    - pesel_or_date_of_birth_own_product
    - registry_or_pkk_number
    - email
  edit_candidate_data_confirmed: true
  launch_modes:
    - remote_link
    - local_station
  one_candidate_at_a_time: true

row_granularity:
  primary_projection: student_with_latest_attempt_summary
  one_row_is_not_one_attempt: true
  one_student_many_attempts: true

columns:
  - email_or_login
  - student_full_name
  - latest_exam_category
  - latest_exam_status
  - latest_exam_at
  - latest_exam_language
  - exam_count
  - row_actions

status_projection:
  failed:
    panel_visual_observed: red_x
    expanded_label_observed: Niezaliczony
  passed:
    existence_confirmed_by_filter: true
    panel_visual: TO_VERIFY
  unassigned:
    filter_label_confirmed: Brak przypisanego
  not_conducted:
    filter_label_confirmed: Nie przeprowadzony
  unassigned_and_not_conducted_are_distinct_ui_states: true

filtering:
  spec: specs/screens/internal-exam-filtering.yml
  course_category:
    control: multi_select
  status:
    control: multi_checkbox
    options:
      - unassigned
      - failed
      - not_conducted
      - passed
  own_product_requirement_aware_filtering: true
  theory_not_required_must_not_be_reported_as_unassigned_gap: true

sorting:
  spec: specs/screens/internal-exam-sorting.yml
  direction:
    control: select
    options:
      - asc
      - desc
    labels:
      asc: Rosnąco
      desc: Malejąco
  field:
    control: single_radio
    options:
      - email_or_login
      - student_full_name
      - latest_exam_category
      - latest_exam_status
      - latest_exam_at
      - latest_exam_language
      - exam_count
  observed_state:
    direction: asc
    field: latest_exam_at
    confirmed_as_global_default: false

expanded_history:
  row_entity: internal_exam_attempt
  stable_attempt_id_required: true
  displayed_timestamp_is_not_identity: true

result_and_review:
  tokenized_result_route: /egzamin-wewnetrzny?pid=<opaque_token>
  question_count: 32
  basic_question_count: 20
  specialized_question_count: 12
  per_question_review_confirmed: true
  immutable_attempt_snapshot_required: true

answer_sheet_pdf:
  per_attempt: true
  observed_question_count: 32
  signatures_present: true
  immutable_snapshot_required: true

own_product_entities:
  - internal_exam_inventory_ledger
  - internal_exam_attempts
  - internal_exam_attempt_questions
  - internal_exam_launches
  - internal_exam_launch_tokens
  - internal_exam_results
  - internal_exam_documents

confirmed_actions:
  - open_internal_exam_management_panel
  - view_exam_inventory
  - open_exam_purchase
  - open_standalone_generate_exam_drawer
  - search_existing_student_for_exam
  - select_one_student_for_exam_generation
  - edit_candidate_exam_data
  - share_exam_link_by_email
  - start_exam_on_current_station
  - toggle_hide_finished_exams
  - search_exam_rows
  - open_exam_filters
  - filter_by_multiple_course_categories
  - filter_by_exam_status
  - open_exam_sorting
  - sort_internal_exam_rows_ascending
  - sort_internal_exam_rows_descending
  - sort_by_email_or_login
  - sort_by_student_name
  - sort_by_latest_exam_category
  - sort_by_latest_exam_status
  - sort_by_latest_exam_date
  - sort_by_latest_exam_language
  - sort_by_exam_count
  - expand_exam_history
  - collapse_exam_history
  - open_exam_details
  - review_specific_exam_question
  - download_exam_printout

remaining_gaps:
  - exam_category_options
  - exam_language_options
  - exact_search_fields
  - passed_status_table_visual
  - exact_displayed_datetime_semantics
  - sort_null_value_ordering
  - free_vs_paid_consumption_order
  - free_monthly_reset_policy
  - exact_exam_unit_consumption_moment
  - exam_duration
  - remote_link_ttl_revocation_and_resend
  - success_error_states
