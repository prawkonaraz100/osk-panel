screen:
  id: internal_exam_result_details
  scope: exam_frontend
  route_pattern: /egzamin-wewnetrzny?pid=<opaque_token>
  source_host_observed: www.prawo-jazdy-360.pl
  entry_point: internal_exam_management_panel_specific_attempt_details
  confidence: USER_CONFIRMED_AUTH_RESULT_SCREEN
  verified_at: 2026-09-05
  doc: docs/63-internal-exam-result-details-screen.md
  question_review_spec: specs/screens/internal-exam-question-review.yml
  question_review_doc: docs/64-internal-exam-question-review.md

purpose:
  - present_completed_attempt_result
  - navigate_attempt_questions_for_review
  - present_answer_statistics

result_header:
  observed_examples:
    - score: 0
      max_score: 74
      result: failed
    - score: 9
      max_score: 74
      result: failed
  failed_message: Niestety nie udało Ci się, spróbuj ponownie rozwiązać test.
  passing_threshold: TO_VERIFY

question_navigation:
  prompt: Wybierz numer pytania, aby sprawdzić odpowiedzi
  basic:
    from: 1
    to: 20
    count: 20
  specialized:
    from: 21
    to: 32
    count: 12
  total_count: 32
  each_question_number_is_review_navigation: true
  marker_semantics:
    green: correct
    red: incorrect
    dark_selected: currently_open_question
  observed_9_point_state:
    current_question: 1
    green_questions: [2, 3, 4]
    red_questions_range: 5-32

question_review:
  confidence: USER_CONFIRMED_RESULT_REVIEW_SCREEN
  spec: specs/screens/internal-exam-question-review.yml
  media_rendering_confirmed: true
  question_text_confirmed: true
  point_value_confirmed: true
  category_confirmed: true
  correct_answer_presentation_confirmed: true
  selected_answer_presentation_confirmed: true
  incorrect_feedback_confirmed: true

statistics:
  cards:
    - id: basic
      fields: [correct, incorrect]
      chart: donut
    - id: specialized
      fields: [correct, incorrect]
      chart: donut
    - id: all
      fields: [correct, incorrect]
      chart: donut
  observed_zero_score_counts:
    basic: {correct: 0, incorrect: 20}
    specialized: {correct: 0, incorrect: 12}
    all: {correct: 0, incorrect: 32}

relationship_to_answer_sheet_pdf:
  same_attempt_snapshot: true
  interactive_screen_and_print_document_are_distinct_projections: true
  answer_sheet_spec: specs/screens/internal-exam-answer-sheet-pdf.yml

own_product_requirements:
  immutable_attempt_result_projection: true
  do_not_recalculate_historical_result_from_current_question_bank: true
  immutable_attempt_question_review_projection: true
  fields:
    - score
    - max_score
    - result
    - basic_correct_count
    - basic_incorrect_count
    - specialized_correct_count
    - specialized_incorrect_count
    - total_correct_count
    - total_incorrect_count
    - ordered_attempt_questions
  tokenized_external_access: true
  internal_attempt_id_not_exposed_as_access_secret: true

confirmed_actions:
  - open_completed_exam_result_details
  - view_exam_score
  - view_exam_max_score
  - view_failed_exam_message
  - view_basic_question_navigation
  - view_specialized_question_navigation
  - select_question_number_for_answer_review
  - view_basic_answer_statistics
  - view_specialized_answer_statistics
  - view_total_answer_statistics
  - render_exam_question_media
  - render_exam_question_text
  - render_exam_question_point_value
  - render_exam_question_category
  - render_correct_answer
  - render_candidate_selected_answer
  - render_incorrect_answer_state

remaining_gaps:
  - correctly_answered_question_review
  - unanswered_question_review
  - abc_answer_type_review
  - image_question_review
  - explanation_below_current_viewport
  - positive_result_screen
  - passing_threshold_display
  - historical_result_token_ttl_and_revocation
