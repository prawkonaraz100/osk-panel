screen:
  id: license_generate_access
  scope: admin_osk
  parent_route: /licencje/panel
  parent_screen: license_management_panel
  trigger_action: generate_student_learning_access
  title: Przydzielanie licencji
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/55-license-generate-access-form.md
  selected_existing_student_state_spec: specs/screens/license-existing-student-selected.yml
  selected_existing_student_state_doc: docs/56-license-existing-student-selected-state.md

target_cardinality:
  per_submit: exactly_one
  multiple_search_results_are_options_not_targets: true
  batch_assignment: false
  correction_note: three observed students were three selectable search results, not three selected assignment targets

fields:
  - name: license_product_duration
    label: Wybierz rodzaj licencji
    control: single_select
    observed_options:
      - one_month
      - three_months
      - six_months
    observed_labels:
      one_month: 1 miesiąc
      three_months: 3 miesiące
      six_months: 6 miesięcy
    inventory_available_count_visible: true

  - name: language
    label: Język
    control: single_select
    observed_options:
      - pl
      - en
      - de
      - ru
      - uk
    observed_labels:
      pl: Polski
      en: Angielski
      de: Niemiecki
      ru: Rosyjski
      uk: Ukraiński
    source_conflict_with_purchase_marketing_copy: true
    visible_in_initial_form: true
    visible_after_existing_student_selection: false

  - name: new_learning_identifier
    label: Email lub login
    section_label: Dodaj nowego kursanta
    control: text
    target_mode: new_learning_access

  - name: existing_student_id
    label: Wyszukaj kursanta
    section_label: Wyszukaj kursanta
    control: searchable_single_select
    target_mode: existing_student
    selection_cardinality: one
    search_fields_confirmed:
      - first_name
      - last_name
      - contact_email
      - learning_login
      - pesel
    result_projection:
      - full_name
      - learning_identifier
    observed_result_count_example: 3
    observed_results_meaning: three_options_choose_one

alternative_target_modes:
  separator_label: lub
  modes:
    - new_learning_access
    - existing_student
  mutually_exclusive_by_ui_semantics: true
  exactly_one_target_required: true

existing_student_selected_state:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  screen_state_spec: specs/screens/license-existing-student-selected.yml
  behavior:
    - replace_search_with_selected_student_summary
    - display_existing_learning_access_language
    - hide_global_language_selector
    - expose_clear_selected_target_action
  selected_card_fields_observed:
    - student_full_name
    - learning_identifier_shown_under_email_label
    - language
    - pesel_optional
  language_rule_supported: existing_learning_access_language_is_inherited
  multiple_targets_confirmed_by_this_state: false

language_conflict:
  status: SOURCE_CONFLICT
  authenticated_assignment_selector_languages:
    - pl
    - en
    - de
    - ru
    - uk
  purchase_screen_marketing_languages:
    - pl
    - en
    - de
    - uk
  own_product_rule: capability_driven_language_catalog

primary_action:
  label: Przydziel licencje
  action: submit_single_target_license_assignment

close_control:
  label: X
  action: close_license_assignment_drawer

confirmed_actions:
  - open_generate_license_access_drawer
  - select_license_product_duration
  - view_available_inventory_count
  - select_learning_access_language_for_new_access
  - enter_new_learning_identifier
  - search_existing_student_for_license
  - search_student_by_name
  - search_student_by_surname
  - search_student_by_email
  - search_student_by_login
  - search_student_by_pesel
  - select_one_existing_student
  - show_selected_student_summary
  - inherit_existing_learning_access_language
  - clear_selected_student_target_visible_action
  - submit_single_target_license_assignment
  - close_license_assignment_drawer

own_product_requirements:
  - tenant_isolation
  - exactly_one_assignment_target_per_submit
  - atomic_inventory_assignment
  - common_assignment_service_for_license_panel_and_student_profile_entry_points
  - prevent_negative_inventory
  - validate_target_mode_exclusive
  - reject_multiple_targets
  - tenant_scope_existing_student_search
  - capability_driven_languages
  - separate_student_profile_from_learning_access
  - preserve_existing_learning_access_language_when_assigning_to_existing_access
  - keep_contact_email_separate_from_learning_identifier
  - clear_target_action_must_not_delete_student
  - audit_assignment
  - use_secret_policy_defined_for_osk_secretariat_workflow

remaining_gaps:
  - new_identifier_validation
  - duplicate_login_email_behavior
  - whether_new_path_creates_minimal_student_profile_or_learning_access_only
  - exact_clear_selected_target_ui_result
  - behavior_for_student_with_multiple_learning_accesses
  - success_error_messages
  - exact_competitor_inventory_commit_timing
  - russian_full_content_availability
  - zero_inventory_behavior
