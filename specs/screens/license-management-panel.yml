    - active_count
  purchase_more_action:
    label: Dokup licencje
    route: /licencje/wykup

primary_access_action:
  label: Generuj dostęp dla kursanta do prawo-jazdy-360.pl
  action: generate_student_learning_access
  exact_form: USER_CONFIRMED_AUTH_SCREEN
  screen_spec: specs/screens/license-generate-access.yml
  confirmed_fields:
    - license_product_duration
    - language_for_new_access
    - new_learning_identifier_or_existing_student
  confirmed_product_options:
    - one_month
    - three_months
    - six_months
  confirmed_language_options:
    - pl
    - en
    - de
    - ru
    - uk
  source_conflict_purchase_marketing_omits_ru: true
  existing_student_search_fields:
    - first_name
    - last_name
    - contact_email
    - learning_login
    - pesel
  target_cardinality: exactly_one
  multiple_search_results_select_one: true
  bulk_assignment_supported: false

assigned_licenses_section:
  title: Przydzielone licencje
  visible_controls:
    add_new_student: true
    select_visible: true
    download_accesses: true
    assign_license: true
    hide_finished_licenses_toggle: true
    search: true
    sort: true
  assign_license_semantics:
    target_cardinality: exactly_one
    multi_target_batch: false
  multi_row_selection:
    supported: true
    confirmed_use_case: download_access_credentials
    do_not_infer_bulk_assignment: true

bulk_access_download:
  confidence: USER_CONFIRMED_DOWNLOADED_DOCUMENT
  screen_spec: specs/screens/license-bulk-access-pdf.yml
  multiple_selected_accesses_supported: true
  observed_selected_count: 3
  output:
    format: pdf
    single_combined_file: true
    observed_pages: 4
    index_page: true
    one_page_per_selected_access: true
    localized_per_access: true
  observed_locales:
    - pl
    - uk
    - en
  confirmed_actions:
    - select_multiple_learning_access_rows
    - download_selected_access_credentials
    - generate_single_combined_access_pdf

row_granularity:
  primary_entity: learning_access
  not_single_license_row: true

columns:
  - learning_login_data
  - student_full_name
  - newest_license_generated_at
  - newest_license_language
  - newest_license_status
  - assigned_license_count
  - row_actions

learning_login_projection:
  - language_indicator
  - learning_identifier

sorting:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  screen_spec: specs/screens/license-sorting.yml
  directions:
    - asc
    - desc
  columns:
    - learning_identifier
    - student_full_name
    - latest_license_generated_at
    - learning_access_language
    - latest_license_status
    - assigned_license_count
  observed_state:
    direction: desc
    column: latest_license_generated_at
  observed_state_is_global_default: TO_VERIFY

observed_status_presentations:
  - not_activated
  - active_with_remaining_days

assigned_license_collection:
  multiple_per_learning_access_confirmed: true
  observed_counts: [5, 2, 2]
  expand_action:
    label: Rozwiń
    content: USER_CONFIRMED_AUTH_SCREEN
    screen_spec: specs/screens/license-expanded-assignments.yml
  expanded_columns_confirmed:
    - learning_login_data
    - assigned_at
    - expires_at
    - remaining_time
    - status
    - row_actions
  unactivated_assignment_projection:
    expires_at_blank: true
    remaining_time_blank: true
    delete_action_visible: true
  active_assignment_projection:
    expires_at_visible: true
    remaining_days_visible: true
    delete_action_not_visible_in_provided_capture: true
  observed_active_rows:
    - student: Ala Nowak
      assigned_at: 2026-01-23T08:41
      expires_at: 2027-01-22T23:37
      remaining_days: 139
      status: active
    - student: Ala Nowak
      assigned_at: 2026-01-21T12:36
      expires_at: 2026-12-22T23:37
      remaining_days: 108
      status: active

