screen:
  id: license_management_panel
  scope: admin_osk
  route: /licencje/panel
  title: Generowanie dostępu
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/53-license-management-panel.md
  expanded_assignments_spec: specs/screens/license-expanded-assignments.yml
  expanded_assignments_doc: docs/54-license-expanded-assignments.md
  generate_access_spec: specs/screens/license-generate-access.yml
  generate_access_doc: docs/55-license-generate-access-form.md

inventory_cards:
  products:
    - duration_days: 31
      observed_available: 1
      observed_active: 9
    - duration_days: 90
      observed_available: 36
      observed_active: 4
    - duration_days: 180
      observed_available: 56
      observed_active: 4
  observed_counts_are_snapshot_only: true
  fields:
    - available_count
    - active_count
  purchase_more_action:
    label: Dokup licencje
    route: /licencje/wykup

primary_access_action:
  label: Generuj dostęp dla kursanta do prawo-jazdy-360.pl
  action: generate_student_learning_access
  exact_form: USER_CONFIRMED_AUTH_SCREEN
  screen_spec: specs/screens/license-generate-access.yml
  confirmed_fields:
    - license_product_duration
    - language
    - new_learning_identifier_or_existing_student
  confirmed_product_options:
    - one_month
    - three_months
    - six_months
  confirmed_language_options:
    - pl
    - en
    - de
    - ru
    - uk
  source_conflict_purchase_marketing_omits_ru: true
  existing_student_search_fields:
    - first_name
    - last_name
    - contact_email
    - learning_login
    - pesel

assigned_licenses_section:
  title: Przydzielone licencje
  controls:
    add_new_student: true
    select_visible: true
    bulk_download_accesses: true
    bulk_assign_license: true
    hide_finished_licenses_toggle: true
    search: true
    sort: true

row_granularity:
  primary_entity: learning_access
  not_single_license_row: true

columns:
  - learning_login_data
  - student_full_name
  - newest_license_generated_at
  - newest_license_language
  - newest_license_status
  - assigned_license_count
  - row_actions

learning_login_projection:
  - language_indicator
  - learning_identifier

observed_status_presentations:
  - not_activated
  - active_with_remaining_days

observed_status_examples:
  not_activated: Nie aktywowano
  active_with_remaining_days: Aktywna, pozostało 139 dni

assigned_license_collection:
  multiple_per_learning_access_confirmed: true
  observed_counts: [5, 2, 2]
  expand_action:
    label: Rozwiń
    content: USER_CONFIRMED_AUTH_SCREEN
    screen_spec: specs/screens/license-expanded-assignments.yml
  expanded_columns_confirmed:
    - learning_login_data
    - assigned_at
    - expires_at
    - remaining_time
    - status
    - row_actions
  unactivated_assignment_projection:
    expires_at_blank: true
    remaining_time_blank: true
    delete_action_visible: true
  active_assignment_projection:
    expires_at_visible: true
    remaining_days_visible: true
    delete_action_not_visible_in_provided_capture: true
  observed_active_rows:
    - student: Ala Nowak
      assigned_at: 2026-01-23T08:41
      expires_at: 2027-01-22T23:37
      remaining_days: 139
      status: active
    - student: Ala Nowak
      assigned_at: 2026-01-21T12:36
      expires_at: 2026-12-22T23:37
      remaining_days: 108
      status: active
  newest_parent_row_matches_latest_assignment_timestamp: true

license_extension_behavior:
  confidence: STRONGLY_SUPPORTED_BY_OBSERVATION
  observed_expiry_delta_days: 31
  observed_remaining_days_delta: 31
  interpretation: subsequent_assignment_can_extend_existing_active_access
  exact_product_identity_for_observed_rows: TO_VERIFY
  always_stack_rule_for_competitor: TO_VERIFY

row_actions:
  - action: download_student_access_credentials
    label: Dostęp
    route_pattern: /licencje/pobierz?guid=<student_id>
  - action: open_student_profile_from_license_panel
    label: Profil
    route_pattern: /kursanci/<student_id>
  - action: expand_assigned_licenses
    label: Rozwiń

bulk_behavior:
  actions_disabled_without_selection_observed: true
  selection_count_projection_observed: true
  exact_selected_scope: visible_rows
  exact_bulk_result: TO_VERIFY

finished_license_filter:
  label: Ukryj licencje zakończone
  control: toggle
  exact_mixed_history_behavior: TO_VERIFY

own_product_model:
  entities:
    - license_products
    - license_inventory_entries
    - learning_accesses
    - license_assignments
    - license_activation_events
  one_learning_access_has_many_license_assignments: true
  assignment_separate_from_activation: true
  assignment_has_own_assigned_at: true
  unactivated_assignment_has_null_activated_at: true
  unactivated_assignment_has_null_expires_at: true
  access_has_current_expiry_projection: true
  entitlement_extension_ledger: true
  extension_rule:
    first_activation_base: activated_at
    active_access_extension_base: current_expires_at
    generalized_base: max(effective_activation_time,current_expires_at)
    result: base_plus_product_duration
  assignment_audit_fields:
    - duration_days
    - expiry_before
    - expiry_after
  remaining_days_derived_from_current_or_assignment_expiry: true
  revoke_unactivated_restores_inventory: true
  active_assignment_normal_revoke_disabled: true
  common_assignment_service_across_entry_points: true
  language_catalog_capability_driven: true
  target_modes_for_generate_access:
    - new_learning_access
    - existing_student

confirmed_actions:
  - open_license_management_panel
  - view_license_inventory_by_duration
  - open_license_purchase_from_inventory_card
  - generate_student_learning_access
  - select_license_product_duration_for_generation
  - select_language_for_generation
  - enter_new_learning_identifier
  - search_existing_student_for_license
  - select_existing_student_for_license
  - submit_license_assignment
  - add_new_student_from_license_panel
  - select_visible_learning_accesses
  - bulk_download_access_credentials
  - bulk_assign_license
  - toggle_hide_finished_licenses
  - search_license_accesses
  - open_license_sorting
  - expand_assigned_licenses
  - collapse_assigned_licenses
  - view_individual_license_assignments
  - view_active_license_expiry
  - view_active_license_remaining_days
  - delete_unactivated_license_assignment
  - download_student_access_credentials
  - open_student_profile_from_license_panel

security_requirements:
  - tenant_isolation
  - permission_scope_license_inventory
  - permission_scope_learning_access_management
  - atomic_inventory_assignment
  - atomic_entitlement_extension
  - prevent_negative_inventory
  - prevent_double_application_of_same_inventory_entry
  - tenant_scope_student_search
  - do_not_expose_pesel_in_logs_unnecessarily
  - audit_license_assignment
  - audit_license_activation
  - audit_license_revoke
  - audit_credential_download
  - authorize_student_profile_cross_link_by_organization
  - bulk_actions_must_validate_every_selected_resource

remaining_gaps:
  - expired_assignment_expanded_row
  - sort_options
  - exact_search_fields_main_table
  - active_inventory_exact_semantics
  - bulk_assign_license_flow
  - bulk_download_output
  - finished_license_filter_mixed_history_behavior
  - exact_stack_rule_exceptions
  - expired_access_extension_behavior
  - multiple_unactivated_activation_order
  - new_identifier_validation
  - duplicate_login_email_behavior
  - new_path_student_profile_vs_access_only
  - russian_full_content_availability
  - pagination
  - empty_states
  - validations
  - success_error_messages
