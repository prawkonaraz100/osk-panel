screen:
  id: school_locations_edit
  scope: admin_osk
  parent_route: /lokalizacje
  title: Edycja lokalizacji
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/73-school-locations-edit-form.md

fields:
  type:
    required: true
    control: select
    options_confirmed:
      - branch
      - lecture_room
      - maneuvering_area
    labels:
      branch: Filia
      lecture_room: Sala wykładowa
      maneuvering_area: Plac manewrowy
  name:
    required: true
  street_and_number:
    required: true
  postal_code:
    required: true
  locality:
    required: true
    control: searchable_catalog_select

observed_example:
  type: lecture_room
  name: Sala wykładowa
  street_and_number: Bielerzewskiej 4B
  postal_code: 61-369
  locality: Kowary

