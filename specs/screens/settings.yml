screen:
  id: osk_settings
  route: /ustawienia
  menu_path: [Konto OSK, Ustawienia]
  title: Ustawienia konta
  confidence: USER_CONFIRMED_AUTH_SCREEN

canonical_model:
  machine_db: specs/database/organization-settings.yml
  narrative: docs/100-osk-settings-domain-model.md
  api_paths: specs/api/paths/auth-organization.yaml
  rule: each_visible_field_has_exactly_one_canonical_domain_owner

primary_action:
  label: Zapisz
  action: update_osk_account_settings
  semantics: provider_neutral_atomic_user_organization_address_settings_save
  optimistic_concurrency: organization_settings.version
  PKK_configuration_required: false
  pkk_field_mutation: dedicated_PKK_integration_command_only
  email_mutation: dedicated_identity_email_change_flow_only

sections:
  - id: basic_data
    label: Dane podstawowe
    fields:
      - {name: first_name, label: Imię, domain: user, canonical: users.first_name}
      - {name: last_name, label: Nazwisko, domain: user, canonical: users.last_name}
      - {name: email, label: Email, domain: user, canonical: auth_login_identifiers.primary_current_email, mutation: dedicated_identity_email_change_flow_not_provider_neutral_settings_PATCH}

  - id: company_data
    label: Dane firmy
    fields:
      - {name: company_name, label: Nazwa firmy, domain: organization, canonical: organizations.name}
      - {name: street, label: Ulica, domain: organization_address, canonical: organization_contact_addresses.street}
      - {name: house_number, label: Nr domu, domain: organization_address, canonical: organization_contact_addresses.house_number}
      - {name: unit_number, label: Nr lokalu, domain: organization_address, canonical: organization_contact_addresses.unit_number}
      - {name: city, label: Miejscowość, domain: organization_address, canonical: organization_contact_addresses.city_name}
      - {name: postal_code, label: Kod pocztowy, domain: organization_address, canonical: organization_contact_addresses.postal_code}
      - {name: phone, label: Telefon, domain: organization, canonical: organizations.phone}
    explicitly_not_observed:
      - nip
      - billing_data
    important_model_rule: company_address_is_not_a_training_location

  - id: pkk_api_data
    label: Dane API PKK
    integration_optional: true
    data_source: /organization/integrations/pkk
    mutation_endpoint_scope: dedicated_PKK_integration_only
    runtime_status: FROZEN_UNTIL_EXPLICIT_UNFREEZE
    ordinary_service_operation_dependency: none
    audit_required: true
    fields:
      - {name: school_name, label: Nazwa szkoły, domain: pkk_integration_settings, canonical: pkk_integration_settings.school_name}
      - {name: osk_registry_number, label: Numer ewidencyjny OSK, domain: pkk_integration_settings, canonical: pkk_integration_settings.osk_registry_number}
      - name: external_osk_login
        label: Login OSK
        domain: pkk_integration_settings
        canonical: pkk_integration_settings.external_osk_login_ciphertext
        semantics: external_pkk_integration_identifier_not_application_login
        help_text_semantics: login przekazany przez starostę/wydział komunikacji i znajdujący się na zaświadczeniu rejestracyjnym OSK
        security: encrypted_at_rest_redacted_in_audit

  - id: terms
    label: Regulamin
    actions:
      - label: Zobacz mój regulamin
        route_pattern: /regulamin?v=<regulation_version>
        semantics: open_versioned_terms_associated_with_account
        canonical: terms_acceptances_join_legal_documents

pkk_configuration_gate_relation:
  confirmed: true
  screen_spec: specs/screens/pkk-configuration-gate.yml
  doc: docs/37-pkk-configuration-gate.md
  message_on_gate_confirms_editable_later_in_settings: true
  shared_fields:
    pkk_integration_settings:
      - school_name
      - osk_registry_number
      - external_osk_login
    user_basic_data:
      - first_name
      - last_name
  requirement: single_source_of_truth_no_duplicate_unsynchronized_configuration
  note: all_five_fields_are_required_by_visible_marker_on_the_configuration_gate_but_requiredness_on_the_general_settings_screen_remains_separately_unverified

not_observed_on_screen:
  - password_change
  - session_management
  - mfa
  - notification_settings
  - marketing_consents
  - roles_management

unknowns:
  - required_vs_optional_fields_on_general_settings_screen
  - exact_validation_messages
  - success_message
  - failure_message
  - whether_email_change_requires_reverification
  - whether_pkk_changes_require_reauthentication
  - whether_pkk_changes_run_connection_verification

implementation_requirements:
  - ordinary_settings_must_work_without_PKK_configuration
  - provider_neutral_settings_GET_must_not_read_PKK_tables
  - provider_neutral_settings_save_must_not_create_or_mutate_PKK_configuration
  - email_change_must_not_be_invented_before_identity_email_change_authority
  - tenant_isolation
  - atomic_save_across_user_organization_address_and_pkk_records
  - optimistic_concurrency_using_organization_settings_version
  - audit_pkk_settings_changes_without_full_external_login
  - keep_external_osk_login_separate_from_application_identity
  - persist_terms_acceptance_version_and_history
  - do_not_assume_nip_is_editable_here
  - reuse_same_user_and_pkk_configuration_records_in_settings_and_pkk_onboarding_gate
  - reject_unknown_mass_assignment_fields
  - do_not_store_company_address_in_locations_table


