meta:
  screen: staff_detail
  route_pattern: /pracownicy/{staff_uuid}
  confidence: USER_CONFIRMED_AUTH_SCREEN
  audited_at: 2026-09-05

layout:
  breadcrumb: [Panel główny, Pracownicy, staff_name]
  sections:
    - staff_details
    - panel_access
    - embedded_calendar

header:
  confirmed_elements:
    - back_to_staff_list
    - staff_photo
    - staff_full_name
  visible_actions:
    - archive_staff
    - delete_staff
  archive_delete_effects_verified: false

staff_details:
  confirmed_action: edit_staff_details
  action_state: ACTIONABLE
  data_fields:
    - full_name
    - staff_types
    - email
    - phone
    - pesel
    - authorization_number
    - categories
    - created_date
  confirmed_staff_type_values:
    - OfficeWorker
  localized_staff_type_observations:
    OfficeWorker: Pracownik biurowy
  validity_fields:
    - card_valid_until
    - medical_exam_valid_until
    - psychological_exam_valid_until
  expired_indicator: true

panel_access:
  visible_control: edit_panel_access
  control_state: VISIBLE_BUT_NOT_ACTIONABLE
  failure_observation: clicking_did_not_open_view_or_form
  reason: UNKNOWN
  possible_but_unconfirmed_causes:
    - demo_mode_restriction
    - permission_restriction
    - unavailable_for_staff_without_account
    - frontend_issue
  confirmed_field:
    key: has_panel_access
    observed_value: false
  domain_rule: staff_profile_separate_from_user_account
  independently_confirmed_account_entry_point:
    source: staff_create_and_edit_forms
    control: create_login_account
    actionable: true
  unresolved:
    - whether_separate_panel_access_editor_exists_in_other_state
    - account_provisioning_flow
    - credentials_or_invitation
    - role_and_permission_assignment
    - access_revocation
    - password_reset

embedded_calendar:
  confirmed_actions:
    - open_full_calendar
    - add_event
    - previous_period
    - next_period
    - today
    - view_month
    - view_week
    - view_day
  confirmed_views:
    - month
    - week
    - day
  observed_active_view: month
  full_calendar_route: /kalendarz
  unresolved:
    - whether_full_calendar_preserves_staff_filter
    - whether_add_event_prefills_staff
    - event_form_fields
    - conflict_behavior

relationships_confirmed:
  - staff_many_to_many_staff_types
  - staff_many_to_many_categories
  - staff_many_to_many_locations
  - staff_has_many_validity_records
  - staff_optional_panel_account
  - staff_calendar_context

archive_delete:
  archive_visible: true
  delete_visible: true
  unresolved:
    - archive_confirmation
    - archive_effect_on_future_events
    - delete_confirmation
    - delete_semantics_hard_vs_soft
    - delete_dependency_rules

remaining_gaps:
  - exact_staff_type_dictionary
  - account_provisioning_flow_after_create_login_account
  - whether_panel_access_edit_is_actionable_outside_observed_state
  - account_permissions
  - archive_lifecycle
  - delete_lifecycle
  - add_event_form
  - backend_validations
  - success_error_messages
