  audited_at: 2026-09-05

layout:
  breadcrumb: [Panel główny, Pracownicy, staff_name]
  sections:
    - staff_details
    - panel_access
    - embedded_calendar

header:
  confirmed_elements:
    - back_to_staff_list
    - staff_photo
    - staff_full_name
  confirmed_actions:
    - archive_staff
    - delete_staff

staff_details:
  confirmed_action: edit_staff_details
  data_fields:
    - full_name
    - staff_types
    - email
    - phone
    - pesel
    - authorization_number
    - categories
    - created_date
  confirmed_staff_type_values:
    - OfficeWorker
  validity_fields:
