document:
  id: student_access_credentials_pdf
  scope: admin_osk
  source_action: download_student_access_credentials
  source_route_pattern: /licencje/pobierz?guid=<student_id>
  format: pdf
  observed_pages: 1
  confidence: USER_CONFIRMED_DOWNLOADED_DOCUMENT
  verified_at: 2026-09-05
  doc: docs/43-student-access-credentials-pdf.md
  own_product_policy: docs/44-own-student-access-document-policy.md

language_behavior:
  observed_learning_access_language: EN
  observed_document_language: EN
  observed_login_host_pattern: en.prawo-jazdy-360.pl
  localized_by_learning_access_language: SUPPORTED_BY_OBSERVATION
  localization_anomaly_observed:
    password_state_text_mixed_language: true
    observed_text: Hasło ustawione przez użytkownika
    parity_requirement: false

competitor_observation:
  credential_section:
    fields:
      - learning_identifier_login
      - password_state_or_password_instruction
      - login_website
    observed_existing_account_password_behavior:
      disclose_existing_password: false
      rendered_state_text: user_has_set_password
    fresh_access_initial_password_behavior: TO_VERIFY
  login_instructions:
    steps_observed:
      - open_login_page
      - enter_login_and_password
      - accept_terms_and_change_password
      - if_not_active_click_activate_course
      - access_becomes_active
  activation_semantics:
    assignment_is_not_activation: true
    explicit_learner_activation_step_confirmed: true
    trigger_ui_semantics: learner_clicks_activate_course_after_login
    exact_validity_clock_start: TO_VERIFY
    reversible_after_activation: TO_VERIFY
  marketing_section:
    present: true
    functional_requirement: false
    observed_topics:
      - driving_license_tests
      - question_database
      - electronic_student_manual
      - online_lectures
  explicitly_not_observed:
    - qr_code
    - osk_address_data
    - pkk_number
    - driving_category
    - license_number
    - license_end_date
    - existing_plaintext_password
    - administrator_signature

own_product_behavior:
  supported_modes:
    - osk_managed_credentials
    - learner_self_service
  default_recommended_for_office_workflow: osk_managed_credentials
  osk_managed_credentials:
    staff_can_set_initial_password: true
    staff_can_generate_initial_password: true
    staff_can_show_password_before_save: true
    printable_plaintext_initial_or_reset_password: true
    force_change_on_first_login_default: false
    staff_can_activate_license_for_student: true
    learner_can_receive_already_active_account: true
    pdf_fields:
      - student_full_name
      - learning_identifier_login_or_email
      - plaintext_initial_or_reset_password
      - login_url
      - qr_login_url
      - active_or_not_active_state
      - short_login_instruction
  password_storage:
    store_plaintext_or_recoverable_password: false
    store_secure_hash_only_after_save: true
    old_password_retrieval_supported: false
    reprint_with_visible_password_requires_password_reset: true
  password_reset_and_reprint:
    combined_action_recommended: generate_new_password_and_download_credentials
    audit_required: true
  qr_rules:
    may_prefill_login: true
    contain_plaintext_password: false
  activation_by_staff:
    explicit_action: activate_student_license_now
    show_validity_start_before_confirmation: true
    record_activated_at: true
    record_activated_by_user: true
    audit_required: true
  permissions:
    - student_access.manage_credentials
    - student_access.reset_password
    - student_license.activate
    - student_access.download_credentials_pdf

own_product_requirements:
  - server_generated_pdf
  - tenant_isolation
  - authorize_document_download
  - audit_document_download
  - full_document_localization
  - allow_plaintext_password_only_at_creation_or_reset_handoff_time
  - never_store_recoverable_existing_user_password_for_reprint
  - optional_qr_to_safe_login_url_without_password
  - learning_access_separate_from_license_assignment
  - license_assignment_separate_from_license_activation
  - support_staff_activation_of_license
  - support_student_receiving_already_active_account

confirmed_competitor_actions:
  - download_student_access_credentials_pdf
  - render_learning_identifier
  - render_login_website
  - render_password_state_or_instruction
  - render_login_instructions
  - render_activation_instruction

own_product_actions:
  - set_student_initial_password
  - generate_student_initial_password
  - toggle_password_visibility_before_save
  - activate_student_license_now
  - download_credentials_pdf_with_initial_or_reset_password
  - reset_student_password
  - generate_new_password_and_download_credentials

remaining_competitor_gaps:
  - fresh_access_initial_password_or_invitation_document_behavior
  - exact_license_validity_start_timestamp
  - active_license_document_variant
  - expired_license_document_variant
  - document_regeneration_behavior
  - download_success_error_messages
