meta:
  screen: student_detail
  route_pattern: /kursanci/{student_id}
  confidence: USER_CONFIRMED_AUTH_SCREEN
  audited_at: 2026-09-05
  doc: docs/30-student-detail-screen.md
  progress_screen_spec: specs/screens/student-progress.yml
  internal_exam_screen_spec: specs/screens/student-internal-exam.yml
  add_course_screen_spec: specs/screens/student-add-course.yml

header:
  confirmed_elements:
    - back_to_students
    - student_full_name
  confirmed_global_actions:
    - archive_student
    - delete_student

tabs:
  - student_profile
  - internal_exam
  - progress
  verified_tabs:
    - student_profile
    - internal_exam
    - progress

training_stage:
  course_required_before_change: true
  confirmed_message_semantics: add_course_before_editing_training_stage
  confirmed_action: add_student_course
  stages:
    - unassigned
    - theory
    - practice
    - documentation
    - word_exam
    - supplementary_training
    - training_completed
  observed_stage: unassigned
  transition_rules: TO_VERIFY
  history_required_for_own_product: true

student_details:
  confirmed_action: edit_student_details
  fields:
    - full_name
    - birth_date
    - pesel
    - contact_email
    - phone
    - created_date
  location:
    field_present: true
    observed_empty_state: no_location_assigned
    multiplicity: TO_VERIFY
  internal_exam_projection:
    observed_status: not_conducted
    confirmed_action: conduct_internal_exam

access:
  fields:
    - learning_username
    - language_code
  confirmed_action:
    id: download_student_access_credentials
    route_pattern: /licencje/pobierz?guid=<student_id>
  downloaded_artifact_format: TO_VERIFY

licenses:
  confirmed_action: assign_student_license
  visible_headers:
    - added_date
    - ending
    - status
  observed_values:
    language_codes:
      - EN
    statuses:
      - not_activated
  row_actions:
    - delete_unactivated_license
  presentation_ambiguity:
    description: value EN is visible but its exact column/header mapping is unclear in the observed UI
    status: TO_VERIFY
  confirmed_semantics:
    - license_has_language
    - license_has_activation_status
    - unactivated_license_has_delete_action
  to_verify:
    - restore_to_inventory_after_delete
    - duration
    - active_status
    - expired_status
    - ending_date_semantics

courses_pkk:
  confirmed_action: add_student_course
  add_course_form_verified: true
  add_course_screen_spec: specs/screens/student-add-course.yml
  observed_empty_state: no_courses_assigned
  collection: true
  confirmed_create_fields:
    - training_type
    - category
    - pkk
    - starts_at_date_and_time
    - cost
    - theory_hours
    - theory_hours_external_school
    - practice_hours
    - practice_hours_external_school
    - instructor_id
    - location_id
  required_by_visible_create_marker:
    - training_type
    - category
    - pkk
    - starts_at
    - practice_hours
    - instructor_id
  confirmed_training_types:
    - basic_training
    - supplementary_training
  confirmed_category_options_observed:
    - A
    - B
    - C
    - D
    - T
    - A1
    - B1
    - C1
    - D1
    - AM
    - A2
    - B+E
    - C1+E
    - C+E
    - D1+E
    - D+E
    - PT
  confirmed_semantics:
    - single_category_per_course
    - searchable_instructor_selector
    - optional_location_selector
    - separate_theory_and_practice_hours
    - separate_external_school_theory_and_practice_hours

payments:
  confirmed_action: add_student_payment
  columns:
    - title
    - amount
    - remaining
    - payments
    - added_date
  observed_empty_state: no_payments
  confirmed_summary: total_balance
  domain_separation:
    student_finance_is_separate_from_osk_purchase_history: true

progress_tab:
  verified: true
  screen_spec: specs/screens/student-progress.yml
  confirmed_high_level_capabilities:
    - learning_account_selector
    - category_selector
    - test_stats
    - question_stats
    - handbook_progress
    - lecture_progress
    - basic_question_topic_breakdown
    - specialized_question_topic_breakdown

internal_exam_tab:
  verified: true
  screen_spec: specs/screens/student-internal-exam.yml
  confirmed_high_level_capabilities:
    - last_exam_projection
    - start_exam
    - pass_rate
    - passed_exam_count
    - failed_exam_count
    - attempt_history
  history_columns:
    - date_time
    - category
    - status
  observed_empty_state: no_exam_conducted

confirmed_actions:
  - back_to_students
  - archive_student
  - delete_student
  - open_student_profile_tab
  - open_internal_exam_tab
  - open_progress_tab
  - add_student_course
  - edit_student_details
  - conduct_internal_exam
  - start_student_internal_exam
  - download_student_access_credentials
  - assign_student_license
  - delete_unactivated_student_license
  - add_student_payment

entity_model:
  separate_entities:
    - students
    - student_learning_accounts
    - student_licenses
    - student_courses_or_enrollments
    - pkk_profiles_and_operations
    - internal_exam_attempts
    - student_charges_and_payments
    - locations
  do_not_use_single_student_status: true
  do_not_use_single_exam_boolean: true
  course_model_notes:
    - course_has_own_training_type_category_pkk_and_start
    - course_has_instructor
    - course_can_have_location
    - course_distinguishes_theory_and_practice_hours
    - course_distinguishes_external_school_hours

security_requirements:
  - tenant_isolation
  - protect_pesel
  - protect_learning_credentials
  - protect_pkk_reference
  - authorize_license_actions_by_organization
  - authorize_payment_actions_by_organization
  - authorize_internal_exam_actions_by_organization
  - authorize_course_student_instructor_and_location_by_organization
  - audit_training_stage_changes
  - audit_credential_downloads
  - audit_internal_exam_start_and_result

remaining_gaps:
  - student_edit_form
  - add_student_manual_form
  - add_student_from_pkk_flow
  - exact_training_stage_transition_behavior
  - conduct_internal_exam_flow_after_start
  - populated_internal_exam_history_and_results
  - assign_license_form
  - license_delete_effect_and_inventory_restore
  - access_download_format
  - add_payment_form
  - partial_payment_behavior
  - archive_lifecycle
  - delete_lifecycle
  - add_course_exact_backend_validations
  - add_course_cost_to_payment_behavior
  - add_course_post_save_state
  - validations
  - success_error_messages
