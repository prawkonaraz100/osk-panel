screen:
  id: student_edit
  scope: admin_osk
  parent_route_pattern: /kursanci/<student_id>
  entry_action: edit_student_details
  title: Edycja kursanta
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/42-student-edit-form.md

fields:
  - name: first_name
    label: Imię
    required_by_visible_marker: true
  - name: last_name
    label: Nazwisko
    required_by_visible_marker: true
  - name: phone
    label: Telefon
    required_by_visible_marker: false
  - name: contact_email
    label: Email do kontaktu
    required_by_visible_marker: false
  - name: pesel
    label: Pesel
    required_by_visible_marker: false
    nullable: true
  - name: no_pesel_declared
    label: Kursant nie posiada numeru PESEL
    control: checkbox_or_toggle
  - name: birth_date
    label: Data urodzenia
    control: date
    conditional_visibility_or_requirement: no_pesel_declared_true
    required_when: no_pesel_declared_true
  - name: location_id
    label: Lokalizacja
    control: single_select
    required_by_visible_marker: false

conditional_rules:
  has_pesel:
    when: no_pesel_declared_false
    pesel_expected: true
    manual_birth_date_required: false
    exact_birth_date_source: TO_VERIFY
  no_pesel:
    when: no_pesel_declared_true
    pesel: null
    birth_date_required: true

primary_action:
  label: Zapisz kursanta
  action: save_student_changes

close_control:
  label: X
  action: close_student_edit_drawer

explicitly_not_observed:
  - cancel_button
  - pkk_field
  - course_fields
  - training_stage
  - learning_identifier
  - learning_language
  - license_fields
  - internal_exam_fields
  - payment_fields

confirmed_model_behavior:
  student_profile_edit_is_separate_from_course_management: true
  student_profile_edit_is_separate_from_pkk_management: true
  student_profile_edit_is_separate_from_learning_access: true
  student_profile_edit_is_separate_from_license_management: true
  student_profile_edit_is_separate_from_internal_exam: true
  contact_email_separate_from_learning_identifier: true
  student_without_pesel_supported: true
  birth_date_required_for_student_without_pesel: true
  location_is_single_select: true
  birth_date_visible_on_detail: true
  birth_date_manual_entry_is_conditional: true

confirmed_actions:
  - open_student_edit_drawer
  - set_student_first_name
  - set_student_last_name
  - set_student_phone
  - set_student_contact_email
  - set_student_pesel
  - toggle_student_no_pesel
  - set_student_birth_date_when_no_pesel
  - select_student_location
  - save_student_changes
  - close_student_edit_drawer

security_requirements:
  - tenant_isolation
  - authorize_student_by_organization
  - validate_location_by_organization
  - protect_pesel
  - validate_identity_branch_pesel_or_no_pesel_with_birth_date
  - audit_identity_changes
  - keep_contact_email_separate_from_learning_identity
  - profile_endpoint_must_not_mutate_course_pkk_license_or_exam

remaining_gaps:
  - phone_validation
  - contact_email_validation
  - pesel_validation
  - exact_birth_date_source_when_pesel_present
  - pesel_to_no_pesel_transition_behavior
  - no_pesel_to_pesel_transition_behavior
  - duplicate_student_detection
  - location_change_side_effects
  - unsaved_changes_close_behavior
  - success_error_messages
