  tab: progress
  title: Postępy kursanta
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/31-student-progress-screen.md

context_selectors:
  learning_account:
    confirmed: true
    visible_parts:
      - username
      - language_code
    observed_language_code: EN
  category:
    confirmed: true
    observed_selected: B
    observed_options:
      - A
      - B
      - C
      - D
      - T
      - A1
      - B1
      - C1
      - D1
      - AM
      - A2
    exhaustive_dictionary: false

