    - passed_tests_percent
    - failed_tests_count
    - failed_tests_percent
  questions:
    - answered_count
    - available_count
    - correct_percent
    - incorrect_percent
  observed_question_total_for_selected_context: 2185
  hardcode_total: false

analysis_sections:
  questions:
    description_semantics:
