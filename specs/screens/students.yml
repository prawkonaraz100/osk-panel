screen:
  id: students
  scope: admin_osk
  route: /kursanci
  title: Kursanci
  confidence: USER_CONFIRMED_AUTH_SCREEN
  status: READY_FOR_IMPLEMENTATION
  verified_at: 2026-09-05
  list_doc: docs/29-students-list-screen.md

source_specs:
  create: specs/screens/student-create.yml
  detail: specs/screens/student-detail.yml
  edit: specs/screens/student-edit.yml
  preview: specs/screens/student-preview.yml
  filters: specs/screens/student-filters.yml
  sorting: specs/screens/student-sorting.yml
  progress: specs/screens/student-progress.yml
  internal_exam: specs/screens/student-internal-exam.yml
  internal_exam_access: specs/screens/student-internal-exam-access.yml
  add_course: specs/screens/student-add-course.yml
  assign_license: specs/screens/student-assign-license.yml
  license_delete: specs/screens/student-license-delete.yml
  payment_charge: specs/screens/student-payment-charge.yml
  access_credentials_pdf: specs/screens/student-access-credentials-pdf.yml
  pkk_configuration_gate: specs/screens/pkk-configuration-gate.yml

canonical_model:
  student_entity: Student
  learning_account_entity: StudentLearningAccount
  formal_course_entity: CourseEnrollment
  student_finance_entities:
    - StudentCharge
    - StudentPayment
  rules:
    - student_profile_separate_from_learning_account
    - student_finance_separate_from_platform_purchase_history
    - course_enrollment_separate_from_license_and_exam_status
    - pkk_operational_context_belongs_to_course_enrollment

header:
  title: Twoi kursanci
  confirmed_elements:
    - result_count
    - add_student_from_pkk
    - add_student_manual
  result_count_pattern: "Wyszukano <N> kursantów"

list:
  search:
    confirmed: true
    placeholder: "Szukaj kursanta..."
  columns:
    - full_name
    - learning_login_data
    - courses
    - phone
    - created_date
    - internal_exam
    - row_actions
  row_actions:
    preview_student:
      label: Podgląd
      behavior: read_only_side_drawer
      source_spec: specs/screens/student-preview.yml
    open_student_details:
      label: Przejdź do
      route_pattern: /kursanci/<student_id>

preview:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  mode: read_only
  presentation: side_drawer
  fields:
    - full_name
    - birth_date
    - pesel
    - contact_email
    - phone
    - created_date
    - courses_summary
    - payments_summary
  mutations_present: false

filters:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  source_spec: specs/screens/student-filters.yml
  confirmed:
    course_category_ids:
      control: multi_select
    training_stage_ids:
      control: checkbox_group
      options:
        - unassigned
        - theory
        - practice
        - documentation
        - word_exam
        - supplementary_training
        - training_completed
    internal_exam_not_passed:
      control: switch
    include_archived:
      control: switch
      default_observed: false
  implementation:
    server_side: true
    composable: true
    tenant_scoped: true

sorting:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  source_spec: specs/screens/student-sorting.yml
  directions:
    - asc
    - desc
  fields:
    - full_name
    - learning_identifier
    - phone
    - created_at
    - internal_exam
  implementation:
    server_side_whitelist: true
    stable_tiebreaker_required: true

create_manual:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  source_spec: specs/screens/student-create.yml
  profile_fields:
    - first_name
    - last_name
    - phone
    - contact_email
    - pesel
    - no_pesel
  required_visible:
    - first_name
    - last_name
  student_without_pesel_supported: true
  optional_course_pkk:
    confirmed: true
    fields:
      - pkk_reference
      - category_id
  location_select:
    confirmed: true
    required: false
  optional_license_assignment:
    confirmed: true
    fields:
      - license_product_or_duration
      - learning_identifier
      - language_code
    inventory_count_visible: true
  orchestration:
    create_student_with_optional_course_and_license: true
    transactional_consistency_required: true

create_from_pkk:
  entry_confirmed: true
  configuration_gate_confirmed: true
  configuration_gate_spec: specs/screens/pkk-configuration-gate.yml
  gate_fields:
    - pkk_school_name
    - pkk_osk_registry_number
    - pkk_external_osk_login
    - user_first_name
    - user_last_name
  post_configuration_competitor_flow: UNOBSERVABLE_OR_NOT_YET_CAPTURED_NONBLOCKING
  own_product_rule:
    - create_persistent_student
    - create_or_attach_course_enrollment
    - perform_pkk_operation_in_course_context

edit_profile:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  source_spec: specs/screens/student-edit.yml
  fields:
    - first_name
    - last_name
    - phone
    - contact_email
    - pesel
    - no_pesel_declared
    - birth_date_when_no_pesel
    - location_id
  rules:
    - profile_edit_does_not_mutate_course_pkk_license_exam
    - contact_email_separate_from_learning_identifier
    - birth_date_required_when_no_pesel

training_stage:
  confirmed_stages:
    - unassigned
    - theory
    - practice
    - documentation
    - word_exam
    - supplementary_training
    - training_completed
  course_required_before_stage_change: true
  backend_transition_policy: OWN_PRODUCT_DECISION_REQUIRED_PER_FORMAL_RULES
  audit_required: true

course_management:
  add_course_form_confirmed: true
  source_spec: specs/screens/student-add-course.yml
  separate_create_edit_delete_specs:
    - specs/screens/course-create.yml
    - specs/screens/course-edit.yml
    - specs/screens/course-delete.yml
  canonical_entity: CourseEnrollment
  current_osk_hours_source_of_truth: training_session_and_hour_ledger
  external_hours_source_of_truth: recognized_external_training

learning_access:
  detail_projection_confirmed:
    - learning_identifier
    - language_code
  downloadable_credentials_confirmed: true
  pdf_spec: specs/screens/student-access-credentials-pdf.yml
  own_product_policy: docs/44-own-student-access-document-policy.md
  own_product_rules:
    - staff_can_set_or_generate_initial_password_with_permission
    - plaintext_available_only_at_create_or_reset_handoff
    - old_password_not_recoverable
    - reprint_with_plaintext_requires_password_reset
    - QR_must_not_contain_plaintext_password

licenses:
  detail_section_confirmed: true
  assign_form_confirmed: true
  assign_spec: specs/screens/student-assign-license.yml
  delete_unactivated_confirmation_confirmed: true
  delete_spec: specs/screens/student-license-delete.yml
  observed_statuses:
    - not_activated
  own_product_invariants:
    - learning_account_separate_from_license_assignment
    - revoke_before_activation_restores_exactly_one_inventory_entry_atomically
    - activated_assignment_cannot_use_unactivated_revoke_flow

student_finance:
  detail_table_confirmed: true
  columns:
    - title
    - amount
    - remaining
    - payments
    - added_date
  summary:
    - total_balance
  create_visible_action:
    label: Dodaj płatność
    observed_form_fields:
      - title
      - amount
  competitor_exact_charge_vs_payment_semantics: COMPETITOR_UNVERIFIED_NONBLOCKING
  own_product_model:
    spec: specs/design/student-finance-ledger.yml
    separate_charge_from_payment: true
    installment_payments_supported: true
    balance_is_projection: true
    corrections_use_reversal: true

progress:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  source_spec: specs/screens/student-progress.yml
  context_selectors:
    - learning_account_with_language
    - category
  metrics:
    - passed_tests_count_and_percent
    - failed_tests_count_and_percent
    - answered_questions_count_over_total
    - correct_answers_percent
    - incorrect_answers_percent
    - handbook_progress
    - handbook_completed_sections
    - handbook_control_questions_percent
    - lecture_progress
    - lecture_completed_units_counter
    - lecture_control_questions_percent
    - question_progress_by_basic_topic
    - question_progress_by_specialized_topic
  dynamic_totals_required: true
  content_taxonomy_translation_required: true

internal_exam:
  confidence: USER_CONFIRMED_AUTH_SCREEN
  student_tab_spec: specs/screens/student-internal-exam.yml
  access_spec: specs/screens/student-internal-exam-access.yml
  confirmed:
    - empty_last_exam_state
    - pass_rate_percent
    - passed_exam_count
    - failed_exam_count
    - multi_attempt_history
    - category_and_language_selection
    - candidate_data_edit
    - remote_link
    - local_workstation
  canonical_model:
    formal_exam_requires_student: true
    formal_exam_requires_course_enrollment: true
    lifecycle_policy: specs/design/internal-exam-lifecycle.yml
    inventory_consumed_on_start: true

confirmed_actions:
  - add_student_from_pkk
  - add_student_manual
  - search_students
  - open_student_filters
  - apply_student_filters
  - open_student_sort
  - apply_student_sort
  - open_student_quick_preview
  - open_student_details
  - edit_student_details
  - archive_student
  - delete_student_visible_action
  - add_student_course
  - manage_training_stage
  - download_student_access_credentials
  - assign_student_license
  - delete_unactivated_student_license
  - add_student_payment_or_charge_visible_action
  - open_progress_tab
  - open_internal_exam_tab
  - start_student_internal_exam

security_requirements:
  - tenant_isolation
  - authorize_student_by_organization
  - tenant_scope_search_filter_sort
  - protect_pesel
  - protect_learning_credentials
  - validate_related_course_location_license_exam_resources_by_organization
  - audit_identity_changes
  - audit_training_stage_changes
  - audit_credential_handoffs
  - audit_license_assignment_activation_revoke
  - audit_student_finance_mutations
  - authorize_progress_context_by_student_and_organization
  - authorize_internal_exam_by_student_course_and_organization

remaining_real_gaps:
  competitor_nonblocking:
    - exact_add_student_from_pkk_post_configuration_UI
    - exact_internal_exam_red_x_list_semantics
    - exact_competitor_student_finance_installment_and_correction_UI
    - exact_competitor_password_or_invitation_behavior_for_fresh_access
    - exact_competitor_license_validity_start_timestamp
  own_product_decisions_or_validations:
    - duplicate_student_detection_policy
    - pesel_phone_email_validation_rules
    - training_stage_transition_rules
    - manual_create_partial_course_validation
    - exact_progress_percentage_formulas
    - progress_activity_history_and_learning_time_scope
    - pagination_strategy_and_defaults
    - archive_student_dependency_resolution
    - success_error_message_copy
