  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  doc: docs/29-students-list-screen.md
  detail_screen_spec: specs/screens/student-detail.yml
  detail_doc: docs/30-student-detail-screen.md
  progress_screen_spec: specs/screens/student-progress.yml
  progress_doc: docs/31-student-progress-screen.md

header:
  title: Twoi kursanci
  confirmed_elements:
    - result_count
    - add_student_from_pkk
    - add_student_manual

result_count:
  pattern: "Wyszukano <N> kursantów"

controls:
  search:
    confirmed: true
    placeholder: "Szukaj kursanta..."
  filter:
    confirmed: true
    label: Filtruj
    options: TO_VERIFY
  sort:
    confirmed: true
    label: Sortuj
    options: TO_VERIFY

list:
  columns:
    - full_name
    - learning_login_data
    - courses
    - phone
    - created_date
    - internal_exam
    - row_actions

learning_login_data:
  confirmed_parts:
    - language_indicator
    - username_or_login
  observed_language_codes:
    - PL
    - EN
    - UK
  confirmed_by_detail_screen:
    - learning_username
    - language_code
    - downloadable_access_credentials
  not_confirmed:
    - password_on_screen
    - account_email
    - password_reset
    - language_edit_from_list

courses_column:
  observed_course_card_fields:
    - category
    - training_type
    - pkk_reference
    - last_pkk_operation
  observed_values:
    training_type:
      - Teoria
    last_pkk_operation:
      - Brak operacji
  detail_screen_confirms_collection: true
  note: detail screen contains section Kursy (PKK) and action Dodaj kurs

internal_exam_column:
  confirmed: true
  observed_presentations:
    - dash
    - red_x_visual_indicator
  red_x_semantics: TO_VERIFY
  detail_screen_confirmed_statuses:
    - not_conducted
  detail_screen_confirmed_action:
    - conduct_internal_exam
  do_not_assume_red_x_means:
    - failed_exam
    - missing_exam
    - unavailable_exam
    - not_started_exam

row_actions:
  - action: preview_student
    label: Podgląd
    behavior: TO_VERIFY
  - action: open_student_details
    label: Przejdź do
    route_pattern: /kursanci/<student_id>

create_flows:
  - id: add_student_from_pkk
    confirmed_entry: true
    form: TO_VERIFY
  - id: add_student_manual
    confirmed_entry: true
    form: TO_VERIFY

