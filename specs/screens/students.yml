  - action: open_student_details
    label: Przejdź do
    route_pattern: /kursanci/<student_id>

create_flows:
  - id: add_student_from_pkk
    confirmed_entry: true
    first_observed_step:
      condition: pkk_configuration_incomplete
      screen: pkk_configuration_gate
      screen_spec: specs/screens/pkk-configuration-gate.yml
      required_fields_by_visible_marker:
        - pkk_school_name
        - pkk_osk_registry_number
        - pkk_external_osk_login
        - user_first_name
        - user_last_name
      primary_action: save_pkk_configuration_and_continue
      settings_reuse_confirmed: true
    post_configuration_flow: TO_VERIFY
  - id: add_student_manual
    confirmed_entry: true
    form: USER_CONFIRMED_AUTH_SCREEN
    screen_spec: specs/screens/student-create.yml
    confirmed_profile_fields:
      - first_name
      - last_name
      - phone
      - contact_email
      - pesel
      - no_pesel_control
    required_by_visible_marker:
      - first_name
      - last_name
    optional_course_pkk:
      confirmed: true
      fields:
        - pkk_reference
        - category_id
    location_select:
      confirmed: true
      required_by_visible_marker: false
    optional_license_assignment:
      confirmed: true
      visible_inventory_count: true
      fields:
        - license_product_or_duration
        - learning_identifier_email_or_login
        - language_code
      conditional_required_by_visible_marker:
        - learning_identifier_email_or_login
        - language_code
    confirmed_business_rules:
      - student_can_be_created_without_pkk_or_course
      - student_without_pesel_supported
      - contact_email_is_separate_from_learning_login_identifier
      - license_can_be_assigned_during_student_creation
      - license_inventory_is_visible_during_assignment

