    - soft_delete
    - detach_from_organization
    - dependency_blocking
    - auto_archive
    - future_event_handling
    - historical_event_handling
    - success_message
    - error_message
    - restore_capability

our_product_requirements:
  - tenant_isolation
  - dependency_check_before_delete
  - preserve_historical_calendar_events
  - preserve_audit_history
  - explicit_confirmation
  - audit_destructive_operation

acceptance_criteria:
  - id: AC-VEH-DEL-01
    rule: delete_requires_confirmation
  - id: AC-VEH-DEL-02
    rule: confirmation_displays_vehicle_identity
  - id: AC-VEH-DEL-03
    rule: cancel_or_close_does_not_modify_vehicle
  - id: AC-VEH-DEL-04
    rule: confirm_triggers_delete_operation
  - id: AC-VEH-DEL-05
    rule: deletion_checks_vehicle_belongs_to_current_osk
  - id: AC-VEH-DEL-06
    rule: historical_integrity_must_be_preserved_in_our_implementation
