meta:
  screen: vehicle_delete_confirmation
  scope: admin_osk
  confidence: USER_CONFIRMED_AUTH_SCREEN
  audited_at: 2026-09-05
  source_context: vehicle_detail_delete_action

ui:
  title: Usuwanie pojazdu
  close_control: true
  confirmation_message_semantics: confirm_removal_from_organization
  identity_fields:
    - registration_number
    - make_model
    - categories
  observed_label_issue:
    raw: Maria i model
    semantic: Marka i model
    classification: PRESENTATION_TYPO_OR_EXTRACTION_ERROR

confirmed_actions:
  - action: confirm_delete_vehicle
    label: Tak, usuń
  - action: cancel_delete_vehicle
    label: Nie, anuluj
  - action: close_delete_vehicle_modal
    label: X

flow:
  - vehicle_detail
  - click_delete
  - delete_confirmation
  - confirm_or_cancel

behavior_confirmed:
