screen:
  id: vehicles
  scope: admin_osk
  route: /pojazdy
  title: Pojazdy
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  detail_screen_spec: specs/screens/vehicle-detail.yml
  detail_doc: docs/25-vehicle-detail-screen.md

list:
  primary_action:
    label: Dodaj pojazd
    action: create_vehicle
  columns:
    - photo
    - registration_number
    - make_model
    - categories
    - documents
  row_actions:
    - action: open_vehicle_calendar
      label: Kalendarz
      route_pattern: /kalendarz?v=<vehicle_uuid>
    - action: open_vehicle_details
      label: Zobacz
      route_pattern: /pojazdy/<vehicle_uuid>
  ambiguous_text:
    - text: Podgląd
      status: TO_VERIFY_VISUAL
      possibilities: [tooltip, accessible_label, description_of_view_action]

vehicle_entity:
  identifier:
    type: uuid
    reused_in:
      - details_route
      - calendar_filter
      - image_asset_path
    note: exact UUID values from audited account must not be persisted
  confirmed_visible_fields_from_list:
    - photo
    - registration_number
    - make
    - model
    - categories_column
    - document_status
  confirmed_visible_fields_from_detail:
    - make_model
    - registration_number
    - side_number
    - vin
    - engine_capacity_cm3
    - production_year
    - categories
    - created_date

column_notes:
  make_model:
    semantic_field: Marka i model
    previous_text_extraction_typo: Maria i model
    status: SEMANTICS_CONFIRMED_BY_DETAIL_SCREEN
  categories:
    present: true
    multiplicity: TO_VERIFY_FORM
  documents:
    confirmed_message_pattern: "Przegląd wygasł <date>"

documents:
  confirmed_types:
    - technical_inspection
    - oc_insurance
    - ac_insurance
  confirmed_states:
    - expired_or_attention_required
  independent_valid_until: true
  inferred_configurable_states:
    - valid
    - expiring_soon
  reminder_threshold: CONFIGURABLE_TO_VERIFY

detail_screen:
  confirmed_global_actions:
    - archive_vehicle
    - delete_vehicle
  confirmed_section_actions:
    - edit_vehicle_details
  confirmed_calendar_actions:
    - open_full_calendar
    - add_event
    - previous_period
    - next_period
    - today
    - view_month
    - view_week
    - view_day
  created_date_anomaly:
    observed_pattern: 01-01-0001
    classification: SENTINEL_OR_DEMO_DATA_ANOMALY
    parity_requirement: false

relationships:
  confirmed:
    - photo_asset
    - documents_or_validities
    - calendar_filter_context
    - details_screen
    - categories_field_present
  to_verify:
    - location
    - instructors
    - categories_many_to_many
    - service_unavailability

api_recommendation:
  - GET /api/v1/vehicles
  - POST /api/v1/vehicles
  - GET /api/v1/vehicles/{vehicle}
  - PATCH /api/v1/vehicles/{vehicle}
  - POST /api/v1/vehicles/{vehicle}/archive
  - GET /api/v1/vehicles/{vehicle}/documents
  - GET /api/v1/calendar/events?vehicle_id={vehicle}

not_confirmed:
  - create_vehicle_form_fields
  - edit_vehicle_form_fields
  - exact_required_fields
  - exact_validations
  - archive_restore_or_effects
  - delete_semantics
  - filters
  - sorting
  - pagination
  - exact_category_values
  - category_multiplicity
  - exact_photo_rules
  - registration_number_validation
  - vehicle_location_relation
  - add_event_form

security_requirements:
  - tenant_isolation
  - verify_vehicle_ownership_on_details
  - verify_vehicle_ownership_on_calendar_filter
  - preserve_historical_event_integrity_on_archive_delete
  - do_not_treat_min_date_sentinel_as_real_business_date
