screen:
  id: vehicles
  scope: admin_osk
  route: /pojazdy
  title: Pojazdy
  confidence: USER_CONFIRMED_AUTH_SCREEN
  verified_at: 2026-09-05
  detail_screen_spec: specs/screens/vehicle-detail.yml
  edit_screen_spec: specs/screens/vehicle-edit.yml
  detail_doc: docs/25-vehicle-detail-screen.md
  edit_doc: docs/26-vehicle-edit-form.md

list:
  primary_action:
    label: Dodaj pojazd
    action: create_vehicle
  columns:
    - photo
    - registration_number
    - make_model
    - categories
    - documents
  row_actions:
    - action: open_vehicle_calendar
      label: Kalendarz
      route_pattern: /kalendarz?v=<vehicle_uuid>
    - action: open_vehicle_details
      label: Zobacz
      route_pattern: /pojazdy/<vehicle_uuid>
  ambiguous_text:
    - text: Podgląd
      status: TO_VERIFY_VISUAL
      possibilities: [tooltip, accessible_label, description_of_view_action]

vehicle_entity:
  identifier:
    type: uuid
    reused_in:
      - details_route
      - calendar_filter
      - image_asset_path
    note: exact UUID values from audited account must not be persisted
  confirmed_fields:
    - photo
    - registration_number
    - side_number
    - make
    - model
    - production_year
    - engine_capacity_cm3
    - vin
    - category_ids
    - location_ids
    - next_inspection_at
    - oc_valid_until
    - ac_valid_until
    - created_date

edit_form:
  required_by_visible_marker:
    - registration_number
    - make
    - model
  multi_selects:
    - category_ids
    - location_ids
  date_pickers:
    - next_inspection_at
    - oc_valid_until
    - ac_valid_until
  photo_optional: true
  existing_photo_preview: true
  existing_photo_remove_control: true
  actions:
    - save_vehicle_changes
    - cancel_vehicle_edit
    - close_vehicle_edit_drawer

column_notes:
  make_model:
    semantic_field: Marka i model
    previous_text_extraction_typo: Maria i model
    status: SEMANTICS_CONFIRMED_BY_DETAIL_SCREEN
  categories:
    present: true
    multiplicity: MULTI_SELECT_CONFIRMED
  documents:
    confirmed_message_pattern: "Przegląd wygasł <date>"

documents:
  confirmed_types:
    - technical_inspection
    - oc_insurance
    - ac_insurance
  independent_valid_until: true
  confirmed_attention_state: true
  inferred_configurable_states:
    - valid
    - expiring_soon
    - expired
  reminder_threshold: CONFIGURABLE_TO_VERIFY

detail_screen:
  confirmed_global_actions:
    - archive_vehicle
    - delete_vehicle
  confirmed_section_actions:
    - edit_vehicle_details
  confirmed_calendar_actions:
    - open_full_calendar
    - add_event
    - previous_period
    - next_period
    - today
    - view_month
    - view_week
    - view_day
  created_date_anomaly:
    observed_pattern: 01-01-0001
    classification: SENTINEL_OR_DEMO_DATA_ANOMALY
    parity_requirement: false

relationships:
  confirmed:
    - photo_asset
    - documents_or_validities
    - calendar_filter_context
    - details_screen
    - vehicle_many_to_many_categories
    - vehicle_many_to_many_locations
  to_verify:
    - instructors
    - service_unavailability

api_recommendation:
  - GET /api/v1/vehicles
  - POST /api/v1/vehicles
  - GET /api/v1/vehicles/{vehicle}
  - PATCH /api/v1/vehicles/{vehicle}
  - POST /api/v1/vehicles/{vehicle}/archive
  - GET /api/v1/vehicles/{vehicle}/documents
  - GET /api/v1/calendar/events?vehicle_id={vehicle}

not_confirmed:
  - create_vehicle_form_fields_or_exact_parity_with_edit
  - exact_backend_validations
  - archive_restore_or_effects
  - delete_semantics
  - filters
  - search
  - sorting
  - pagination
  - exact_category_dictionary
  - exact_photo_file_rules
  - registration_number_validation
  - vin_validation
  - add_event_form
  - save_success_error_messages

security_requirements:
  - tenant_isolation
  - verify_vehicle_ownership_on_details
  - verify_vehicle_ownership_on_calendar_filter
  - validate_category_ids_belong_to_organization
  - validate_location_ids_belong_to_organization
  - preserve_historical_event_integrity_on_archive_delete
  - do_not_treat_min_date_sentinel_as_real_business_date
