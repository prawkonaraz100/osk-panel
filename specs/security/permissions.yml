    allowed_scopes: [organization]
  own_only:
    allowed_scopes: [own]
  organization_or_own:
    allowed_scopes: [organization, own]
  student_scoped:
    allowed_scopes: [organization, assigned_students]
  student_or_own_scoped:
    allowed_scopes: [organization, assigned_students, own]
  location_scoped:
    allowed_scopes: [organization, assigned_locations]
  calendar_scoped:
    allowed_scopes: [organization, assigned_students, assigned_locations, own]

