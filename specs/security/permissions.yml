scope_materialization_rules:
  physical_catalog_tables:
    - data_scopes
    - permission_scope_options
    - membership_permission_scopes
  expand_scope_profiles_into_permission_scope_options: true
  unsupported_permission_scope_pair: reject
  granted_permission_requires_one_or_more_scope_rows: true
  denied_permission_requires_zero_scope_rows: true
  multiple_scope_rows_for_same_permission: logical_OR
  organization_scope_bypasses_tenant_validation: false
  unknown_scope_resolver: deny_and_configuration_error
  query_enforcement_required_for:
    - list
    - get_by_id
    - search
    - counts
    - exports
    - PDFs
    - bulk_actions

role_templates:
  Owner:
    strategy: all_core_permissions_known_in_this_catalog_version
    scope_strategy:
      organization_when_profile_allows_it: true
      own_when_permission_profile_is_own_only: true
      do_not_add_assigned_scopes_by_default: true
  OfficeAdmin:
    includes_groups:
      - students
      - student_access
      - courses_and_training
      - calendar
      - locations
      - vehicles
      - licenses
      - exams
    conditional:
      - pkk
      - student_finance
      - platform_purchases
    scope_strategy:
      organization_when_profile_allows_it: true
      own_when_permission_profile_is_own_only: true
  HR:
    includes:
      - staff.view
      - staff.edit
      - worktime.view.organization
      - worktime.manage
      - locations.view
    scope_strategy:
      organization_for_all_granted_permissions: true
  Instructor:
    includes:
      - students.view
      - students.progress.view
      - courses.view
      - training_sessions.view
      - training_sessions.create
      - training_sessions.edit
      - calendar.view
      - calendar.manage.own
      - worktime.view.own
      - formal_documents.view
      - formal_documents.download
    conditional:
      - courses.stage.change
      - formal_documents.approve
      - formal_documents.deliver
      - pkk.view
      - pkk.fetch
      - exams.generate
      - exams.start.local
    scope_strategy:
      student_scoped: [assigned_students]
      student_or_own_scoped: [assigned_students, own]
      calendar_scoped: [assigned_students, own]
      own_only: [own]
      organization_only: explicit_grant_requires_explicit_organization_scope
  Lecturer:
    includes:
      - students.view
      - students.progress.view
      - courses.view
      - training_sessions.view
      - calendar.view
      - worktime.view.own
      - formal_documents.view
      - formal_documents.download
    scope_strategy:
      student_scoped: [assigned_students]
      student_or_own_scoped: [assigned_students, own]
      calendar_scoped: [assigned_students, own]
      own_only: [own]
      organization_only: explicit_grant_requires_explicit_organization_scope
  Accounting:
    includes:
      - organization.view
      - student_finance.view
      - student_finance.create_charge
      - student_finance.record_payment
      - purchases.view
      - purchases.create
      - purchases.pay
    conditional:
      - student_finance.reverse_payment
    scope_strategy:
      organization_when_profile_allows_it: true

backend_authorization_order:
  - authenticated_user
  - active_membership
  - tenant_ownership_or_relation_validation
  - authoritative_membership_permission_decision
  - membership_permission_scope_resolution
  - domain_state_rule
  - elevated_reauth_or_mfa_when_configured

scope_resolver_contract:
  assigned_locations:
    fixed_dependency: active_staff_membership_link_to_staff_profile_to_staff_location_assignments
    physical_completion_stage: DB4_3
  assigned_students:
    fixed_dependencies:
      - active_staff_membership_link_to_staff_profile
      - course_enrollment_lead_instructor_relation
      - training_session_instructor_relation
    physical_completion_stages: [DB4_3, DB4_4]
  downstream_rule: >-
    Later DB slices implement foreign keys and permission-specific adapters but
    may not silently redefine the meaning of own, assigned_students,
    assigned_locations or organization without reopening the RBAC gate.

safety_rules:
  last_owner_cannot_be_removed_without_transfer: true
  permission_changes_audited: true
  staff_login_creation_requires_explicit_permissions_or_template: true
  permission_revocation_effect_must_be_defined_for_active_sessions: true
  template_definition_change_must_not_silently_expand_existing_member_privileges: true
  role_template_code_must_not_be_used_as_backend_authorization_shortcut: true
  membership_data_scope_string_must_not_be_used_as_backend_authorization_shortcut: true
  granted_permission_without_scope_must_fail_closed: true
  scope_must_not_expand_beyond_active_tenant: true
