meta:
  project: osk-panel
  scope: core_v1_rbac
  status: ACTIVE
  decided_at: 2026-09-05
  doc: docs/04-roles-permissions.md
  role_template_catalog_version: core-v1-2026-09-05

principles:
  permission_based_rbac: true
  staff_type_equals_permission: false
  role_template_equals_permission_set: true
  role_template_is_runtime_authorization_dependency: false
  role_template_is_assignment_time_preset_and_provenance: true
  membership_permissions_are_authoritative_current_effective_permission_decisions: true
  permission_absence_defaults_to_denied: true
  future_permissions_default_to_denied_for_existing_memberships: true
  backend_enforcement_required: true
  tenant_scope_independent_from_permission: true
  data_scope_supported: true
  data_scope_is_per_permission: true
  one_global_membership_data_scope_is_forbidden: true
  scope_only_restricts_already_granted_permission: true
  missing_scope_for_granted_permission_fails_closed: true
  multiple_scopes_for_same_permission_are_OR: true

permission_materialization:
  source_catalog: this_file
  catalog_version: core-v1-2026-09-05
  on_initial_template_assignment:
    - resolve_template_against_current_permission_catalog
    - materialize_one_membership_permission_decision_for_every_known_core_permission
    - included_permissions_get_granted_true
    - nonincluded_permissions_get_granted_false
    - materialize_template_scope_rows_for_every_granted_permission
    - denied_permissions_have_no_scope_rows
    - persist_role_template_code_and_catalog_version_as_provenance
    - audit_materialized_permission_and_scope_snapshot
  on_template_reapply_or_change:
    - explicit_command_only
    - resolve_selected_template_against_current_catalog
    - replace_current_permission_decisions_for_all_known_core_permissions_atomically
    - replace_current_scope_rows_for_all_known_core_permissions_atomically
    - persist_new_template_code_and_catalog_version_as_provenance
    - audit_before_after_permission_and_scope_snapshot
  on_individual_permission_change:
    - update_authoritative_membership_permission_decision
    - granting_requires_explicit_scope_set_allowed_for_that_permission
    - denying_removes_scope_rows_in_same_transaction
    - role_template_provenance_does_not_override_explicit_current_decision
    - audit_change
  runtime_effective_permission_rule: >-
    Effective permission is read only from the current membership_permissions
    decision for the active OrganizationMembership. role_template_code and
    role_template_catalog_version are provenance/UI metadata and are never
    consulted by backend authorization at request time.
  runtime_scope_rule: >-
    A granted permission is still denied unless at least one materialized
    membership_permission_scope for that permission matches the target through
    its registered resolver. Multiple scope rows are OR-ed only after the target
    has passed same-organization validation.
  missing_permission_row_rule: denied
  missing_scope_row_for_granted_permission_rule: denied
  new_permission_after_membership_creation: denied_until_explicitly_granted_with_scope_or_template_reapplied
  template_definition_change_rule: existing_memberships_do_not_change_automatically

