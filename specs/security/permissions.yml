data_scopes:
  organization:
    semantics: every_target_inside_active_membership_organization_after_tenant_validation
    resolver_base: tenant_resource
  own:
    semantics: target_owned_by_current_user_or_staff_profile_linked_to_active_membership
    resolver_base: permission_target_owner
    missing_owner_relation: deny
  assigned_students:
    semantics: target_resolves_to_student_assigned_to_staff_profile_linked_to_active_membership
    resolver_base: permission_target_assigned_student
    assignment_sources:
      - non_cancelled_course_enrollment_where_lead_instructor_matches_staff_profile
      - non_cancelled_training_session_where_instructor_matches_staff_profile
    missing_active_staff_link: deny_empty_set
  assigned_locations:
    semantics: target_resolves_to_location_in_current_staff_profile_location_assignments
    resolver_base: permission_target_assigned_location
    assignment_source: staff_location_assignments
    missing_active_staff_link: deny_empty_set

scope_profiles:
