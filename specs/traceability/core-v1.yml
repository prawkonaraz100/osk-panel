meta:
  project: osk-panel
  scope: admin_osk_core_v1_cross_layer_traceability
  status: ACTIVE_DOCUMENTATION_GATE
  created_at: 2026-09-05
  implementation_status: NOT_IMPLEMENTED_BY_THIS_DOCUMENTATION_BRANCH
  purpose: >-
    Link preserved clean-room reverse-engineering evidence to required backend
    capabilities, canonical data structures, permissions and mandatory tests.
    This matrix proves coverage between layers; it NEVER replaces detailed
    screen specs, evidence docs or legal/design rules.

sources_of_truth:
  preservation_contract: docs/96-reverse-engineering-preservation-contract.md
  preservation_manifest: specs/reverse-engineering-manifest.yml
  screen_specs: specs/screens/*.yml
  legal_rules: specs/legal/*.yml
  design_rules: specs/design/*.yml
  security: specs/security/permissions.yml
  api_inventory: specs/api/required-operations-v1.yml
  openapi: specs/api/openapi-v1.yaml
  database: specs/database/core-schema.yml
  organization_settings_database: specs/database/organization-settings.yml
  tests: docs/84-test-strategy.md
  baseline: specs/implementation-baseline-v1.yml

global_rules:
  detail_preservation:
    - no_confirmed_field_option_action_filter_sort_toggle_pdf_or_entrypoint_may_be_dropped
    - a_shorter_summary_never_overrides_a_detailed_screen_spec
    - unknown_reference_backend_behavior_must_not_be_invented_as_competitor_fact
    - own_safe_implementation_may_replace_reference_internal_semantics_only_with_equivalent_user_capability
  api:
    - every_http_requirement_has_method_path_and_unique_operationId
    - public_webhook_or_exam_token_security_exceptions_are_explicit
    - tenant_relation_ids_are_authorized_server_side
    - critical_retryable_mutations_use_idempotency
  data:
    - no_hard_delete_of_formal_or_financial_history
    - history_preservation_uses_archive_cancel_revoke_reverse_correct_or_invalidate
    - sensitive_plaintext_credentials_tokens_pesel_pkk_are_not_written_to_logs_or_safe_projections
  completion:
    module_done_requires:
      - every_preserved_screen_element_accounted_for
      - api_and_use_case_coverage
      - domain_and_database_coverage
      - permission_coverage
      - audit_effects_where_required
      - contract_policy_integration_and_representative_e2e_tests

