module: CalendarTraining
core_traceability_modules:
  - course_enrollment_training
  - calendar
changed_scope:
  - evidence: specs/database/students-courses-training.yml
    requirement: planned TrainingSession mutations preserve optimistic concurrency, verified attendance and atomic terminal completion or cancellation
    domain_data: course_enrollments + training_sessions + training_session_attendance
    api_use_case: training_sessions.list/create/get/update/attendance/complete/cancel
    permission: training_sessions.view/create/edit/cancel with organization assigned_students or instructor-own scope as declared
    ui: DEFERRED_UI_UNTIL_CALENDAR_FEATURE_SLICE
    acceptance_test: Tests\\Feature\\TrainingSessionCoreTest::test_attendance_and_patch_use_training_session_version_and_patch_cannot_change_session_type
    status: IMPLEMENTED
  - evidence: docs/adr/0003-training-hour-ledger.md
    requirement: current-OSK formal credited time is created only from completed present TrainingSession evidence and later changes are append-only corrections or reversals
    domain_data: training_sessions + training_session_attendance + training_hour_ledger_entries + course_enrollment_lifecycle_events
    api_use_case: training_sessions.complete + training_hours.get/correct
    permission: training_sessions.edit + training_hours.correct
    ui: DEFERRED_UI_UNTIL_CALENDAR_FEATURE_SLICE
    acceptance_test: Tests\\Feature\\TrainingSessionCoreTest::test_manual_correction_is_append_only_requires_fresh_course_version_and_preserves_nonnegative_projection
    status: IMPLEMENTED
  - evidence: docs/adr/0008-calendar-resource-conflict-boundary.md
    requirement: pre-GiST scheduling uses one transaction with deterministic advisory locks overlap detection and exact shared claim replacement without pretending the final database exclusion constraint exists
    domain_data: calendar_resource_claims + training_sessions + course_enrollments
    api_use_case: training_sessions.create/update/complete/cancel
    permission: inherited from the authorized TrainingSession command
    ui: NOT_APPLICABLE_RUNTIME_GATE_NO_UI
    acceptance_test: Tests\\Feature\\TrainingSessionCoreTest::test_planned_session_creates_exact_shared_claims_and_rejects_overlap_but_allows_adjacent_interval
    status: IMPLEMENTED
  - evidence: specs/security/permissions.yml
    requirement: training session own scope resolves through the active staff-profile membership link and instructor identity rather than creator identity
    domain_data: staff_membership_links + staff_profiles + training_sessions + course_enrollments
    api_use_case: TrainingSessionScopeAuthorizer collection create and target visibility
    permission: training_sessions.view/create/edit/cancel with own scope
    ui: NOT_APPLICABLE_RUNTIME_GATE_NO_UI
    acceptance_test: Tests\\Feature\\TrainingSessionCoreTest::test_own_scope_is_bound_to_active_staff_profile_and_session_instructor
    status: IMPLEMENTED

  - evidence: docs/50-own-calendar-event-lifecycle.md
    requirement: manual general events use scheduled completed cancelled lifecycle with versioned append-only history and terminal claim release
    domain_data: calendar_events + calendar_event_lifecycle_events + calendar_resource_claims
    api_use_case: calendar.events.list/create/get/update/cancel/complete
    permission: calendar.view plus calendar.manage.organization or canonical instructor-owned calendar.manage.own
    ui: DEFERRED_UNTIL_CALENDAR_UI_GATE
    acceptance_test: Tests\\Feature\\CalendarEventCoreTest::test_terminal_commands_require_if_match_are_idempotent_and_never_credit_training_hours
    status: IMPLEMENTED
  - evidence: specs/database/calendar.yml#DB-CAL-007
    requirement: runtime calendar_events persists only manual general_event facts and rejects a formal driving_lesson copy because TrainingSession is the canonical formal schedule owner
    domain_data: calendar_events + training_sessions + training_session_calendar_details
    api_use_case: calendar.events.create/update rejects driving_lesson row persistence; formal projection routing remains next gate
    permission: calendar manage permission cannot escalate into formal training mutation
    ui: DRIVING_LESSON_OPTION_PRESERVED_FOR_NEXT_FORMAL_ROUTING_GATE
    acceptance_test: Tests\\Feature\\CalendarEventCoreTest::test_general_event_uses_shared_claim_boundary_and_formal_driving_lesson_row_is_rejected
    status: IMPLEMENTED
  - evidence: specs/database/calendar.yml#DB-CAL-007
    requirement: formal driving lessons are practical TrainingSession projections with source-specific identity and no mutable calendar_events copy
    domain_data: training_sessions + course_enrollments + training_session_calendar_details + calendar_resource_claims
    api_use_case: calendar.driving_lessons.create/get + calendar.events.driving_lesson_projection; update cancel complete route through training-sessions commands
    permission: calendar.view for read projection; training_sessions.create/edit/cancel for formal mutations
    ui: DEFERRED_UNTIL_CALENDAR_UI_GATE
    acceptance_test: Tests\\Feature\\CalendarDrivingLessonCoreTest::test_calendar_create_and_list_project_one_practical_training_session_without_calendar_event_copy
    status: IMPLEMENTED
  - evidence: specs/database/calendar.yml#DB-CAL-007-course_context_resolution
    requirement: student-only formal lesson creation resolves a course only when exactly one eligible active CourseEnrollment exists and never chooses latest or first under ambiguity
    domain_data: students + course_enrollments + training_sessions
    api_use_case: calendar.driving_lessons.create
    permission: training_sessions.create
    ui: DEFERRED_UNTIL_CALENDAR_UI_GATE
    acceptance_test: Tests\\Feature\\CalendarDrivingLessonCoreTest::test_student_only_create_requires_exactly_one_active_course
    status: IMPLEMENTED
  - evidence: specs/database/calendar.yml#training_session_calendar_details
    requirement: optional calendar name and custom meeting place remain companion metadata under the same TrainingSession version and cannot coexist with managed location
    domain_data: training_sessions + training_session_calendar_details
    api_use_case: training_sessions.create/update + calendar.driving_lessons.create/get
    permission: training_sessions.create/edit
    ui: DEFERRED_UNTIL_CALENDAR_UI_GATE
    acceptance_test: Tests\\Feature\\CalendarDrivingLessonCoreTest::test_calendar_metadata_patch_uses_training_session_version_and_preserves_meeting_place_xor
    status: IMPLEMENTED
