  - evidence: specs/screens/purchase-history.yml
    requirement: the confirmed purchase-history screen at /historia-zakupow renders one unified paginated order table with the observed columns, multi-item orders, page sizes 10 25 50 100 and Opłać only for unpaid orders
    domain_data: GET /api/v1/purchase-history
    api_use_case: purchase_history.render + purchase_history.pagination
    permission: purchases.view
    ui: resources/js/modules/CommerceDashboard/PurchaseHistoryWorkspace.vue + resources/js/App.vue
    acceptance_test: Tests\\Unit\\PurchaseHistoryUiContractTest::test_purchase_history_renders_confirmed_columns_page_sizes_and_safe_pay_action
    status: IMPLEMENTED
  - evidence: docs/17-history-purchases-screen.md#3-Potwierdzona-akcja-Opłać
    requirement: the UI pay action starts only an idempotent pending payment attempt and never presents browser-local success as payment confirmation
    domain_data: POST /api/v1/orders/{orderId}/payments
    api_use_case: purchase_history.pay_unpaid
    permission: purchases.pay
    ui: resources/js/modules/CommerceDashboard/PurchaseHistoryWorkspace.vue
    acceptance_test: Tests\\Unit\\PurchaseHistoryUiContractTest::test_purchase_history_renders_confirmed_columns_page_sizes_and_safe_pay_action
    status: IMPLEMENTED
  - evidence: specs/api/paths/commerce-dashboard.yaml + specs/database/student-finance-commerce.yml#DB-COM-007
    requirement: generic service entitlements are listed from the canonical same-tenant entitlement and activation authorities and explicit activation is serialized exactly once without treating payment success as activation
    domain_data: service_entitlements + service_activations + idempotency_records + audit_logs + domain_events + outbox_messages
