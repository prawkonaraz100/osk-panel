module: FormalDocuments
core_traceability_modules:
  - course_enrollment_training
  - uploads_assets
  - audit_notifications
changed_scope:
  - evidence: specs/design/formal-training-documents.yml
    requirement: current formal-document preview is derived from canonical course requirement training-ledger and recognized-external-training sources rather than client-supplied facts
    domain_data: students + course_enrollments + training_requirement_profiles + training_hour_ledger_entries + training_sessions + staff_profiles + recognized_external_training
    api_use_case: formal_documents.preview
    permission: formal_documents.view
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_preview_approval_download_and_replay_use_exact_immutable_evidence
    status: IMPLEMENTED
  - evidence: docs/145-formal-training-documents-generation-approval-runtime.md
    requirement: approval verifies current course version requirements revision evidence hash and effective template binding before materializing one canonical artifact and immutable revision
    domain_data: course_enrollments + formal_training_document_templates + formal_training_documents + file_assets + idempotency_records
    api_use_case: formal_documents.approve
    permission: formal_documents.approve
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_approval_rejects_stale_preview_when_evidence_changes_without_course_version_change
    status: IMPLEMENTED
  - evidence: specs/database/formal-training-documents.yml
    requirement: source correction creates a later formal-document revision while prior approved revisions and lifecycle events remain immutable history
    domain_data: formal_training_documents + formal_training_document_events + file_assets
    api_use_case: formal_documents.approve + formal_documents.list
    permission: formal_documents.approve + formal_documents.view
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_source_correction_creates_new_revision_and_preserves_old_document
    status: IMPLEMENTED
  - evidence: docs/145-formal-training-documents-generation-approval-runtime.md
    requirement: document download is tenant scoped and verifies immutable asset metadata hash and stored byte integrity before serving while approval and download emit safe audit and outbox records
    domain_data: formal_training_documents + file_assets + audit_logs + domain_events + outbox_messages
    api_use_case: formal_documents.download
    permission: formal_documents.download
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_cross_tenant_document_routes_fail_closed
    status: IMPLEMENTED
  - evidence: specs/design/formal-training-documents.yml
    requirement: current-source freshness is a reusable read projection and does not create lifecycle side effects merely because evidence became stale
    domain_data: course_enrollments + training_requirement_profiles + training_hour_ledger_entries + recognized_external_training + formal_training_documents
    api_use_case: formal_documents.freshness
    permission: formal_documents.view
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_freshness_projection_detects_source_drift_without_writing_events
    status: IMPLEMENTED
  - evidence: specs/database/formal-training-documents.yml
    requirement: printed signed-scan-attached and electronic-presented delivery facts append lifecycle events without rewriting the canonical document revision
    domain_data: formal_training_documents + formal_training_document_events + file_assets + idempotency_records
    api_use_case: formal_documents.delivery.record + formal_documents.events.list
    permission: formal_documents.deliver + formal_documents.view
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_paper_delivery_events_are_append_only_idempotent_and_asset_bound
    status: IMPLEMENTED
  - evidence: specs/design/formal-training-documents.yml
    requirement: paper-only and electronic-only delivery semantics stay distinct and authenticated approval is not represented as a statutory electronic signature
    domain_data: formal_training_documents.document_mode_snapshot + formal_training_document_events
    api_use_case: formal_documents.delivery.record
    permission: formal_documents.deliver
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Feature\FormalTrainingDocumentRuntimeTest::test_electronic_delivery_rejects_paper_only_events_and_does_not_claim_signature
    status: IMPLEMENTED

  - evidence: specs/screens/student-formal-documents.yml
    requirement: student profile materializes preview freshness exact approval immutable revision history canonical download paper delivery electronic presentation and signed-scan handoff without client-side evidence authority
    domain_data: course_enrollments + formal_training_documents + formal_training_document_events + formal_training_document_templates + file_assets
    api_use_case: formal_documents.preview + formal_documents.list + formal_documents.freshness + formal_documents.approve + formal_documents.download + formal_documents.events.list + formal_documents.delivery.record + uploads.presign + uploads.complete
    permission: formal_documents.view + formal_documents.approve + formal_documents.download + formal_documents.deliver
    ui: resources/js/modules/FormalDocuments/FormalTrainingDocumentsPanel.vue mounted in resources/js/modules/StudentsCourses/StudentCourseWorkspace.vue
    acceptance_test: Tests\Unit\FormalDocumentsUiContractTest::test_student_profile_materializes_exact_formal_document_and_signed_scan_workflow
    status: IMPLEMENTED
