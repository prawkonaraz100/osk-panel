changed_scope:
  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-002
    requirement: learning account binds one global User to a current global auth identifier without inventing a tenant login namespace or hidden identity merge
    domain_data: student_learning_accounts + users + auth_login_identifiers
    api_use_case: learning_accounts.list/create/update
    permission: student_access.view/create/manage_credentials
    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_039_052_login_patch_is_versioned_and_old_global_identifier_is_not_hiddenly_revoked
    status: IMPLEMENTED
  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-003
    requirement: Student archive blocks new operational learning-access effects while preserving learning account assignment inventory and entitlement history
    domain_data: students + student_learning_accounts + license_assignments + license_inventory_entries + license_activations
    api_use_case: learning account and license effect commands
    permission: command-specific student_access.* and licenses.*
    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_001_archive_blocks_new_effects_without_rewriting_access_history
    status: IMPLEMENTED
  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-004
    requirement: OSK-managed password reset uses one global credential epoch and never persists or replays plaintext secret material
    domain_data: users + user_password_management + student_access_handoffs + idempotency_records
    api_use_case: learning_accounts.password_reset
    permission: student_access.reset_password
    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_036_044_045_046_051_053_password_reset_persists_only_hash_and_sanitized_idempotent_replay
    status: IMPLEMENTED
  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-005
    requirement: unactivated revoke preserves historical assignment and restores the same concrete inventory unit exactly once while a current inventory unit cannot have two assignments
