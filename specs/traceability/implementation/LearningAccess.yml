    permission: licenses.view/assign
    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_002_003_020_050_054_revoke_restores_same_unit_and_reassignment_uses_new_contiguous_history
