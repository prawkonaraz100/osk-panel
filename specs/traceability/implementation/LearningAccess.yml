    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_002_003_020_050_054_revoke_restores_same_unit_and_reassignment_uses_new_contiguous_history
    status: IMPLEMENTED
  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-006
    requirement: activation is an immutable entitlement effect with snapshotted duration exact 86400-second days and contiguous stacked periods
    domain_data: license_assignments + license_inventory_entries + license_activations
    api_use_case: license_assignments.activate
    permission: licenses.activate
    ui: pending_confirmed_screen_gate
    acceptance_test: Tests\\Feature\\LearningAccessCoreTest::test_dbt_lic_004_008_027_047_048_activation_is_single_effect_and_stacks_exact_86400_second_segments
