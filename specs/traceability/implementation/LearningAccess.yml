  - evidence: specs/database/licenses-learning-access.yml#DB-LIC-007
    requirement: product language support is capability-driven and assignment language is an immutable snapshot while current account language remains separate
    domain_data: languages + license_product_language_capabilities + student_learning_accounts + license_assignments
