module: UploadsAssets
core_traceability_modules:
  - uploads_assets
  - course_enrollment_training
  - staff_locations_vehicles
changed_scope:
  - evidence: docs/06-api-contract.md
    requirement: uploads use the existing presign direct-object-storage complete flow and become tenant-owned file_assets only after server validation
    domain_data: file_assets + idempotency_records
    api_use_case: uploads.presign + uploads.complete
    permission: active_membership_plus_parent_domain_permission
    ui: SHARED_UPLOAD_TRANSPORT_NO_STANDALONE_UI_REQUIRED
    acceptance_test: Tests\Feature\UploadAssetRuntimeTest::test_staff_photo_upload_is_purpose_bound_hash_verified_and_immutable_after_completion
    status: IMPLEMENTED
  - evidence: specs/database/core-schema.yml
    requirement: uploaded assets are tenant scoped purpose bound size and MIME checked content validated and ready only after verified materialization
    domain_data: file_assets
    api_use_case: uploads.complete
    permission: active_membership_plus_parent_domain_permission
    ui: SHARED_UPLOAD_TRANSPORT_NO_STANDALONE_UI_REQUIRED
    acceptance_test: Tests\Feature\UploadAssetRuntimeTest::test_invalid_content_is_rejected_and_never_becomes_ready
    status: IMPLEMENTED
  - evidence: specs/design/formal-training-documents.yml
    requirement: signed scan upload is bound to a concrete paper formal document and reuses formal_documents.deliver student scope
    domain_data: formal_training_documents + course_enrollments + students + file_assets
    api_use_case: uploads.presign + uploads.complete + formal_documents.delivery.record
    permission: formal_documents.deliver
    ui: DEFERRED_UNTIL_FORMAL_DOCUMENTS_UI_GATE
    acceptance_test: Tests\Feature\UploadAssetRuntimeTest::test_formal_signed_scan_upload_respects_assigned_student_scope_and_attaches_to_paper_document
    status: IMPLEMENTED
  - evidence: docs/147-uploads-assets-runtime.md
    requirement: completion copies verified bytes away from the presigned reservation key so a still-valid old PUT URL cannot mutate the ready asset
    domain_data: file_assets.storage_key + object_storage
    api_use_case: uploads.complete
    permission: active_membership_plus_parent_domain_permission
    ui: SHARED_UPLOAD_TRANSPORT_NO_STANDALONE_UI_REQUIRED
    acceptance_test: Tests\Feature\UploadAssetRuntimeTest::test_staff_photo_upload_is_purpose_bound_hash_verified_and_immutable_after_completion
    status: IMPLEMENTED
